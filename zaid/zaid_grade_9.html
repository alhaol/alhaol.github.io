lost `$3,858.75`!).", "Investment: `10000 × (1.08)³ = $12,597.12` (gained `$2,597.12`!)."]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Interpolation vs. Extrapolation Risk", "content": "Know when predictions break down:", "comparisonTable": {"headers": ["Prediction", "Location", "Reliability Example"], "rows": [["Interpolation", "Inside measured `x` values", "Predicting height at age 13 from ages 5–16 data ✅"], ["Extrapolation", "Far outside measured `x`", "Using ages 5–16 line to predict height at age 50 (would say 10 feet tall! ❌)"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Audit a Misleading Extrapolation or Depreciation Claim", "content": "Spot the flaw:", "keyPoints": ["Claiming a car losing 20%/yr hits `$0` in 5 years is FALSE—exponential depreciation (`0.80⁵ = 32.8%`) slows down and approaches `$0` asymptotically without crossing below `$0`!"]}, {"level": 6, "name": "CREATE", "subtitle": "Design a Smart Teen Car + Savings Budget Plan", "content": "Explain how buying a reliable used car instead of brand-new avoids the steepest 2-year depreciation drop.", "keyPoints": ["Quantify exact dollars saved using `P(1 − r)ᵗ`!"]}], "questions": [{"id": "g9-math-q5", "bloomLevel": 5, "bloomTag": "APPLY & EVALUATE", "title": "MTH1W Data & Financial Literacy Lab: Regression, Appreciation & Depreciation", "prompt": "(a) A scatter plot tracks hours studied (`x = 1` to `6 hrs`) vs. test score (`y`) with Line of Best Fit **`y = 6x + 52`**. Use the equation to predict the score for **`x = 4 hrs`** (state whether this is **Interpolation** or **Extrapolation**), and explain why plugging in `x = 12 hrs` (`y = 124%`!) shows the danger of Extrapolation!\n(b) A brand-new `$25,000` car **depreciates** by **`20%`** per year (`A = P(1 − r)ᵗ`). Calculate its value after **3 years** and total dollars lost.\n(c) Meanwhile, `$5,000` invested in a balanced fund **appreciates** at **`10%`** compounded annually for **3 years**. Find its value and compare the financial lesson!", "step1_deconstruct": {"instruction": "Plug `x=4` and `x=12` into `y=6x+52` in (a), run `(0.80)³` depreciation in (b), and `(1.10)³` appreciation in (c)!", "guidingQuestions": ["Is `x = 4` inside `1..6` (Interpolation) or outside?", "What is `0.80 × 0.80 × 0.80` (`0.512`)?", "What is `5,000 × 1.10³` (`5,000 × 1.331`)?"], "modelPlan": "(a) x=4 → y=76% (Interpolation); x=12 → 124% impossible (Extrapolation breaks down!). (b) 25000(0.80)³ = $12,800 (lost $12,200!). (c) 5000(1.10)³ = $6,655 (+$1,655 gain!)."}, "step2_anchor": {"instruction": "Formulas:", "referenceItems": ["Depreciation (`−20%`): `A = P(0.80)ᵗ` | Appreciation (`+10%`): `A = P(1.10)ᵗ`", "INterpolation = inside range | EXtrapolation = outside range"]}, "step3_substeps": [{"label": "Step 3a: Predict `x = 4 hrs`, label Interpolation/Extrapolation & explain `x = 12`", "placeholder": "At x=4: y = 6(4) + 52 = ...% (...)\nAt x=12: y = ...% which proves...", "hint": "`6(4)+52 = 76%` (**Interpolation** — inside 1..6); `6(12)+52 = 124%` is impossible because test scores cap at `100%`!", "modelSubAnswer": "• At `x = 4 hrs`: `y = 6(4) + 52 = 76%` → **Interpolation** (reliable, inside `1–6 hr` data range).\n• At `x = 12 hrs`: `y = 6(12) + 52 = 124%` → **Extrapolation** fails because real test scores cannot exceed `100%`!"}, {"label": "Step 3b: Calculate the `$25,000` car's depreciated value after 3 yrs (`−20%/yr`) & loss", "placeholder": "A = 25,000 × (0.80)³ = $...\nTotal Lost = $...", "hint": "`0.80³ = 0.512`; `25,000 × 0.512 = $12,800` → lost `$12,200`!", "modelSubAnswer": "• `A = $25,000 × (0.80)³ = $25,000 × 0.512 = $12,800.00`\n• Total Depreciation Lost = `$25,000 − $12,800 = $12,200.00` (nearly half its value in 3 years!)."}, {"label": "Step 3c: Calculate `$5,000` appreciating at `+10%/yr` for 3 yrs + state the budgeting lesson", "placeholder": "A = 5,000 × (1.10)³ = $...\nFinancial lesson: ...", "hint": "`5,000 × 1.331 = $6,655` (`+$1,655`); avoid overspending on fast-depreciating new cars and invest early!", "modelSubAnswer": "• `A = $5,000 × (1.10)³ = $5,000 × 1.331 = $6,655.00` (**+$1,655.00** gained).\n• **Lesson:** Buying a reliable 3-year-old used car avoids the brutal first `$12,200` depreciation drop, freeing money to invest in appreciating assets that compound upward!"}], "step4_checks": ["Did I classify `x = 4` as Interpolation and explain why `124%` exposes Extrapolation limits?", "Did I use `(0.80)³ = 0.512` (NOT subtract `60%`) for depreciation?", "Did I use `(1.10)³ = 1.331` for appreciation?"], "step5_modelAnswer": {"basicAnswer": "76% interpolation, 124% invalid extrapolation. Car $12,800 (lost $12,200). Fund $6,655.", "expandedAnswer": "Part (a): `y = 6(4)+52 = 76%` (Interpolation within `1–6 hrs`); `x = 12` gives an impossible `124%`, illustrating why Extrapolation breaks down past real limits.\nPart (b): `A = 25,000(0.80)³ = $12,800.00` (`$12,200` lost to depreciation).\nPart (c): `A = 5,000(1.10)³ = $6,655.00` (`+$1,655` gained)—proving why minimizing spending on steep-depreciation assets and investing early builds lasting wealth.", "extensionPrompt": "Extension: What happens if a `$1,000` investment compounds **semi-annually** (`2×/yr`) at `8%` annual interest for `3` years? (`i = 0.08/2 = 0.04`, `n = 6` → `1000(1.04)⁶ = $1,265.32`!)"}}]}]}, {"id": "science", "code": "SNC1W (Grade 9 De-Streamed Science)", "name": "Science (SNC1W)", "friendlySub": "Ecology, Bohr Diagrams/Ionic Bonds, Ohm's Law Circuits & Space", "teacher": "Grade 9 SNC1W", "status": "Core High School Credit", "tier": "Tier 2: Core Mastery", "tierClass": "tier-strong", "icon": "🔬", "reportComment": "Complete Ontario 2022 De-Streamed Grade 9 Science (SNC1W — all 5 strands): Sustainable Ecosystems & Biomagnification, Chemistry (Bohr-Rutherford Diagrams, Periodic Table, Ionic vs. Molecular Compounds), Physics Electricity (Static, Ohm's Law V=IR, Series/Parallel & Power), and Space Exploration (Stars & Big Bang).", "nextSteps": ["Master Bohr-Rutherford shell limits (2, 8, 8, 2) and Ionic (metal+non-metal) vs. Molecular (non-metal+non-metal)", "Show GRASS (Given, Required, Analysis, Solve, Statement) + SI units on Ohm's Law (V=I×R) and Electrical Power!", "Distinguish Series vs. Parallel circuit rules for Current (I) and Voltage (V)", "Connect Star Life Cycles and Redshift evidence to the Big Bang Theory"], "units": [{"id": "g9-sci-u1", "title": "Unit 1 (Strand B — Biology): Biogeochemical Cycles, Biomagnification & Carrying Capacity", "studyFirstTag": "Why mercury concentrates 1000× in top predators & how Nitrogen/Carbon cycle!", "curriculumStrand": "Ontario SNC1W Strand B: Sustainable Ecosystems & Climate Change", "svgDiagram": "g9_sci_chem_elec_svg", "lessons": [{"id": "g9-sci-u1-l1", "title": "Lesson 1.1: Carbon/Nitrogen Cycles, Bioaccumulation vs. Biomagnification & Carrying Capacity", "readTime": "3 min read", "bigIdea": "**Bioaccumulation** is toxin buildup inside ONE organism over its lifetime; **Biomagnification** is that toxin multiplying `10×` higher at EVERY step up the food chain—hitting apex predators (eagles, orcas, humans) hardest!", "paragraphs": ["Matter is never destroyed in ecosystems—it recycles through **Biogeochemical Cycles**. You know the **Carbon Cycle** (Photosynthesis absorbs `CO₂`, Cellular Respiration & burning fossil fuels release `CO₂`). In Grade 9 `SNC1W`, add the **Nitrogen Cycle**: air is **78% Nitrogen gas (`N₂`)**, yet plants CANNOT breathe `N₂` directly! Special **nitrogen-fixing bacteria** in soil and legume roots (peas/clover) convert `N₂` into usable **nitrates (`NO₃⁻`)** so plants can build proteins and DNA!", "Never confuse these two exam favourites:\n• **Bioaccumulation:** Fat-soluble toxins (like mercury or PCBs/DDT) build up inside **ONE** individual fish faster than its body can expel them.\n• **Biomagnification:** As a larger predator eats hundreds of smaller contaminated organisms, the toxin **concentrates higher and higher at each trophic level** (Algae `1 ppm` → Minnow `10 ppm` → Pike `100 ppm` → Bald Eagle `1,000 ppm`—causing thin eggshells!).", "Every habitat also has a **Carrying Capacity (`K`)**—the maximum population size an ecosystem can sustain indefinitely without running out of food, water, or shelter (**Limiting Factors**). Protecting **Biodiversity** keeps food webs resilient when climate shifts or invasive species strike!"], "keyTakeaway": "Nitrogen-fixing bacteria unlock air `N₂` into plant nitrates (`NO₃⁻`). **Bioaccumulation** = inside 1 organism; **Biomagnification** = multiplies UP trophic levels!", "deepReadTitle": "🌿 SNC1W Ecology Precision Glossary", "deepReadText": "• Nitrogen Fixation: Soil/root bacteria convert `N₂` gas → ammonia/nitrates (`NO₃⁻`) plants absorb!\n• Denitrifying Bacteria: Return nitrates back to atmospheric `N₂` gas\n• Limiting Factors (Density-Dependent: disease/predators; Density-Independent: wildfire/drought) set Carrying Capacity (`K`)!", "quickCheck": {"question": "Why did DDT pesticide sprayed on marshes nearly wipe out Bald Eagles at the top of the food web, even though water concentrations looked tiny?", "options": ["Eagles drank 100 times more marsh water than fish.", "Biomagnification concentrated fat-soluble DDT higher at every trophic level from plankton → fish → eagles!", "Nitrogen-fixing bacteria converted DDT into oxygen."], "correctIdx": 1, "explanation": "Because DDT does not break down easily, **Biomagnification** multiplied its concentration at every trophic step until top predators suffered fragile eggshells!"}, "videos": [{"id": "NHqEthRCqQ4", "title": "Carbon and Nitrogen Cycles", "channel": "Amoeba Sisters", "why": "Makes nitrogen-fixing bacteria and carbon reservoirs super clear."}, {"id": "srpl5YRw-_U", "title": "Ecology Review: Food Webs & Relationships", "channel": "Amoeba Sisters", "why": "Reinforces trophic levels, limiting factors, and carrying capacity."}]}], "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Recall Nitrogen Cycle, Biomagnification & Carrying Capacity", "content": "Lock in Strand B Biology:", "keyPoints": ["Air = 78% `N₂`; **Nitrogen-fixing bacteria** turn `N₂` into nitrates (`NO₃⁻`) for plant proteins.", "Bioaccumulation (1 organism) vs. Biomagnification (up the food chain) | Carrying Capacity (`K`)."]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Explain Why Energy Flows One-Way While Matter Cycles", "content": "90% of food energy dissipates as heat at every trophic jump (so Earth needs constant sunlight!), whereas carbon and nitrogen atoms recycle endlessly!", "analogy": "♻️ Lego vs. Batteries Analogy: Carbon/Nitrogen atoms are reusable Lego bricks built and rebuilt forever; sunlight is the battery energy constantly powering the builders!", "keyPoints": ["Excess farm fertilizer dumps too many nitrates into lakes → **Eutrophication** algae blooms!"]}, {"level": 3, "name": "APPLY", "subtitle": "Calculate Toxin Biomagnification Across a 4-Step Great Lakes Food Chain", "content": "Watch concentrations explode:", "workedExample": {"prompt": "Algae hold `0.02 ppm` mercury; each step magnifies `10×`: Algae → Minnow → Trout → Osprey.", "steps": ["Minnow = `0.2 ppm` → Trout = `2.0 ppm` → Osprey = **`20.0 ppm`** (`1,000×` higher than algae!)."]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Bioaccumulation vs. Biomagnification", "content": "Never swap these two on a test:", "comparisonTable": {"headers": ["Term", "Scale", "Key Verb"], "rows": [["Bioaccumulation", "Inside **1 single organism** over time", "Builds up in tissues faster than excreted"], ["Biomagnification", "Across **multiple trophic levels**", "Multiplies higher in top predators!"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Evaluate Fertilizer Runoff Trade-Offs (Food vs. Lakes)", "content": "Connect the Nitrogen Cycle to Lake Erie algae blooms:", "keyPoints": ["Synthetic nitrates boost crops, yet runoff triggers algal blooms → bacteria decompose dead algae using up dissolved `O₂` → fish dead zones!"]}, {"level": 6, "name": "CREATE", "subtitle": "Propose 2 Sustainable Farming Practices That Protect Lake Water", "content": "Keep nitrates in soil instead of rivers.", "keyPoints": ["Plant riparian buffer strips along creeks + rotate legume crops (natural nitrogen fixation) + precision fertilizing!"]}], "questions": [{"id": "g9-sci-q1", "bloomLevel": 4, "bloomTag": "ANALYZE & EVALUATE", "title": "SNC1W Biology Lab: Nitrogen Cycle, Biomagnification & Eutrophication", "prompt": "(a) Even though Earth's atmosphere is 78% nitrogen gas (`N₂`), explain WHY plants cannot use it directly and what role **nitrogen-fixing bacteria** play.\n(b) Clearly distinguish **Bioaccumulation** from **Biomagnification** using a 4-level Great Lakes food chain (`Algae → Minnow → Pike → Bald Eagle`) exposed to mercury.\n(c) Explain step-by-step how excess farm nitrogen fertilizer washing into a lake creates an oxygen-starved **dead zone (Eutrophication)**.", "step1_deconstruct": {"instruction": "Explain `N₂ → NO₃⁻` bacteria in (a), distinguish 1-organism vs. trophic-chain toxin rise in (b), and trace the 4-step Eutrophication chain in (c).", "guidingQuestions": ["Why can't plant leaves absorb `N₂` directly?", "Which term applies to 1 Pike vs. the whole Algae→Eagle chain?", "What actually consumes all the dissolved oxygen during an algae bloom (decomposers!)?"], "modelPlan": "(a) N₂ triple bond unusable → soil/legume bacteria fix N₂ into usable nitrates (NO₃⁻) for proteins/DNA. (b) Bioaccumulation = buildup in 1 fish; Biomagnification = concentration multiplies Algae→Minnow→Pike→Eagle. (c) Fertilizer → huge algae bloom → algae die → decomposer bacteria multiply and use up dissolved O₂ → fish suffocate!"}, "step2_anchor": {"instruction": "Strand B Precision:", "referenceItems": ["Nitrogen-fixing bacteria: `N₂ → NO₃⁻` (nitrates)", "Bioaccumulation (1 individual) vs. Biomagnification (up trophic levels)", "Eutrophication: Excess nitrates → Algae bloom → Algae die → Bacteria deplete `O₂`!"]}, "step3_substeps": [{"label": "Step 3a: Explain why plants need **nitrogen-fixing bacteria** despite 78% air `N₂`", "placeholder": "Plants cannot absorb N₂ gas directly because... Nitrogen-fixing bacteria...", "hint": "Mention `N₂` is chemically unreactive for plants; soil/legume root bacteria convert it into usable **nitrates (`NO₃⁻`)** to build proteins & DNA!", "modelSubAnswer": "Atmospheric nitrogen gas (`N₂`) is locked in a strong triple bond that plants cannot break or absorb directly. **Nitrogen-fixing bacteria** in soil and legume roots convert `N₂` into usable **ammonia and nitrates (`NO₃⁻`)**, which plant roots absorb to build essential proteins and DNA!"}, {"label": "Step 3b: Distinguish **Bioaccumulation** vs. **Biomagnification** across the Great Lakes chain", "placeholder": "Bioaccumulation is...\nBiomagnification is... In Algae → Minnow → Pike → Eagle...", "hint": "1 individual fish over its life = Bioaccumulation; multiplying 10× per step up to the Bald Eagle = Biomagnification!", "modelSubAnswer": "• **Bioaccumulation** happens inside ONE organism (e.g., a single Pike storing mercury in its fat faster than it can excrete it).\n• **Biomagnification** occurs across trophic levels: because Minnows eat lots of Algae, Pike eat hundreds of Minnows, and Bald Eagles eat many Pike, mercury concentrates dramatically higher at every step—harming Eagles most severely!"}, {"label": "Step 3c: Trace the 4-step **Eutrophication** chain from fertilizer runoff to a fish dead zone", "placeholder": "1. Excess fertilizer enters lake → 2. ... → 3. ... → 4. ...", "hint": "Key science insight: it's the **decomposer bacteria** breaking down dead algae via cellular respiration that drain all the dissolved `O₂`!", "modelSubAnswer": "1. Excess nitrogen/phosphorus fertilizer washes into the lake.\n2. Surface algae explode into a thick green **algal bloom**, blocking sunlight from underwater plants.\n3. Massive amounts of algae die and sink.\n4. **Decomposer bacteria** feast on dead algae via cellular respiration, consuming almost all dissolved **oxygen (`O₂`)**—creating an oxygen-starved dead zone where fish suffocate!"}], "step4_checks": ["Did I name **nitrogen-fixing bacteria** converting `N₂` to usable **nitrates**?", "Did I cleanly distinguish Bioaccumulation (1 organism) from Biomagnification (up the food chain)?", "Did I identify **decomposer bacteria** draining dissolved `O₂` in Step 3c?"], "step5_modelAnswer": {"basicAnswer": "Bacteria turn N2 to nitrates. Bioaccumulation is 1 fish, biomagnification is up the chain. Algae die and bacteria use oxygen.", "expandedAnswer": "Part (a): Plants cannot use unreactive `N₂` gas directly; nitrogen-fixing bacteria in soil and legume roots convert `N₂` into usable nitrates (`NO₃⁻`) for building proteins and DNA.\nPart (b): **Bioaccumulation** is toxin buildup inside a single organism over time, while **Biomagnification** multiplies toxin concentration across trophic levels (Algae → Minnow → Pike → Bald Eagle), hitting apex predators hardest.\nPart (c): Fertilizer runoff triggers an algal bloom → blocks light & dies → decomposer bacteria rapidly respire breaking down dead algae → dissolved `O₂` crashes, suffocating aquatic life (Eutrophication).", "extensionPrompt": "Extension: Why does planting native trees and grasses along creek edges (riparian buffers) stop Eutrophication before it reaches lakes?"}}]}, {"id": "g9-sci-u2", "title": "Unit 2 (Strand C — Chemistry): Atoms, Bohr-Rutherford Diagrams & Ionic vs. Covalent Bonds", "studyFirstTag": "Count protons/neutrons/electrons, draw any Bohr diagram (2-8-8-2) & predict chemical bonds!", "curriculumStrand": "Ontario SNC1W Strand C: Chemistry — Exploring Matter", "svgDiagram": "g9_sci_chem_elec_svg", "lessons": [{"id": "g9-sci-u2-l1", "title": "Lesson 2.1: Atomic Structure (`p⁺, n⁰, e⁻`), Bohr-Rutherford Diagrams & Periodic Families", "readTime": "3 min read", "bigIdea": "Every neutral atom's **Atomic Number** equals its **Protons (`p⁺`)** and **Electrons (`e⁻`)**, **Neutrons = Mass − Atomic #**, and electrons fill Bohr shells strictly in **`2, 8, 8, 2`** order!", "paragraphs": ["Inside every atom sit three tiny subatomic particles: positive **Protons (`p⁺`)** and neutral **Neutrons (`n⁰`)** packed in the dense **Nucleus**, surrounded by lightning-fast negative **Electrons (`e⁻`)** orbiting in shells. Read any Periodic Table box cleanly:\n• **Protons (`p⁺`)** = Atomic Number (defines the element!)\n• **Electrons (`e⁻`)** = Protons (in a neutral atom)\n• **Neutrons (`n⁰`)** = Rounded Atomic Mass − Atomic Number (e.g., Sodium `Na`: Atomic #11, Mass 23 → `11 p⁺`, `12 n⁰`, `11 e⁻`!).", "To draw a **Bohr-Rutherford Diagram** for the first 20 elements, write `p⁺` and `n⁰` inside the central nucleus, then fill electron rings from inside out using the magic capacity rule **`2, 8, 8, 2`**! For Sodium (`11 e⁻`): Shell 1 = `2`, Shell 2 = `8`, Shell 3 = `1` **Valence Electron** (outermost ring!).", "The Periodic Table is a genius map of Bohr diagrams! **Row (Period) = Number of Electron Shells**; **Column (Group) = Valence Electrons** (which control reactivity!): **Group 1 Alkali Metals** (1 valence `e⁻` → explosively reactive!), **Group 17 Halogens** (7 valence `e⁻` → super reactive non-metals!), and **Group 18 Noble Gases** (full outer shell of 2 or 8 → super stable & unreactive!)."], "keyTakeaway": "`p⁺ = Atomic #`, `n⁰ = Mass − Atomic #`, Shells = **`2, 8, 8, 2`**. **Period (Row) = # Shells**; **Group (Column) = Valence Electrons** (full shell = stable Noble Gas!).", "deepReadTitle": "⚛️ Quick Bohr-Rutherford & Periodic Family Map", "deepReadText": "• Oxygen (`O`, #8, Mass 16): `8p⁺, 8n⁰` | Shells: `2, 6` (6 valence e⁻ — Period 2, Group 16)\n• Chlorine (`Cl`, #17, Mass 35): `17p⁺, 18n⁰` | Shells: `2, 8, 7` (7 valence e⁻ — Halogen!)\n• Calcium (`Ca`, #20, Mass 40): `20p⁺, 20n⁰` | Shells: `2, 8, 8, 2` (2 valence e⁻ — Alkaline Earth Metal!)", "quickCheck": {"question": "Magnesium (`Mg`) has Atomic Number `12` and rounded Atomic Mass `24`. What are its neutrons AND its Bohr electron shell arrangement?", "options": ["24 neutrons; shells 2, 10", "12 neutrons; shells 2, 8, 2 (2 valence electrons!)", "36 neutrons; shells 4, 8"], "correctIdx": 1, "explanation": "`n⁰ = 24 − 12 = 12 neutrons`. Shell 1 holds max `2`, Shell 2 holds max `8`, leaving `2` valence electrons in Shell 3 → **`2, 8, 2`**!"}, "videos": [{"id": "Q71vwWYE1_0", "title": "How to Draw a Bohr Diagram in 2 Minutes", "channel": "The Science Classroom", "why": "Super-clean step-by-step guide to the 2-8-8-2 rule."}, {"id": "FPk2ziB9iX0", "title": "Valence Electrons and the Periodic Table", "channel": "The Organic Chemistry Tutor", "why": "Connects Periodic Groups directly to valence electrons and stability."}]}, {"id": "g9-sci-u2-l2", "title": "Lesson 2.2: Ionic vs. Molecular (Covalent) Compounds — Transfer vs. Sharing!", "readTime": "3 min read", "bigIdea": "Atoms bond to achieve a **full outer shell** (Octet Rule)! **Ionic Bonds** (`Metal + Non-Metal`) **TRANSFER** electrons; **Molecular/Covalent Bonds** (`Non-Metal + Non-Metal`) **SHARE** electrons!", "paragraphs": ["Why does explosive Sodium metal (`Na`, shells `2, 8, 1`) combine eagerly with poisonous Chlorine gas (`Cl`, shells `2, 8, 7`) to make harmless table salt (`NaCl`)? Both desperately want a **full outer shell of 8**! Sodium **GIVES AWAY** its 1 lonely outer electron to become a positive ion **`Na⁺`** (shells `2, 8`), and Chlorine **ACCEPTS** it to become a negative ion **`Cl⁻`** (shells `2, 8, 8`). Opposite charges attract strongly—forming an **Ionic Bond**!", "What if TWO **Non-Metals** meet—like Hydrogen + Oxygen (`H₂O`) or Carbon + Oxygen (`CO₂`)? Neither wants to give electrons away, so they **SHARE** pairs of valence electrons, forming a **Molecular (Covalent) Compound**!", "Spot the difference in physical properties on ANY `SNC1W` lab test:\n• **Ionic Compounds** (`NaCl, MgO` — Metal + Non-Metal): Hard crystalline solids, VERY high melting points, and **conduct electricity when dissolved in water** (free-moving ions!).\n• **Molecular Compounds** (`H₂O, CO₂, sugar C₆H₁₂O₆` — Non-Metal + Non-Metal): Often gases/liquids/soft solids, low melting points, and **do NOT conduct electricity** in water!"], "keyTakeaway": "**Ionic** = Metal + Non-Metal (**TRANSFER** e⁻ → ions, high MP, conducts in water!). **Molecular/Covalent** = Non-Metal + Non-Metal (**SHARE** e⁻ → low MP, non-conductor!).", "deepReadTitle": "🧪 Standard Gas Tests (SNC1W Lab Classics!)", "deepReadText": "• Hydrogen (`H₂`): Burning splint makes a loud **'POP!'** sound!\n• Oxygen (`O₂`): Glowing wooden splint **re-ignites** into flame!\n• Carbon Dioxide (`CO₂`): Burning splint **goes out** (or turns clear limewater milky white!)", "quickCheck": {"question": "A mystery white solid melts at `801°C` and makes distilled water conduct electricity strongly when dissolved. What type of compound is it?", "options": ["A Molecular (Covalent) compound like sugar.", "An Ionic compound (Metal + Non-Metal, like NaCl) that releases mobile ions in water!", "A Noble Gas."], "correctIdx": 1, "explanation": "Very high melting point + electrical conductivity when dissolved in water are the signature fingerprints of an **Ionic Compound**!"}, "videos": [{"id": "zpaHPXVR8WU", "title": "What Are Ionic Bonds? (Properties of Matter)", "channel": "FuseSchool - Global Education", "why": "Visualizes electron transfer between metals and non-metals."}, {"id": "h24UmH38_LI", "title": "What Are Covalent Bonds? (Properties of Matter)", "channel": "FuseSchool - Global Education", "why": "Visualizes electron sharing in H₂O and CO₂."}]}, {"id": "g9-sci-u2-l3", "title": "Lesson 2.3: WHMIS 2015 Safety, Chemical Changes & Naming Ionic vs. Molecular Compounds", "readTime": "3 min read", "bigIdea": "**Ionic naming** (`Metal + Non-Metal-ide`) uses **NO prefixes** (`MgCl₂ = Magnesium chloride`), whereas **Molecular naming** (`Non-Metal + Non-Metal`) ALWAYS uses **Greek prefixes** (`CO₂ = Carbon dioxide`, `N₂O₄ = Dinitrogen tetroxide`)!", "paragraphs": ["Before touching any Grade 9 `SNC1W` chemistry lab, master **WHMIS 2015** (Workplace Hazardous Materials Information System): red-bordered diamond **pictograms** warn of *Flame* (Flammable), *Skull & Crossbones* (Acute Toxicity), *Corrosion* (burns skin/metal), *Exclamation Mark* (irritant), and *Compressed Gas*! Also spot the **5 Clues of a Chemical Change** (new substance formed!): unexpected colour change, gas bubbles/odour, precipitate solid forming, light/heat released, and hard to reverse!", "Now master **IUPAC Chemical Naming**—the #1 Grade 9 Chemistry quiz skill! First check the Periodic Table staircase (`Metals` left, `Non-Metals` right):\n1. **Ionic (`Metal + Non-Metal`):** Name the Metal + Non-Metal ending in **`-ide`** — **ZERO prefixes (`di/tri`)!** Example: `NaCl` = **Sodium chloride**, `MgCl₂` = **Magnesium chloride**, `Al₂O₃` = **Aluminum oxide**! To write ionic formulas fast, use the **Cross-Over Rule** (`Mg²⁺` + `Cl⁻` → swap charges to subscripts → **`MgCl₂`**!).\n2. **Molecular (`Non-Metal + Non-Metal`):** Use **Greek Prefixes** (`1=mono, 2=di, 3=tri, 4=tetra, 5=penta`) + **`-ide`**! (Just drop `mono-` on the *first* element!). Example: `CO` = **Carbon monoxide**, `CO₂` = **Carbon dioxide**, `SF₆` = **Sulfur hexafluoride**!"], "keyTakeaway": "**Ionic (Metal+Non-Metal)** = NO prefixes (`MgCl₂` = *Magnesium chloride*, use Cross-Over Rule!). **Molecular (Non-Metal+Non-Metal)** = Greek prefixes `mono/di/tri/tetra/penta` (`CO₂` = *Carbon dioxide*)!", "deepReadTitle": "🧪 Greek Prefixes & Cross-Over Formula Sheet", "deepReadText": "• Prefixes (Molecular ONLY!): 1=mono (2nd element only!), 2=di, 3=tri, 4=tetra, 5=penta, 6=hexa\n• Ionic Cross-Over: `Al³⁺` + `O²⁻` → cross numbers → `Al₂O₃` (Aluminum oxide — reduce `Mg²⁺ + O²⁻ → Mg₂O₂ → MgO`!)\n• 5 Chemical Change Clues: Gas/bubbles • New colour • Precipitate • Heat/light • Hard to reverse!", "quickCheck": {"question": "Which pair names **`CaCl₂`** (Ionic) AND **`P₂O₅`** (Molecular) with 100% IUPAC accuracy?", "options": ["Calcium dichloride and Phosphorus oxide", "Calcium chloride (no prefix — Ionic!) and Diphosphorus pentoxide (prefixes — Molecular!)", "Monocalcium dichloride and Diphosphorus pentoxide"], "correctIdx": 1, "explanation": "`Ca` is a Metal → **Ionic** (NEVER use prefixes → *Calcium chloride*)! Both `P` and `O` are Non-Metals → **Molecular** (use Greek prefixes → *Diphosphorus pentoxide*)!"}, "videos": [{"id": "SefU59z5EX4", "title": "WHMIS 2015 Pictograms and Symbols", "channel": "OnlineWHMIS.ca", "why": "Canadian WHMIS 2015 lab safety guide tested in Week 1 of SNC1W."}, {"id": "5rSgduXqhhU", "title": "How to Name Ionic Compounds", "channel": "The Organic Chemistry Tutor", "why": "Clean rules for naming metal + non-metal ionic compounds."}, {"id": "3agUL7-ezXk", "title": "How to Name Covalent (Molecular) Compounds", "channel": "The Organic Chemistry Tutor", "why": "Locks in Greek prefixes (mono/di/tri/tetra/penta) cleanly."}]}], "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Recall Subatomic Particles, 2-8-8-2 Shells & Ionic vs. Molecular", "content": "Lock in SNC1W Chemistry:", "keyPoints": ["`p⁺ = Atomic #`, `n⁰ = Mass − Atomic #`, Shells = `2, 8, 8, 2`.", "Ionic = Metal + Non-Metal (transfer e⁻) | Molecular = Non-Metal + Non-Metal (share e⁻)."]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Explain Why Losing an Electron Makes a POSITIVE Ion (`Na⁺`)", "content": "Because electrons carry a **NEGATIVE (`−1`)** charge, losing 1 negative leaves an extra positive proton (`11p⁺ − 10e⁻ = +1`)!", "analogy": "💰 Debt Analogy: Giving away a `$1` bill of debt makes you `$1` richer (`+1`)—losing a negative electron makes an atom a POSITIVE cation!", "keyPoints": ["Metals LOSE e⁻ → Positive Cations (`Na⁺, Mg²⁺`) | Non-Metals GAIN e⁻ → Negative Anions (`Cl⁻, O²⁻`)."]}, {"level": 3, "name": "APPLY", "subtitle": "Predict Ion Charges & Formula from Bohr Shells (`Mg` + `Cl`)", "content": "Balance total transferred electrons:", "workedExample": {"prompt": "How do Magnesium (`2, 8, 2`) and Chlorine (`2, 8, 7`) form an ionic compound?", "steps": ["`Mg` wants to lose **2** e⁻ → `Mg²⁺`. Each `Cl` only needs **1** e⁻ → `Cl⁻`.", "So ONE `Mg` gives 1 e⁻ to TWO different `Cl` atoms → **`MgCl₂`**!"]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Ionic vs. Molecular Compounds Side-by-Side", "content": "Ace every Grade 9 Chemistry quiz:", "comparisonTable": {"headers": ["Property", "Ionic (`NaCl`, `MgO`)", "Molecular (`H₂O`, `CO₂`, Sugar)"], "rows": [["Elements", "Metal + Non-Metal", "Non-Metal + Non-Metal"], ["Electrons", "TRANSFERRED (forms ions)", "SHARED (molecules)"], ["Melting Point", "Very High (crystalline)", "Low (often gas/liquid/soft solid)"], ["Conducts in Water?", "✅ YES (mobile ions!)", "❌ NO (neutral molecules!)"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Debug 2 Classic Grade 9 Chemistry Errors", "content": "Catch these before your lab quiz:", "keyPoints": ["1. Putting 9 electrons in Shell 2 (max is `8`!). 2. Calling Carbon Dioxide (`CO₂`) ionic (Carbon & Oxygen are BOTH non-metals → **Molecular**!)."]}, {"level": 6, "name": "CREATE", "subtitle": "Identify 3 Unknown Gases Using SNC1W Splint Tests", "content": "Match Glowing Splint Re-lights (`O₂`), Flaming Splint Pops (`H₂`), and Splint Extinguishes/Milky Limewater (`CO₂`).", "keyPoints": ["Classic Ontario Grade 9 lab exam station!"]}], "questions": [{"id": "g9-sci-q2", "bloomLevel": 4, "bloomTag": "APPLY & ANALYZE", "title": "SNC1W Chemistry Lab: Bohr-Rutherford, Periodic Families & Ionic vs. Covalent", "prompt": "(a) **Potassium (`K`)** has Atomic # `19` and Atomic Mass `39`; **Fluorine (`F`)** has Atomic # `9` and Mass `19`. Find `p⁺, n⁰, e⁻` AND the exact **Bohr-Rutherford shell electron counts** (`2, 8, ...`) for BOTH atoms.\n(b) Name the **Periodic Table Family** for Potassium (Group 1) and Fluorine (Group 17), explain why BOTH are super reactive, and explain how they bond into **Potassium Fluoride (`KF`)**.\n(c) Classify **`KF`** vs. **`CO₂`** as **Ionic** or **Molecular**, and predict which one will conduct electricity when dissolved in water (and WHY!).", "step1_deconstruct": {"instruction": "Calculate `p⁺, n⁰, e⁻` + `2, 8, 8, 2` shells in (a), link Group 1/17 valence electrons to transfer in (b), and compare Ionic vs. Molecular properties in (c)!", "guidingQuestions": ["What is `39 − 19` (`20 n⁰`) and `19 − 9` (`10 n⁰`)?", "How many valence electrons do `K` (`2,8,8,1`) and `F` (`2,7`) each have?", "Does `KF` transfer electrons (Metal+Non-Metal) or share them?"], "modelPlan": "(a) K: 19p⁺, 20n⁰, 19e⁻ → 2,8,8,1; F: 9p⁺, 10n⁰, 9e⁻ → 2,7. (b) Alkali Metal (1 val e⁻) + Halogen (7 val e⁻) → K transfers 1 e⁻ to F forming K⁺ and F⁻ (full octets!). (c) KF = Ionic (conducts in water via mobile ions); CO₂ = Molecular (shared non-metals, non-conductor)."}, "step2_anchor": {"instruction": "Chemistry Anchors:", "referenceItems": ["`n⁰ = Mass − Atomic #` | Shells = `2, 8, 8, 2`", "Group 1 = Alkali Metals (1 val e⁻) | Group 17 = Halogens (7 val e⁻) | Group 18 = Noble Gases (full!)"]}, "step3_substeps": [{"label": "Step 3a: Find `p⁺, n⁰, e⁻` and Bohr shells for Potassium (`K`, 19/39) & Fluorine (`F`, 9/19)", "placeholder": "K: ...p⁺, ...n⁰, ...e⁻ | Shells: ...\nF: ...p⁺, ...n⁰, ...e⁻ | Shells: ...", "hint": "`K`: `19p⁺, 20n⁰, 19e⁻` → `2, 8, 8, 1`! `F`: `9p⁺, 10n⁰, 9e⁻` → `2, 7`!", "modelSubAnswer": "• **Potassium (`K`):** `19 p⁺`, `20 n⁰` (`39−19`), `19 e⁻` → Bohr Shells: **`2, 8, 8, 1`** (1 valence e⁻).\n• **Fluorine (`F`):** `9 p⁺`, `10 n⁰` (`19−9`), `9 e⁻` → Bohr Shells: **`2, 7`** (7 valence e⁻)."}, {"label": "Step 3b: Name both Periodic Families & explain how `K` and `F` bond into `KF`", "placeholder": "K Family: ... | F Family: ...\nBonding: K transfers...", "hint": "Alkali Metal (`K`, 1 val e⁻) + Halogen (`F`, 7 val e⁻) → `K` transfers its 1 outer electron to `F`, giving both stable full shells (`K⁺` & `F⁻`)!", "modelSubAnswer": "• `K` is an **Alkali Metal** (Group 1, 1 valence e⁻); `F` is a **Halogen** (Group 17, 7 valence e⁻). Both are only 1 electron away from a stable full outer shell!\n• `K` **transfers** its 1 valence electron to `F`, forming a positive **`K⁺`** ion (`2, 8, 8`) and negative **`F⁻`** ion (`2, 8`), which attract tightly in an **Ionic Bond (`KF`)**!"}, {"label": "Step 3c: Classify `KF` vs. `CO₂` & predict electrical conductivity in water", "placeholder": "KF = ... | CO₂ = ...\nConducts in water: ... because...", "hint": "`KF` = Metal + Non-Metal (Ionic → splits into free-moving charged ions in water!); `CO₂` = Non-Metal + Non-Metal (Molecular → neutral molecules)!", "modelSubAnswer": "• **`KF` = Ionic Compound** (Metal `K` + Non-Metal `F`) → **Conducts electricity** when dissolved in water because it breaks apart into free-moving charged `K⁺` and `F⁻` ions.\n• **`CO₂` = Molecular (Covalent) Compound** (Non-Metal `C` + Non-Metal `O`, shared electrons) → Does **NOT** conduct electricity."}], "step4_checks": ["Did I get `K = 2, 8, 8, 1` (`20 n⁰`) and `F = 2, 7` (`10 n⁰`)?", "Did I explain electron **transfer** producing `K⁺` and `F⁻` full shells?", "Did I explain WHY dissolved `KF` conducts (mobile charged ions)?"], "step5_modelAnswer": {"basicAnswer": "K: 19p,20n, 2-8-8-1 (Alkali). F: 9p,10n, 2-7 (Halogen). K gives 1 e- to F. KF is ionic and conducts; CO2 is molecular.", "expandedAnswer": "Part (a): `K` = `19p⁺, 20n⁰, 19e⁻` (shells `2, 8, 8, 1`); `F` = `9p⁺, 10n⁰, 9e⁻` (shells `2, 7`).\nPart (b): `K` (Group 1 Alkali Metal) and `F` (Group 17 Halogen) are each 1 electron from a full octet; `K` transfers 1 electron to `F` forming oppositely charged `K⁺` and `F⁻` ions.\nPart (c): `KF` is **Ionic** (high MP, conducts electricity in water due to mobile ions), whereas `CO₂` is **Molecular/Covalent** (two non-metals sharing electrons, does not conduct).", "extensionPrompt": "Extension: Why do Group 18 Noble Gases like Neon (`2, 8`) and Argon (`2, 8, 8`) almost never form chemical bonds?"}}, {"id": "g9-sci-q6", "bloomLevel": 4, "bloomTag": "APPLY & ANALYZE", "title": "SNC1W Chemistry & Space Lab: IUPAC Naming, WHMIS & Earth's `23.5°` Seasons", "prompt": "(a) **IUPAC Naming:** Name ALL FOUR compounds (watch Ionic = NO prefixes vs. Molecular = Greek prefixes!): `Na₂O`, `AlCl₃`, `N₂O₄`, `SF₆`.\n(b) **Cross-Over Formulas & WHMIS:** Use the Ionic Cross-Over Rule to write the exact formula for **Magnesium nitride** (`Mg²⁺` and `N³⁻`), and identify what the **Corrosion** vs. **Skull & Crossbones** WHMIS 2015 pictograms warn against.\n(c) **Seasons & Eclipses:** Explain why Ottawa freezes in January even though Earth is slightly *closer* to the Sun than in July, and contrast the exact `Sun–Earth–Moon` order of a **Solar Eclipse** vs. a **Lunar Eclipse**!", "step1_deconstruct": {"instruction": "Check Metal vs. Non-Metal FIRST in (a), swap `2+` and `3-` cleanly in (b), and explain `23.5°` tilt + `S-M-E` vs. `S-E-M` in (c)!", "guidingQuestions": ["Which 2 compounds in (a) start with a Metal (Ionic, NO prefixes!)?", "What formula results from crossing `Mg²⁺` and `N³⁻` (`Mg₃N₂`)?", "Which eclipse happens at New Moon vs. Full Moon?"], "modelPlan": "(a) Na₂O = Sodium oxide (Ionic), AlCl₃ = Aluminum chloride (Ionic), N₂O₄ = Dinitrogen tetroxide (Molecular), SF₆ = Sulfur hexafluoride (Molecular). (b) Mg₃N₂; Corrosion = burns skin/eyes & eats metal, Skull = acute fatal toxicity. (c) 23.5° axial tilt aims North away in Jan (shallow spread-out rays + short days); Solar = S-M-E (New Moon), Lunar = S-E-M (Full Moon)."}, "step2_anchor": {"instruction": "Rules:", "referenceItems": ["Ionic (`M + NM`): NO prefixes! | Molecular (`NM + NM`): `mono, di, tri, tetra, penta, hexa`", "Solar = `S-M-E` (New Moon) | Lunar = `S-E-M` (Full Moon)"]}, "step3_substeps": [{"label": "Step 3a: Name `Na₂O`, `AlCl₃`, `N₂O₄`, and `SF₆` with 100% IUPAC precision", "placeholder": "Na₂O = ... (Ionic/Mol)\nAlCl₃ = ...\nN₂O₄ = ...\nSF₆ = ...", "hint": "`Na` and `Al` are METALS (NO prefixes!); `N/O` and `S/F` are NON-METALS (Greek prefixes!)!", "modelSubAnswer": "• `Na₂O` (Ionic) = **Sodium oxide** (NOT disodium!)\n• `AlCl₃` (Ionic) = **Aluminum chloride** (NOT trichloride!)\n• `N₂O₄` (Molecular) = **Dinitrogen tetroxide**\n• `SF₆` (Molecular) = **Sulfur hexafluoride**"}, {"label": "Step 3b: Write the formula for **Magnesium nitride** (`Mg²⁺, N³⁻`) + decode 2 WHMIS 2015 symbols", "placeholder": "Formula: Mg_N_\nCorrosion warns of...\nSkull & Crossbones warns of...", "hint": "Swap charges (`2` and `3`) → **`Mg₃N₂`**!", "modelSubAnswer": "• **Cross-Over Formula:** `Mg²⁺` + `N³⁻` → **`Mg₃N₂`** (3 Mg give 6e⁻; 2 N take 6e⁻ ✅!)\n• **Corrosion (test tubes dripping on hand/metal):** Can severely burn skin/eyes and eat through metals.\n• **Skull & Crossbones:** Acute toxicity — even small exposure can be immediately fatal!"}, {"label": "Step 3c: Explain Ottawa's January winter (`23.5°` tilt) AND contrast Solar vs. Lunar Eclipses", "placeholder": "Seasons: Earth's 23.5° tilt...\nSolar Eclipse: ... | Lunar Eclipse: ...", "hint": "Tilt away in Jan = shallow angled rays spread over wider area + fewer daylight hours; Solar = `S-M-E` (New Moon), Lunar = `S-E-M` (Full Moon)!", "modelSubAnswer": "• **Seasons:** In January, Earth's **`23.5°` axial tilt** points the Northern Hemisphere *away* from the Sun—sunlight strikes Ottawa at a shallow, spread-out angle with under 9 hours of daylight, making it freezing despite slightly closer orbital distance.\n• **Solar Eclipse (`Sun – Moon – Earth`):** Occurs at **New Moon** (Moon casts shadow onto Earth).\n• **Lunar Eclipse (`Sun – Earth – Moon`):** Occurs at **Full Moon** (Earth casts shadow across Moon)."}], "step4_checks": ["Did I omit Greek prefixes on Ionic `Sodium oxide` & `Aluminum chloride` and use them on `Dinitrogen tetroxide` & `Sulfur hexafluoride`?", "Did I write **`Mg₃N₂`** cleanly via the Cross-Over Rule?", "Did I clearly connect `23.5°` tilt (sunlight angle + daylight length) AND `S-M-E` vs. `S-E-M`?"], "step5_modelAnswer": {"basicAnswer": "Sodium oxide, Aluminum chloride, Dinitrogen tetroxide, Sulfur hexafluoride. Mg3N2. 23.5° tilt causes seasons; S-M-E Solar, S-E-M Lunar.", "expandedAnswer": "Part (a): `Na₂O` = Sodium oxide (Ionic); `AlCl₃` = Aluminum chloride (Ionic); `N₂O₄` = Dinitrogen tetroxide (Molecular); `SF₆` = Sulfur hexafluoride (Molecular).\nPart (b): Cross-Over gives **`Mg₃N₂`**; WHMIS Corrosion warns of severe skin/eye/metal burns while Skull & Crossbones warns of acute fatal toxicity.\nPart (c): Earth's **`23.5°` axial tilt** angles the Northern Hemisphere away from the Sun in January (shallow spread-out rays + short days). Solar Eclipse = `S–M–E` (New Moon); Lunar Eclipse = `S–E–M` (Full Moon).", "extensionPrompt": "Extension: Why don't Solar and Lunar Eclipses happen every single month? Because the Moon's orbit is tilted `~5°` relative to Earth's orbit around the Sun!"}}]}, {"id": "g9-sci-u3", "title": "Unit 3 (Strand D — Physics): Static Electricity, Ohm's Law (`V = IR`) & Circuits", "studyFirstTag": "Master Ohm's Law (`V = I × R`), Series vs. Parallel current/voltage rules & Static charge!", "curriculumStrand": "Ontario SNC1W Strand D: Physics — Principles & Applications of Electricity", "svgDiagram": "g9_sci_chem_elec_svg", "lessons": [{"id": "g9-sci-u3-l1", "title": "Lesson 3.1: Static Charge, Ohm's Law (`V = I × R`) & Series vs. Parallel Circuits", "readTime": "3 min read", "bigIdea": "In EVERY electric circuit, **ONLY negative electrons move**! **Ohm's Law** links Voltage, Current, and Resistance via **`V = I × R`**—and **Series** (1 path) vs. **Parallel** (multiple branches) obey opposite rules!", "paragraphs": ["First, Static Electricity: **Protons NEVER move**—objects become charged ONLY by gaining electrons (`−`) or losing electrons (`+`). Three charging methods: **Friction** (rubbing a balloon on hair—check the Electrostatic Series to see which grabs electrons!), **Contact** (touching transfers the SAME charge), and **Induction** (bringing a charged rod *near* a neutral wall pushes electrons away without touching!).", "In Current Electricity, remember the 3 quantities & SI units: **Voltage / Potential Difference `V`** (energy push per coulomb, in **Volts `V`**, measured in *parallel* with a Voltmeter), **Current `I`** (flow rate of electrons, in **Amperes `A`**, measured in *series* with an Ammeter), and **Resistance `R`** (opposition to flow, in **Ohms `Ω`**). **Ohm's Law:** **`V = I × R`** (so `I = V ÷ R` and `R = V ÷ I`!).", "Now nail **Series vs. Parallel Circuits** (the #1 `SNC1W` physics test topic!):\n• **Series Circuit (1 single loop):** Current `I` is **IDENTICAL everywhere** (`I_T = I₁ = I₂`), while Voltage **SPLITS** across loads (`V_T = V₁ + V₂`). Unscrew 1 bulb → ALL go out!\n• **Parallel Circuit (multiple branches — like your house!):** Voltage `V` is **IDENTICAL across every branch** (`V_T = V₁ = V₂`), while Current **SPLITS** (`I_T = I₁ + I₂`). Unscrew 1 bulb → the other branches stay bright!"], "keyTakeaway": "**Ohm's Law: `V = I × R`** (`Volts = Amps × Ohms`). **Series** = SAME `I`, Voltage splits (`V_T = V₁ + V₂`). **Parallel** = SAME `V`, Current splits (`I_T = I₁ + I₂`)!", "deepReadTitle": "⚡ Series vs. Parallel Quick Circuit Card", "deepReadText": "• Ohm's Triangle: `V = I × R`  |  `I = V ÷ R`  |  `R = V ÷ I`\n• Series (1 path): `I_total = I₁ = I₂`  |  `V_total = V₁ + V₂`  |  `R_total = R₁ + R₂`\n• Parallel (branches): `V_total = V₁ = V₂`  |  `I_total = I₁ + I₂` (Adding branches LOWERS total resistance & raises total current!)", "quickCheck": {"question": "A `12 V` battery powers a `4 Ω` resistor (`V = I × R`). What is the Current (`I`), AND why are house lights wired in **Parallel** instead of Series?", "options": ["48 A; Series makes lights too bright.", "3 A (`I = 12 ÷ 4`); Parallel gives every outlet full voltage AND lets you turn off 1 lamp without killing the whole house!", "0.33 A; Parallel saves copper wire."], "correctIdx": 1, "explanation": "`I = V ÷ R = 12 V ÷ 4 Ω = 3 A`! Parallel wiring ensures every room gets full `120 V` independently!"}, "videos": [{"id": "Vrh5FeGUTJA", "title": "Static Charge (Physics — FuseSchool)", "channel": "FuseSchool - Global Education", "why": "Explains friction, electron movement, and attraction/repulsion visually."}, {"id": "_rSHqvjDksg", "title": "Ohm's Law Explained (V = IR)", "channel": "The Organic Chemistry Tutor", "why": "Walks cleanly through V, I, and R calculations with GRASS steps."}, {"id": "dEuBykX5_B4", "title": "Resistors in Series and Parallel Circuits", "channel": "The Organic Chemistry Tutor", "why": "Locks in Series vs. Parallel current and voltage rules."}]}], "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Recall Ohm's Law, SI Units & Series/Parallel Rules", "content": "Lock in Strand D Electricity:", "keyPoints": ["`V` (Volts) = `I` (Amps) × `R` (Ohms `Ω`) | Ammeter = Series; Voltmeter = Parallel.", "Series: Same `I`, `V` splits | Parallel: Same `V`, `I` splits."]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Explain Why Adding More Parallel Appliances Trips a Circuit Breaker", "content": "Every new parallel branch opens an extra highway lane for electrons—so total current `I_T = I₁ + I₂ + I₃` surges!", "analogy": "🛣️ Tollbooth Analogy: Opening more parallel toll lanes lowers resistance so MORE total cars (current) rush down the main entry ramp—until the breaker trips to prevent an overheating fire!", "keyPoints": ["Fuses and circuit breakers are wired in **SERIES** with the main line so they cut power to the entire overloaded branch!"]}, {"level": 3, "name": "APPLY", "subtitle": "Solve a 2-Branch Parallel Circuit with Ohm's Law", "content": "Use GRASS (Given, Required, Analysis, Solve, Statement):", "workedExample": {"prompt": "A `12 V` battery powers two parallel bulbs (`R₁ = 6 Ω`, `R₂ = 4 Ω`). Find `I₁`, `I₂`, and `I_total`:", "steps": ["Parallel → BOTH get `12 V`!", "Branch 1: `I₁ = 12 ÷ 6 = 2 A` | Branch 2: `I₂ = 12 ÷ 4 = 3 A`.", "Total Current: `I_total = 2 A + 3 A = 5 A`!"]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Series vs. Parallel Circuits Side-by-Side", "content": "Master every contrast:", "comparisonTable": {"headers": ["Property", "Series Circuit (1 Loop)", "Parallel Circuit (Branches)"], "rows": [["Current (`I`)", "SAME everywhere (`I_T = I₁ = I₂`)", "SPLITS (`I_T = I₁ + I₂`)"], ["Voltage (`V`)", "SPLITS (`V_T = V₁ + V₂`)", "SAME on each branch (`V_T = V₁ = V₂`)"], ["One Bulb Breaks?", "ALL bulbs go dark", "Other branches stay lit!"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Catch Classic Ohm's Law & Static Charge Traps", "content": "Avoid these two marks-killers:", "keyPoints": ["❌ Saying 'protons moved to charge the balloon' → ✅ ONLY **electrons** move!", "❌ Using `mA` directly in `V = I × R` → ✅ Convert `500 mA = 0.5 A` first!"]}, {"level": 6, "name": "CREATE", "subtitle": "Explain Why a Charged Balloon Sticks to a Neutral Wall", "content": "Trace **Induced Charge Separation** step-by-step!", "keyPoints": ["Negative balloon repels wall electrons slightly deeper, leaving a temporary positive surface layer that attracts the negative balloon!"]}], "questions": [{"id": "g9-sci-q3", "bloomLevel": 4, "bloomTag": "APPLY & ANALYZE", "title": "SNC1W Physics Lab: Static Induction, Ohm's Law & Series vs. Parallel Circuits", "prompt": "(a) Rubbing a rubber balloon on wool makes the balloon negatively charged. Explain using **electrons ONLY** how it becomes charged AND why it sticks to a **neutral** classroom wall.\n(b) **Series Circuit:** A `12 V` battery connects two resistors (`R₁ = 2 Ω` and `R₂ = 4 Ω`) in **SERIES**. Find total resistance (`R_T`), circuit current (`I = V ÷ R_T`), and the voltage drop across each resistor (`V₁` and `V₂`).\n(c) **Parallel Circuit:** Now rewire those exact same `2 Ω` and `4 Ω` resistors in **PARALLEL** to the `12 V` battery. Find each branch current (`I₁`, `I₂`) and total current (`I_T`), and explain why plugging too many appliances into one parallel power bar trips the circuit breaker!", "step1_deconstruct": {"instruction": "Only move electrons in (a), apply Series rules (`R_T = R₁+R₂`, same `I`, split `V`) in (b), and apply Parallel rules (same `12 V`, split `I`) in (c)!", "guidingQuestions": ["Do protons ever jump from wool to balloon? (NO!)", "In Series, what is `R_T = 2 + 4` and `I = 12 ÷ 6`?", "In Parallel, what voltage does EACH resistor get (`12 V`)?"], "modelPlan": "(a) Friction transfers electrons from wool → balloon (−); near wall, negative balloon repels wall electrons inward (induced charge separation) → positive wall surface attracts balloon! (b) R_T = 6 Ω; I = 12÷6 = 2 A; V₁ = 2×2 = 4 V, V₂ = 2×4 = 8 V (4+8=12 V!). (c) I₁ = 12÷2 = 6 A; I₂ = 12÷4 = 3 A; I_T = 9 A — extra parallel branches increase I_T until breaker trips!"}, "step2_anchor": {"instruction": "Formulas:", "referenceItems": ["`V = I × R` (`I = V ÷ R`)", "Series: `R_T = R₁ + R₂`, same `I`, `V_T = V₁ + V₂`", "Parallel: same `V = 12 V`, `I_T = I₁ + I₂`"]}, "step3_substeps": [{"label": "Step 3a: Explain Friction Charging + Wall Sticking using **electrons ONLY**", "placeholder": "Friction: Electrons transfer from...\nWall Sticking (Induced Charge Separation): ...", "hint": "Wool loses electrons to balloon (`−`); balloon repels electrons inside the neutral wall slightly back, leaving positive surface attraction!", "modelSubAnswer": "• **Friction:** Rubbing transfers negative **electrons** from wool onto the rubber balloon (protons stay locked in nuclei!), making the balloon negatively charged.\n• **Induced Charge Separation:** Near the neutral wall, the balloon's negative charge repels the wall's surface electrons slightly deeper inside, creating a temporary positive surface layer that attracts the balloon!"}, {"label": "Step 3b: Solve the **Series** circuit (`12 V`, `R₁ = 2 Ω`, `R₂ = 4 Ω`)", "placeholder": "R_T = 2 + 4 = ... Ω | I = 12 ÷ ... = ... A\nV₁ = I × R₁ = ... V | V₂ = I × R₂ = ... V", "hint": "`R_T = 6 Ω`, `I = 2 A`, `V₁ = 4 V`, `V₂ = 8 V` (Check: `4 V + 8 V = 12 V` ✅!).", "modelSubAnswer": "• `R_T = 2 Ω + 4 Ω = 6 Ω`\n• `I = V ÷ R_T = 12 V ÷ 6 Ω = 2 A` (same everywhere in Series!)\n• `V₁ = 2 A × 2 Ω = 4 V` | `V₂ = 2 A × 4 Ω = 8 V` (`4 V + 8 V = 12 V` ✅!)"}, {"label": "Step 3c: Solve the **Parallel** circuit (`12 V`, `2 Ω`, `4 Ω`) & explain circuit breakers", "placeholder": "I₁ = 12 ÷ 2 = ... A | I₂ = 12 ÷ 4 = ... A | I_T = ... A\nBreaker trips because...", "hint": "Both branches get `12 V`: `I₁ = 6 A`, `I₂ = 3 A`, `I_T = 9 A`! Adding branches increases total current and wire heat!", "modelSubAnswer": "• Both branches receive full `12 V`: `I₁ = 12 V ÷ 2 Ω = 6 A` | `I₂ = 12 V ÷ 4 Ω = 3 A`\n• Total Current `I_T = 6 A + 3 A = 9 A` (much higher than Series `2 A`!)\n• **Breaker Safety:** Every extra parallel appliance adds more current to the main supply wire; if `I_T` exceeds the safe limit (e.g., `15 A`), wires overheat—so the circuit breaker snaps open to prevent an electrical fire!"}], "step4_checks": ["Did I describe ONLY electrons moving (never protons) in Step 3a?", "Did my Series voltages add cleanly back to `12 V` (`4 V + 8 V = 12 V`)?", "Did I include exact units (`Ω, A, V`) and explain WHY parallel overload trips a breaker?"], "step5_modelAnswer": {"basicAnswer": "Electrons move to balloon and push wall electrons back. Series: 6Ω, 2A, 4V, 8V. Parallel: 6A, 3A, 9A total.", "expandedAnswer": "Part (a): Friction moves electrons from wool to the balloon; brought near a neutral wall, the negative balloon repels surface electrons inward (induced charge separation), creating surface attraction.\nPart (b) Series: `R_T = 6 Ω`, `I = 2 A`, `V₁ = 4 V`, `V₂ = 8 V` (`4+8=12 V`).\nPart (c) Parallel: Both branches receive `12 V` → `I₁ = 6 A`, `I₂ = 3 A`, `I_T = 9 A`. Adding parallel appliances raises total current `I_T` in the main supply wire until the breaker trips to prevent overheating/fire.", "extensionPrompt": "Extension: Notice `R_total` in Parallel = `12 V ÷ 9 A = 1.33 Ω`—ALWAYS smaller than even the smallest individual resistor (`2 Ω`)!"}}]}, {"id": "g9-sci-u4", "title": "Unit 4 (Strand D — Physics): Electrical Power, Energy Cost (kWh) & Efficiency", "studyFirstTag": "Calculate Ontario Hydro bills (`E = P × t`) and compare LED vs. old bulb efficiency!", "curriculumStrand": "Ontario SNC1W Strand D: Electrical Energy, Power & Sustainability", "svgDiagram": "g9_sci_chem_elec_svg", "lessons": [{"id": "g9-sci-u4-l1", "title": "Lesson 4.1: Electrical Power (`P = V × I`), Kilowatt-Hours (`kWh`) & `% Efficiency`", "readTime": "3 min read", "bigIdea": "**Power** (`P = V × I`, in **Watts**) measures how FAST an appliance uses energy; **Energy (`E = P × t`)** in **kWh** is what shows up on an Ottawa Hydro electricity bill!", "paragraphs": ["Look at the back of your laptop charger or hair dryer: you'll see its **Power** rating in **Watts (`W`)** or **Kilowatts (`1 kW = 1,000 W`)**. Calculate Electrical Power using **`P = V × I`** (e.g., a `120 V` toaster drawing `10 A` uses `P = 120 × 10 = 1,200 W = 1.2 kW`).", "To calculate what **Hydro Ottawa** charges to run an appliance, use **Kilowatt-Hours (`kWh`)**:\n1. Convert Power from Watts to **Kilowatts (`kW = W ÷ 1,000`)**!\n2. Multiply by Time in **Hours**: **`E (kWh) = P (kW) × t (h)`**\n3. Multiply by Ontario's Time-of-Use Rate (e.g., Off-Peak `~8.7¢/kWh` at night vs. On-Peak `~18.2¢/kWh` in busy afternoon hours!). Running the dishwasher after 7:00 p.m. cuts electricity cost in HALF!", "Finally, measure **Percent Efficiency**: **`% Efficiency = (E_out ÷ E_in) × 100%`**. An old incandescent lightbulb wastes **95%** of its electricity as heat (`5%` efficient!), whereas a modern **LED bulb** turns ~40–50%+ into crisp light using **85% less electricity**—same brightness, tiny hydro bill!"], "keyTakeaway": "`P = V × I` (Watts) | `1 kW = 1,000 W` | **`Cost = P(kW) × t(h) × Rate`** | **`% Efficiency = (E_out ÷ E_in) × 100%`**!", "deepReadTitle": "💡 Ontario Hydro Bill Unit Shield", "deepReadText": "• ALWAYS divide Watts by `1,000` to get `kW` (`1,500 W = 1.5 kW`, `60 W = 0.06 kW`!)\n• Convert minutes to hours (`30 min = 0.5 h`)\n• Convert cents to dollars (`12¢ = $0.12/kWh`)!", "quickCheck": {"question": "A `1,500 W` (`1.5 kW`) space heater runs for `4 hours` at an Ontario rate of `$0.15 / kWh`. What does it cost?", "options": ["$900.00 (forgot to divide Watts by 1,000!)", "$0.90 (`1.5 kW × 4 h = 6 kWh`; `6 × $0.15 = $0.90`!)", "$0.60"], "correctIdx": 1, "explanation": "First convert `1,500 W = 1.5 kW`! Then `E = 1.5 kW × 4 h = 6 kWh`, and `Cost = 6 × $0.15 = $0.90`!"}, "videos": [{"id": "qTaaErZJJHI", "title": "Energy Efficiency Explained (Physics)", "channel": "FuseSchool - Global Education", "why": "Visualizes useful output vs. waste thermal energy clearly."}, {"id": "lmQ6QvZPtj0", "title": "Energy Use in Electrical Appliances (kWh)", "channel": "FuseSchool - Global Education", "why": "Direct match for Ontario kWh and power calculations."}]}], "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Recall Power, Energy (kWh), Cost & Efficiency Formulas", "content": "Lock in Unit 4 equations:", "keyPoints": ["`P = V × I` (W) • `E = P × t` (kWh or J) • `Cost = E(kWh) × Rate` • `% Eff = (E_out ÷ E_in) × 100%`."]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Explain Why Ontario Uses Time-of-Use Hydro Pricing", "content": "Peak afternoon demand forces Ontario to fire up extra natural-gas peaker plants—so cheaper Off-Peak night rates reward running laundry/EV chargers when Nuclear & Hydro easily meet demand!", "analogy": "🚗 Rush-Hour Analogy: Shifting laundry to after 7:00 p.m. is like taking the highway after rush hour—zero grid traffic jam and half the cost!", "keyPoints": ["Saves families money AND lowers Ontario's greenhouse gas emissions!"]}, {"level": 3, "name": "APPLY", "subtitle": "Compare Annual Hydro Cost of a `60 W` Old Bulb vs. `9 W` LED", "content": "Run both for `1,000 hours/year` at `$0.15/kWh`:", "workedExample": {"prompt": "Find 1-year cost for `60 W` incandescent vs. `9 W` LED (`1,000 h @ $0.15/kWh`):", "steps": ["Incandescent: `0.06 kW × 1,000 h = 60 kWh × $0.15 = $9.00/yr` (per bulb!).", "LED: `0.009 kW × 1,000 h = 9 kWh × $0.15 = $1.35/yr` — saves `$7.65` per bulb every year!"]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Watts vs. Kilowatt-Hours (Power vs. Energy)", "content": "Never confuse `kW` and `kWh`:", "comparisonTable": {"headers": ["Quantity", "Formula", "Unit", "Everyday Meaning"], "rows": [["Power (`P`)", "`V × I`", "Watts (`W`) / `kW`", "How FAST it draws energy (speedometer)"], ["Energy (`E`)", "`P × t`", "Joules (`J`) / `kWh`", "TOTAL energy used over time (odometer!)"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Catch the #1 Hydro Bill Calculation Blunder", "content": "Always check scale sanity:", "keyPoints": ["If running a toaster for 1 hour costs `$180`, you forgot to divide Watts by `1,000` (`1,200 W → 1.2 kW`, real cost `~$0.18`)!"]}, {"level": 6, "name": "CREATE", "subtitle": "Audit 3 Home Appliances for Phantom Load & Off-Peak Savings", "content": "Identify easy family hydro savings.", "keyPoints": ["Smart power bars cut phantom standby draw; run dishwashers/dryers on Ontario Off-Peak nights/weekends!"]}], "questions": [{"id": "g9-sci-q4", "bloomLevel": 4, "bloomTag": "APPLY & EVALUATE", "title": "SNC1W Energy Lab: Power, Ottawa Hydro Bill (`kWh`) & Efficiency", "prompt": "(a) A classroom projector runs on `120 V` and draws `2.5 A` of current. Calculate its **Power** in **Watts (`W`)** AND **Kilowatts (`kW`)**.\n(b) A family runs a **`3,000 W`** electric clothes dryer for **`2 hours`** every week (50 weeks/year = `100 hours/yr`). Calculate the annual cost at **On-Peak (`$0.18/kWh`)** vs. **Off-Peak (`$0.09/kWh`)**—how much money do they save per year by shifting to Off-Peak?\n(c) An electric kettle takes in **`80,000 J`** of electrical energy and transfers **`68,000 J`** of useful thermal energy into the water. Calculate its **`% Efficiency`** and explain where the remaining `12,000 J` went!", "step1_deconstruct": {"instruction": "Use `P=VI` + `÷1000` in (a), convert `3,000 W → 3.0 kW` first in (b), and compute `(E_out ÷ E_in)×100%` in (c)!", "guidingQuestions": ["What is `120 × 2.5` in Watts, and divided by 1,000 in kW?", "How many `kWh` does a `3 kW` dryer use in `100 hours`?", "What is `68,000 ÷ 80,000 × 100%`?"], "modelPlan": "(a) P = 120×2.5 = 300 W = 0.30 kW. (b) E = 3 kW × 100 h = 300 kWh; On-Peak = $54, Off-Peak = $27 → saves $27/yr! (c) Eff = (68,000÷80,000)×100% = 85%; 12,000 J heated kettle body/air/steam."}, "step2_anchor": {"instruction": "Formulas:", "referenceItems": ["`P = V × I` | `kW = W ÷ 1,000` | `E = P(kW) × t(h)`", "`% Efficiency = (E_out ÷ E_in) × 100%`"]}, "step3_substeps": [{"label": "Step 3a: Find the projector's Power in `W` AND `kW` (`120 V`, `2.5 A`)", "placeholder": "P = 120 V × 2.5 A = ... W = ... kW", "hint": "`120 × 2.5 = 300 W`; divide by `1,000` → `0.30 kW`!", "modelSubAnswer": "`P = 120 V × 2.5 A = 300 W = 0.30 kW`."}, {"label": "Step 3b: Calculate On-Peak vs. Off-Peak annual dryer cost & savings (`3,000 W`, `100 h`)", "placeholder": "P = 3.0 kW | E = 3.0 × 100 = ... kWh\nOn-Peak ($0.18): $... | Off-Peak ($0.09): $... | Saved: $...", "hint": "`300 kWh × $0.18 = $54.00` vs. `300 kWh × $0.09 = $27.00` → saves `$27.00/yr`!", "modelSubAnswer": "• `P = 3,000 W ÷ 1,000 = 3.0 kW` → `E = 3.0 kW × 100 h = 300 kWh/yr`\n• On-Peak Cost = `300 × $0.18 = $54.00/yr` | Off-Peak Cost = `300 × $0.09 = $27.00/yr`\n• **Annual Savings = `$27.00/yr`** (just from ONE appliance!)"}, {"label": "Step 3c: Calculate the kettle's `% Efficiency` & explain the missing `12,000 J`", "placeholder": "% Efficiency = (68,000 ÷ 80,000) × 100% = ...%\nMissing 12,000 J went to...", "hint": "`68 ÷ 80 = 0.85` → `85%`! Remaining `12,000 J` warmed the plastic/metal kettle shell, surrounding air, and sound!", "modelSubAnswer": "• `% Efficiency = (68,000 J ÷ 80,000 J) × 100% = 85%`\n• The remaining `12,000 J` dissipated as waste thermal energy heating the kettle's metal/plastic casing, warming surrounding kitchen air, and producing bubbling sound."}], "step4_checks": ["Did I convert Watts → Kilowatts (`÷ 1,000`) in BOTH Step 3a and Step 3b?", "Did I include exact units (`W`, `kW`, `kWh`, `$`, `%`)?", "Is my `% Efficiency` `< 100%` (`85%`) with a clear physical explanation for lost Joules?"], "step5_modelAnswer": {"basicAnswer": "300 W (0.3 kW). 300 kWh: $54 vs $27 (saves $27). 85% efficient.", "expandedAnswer": "Part (a): `P = 120 V × 2.5 A = 300 W = 0.30 kW`.\nPart (b): `E = 3.0 kW × 100 h = 300 kWh/yr`. On-Peak costs `$54.00/yr` vs. Off-Peak `$27.00/yr`, saving **`$27.00/yr`** and reducing peak grid emissions.\nPart (c): `% Efficiency = (68,000 ÷ 80,000) × 100% = 85%`; the remaining `12,000 J` warmed the kettle body, kitchen air, and sound.", "extensionPrompt": "Extension: Why is boiling ONLY the 1 cup of water you need instead of filling the entire kettle a smart efficiency habit?"}}]}, {"id": "g9-sci-u5", "title": "Unit 5 (Strand E — Space): Solar System, Star Life Cycles & The Big Bang", "studyFirstTag": "Measure cosmic distances (`AU` & Light-Years), trace Star Evolution & Redshift proof!", "curriculumStrand": "Ontario SNC1W Strand E: Earth & Space Science — Space Exploration", "svgDiagram": "g9_sci_chem_elec_svg", "lessons": [{"id": "g9-sci-u5-l1", "title": "Lesson 5.1: Astronomical Units, Light-Years, Star Life Cycles & Big Bang Redshift", "readTime": "3 min read", "bigIdea": "Use **Astronomical Units (`1 AU` = Earth–Sun)** inside our Solar System and **Light-Years (`ly`)** between stars—while **Redshift** of distant galaxies proves our universe has been expanding since the **Big Bang (`13.8 billion yrs ago`)**!", "paragraphs": ["Space is mind-bogglingly huge, so kilometres quickly run out of zeros! Inside our Solar System, astronomers use the **Astronomical Unit (`1 AU = 150 million km`**, Earth's distance to the Sun; Neptune sits at `30 AU`). Between stars and galaxies, we use the **Light-Year (`ly`)**—the **DISTANCE** (NOT time!) light travels in 1 year at `300,000 km/s` (`~9.5 trillion km`!). Even our closest neighbouring star (*Proxima Centauri*) is `4.2 light-years` away!", "Stars are born inside glowing clouds of gas and dust (**Nebulae**) and shine for billions of years via **Nuclear Fusion** (smashing Hydrogen into Helium in their cores!). A star's **MASS** decides its entire destiny:\n• **Sun-like (Medium Mass) Star:** Nebula → Main Sequence → **Red Giant** → Planetary Nebula → **White Dwarf**.\n• **High-Mass Star (8×+ Sun):** Nebula → Main Sequence → **Red Supergiant** → explosive **Supernova** (forging gold, iron & carbon!) → ultra-dense **Neutron Star** or **Black Hole**!", "How do scientists know the universe began **13.8 billion years ago** in the **Big Bang**? Two rock-solid pieces of evidence: (1) **Cosmological Redshift** (Hubble observed light from distant galaxies stretched toward red wavelengths—proving space itself is expanding!), and (2) **Cosmic Microwave Background (CMB)**—the faint microwave 'afterglow' left over across the entire sky!"], "keyTakeaway": "`1 AU` = Earth–Sun (Solar System) | `1 Light-Year` = DISTANCE light travels in 1 yr (Stars!). Star fate depends on **MASS** (Sun → White Dwarf; Massive → Supernova → Neutron Star/Black Hole). Big Bang proof = **Redshift + CMB**!", "deepReadTitle": "🌌 Space Science Quick Reference", "deepReadText": "• Inner Terrestrial Planets (Rocky, small): Mercury, Venus, Earth, Mars\n• Outer Gas/Ice Giants (Huge, rings/moons): Jupiter, Saturn, Uranus, Neptune\n• Canadian Space Pride: **Canadarm / Canadarm2 / Canadarm3 (Lunar Gateway)** & CSA astronaut Jeremy Hansen (Artemis II)!", "quickCheck": {"question": "What determines whether a star ends its life gently as a **White Dwarf** OR explodes in a **Supernova** to form a Neutron Star / Black Hole?", "options": ["How close the star is to Earth.", "The star's initial MASS!", "Whether the star has planets orbiting it."], "correctIdx": 1, "explanation": "A star's **MASS** determines its entire life cycle—medium stars like our Sun become Red Giants → White Dwarfs, while massive stars explode as Supernovae!"}, "videos": [{"id": "ld75W1dz-h0", "title": "Stars (Crash Course Astronomy #26)", "channel": "CrashCourse", "why": "Engaging, accurate guide to nuclear fusion and star evolution."}, {"id": "9B7Ix2VQEGo", "title": "The Big Bang & Cosmology (Crash Course Astronomy #42)", "channel": "CrashCourse", "why": "Explains Redshift and Cosmic Microwave Background evidence cleanly."}]}, {"id": "g9-sci-u5-l2", "title": "Lesson 5.2: Earth's `23.5°` Tilt (Why We Have Seasons!), Moon Phases & Eclipses", "readTime": "3 min read", "bigIdea": "Ottawa does NOT have winter because Earth is farther from the Sun—we actually sit slightly **CLOSER** to the Sun in January! Seasons are caused 100% by **Earth's `23.5°` axial tilt** changing sunlight angle and daylight hours!", "paragraphs": ["Bust the #1 space misconception right now: Earth's orbit is nearly circular, and Earth is actually *closest* to the Sun in early January (Ottawa's freezing winter!). Why is July hot and January −25°C? Because Earth's axis tilts **`23.5°`** as it revolves around the Sun! In **June (Summer Solstice)**, the Northern Hemisphere tilts **TOWARD** the Sun—receiving direct concentrated rays + ~15.5 hours of Ottawa daylight. In **December (Winter Solstice)**, we tilt **AWAY**—sunlight hits at a shallow spread-out angle with under 9 hours of daylight!", "Next, understand **Moon Phases** (~29.5-day cycle): half the Moon is ALWAYS lit by the Sun; phases change simply because we see different angles of that lit half as the Moon orbits Earth! **Waxing** = growing brighter on the RIGHT (`New → Waxing Crescent → First Quarter → Waxing Gibbous → Full`); **Waning** = shrinking on the LEFT (`Waning Gibbous → Third Quarter → Waning Crescent → New`)!", "Finally, spot **Solar vs. Lunar Eclipses** (remember the lineup!):\n• **Solar Eclipse (`Sun – Moon – Earth`):** Occurs ONLY at **New Moon** when the Moon's shadow falls onto Earth (just like Ontario's unforgettable April 2024 Total Solar Eclipse!).\n• **Lunar Eclipse (`Sun – Earth – Moon`):** Occurs ONLY at **Full Moon** when Earth blocks sunlight and casts a coppery-red shadow across the Moon!"], "keyTakeaway": "Seasons come from **Earth's `23.5°` axial tilt** (NOT distance from Sun!). **Solar Eclipse** = `S-M-E` (New Moon); **Lunar Eclipse** = `S-E-M` (Full Moon)!", "deepReadTitle": "🌗 Eclipses, Solstices & Equinoxes Quick Card", "deepReadText": "• Solstices: June 21 (longest Northern day) & Dec 21 (shortest Northern day)\n• Equinoxes: March 20 & Sept 22 (12 hrs day / 12 hrs night everywhere on Earth!)\n• Eclipses: Solar = `S-M-E` (New Moon, daytime shadow) | Lunar = `S-E-M` (Full Moon, red Blood Moon!)", "quickCheck": {"question": "What causes winter in Canada while Australia enjoys summer at the exact same time—AND which alignment creates a **Solar Eclipse**?", "options": ["Earth moves farther from the Sun; Sun – Earth – Moon (Full Moon).", "Earth's `23.5°` axial tilt aims the Northern Hemisphere away from the Sun (and Southern toward it); `Sun – Moon – Earth` (New Moon)!", "The Moon blocks sunlight in winter; `Sun – Moon – Earth` (Full Moon)."], "correctIdx": 1, "explanation": "Earth's `23.5°` tilt gives opposite hemispheres opposite seasons simultaneously! And `Sun – Moon – Earth` (New Moon) casts the Moon's shadow on Earth for a Solar Eclipse!"}, "videos": [{"id": "b25g4nZTHvM", "title": "Seasons and the Sun (23.5° Tilt)", "channel": "Crash Course Kids", "why": "Bests the distance myth visually with direct vs. angled sunbeams."}, {"id": "AQ5vty8f9Xc", "title": "Moon Phases (Crash Course Astronomy #4)", "channel": "CrashCourse", "why": "Makes waxing/waning and viewing angles effortless."}, {"id": "PRgua7xceDA", "title": "Eclipses: Solar vs. Lunar (Crash Course Astronomy #5)", "channel": "CrashCourse", "why": "Locks in S-M-E vs. S-E-M alignments and why eclipses don't happen every month."}]}], "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Recall AU, Light-Years, Star Paths & Big Bang Evidence", "content": "Lock in Strand E Space:", "keyPoints": ["`1 AU` = Earth–Sun (`150M km`) • `1 Light-Year` = DISTANCE (`9.5 × 10¹² km`).", "Big Bang (`13.8B yrs`) Evidence: (1) Galactic **Redshift** (expanding space) + (2) **Cosmic Microwave Background (CMB)**."]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Explain Why Looking at Distant Stars Means Looking Back in Time", "content": "Light travels at a finite speed (`300,000 km/s`), so sunlight takes `8 minutes` to reach Ottawa, and light from a galaxy 10 million light-years away left 10 million years ago!", "analogy": "✉️ Postcard Analogy: A postcard mailed across the ocean shows what the sender's city looked like the day they mailed it—starlight is a cosmic postcard from the past!", "keyPoints": ["James Webb Space Telescope sees ancient galaxies from just after the Big Bang!"]}, {"level": 3, "name": "APPLY", "subtitle": "Compare Star Paths: Sun vs. Massive Star (`20× Sun`)", "content": "Trace both life cycles cleanly:", "workedExample": {"prompt": "Predict the final remnant of: (1) Our Sun vs. (2) A `20× Solar-Mass` blue supergiant.", "steps": ["(1) Sun: Main Sequence → Red Giant → Planetary Nebula → **White Dwarf**.", "(2) Massive Star: Main Sequence → Red Supergiant → **Supernova** → **Black Hole**!"]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Inner Terrestrial vs. Outer Jovian Planets", "content": "Know our Solar System architecture:", "comparisonTable": {"headers": ["Feature", "Inner Terrestrial (M, V, E, M)", "Outer Gas/Ice Giants (J, S, U, N)"], "rows": [["Composition", "Dense solid rock & metal", "Hydrogen/helium gas & icy cores"], ["Size & Moons", "Small, 0–2 moons, no rings", "Massive, dozens of moons & ring systems"], ["Distance", "0.4 to 1.5 AU", "5.2 to 30.1 AU!"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Catch the 'Light-Year Is Time' Misconception", "content": "Never get caught on this classic quiz trick:", "keyPoints": ["A **Light-Year** measures **DISTANCE** (`~9.5 trillion km`), NOT time! And our Sun will NEVER explode into a Black Hole (not massive enough!)."]}, {"level": 6, "name": "CREATE", "subtitle": "Explain How Supernovae Made the Iron in Your Blood Possible", "content": "Connect astronomy to chemistry!", "keyPoints": ["The Big Bang made only Hydrogen & Helium—heavier elements like Carbon, Oxygen, and Iron in our bodies were forged inside ancient stars and scattered by Supernovae!"]}], "questions": [{"id": "g9-sci-q5", "bloomLevel": 4, "bloomTag": "ANALYZE & EVALUATE", "title": "SNC1W Astronomy Lab: Cosmic Scales, Star Evolution & Big Bang Proof", "prompt": "(a) Explain when astronomers use **Astronomical Units (`AU`)** vs. **Light-Years (`ly`)**—and clarify the classic misconception about what a light-year actually measures!\n(b) Contrast the complete **Life Cycle** of a medium star like our **Sun** with a **High-Mass Star (20× Sun)**, noting what powers stars during their Main Sequence.\n(c) Explain **2 major pieces of scientific evidence** supporting the **Big Bang Theory** (`13.8 billion years ago`) AND name 1 iconic **Canadian contribution** to space exploration!", "step1_deconstruct": {"instruction": "Clarify AU vs. Light-Year (DISTANCE!) in (a), trace both star paths + nuclear fusion in (b), and cite Redshift + CMB + Canadarm in (c).", "guidingQuestions": ["Is a light-year a measure of TIME or DISTANCE?", "What nuclear process powers all Main Sequence stars?", "What do Redshift and CMB each prove?"], "modelPlan": "(a) AU = Solar System distances (1 AU = Earth–Sun); ly = interstellar DISTANCE light travels in 1 yr (NOT time!). (b) Nuclear fusion (H→He); Sun → Red Giant → Planetary Nebula → White Dwarf; Massive → Red Supergiant → Supernova → Neutron Star / Black Hole. (c) Redshift (galaxies receding/expanding universe) + CMB afterglow; Canadarm / Canadarm2 / Canadarm3!"}, "step2_anchor": {"instruction": "Space Anchors:", "referenceItems": ["`1 AU` = Earth–Sun (`150M km`) | `1 ly` = DISTANCE (`9.5T km`)", "Nuclear Fusion (`H → He`) | Sun → White Dwarf | High-Mass → Supernova → Black Hole/Neutron Star", "Big Bang Evidence = **Redshift** + **CMB** | Canadian Tech = **Canadarm 1/2/3**"]}, "step3_substeps": [{"label": "Step 3a: Distinguish `AU` vs. `Light-Years` & bust the 'time' myth", "placeholder": "Astronomical Units (AU) are used for...\nLight-Years (ly) are used for... Misconception: ...", "hint": "AU = Solar System (`1 AU = Earth–Sun`); Light-Year = DISTANCE light travels in 1 year (between stars/galaxies), NOT time!", "modelSubAnswer": "• **Astronomical Units (`AU`):** Used inside our Solar System (`1 AU = 150 million km`, Earth to Sun).\n• **Light-Years (`ly`):** Used for immense interstellar/intergalactic distances (`~9.5 trillion km`).\n• **Myth Busted:** Despite containing the word 'year', a light-year measures **DISTANCE**, not time!"}, {"label": "Step 3b: Contrast the life cycle of our **Sun** vs. a **High-Mass Star** + name their fuel process", "placeholder": "Power source: Nuclear ...\nSun: ...\nHigh-Mass Star: ...", "hint": "Nuclear **Fusion** (Hydrogen → Helium)! Sun → Red Giant → White Dwarf; High-Mass → Red Supergiant → Supernova → Neutron Star / Black Hole!", "modelSubAnswer": "• **Main-Sequence Power:** **Nuclear Fusion** (fusing Hydrogen into Helium in the core).\n• **Our Sun (Medium Mass):** Nebula → Main Sequence → **Red Giant** → Planetary Nebula → **White Dwarf**.\n• **High-Mass Star:** Nebula → Main Sequence → **Red Supergiant** → **Supernova** explosion → **Neutron Star** or **Black Hole**!"}, {"label": "Step 3c: Explain **2 pieces of Big Bang evidence** + 1 **Canadian space contribution**", "placeholder": "Evidence 1 (Redshift): ...\nEvidence 2 (CMB): ...\nCanadian Contribution: ...", "hint": "Redshift proves space is expanding; CMB is faint microwave thermal afterglow; Canadarm/Canadarm2/Canadarm3 or JWST FGS/NIRISS sensor!", "modelSubAnswer": "1. **Cosmological Redshift:** Light from distant galaxies is stretched toward longer red wavelengths, proving space itself is expanding outward from an earlier hot, dense state.\n2. **Cosmic Microwave Background (CMB):** Faint microwave radiation fills the entire sky uniformly—the cooled thermal afterglow of the early universe.\n• **Canadian Pride:** **Canadarm / Canadarm2** (building the ISS) and **Canadarm3** (for the Lunar Gateway), plus Canada's Fine Guidance Sensor on the James Webb Space Telescope!"}], "step4_checks": ["Did I clearly state a light-year measures **DISTANCE** (not time)?", "Did I include **Nuclear Fusion** and contrast White Dwarf vs. Supernova/Black Hole?", "Did I explain BOTH **Redshift** and **CMB** accurately + include Canadian space tech?"], "step5_modelAnswer": {"basicAnswer": "AU is solar system, light-year is distance between stars. Fusion powers stars; Sun becomes white dwarf, big star supernova. Redshift, CMB, Canadarm.", "expandedAnswer": "Part (a): `AU` (`150M km`) measures Solar System distances, whereas **Light-Years** (`~9.5T km`) measure interstellar **distance** (not time!).\nPart (b): Main Sequence stars fuse Hydrogen into Helium. Medium stars like our Sun evolve into Red Giants → Planetary Nebulae → White Dwarfs, while high-mass stars become Red Supergiants → Supernovae (forging heavy elements!) → Neutron Stars or Black Holes.\nPart (c): Big Bang (`13.8B yrs`) evidence rests on galactic **Redshift** (expanding universe) and uniform **Cosmic Microwave Background (CMB)** radiation; Canada leads in space robotics via **Canadarm 1/2/3** and Webb Telescope instruments.", "extensionPrompt": "Extension: Why do astronauts on the International Space Station float—is gravity zero up there? (NO! Gravity is ~90% of Earth's; they are in continuous sideways free-fall around Earth!)"}}]}]}, {"id": "english", "code": "ENL1W (Grade 9 De-Streamed English)", "name": "English (ENL1W)", "friendlySub": "Literary Analysis (MLA), Shakespeare, Ethos/Pathos/Logos & Syntax", "teacher": "Grade 9 ENL1W", "status": "Core High School Credit", "tier": "Tier 2: Core Mastery", "tierClass": "tier-strong", "icon": "✍️", "reportComment": "Complete Ontario 2023 De-Streamed Grade 9 English (ENL1W — mandatory high school credit): Formal Literary Analysis Essays & MLA 9 Citations, Shakespeare & Dramatic Craft, Aristotle's Rhetoric (Ethos/Pathos/Logos), Parallel Syntax & Ethical AI Research Literacy.", "nextSteps": ["Write analytical literary theses arguing HOW an author's technique proves a deeper theme", "Format MLA 9 in-text citations cleanly: (Author Page) or (Act.Scene.Line) for Shakespeare!", "Recognize Ethos, Pathos, and Logos in speeches, essays, and digital media", "Master Parallel Structure and ethical AI/research citation practices"], "units": [{"id": "g9-eng-u1", "title": "Unit 1: Formal Literary Analysis Essay & MLA 9 Citation Mastery", "studyFirstTag": "Stop summarizing plot—prove HOW literary techniques build theme with MLA 9!", "curriculumStrand": "Ontario ENL1W Strands C & D: Literary Analysis & Formal Academic Composition", "svgDiagram": "g9_eng_tas_svg", "lessons": [{"id": "g9-eng-u1-l1", "title": "Lesson 1.1: Analytical Thesis, Literary Present Tense & MLA 9 In-Text Citations", "readTime": "3 min read", "bigIdea": "High school English essays use **Literary Present Tense** ('Shakespeare *reveals*', NOT '*revealed*'), analyze **HOW** an author's choices create meaning, and cite exact pages/lines in **MLA 9** format!", "paragraphs": ["The #1 jump from Grade 8 to Grade 9 `ENL1W` is moving from **Plot Summary** (retelling what happened) to **Literary Analysis** (arguing *why* and *how* the author's craft proves a theme). Use the **ENL1W Analytical Thesis Blueprint**: *Through `[Author's Craft/Technique]`, `[Author]` reveals that `[Universal Theme]`.* Example: *'Through recurring imagery of locked doors and winter silence, the author reveals that unspoken grief isolates families until honesty breaks the barrier.'*", "Follow two strict Grade 9 formal-essay conventions: (1) Write in **Third Person** (NO `'I think'`, `'In this essay I will prove'`, or `'you'`) and (2) Keep verbs in **Literary Present Tense** because literature lives freshly every time it is read (*'When Romeo climbs the orchard wall, he proves...'*).", "Master **MLA 9 In-Text Citations** right now so you cruise through Grades 9–12: place the **Author's Last Name + Page Number** inside parentheses right before the period—with NO comma and NO `'p.'`! Example: *`Maya's 'tattered leather notebook' symbolizes her refusal to surrender her identity (Alvarez 42).`* For Shakespeare plays, cite **`(Act.Scene.Lines)`** like `(2.2.33-36)`!"], "keyTakeaway": "Analytical Thesis = `Technique + Author + Theme`. Formal style = **3rd person + Literary Present Tense**. MLA 9 citation = `(LastName 42).` (period goes AFTER parentheses!).", "deepReadTitle": "📝 MLA 9 Quick Format Card (ENL1W)", "deepReadText": "• Prose Quote: `...reveals her quiet courage (Hinton 87).` (NO comma, NO 'p.', period AFTER closing bracket!)\n• Shakespeare Play: `...calls out to the night sky (2.2.33).` (Act 2, Scene 2, Line 33!)\n• Works Cited Entry: `Last, First. *Book Title*. Publisher, Year.`", "quickCheck": {"question": "Which sentence obeys BOTH **MLA 9 citation formatting** AND **Literary Present Tense**?", "options": ["I think Ponyboy showed courage when he ran into the church (Hinton, p. 91.)", "Ponyboy demonstrates selfless courage when he 'sprints straight into the burning church' (Hinton 91).", "Ponyboy demonstrated selfless courage when he ran into the church. (Hinton 91)"], "correctIdx": 1, "explanation": "Option B uses 3rd-person Literary Present Tense (`demonstrates`), weaves a short quote cleanly, omits `'p.'`/comma, and puts the period AFTER `(Hinton 91).`!"}, "videos": [{"id": "MnVUX3reN6A", "title": "Introduction to Literary Analysis Essay Writing", "channel": "Laura Randazzo", "why": "Direct high-school bridge from plot summary to analytical thesis & evidence."}]}], "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Recall Literary Present Tense & MLA 9 Citation Rules", "content": "Lock in ENL1W essay formatting:", "keyPoints": ["Formal Essay = 3rd Person + Literary Present Tense + Zero Contractions (`cannot`, not `can't`).", "MLA 9 = `(Author Page).` for novels; `(Act.Scene.Line).` for Shakespeare!"]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Explain Why Period Goes AFTER `(Author 42).`", "content": "The parenthetical citation belongs inside the sentence it documents—putting the period before it cuts the citation loose into limbo!", "analogy": "🏷️ Luggage Tag Analogy: Attach your `(Author 42)` luggage tag securely INSIDE your sentence before zipping it closed with the final period!", "keyPoints": ["Only `!` or `?` that belong to the original quote stay inside quotation marks—the sentence period still goes after `(Author 42).`!"]}, {"level": 3, "name": "APPLY", "subtitle": "Convert a Grade 8 Draft into a Formal ENL1W Analytical Sentence", "content": "Fix voice, tense, and MLA 9 all at once:", "workedExample": {"prompt": "Fix: `In my essay I will show that the author used a storm to make the hero scared (Lee, p. 14).`", "steps": ["Cut `'In my essay I will show'` → 3rd person; flip `used` → Literary Present `uses`.", "Fix MLA: `(Lee 14).`", "Upgraded: *Through violent storm imagery, Lee exposes the protagonist's growing internal panic (Lee 14).*"]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Plot Summary vs. High-School Literary Analysis", "content": "See why teachers write 'Too much summary!' in margins:", "comparisonTable": {"headers": ["Plot Summary (Level 2)", "Literary Analysis (Level 4 ENL1W)"], "rows": [["'First the boy steals the watch, then he feels guilty and hides it.'", "'By hiding the stolen watch beneath the floorboards, the protagonist reveals that guilt cannot be buried without haunting one's conscience (Chen 56).'"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Audit 3 Broken MLA Citations", "content": "Spot every punctuation s
