<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zaid's Grade 9 Study Space (Ontario De-Streamed)</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --surface: #ffffff;
      --surface-soft: #eef2f8;
      --text: #0f172a;
      --text-body: #2d3b4e;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-soft: #eff6ff;
      --success: #059669;
      --success-soft: #ecfdf5;
      --warning: #d97706;
      --warning-soft: #fffbeb;
      --danger: #dc2626;
      --danger-soft: #fef2f2;
      --purple: #7c3aed;
      --purple-soft: #f5f3ff;
      --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.05);
      --shadow-card: 0 12px 32px rgba(15, 23, 42, 0.08);
      --radius: 20px;
    }
    body.dark {
      --bg: #0b1120;
      --surface: #141e33;
      --surface-soft: #1e2b45;
      --text: #f8fafc;
      --text-body: #e2e8f0;
      --text-muted: #94a3b8;
      --border: #25344d;
      --border-strong: #374a6a;
      --primary: #60a5fa;
      --primary-hover: #3b82f6;
      --primary-soft: rgba(59, 130, 246, 0.22);
      --success: #34d399;
      --success-soft: rgba(16, 185, 129, 0.2);
      --warning: #fbbf24;
      --warning-soft: rgba(245, 158, 11, 0.2);
      --danger: #f87171;
      --danger-soft: rgba(239, 68, 68, 0.2);
      --purple: #c4b5fd;
      --purple-soft: rgba(167, 139, 250, 0.2);
      --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.3);
      --shadow-card: 0 14px 36px rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.68;
      min-height: 100vh;
    }
    button, input, textarea, select {
      font-family: inherit;
      color: inherit;
    }

    /* Smooth Card-Opening Animations (crisp transform without fading text out!) */
    @keyframes cardOpen {
      from { opacity: 0.72; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes sheetSlide {
      from { opacity: 0.8; transform: translateY(14px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .anim-card {
      animation: cardOpen 0.16s ease-out forwards;
    }

    /* Whisper-Quiet Top Bar (Adapts automatically in Focus Mode!) */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    body.dark .topbar {
      background: rgba(20, 30, 51, 0.92);
    }
    .brand-trigger {
      display: flex;
      align-items: center;
      gap: 10px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text);
      font-weight: 800;
      font-size: 1rem;
    }
    .brand-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, #2563eb, #06b6d4);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 0.92rem;
    }
    .focus-center-title {
      font-weight: 700;
      font-size: 0.92rem;
      color: var(--text-muted);
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Clean Buttons */
    .btn {
      background: var(--surface);
      color: var(--text);
      border: 1.5px solid var(--border-strong);
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.16s ease;
      text-decoration: none;
    }
    .btn:hover {
      border-color: var(--primary);
      background: var(--primary-soft);
      transform: translateY(-1px);
    }
    .btn-primary {
      background: #2563eb;
      border-color: #2563eb;
      color: #fff;
    }
    .btn-primary:hover { background: #1d4ed8; border-color: #1d4ed8; color: #fff; }
    .btn-success {
      background: #059669;
      border-color: #059669;
      color: #fff;
    }
    .btn-success:hover { background: #047857; border-color: #047857; color: #fff; }
    .btn-lg {
      padding: 13px 22px;
      font-size: 0.98rem;
      font-weight: 700;
      border-radius: 14px;
    }
    .btn-soft {
      background: var(--surface-soft);
      border-color: transparent;
      color: var(--text-body);
    }
    .btn-soft:hover {
      background: var(--surface);
      border-color: var(--border-strong);
    }

    /* Page Containers */
    .wrap-home {
      max-width: 1020px;
      margin: 0 auto;
      padding: 28px 20px 80px;
    }
    .wrap-focus {
      max-width: 740px;
      margin: 0 auto;
      padding: 24px 18px 90px;
    }

    /* ========================================
       HOME: CLEAN START CARD + INTERACTIVE SUBJECT CARDS
       ======================================== */
    .hero {
      background: linear-gradient(135deg, #2563eb 0%, #0891b2 100%);
      color: #fff;
      border-radius: 24px;
      padding: 28px 32px;
      margin-bottom: 30px;
      box-shadow: 0 14px 32px rgba(37, 99, 235, 0.22);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    .hero h1 { font-size: 1.7rem; font-weight: 800; margin-bottom: 6px; }
    .hero p { font-size: 0.98rem; opacity: 0.93; margin-bottom: 18px; max-width: 540px; }
    .hero-btn {
      background: #fff;
      color: #1d4ed8;
      border: none;
      padding: 13px 24px;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
      transition: transform 0.16s ease;
    }
    .hero-btn:hover { transform: translateY(-2px); }
    .hero-ring {
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 18px;
      padding: 16px 24px;
      text-align: center;
      min-width: 170px;
    }
    .hero-ring-num { font-size: 1.9rem; font-weight: 900; line-height: 1.1; }
    .hero-ring-sub { font-size: 0.78rem; opacity: 0.9; }

    .group-label {
      font-size: 1.1rem;
      font-weight: 800;
      margin: 24px 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .group-label span.sub { font-size: 0.84rem; font-weight: 500; color: var(--text-muted); }

    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    @media (max-width: 820px) { .grid-3 { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 600px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }

    .subject-card {
      background: var(--surface);
      color: var(--text);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 22px;
      cursor: pointer;
      text-align: left;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .subject-card:hover {
      transform: translateY(-4px);
      border-color: var(--primary);
      box-shadow: var(--shadow-card);
    }
    .subject-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .emoji-box {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: var(--surface-soft);
      display: grid;
      place-items: center;
      font-size: 1.55rem;
    }
    .pill-tag {
      font-size: 0.72rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 999px;
      text-transform: uppercase;
    }
    .pill-urgent { background: var(--danger-soft); color: var(--danger); }
    .pill-core { background: var(--success-soft); color: var(--success); }
    .pill-extra { background: var(--warning-soft); color: var(--warning); }

    .subject-card h3 { font-size: 1.14rem; font-weight: 800; }
    .subject-card p { font-size: 0.87rem; color: var(--text-muted); flex: 1; }
    .prog-track { height: 7px; background: var(--surface-soft); border-radius: 999px; overflow: hidden; margin-top: 6px; }
    .prog-fill { height: 100%; background: var(--success); border-radius: 999px; transition: width 0.3s ease; }

    /* ========================================
       COURSE SCREEN: EXPANDABLE UNIT CARDS
       ======================================== */
    .unit-accordion {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }
    .unit-acc-header {
      width: 100%;
      background: none;
      border: none;
      padding: 20px 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      text-align: left;
      color: var(--text);
    }
    .unit-acc-header:hover { background: var(--surface-soft); }
    .unit-acc-body {
      padding: 0 20px 20px;
      border-top: 1px solid var(--border);
      padding-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .card-tile {
      width: 100%;
      background: var(--surface-soft);
      color: var(--text);
      border: 1.5px solid transparent;
      border-radius: 15px;
      padding: 15px 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      text-align: left;
      transition: all 0.16s ease;
    }
    .card-tile:hover {
      background: var(--surface);
      border-color: var(--primary);
      transform: translateX(3px);
      box-shadow: var(--shadow-sm);
    }
    .tile-left { display: flex; align-items: center; gap: 14px; }
    .tile-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
      border: 1.5px solid var(--border-strong);
      display: grid;
      place-items: center;
      font-size: 1.05rem;
      font-weight: 800;
      flex-shrink: 0;
    }
    .tile-icon.done { background: #059669; border-color: #059669; color: #fff; }
    .tile-title { font-weight: 700; font-size: 0.96rem; color: var(--text); display: block; }
    .tile-sub { font-size: 0.8rem; color: var(--text-muted); display: block; }

    /* ========================================
       FOCUSED SINGLE-TASK CARD PLAYER
       (1 Task Only: READ | WATCH | CHECK | SOLVE)
       ======================================== */
    .mode-pills {
      display: flex;
      gap: 8px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      padding: 6px;
      border-radius: 16px;
      margin-bottom: 18px;
      box-shadow: var(--shadow-sm);
    }
    .mode-pill {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 11px 10px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.16s ease;
    }
    .mode-pill.active {
      background: #2563eb;
      color: #fff;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    }

    .focus-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 24px;
      padding: 32px 34px;
      box-shadow: var(--shadow-card);
    }
    @media (max-width: 600px) {
      .focus-card { padding: 22px 18px; }
    }
    .card-kicker {
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--primary);
      margin-bottom: 8px;
      display: block;
    }
    .card-heading {
      font-size: 1.48rem;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 18px;
    }
    .big-idea {
      background: var(--primary-soft);
      border-left: 4px solid var(--primary);
      padding: 14px 18px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 22px;
    }
    .prose p {
      font-size: 1.08rem;
      line-height: 1.85;
      color: var(--text-body);
      margin-bottom: 18px;
    }
    .takeaway {
      background: var(--success-soft);
      border: 1.5px solid var(--success);
      border-radius: 14px;
      padding: 14px 18px;
      margin: 20px 0 8px;
      font-size: 0.96rem;
    }

    /* Quick Bonus Cards Strip (Opens a clean Pop-Up Card!) */
    .bonus-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 18px;
    }

    /* Video Theater Card */
    .video-stage {
      margin-bottom: 18px;
    }
    .yt-poster {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      background-size: cover;
      background-position: center;
      border: 1.5px solid var(--border);
    }
    .yt-poster-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.36);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background 0.16s ease;
    }
    .yt-poster:hover .yt-poster-overlay { background: rgba(15, 23, 42, 0.18); }
    .yt-play-circle {
      background: #dc2626;
      color: #fff;
      font-weight: 800;
      font-size: 1.05rem;
      padding: 14px 26px;
      border-radius: 999px;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.38);
    }
    .yt-iframe-wrap {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      height: 0;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
    }
    .yt-iframe-wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* Quick Check Options */
    .qc-choice {
      width: 100%;
      text-align: left;
      background: var(--surface-soft);
      border: 2px solid transparent;
      color: var(--text);
      padding: 15px 18px;
      border-radius: 14px;
      margin-top: 10px;
      cursor: pointer;
      font-size: 0.98rem;
      font-weight: 500;
      transition: all 0.15s ease;
    }
    .qc-choice:hover { border-color: var(--primary); background: var(--surface); }
    .qc-choice.correct {
      background: var(--success-soft);
      border-color: var(--success);
      color: var(--success);
      font-weight: 700;
    }
    .qc-choice.wrong {
      background: var(--danger-soft);
      border-color: var(--danger);
      color: var(--danger);
    }
    .qc-result {
      margin-top: 14px;
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 0.95rem;
    }
    .qc-result.ok { background: var(--success-soft); color: var(--success); }
    .qc-result.err { background: var(--danger-soft); color: var(--danger); }

    /* Stepper Dots (Question Solver & Bloom's) */
    .step-dots {
      display: flex;
      gap: 6px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .step-dot {
      flex: 1;
      min-width: 82px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      color: var(--text-muted);
      padding: 9px 6px;
      border-radius: 12px;
      font-size: 0.82rem;
      font-weight: 700;
      text-align: center;
      cursor: pointer;
    }
    .step-dot.active { background: #2563eb; border-color: #2563eb; color: #fff; }
    .step-dot.done { background: var(--success-soft); border-color: var(--success); color: var(--success); }

    .work-area {
      width: 100%;
      min-height: 130px;
      background: var(--surface-soft);
      color: var(--text);
      border: 2px solid var(--border-strong);
      border-radius: 14px;
      padding: 15px 18px;
      font-family: inherit;
      font-size: 1rem;
      line-height: 1.65;
      resize: vertical;
      margin: 12px 0;
    }
    .work-area::placeholder { color: var(--text-muted); opacity: 1; }
    .work-area:focus { outline: none; border-color: var(--primary); background: var(--surface); }

    .check-tile {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      background: var(--surface-soft);
      color: var(--text);
      border: 1.5px solid var(--border);
      padding: 14px 16px;
      border-radius: 14px;
      margin-bottom: 10px;
      cursor: pointer;
      font-size: 0.96rem;
    }
    .check-tile input {
      width: 22px;
      height: 22px;
      margin-top: 2px;
      accent-color: var(--success);
      flex-shrink: 0;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 28px;
      padding-top: 18px;
      border-top: 1.5px solid var(--border);
      gap: 12px;
      flex-wrap: wrap;
    }

    /* Clean Pop-Up Card Modal (For Diagrams, Cheat Sheets, Hints, Study Tools!) */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.58);
      backdrop-filter: blur(4px);
      z-index: 300;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }
    .modal-backdrop.open { display: flex; }
    .modal-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 24px;
      max-width: 680px;
      width: 100%;
      max-height: 86vh;
      overflow-y: auto;
      padding: 26px 28px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.3);
      animation: sheetSlide 0.2s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .modal-head h3 { font-size: 1.15rem; font-weight: 800; }

    .info-box {
      background: var(--surface-soft);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 12px;
      font-size: 0.94rem;
      white-space: pre-line;
    }
    .big-idea {
      background: var(--primary-soft);
      color: var(--text);
      border-left: 4px solid var(--primary);
      padding: 14px 18px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 22px;
    }
    .takeaway {
      background: var(--success-soft);
      color: var(--text);
      border: 1.5px solid var(--success);
      border-radius: 14px;
      padding: 14px 18px;
      margin: 20px 0 8px;
      font-size: 0.96rem;
    }
    .comp-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; color: var(--text); }
    .comp-table th, .comp-table td { border: 1px solid var(--border-strong); padding: 10px; text-align: left; color: var(--text); }
    .comp-table th { background: var(--surface-soft); color: var(--text); }
    .audio-btn {
      width: 100%;
      text-align: left;
      background: var(--primary-soft);
      border: 1.5px solid var(--primary);
      color: var(--text);
      padding: 11px 14px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.94rem;
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .topic-svg { width: 100%; height: auto; border-radius: 12px; display: block; }
    .comp-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    .comp-table th, .comp-table td { border: 1px solid var(--border-strong); padding: 10px; text-align: left; }
    .comp-table th { background: var(--surface-soft); }
    .inline-code {
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      background: var(--surface-soft);
      border: 1px solid var(--border);
      padding: 1px 6px;
      border-radius: 6px;
      font-size: 0.92em;
      font-weight: 700;
      color: var(--primary);
    }

    .meter-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: -4px;
      margin-bottom: 12px;
      padding: 8px 12px;
      background: var(--surface-soft);
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    .meter-good { color: var(--success); font-weight: 700; }
    .meter-warn { color: var(--warning); font-weight: 700; }
    .badge-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }
    .skill-badge {
      background: var(--surface-soft);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 12px;

instant a **concrete plot event happens or finishes** (`L'arbitre a sifflé, je suis entré sur le terrain, j'ai marqué!`), snap to **Passé Composé**!", "High-school teachers grade two subtle details closely: (1) **ÊTRE Agreement** on DR MRS VANDERTRAMP & reflexive verbs (`Ma sœur s'est levée tôt et elle est partie`), and (2) **AVOIR verbs that flip to ÊTRE**? Watch out for the 6 'Transit' verbs (`monter, descendre, sortir, rentrer, passer, retourner`): with NO direct object they take **ÊTRE** (`Je suis sorti`), but WITH a direct object (`le chien`, `la poubelle`) they switch to **AVOIR** (`J'ai sorti le chien` = I took the dog out)!", "Also lock in your **Negation Placement in Past Tense**: `ne...pas`, `ne...jamais`, and `ne...rien` ALWAYS wrap around the **helper verb ONLY** (`Je n'ai jamais oublié`, `Nous ne sommes pas partis`, `Je ne me suis rien acheté`)—except `ne...personne`, which sits AFTER the past participle (`Je n'ai vu personne`)."], "keyTakeaway": "Imparfait = background/feeling/habit; Passé Composé = completed plot action. Watch the `sortir/monter/descendre` direct-object switch (`Je suis sorti` vs. `J'ai sorti mon cahier`)!", "deepReadTitle": "🎬 FSF1D Past-Tense Story Audit Checklist", "deepReadText": "• Imparfait (`-ais, -ais, -ait, -ions, -iez, -aient`): Age, Weather, Emotion, Ongoing Action, Habit\n• Passé Composé (`AVOIR/ÊTRE + PP`): Specific completed action, sequence of events (`D'abord... ensuite... finalement...`)\n• Bonus Rule: Direct object BEFORE AVOIR triggers agreement! (« La lettre que j'ai écrit**e**! »)", "quickCheck": {"question": "Which sentence correctly uses BOTH tenses AND the `sortir` direct-object rule?", "options": ["Il pleuvait quand je suis sorti mon parapluie et j'ai parti.", "Il pleuvait quand j'ai sorti mon parapluie et je suis parti pour l'école.", "Il a plu quand je sortais mon parapluie et je suis parti."], "correctIdx": 1, "explanation": "Weather = Imparfait (`Il pleuvait`); taking out an object (`mon parapluie`) makes `sortir` take AVOIR (`j'ai sorti`); leaving (`partir`) takes ÊTRE (`je suis parti`)!"}, "videos": [{"id": "JK5OMjjAc8A", "title": "French Imperfect Tense vs. Passé Composé", "channel": "Learn French With Alexa", "why": "Essential FSF1D review of narrative tense selection."}]}], "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Recall Narrative Tense Clues & Transit Verb Rule", "content": "Lock in FSF1D past-tense precision:", "keyPoints": ["Imparfait = background, emotion, weather, habit | Passé Composé = action/sequence.", "Direct object (`mon sac`) switches `sortir/monter/descendre` from ÊTRE to AVOIR!"], "frenchAudioSamples": ["Il neigeait fort à Ottawa quand je suis arrivé à l'école secondaire.", "J'ai sorti mon cahier et j'ai commencé l'examen calmement."]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Explain Why `j'ai sorti mon sac` Uses AVOIR Instead of ÊTRE", "content": "When YOU move yourself out (`Je suis sorti`), use ÊTRE; when you move an OBJECT out (`J'ai sorti mon sac`), use AVOIR!", "analogy": "🎒 Backpack Rule: Moving YOUR BODY = ÊTRE (`Je suis monté`). Carrying an OBJECT = AVOIR (`J'ai monté ma valise`)!", "keyPoints": ["Same rule for `descendre`, `sortir`, `rentrer`, `retourner`, and `passer`!"]}, {"level": 3, "name": "APPLY", "subtitle": "Combine 3 Story Events into Smooth FSF1D French", "content": "Layer scene + action + emotion:", "workedExample": {"prompt": "Scene: I was nervous. Action: I walked onstage and played my trombone. Reaction: Everyone applauded!", "steps": ["Scene (Imp): `J'étais très nerveux avant le concert.`", "Actions (PC): `Je suis monté sur la scène et j'ai joué mon solo de trombone.`", "Reaction (PC): `Finalement, tout le public a applaudi!`"]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Negation Placement in Passé Composé", "content": "Never misplace `jamais`, `rien`, or `personne`:", "comparisonTable": {"headers": ["Negative", "Placement Rule", "FSF1D Example"], "rows": [["ne...pas / ne...jamais / ne...rien", "Around HELPER verb", "Je n'ai jamais oublié / Je n'ai rien vu."], ["ne...personne", "Around ENTIRE verb (after PP!)", "Je n'ai vu personne dans le couloir."]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Audit a Grade 9 Draft for Subtle Agreement & Tense Slips", "content": "Catch all 2 FSF1D errors:", "keyPoints": ["❌ « Hier, ma sœur était heureuse, alors elle a descendu vite et elle a parti. » → ✅ `elle est descendue` (moved herself, +e) & `elle est partie` (+e)!"]}, {"level": 6, "name": "CREATE", "subtitle": "Write a 5-Sentence High School First-Day Flashback", "content": "Blend Imparfait feelings/setting with 3 sequenced Passé Composé events (`D'abord, Ensuite, Finalement`).", "keyPoints": ["Include at least 1 ÊTRE verb with agreement and 1 negative in Passé Composé!"]}], "questions": [{"id": "g9-fr-q1", "bloomLevel": 5, "bloomTag": "ANALYZE & CREATE", "title": "FSF1D Narrative Lab: First Day at High School (PC vs. Imparfait)", "prompt": "Write a 3-part Grade 9 French flashback about your first morning at Longfields-Davidson Heights S.S.:\n(a) **Setting & Emotion (Imparfait):** Describe the weather, how you felt (`être`), and what students were doing (`parler/marcher`).\n(b) **Sequenced Actions (Passé Composé):** Use `D'abord` + `arriver` (ÊTRE) and `Ensuite` + `sortir` WITH a direct object (`mon horaire` = AVOIR!).\n(c) **Negative Reflection:** State one thing you did NOT forget (`ne...pas` or `ne...jamais`) and one surprising thing that happened (`tout à coup...`).", "step1_deconstruct": {"instruction": "Keep (a) strictly Imparfait, watch ÊTRE vs. AVOIR on `arriver`/`sortir mon horaire` in (b), and wrap `n'...pas/jamais` around the helper verb in (c)!", "guidingQuestions": ["Which verb in (b) has a direct object (`mon horaire`) so it switches to AVOIR?", "Where do `n'` and `jamais` sit in `Je n'ai jamais oublié`?", "Did I match plural `-aient` for `les élèves` in Imparfait?"], "modelPlan": "(a) Il faisait beau, j'étais un peu nerveux et les élèves parlaient. (b) D'abord, je suis arrivé... Ensuite, j'ai sorti mon horaire. (c) Je n'ai pas oublié... tout à coup, j'ai retrouvé mes amis!"}, "step2_anchor": {"instruction": "FSF1D Rules:", "referenceItems": ["Imparfait plural: `les élèves parlaient` (`-aient`)", "`sortir` + object (`mon horaire`) → AVOIR (`j'ai sorti mon horaire`!)", "Negation wraps around helper verb: `Je n'ai jamais oublié`"]}, "step3_substeps": [{"label": "Step 3a: Part (a) — Weather, emotion & ongoing hallway scene (Imparfait)", "placeholder": "Le premier matin de neuvième année, il faisait... j'étais... et les élèves...", "hint": "Use `il faisait beau/frais`, `j'étais nerveux mais enthousiaste`, `les élèves parlaient`!", "modelSubAnswer": "« Le premier matin de neuvième année, il faisait frais, j'étais un peu nerveux mais curieux, et tous les élèves parlaient avec énergie dans les couloirs. »"}, {"label": "Step 3b: Part (b) — Sequenced actions (`arriver` ÊTRE + `sortir mon horaire` AVOIR)", "placeholder": "D'abord, je suis arrivé... Ensuite, j'ai sorti mon horaire...", "hint": "`arriver` = ÊTRE (`je suis arrivé`); `sortir mon horaire` has an object → AVOIR (`j'ai sorti`)!", "modelSubAnswer": "« D'abord, je suis arrivé à l'école secondaire quinze minutes en avance. Ensuite, j'ai sorti mon horaire de mon sac pour trouver ma classe de mathématiques. »"}, {"label": "Step 3c: Part (c) — Past Negative + Sudden Positive Twist (`tout à coup`)", "placeholder": "Heureusement, je n'ai pas oublié... Tout à coup, j'ai...", "hint": "Wrap `n'...pas` around `ai`, then finish with a sudden Passé Composé event!", "modelSubAnswer": "« Heureusement, je n'ai pas oublié mon cadenas ni mon dictionnaire! Tout à coup, j'ai aperçu mes meilleurs amis devant mon casier et nous avons ri ensemble! »"}], "step4_checks": ["Did I keep all scenery/emotions in Step 3a in L'Imparfait?", "Did I use `je suis arrivé` (ÊTRE) AND `j'ai sorti mon horaire` (AVOIR with object)?", "Did I place `n'...pas/jamais` directly around the helper verb `ai`?"], "step5_modelAnswer": {"basicAnswer": "Il faisait beau et j'étais nerveux. Je suis arrivé et j'ai sorti mon horaire. Je n'ai pas oublié.", "expandedAnswer": "FSF1D Level 4+ Flashback:\n« Le premier matin de neuvième année, il faisait frais, j'étais légèrement nerveux et des centaines d'élèves parlaient dans le hall principal. D'abord, je suis arrivé à l'école secondaire tôt pour m'orienter. Ensuite, j'ai sorti mon horaire de mon sac à dos pour repérer ma salle de sciences. Heureusement, je n'ai rien oublié! Tout à coup, j'ai vu mes amis près de mon casier et ma nervosité a disparu instantanément. »", "extensionPrompt": "Extension: Rewrite Step 3b from a female classmate's perspective (`Je suis arrivée` +e!)."}}]}, {"id": "g9-fr-u2", "title": "Unit 2: Le Conditionnel Présent ('Would') & Si-Clauses", "studyFirstTag": "Make polite requests (`Je voudrais`) & dream big (`Si j'avais..., j'irais...`)!", "curriculumStrand": "Ontario FSF1D: Hypothetical & Polite Expression (B1, D2)", "svgDiagram": "g9_french_adv_svg", "lessons": [{"id": "g9-fr-u2-l1", "title": "Lesson 2.1: Forming Le Conditionnel Présent & The Golden Si-Clause Formula", "readTime": "3 min read", "bigIdea": "**Le Conditionnel Présent** ('would do') is a brilliant mashup of two tenses you ALREADY know: take the **Futur Simple R-stem** + glue on the **Imparfait endings (`-ais, -ais, -ait, -ions, -iez, -aient`)**!", "paragraphs": ["Want to say 'I **would** travel', 'I **would** like' (`Je voudrais`), or 'We **would** build' (`Nous construirions`)? Zero new stems to memorize! Take the exact **Futur Simple stem** (`parler-`, `finir-`, `être → ser-`, `avoir → aur-`, `aller → ir-`, `faire → fer-`, `pouvoir → pourr-`, `vouloir → voudr-`) and attach the **Imparfait endings** (`-ais, -ais, -ait, -ions, -iez, -aient`)! Look how clean that is: `Je serais` (I would be), `J'irais` (I would go), `Nous ferions` (We would do)!", "Now master the #1 Grade 9 `FSF1D` exam formula — the **Hypothetical Si-Clause**: **`Si + IMPARFAIT  →  CONDITIONNEL PRÉSENT`**! Example: *« **Si j'avais** (Imparfait!) un million de dollars, **j'achèterais** (Conditionnel!) un gymnase communautaire et **j'irais** au Japon! »*", "NEVER fall into the English-translation trap of putting Conditionnel right after `Si`! You can NEVER say `Si j'aurais...` in standard French—remember the catchy rhyme: **'Les SI n'aiment pas les RAIS!'** (`Si` is ALWAYS followed by Imparfait, NEVER `-rais`!)"], "keyTakeaway": "Conditionnel = **Future Stem + Imparfait Endings** (`-ais, -ais, -ait, -ions, -iez, -aient`). Golden Rule: **`Si + IMPARFAIT → CONDITIONNEL`** (*Les 'si' n'aiment pas les '-rais'!*)", "deepReadTitle": "🌟 Top 6 FSF1D Conditionnel Power Stems", "deepReadText": "• vouloir → je voudrais (I would like — super polite!) | pouvoir → je pourrais (I could)\n• être → je serais | avoir → j'aurais | aller → j'irais | faire → je ferais\n• Golden Si-Clause: « Si j'étais directeur de l'école, j'ajouterais des terrains de basketball! »", "quickCheck": {"question": "Which sentence obeys the FSF1D Golden Si-Clause rule ('If I had more time, I would play trombone every day')?", "options": ["Si j'aurais plus de temps, je jouerais du trombone chaque jour.", "Si j'avais plus de temps, je jouerais du trombone chaque jour.", "Si j'avais plus de temps, je jouais du trombone chaque jour."], "correctIdx": 1, "explanation": "`Si` + **Imparfait** (`j'avais`, NEVER `j'aurais`!) → **Conditionnel** (`je jouerais`)!"}, "videos": [{"id": "fOmO3b4chW0", "title": "Comparing French Tenses: Conditional vs. Imperfect", "channel": "Learn French With Alexa", "why": "Makes the Future Stem + Imparfait Ending mashup crystal clear."}, {"id": "dc5axzEorGQ", "title": "Vouloir in the Conditional Tense (Je voudrais)", "channel": "Learn French With Alexa", "why": "Polite real-world French you can use immediately in class."}]}], "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Recall Conditionnel Formula & Si-Clause Rule", "content": "Memorize the mashup:", "keyPoints": ["Conditionnel = Future R-stem + `-ais, -ais, -ait, -ions, -iez, -aient`.", "Si-Clause: `Si + IMPARFAIT → CONDITIONNEL` (NEVER `-rais` right after `Si`!)."], "frenchAudioSamples": ["Si j'avais un million de dollars, j'aiderais ma communauté et je voyagerais en Europe.", "Bonjour Madame, je voudrais poser une question, s'il vous plaît."]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Explain How One Letter Separates Futur Simple from Conditionnel", "content": "Compare `J'irai` (I WILL go — certain!) vs. `J'irais` (I WOULD go — hypothetical!).", "analogy": "🛣️ Fork in the Road: Dropping the `-s` makes a real promise (`Je ferai`); adding `-s` opens a 'what-if' dream (`Je ferais`)!", "keyPoints": ["In Canadian French, watch your spelling (`-ai` vs `-ais`) carefully—they sound very close!"]}, {"level": 3, "name": "APPLY", "subtitle": "Build 2 Hypothetical Si-Clauses Step-by-Step", "content": "Apply `Si + Imparfait → Conditionnel`:", "workedExample": {"prompt": "If I were Prime Minister, I would build solar trains across Canada.", "steps": ["Clause 1 (`Si + Imparfait` of `être`): `Si j'étais premier ministre,`", "Clause 2 (`Conditionnel` of `construire`): `je construirais des trains solaires à travers le Canada!`"]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Imparfait vs. Futur Simple vs. Conditionnel", "content": "See all three side-by-side:", "comparisonTable": {"headers": ["Verb (`aller` / `Je`)", "Imparfait (Past)", "Futur Simple (Will)", "Conditionnel (Would)"], "rows": [["aller", "j'allais", "j'irai", "j'irais"], ["être", "j'étais", "je serai", "je serais"], ["faire", "je faisais", "je ferai", "je ferais"], ["avoir", "j'avais", "j'aurai", "j'aurais"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Catch the Famous 'Si j'aurais' Error!", "content": "Spot and fix this universal French trap:", "keyPoints": ["❌ « Si je serais riche, j'irais à Paris. » → ✅ « Si j'étais riche (Imparfait!), j'irais à Paris (Conditionnel!). »"]}, {"level": 6, "name": "CREATE", "subtitle": "Write a 3-Sentence 'Ideal School' Proposal Using Si-Clauses", "content": "Imagine redesigning Longfields-Davidson Heights S.S. using `Si j'étais directeur...`", "keyPoints": ["Use 1 Imparfait after `Si` + 3 distinct Conditionnel verbs!"]}], "questions": [{"id": "g9-fr-q2", "bloomLevel": 5, "bloomTag": "APPLY & CREATE", "title": "FSF1D Conditionnel & Si-Clause Architect ('If I Ran Ottawa...')", "prompt": "Complete these 3 Grade 9 French tasks using **Le Conditionnel Présent**:\n(a) Rewrite this blunt demand into a super-polite FSF1D request using `vouloir` (`voudr-`) and `pouvoir` (`pourr-`): « Donne-moi plus de temps pour le projet! »\n(b) Complete a hypothetical **Si-Clause** (`Si + Imparfait → Conditionnel`) about redesigning your school: `Si j'étais directeur de mon école...` (include 2 Conditionnel verbs!).\n(c) Spot and FIX both errors in this broken sentence: « Si j'aurais un billet gratuit, je vais aller à Montréal et je visiterai le Vieux-Port. »", "step1_deconstruct": {"instruction": "Polite Conditionnel in (a), strict `Si + Imparfait → Conditionnel` in (b), and error-detective fix in (c)!", "guidingQuestions": ["What are the Conditionnel forms of `pouvoir` (`vous`) and `vouloir` (`je`)?", "Does my `Si` clause use Imparfait (`j'étais`) instead of `je serais`?", "Why is `Si j'aurais` wrong in Part (c)?"], "modelPlan": "(a) Est-ce que vous pourriez me donner plus de temps? Je voudrais améliorer mon projet. (b) Si j'étais directeur, j'organiserais... et nous ferions... (c) Si j'avais (Imp)..., j'irais (Cond) et je visiterais (Cond)."}, "step2_anchor": {"instruction": "Conditionnel Rules:", "referenceItems": ["`vouloir` → `je voudrais` | `pouvoir` → `pourriez-vous`", "Golden Rule: `Si + IMPARFAIT → CONDITIONNEL` (Les 'si' n'aiment pas les '-rais'!)"]}, "step3_substeps": [{"label": "Step 3a: Turn the blunt demand into a polite Conditionnel request", "placeholder": "Excusez-moi, je voudrais... Est-ce que vous pourriez...", "hint": "Use `je voudrais` (I would like) and `est-ce que vous pourriez` (could you)!", "modelSubAnswer": "« Excusez-moi Madame, je voudrais bien réviser mon projet; est-ce que vous pourriez me donner un jour supplémentaire, s'il vous plaît? »"}, {"label": "Step 3b: Write a full Si-Clause (`Si j'étais directeur...` + 2 Conditionnel verbs)", "placeholder": "Si j'étais directeur de mon école, je ... et nous ...", "hint": "Try `j'ajouterais` (I would add), `je ferais` (I would make), or `nous aurions` (we would have)!", "modelSubAnswer": "« Si j'étais directeur de mon école secondaire, j'ajouterais des pistes cyclables sécuritaires et nous organiserions des tournois sportifs chaque vendredi après-midi! »"}, {"label": "Step 3c: Fix BOTH tense errors in « Si j'aurais..., je vais aller... et je visiterai... »", "placeholder": "Si j'avais un billet gratuit, j'...", "hint": "`j'aurais` → `j'avais` (Imparfait!); `vais aller` → `irais` (Conditionnel!); `visiterai` → `visiterais` (Conditionnel!)!", "modelSubAnswer": "« **Si j'avais** un billet gratuit, **j'irais** à Montréal et **je visiterais** le Vieux-Port! » (Fixed `aurais → avais` to Imparfait, and switched both result verbs to Conditionnel `-ais`!)"}], "step4_checks": ["Did I use `voudrais` / `pourriez` for polite tone in Step 3a?", "Did I obey `Si + Imparfait → Conditionnel` with ZERO `-rais` after `Si`?", "Did I fix BOTH clauses of Step 3c into exact Imparfait + Conditionnel?"], "step5_modelAnswer": {"basicAnswer": "Je voudrais plus de temps. Si j'étais directeur, j'ajouterais des sports. Si j'avais un billet, j'irais.", "expandedAnswer": "(a) « Bonjour! Je voudrais perfectionner mon travail; pourriez-vous m'accorder un peu plus de temps, s'il vous plaît? »\n(b) « Si j'étais directeur de Longfields-Davidson Heights, je moderniserais le gymnase, j'ouvrirais un studio de musique et nous ferions plus de sorties éducatives! »\n(c) Corrected: « **Si j'avais** un billet gratuit, **j'irais** à Montréal et **je visiterais** le Vieux-Port. »", "extensionPrompt": "Extension: Write 1 Si-clause with `nous` (`Si nous avions moins de devoirs, nous irions...`)."}}]}, {"id": "g9-fr-u3", "title": "Unit 3: Pronouns Y & EN + Relative Pronouns (Qui vs. Que)", "studyFirstTag": "Sound genuinely fluent by mastering `J'y vais!`, `J'en veux!`, and `Qui / Que`!", "curriculumStrand": "Ontario FSF1D: Pronouns & Complex Sentence Structure (B1, D2)", "svgDiagram": "g9_french_adv_svg", "lessons": [{"id": "g9-fr-u3-l1", "title": "Lesson 3.1: Pronouns `Y` vs. `EN` & Relative Pronouns `Qui` vs. `Que`", "readTime": "3 min read", "bigIdea": "**`Y`** replaces a place or `à + thing` (`à Ottawa` → `J'y habite` = I live *there*); **`EN`** replaces `de` or a quantity (`du pain / trois livres` → `J'en ai trois` = I have three *of them*)!", "paragraphs": ["In Grade 9 `FSF1D`, two tiny 1-to-2-letter pronouns make you sound like a native Francophone! First, **`Y`** ('there' / 'about it') replaces ANY location introduced by `à, au, à la, dans, en, chez, sur` (`Tu vas au gymnase?` → **`Oui, j'y vais!`**). Second, **`EN`** ('some' / 'of it' / 'of them') replaces `de, du, de la, des` OR anything counted with a number! Watch the cool number rule: `Tu as deux frères?` → **`Oui, j'en ai deux!`** (Keep the number `deux` at the end, and put `en` right before the verb!).", "Next, stop writing choppy 2-sentence paragraphs by joining ideas with **Relative Pronouns `QUI` and `QUE`** (both mean 'who / which / that'!):\n• Use **`QUI`** when a **VERB** comes immediately after it (Subject!): `J'ai un ami **qui joue** bien au soccer.`\n• Use **`QUE` (`QU'` before a vowel!)** when a **SUBJECT + VERB** come after it (Object!): `Voici le livre **que j'ai** lu!`", "Notice the 1-second exam shortcut: peek right AFTER the blank! See a **Verb** (`est, parle, aime`)? Drop in **`QUI`**! See a **Subject** (`je, tu, il, Zaid, les élèves`)? Drop in **`QUE / QU'`**!"], "keyTakeaway": "`Y` = replaces `à/dans/chez + place` (`J'y vais`). `EN` = replaces `de/du/des` or numbers (`J'en ai trois`). **`QUI` + Verb** vs. **`QUE` + Subject**!", "deepReadTitle": "⚡ 1-Second FSF1D Pronoun Decision Check", "deepReadText": "• Place (`au Canada`, `à l'école`) → **`Y`** (`J'y vais!`, `Nous y habitons!`)\n• `de` or Quantity (`des pommes`, `trois cours`) → **`EN`** (`J'en mange!`, `J'en ai trois!`)\n• Blank followed by VERB → **`QUI`** | Blank followed by SUBJECT → **`QUE / QU'`**!", "quickCheck": {"question": "Pick the exact pronouns: (1) « Tu vas à Québec? Oui, j'____ vais! » and (2) « C'est le film ____ j'adore! »", "options": ["(1) en  |  (2) qui", "(1) y  |  (2) que", "(1) y  |  (2) qui"], "correctIdx": 1, "explanation": "`à Québec` is a place (`à`) → **`y`** (`J'y vais!`). Right after the blank is subject `j'` (`j'adore`) → **`que`** (`le film que j'adore`)!"}, "videos": [{"id": "OHQPlvD1ypc", "title": "2 Common French Pronouns: Y vs. EN", "channel": "Learn French With Alexa", "why": "Crystal-clear examples of Y (places/à) vs. EN (de/quantities)."}, {"id": "GxxyR8P0pOI", "title": "Practise French Relative Pronouns: Qui vs. Que", "channel": "Learn French With Alexa", "why": "Locks in the 1-second Verb vs. Subject shortcut."}]}, {"id": "g9-fr-u3-l2", "title": "Lesson 3.2: Indirect Pronouns (`lui / leur`), Imperatives (`Donne-moi!`) & Pronoun Order", "readTime": "3 min read", "bigIdea": "In `FSF1D`, **`lui/leur`** replace `à + person`, positive **Imperatives** attach pronouns AFTER the verb with a hyphen (`Donne-**moi**!`, `Parle-**lui**!`), and negative imperatives pull them right back IN FRONT (`Ne **me** donne pas!`)!", "paragraphs": ["You mastered `Y` (places/`à + thing`) and `EN` (`de`/quantities). Now complete the entire Grade 9 `FSF1D` pronoun map by separating **`à + PERSON`** (**Indirect Object Pronouns: `me, te, lui, nous, vous, leur`**) from **`à + THING/PLACE`** (`y`)! Example: « Tu écris **à ta professeure**? » → « Oui, je **lui** écris! » (Person → `lui`!). « Tu penses **à ton examen**? » → « Oui, j'**y** pense! » (Thing → `y`!).", "Watch the cool **Imperative Command Flip**:\n• **Positive Command:** Pronoun jumps **AFTER** the verb with a hyphen—and `me/te` turn into strong **`moi/toi`**! Examples: **`Écoute-moi!`** (Listen to me!), **`Parle-lui!`** (Talk to him/her!), **`Allons-y!`** (Let's go there!), **`Manges-en!`** (Eat some!).\n• **Negative Command:** Pronoun snaps straight back **BEFORE** the verb inside `ne...pas` (`me/te` stay normal!): **`Ne m'oublie pas!`** • **`Ne lui parle pas!`**!", "Bonus `FSF1D` Pro Order (when 2 pronouns appear together): `me/te/nous/vous` → `le/la/les` → `lui/leur` → `y` → `en`! Example: « Tu me donnes le stylo? » → « Oui, je **te le** donne! » | « Je **le lui** donne! »"], "keyTakeaway": "`à + PERSON` → **`lui / leur`** (vs. `à + THING/PLACE` → `y`!). Positive command = **Verb-moi/lui** (`Aide-moi!`); Negative command = **Ne + me/lui + Verb + pas** (`Ne m'aide pas!`)!", "deepReadTitle": "🔁 Complete FSF1D Pronoun Order Chart", "deepReadText": "1. `me / te / se / nous / vous` → 2. `le / la / l' / les` → 3. `lui / leur` → 4. `y` → 5. `en` → [VERB]\n• Positive Command Flip: `Donne-le-moi!` | Negative: `Ne me le donne pas!`", "quickCheck": {"question": "How do you say **'Help me!'** (positive command) vs. **'Don't forget me!'** (negative command) in `FSF1D` French?", "options": ["M'aide!  |  Ne oublie-moi pas!", "Aide-moi!  |  Ne m'oublie pas!", "Aides-moi!  |  Ne moi oublie pas!"], "correctIdx": 1, "explanation": "Positive command drops `-s` on `Tu -ER` and attaches `-moi` after a hyphen (`Aide-moi!`); negative command pulls `m'` back before the verb inside `Ne...pas` (`Ne m'oublie pas!`)!"}, "videos": [{"id": "NxlzQgvPfvs", "title": "Direct and Indirect Object Pronouns (Lui / Leur)", "channel": "Learn French With Alexa", "why": "Contrasts lui/leur against le/la/les and y clearly."}, {"id": "-0n-d6IHzdg", "title": "French Imperative Commands + Pronouns", "channel": "Learn French With Alexa", "why": "Locks in positive vs. negative command pronoun flips."}]}], "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Recall Y, EN, Qui & Que Rules", "content": "Anchor these 4 Grade 9 pronouns:", "keyPoints": ["`Y` = place/`à + thing` (`J'y vais`) • `EN` = `de/du/des`/quantity (`J'en ai deux`).", "`QUI` + Verb (`l'élève qui travaille`) • `QUE/QU'` + Subject (`le livre que je lis`)."], "frenchAudioSamples": ["Tu habites à Ottawa? Oui, j'y habite depuis longtemps!", "Combien de cours as-tu? J'en ai quatre ce semestre!"]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Explain Why `QUI` Never Drops Its `-i` Before a Vowel", "content": "`QUE` shortens to `qu'` before vowels (`qu'il`), whereas `QUI` ALWAYS keeps its `i` (`qui est`, `qui habite`)!", "analogy": "🛡️ Shield Rule: The letter `'i'` in `QUI` wears armour—never write `qu'est` when you mean `qui est`!", "keyPoints": ["`Le professeur qui arrive` (keeps `i`) vs. `Le film qu'elle aime` (`que → qu'`)!"]}, {"level": 3, "name": "APPLY", "subtitle": "Combine Choppy Sentences with `Qui`, `Que`, `Y` & `EN`", "content": "Upgrade Grade 7 sentences to Grade 9 fluency:", "workedExample": {"prompt": "Join: « J'ai un cours de sciences. J'adore ce cours. » AND answer: « Tu manges des fruits? »", "steps": ["Joined (`j'` = subject after blank → `que`): « J'ai un cours de sciences **que** j'adore! »", "Answer (`des fruits` → `en` before verb): « Oui, j'**en** mange tous les jours! »"]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Direct (`le/la/les`), `Y`, and `EN`", "content": "Pick the exact pronoun every time:", "comparisonTable": {"headers": ["Replaced Phrase", "Pronoun", "Example Answer"], "rows": [["Direct object (`le film`)", "le / la / l' / les", "Oui, je **le** regarde."], ["Place or `à + thing` (`au parc`)", "**y**", "Oui, j'**y** vais."], ["`de/du/des` or quantity (`3 livres`)", "**en**", "Oui, j'**en** ai trois!"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Catch 2 Classic FSF1D Pronoun Blunders", "content": "Spot these exam traps:", "keyPoints": ["❌ « J'en ai » without keeping the number when asked 'How many?' → ✅ « J'en ai **quatre**! »", "❌ Writing `qu'est` instead of `qui est` → ✅ `L'élève **qui est** organisé`!"]}, {"level": 6, "name": "CREATE", "subtitle": "Write a 3-Line French Mini-Dialogue Using `Y`, `EN`, `Qui` & `Que`", "content": "Chat with a friend about Ottawa, Grade 9 classes, and sports.", "keyPoints": ["Use all 4 target pronouns naturally!"]}], "questions": [{"id": "g9-fr-q3", "bloomLevel": 5, "bloomTag": "APPLY & EVALUATE", "title": "FSF1D Pronoun Precision Lab (`Y`, `EN`, `Qui` & `Que`)", "prompt": "Complete all 3 Grade 9 French pronoun upgrades:\n(a) Answer BOTH questions using **`y`** OR **`en`** (watch quantities!):\n    1. « Est-ce que tu vas souvent à la bibliothèque? »\n    2. « Combien de cours de sciences ou de maths as-tu ce semestre? (answer with 2!) »\n(b) Combine EACH pair into ONE complex sentence using **`qui`** OR **`que / qu'`** (watch vowels!):\n    1. « Ottawa est une ville. Cette ville a de beaux parcs. »\n    2. « Voici la chanson. J'écoute cette chanson avant un match. »\n(c) Explain in 1 crisp sentence why `qu'il` drops its `-e`, while `qui arrive` NEVER drops its `-i`!", "step1_deconstruct": {"instruction": "Check `à la bibliothèque` (`y`), quantity `2` (`en ... deux`), Verb-vs-Subject after the blank (`qui` vs. `que`), and vowel elision rule!", "guidingQuestions": ["Does `à la bibliothèque` take `y` or `en`?", "Where does the number `deux` go when using `en`?", "What follows the blank in (b1) `a` (verb) vs. (b2) `j'écoute` (subject)?"], "modelPlan": "(a1) Oui, j'y vais souvent! (a2) J'en ai deux ce semestre! (b1) Ottawa est une ville qui a de beaux parcs. (b2) Voici la chanson que j'écoute avant un match. (c) `que` elides to `qu'` before vowels, whereas `qui` never elides so we can distinguish `qui` from `que`!"}, "step2_anchor": {"instruction": "Pronoun Rules:", "referenceItems": ["Place (`à/au/à la`) → `y` | Quantity (`2`) → `en` + number at end!", "`QUI` + Verb (never elides!) | `QUE/QU'` + Subject"]}, "step3_substeps": [{"label": "Step 3a: Answer (1) with `y` AND (2) with `en` + the number `deux`", "placeholder": "1. Oui, j'...\n2. J'... deux ce semestre.", "hint": "1. `Oui, j'y vais souvent!` | 2. `J'en ai deux ce semestre!`", "modelSubAnswer": "1. « Oui, **j'y vais** souvent pour étudier! »\n2. « **J'en ai deux** ce semestre! »"}, {"label": "Step 3b: Combine (1) with `qui` AND (2) with `que`", "placeholder": "1. Ottawa est une ville ... a de beaux parcs.\n2. Voici la chanson ... j'écoute avant un match.", "hint": "In (1), `a` is a VERB → `qui`! In (2), `j'` is a SUBJECT → `que`!", "modelSubAnswer": "1. « Ottawa est une ville **qui** a de beaux parcs. »\n2. « Voici la chanson **que** j'écoute avant un match. »"}, {"label": "Step 3c: Explain why `que` elides to `qu'` while `qui` NEVER drops its `-i`", "placeholder": "`que` becomes `qu'` before vowels, whereas `qui` never drops `-i` because...", "hint": "If BOTH became `qu'`, readers couldn't tell Subject `qui` from Object `que`!", "modelSubAnswer": "`Que` drops its `-e` to form `qu'` before a vowel (`qu'il`), whereas `qui` NEVER drops its `-i` (`qui arrive`, `qui a`) so that listeners and readers can always distinguish the subject pronoun `qui` from the object pronoun `que`!"}], "step4_checks": ["Did I keep `deux` at the end of `J'en ai deux`?", "Did I use `qui` before verb `a` (`qui a`, NOT `qu'a`!) and `que` before `j'écoute`?", "Did I clearly explain why `qui` never elides?"], "step5_modelAnswer": {"basicAnswer": "J'y vais. J'en ai deux. Ville qui a. Chanson que j'écoute.", "expandedAnswer": "(a) 1. « Oui, **j'y vais** souvent! » | 2. « **J'en ai deux** ce semestre! »\n(b) 1. « Ottawa est une ville **qui** a de beaux parcs. » | 2. « Voici la chanson **que** j'écoute avant un match. »\n(c) `Que` elides to `qu'` before a vowel, but `qui` NEVER elides—preserving the crucial sound and spelling distinction between subject (`qui`) and object (`que`).", "extensionPrompt": "Extension: Try turning « Non, je ne vais pas au cinéma » into a negative answer with `y`: « Non, je n'y vais pas! »"}}]}, {"id": "g9-fr-u4", "title": "Unit 4: FSF1D Persuasive Writing, Francophone Culture & Oral Fluency", "studyFirstTag": "Combine past, future, conditional & connectors into Grade 9 Honour-Roll French!", "curriculumStrand": "Ontario FSF1D: Intercultural Understanding & Integrated Writing (C1, D1)", "svgDiagram": "g9_french_adv_svg", "lessons": [{"id": "g9-fr-u4-l1", "title": "Lesson 4.1: Writing a Polished FSF1D Multi-Tense Opinion & Cultural Reflection", "readTime": "3 min read", "bigIdea": "To earn 90%+ in Grade 9 `FSF1D`, showcase **3 tenses + 2 connectors + 1 pronoun** inside one tight, error-checked French paragraph!", "paragraphs": ["Ontario high school French teachers look for **grammar range** (not just basic present tense!). Imagine writing about why bilingualism matters in Ottawa and Canada: weave in a **Past reference** (`Depuis la septième année, j'ai appris...`), a **Present argument with `qui/que`** (`Le bilinguisme est une compétence qui ouvre des portes...`), and a **Conditionnel/Futur vision** (`Si je continuais le français, je pourrais travailler partout au Canada!`).", "Grade 9 `FSF1D` also explores the rich global **Francophonie**—over 300 million French speakers across 5 continents, from **Franco-Ontarians** in Ottawa/Vanier and **Québec** to **Senegal, Morocco, France, Switzerland, and Haiti**!", "Before handing in ANY high school French assessment, run the **FSF1D 4-Point Polish**: (1) Check **verb endings** against subjects (`nous -ons`, `ils -ent`), (2) Check **gender & plural agreement** (`des opportunités intéressantes`), (3) Check **accents** (`é, è, ê, ç, à`), and (4) Read it **aloud**—your ear catches clunky mistakes immediately!"], "keyTakeaway": "FSF1D Honour-Roll Formula: **3 Tenses** (PC/Imp + Present + Futur/Cond) + **Connectors** (`D'abord, De plus, Cependant, En conclusion`) + **1 Pronoun** (`qui/que/y/en`) + **4-Point Polish**!", "deepReadTitle": "🌍 La Francophonie Vocab & Essay Starters", "deepReadText": "• La Francophonie = French-speaking world (Canada, France, Maroc, Sénégal, Haïti, Belgique, Suisse)\n• High-Value Starters: « Sans aucun doute... » (Without a doubt...) • « Ce qui est essentiel, c'est que... » (What is essential is that...)", "quickCheck": {"question": "Which sentence demonstrates Grade 9 `FSF1D` multi-tense + relative-pronoun mastery?", "options": ["Le français est bon. J'aime le français.", "Le bilinguisme est un atout qui m'aidera beaucoup; si je continuais le français, je pourrais voyager dans toute la Francophonie!", "Le bilinguisme est un atout qu'aidera moi si je continuerais."], "correctIdx": 1, "explanation": "Option B nails `qui` + Futur Simple (`m'aidera`) AND a flawless Si-Clause (`si je continuais` [Imp] → `je pourrais` [Cond])!"}, "videos": [{"id": "6HDCdU3yJtk", "title": "Mastering French Future Tenses for Fluency", "channel": "Learn French With Alexa", "why": "Helps blend future and conditional naturally in FSF1D essays."}]}], "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Recall the FSF1D 4-Point Polish & Francophonie Scope", "content": "Lock in high-school writing habits:", "keyPoints": ["4-Point Polish: 1) Verb endings • 2) Noun/Adj agreement • 3) Accents (`é/è/ç`) • 4) Read aloud!", "La Francophonie spans 5 continents (300M+ speakers, including Franco-Ontarians right in Ottawa!)."]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Explain Why Showing 3 Tenses Boosts Your FSF1D Rubric Level", "content": "Rubrics reward variety of sentence structures and verb tenses over length alone.", "analogy": "🎺 Music Solo Analogy: Playing one single note loudly isn't as impressive as weaving crisp dynamics, syncopation, and clean articulation across a full phrase!", "keyPoints": ["5 crisp multi-tense sentences outscore 12 repetitive present-tense sentences every time."]}, {"level": 3, "name": "APPLY", "subtitle": "Upgrade a Plain Paragraph with `Qui`, `Y`, and a Si-Clause", "content": "See the instant Level 4 transformation:", "workedExample": {"prompt": "Upgrade: « J'aime Montréal. Je vais à Montréal. Je veux étudier là. »", "steps": ["Add `qui` & `y`: « Montréal est une ville dynamique **qui** m'inspire et **j'y** suis allé l'été dernier. »", "Add Si-Clause: « **Si j'avais** l'occasion, **j'y étudierais** à l'université! »"]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Grade 8 vs. Grade 9 FSF1D Writing Standards", "content": "Know what high-school teachers expect:", "comparisonTable": {"headers": ["Skill", "Grade 8", "Grade 9 FSF1D Honour Roll"], "rows": [["Tenses", "Present + PC/Imp", "PC + Imp + Futur + Conditionnel Si-Clause"], ["Pronouns", "le/la/les", "le/la/les + y + en + qui/que"], ["Editing", "Basic spelling", "Agreement + accents + formal connectors"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Spot Hidden Accent & Agreement Errors", "content": "Catch tiny details that separate 85% from 95%:", "keyPoints": ["Watch `a` (has) vs. `à` (to/at), `ou` (or) vs. `où` (where), and feminine plural `-es` (`des cultures fascinantes`)!"]}, {"level": 6, "name": "CREATE", "subtitle": "Compose an FSF1D Capstone Paragraph on Bilingualism in Ottawa", "content": "Weave past experience, present value (`qui`), and a Conditionnel dream (`Si...`).", "keyPoints": ["Check all 4 Polish points before finishing!"]}], "questions": [{"id": "g9-fr-q4", "bloomLevel": 6, "bloomTag": "CREATE & EVALUATE", "title": "FSF1D Capstone Essay: Why Bilingualism & La Francophonie Matter", "prompt": "Write a 3-part Grade 9 `FSF1D` showcase paragraph on learning French in Ottawa:\n(a) **Past + Present (`qui/que`):** State how long you have studied French (`j'ai appris...`) and name ONE benefit using **`qui`** or **`que`**.\n(b) **Hypothetical Si-Clause (`Si + Imp → Cond`):** Describe a Francophone city/country you would visit (e.g., Québec, Paris, Maroc, Sénégal) and use pronoun **`y`**!\n(c) **Balanced Conclusion (`Cependant` + `En conclusion`):** Acknowledge one real challenge of learning a second language and conclude with a confident Futur Simple goal (`je continuerai / je réussirai`).", "step1_deconstruct": {"instruction": "Hit every FSF1D rubric target: Past + `qui/que` in (a), `Si + Imp → Cond` + `y` in (b), and `Cependant + En conclusion + Futur` in (c)!", "guidingQuestions": ["Did I include a relative pronoun (`qui`/`que`) in (a)?", "Did I avoid `-rais` right after `Si` and include `y` in (b)?", "Did I finish with a Futur Simple verb in (c)?"], "modelPlan": "(a) J'ai appris le français qui ouvre des portes. (b) Si j'avais la chance, j'irais à Québec et j'y visiterais... (c) Cependant, la grammaire demande de la pratique; en conclusion, je continuerai et je réussirai!"}, "step2_anchor": {"instruction": "FSF1D Rubric Checklist:", "referenceItems": ["`qui` + Verb | `que` + Subject", "`Si + Imparfait → Conditionnel` + `y` (there!)", "Connectors: `Cependant` + `En conclusion` + Futur Simple (`-ai`)"]}, "step3_substeps": [{"label": "Step 3a: Past learning + Present benefit using `qui` or `que`", "placeholder": "Depuis l'école intermédiaire, j'ai appris le français, une langue qui...", "hint": "Use `qui ouvre beaucoup de portes` or `que nous utilisons souvent à Ottawa`!", "modelSubAnswer": "« Depuis l'école intermédiaire, j'ai appris le français à Ottawa—une langue dynamique qui ouvre de nombreuses portes professionnelles et culturelles au Canada. »"}, {"label": "Step 3b: Si-Clause (`Si + Imparfait → Conditionnel`) + Pronoun `y`", "placeholder": "Si j'avais l'occasion de voyager, j'irais... et j'y...", "hint": "Example: `Si j'avais la chance, j'irais au Maroc ou à Montréal, et j'y découvrirais la gastronomie locale!`", "modelSubAnswer": "« Si j'avais l'occasion de voyager dans la Francophonie, j'irais à Montréal et au Maroc, et j'y découvrirais des cultures fascinantes tout en pratiquant mon français! »"}, {"label": "Step 3c: `Cependant` + `En conclusion` with Futur Simple goal", "placeholder": "Cependant, maîtriser... En conclusion, je continuerai...", "hint": "Mention grammar/pronunciation takes daily practice, then end with `En conclusion, je continuerai... et je réussirai!`", "modelSubAnswer": "« Cependant, maîtriser les temps de verbes demande de la patience et de la pratique régulière. En conclusion, je continuerai à pratiquer chaque semaine et je réussirai brillamment en FSF1D! »"}], "step4_checks": ["Did I include 3+ distinct tenses (Passé Composé, Present, Imparfait/Conditionnel, Futur Simple)?", "Did I accurately use BOTH a relative pronoun (`qui/que`) AND `y`?", "Did I double-check accents (`é, à, où`) and adjective agreement (`cultures fascinantes`)?"], "step5_modelAnswer": {"basicAnswer": "J'étudie le français. Si j'avais de l'argent, j'irais à Québec. Je vais continuer.", "expandedAnswer": "FSF1D 95%+ Showcase Paragraph:\n« Depuis la septième année, j'ai appris le français à Ottawa—une langue essentielle qui enrichit notre communauté bilingue. Si j'avais l'occasion de voyager dans la Francophonie, j'irais à Québec et au Maroc, et j'y rencontrerais des francophones passionnés tout en explorant l'histoire locale. Cependant, devenir vraiment bilingue exige de la persévérance quotidienne. En conclusion, je continuerai à utiliser mes stratégies de lecture et j'atteindrai un excellent niveau en français! »", "extensionPrompt": "Speaking Bonus: Read your complete FSF1D paragraph aloud smoothly in 30 seconds!"}}]}]}, {"id": "geo", "code": "CGC1W (Grade 9 De-Streamed Canadian Geography)", "name": "Canadian Geography (CGC1W)", "friendlySub": "Landforms/Glaciation, Resources, Demographics & Liveable Cities", "teacher": "Grade 9 CGC1W", "status": "Priority High School Credit", "tier": "Tier 1: Priority Focus", "tierClass": "tier-urgent", "icon": "🗺️", "reportComment": "Complete Ontario 2024 De-Streamed Grade 9 Geography (CGC1W — mandatory high school credit): Physical Geography & Glaciation, Managing Canada's Resources & Clean Energy, Changing Demographics & Immigration, and Liveable Sustainable Communities.", "nextSteps": ["Master Canada's 7 Landform Regions, Geologic Eras, and how the Laurentide Ice Sheet carved Ontario's lakes", "Analyze Canada's 4 Economic Sectors, Energy Transition, and Indigenous Land Stewardship", "Connect Demographic Transition, Immigration Points System, and Ottawa's Smart Growth planning"], "units": [{"id": "g9-geo-u1", "title": "Unit 1 (Strand B): Physical Canada — Geologic Eras, Glaciation & 7 Landforms", "studyFirstTag": "How 4.6 billion years & massive Ice Age glaciers sculpted Canada's lakes and shields!", "curriculumStrand": "Ontario CGC1W Strand B: Interactions in the Physical Environment", "svgDiagram": "g9_cgc_svg", "lessons": [{"id": "g9-geo-u1-l1", "title": "Lesson 1.1: Geologic Eras, Glaciation & Canada's 7 Landform Regions", "readTime": "3 min read", "bigIdea": "Canada's landscape was forged across **4 Geologic Eras** (starting with the ancient **Precambrian Canadian Shield**) and freshly scraped just 10,000 years ago by the **2-km-thick Laurentide Ice Sheet**!", "paragraphs": ["Earth's 4.6-billion-year story splits into **4 Geologic Eras**: **Precambrian** (87% of Earth's history — formed the ancient granite **Canadian Shield** packed with nickel, gold, and copper), **Paleozoic** (shallow warm seas formed limestone, fossil fuels, and the **Appalachian Mountains**), **Mesozoic** (dinosaurs & the rising **Rocky Mountains**), and **Cenozoic** (Age of Mammals & the **Ice Ages**!).", "Just 15,000 years ago, nearly all of Canada lay buried under the **Laurentide Ice Sheet**—glaciers up to 3 km thick! Moving like giant cosmic bulldozers, glaciers scraped thin soil off the Canadian Shield (leaving bare rock & 2 million lakes!) and dumped rich fertile glacial till onto the **Great Lakes–St. Lawrence Lowlands**—which is WHY Southern Ontario & Ottawa have Canada's best farmland and highest population!", "Know all **7 Landform Regions of Canada**: (1) **Canadian Shield** (oldest rock, mining & hydro), (2) **Great Lakes–St. Lawrence Lowlands** (smallest region, >50% of Canada's population!), (3) **Interior Plains** (flat wheat & oil/potash), (4) **Western Cordillera** (young jagged Rocky & Coast Mountains), (5) **Appalachians** (old eroded rounded mountains), (6) **Hudson Bay–Arctic Lowlands** (flat wetland/permafrost), and (7) **Innuitian Mountains** (icy far-north peaks)."], "keyTakeaway": "Precambrian = Canadian Shield (minerals) → Cenozoic Glaciers scraped Shield soil onto the **Great Lakes–St. Lawrence Lowlands**, explaining why >50% of Canadians live in our smallest landform region!", "deepReadTitle": "🏔️ 7 Landform Regions & Ecozone Formula", "deepReadText": "• Ecozone = Landform + Climate + Soil + Vegetation + Wildlife + Human Activity (Canada has 15 terrestrial ecozones; Ottawa sits in the **Mixedwood Plains**!)\n• Old vs. Young Mountains: Appalachians = OLD, rounded & eroded | Western Cordillera (Rockies) = YOUNG, tall & jagged!", "quickCheck": {"question": "Why does the **Great Lakes–St. Lawrence Lowlands**—Canada's SMALLEST landform region—contain over 50% of Canada's entire population?", "options": ["It has the most gold mines and diamonds in North America.", "Glaciers deposited deep fertile soil, carved flat transport waterways (Great Lakes/St. Lawrence), and it enjoys a mild southerly climate.", "It is the only region without winter snow."], "correctIdx": 1, "explanation": "Fertile glacial soil + flat land for cities/farming + Great Lakes shipping + moderate southerly climate made it Canada's economic heartland!"}, "videos": [{"id": "Q_VFQUZ9oo4", "title": "Introducing the Landform Regions of Canada", "channel": "Super Simple Sheets", "why": "Crisp overview of all 7 Canadian landform regions."}, {"id": "IYQaSwn-hc0", "title": "What Was the Laurentide Ice Sheet?", "channel": "Simply Science", "why": "Explains how Ice Age glaciers carved the Great Lakes and Canadian Shield."}]}, {"id": "g9-geo-u1-l2", "title": "Lesson 1.2: Canada's Climate Regions (Maritime vs. Continental) & Natural Hazards", "readTime": "3 min read", "bigIdea": "A **Maritime Climate** (Vancouver/Halifax) has a small temperature range (`<25°C`) and heavy rain (`>1000 mm`), a **Continental Climate** (Ottawa/Winnipeg) has big winter-summer swings (`>25°C`)—and knowing Canada's **Natural Hazards** saves lives!", "paragraphs": ["In Grade 9 `CGC1W` Strand B, you classify ANY Canadian city's climate graph in 5 seconds using two thresholds:\n• **Temperature Range (`Max Temp − Min Temp`):** **`< 25°C` = Maritime** (ocean moderates temperature!); **`≥ 25°C` = Continental** (inland extremes—Ottawa swings from `−10°C` Jan to `+21°C` Jul = `31°C` Continental!).\n• **Annual Precipitation:** **`> 1,000 mm` = Maritime** (moist ocean air); **`< 1,000 mm` = Continental** (drier inland—though watch the Great Lakes Snowbelt & Arctic Polar Desert!).", "Canada's diverse geography also creates distinct **Natural Hazards**—turning into **Natural Disasters** only when they hit vulnerable human communities:\n• **Pacific Coast (BC):** Subduction-zone **Earthquakes & Tsunamis** (Cascadia fault) + atmospheric river floods.\n• **Prairies & Southern/Eastern Ontario:** Summer **Tornadoes & Derechos** (like Ottawa's 2018 tornadoes & 2022 derecho!) plus **Ice Storms** (1998 Eastern Ontario/Quebec!) and spring **Ottawa River Floods**.\n• **Boreal & West:** Escalating **Wildfires** fuelled by hotter, drier summers!", "Geographers manage hazards with the **4-Step Emergency Cycle**: **Mitigation** (building codes, floodplains), **Preparedness** (72-hour home emergency kit!), **Response** (alerts/shelters), and **Recovery** (building back stronger!)."], "keyTakeaway": "Maritime (`Range < 25°C`, `Precip > 1000 mm`) vs. Continental (`Range ≥ 25°C`). Natural Hazards become Disasters when human vulnerability meets extreme events—prepare with **Mitigation + 72-Hr Kits**!", "deepReadTitle": "🌪️ Canada's Regional Natural Hazard Map", "deepReadText": "• BC Coast: Earthquakes, Tsunamis, Landslides | Prairies/Ontario: Tornadoes, Derechos, Ice Storms, Blizzards\n• Atlantic Canada: Hurricanes/Post-Tropical Storms | Boreal/West: Wildfires | Rivers: Spring Snowmelt Floods!", "quickCheck": {"question": "Winnipeg's average July temp is `+20°C`, January temp is `−16°C`, and annual precipitation is `520 mm`. What climate type is Winnipeg?", "options": ["Maritime Climate (Temp range = 4°C)", "Continental Climate (Temp range = 36°C ≥ 25°C, low inland precip < 1000 mm!)", "Tropical Climate"], "correctIdx": 1, "explanation": "Watch the negative subtraction! `20°C − (−16°C) = 36°C` (way above `25°C`) and `520 mm < 1000 mm` → classic **Continental Climate**!"}, "videos": [{"id": "-FBq5lE1Kz0", "title": "Natural Hazards (Crash Course Geography #27)", "channel": "CrashCourse", "why": "Explains hazards vs. disasters, human vulnerability, and smart mitigation."}]}], "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Recall the 4 Geologic Eras & 7 Landform Regions", "content": "Lock in CGC1W Strand B foundations:", "keyPoints": ["4 Eras: Precambrian (Shield) → Paleozoic (Appalachians/oil) → Mesozoic (Rockies) → Cenozoic (Ice Ages/humans).", "Ottawa sits in the **Great Lakes–St. Lawrence Lowlands** / **Mixedwood Plains Ecozone**."]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Explain Why the Canadian Shield Is Poor for Farming Yet Rich for Industry", "content": "Glaciers scraped topsoil south, exposing ancient igneous/metamorphic rock full of metallic minerals and rushing rivers.", "analogy": "🧹 Snowplow Analogy: The Laurentide glacier acted like a giant snowplow—scraping bare Shield rock clean and piling all the rich topsoil down onto Southern Ontario!", "keyPoints": ["Result: Shield thrives on **mining, hydroelectricity, forestry & tourism**, not wheat farming!"]}, {"level": 3, "name": "APPLY", "subtitle": "Connect Physical Geography to Economic Careers Across 3 Regions", "content": "Link geology directly to jobs:", "workedExample": {"prompt": "Predict the #1 industry in: (1) Canadian Shield, (2) Interior Plains, (3) Western Cordillera.", "steps": ["(1) Shield → Mining (Sudbury nickel) & Hydro.", "(2) Interior Plains → Wheat farming, potash & energy.", "(3) Western Cordillera → Forestry, mountain tourism & Pacific port trade (Vancouver)."]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Old vs. Young Mountain Regions of Canada", "content": "Spot geological age from mountain shape:", "comparisonTable": {"headers": ["Feature", "Appalachian Mountains (East)", "Western Cordillera (West)"], "rows": [["Age Formed", "Paleozoic (~300M yrs old)", "Mesozoic/Cenozoic (~65M yrs old)"], ["Shape", "Lower, smooth, rounded valleys", "Tall, jagged, snow-capped peaks"], ["Reason", "Hundreds of millions of years of erosion!", "Still geologically young & uplifting!"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Evaluate Climate-Change Hazards Across Canadian Ecozones", "content": "Link warming to regional risks:", "keyPoints": ["Arctic: thawing permafrost damaging roads/runways • Boreal/West: intense wildfire seasons • Coasts: sea-level rise & storm surges!"]}, {"level": 6, "name": "CREATE", "subtitle": "Profile Ottawa's Mixedwood Plains Ecozone", "content": "Describe how Ottawa's landforms, rivers, and climate shape local housing, transit, and recreation.", "keyPoints": ["Connect flat Lowlands, Ottawa/Rideau Rivers, 4 distinct seasons, and nearby Gatineau Shield hills!"]}], "questions": [{"id": "g9-geo-q1", "bloomLevel": 4, "bloomTag": "ANALYZE & APPLY", "title": "CGC1W Physical Canada Lab: Glaciation, Landforms & Ecozones", "prompt": "(a) Explain how the **Laurentide Ice Sheet** simultaneously made the **Canadian Shield** difficult for farming AND turned the **Great Lakes–St. Lawrence Lowlands** into Canada's most populated region.\n(b) Compare the **Appalachian Mountains** and **Western Cordillera** by age, physical shape, and the geological process that explains their difference.\n(c) Name **2 climate-change physical hazards** impacting different Canadian ecozones today and suggest 1 adaptation strategy.", "step1_deconstruct": {"instruction": "Link glaciation to BOTH regions in (a), contrast mountain age/erosion in (b), and cite 2 regional climate hazards + 1 adaptation in (c).", "guidingQuestions": ["What did glaciers remove from the Shield vs. deposit in the Lowlands?", "Why are the Appalachians smooth and rounded while the Rockies are jagged?", "How does permafrost thaw differ from Boreal wildfire risk?"], "modelPlan": "(a) Scraped Shield topsoil → bare rock/lakes (mining/hydro); dumped fertile glacial till + carved Great Lakes in Lowlands → agriculture/cities. (b) Appalachians = older (Paleozoic), heavily eroded/rounded; Cordillera = younger (Mesozoic), tall/jagged. (c) Arctic permafrost thaw + Western/Boreal wildfires; adapt via fire-resilient building & raised thermosyphon foundations."}, "step2_anchor": {"instruction": "CGC1W Anchors:", "referenceItems": ["Laurentide Ice Sheet scraped Shield → deposited fertile till in Lowlands", "Erosion rounds old mountains (Appalachians); tectonic uplift creates jagged young peaks (Cordillera)"]}, "step3_substeps": [{"label": "Step 3a: Explain the dual impact of the Laurentide Ice Sheet on the Shield vs. Lowlands", "placeholder": "On the Canadian Shield, glaciers...\nIn the Great Lakes–St. Lawrence Lowlands, glaciers...", "hint": "Mention scraping thin soil off the Shield (exposing minerals/lakes) and dumping fertile glacial till + carving Great Lakes waterways!", "modelSubAnswer": "• **Canadian Shield:** Heavy glaciers scraped away topsoil down to bare ancient rock and carved millions of lakes—making farming tough while exposing rich metallic minerals and rivers ideal for hydroelectricity.\n• **Great Lakes–St. Lawrence Lowlands:** Glaciers dumped deep, fertile glacial sediment and carved the Great Lakes shipping highway, supporting prime agriculture and over 50% of Canada's population."}, {"label": "Step 3b: Compare Appalachian Mountains vs. Western Cordillera (Age, Shape & Cause)", "placeholder": "Appalachians: ...\nWestern Cordillera: ...\nProcess causing difference: ...", "hint": "Paleozoic (~300M yrs, eroded smooth) vs. Mesozoic (~65M yrs, tall/jagged)!", "modelSubAnswer": "• **Appalachians (East):** Formed in the Paleozoic Era (~300M yrs ago); ~300 million years of weathering and glacial **erosion** wore them into lower, rounded hills.\n• **Western Cordillera (West):** Formed much later (Mesozoic/Cenozoic); still geologically young with tall, jagged, snow-capped peaks."}, {"label": "Step 3c: Identify 2 regional climate-change hazards in Canada + 1 smart adaptation", "placeholder": "Hazard 1 (Region): ...\nHazard 2 (Region): ...\nAdaptation: ...", "hint": "Examples: Arctic permafrost thaw buckling roads + Boreal/BC wildfires + Ottawa River spring flooding!", "modelSubAnswer": "1. **Arctic Ecozones (Permafrost Thaw):** Melting frozen ground cracks northern highways, runways, and buildings.\n2. **Boreal & Western Ecozones (Wildfires):** Hotter, drier summers spark mega-fires threatening towns and air quality across Ontario.\n• **Adaptation:** Build northern structures on raised thermosyphon pilings, create FireSmart buffer zones around forest towns, and expand urban wetlands to absorb Ottawa spring floods."}], "step4_checks": ["Did I connect the Laurentide Ice Sheet to BOTH the Shield AND the Lowlands?", "Did I explain erosion + geological age when comparing Appalachians vs. Cordillera?", "Did I match 2 climate hazards to specific Canadian regions + include a realistic adaptation?"], "step5_modelAnswer": {"basicAnswer": "Glaciers moved soil south so farms grew in Ontario. Rockies are newer than Appalachians. Fires and permafrost melt.", "expandedAnswer": "Part (a): The Laurentide Ice Sheet scraped topsoil off the Canadian Shield (leaving thin soil, lakes, hydro & mining) and deposited fertile glacial sediment while carving the Great Lakes in the Lowlands—powering agriculture, trade, and over half of Canada's population.\nPart (b): The Paleozoic Appalachians are smooth and rounded after 300M years of erosion, whereas the younger Mesozoic Western Cordillera remains tall and jagged.\nPart (c): Arctic permafrost thaw destabilizes northern infrastructure while hotter Boreal/Western summers intensify wildfires; adapting requires FireSmart buffers, permafrost-safe foundations, and urban flood wetlands.", "extensionPrompt": "Extension: Why do earthquakes occur along British Columbia's Pacific coast (Juan de Fuca plate) while Ottawa experiences only minor intraplate tremors?"}}]}, {"id": "g9-geo-u2", "title": "Unit 2 (Strand C): Managing Canada's Resources, Clean Energy & Stewardship", "studyFirstTag": "Evaluate Canada's energy mix, critical minerals, trade & Indigenous land stewardship!", "curriculumStrand": "Ontario CGC1W Strand C: Managing Canada's Resources & Industries", "svgDiagram": "g9_cgc_svg", "lessons": [{"id": "g9-geo-u2-l1", "title": "Lesson 2.1: Canada's Energy Mix, Critical Minerals & Indigenous Stewardship", "readTime": "3 min read", "bigIdea": "Over **80% of Canada's electricity** already comes from non-emitting sources (**~60% Hydro + ~15% Nuclear + Wind/Solar**)—yet decarbonizing transport, heating, and mining requires balancing economic jobs, climate targets, and **Indigenous FPIC**!", "paragraphs": ["In Grade 9 `CGC1W`, you evaluate real resource trade-offs across Canada's **4 Economic Sectors** (Primary, Secondary, Tertiary, Quaternary). Canada is a global superpower in **Critical Minerals** (nickel, lithium, cobalt, copper mined in Northern Ontario's Shield & Ring of Fire!) needed for EV batteries, wind turbines, and solar panels—while also being a major oil/gas producer in Alberta, Saskatchewan, and Newfoundland.", "Look at **Ontario's Electricity Grid**: ~55–60% comes from carbon-free **Nuclear** (Bruce, Darlington, Pickering), ~25% from **Hydroelectricity** (Niagara & Ottawa River dams!), and growing **Wind/Solar**, with natural gas covering peak winter/summer demand. Every energy source carries trade-offs: hydro floods river valleys, nuclear requires safe long-term waste storage, and wind/solar need grid-scale battery storage!", "Modern Canadian resource decisions MUST respect **Indigenous Rights & Stewardship**—including **Free, Prior, and Informed Consent (FPIC)** and **Two-Eyed Seeing** (combining Indigenous traditional ecological knowledge with Western science). Indigenous-led Guardians programs across Canada already protect forests, salmon rivers, and biodiversity while building sustainable local jobs!"], "keyTakeaway": "Canada's electricity is >80% non-emitting (Hydro + Nuclear + Renewables). Sustainable resource planning balances **Economy + Environment + Indigenous Stewardship (FPIC)**!", "deepReadTitle": "⚡ Energy Trade-Off Snapshot (Ontario & Canada)", "deepReadText": "• Hydro (~60% of Canada): Renewable, low CO₂, reliable | Trade-off: floods habitats/Indigenous lands\n• Nuclear (~55% of Ontario): Zero CO₂, 24/7 baseload | Trade-off: costly to build, radioactive waste storage\n• Wind/Solar: Zero CO₂, falling costs | Trade-off: intermittent (needs battery/hydro backup!)\n• Fossil Fuels (Oil/Gas): High energy density, jobs | Trade-off: major greenhouse gas emitter!", "quickCheck": {"question": "Which two electricity sources supply the vast majority (~80%+) of **Ontario's** carbon-free electrical grid?", "options": ["Coal and Geothermal", "Nuclear power and Hydroelectricity", "Tidal power and Biomass"], "correctIdx": 1, "explanation": "Ontario phased out coal completely in 2014! Today, **Nuclear** (~55–60%) and **Hydroelectricity** (~25%) power the vast majority of Ontario's clean grid!"}, "videos": [{"id": "ksA4W8SRSOI", "title": "Economic Sectors Explained (Primary to Quaternary)", "channel": "Heimler's History", "why": "Sharp high-school overview connecting raw extraction to tech/services."}]}], "bloomLadder": [{"level": 1, "name":
