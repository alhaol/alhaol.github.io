lip:", "keyPoints": ["❌ `(Hinton, p. 42.)` → ✅ `(Hinton 42).` (no comma, no `p.`, period outside!)"]}, {"level": 6, "name": "CREATE", "subtitle": "Draft a Complete ENL1W Body Paragraph (P.E.E.L. + MLA 9)", "content": "Combine an analytical topic sentence, embedded quote with MLA citation, and 2 sentences of deep craft analysis.", "keyPoints": ["Check: Zero `'I/you'`, 100% Literary Present Tense, clean `(Author Page).`!"]}], "questions": [{"id": "g9-eng-q1", "bloomLevel": 5, "bloomTag": "EVALUATE & CREATE", "title": "ENL1W Essay Polish Lab: Analytical Thesis, Literary Present & MLA 9", "prompt": "(a) Upgrade this weak Grade 8 thesis into a formal Grade 9 **ENL1W Analytical Thesis** (3rd person, Literary Present Tense, naming technique + theme): *« In this essay I will prove that in the story 'The Bridge', the author showed that stubborn pride made two brothers fight. »*\n(b) Fix ALL 4 formatting/style errors in this draft sentence: *« When Marcus shouted \"I don't need anyone's help.\" it showed he was really scared of failing (Patel, p. 63.) »*\n(c) Explain in 2–3 sentences the difference between **Plot Summary** and **Literary Analysis**—giving 1 short example of each!", "step1_deconstruct": {"instruction": "Cut 1st person & past tense in (a), fix quote integration/tense/weak word/MLA in (b), and contrast summary vs. analysis in (c)!", "guidingQuestions": ["What technique could 'The Bridge' symbolize (e.g., broken bridge symbolism / dialogue)?", "What are the 4 errors in Part (b): tense, weak word, punctuation, MLA?", "How does analysis answer HOW and WHY instead of just WHAT?"], "modelPlan": "(a) Through the recurring symbol of the crumbling bridge, the author reveals that unchecked pride fractures family bonds until humility rebuilds trust. (b) Remove 'really', switch to Literary Present ('shouts', 'exposes'), integrate quote cleanly, fix MLA to `(Patel 63).`. (c) Summary retells events; Analysis argues how craft creates theme."}, "step2_anchor": {"instruction": "ENL1W Essay Rules:", "referenceItems": ["3rd Person + Literary Present Tense + Zero weak fillers (`really/very`)", "MLA 9: `(Patel 63).` — NO comma, NO `p.`, period AFTER closing parenthesis!"]}, "step3_substeps": [{"label": "Step 3a: Rewrite the weak thesis into a sharp **ENL1W Analytical Thesis**", "placeholder": "Through the recurring symbol of..., the author of 'The Bridge' reveals that...", "hint": "Cut `'In this essay I will prove'`, switch `showed` → `reveals`, and tie a literary craft (symbolism/conflict) to a universal theme!", "modelSubAnswer": "Through the recurring symbol of the weathered bridge and tense sibling dialogue, the author of 'The Bridge' reveals that stubborn pride fractures family bonds until mutual humility restores connection."}, {"label": "Step 3b: Repair ALL 4 errors in the quote sentence + MLA 9 citation", "placeholder": "When Marcus shouts that he '...', his outburst exposes... (Patel 63).", "hint": "Fix: `shouted/showed` → Literary Present (`shouts/exposes`); replace `'really scared'` → `'deeply afraid'`; fix MLA `(Patel, p. 63.)` → `(Patel 63).`!", "modelSubAnswer": "« When Marcus shouts, \"I don't need anyone's help,\" his defensive outburst exposes a deep fear of vulnerability (Patel 63). »"}, {"label": "Step 3c: Distinguish **Plot Summary** vs. **Literary Analysis** with 1 concrete example of each", "placeholder": "Plot Summary retells... Example: ...\nLiterary Analysis explains HOW/WHY... Example: ...", "hint": "Summary = WHAT happened; Analysis = HOW the author's diction/symbolism proves a deeper theme!", "modelSubAnswer": "• **Plot Summary** merely retells *what* happened (e.g., *'Marcus refuses his brother's hand and walks home alone.'*).\n• **Literary Analysis** argues *how* the author's specific craft proves a broader meaning (e.g., *'By contrasting Marcus's clenched fists with his brother's open palm, Patel underscores how wounded ego chooses isolation over reconciliation (Patel 64).'*)."}], "step4_checks": ["Did I remove 1st person (`I/my`) and write in **Literary Present Tense**?", "Is my MLA 9 citation formatted strictly as `(Patel 63).` (no comma, no `p.`, period outside)?", "Did I clearly prove the difference between Plot Summary and Literary Analysis?"], "step5_modelAnswer": {"basicAnswer": "The author uses the bridge to show pride hurts family. When Marcus shouts, it exposes his fear (Patel 63).", "expandedAnswer": "Part (a): Through the central symbol of a decaying bridge, the author of 'The Bridge' reveals that unchecked pride fractures family loyalty until vulnerability repairs trust.\nPart (b): « When Marcus shouts, \"I don't need anyone's help,\" his sharp denial exposes an underlying fear of failure (Patel 63). »\nPart (c): Plot summary recounts story events (*what* occurs), whereas literary analysis unpacks *how* specific imagery, dialogue, or symbolism builds universal thematic meaning.", "extensionPrompt": "Extension: Try citing Act 3, Scene 1, Line 106 of a Shakespeare play in strict MLA 9 format → `(3.1.106).`"}}]}, {"id": "g9-eng-u2", "title": "Unit 2: Shakespeare & Dramatic Craft (Iambic Pentameter, Soliloquy & Irony)", "studyFirstTag": "Unlock Shakespeare's heartbeat rhythm, dramatic irony & tragic flaws with zero fear!", "curriculumStrand": "Ontario ENL1W Strand C: Dramatic Literature & Shakespearean Texts", "svgDiagram": "g9_eng_tas_svg", "lessons": [{"id": "g9-eng-u2-l1", "title": "Lesson 2.1: Decoding Shakespeare — Iambic Pentameter, Soliloquies & Dramatic Irony", "readTime": "3 min read", "bigIdea": "Shakespeare isn't a foreign language—it's **Modern English** set to a **10-syllable heartbeat (`da-DUM da-DUM da-DUM da-DUM da-DUM`)** packed with **Soliloquies**, **Aside whispers**, and **Dramatic Irony**!", "paragraphs": ["Whether your Grade 9 `ENL1W` class reads *Romeo and Juliet*, *Twelfth Night*, or *A Midsummer Night's Dream*, four master tools unlock EVERY page! First, ignore line breaks and **read straight to the punctuation mark (`.` `?` `!`)**—Shakespeare splits normal sentences across rhythmic lines! Second, listen for **Iambic Pentameter**: 5 heartbeats = **10 syllables per line** (`But SOFT! What LIGHT through YON-der WIN-dow BREAKS?`). When a character breaks out of rhythm, their emotions just spiked!", "Know Shakespeare's 3 signature stage devices:\n1. **Soliloquy:** A character is **ALONE** onstage speaking their deepest private thoughts aloud to the audience.\n2. **Aside:** A quick whispered comment meant ONLY for the audience (other characters onstage pretend not to hear!).\n3. **Dramatic Irony:** When the **AUDIENCE knows a vital secret** that the characters onstage do NOT know—creating unbearable suspense (like knowing Juliet is only asleep from a potion while Romeo thinks she's dead!).", "In Shakespearean tragedies, also spot the **Tragic Flaw (*Hamartia*)**—a character trait like impulsiveness or blind pride that drives a noble hero toward catastrophe—and **Foils** (contrasting characters like hot-headed Tybalt vs. peacemaking Benvolio who spotlight each other's personalities!)."], "keyTakeaway": "Read to punctuation, NOT line-ends! **Soliloquy** = alone onstage; **Aside** = quick whisper to audience; **Dramatic Irony** = audience knows a secret characters don't!", "deepReadTitle": "🎭 Fast Shakespeare Word Translator", "deepReadText": "• `thou / thee / thy` = you / your | `wherefore` = **WHY** (NOT 'where'! 'Wherefore art thou Romeo?' = 'WHY do you have to be a Montague?!')\n• `hither / thither` = here / there | `ere` = before | `anon` = soon / right away!", "quickCheck": {"question": "In *Romeo and Juliet*, the audience knows Juliet took a sleeping potion and is ALIVE—yet Romeo walks into the tomb believing she is dead. Which dramatic device is this?", "options": ["An Aside", "Dramatic Irony (audience knows a crucial truth the character misses!)", "Comic Relief"], "correctIdx": 1, "explanation": "Whenever the audience holds critical knowledge that characters onstage lack—creating intense tension—that is **Dramatic Irony**!"}, "videos": [{"id": "I4kz-C7GryY", "title": "Romeo & Juliet Part 1: Pentameter & Drama (Crash Course Literature)", "channel": "CrashCourse", "why": "Fun, fast high-school guide to iambic pentameter, foils, and Shakespearean stagecraft."}]}, {"id": "g9-eng-u2-l2", "title": "Lesson 2.2: Poetry Analysis (`TP-CASTT`) & First Nations, Métis & Inuit Literary Voices", "readTime": "3 min read", "bigIdea": "Decode ANY high school poem effortlessly with **`TP-CASTT`** (Title → Paraphrase → Connotation → Attitude/Tone → **Shift!** → Title → Theme), and honour **First Nations, Métis & Inuit (FNMI) Storytelling** as a core pillar of Ontario's 2023 `ENL1W` curriculum!", "paragraphs": ["Never stare blankly at a Grade 9 poem on an exam! Run **`TP-CASTT`** like a checklist: **(T) Title** (predict before reading) → **(P) Paraphrase** (translate literally line-by-line!) → **(C) Connotation** (metaphors, imagery, sound devices like *alliteration* & *enjambment*) → **(A) Attitude/Tone** (speaker's emotion—note Speaker ≠ Poet!) → **(S) Shift** (spot the exact turning-point word like *'but', 'yet', 'suddenly'* or a stanza break!) → **(T) Title revisited** → **(T) Theme** (universal truth!).", "Ontario's **2023 `ENL1W`** curriculum centers **First Nations, Métis, and Inuit (FNMI) Voices** (authors like *Richard Wagamese*, *Cherie Dimaline*, *Drew Hayden Taylor*, and *Tanya Talaga*). Notice key narrative strengths in Indigenous literature: **Oral Storytelling Traditions** (passing history, ethics, and ecological stewardship across generations), **Relationality to Land** (land as a living teacher/relative rather than property), **Humour as Resilience**, and **Truth & Sovereignty**!", "When analyzing FNMI texts or poetry in `ENL1W`, respect distinct nations (*Anishinaabe/Algonquin* in Ottawa, *Haudenosaunee*, *Cree*, *Métis*, *Inuit*) rather than treating all Indigenous cultures as one single monolith!"], "keyTakeaway": "Poetry = **`TP-CASTT`** (ALWAYS spot the **Shift!** and separate **Speaker** from Poet). In **FNMI Literature**, notice Oral Tradition, Land Relationality, Humour/Resilience & Nation-specific voices!", "deepReadTitle": "📜 TP-CASTT + Sound Devices Quick Card", "deepReadText": "• TP-CASTT: Title → Paraphrase → Connotation → Attitude (Tone) → **Shift** → Title → Theme\n• Poetic Craft: Enjambment (sentence runs across line break) • Alliteration • Imagery • Metaphor • Tone vs. Mood\n• Ottawa Land Recognition Context: Unceded **Algonquin Anishinaabe** territory!", "quickCheck": {"question": "In the **`TP-CASTT`** poetry method, what does the **`S` (Shift)** tell you to hunt for?", "options": ["The spelling errors in the poem.", "A turning point in tone, time, stanza structure, or key pivot words ('but', 'yet', 'however') that unlocks the poem's deepest meaning!", "The poet's birth year."], "correctIdx": 1, "explanation": "Spotting the **Shift** (where the poem's mood, time, or perspective pivots) almost always points straight to the poem's core **Theme**!"}, "videos": [{"id": "LO21tYrTD8Y", "title": "The Elements of a Poem (Reading — Khan Academy)", "channel": "Khan Academy", "why": "Explains stanzas, speaker vs. poet, rhythm, and figurative shifts cleanly."}, {"id": "eZqw9Os2FE4", "title": "Indigenous Oral Storytelling Tradition in Canada", "channel": "Royal Saskatchewan Museum", "why": "Authentic Canadian example of oral tradition, land relationality, and teaching stories."}]}], "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Recall Iambic Pentameter, Soliloquy, Aside, Foil & Dramatic Irony", "content": "Lock in ENL1W drama terms:", "keyPoints": ["Iambic Pentameter = 5 beats / 10 syllables (`da-DUM` × 5) | `Wherefore` = WHY!", "Soliloquy = alone speech | Aside = audience whisper | Dramatic Irony = audience knows secret | Foil = opposite character."]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Explain Why Shakespeare Used Iambic Pentameter", "content": "Rhythm helped Elizabethan actors memorize thousands of lines quickly AND mimicked a pulsing human heartbeat!", "analogy": "🎵 Hip-Hop Beat Analogy: Just like a tight 4/4 rap flow makes lyrics hypnotic and memorable, iambic pentameter gave Shakespeare's actors an effortless rhythmic groove!", "keyPoints": ["When rhythm breaks suddenly, pay attention—the character is shocked, angry, or terrified!"]}, {"level": 3, "name": "APPLY", "subtitle": "Translate & Scan a Classic Line of Iambic Pentameter", "content": "Count the 10 beats:", "workedExample": {"prompt": "Scan `But soft! What light through yonder window breaks?`", "steps": ["`But SOFT / what LIGHT / through YON- / der WIN- / dow BREAKS?` → Exactly 5 iambs (10 syllables)!", "Modern meaning: 'Wait! What light is shining through that window over there?'"]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Monologue vs. Soliloquy vs. Aside", "content": "Never confuse these 3 speeches:", "comparisonTable": {"headers": ["Speech Type", "Who Is Onstage?", "Who Hears It?"], "rows": [["Monologue", "Other characters present", "Characters onstage AND audience"], ["Soliloquy", "Speaker is ALONE", "Audience ONLY (inner thoughts!)"], ["Aside", "Other characters present", "Audience ONLY (quick whispered secret!)"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Bust the #1 Misquoted Shakespeare Line (`Wherefore`!)", "content": "Look smart in every Grade 9 English class:", "keyPoints": ["`Wherefore art thou Romeo?` does NOT mean 'Where are you hiding?' — `wherefore` means **WHY** ('Why must you belong to my enemy's family?')!"]}, {"level": 6, "name": "CREATE", "subtitle": "Write a 4-Line Modern Soliloquy Revealing an Internal Dilemma", "content": "Let a character alone onstage wrestle with a tough Grade 9 choice—try matching 10-syllable beats!", "keyPoints": ["Include 1 vivid metaphor and reveal genuine private conflict!"]}], "questions": [{"id": "g9-eng-q2", "bloomLevel": 4, "bloomTag": "ANALYZE & APPLY", "title": "ENL1W Shakespeare Decoder: Dramatic Irony, Foils & Modern Translation", "prompt": "(a) Distinguish clearly between a **Soliloquy**, a **Monologue**, and an **Aside**—explaining why playwrights use each one.\n(b) Translate this Shakespearean passage into crisp modern English (remember what **`wherefore`** means and read to the punctuation!):\n*« O Romeo, Romeo! wherefore art thou Romeo? / Deny thy father and refuse thy name; / Or, if thou wilt not, be but sworn my love, / And I'll no longer be a Capulet. »* (2.2.33-36)\n(c) Explain how **Dramatic Irony** AND **Character Foils** heighten tension in a play (use *Romeo & Juliet* OR a movie/play you know!).", "step1_deconstruct": {"instruction": "Contrast the 3 speech types in (a), translate accurately (`wherefore = WHY!`) in (b), and explain BOTH Dramatic Irony & Foils in (c)!", "guidingQuestions": ["Is anyone else onstage during a Soliloquy vs. Monologue?", "What does `wherefore` mean (`WHY`, not `where`)?", "How do contrasting Foil characters make each other's traits pop?"], "modelPlan": "(a) Soliloquy = alone (inner truth); Monologue = long speech to other characters; Aside = brief whisper to audience. (b) Why must you be a Montague? Give up your family name—or promise your love and I'll give up being a Capulet. (c) Dramatic irony = audience knows secret creating suspense; Foil = opposite twin highlighting traits (Tybalt vs. Benvolio)."}, "step2_anchor": {"instruction": "Shakespeare Anchors:", "referenceItems": ["`wherefore` = WHY | `thy` = your | `thou wilt` = you will", "MLA Play Citation: `(2.2.33-36)` (Act.Scene.Lines)"]}, "step3_substeps": [{"label": "Step 3a: Contrast **Soliloquy**, **Monologue**, and **Aside** clearly", "placeholder": "Soliloquy: ...\nMonologue: ...\nAside: ...", "hint": "Focus on WHO is onstage and WHO can hear it!", "modelSubAnswer": "• **Soliloquy:** Spoken **alone** onstage to reveal unfiltered private thoughts to the audience.\n• **Monologue:** A long speech addressed **to other characters** onstage.\n• **Aside:** A brief whispered remark spoken directly to the audience while other characters onstage cannot hear."}, {"label": "Step 3b: Translate Juliet's lines (`2.2.33-36`) into clear modern English", "placeholder": "Modern English: Oh Romeo, WHY must you...", "hint": "`wherefore` = WHY! She asks him to give up his Montague name—or she will give up her Capulet name!", "modelSubAnswer": "« Oh Romeo, Romeo! **Why** do you have to be a Montague (Romeo)? Give up your father's family name—or, if you won't, simply promise me your love, and I will give up being a Capulet! »"}, {"label": "Step 3c: Explain how **Dramatic Irony** AND **Character Foils** heighten tension", "placeholder": "Dramatic Irony builds tension by...\nCharacter Foils heighten conflict by...", "hint": "Example: Audience knows Juliet is alive (Dramatic Irony); fiery Tybalt contrasts with peaceful Benvolio (Foils)!", "modelSubAnswer": "• **Dramatic Irony** forces the audience to watch characters walk into avoidable tragedy while holding a crucial secret (e.g., knowing Juliet is merely drugged asleep while Romeo buys poison), creating intense suspense.\n• **Character Foils** place sharply opposite personalities side-by-side (like hot-tempered Tybalt vs. calm peacemaker Benvolio), making each character's flaws and values stand out starkly!"}], "step4_checks": ["Did I accurately separate Soliloquy (alone) from Monologue (to others) and Aside (whisper)?", "Did I translate `wherefore` as **WHY** (NOT 'where')?", "Did I give concrete examples for BOTH Dramatic Irony and Character Foils?"], "step5_modelAnswer": {"basicAnswer": "Soliloquy is alone, monologue to others, aside whisper. Why are you Romeo? Give up your name. Dramatic irony adds suspense and foils contrast traits.", "expandedAnswer": "Part (a): A **Soliloquy** reveals private thoughts while alone onstage; a **Monologue** is an extended speech heard by other characters; an **Aside** is a quick secret whispered solely to the audience.\nPart (b): « Oh Romeo, why must you belong to the Montague family? Reject your family name—or simply swear your love, and I will abandon the Capulet name myself. » (2.2.33-36).\nPart (c): **Dramatic Irony** grips audiences by giving them fatal knowledge characters lack (e.g., Juliet's sleeping potion), while **Character Foils** (like aggressive Tybalt vs. peaceful Benvolio) spotlight key personality traits and tragic flaws.", "extensionPrompt": "Extension: Count the syllables in `Or, if thou wilt not, be but sworn my love` — exactly 10 syllables of crisp Iambic Pentameter!"}}]}, {"id": "g9-eng-u3", "title": "Unit 3: Persuasive Rhetoric — Aristotle's Ethos, Pathos & Logos", "studyFirstTag": "Persuade any audience (and spot clever ads!) using Ethos, Pathos & Logos!", "curriculumStrand": "Ontario ENL1W Strands A & D: Oral Rhetoric & Persuasive Media", "svgDiagram": "g9_eng_tas_svg", "lessons": [{"id": "g9-eng-u3-l1", "title": "Lesson 3.1: Mastering Ethos (Credibility), Pathos (Emotion) & Logos (Logic)", "readTime": "3 min read", "bigIdea": "For over 2,300 years, every great speech, commercial, and essay has relied on **Aristotle's Rhetorical Triangle**: **Ethos** (Trust/Credibility), **Pathos** (Emotion/Story), and **Logos** (Facts/Logic)!", "paragraphs": ["Whether you are delivering a Grade 9 speech or analyzing an advertisement, spot the **3 Pillars of Persuasion**:\n1. **Ethos (Ethics / Credibility):** Convinces the audience to TRUST the speaker's expertise, fairness, or character (*'As a pediatrician with 20 years at CHEO in Ottawa...'* or citing peer-reviewed studies and respectful counterclaims!).\n2. **Pathos (Passion / Emotion):** Connects emotionally through vivid storytelling, empathy, hope, or urgency (*'Picture a 12-year-old walking 3 km every dawn just to carry muddy water home...'*).\n3. **Logos (Logic / Data):** Proves the claim using hard numbers, statistics, cause-and-effect reasoning, and clear proof (*'Installing LED fixtures cuts school electricity consumption by 75% and pays back its cost in 14 months.'*).", "Great speakers **blend ALL THREE**—Logos alone feels robotic, Pathos alone feels manipulative, and Ethos alone lacks urgency! Also watch out for sneaky **Logical Fallacies**: **Bandwagon** (*'Everyone is buying it!'*), **Straw Man** (distorting an opponent's point), **Slippery Slope** (*'Allow one late pass and soon the whole school collapses!'*), and **Ad Hominem** (insulting the speaker instead of answering their evidence!)."], "keyTakeaway": "**Ethos** = Credibility/Trust • **Pathos** = Emotion/Story • **Logos** = Facts/Data/Logic. Blend all 3 in speeches—and spot fallacies (Bandwagon, Straw Man, Ad Hominem)!", "deepReadTitle": "🎤 Rhetorical Devices Power Booster", "deepReadText": "• Anaphora (Repeating opening words): *'We will learn, we will build, we will lead!'*\n• Rhetorical Question: *'How long can we afford to ignore clean water?'*\n• Rule of Three: Grouping ideas in punchy threes (*'faster, cleaner, and fairer'*)!", "quickCheck": {"question": "A charity speaker states: *'According to Statistics Canada, food bank visits rose 32% this year—yet just $10 supplies 30 healthy meals.'* Which appeal is strongest here?", "options": ["Logos (hard statistics & clear cost-to-impact logic!)", "Bandwagon fallacy", "Ad Hominem"], "correctIdx": 0, "explanation": "Citing exact statistics (`32%`, `$10 → 30 meals`) from Statistics Canada blends **Logos** (data/logic) backed by **Ethos** (credible source)!"}, "videos": [{"id": "3klMM9BkW5o", "title": "How to Use Rhetoric to Get What You Want (Ethos, Pathos, Logos)", "channel": "TED-Ed", "why": "Iconic Grade 9 TED-Ed video bringing Aristotle's triangle alive."}]}], "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Recall Ethos, Pathos, Logos & 4 Logical Fallacies", "content": "Lock in Aristotle's Triangle:", "keyPoints": ["Ethos (credibility) • Pathos (emotion) • Logos (data/logic).", "Fallacies: Bandwagon • Straw Man • Slippery Slope • Ad Hominem."]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Explain Why Balanced Persuasion Beats Pure Pathos", "content": "Emotional stories grab attention, yet critical audiences demand Logos data and Ethos credibility before changing their minds!", "analogy": "🔺 Tripod Analogy: A camera tripod needs all 3 legs—Ethos, Pathos, and Logos—or your argument tips over under scrutiny!", "keyPoints": ["Use Pathos to open your hook, Logos to prove body points, and Ethos through calm, cited fairness!"]}, {"level": 3, "name": "APPLY", "subtitle": "Craft One Ethos, One Pathos & One Logos Line for One Topic", "content": "Persuade the school to build a community garden:", "workedExample": {"prompt": "Build all 3 appeals for a school vegetable garden:", "steps": ["Ethos: 'Partnering with Ottawa Master Gardeners and our science department...'", "Pathos: 'Imagine students harvesting crisp tomatoes they planted with their own hands for local food banks!'", "Logos: 'A 20 m² raised bed produces over 90 kg of fresh produce each season for under $300.'"]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Ethical Persuasion vs. Manipulative Fallacies", "content": "Spot the line between smart rhetoric and tricks:", "comparisonTable": {"headers": ["Technique", "Honest Appeal", "Manipulative Fallacy"], "rows": [["Emotion", "True personal story (Pathos)", "Wild fear-mongering (Slippery Slope)"], ["Authority", "Relevant expert (Ethos)", "Celebrity with zero medical training!"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Spot 2 Logical Fallacies in Everyday Ads & Debates", "content": "Catch sneaky tricks fast:", "keyPoints": ["'Only uncool kids skip this sneaker!' = **Ad Hominem / Bandwagon**! 'If we shorten lunch by 5 min, soon they'll cancel recess forever!' = **Slippery Slope**!"]}, {"level": 6, "name": "CREATE", "subtitle": "Write a 60-Second Grade 9 Speech Opening Blending All 3 Appeals", "content": "Include Ethos, Pathos, Logos, plus 1 rhetorical device (Rule of Three or Anaphora!).", "keyPoints": ["Read it aloud with deliberate pauses for maximum vocal impact!"]}], "questions": [{"id": "g9-eng-q3", "bloomLevel": 6, "bloomTag": "ANALYZE & CREATE", "title": "ENL1W Rhetoric Studio: Ethos, Pathos, Logos & Fallacy Detector", "prompt": "You are pitching a **Free After-School Robotics & Sports Open Gym** to your school council.\n(a) Write **3 distinct persuasive sentences**—1 using **Ethos**, 1 using **Pathos**, and 1 using **Logos**—clearly labelling each.\n(b) Identify the exact **Logical Fallacy** in BOTH flawed statements below:\n    1. « Millions of teens already drink MegaFizz Soda—so you'd be silly not to switch! »\n    2. « If we allow students to retake one quiz, soon nobody will study and Canada's whole education system will collapse! »\n(c) Add a 2-sentence closing pitch using either **Anaphora** OR the **Rule of Three** for dramatic oral rhythm!", "step1_deconstruct": {"instruction": "Label Ethos/Pathos/Logos cleanly in (a), diagnose Bandwagon & Slippery Slope in (b), and deploy Anaphora or Rule of Three in (c)!", "guidingQuestions": ["Does my Ethos establish trustworthy credentials/partners?", "Which fallacy relies on 'millions do it' vs. 'extreme domino disaster'?", "How do Anaphora or Rule of Three create memorable cadence?"], "modelPlan": "(a) Ethos (teachers/coaches/OCDSB study), Pathos (belonging/joy of teamwork), Logos (cost/attendance data). (b1) Bandwagon; (b2) Slippery Slope. (c) Rule of Three / Anaphora closing!"}, "step2_anchor": {"instruction": "Rhetoric Anchors:", "referenceItems": ["Ethos = Trust/Credibility | Pathos = Emotion/Story | Logos = Numbers/Logic", "Bandwagon = 'Everyone does it!' | Slippery Slope = '1 tiny step → total disaster!'"]}, "step3_substeps": [{"label": "Step 3a: Write 1 **Ethos**, 1 **Pathos**, and 1 **Logos** sentence for the Open Gym/Robotics pitch", "placeholder": "Ethos: ...\nPathos: ...\nLogos: ...", "hint": "Ethos = supervised by teachers/coaches; Pathos = feeling included & energized after class; Logos = exact budget/participation stats!", "modelSubAnswer": "• **Ethos:** Backed by our physical education teachers, robotics mentors, and parent council, this supervised program guarantees a safe, structured space.\n• **Pathos:** Picture a nervous Grade 9 newcomer walking into the gym and finding their first real circle of friends over a pickup game or robot build.\n• **Logos:** Using existing school facilities costs under `$500` per year while boosting after-school physical activity and STEM participation by over `40%`."}, {"label": "Step 3b: Name the exact Logical Fallacy in BOTH flawed claims (1 & 2)", "placeholder": "1. ... because...\n2. ... because...", "hint": "1 = **Bandwagon** (popularity ≠ truth/health); 2 = **Slippery Slope** (wild chain reaction with zero proof)!", "modelSubAnswer": "1. **Bandwagon Fallacy:** Argues you should buy a sugary drink solely because 'millions of teens' do, rather than giving real nutritional proof.\n2. **Slippery Slope Fallacy:** Claims one small reasonable policy (1 quiz retake) will inevitably trigger a catastrophic collapse of the entire education system without evidence!"}, {"label": "Step 3c: Write a 2-sentence speech finale using **Anaphora** OR **Rule of Three**", "placeholder": "Closing pitch: ...", "hint": "Try repeating `'Together we can...'` (Anaphora) or finishing with `'healthier, sharper, and more connected'` (Rule of Three)!", "modelSubAnswer": "« Together we can open our doors, together we can spark curiosity, and together we can build a community where every student belongs. Investing in this program makes our school healthier, sharper, and stronger! »"}], "step4_checks": ["Did I clearly separate Ethos (trust), Pathos (emotion), and Logos (numbers/logic)?", "Did I accurately diagnose BOTH Bandwagon and Slippery Slope?", "Did my closing include unmistakable Anaphora or Rule of Three rhythm?"], "step5_modelAnswer": {"basicAnswer": "Teachers support it (Ethos), kids make friends (Pathos), costs under $500 (Logos). Bandwagon and Slippery Slope.", "expandedAnswer": "Part (a): Ethos (endorsed by certified coaches & STEM teachers), Pathos (newcomer finding belonging after school), Logos (under `$500/yr` leveraging existing school gyms/labs for 40%+ higher engagement).\nPart (b): (1) **Bandwagon**; (2) **Slippery Slope**.\nPart (c): *« Together we can open our doors, together we can ignite creativity, and together we can make Longfields-Davidson Heights healthier, sharper, and more united! »*", "extensionPrompt": "Extension: Practice delivering Step 3c aloud—pause for 1 full beat right before the final three words!"}}]}, {"id": "g9-eng-u4", "title": "Unit 4: Parallel Syntax, Modifiers & Ethical AI Research Literacy", "studyFirstTag": "Make every sentence glide with Parallel Structure + master smart, ethical AI use!", "curriculumStrand": "Ontario ENL1W Strands A & B: Syntax Mastery & Ethical Digital Literacy", "svgDiagram": "g9_eng_tas_svg", "lessons": [{"id": "g9-eng-u4-l1", "title": "Lesson 4.1: Parallel Structure, Misplaced Modifiers & Ethical AI Literacy", "readTime": "3 min read", "bigIdea": "**Parallel Structure** matches grammar forms in every list (`to read, to write, and to think`—NOT `reading, writing, and to think`), and **Ethical AI Literacy** uses AI as a tutor/brainstormer—NEVER as a ghostwriter or unverified fact source!", "paragraphs": ["Two quick Grade 9 syntax upgrades instantly polish your prose:\n1. **Parallel Structure (Parallelism):** Items in a list or comparison MUST share the exact same grammatical form! ❌ *'Zaid enjoys playing trombone, basketball drills, and to code in Python.'* → ✅ *'Zaid enjoys **playing** trombone, **running** basketball drills, and **coding** in Python.'* (`-ing, -ing, -ing` — smooth as glass!)\n2. **Fix Misplaced/Dangling Modifiers:** Keep descriptive phrases right next to the noun they describe! ❌ *'Walking into the cafeteria, the pizza smelled delicious.'* (Wait—the *pizza* was walking?! 😂) → ✅ *'Walking into the cafeteria, **Zaid smelled** the delicious pizza!'*", "In Ontario's brand-new **2023 ENL1W curriculum**, **Ethical AI Literacy** is an essential high school skill! AI chatbots can help you *check grammar*, *explain hard concepts*, or *quiz your understanding*—but they suffer from **AI Hallucinations** (confidently inventing fake book quotes, fake page numbers, and non-existent historical dates!).", "Golden High School Academic Integrity Rule: NEVER paste AI-generated paragraphs as your own work (plagiarism!). Always verify every quote/fact against the actual book or primary source, keep your own human voice, and follow your teacher's exact AI disclosure policy!"], "keyTakeaway": "Match list verb forms (**Parallelism**: `-ing, -ing, -ing`), keep modifiers beside their real subject, and NEVER trust unverified AI quotes or submit AI writing as your own!", "deepReadTitle": "🤖 Ethical AI Use vs. Academic Dishonesty", "deepReadText": "• ✅ Smart Study Uses: Asking for a practice quiz, clarifying a tough grammar rule, getting feedback on your own outline\n• ❌ Academic Dishonesty / Risk: Letting AI write your essay, trusting invented MLA quotes ('hallucinations'!), skipping real reading!", "quickCheck": {"question": "Which sentence has **flawless Parallel Structure** AND zero **Dangling Modifiers**?", "options": ["Running across the field, the whistle blew loudly.", "To succeed in Grade 9, students must stay organized, asking questions, and to double-check answers.", "To succeed in Grade 9, students must stay organized, ask sharp questions, and double-check every answer."], "correctIdx": 2, "explanation": "Option C matches all 3 parallel verbs cleanly (`stay..., ask..., and double-check...`), whereas Option A has a dangling modifier (the whistle isn't running!) and Option B breaks parallelism!"}, "videos": [{"id": "2l2FgUrln1A", "title": "Parallel Structure (Syntax — Khan Academy)", "channel": "Khan Academy", "why": "Fast, crystal-clear practice matching grammatical patterns cleanly."}]}], "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Recall Parallelism, Modifier Placement & AI Hallucinations", "content": "Lock in Unit 4 skills:", "keyPoints": ["Parallelism = matching grammatical forms across lists (`-ing/-ing/-ing` or `verb/verb/verb`).", "AI Hallucinations = chatbots inventing fake quotes/page numbers → ALWAYS verify in the real book!"]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Explain Why Dangling Modifiers Create Unintentional Comedy", "content": "English attaches an opening `-ing` phrase straight to the very first noun after the comma!", "analogy": "🧲 Sticky-Note Rule: Whatever opening phrase comes before the comma (`Exhausted after gym, ...`) sticks directly onto the NEXT noun—make sure it's `Zaid`, NOT `the backpack`!", "keyPoints": ["Check every sentence starting with `-ing` or `After...` right at the comma!"]}, {"level": 3, "name": "APPLY", "subtitle": "Repair Both Broken Parallelism & a Dangling Modifier", "content": "Apply 2-second edits:", "workedExample": {"prompt": "Fix: `After studying all night, the math exam felt easy.`", "steps": ["Did the *math exam* study all night?! NO!", "Put the real person right after the comma: *`After studying all night, Zaid found the math exam manageable.`*"]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Ethical AI Tutoring vs. Plagiarism", "content": "Know the exact boundary in Ontario high schools:", "comparisonTable": {"headers": ["Action", "Ethical Learning?", "Why?"], "rows": [["'Quiz me on 5 Ohm's Law problems'", "✅ Ethical Study Tool", "Builds YOUR real brain mastery"], ["'Write my 5-paragraph ENL1W essay'", "❌ Plagiarism", "Violates academic honesty & steals your own learning"], ["Using an AI quote without checking the book", "❌ Hallucination Risk", "AI frequently invents fake quotes & page numbers!"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Spot a Fake AI-Hallucinated Citation", "content": "Verify every MLA quote directly against the actual text:", "keyPoints": ["Rule: If you didn't read the exact line with your own eyes on that exact page, NEVER put it in quotation marks!"]}, {"level": 6, "name": "CREATE", "subtitle": "Write a 3-Point Personal Academic Integrity Charter for Grade 9", "content": "Define how you'll use technology ethically while sharpening your own voice.", "keyPoints": ["Use Parallel Structure cleanly across all 3 points!"]}], "questions": [{"id": "g9-eng-q4", "bloomLevel": 5, "bloomTag": "EVALUATE & APPLY", "title": "ENL1W Syntax Polish & Ethical AI Research Audit", "prompt": "(a) Repair the **Parallel Structure** in this sentence: « Our Grade 9 robotics club focuses on designing clean prototypes, how to code Python loops, and we also test battery efficiency. »\n(b) Fix the hilarious **Dangling Modifier** in this sentence (and explain what it accidentally said!): « Driving through Ottawa's Greenbelt, three deer dashed across the snowy trail. »\n(c) A friend asks an AI chatbot for 3 quotes with MLA page numbers from a novel they didn't finish reading. Explain **2 serious risks** (1 technical, 1 academic) and suggest **1 ethical way** to use AI while studying instead!", "step1_deconstruct": {"instruction": "Match all 3 `-ing` verbs in (a), put the human driver right after the comma in (b), and address AI hallucinations + academic integrity in (c)!", "guidingQuestions": ["Can I align all 3 items in (a) as `designing..., coding..., and testing...`?", "Who was actually driving in (b)—the deer?!", "What happens when AI invents quotes/pages (hallucination)?"], "modelPlan": "(a) ...focuses on designing clean prototypes, coding Python loops, and testing battery efficiency. (b) Accidentally says the deer were driving! Fix: Driving through Ottawa's Greenbelt, we saw three deer dash... (c) Tech risk: AI hallucinations (fake quotes/pages); Academic risk: plagiarism/zero skill growth; Ethical swap: ask AI for comprehension study questions on chapters you actually read!"}, "step2_anchor": {"instruction": "Syntax & AI Rules:", "referenceItems": ["Parallelism: `designing..., coding..., and testing...`", "Modifier Check: The noun right after the comma MUST be the one doing the `-ing` action!"]}, "step3_substeps": [{"label": "Step 3a: Fix the broken **Parallel Structure** in the robotics club sentence", "placeholder": "Our Grade 9 robotics club focuses on designing..., coding..., and testing...", "hint": "Align all three phrases with `-ing` gerunds!", "modelSubAnswer": "« Our Grade 9 robotics club focuses on **designing** clean prototypes, **coding** Python loops, and **testing** battery efficiency. »"}, {"label": "Step 3b: Explain the accidental meaning AND fix the **Dangling Modifier**", "placeholder": "Accidental meaning: It sounds like the deer...\nFixed: Driving through Ottawa's Greenbelt, ...", "hint": "Put the real driver (`we` or `Zaid's family`) right after the comma!", "modelSubAnswer": "• **Accidental meaning:** Grammatically it claims that *three deer* were driving a car through the Greenbelt!\n• **Fixed:** « Driving through Ottawa's Greenbelt, **our family watched** three deer dash across the snowy trail. »"}, {"label": "Step 3c: Identify 1 technical + 1 academic risk of AI quotes & suggest 1 ethical AI habit", "placeholder": "Technical Risk (Hallucination): ...\nAcademic Risk: ...\nEthical Study Habit: ...", "hint": "AI frequently fabricates fake quotes/wrong page numbers (hallucination) + plagiarism/academic penalty; ethical swap = asking AI to quiz your understanding of passages you actually read!", "modelSubAnswer": "• **Technical Risk (Hallucinations):** AI chatbots routinely fabricate believable-sounding quotes or invent wrong MLA page numbers—instantly caught when a teacher checks the novel.\n• **Academic Risk:** Submitting unverified AI research violates academic integrity and robs you of real analytical reading skills.\n• **Ethical Study Habit:** Read the novel yourself, pull real page-verified quotes, and use AI only to quiz you on themes or flag grammar/parallelism mistakes in your own draft!"}], "step4_checks": ["Do all 3 items in Step 3a match (`designing, coding, testing`)?", "Does the real human driver sit immediately after the comma in Step 3b?", "Did I explain AI hallucinations, academic integrity, AND an ethical alternative?"], "step5_modelAnswer": {"basicAnswer": "Designing, coding, and testing. Deer weren't driving—we saw deer. AI makes up fake quotes; use it to quiz yourself instead.", "expandedAnswer": "Part (a): « Our Grade 9 robotics club focuses on **designing** clean prototypes, **coding** Python loops, and **testing** battery efficiency. »\nPart (b): The draft implies the *deer* were driving! Fix: « Driving through Ottawa's Greenbelt, **we spotted** three deer dashing across the snowy trail. »\nPart (c): Technically, AI models hallucinate fake quotes and wrong page numbers; academically, relying on AI instead of reading breaches honesty and weakens critical thinking. Ethically, read the real text and use AI strictly as a study quizzer or grammar coach.", "extensionPrompt": "Extension: Write 1 original sentence about your Grade 9 goals with flawless 3-item Parallel Structure!"}}]}]}, {"id": "tech", "code": "TAS1O (Grade 9 Mandatory Ontario Tech & Digital Credit)", "name": "Tech & Coding (TAS1O)", "friendlySub": "Engineering Design, Orthographic Drawing, Python & Cybersecurity", "teacher": "Grade 9 TAS1O", "status": "Mandatory Ontario Gr 9 Credit", "tier": "Tier 3: Mandatory Tech Credit", "tierClass": "tier-extra", "icon": "💻", "reportComment": "Ontario's Mandatory Grade 9 Technology & the Skilled Trades / Digital Innovations Credit (TAS1O / ICD2O): Engineering Design Process, Orthographic Multiview Technical Drawing, Python Programming Fundamentals (Loops, Conditionals & Functions), and Cybersecurity/Encryption!", "nextSteps": ["Follow the iterative Engineering Design Process (Empathize → Define → Ideate → Prototype → Test → Refine)", "Align Top, Front, and Right-Side Orthographic views cleanly with hidden dashed lines", "Write clean modular Python functions using variables, if/elif/else, and loops", "Apply Cybersecurity fundamentals: MFA, strong passphrases, phishing defense & encryption!"], "units": [{"id": "g9-tech-u1", "title": "Unit 1: Engineering Design Process & Orthographic Multiview Drawing", "studyFirstTag": "Think like an engineer—draw crisp Top/Front/Side blueprints & prototype smart!", "curriculumStrand": "Ontario TAS1O: Design Process, Technical Sketching & Workshop Safety", "svgDiagram": "g9_eng_tas_svg", "lessons": [{"id": "g9-tech-u1-l1", "title": "Lesson 1.1: The Iterative Design Process & 3-View Orthographic Projection", "readTime": "3 min read", "bigIdea": "Real engineers rarely nail a design on Draft 1—they iterate rapidly (**Prototype → Test → Refine**) and communicate exact dimensions with **3-View Orthographic Drawings (Top, Front, Right Side)**!", "paragraphs": ["Starting in 2024, **every Grade 9 student in Ontario** earns a **Technology credit (`TAS1O`)**! Whether designing a 3D-printed phone stand, a wooden shelf, or a clean-energy bridge, engineers follow the **Iterative Design Process**: (1) **Define Problem & Constraints** (budget, safety, materials, user needs), (2) **Ideate/Sketch** multiple ideas, (3) **Prototype** a fast test version, (4) **Test & Measure** failures honestly, and (5) **Iterate/Refine**!", "Why can't a machinist or 3D printer build a part from a single perspective art sketch? Because perspective distorts real lengths! Instead, engineers use **Orthographic Multiview Projection**—drawing three flat 90° views lined up in an `'L'` layout:\n• **Front View** (bottom-left): shows true **Width & Height**.\n• **Top View** (directly ABOVE Front): lines up vertically to share exact **Width & Depth**.\n• **Right-Side View** (directly RIGHT of Front): lines up horizontally to share exact **Height & Depth**!", "Know the 3 standard engineering line types: **Solid thick lines** = visible edges; **Dashed lines (`- - -`)** = **Hidden edges** (holes or steps behind a wall!); **Long-short-long lines (`— · —`)** = **Centerlines** of circular holes!"], "keyTakeaway": "Orthographic L-Layout: **Top** sits strictly above **Front** (same Width); **Right-Side** sits strictly right of **Front** (same Height). Solid = visible; Dashed (`---`) = hidden edge!", "deepReadTitle": "🛠️ Workshop Safety & Tolerance Quick Rules", "deepReadText": "• PPE First: Safety glasses on BEFORE touching any shop tool, tie back hair/hoodie strings!\n• Measure Twice, Cut Once: Always specify exact metric units (`mm`) & tolerances (`±0.5 mm`) on blueprints!", "quickCheck": {"question": "In a standard 3-View **Orthographic Technical Drawing**, what does a **dashed line (`- - -`)** represent?", "options": ["Where to fold the paper.", "A hidden edge or interior hole that exists behind the visible surface.", "An optional decorative stripe."], "correctIdx": 1, "explanation": "Dashed lines (`---`) indicate **hidden features** (like a drilled hole or back cutout) that you cannot see directly from that side!"}, "videos": [{"id": "_V_zL3lMz74", "title": "Orthographic Projection Multiview Drawing Basics", "channel": "mrdanielsos", "why": "Shows visually how Top, Front, and Side views project directly from one another."}]}], "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Recall Iterative Design Steps & Orthographic Line Types", "content": "Lock in TAS1O engineering basics:", "keyPoints": ["Design Loop: Define Constraints → Ideate → Prototype → Test → Iterate!", "Orthographic: Top above Front (aligned Width); Side right of Front (aligned Height); Dashed = Hidden edge."]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Explain Why Engineers Value 'Early Cheap Failures'", "content": "Testing a `$2` cardboard prototype catches fatal balance flaws before wasting `$200` of aluminum or 8 hours of 3D-printer filament!", "analogy": "✏️ Rough Draft Analogy: A cardboard prototype is the engineering version of a rough essay outline—fast, cheap, and easy to fix before final fabrication!", "keyPoints": ["Every failed test produces valuable measurement data!"]}, {"level": 3, "name": "APPLY", "subtitle": "Align 3 Orthographic Views of an L-Shaped Bracket", "content": "Check exact alignment:", "workedExample": {"prompt": "An L-bracket is `60 mm` wide, `40 mm` tall, and `30 mm` deep with a vertical hole through the base.", "steps": ["Front View: `60 × 40 mm` L-shape + **2 vertical dashed lines** showing the hidden hole!", "Top View (aligned directly above Front): `60 × 30 mm` rectangle + a solid circle for the hole!", "Right-Side View (aligned right of Front): `30 × 40 mm` rectangle + horizontal step line!"]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Perspective Art vs. Orthographic Blueprint", "content": "Know when to use each drawing style:", "comparisonTable": {"headers": ["Style", "Purpose", "True Measurable Lengths?"], "rows": [["2-Point Perspective (Arts)", "Realistic visual impression for clients", "❌ No (edges shrink toward VPs)"], ["Orthographic Multiview (Tech)", "Exact manufacturing / CAD fabrication", "✅ YES (every dimension true to scale!)"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Audit a Student Blueprint for 2 Classic Mistakes", "content": "Check before 3D printing or cutting:", "keyPoints": ["1. Misaligned Top/Front views (must project straight up!). 2. Missing metric dimensions (`mm`) or hidden dashed lines!"]}, {"level": 6, "name": "CREATE", "subtitle": "Define Constraints & Test Plan for a Grade 9 Trombone/Phone Desk Stand", "content": "List 3 engineering constraints + 1 objective stability test.", "keyPoints": ["Specify material budget, max width (`mm`), charging cable slot, and tilt-angle stability check!"]}], "questions": [{"id": "g9-tech-u1-q1", "bloomLevel": 5, "bloomTag": "APPLY & CREATE", "title": "TAS1O Engineering Lab: Design Constraints, Orthographic Views & Prototyping", "prompt": "Your TAS1O class is designing a **3D-printed ergonomic desk phone & tablet stand** for studying.\n(a) List **3 specific Engineering Constraints** (e.g., max dimensions in `mm`, charging-cable access, weight stability/centre of gravity).\n(b) Explain why engineers draw a **3-View Orthographic Blueprint** (Top, Front, Right-Side) instead of just a 2-Point Perspective sketch, AND state what **solid** vs. **dashed** vs. **centerlines** communicate.\n(c) Your first cardboard prototype tips backward when holding a heavy tablet! Apply the **Iterative Design Process** to diagnose the physics cause (Centre of Gravity!) and describe 2 exact design modifications before 3D printing.", "step1_deconstruct": {"instruction": "Give measurable constraints in (a), explain Orthographic alignment + 3 line types in (b), and iterate to fix tipping physics in (c)!", "guidingQuestions": ["Did I include measurable units (`mm`, angle `°`) in my constraints?", "Which views share Width vs. Height, and what does a dashed line mean?", "How do widening the base or lowering Centre of Gravity stop tipping?"], "modelPlan": "(a) Fits charging cable slot (15 mm), holds 600 g tablet at 60° without tipping, prints in <90 min / <50 g PLA. (b) True undistorted dimensions for manufacturing; solid = visible, dashed = hidden edge, long-short-long = circle centerline. (c) CG shifted behind back foot → extend back support lip & widen base/lower angle!"}, "step2_anchor": {"instruction": "Engineering Anchors:", "referenceItems": ["Top aligns above Front (same Width) • Side aligns right of Front (same Height)", "Solid = visible | Dashed (`---`) = hidden | `— · —` = centerline"]}, "step3_substeps": [{"label": "Step 3a: Specify 3 measurable **Engineering Constraints** for the study stand", "placeholder": "1. Geometry/Cable Constraint: ...\n2. Stability Constraint: ...\n3. Material/Time Constraint: ...", "hint": "Use concrete numbers (`mm`, grams, viewing angle `60°`, cable pass-through cutout)!", "modelSubAnswer": "1. **Ergonomics & Cable Access:** Holds phone/tablet at a `60°` viewing angle with a `15 mm × 25 mm` bottom cutout for charging cables.\n2. **Stability:** Supports up to `650 g` (tablet) while tapping the screen without tipping backward.\n3. **Print Efficiency:** Uses under `50 g` of PLA filament and prints cleanly without excess support waste."}, {"label": "Step 3b: Explain Orthographic Projection's advantage + all **3 standard line types**", "placeholder": "Orthographic beats perspective for building because...\nSolid = ... | Dashed = ... | Centerline = ...", "hint": "Perspective shrinks edges toward vanishing points; Orthographic preserves 100% true measurable lengths!", "modelSubAnswer": "Perspective art distorts real lengths toward vanishing points, whereas **Orthographic Projection** aligns Top, Front, and Right-Side views at exact 90° angles so every dimension is true to scale for CAD/fabrication.\n• **Solid Line:** Visible outside edges.\n• **Dashed Line (`- - -`):** Hidden interior edges or holes behind a surface.\n• **Centerline (`— · —`):** Exact axis of circles/drilled holes."}, {"label": "Step 3c: Diagnose the backward tipping failure & propose 2 iterative modifications", "placeholder": "Physics Cause: ...\nFix 1: ...\nFix 2: ...", "hint": "Connect back to Science Centre of Gravity! The tablet's CG fell behind the base edge → extend the rear foot farther back & add a slight front lip/wider base!", "modelSubAnswer": "• **Diagnosis:** The heavy tablet pushed the combined **Centre of Gravity** behind the back edge of the stand's base, causing it to topple backward.\n• **Iteration Fix 1:** Extend the rear base foot `35 mm` farther back (widening the base of support).\n• **Iteration Fix 2:** Lower the tablet cradle closer to the desk surface (lowering CG) and add a small rubber grip pad on the base before running the final 3D print!"}], "step4_checks": ["Are my 3 engineering constraints specific and testable (with real units)?", "Did I accurately define Solid, Dashed, AND Centerline types?", "Did I diagnose the tipping physics and iterate BEFORE wasting 3D-print filament?"], "step5_modelAnswer": {"basicAnswer": "Needs cable hole, holds tablet, cheap to print. Orthographic shows real sizes; dashed is hidden. Make base longer so it won't tip.", "expandedAnswer": "Part (a): Measurable constraints: (1) `60°` ergonomic angle + `15 mm` cable cutout, (2) supports `650 g` without tipping during touch input, (3) `<50 g` PLA filament.\nPart (b): Orthographic Top/Front/Side views preserve exact undistorted dimensions (unlike perspective art); solid lines show visible edges, dashed lines show hidden edges/holes, and centerlines locate circular axes.\nPart (c): Tipping occurred because the tablet moved the Centre of Gravity past the rear base edge; extending the rear base `35 mm` and lowering the cradle height solves stability cheaply on prototype #2 prior to final 3D printing.", "extensionPrompt": "Extension: What happens if you forget a `0.4 mm` clearance tolerance when designing two 3D-printed snap-fit parts? (They fuse too tight to assemble!)"}}]}, {"id": "g9-tech-u2", "title": "Unit 2: Computational Thinking & Python Programming Fundamentals", "studyFirstTag": "Write real Python variables, `if/elif/else`, `for` loops & reusable `def` functions!", "curriculumStrand": "Ontario TAS1O / ICD2O & MTH1W: Computational Thinking & Coding", "svgDiagram": "g9_eng_tas_svg", "lessons": [{"id": "g9-tech-u2-l1", "title": "Lesson 2.1: Python Building Blocks — Variables, Conditionals, Loops & Functions", "readTime": "3 min read", "bigIdea": "Every app, video game, and AI system in the world is built from just **4 core coding blocks**: **Variables** (data storage), **Conditionals** (`if/elif/else` decisions), **Loops** (`for/while` repetition), and **Functions** (`def` reusable mini-machines)!", "paragraphs": ["In Grade 9 Ontario Tech & Math (`TAS1O` / `MTH1W`), **Python** is the #1 starter language because it reads almost like clean English! Know your core **Data Types**: `int` (whole number `14`), `float` (decimal `3.14`), `str` (text in quotes `'Ottawa'`), and `bool` (`True` or `False`). Watch out for the classic rookie bug: `=` **ASSIGNS** a value (`score = 10`), whereas `==` **TESTS EQUALITY** (`if score == 10:`)!", "Use **Conditionals (`if / elif / else`)** so programs make smart decisions—and remember Python uses **4-space indentation** to show which lines belong inside an `if` or loop! For repetition, a **`for` loop** (`for i in range(1, 6):`) runs a fixed count (`1, 2, 3, 4, 5` — ALWAYS stops 1 before the end number!), while a **`while` loop** repeats until a condition turns `False` (always update your counter inside a `while` loop so you never create an infinite loop!).", "Finally, wrap reusable math or logic into a **Function (`def`)** with `return`: e.g., `def calc_hst(price): return round(price * 1.13, 2)`. Instead of retyping `* 1.13` twenty times across your program, call `calc_hst(40)` anywhere cleanly—that's **Decomposition & Abstraction**!"], "keyTakeaway": "4 Coding Pillars: **Variables** (`int/float/str/bool`), **Conditionals** (`if/elif/else`, test with `==`), **Loops** (`for`/`while`), and **Functions** (`def ... return`). Watch indentation & `range(a, b)` stopping at `b − 1`!", "deepReadTitle": "🐍 Python Syntax Error-Shield Card", "deepReadText": "• `=` assigns (`x = 5`)  |  `==` compares (`if x == 5:`)\n• `range(0, 4)` gives `0, 1, 2, 3` (4 numbers, stopping BEFORE 4!)\n• Always cast user text input before doing math: `age = int(input('Age? '))`!", "quickCheck": {"question": "What does this Python snippet print?\n`total = 0` | `for n in range(1, 4):` | `    if n != 2: total = total + n * 10` | `print(total)`", "options": ["60 (10 + 20 + 30)", "40 (runs n = 1, 2, 3; skips n = 2 → adds 10 + 30 = 40!)", "80 (runs n = 1, 2, 3, 4)"], "correctIdx": 1, "explanation": "`range(1, 4)` produces `1, 2, 3`. `if n != 2:` skips `2`, adding `1×10 + 3×10 = 40`!"}, "videos": [{"id": "94UHCEmprCY", "title": "Python For Loops & Tracing Basics", "channel": "Programming with Mosh", "why": "Super clean walkthrough of Python loop variables and range()."}]}], "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Recall Python Data Types, `=` vs. `==` & 4 Pillars", "content": "Lock in Python syntax:", "keyPoints": ["Types: `int`, `float`, `str`, `bool` | `=` assigns, `==` compares | `!=` means 'not equal'.", "Pillars: Variables • Conditionals (`if/elif/else`) • Loops (`for/while`) • Functions (`def/return`)."]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Explain Why `print()` Inside a Function Is Different from `return`", "content": "`print()` only displays words on screen, whereas `return` hands the calculated value back so other code can keep calculating with it!", "analogy": "🧮 Calculator Analogy: `print()` writes a number on a whiteboard; `return` passes the actual number into the next step of your equation!", "keyPoints": ["Always `return` results from math/science helper functions!"]}, {"level": 3, "name": "APPLY", "subtitle": "Trace a Python Function with a Loop Step-by-Step", "content": "Build a quick Trace Table:", "workedExample": {"prompt": "Trace `def ohms_current(v, r): return v / r` called inside `for r in [2, 4, 6]: print(ohms_current(12, r))`:", "steps": ["`r = 2` → `12/2 = 6.0` | `r = 4` → `12/4 = 3.0` | `r = 6` → `12/6 = 2.0`!"]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare `for` Loops vs. `while` Loops", "content": "Pick the exact loop for the job:", "comparisonTable": {"headers": ["Loop Type", "Best When...", "Classic Bug to Avoid"], "rows": [["`for` loop", "Exact count or list known (`range(10)`)", "Off-by-one (`range(1, 5)` stops at `4`!)"], ["`while` loop", "Repeat until user quits or goal met", "Forgetting to update condition → Infinite Loop!"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Debug 3 Classic Beginner Python Bugs", "content": "Catch syntax & logic errors fast:", "keyPoints": ["1. Missing colon `:` after `if/for/def`. 2. Using `=` instead of `==` inside `if`. 3. Forgetting `int()` around `input()` before adding numbers (`'5' + '5' = '55'`!)!"]}, {"level": 6, "name": "CREATE", "subtitle": "Write a Reusable Grade 9 Python Function for Ohm's Law or Ontario HST", "content": "Include clean parameters, edge-case `if` guard (`if r == 0`), and `return`.", "keyPoints": ["Guarding against dividing by zero prevents crashes!"]}], "questions": [{"id": "g9-tech-u2-q1", "bloomLevel": 5, "bloomTag": "APPLY & EVALUATE", "title": "TAS1O Python Lab: Bug Detective, Loop Tracing & Function Design", "prompt": "(a) **Bug Hunt:** Spot and FIX **3 bugs** in this broken Python code meant to check if a student passed (`>= 50`):\n`score = input('Enter score: ')`\n`if score = 50`\n`print('Exact pass!')`\n(b) **Loop Trace:** Build a trace table showing `i` and `savings` at every step, and state the final printed value:\n`savings = 100` | `for i in range(1, 4): savings = savings + 25 * i` | `print(savings)`\n(c) **Function Builder:** Write a clean 4–5 line Python function `def calc_current(volts, ohms):` that guards against `ohms == 0` (returning `'Error: Zero Resistance'`) and otherwise returns `volts / ohms`!", "step1_deconstruct": {"instruction": "Find 3 exact Python syntax/type bugs in (a), trace `i = 1, 2, 3` carefully in (b), and write properly indented `def/if/return` code in (c)!", "guidingQuestions": ["What data type does `input()` return (`str`, NOT `int`!)?", "What 2 syntax bugs sit on `if score = 50` + the `print` line?", "Does `range(1, 4)` include `4`? (NO: `1, 2, 3`!)"], "modelPlan": "(a) Bug 1: wrap `int(input(...))`; Bug 2: use `==` (or `>=`) + colon `:` at end of `if`; Bug 3: indent `print(...)` 4 spaces! (b) i=1→125, i=2→175, i=3→250! (c) Clean `def calc_current(volts, ohms):` with `if ohms == 0:` guard and `return volts / ohms`."}, "step2_anchor": {"instruction": "Python Syntax Rules:", "referenceItems": ["`int(input(...))` converts string input to integer", "`if condition:` needs `==` AND trailing colon `:` AND indented body!"]}, "step3_substeps": [{"label": "Step 3a: Identify & fix all **3 bugs** in the broken `score` Python snippet", "placeholder": "Bug 1: ...\nBug 2: ...\nBug 3: ...\nFixed Code: ...", "hint": "1. Missing `int(...)` around `input()`; 2. Used `=` instead of `==` (and missing colon `:`); 3. `print()` is not indented inside the `if` block!", "modelSubAnswer": "• **Bug 1:** `input()` returns a string (`str`) → wrap with `int(input(...))`.\n• **Bug 2:** Used assignment `=` instead of comparison `==` AND forgot the trailing colon `:`!\n• **Bug 3:** `print('Exact pass!')` must be **indented** (4 spaces) under `if`!\nFixed:\n`score = int(input('Enter score: '))`\n`if score == 50:`\n`    print('Exact pass!')`"}, {"label": "Step 3b: Trace `savings = 100` through `for i in range(1, 4): savings = savings + 25 * i`", "placeholder": "Start: savings = 100\ni = 1: 100 + 25(1) = ...\ni = 2: ...\ni = 3: ...\nFinal print = ...", "hint": "`i = 1` (+25 → 125) | `i = 2` (+50 → 175) | `i = 3` (+75 → 250)!", "modelSubAnswer": "• `i = 1`: `100 + 25(1) = 125`\n• `i = 2`: `125 + 25(2) = 175`\n• `i = 3`: `175 + 25(3) = 250` (`range(1, 4)` stops before `4`!)\n• Final printed value: **`250`**!"}, {"label": "Step 3c: Write the `def calc_current(volts, ohms):` Python function with zero-division guard", "placeholder": "def calc_current(volts, ohms):\n    if ohms == 0:\n        ...\n    return ...", "hint": "Use `if ohms == 0: return 'Error: Zero Resistance'`, then `return volts / ohms`!", "modelSubAnswer": "`def calc_current(volts, ohms):`\n`    if ohms == 0:`\n`        return 'Error: Zero Resistance'`\n`    return volts / ohms`"}], "step4_checks": ["Did I spot ALL 3 bugs (`int()`, `==` + `:`, and indentation)?", "Did my trace stop at `i = 3` and finish at `savings = 250`?", "Does my Python function use colons `:`, proper indentation, and `return` (not just `print`)?"], "step5_modelAnswer": {"basicAnswer": "Add int(), use == and :, indent print. Final savings = 250. Function checks ohms == 0 then returns volts / ohms.", "expandedAnswer": "Part (a): Fix (1) `int(input(...))`, (2) `==` and trailing colon `:` on `if score == 50:`, (3) 4-space indentation before `print('Exact pass!')`.\nPart (b): `i=1 → 125`, `i=2 → 175`, `i=3 → 250` → prints **`250`**.\nPart (c):\n`def calc_current(volts, ohms):`\n`    if ohms == 0:`\n`        return 'Error: Zero Resistance'`\n`    return volts / ohms`", "extensionPrompt": "Extension: What happens if you call `calc_current(12, 4)`? It returns `3.0` (`3 A` — connecting TAS1O Coding straight to SNC1W Ohm's Law!)"}}]}, {"id": "g9-tech-u3", "title": "Unit 3: Cybersecurity, Encryption & Digital Engineering Ethics", "studyFirstTag": "Outsmart phishing scams, understand HTTPS encryption & lock down accounts with MFA!", "curriculumStrand": "Ontario TAS1O / ICD2O: Digital Citizenship, Privacy & Cybersecurity", "svgDiagram": "g9_eng_tas_svg", "lessons": [{"id": "g9-tech-u3-l1", "title": "Lesson 3.1: CIA Triad, Phishing Defense, Multi-Factor Auth (MFA) & Encryption", "readTime": "3 min read", "bigIdea": "Even the world's strongest firewall can be beaten by ONE tricked click (**Phishing**) or ONE reused password—so cybersecurity pairs **Encryption** (`HTTPS`) with **Unique Passphrases + MFA**!", "paragraphs": ["Cybersecurity engineers protect systems using the **CIA Triad**: **Confidentiality** (keeping private data secret via encryption & passwords), **Integrity** (making sure data isn't secretly altered—like tampering with grades or bank balances!), and **Availability** (keeping hospitals, schools, and power grids online against ransomware/DDoS attacks!).", "Over 80% of real hacks start not with Hollywood matrix code, but with **Social Engineering & Phishing**—fake emails/texts pretending to be your bank, school IT, or a delivery service screaming *'URGENT! Account locked—click here in 10 minutes!'* Always check the **exact sender domain** (`support@ocdsb-verify99.xyz` ≠ `ocdsb.ca`!), hover over links before clicking, and NEVER reuse the same password on two sites!", "How does **Encryption** keep your password safe across public Wi-Fi? It scrambles readable **Plaintext** into unreadable **Ciphertext** using a mathematical key (e.g., **HTTPS** / public-key cryptography) so eavesdroppers see only random gibberish! Pair unique 14+ character **Passphrases** (`Blue-Trombone-Rideau-47!`) with **Multi-Factor Authentication (MFA)**—something you *know* (password) + something you *have* (authenticator code)—to block 99%+ of account takeovers!"], "keyTakeaway": "CIA Triad = **Confidentiality, Integrity, Availability**. Beat hackers with: (1) Spotting **Phishing** urgency/fake domains, (2) **Unique Passphrases + MFA**, and (3) **HTTPS Encryption**!", "deepReadTitle": "🔐 3-Second Phishing & Password Shield", "deepReadText": "• Phishing Clues: Fake urgency ('Act NOW!'), lookalike domain (`paypa1-secure.net`), generic greeting, surprise attachment!\n• Strong Passphrase: 4 random words + symbols (`Maple!Trombone74-Canal`) — never reuse across sites!\n• MFA = Password (Know) + Authenticator App/Key (Have)!", "quickCheck": {"question": "You receive an urgent text: *'OCDSB IT Alert: Your school account will be DELETED in 15 minutes unless you sign in at `http://ocdsb-login-reset.net`!'* What is the #1 red flag AND safest action?", "options": ["Click the link quickly so your homework isn't deleted.", "Fake urgent panic + lookalike unencrypted `http://` non-OCDSB domain → classic Phishing! Delete it and check official `ocdsb.ca` directly.", "Reply 'STOP' with your student ID and password to verify."], "correctIdx": 1, "explanation": "Manufactured panic (`15 minutes!`) + spoofed domain (`ocdsb-login-reset.net`) + missing `https://` = textbook Phishing!"}, "videos": [{"id": "bPVaOlJ6ln0", "title": "Cybersecurity (Crash Course Computer Science #31)", "channel": "CrashCourse", "why": "Explains CIA Triad, authentication, phishing, and real-world defense clearly."}, {"id": "jhXCTbFnK8o", "title": "Cryptography & Encryption (Crash Course Computer Science #33)", "channel": "CrashCourse", "why": "Demystifies plaintext, ciphertext, and public-key internet encryption."}]}], "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Recall CIA Triad, Phishing Clues, MFA & Encryption", "content": "Lock in cybersecurity pillars:", "keyPoints": ["CIA = Confidentiality • Integrity • Availability.", "Encryption turns Plaintext → Ciphertext | MFA = 2+ independent factors (Know + Have)."]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Explain Why Reusing ONE Great Password Everywhere Is Dangerous", "content": "If a tiny gaming forum gets hacked and leaks your email + password, bots instantly test that exact pair against your bank, email, and school accounts (**Credential Stuffing**)!", "analogy": "🔑 Master-Key Analogy: Using the same password everywhere is like making ONE physical key open your house, locker, bike lock, and bank vault—lose one and you lose ALL!", "keyPoints": ["Unique passphrases (stored safely in a password manager) + MFA shut down credential stuffing!"]}, {"level": 3, "name": "APPLY", "subtitle": "Decode a Classic Caesar Cipher (`+3` Shift) & See Why Modern Math Beats It", "content": "Try classical vs. modern encryption:", "workedExample": {"prompt": "Encrypt `'CAT'` with Caesar shift `+3` (A→D, B→E, C→F...):", "steps": ["`C → F`, `A → D`, `T → W` → Ciphertext = `'FDW'`!", "Why modern AES/RSA is stronger: A computer cracks all 25 Caesar shifts in 0.0001 seconds, whereas modern 256-bit keys have more combinations than atoms in the universe!"]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Symmetric vs. Public-Key (Asymmetric) Encryption", "content": "How HTTPS locks online shopping safely:", "comparisonTable": {"headers": ["Type", "Keys Used", "Analogy"], "rows": [["Symmetric (AES)", "1 shared secret key locks & unlocks", "Standard house key shared by 2 people"], ["Asymmetric / Public-Key", "Public key locks; Private key unlocks!", "Open padlock anyone can snap shut, ONLY you hold the private key!"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Audit a Suspicious Email for 3 Social-Engineering Tricks", "content": "Spot traps before clicking:", "keyPoints": ["1. Spoofed sender domain (`@amaz0n-support.co`). 2. Artificial 10-minute panic. 3. Suspicious `.zip`/`.exe` invoice attachment!"]}, {"level": 6, "name": "CREATE", "subtitle": "Write a 4-Step Home Cybersecurity Checklist for Your Family", "content": "Protect every phone and laptop in 10 minutes.", "keyPoints": ["Turn on MFA, use unique passphrases, install OS security updates promptly, and back up files offline!"]}], "questions": [{"id": "g9-tech-u3-q1", "bloomLevel": 5, "bloomTag": "ANALYZE & EVALUATE", "title": "TAS1O Cybersecurity Lab: CIA Triad, Phishing Audit & Encryption", "prompt": "(a) Match each real-world incident to the exact pillar of the **CIA Triad** (**Confidentiality**, **Integrity**, or **Availability**) and explain why:\n    1. Ransomware locks a hospital's scheduling servers offline for 3 days.\n    2. A hacker silently alters a student's transcript score from `72%` to `92%`.\n    3. Unencrypted medical files are leaked publicly online.\n(b) Explain why **reusing one strong password** across multiple sites is dangerous AND how **Multi-Factor Authentication (MFA)** stops stolen passwords.\n(c) Explain the difference between **Plaintext** and **Ciphertext**, and why **Public-Key Encryption (HTTPS)** makes online shopping safe even over coffee-shop Wi-Fi!", "step1_deconstruct": {"instruction": "Match all 3 CIA Triad pillars cleanly in (a), explain Credential Stuffing + MFA in (b), and explain Plaintext/Ciphertext + Public-Key HTTPS in (c)!", "guidingQuestions": ["Which CIA pillar means systems stay UP and accessible vs. unaltered vs. secret?", "What happens when a small website leaks your reused password?", "Why can't a coffee-shop eavesdropper read HTTPS traffic?"], "modelPlan": "(a) 1 = Availability; 2 = Integrity; 3 = Confidentiality. (b) Credential stuffing uses 1 small breach to unlock all accounts; MFA blocks thieves because they still lack your physical phone/authenticator code! (c) Plaintext = readable; Ciphertext = scrambled; HTTPS uses Public-Key math so only the real server's Private Key can decrypt it!"}, "step2_anchor": {"instruction": "Security Anchors:", "referenceItems": ["Confidentiality (Secret) • Integrity (Unaltered) • Availability (Online/Usable)", "MFA = Something you KNOW (passphrase) + Something you HAVE (authenticator code)"]}, "step3_substeps": [{"label": "Step 3a: Match all 3 incidents to **Confidentiality**, **Integrity**, or **Availability**", "placeholder": "1. Hospital offline = ...\n2. Altered grade = ...\n3. Leaked private files = ...", "hint": "Offline/locked out = Availability; secretly changed = Integrity; exposed secrets = Confidentiality!", "modelSubAnswer": "1. **Availability** — Ransomware denies doctors and patients access to vital systems when needed.\n2. **Integrity** — Unauthorized tampering corrupted the trustworthiness and accuracy of the record.\n3. **Confidentiality** — Private personal data was exposed to unauthorized viewers."}, {"label": "Step 3b: Explain password-reuse danger (**Credential Stuffing**) AND how **MFA** defends accounts", "placeholder": "Reusing passwords is risky because...\nMFA protects you because...", "hint": "One breached website exposes your password everywhere; MFA requires a 2nd independent factor (like a rotating code on your phone) that hackers don't possess!", "modelSubAnswer": "If you reuse one password across sites and even a minor site gets breached, attackers run automated **Credential Stuffing** to test that email/password on your email, school, and banking logins. **MFA** stops them cold because even with your stolen password, they lack the second factor (like the rotating 6-digit code on your physical device)!"}, {"label": "Step 3c: Distinguish Plaintext vs. Ciphertext AND explain how **HTTPS Public-Key Encryption** protects Wi-Fi", "placeholder": "Plaintext vs. Ciphertext: ...\nHTTPS Public-Key Encryption works on public Wi-Fi because...", "hint": "Plaintext = readable data; Ciphertext = mathematically scrambled gibberish; anyone can lock data with the site's Public Key, but ONLY the server's Private Key unlocks it!", "modelSubAnswer": "**Plaintext** is readable original data (like a password), whereas **Ciphertext** is mathematically scrambled data unreadable without the decryption key. On public Wi-Fi, **HTTPS** uses **Public-Key Cryptography**: your browser locks your data with the website's Public Key so eavesdroppers see only ciphertext gibberish—only the real server holding the matching secret **Private Key** can unlock it!"}], "step4_checks": ["Did I match Availability (1), Integrity (2), and Confidentiality (3) accurately?", "Did I clearly explain BOTH Credential Stuffing AND how MFA adds a 2nd factor?", "Did I distinguish Plaintext vs. Ciphertext and explain Public vs. Private keys?"], "step5_modelAnswer": {"basicAnswer": "1 Availability, 2 Integrity, 3 Confidentiality. Reused passwords get hacked everywhere; MFA adds a phone code. HTTPS scrambles plaintext into ciphertext.", "expandedAnswer": "Part (a): (1) **Availability** (systems forced offline), (2) **Integrity** (data tampered with), (3) **Confidentiality** (private records leaked).\nPart (b): Password reuse enables automated Credential Stuffing after any single breach; **MFA** requires an independent second factor (something you have, like an authenticator code) that remote attackers cannot steal with your password alone.\nPart (c): **Encryption** transforms readable **Plaintext** into unreadable **Ciphertext**; **HTTPS Public-Key Encryption** lets your browser lock messages with a site's public key so only the legitimate server's secret private key can decrypt them over public Wi-Fi.", "extensionPrompt": "Extension: Check one real account you own today—does it have a unique passphrase and 2FA/MFA turned on?"}}]}]}, {"id": "pe", "code": "PPL1O (Grade 9 Healthy Active Living)", "name": "Health & PE (PPL1O)", "friendlySub": "Target Heart Rate, Aerobic/Anaerobic, Vaping/Substance Risks & Resilience", "teacher": "Grade 9 PPL1O", "status": "High School Elective / Credit", "tier": "Tier 3: Healthy Living", "tierClass": "tier-extra", "icon": "🏀", "reportComment": "Ontario Grade 9 Healthy Active Living Education (PPL1O): Aerobic vs. Anaerobic Energy Systems, Target Heart Rate Zone Calculations (`220 − age`), SMART High School Fitness Plans, Mental Health & Substance/Vaping Risk Literacy, and Healthy Boundaries.", "nextSteps": ["Calculate your exact Target Heart Rate Zone (`60%–85%` of Max Heart Rate `220 − age`)", "Match Aerobic vs. Anaerobic training to your sport goals", "Make informed, evidence-based decisions around vaping/substances, sleep, and mental wellness"], "units": [{"id": "g9-pe-u1", "title": "Unit 1: Aerobic vs. Anaerobic Systems & Target Heart Rate Zones", "studyFirstTag": "Calculate your exact Grade 9 Target Heart Rate (`220 − age`) & train like a pro!", "curriculumStrand": "Ontario PPL1O Strands A & B: Active Living & Personal Fitness Science", "svgDiagram": "g9_pe_arts_svg", "lessons": [{"id": "g9-pe-u1-l1", "title": "Lesson 1.1: Aerobic vs. Anaerobic Fitness & Calculating Target Heart Rate (`THR`)", "readTime": "3 min read", "bigIdea": "Your body runs TWO athletic engines—**Aerobic** (with oxygen, long steady stamina!) and **Anaerobic** (without oxygen, explosive 10–30 second power!)—and **`Target Heart Rate = 60%–85% of (220 − age)`** dials in peak conditioning!", "paragraphs": ["Why can you jog steadily for 30 minutes yet feel your legs burn after a 20-second all-out sprint? Because your muscles use two distinct energy systems! **Aerobic Exercise** (*'with oxygen'* — distance running, swimming, cycling, steady basketball transitions) uses steady oxygen flow to burn glucose/fats cleanly for long durations, strengthening your heart and lungs. **Anaerobic Exercise** (*'without oxygen'* — fast-break sprints, vertical jumps, heavy lifting) delivers explosive bursts lasting ~10–60 seconds before lactic acid buildup forces you to slow down!", "In Grade 9 `PPL1O`, you monitor workout intensity scientifically using **Heart Rate (`bpm`)**:\n1. **Max Heart Rate (`MHR`)** ≈ **`220 − Age`** (For a 14-year-old Grade 9 student: `220 − 14 = 206 bpm`!).\n2. **Target Heart Rate Zone (`THR`)** = **`60%` to `85%` of MHR** (`0.60 × 206 ≈ 124 bpm` to `0.85 × 206 ≈ 175 bpm`!).", "Tracking your **Resting Heart Rate (`RHR`)** first thing in the morning is an awesome progress meter: as your heart grows stronger from regular aerobic workouts, it pumps MORE blood per beat—so your Resting Heart Rate actually **DROPS** over a semester!"], "keyTakeaway": "Aerobic = steady with `O₂` (endurance) | Anaerobic = explosive bursts (speed/power). `MHR = 220 − age`; **Target Zone = `60%–85%` of MHR**!", "deepReadTitle": "❤️ Grade 9 Fitness Math Card (Age 14)", "deepReadText": "• `MHR = 220 − 14 = 206 bpm`\n• Lower THR (`60%`): `206 × 0.60 = 124 bpm` (Moderate Aerobic)\n• Upper THR (`85%`): `206 × 0.85 = 175 bpm` (Vigorous Training)\n• Smart SMART Goal: Specific • Measurable • Achievable • Relevant • Time-bound!", "quickCheck": {"question": "A 15-year-old student has `MHR = 220 − 15 = 205 bpm`. What is their `60%–85%` **Target Heart Rate Zone**?", "options": ["60 to 85 bpm", "123 to 174 bpm (`0.60 × 205` to `0.85 × 205`!)", "185 to 220 bpm"], "correctIdx": 1, "explanation": "`205 × 0.60 = 123 bpm` and `205 × 0.85 = 174.25 ≈ 174 bpm` — right inside the optimal aerobic conditioning zone!"}, "videos": [{"id": "lnc9fUxnp1I", "title": "Aerobic vs. Anaerobic Exercise Explained", "channel": "Learn Running", "why": "Crisp high-school breakdown of oxygen use, endurance, and explosive sprints."}]}], "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Recall Aerobic/Anaerobic & Target Heart Rate Formulas", "content": "Lock in PPL1O fitness science:", "keyPoints": ["`MHR = 220 − age` | `THR = 60%–85% of MHR`.", "Aerobic = steady with oxygen (endurance) | Anaerobic = explosive short bursts (power/speed)."]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Explain Why a Fit Athlete Has a LOWER Resting Heart Rate", "content": "A stronger heart muscle pushes more blood with EVERY single beat (higher stroke volume), so it needs fewer beats per minute at rest!", "analogy": "🪣 Bucket Analogy: Using a big sturdy bucket moves the exact same water in half as many scoops as a tiny teacup!", "keyPoints": ["Watch your morning resting pulse drop over 8 weeks of consistent cardio!"]}, {"level": 3, "name": "APPLY", "subtitle": "Calculate THR for a 14-Year-Old & Check a 15-Second Pulse Count", "content": "Multiply a 15-second neck/wrist pulse by 4 to get `bpm`:", "workedExample": {"prompt": "You count `38` beats in `15 seconds` during basketball (`age 14`, THR `124–175 bpm`). Are you in your zone?", "steps": ["`HR = 38 × 4 = 152 bpm`!", "Since `124 ≤ 152 ≤ 175`, YES—dead-centre of the Target Heart Rate Zone!"]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Aerobic vs. Anaerobic Activities", "content": "Match workouts to real sport demands:", "comparisonTable": {"headers": ["System", "Oxygen?", "Duration", "Examples"], "rows": [["Aerobic", "✅ Yes (steady)", "Minutes to hours", "Distance run, swimming, cycling, steady soccer"], ["Anaerobic", "❌ Short-term without O₂", "5–60 seconds", "Fast-break sprint, vertical jump, push-up burst"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Audit a Vague Fitness Resolution into a True S.M.A.R.T. Goal", "content": "Upgrade vague wishes into measurable plans:", "keyPoints": ["❌ 'Get better at running.' → ✅ 'Run 3 km in under 15 minutes within 6 weeks by training 3×/week in my 124–175 bpm THR zone!'"]}, {"level": 6, "name": "CREATE", "subtitle": "Design a Balanced Hybrid Workout for Basketball/Soccer", "content": "Blend BOTH aerobic base cardio and anaerobic sprint bursts cleanly.", "keyPoints": ["Example: 15-min steady aerobic warm-up/run + 6×20-sec anaerobic court sprints with recovery walks!"]}], "questions": [{"id": "g9-pe-q1", "bloomLevel": 4, "bloomTag": "APPLY & CREATE", "title": "PPL1O Fitness Science Lab: Heart Rate Math, Energy Systems & S.M.A.R.T. Plan", "prompt": "(a) Calculate the **Max Heart Rate (`220 − age`)** AND **Target Heart Rate Zone (`60%–85%`)** for a **14-year-old** Grade 9 student. If they count `40 beats` in `15 seconds` mid-workout, calculate their `bpm` and state whether they are inside their zone!\n(b) Explain why a Grade 9 basketball or soccer player needs BOTH **Aerobic** AND **Anaerobic** conditioning (give 1 specific game moment for each!).\n(c) Write a complete **S.M.A.R.T.** fitness goal for one 6-week high school semester block.", "step1_deconstruct": {"instruction": "Run exact `220−14`, `60%–85%`, and `40×4` math in (a), link both energy systems to real game moments in (b), and hit all 5 S.M.A.R.T. letters in (c)!", "guidingQuestions": ["What is `220 − 14` (`206`), `0.60×206` (`124`), and `0.85×206` (`175`)?", "What is `40 × 4` (`160 bpm`)?", "Does my S.M.A.R.T. goal have exact numbers AND a 6-week deadline?"], "modelPlan": "(a) MHR=206; THR=124–175 bpm; 40×4=160 bpm → YES, right inside zone! (b) Aerobic = lasting all 4 quarters without fading; Anaerobic = explosive fast break/rebound jump! (c) Specific, Measurable, Achievable, Relevant, 6-week Time-bound goal."}, "step2_anchor": {"instruction": "Formulas:", "referenceItems": ["`MHR = 220 − age` | `THR = 0.60×MHR` to `0.85×MHR` | `bpm = 15-sec count × 4`", "S.M.A.R.T. = Specific • Measurable • Achievable • Relevant • Time-bound"]}, "step3_substeps": [{"label": "Step 3a: Compute `MHR`, `60%–85% THR Zone`, and `15-sec` pulse check (`40 beats`)", "placeholder": "MHR = 220 − 14 = ... bpm\nTHR = ... to ... bpm\nWorkout HR = 40 × 4 = ... bpm (In zone? ...)", "hint": "`206 bpm`; `124–175 bpm`; `40 × 4 = 160 bpm` → YES, ideal zone!", "modelSubAnswer": "• `MHR = 220 − 14 = 206 bpm`\n• `THR Zone = 60%–85%` → `124 bpm` to `175 bpm`\n• Workout Pulse = `40 × 4 = 160
