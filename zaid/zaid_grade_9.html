bpm` → **YES**, right inside the optimal Target Heart Rate Zone!"}, {"label": "Step 3b: Explain why basketball/soccer requires BOTH Aerobic AND Anaerobic fitness", "placeholder": "Aerobic moment: ...\nAnaerobic moment: ...", "hint": "Aerobic keeps you hustling steadily through all 4 quarters; Anaerobic powers explosive 5-second fast breaks and vertical leaps!", "modelSubAnswer": "• **Aerobic:** Powers continuous jogging, defensive positioning, and quick recovery between plays across all 4 quarters without fading.\n• **Anaerobic:** Powers explosive 3–10 second bursts like chasing down a fast break, cutting sharply around a screen, or jumping for a rebound!"}, {"label": "Step 3c: Write a complete **S.M.A.R.T.** 6-week Grade 9 fitness goal", "placeholder": "Within 6 weeks, I will...", "hint": "Include exact measurable number (`km`, `reps`, or `minutes`), frequency (`3×/wk`), and the 6-week deadline!", "modelSubAnswer": "« Within **6 weeks** (Time-bound), I will improve my continuous **3 km run time by 90 seconds** (Specific & Measurable) by completing **3 workouts/week**—two 20-minute aerobic runs inside my `124–175 bpm` THR zone and one anaerobic shuttle-sprint session—to boost my high school basketball endurance (Achievable & Relevant). »"}], "step4_checks": ["Did I calculate `MHR = 206`, `THR = 124–175 bpm`, and `160 bpm` accurately?", "Did I give real distinct game moments for BOTH Aerobic and Anaerobic?", "Does my S.M.A.R.T. goal explicitly satisfy all 5 criteria?"], "step5_modelAnswer": {"basicAnswer": "MHR 206, THR 124-175, 160 is in zone. Aerobic for stamina, anaerobic for sprints. Run 3x/wk for 6 weeks.", "expandedAnswer": "Part (a): `MHR = 206 bpm`, `THR = 124–175 bpm`; `40 × 4 = 160 bpm` sits right inside the optimal zone.\nPart (b): Aerobic capacity sustains steady effort across an entire game and speeds recovery, while anaerobic power fuels explosive fast breaks, sharp cuts, and vertical leaps.\nPart (c) S.M.A.R.T. Goal: Within 6 weeks, cut 90 seconds off a 3 km run by completing 2 aerobic THR workouts (`124–175 bpm`) and 1 anaerobic sprint workout weekly with scheduled recovery days.", "extensionPrompt": "Extension: Measure your real 15-second resting pulse tomorrow morning and multiply by 4!"}}]}, {"id": "g9-pe-u2", "title": "Unit 2 (Health Strand C): Adolescent Brain Science, Vaping Risks & Healthy Boundaries", "studyFirstTag": "Protect your developing teen brain from nicotine/vaping myths & build real resilience!", "curriculumStrand": "Ontario PPL1O Strand C: Healthy Living — Substance Use, Mental Health & Relationships", "svgDiagram": "g9_pe_arts_svg", "lessons": [{"id": "g9-pe-u2-l1", "title": "Lesson 2.1: Teen Brain Plasticity, Vaping/Nicotine Myths & Consent Boundaries", "readTime": "3 min read", "bigIdea": "Your **prefrontal cortex** (focus, impulse control, athletic/music mastery!) is rapidly rewiring until age **25**—making teen brains super-fast learners AND far more vulnerable to **nicotine addiction from vapes**!", "paragraphs": ["Myth check: many teens think flavoured vapes are 'just harmless water vapour'. False! Most vapes deliver concentrated **nicotine salts** (a single pod can pack as much nicotine as an entire pack of 20 cigarettes!) plus heated chemical aerosols and heavy metals that irritate lung tissue, lower athletic stamina, and hijack developing dopamine pathways—creating rapid **nicotine addiction** and worsening anxiety!", "Protecting your **Mental Health** in high school means recognizing early warning signs (persistent burnout, withdrawing from friends/sports, trouble sleeping) and balancing academic pressure with real recovery, honest communication, and Ontario supports (`Kids Help Phone: 1-800-668-6868` / text `CONNECT` to `686868` or school guidance).", "In all friendships and relationships, practice **Clear, Enthusiastic Consent & Healthy Boundaries**: healthy friends respect a calm `'No thanks'` without guilt-tripping, pressure, or spreading private conversations—and never use peer pressure to push substances or unsafe choices!"], "keyTakeaway": "Vapes are NOT harmless water vapour—concentrated nicotine hijacks developing teen brains and cuts lung stamina. Practice confident refusal strategies and protect mental wellness early!", "deepReadTitle": "🛡️ Confident High School Refusal Strategies", "deepReadText": "• Direct & Calm: « Nah, I'm good—I don't vape. »\n• Sport/Goal Excuse: « Pass—got practice/band and I protect my lungs! »\n• Change Subject / Exit: Pivot to basketball/plans or head toward trusted friends!", "quickCheck": {"question": "Why are Grade 9 teens biologically MORE vulnerable to nicotine addiction from vaping than adults?", "options": ["Teens have smaller lungs than adults.", "The adolescent brain's reward and prefrontal decision circuits are still actively wiring (until ~age 25), so nicotine rewires cravings and hurts focus/anxiety far faster!", "Flavoured vapes contain zero nicotine."], "correctIdx": 1, "explanation": "Developing teen brains have high neuroplasticity—amazing for learning math/music/sports, and far faster to wire nicotine dependency and anxiety loops!"}, "videos": [{"id": "lgS5RNP0L2w", "title": "5 Ways to Become Mentally Resilient", "channel": "TherapyToThePoint", "why": "Reinforces healthy coping over unhealthy peer-pressure escape habits."}]}], "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Recall Teen Brain Plasticity, Vaping Facts & Consent Boundaries", "content": "Lock in PPL1O Strand C health literacy:", "keyPoints": ["Prefrontal cortex develops until ~age 25 | Vapes contain concentrated nicotine salts + lung-irritating aerosols (NOT harmless water vapour!).", "Healthy boundaries = enthusiastic, pressure-free respect for 'No'."]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Explain the Nicotine Anxiety Trap", "content": "People think vaping relieves stress—when in reality nicotine withdrawal creates jittery anxiety that only temporarily quiets for 20 minutes after another hit!", "analogy": "👟 Tight-Shoe Analogy: Wearing shoes two sizes too small just for the brief relief of taking them off doesn't actually relax you—nicotine withdrawal creates the exact stress it claims to soothe!", "keyPoints": ["Real stress relief (exercise, music, sleep, talking it out) lowers cortisol without chemical hooks!"]}, {"level": 3, "name": "APPLY", "subtitle": "Rehearse 2 Confident, Low-Drama Refusal Lines", "content": "Having a calm script ready beats freezing under peer pressure:", "workedExample": {"prompt": "Older students offer a flavoured vape outside school:", "steps": ["Calm tone, zero lecture: « Nah I'm good, I play sports and trombone—need my lungs! »", "Pivot cleanly toward friends or walk straight into school."]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Healthy vs. Unhealthy Peer Boundaries", "content": "Spot red flags early in high school:", "comparisonTable": {"headers": ["Trait", "Healthy Friendship", "Unhealthy Peer Pressure"], "rows": [["When you say 'No'", "Respects it immediately", "Mocks, guilt-trips, or keeps pushing"], ["Privacy", "Keeps confidences & asks before posting", "Screenshots or shares private info without consent"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Critique Sweet-Flavoured Vape Packaging Targeting Teens", "content": "Apply media literacy to health marketing:", "keyPoints": ["Bright mango/candy flavours & sleek USB designs deliberately mask harsh nicotine to hook young lifelong customers!"]}, {"level": 6, "name": "CREATE", "subtitle": "Build a Personal Grade 9 Resilience & Boundaries Action Card", "content": "Combine 2 stress habits, 2 refusal lines, and 2 trusted supports.", "keyPoints": ["Keep it realistic, personal, and ready before Day 1 of Grade 9!"]}], "questions": [{"id": "g9-pe-q2", "bloomLevel": 5, "bloomTag": "EVALUATE & APPLY", "title": "PPL1O Healthy Living Lab: Vaping Myths, Brain Science & Boundary Skills", "prompt": "(a) Debunk the myth that *'flavoured vapes are just harmless water vapour that help with stress'* using **2 scientific facts** (brain development + nicotine anxiety trap/lungs).\n(b) Write **2 calm, realistic refusal responses** a Grade 9 student could use if pressured to try a vape—without starting a fight or sounding preachy.\n(c) Describe **2 signs** of an unhealthy peer boundary in high school AND how to maintain healthy, respectful friendships while prioritizing mental wellness.", "step1_deconstruct": {"instruction": "Use real brain/lung science in (a), write realistic low-drama refusal lines in (b), and contrast unhealthy vs. healthy peer boundaries in (c)!", "guidingQuestions": ["What chemicals are inside vapes, and why does nicotine worsen stress?", "Do my refusal lines sound natural for a real 14-year-old?", "How does a healthy friend react when you say 'No'?"], "modelPlan": "(a) Concentrated nicotine salts + aerosols irritate lungs & rewire developing prefrontal cortex (until age 25), creating withdrawal anxiety! (b) Calm direct 'Nah, I'm good' + sport/trombone lung goal! (c) Guilt-tripping/mocking 'No' or sharing private pics without consent → choose friends who respect boundaries & talk to trusted adults when overwhelmed."}, "step2_anchor": {"instruction": "Health Anchors:", "referenceItems": ["Prefrontal cortex develops until ~age 25 | Vapes ≠ water vapour!", "Kids Help Phone: `1-800-668-6868` / Text `CONNECT` to `686868`"]}, "step3_substeps": [{"label": "Step 3a: Debunk the 'harmless stress-relief vapour' vaping myth with 2 scientific facts", "placeholder": "Fact 1 (Brain/Nicotine): ...\nFact 2 (Lungs/Anxiety Trap): ...", "hint": "Mention concentrated nicotine salts wiring developing teen brains (to age 25) + withdrawal creating MORE anxiety + aerosols irritating lung stamina!", "modelSubAnswer": "1. **Developing Brain Vulnerability:** Vapes deliver concentrated **nicotine salts** (not water vapour) that rapidly wire addiction in the developing teen prefrontal cortex (still maturing until age 25), hurting memory and attention.\n2. **Lung Harm & Anxiety Trap:** Heated chemical aerosols irritate airways (lowering sports/music stamina), and nicotine withdrawal actually *spikes* baseline anxiety rather than solving stress!"}, {"label": "Step 3b: Write 2 realistic, low-drama refusal scripts for Grade 9 peer pressure", "placeholder": "Script 1: ...\nScript 2: ...", "hint": "Keep them short, relaxed, and confident—e.g., citing basketball/trombone lungs or a chill `'Nah, not my thing'`!", "modelSubAnswer": "1. **Chill Direct:** « Nah I'm good—not really my thing. Hey, are you going to open gym at lunch? »\n2. **Athlete/Musician Anchor:** « Pass—I'm training for intramurals and play trombone, so I keep my lungs clean! »"}, {"label": "Step 3c: Identify 2 unhealthy boundary signs + how to build healthy high school wellness", "placeholder": "2 Unhealthy Boundary Signs: 1. ... 2. ...\nHealthy Wellness Habit: ...", "hint": "Mocking/guilt-tripping a 'No' + violating digital privacy; counter by choosing respectful friends, real stress outlets (sports/sleep), and trusted supports!", "modelSubAnswer": "• **2 Unhealthy Signs:** (1) Repeatedly mocking or pressuring you after you calmly say 'No'; (2) Sharing private messages/photos without consent.\n• **Healthy Wellness:** Surround yourself with friends who respect boundaries, manage stress with movement/music/sleep instead of substances, and reach out early to parents, guidance, or Kids Help Phone (`686868`) whenever pressure builds."}], "step4_checks": ["Did I debunk BOTH the 'water vapour' myth AND the 'stress relief' myth with science?", "Are my 2 refusal lines calm, realistic, and natural?", "Did I identify 2 concrete unhealthy boundary signs and healthy alternatives?"], "step5_modelAnswer": {"basicAnswer": "Vapes have nicotine that hurts developing brains and lungs and raises anxiety. Say nah I play sports. Real friends respect no.", "expandedAnswer": "Part (a): Vapes contain concentrated nicotine salts and lung-irritating chemical aerosols—not harmless vapour. They rapidly wire dependency in the developing adolescent brain (maturing to age 25), reduce athletic lung capacity, and amplify anxiety through withdrawal cycles.\nPart (b): Confident, low-drama refusals (*« Nah I'm good—not my thing »* or *« Pass, I protect my lungs for sports and music »*) plus changing the topic defuse peer pressure smoothly.\nPart (c): Unhealthy boundaries include mocking/ignoring a 'No' and breaching digital consent; prioritize respectful friendships, active recovery, and early support from trusted adults or Kids Help Phone.", "extensionPrompt": "Extension: Why is exercising for 20 minutes scientifically proven to lower stress hormones (`cortisol`) far better than scrolling or vaping?"}}]}]}, {"id": "arts", "code": "AMU1O / AVI1O / ADA1O (Grade 9 Arts)", "name": "The Arts (Gr 9)", "friendlySub": "Major Scales (WWHWWWH), Bass Clef Sight-Reading & Feldman Critique", "teacher": "Grade 9 Arts", "status": "High School Arts Credit", "tier": "Tier 3: Arts Credit", "tierClass": "tier-extra", "icon": "🎺", "reportComment": "Ontario Grade 9 Arts Credit Prep (AMU1O Instrumental Music/Trombone, AVI1O Visual Arts, ADA1O Drama): Building Any Major Scale (W-W-H-W-W-W-H), Circle of Fifths, High School Band Sight-Reading, Feldman's 4-Step Art Critique, and Dramatic Monologue Objectives.", "nextSteps": ["Build ANY Major Scale from scratch using W-W-H-W-W-W-H (Whole & Half steps)", "Master Bass Clef ledger lines and clean ensemble tuning on trombone", "Use Feldman's 4 Steps (Describe → Analyze → Interpret → Judge) to ace every Grade 9 Art & Drama critique!"], "units": [{"id": "g9-arts-u1", "title": "Unit 1 (AMU1O Music): Building Major Scales (`W-W-H-W-W-W-H`) & Ensemble Tuning", "studyFirstTag": "Construct ANY Major Scale by formula + play dead-in-tune in high school concert band!", "curriculumStrand": "Ontario AMU1O: Music Theory, Performance & Listening", "svgDiagram": "g9_pe_arts_svg", "lessons": [{"id": "g9-arts-u1-l1", "title": "Lesson 1.1: The Major Scale Formula (`W-W-H-W-W-W-H`) & High School Band Tuning", "readTime": "3 min read", "bigIdea": "Every **Major Scale** in music—from `C Major` to `B♭` and `E♭ Major`—is built by the exact same 7-step staircase: **Whole, Whole, Half, Whole, Whole, Whole, Half (`W-W-H-W-W-W-H`)**!", "paragraphs": ["In Grade 9 `AMU1O` Band, you move beyond memorizing fingerings/slide positions to truly understanding **Music Theory**! On a piano keyboard, moving to the VERY next key (white OR black) is a **Half Step (`H`)** (on trombone = **1 slide position** out or in!), and skipping one key (`2` half steps) is a **Whole Step (`W`)** (= **2 slide positions**!).", "Apply **`W - W - H - W - W - W - H`** starting on `B♭` to construct your iconic **Concert B♭ Major Scale**: `B♭` →(W) `C` →(W) `D` →(H) **`E♭`** →(W) `F` →(W) `G` →(W) `A` →(H) `B♭`! Look how the formula automatically proves WHY Concert B♭ has exactly two flats (`B♭` and `E♭`)—and starting on `G` (`G-A-B-C-D-E-F♯-G`) proves why `G Major` needs `F♯`!", "For high school concert band excellence on trombone, master **Active Listening & Tuning**: if your note sounds **sharp** (too high), push your tuning slide **OUT** slightly to lengthen the tubing; if it sounds **flat** (too low), pull your tuning slide **IN** to shorten the tubing—and listen for acoustic 'beats' (wobbly waves) to vanish until your section locks into one pure resonant chord!"], "keyTakeaway": "Major Scale Formula = **`W-W-H-W-W-W-H`** (`H = 1` trombone slide position; `W = 2`!). Tuning rule: **Sharp → Slide OUT** (longer); **Flat → Slide IN** (shorter)!", "deepReadTitle": "🎺 Grade 9 AMU1O Theory Quick Card", "deepReadText": "• Order of Sharps (`♯`): `F - C - G - D - A - E - B` (reverse of Flats `B-E-A-D-G-C-F`!)\n• Natural Half Steps (NO black key between them!): **`B–C`** and **`E–F`**!\n• Tuning Rule: Longer Tube = Lower Pitch (Sharp → Pull OUT) | Shorter Tube = Higher Pitch (Flat → Push IN)!", "quickCheck": {"question": "If your trombone tuner shows you are playing **SHARP** (too high) on Concert `B♭`, which way should you adjust your tuning slide?", "options": ["Push the tuning slide all the way IN (shorter tube).", "Pull the tuning slide slightly OUT (longer tube lowers pitch back down to tune!).", "Blow twice as hard without touching the slide."], "correctIdx": 1, "explanation": "Longer air column = lower pitch! So if you are **sharp** (too high), pull the tuning slide slightly **OUT** to bring the pitch down cleanly into tune!"}, "videos": [{"id": "cUGLQe-vUqk", "title": "Bass Clef Major Scales for Beginners", "channel": "Music knowledge", "why": "Visualizes Bass Clef Major Scales using W-W-H-W-W-W-H clearly."}]}], "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Recall `W-W-H-W-W-W-H`, Natural Half Steps & Tuning Rule", "content": "Lock in AMU1O theory:", "keyPoints": ["Major Scale: `W-W-H-W-W-W-H` | Natural Half Steps: `B–C` and `E–F`.", "Order of Sharps: `F-C-G-D-A-E-B` | Sharp = Pull OUT; Flat = Push IN!"]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Explain the Physics Connecting Tube Length to Pitch", "content": "A longer trombone air column creates longer sound waves with lower frequency (lower pitch)—identical to why a giant tuba plays lower than a compact trumpet!", "analogy": "🎸 Guitar String Analogy: Longer open strings vibrate slower (lower note); pressing a fret shortens the string (higher note)—your trombone slide does the exact same thing with air!", "keyPoints": ["Cold winter band rooms make brass instruments play **FLAT** (cold air slows sound waves!)—always warm up your horn before tuning!"]}, {"level": 3, "name": "APPLY", "subtitle": "Build **Concert F Major** & **G Major** Using `W-W-H-W-W-W-H`", "content": "Watch the formula reveal the exact accidental:", "workedExample": {"prompt": "Construct `F Major` starting on `F`:", "steps": ["`F` →(W) `G` →(W) `A` →(H) **`B♭`** (must lower B by half step!) →(W) `C` →(W) `D` →(W) `E` →(H) `F`!", "Result: `F Major` has exactly **1 flat (`B♭`)**!"]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Order of Flats vs. Order of Sharps", "content": "Notice they are exact mirror images:", "comparisonTable": {"headers": ["System", "Exact Order", "Memory Trick"], "rows": [["Order of Flats (`♭`)", "`B - E - A - D - G - C - F`", "**BEAD** + Greatest Common Factor!"], ["Order of Sharps (`♯`)", "`F - C - G - D - A - E - B`", "**F**ather **C**harles **G**oes **D**own **A**nd **E**nds **B**attle!"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Fix a Broken Scale That Repeats a Letter Name", "content": "Spot the classic music-theory rule:", "keyPoints": ["Every Major Scale uses all 7 letters `A–G` ONCE—never write `F, G, A, A♯, C...` (use `B♭` instead of `A♯` so every letter appears cleanly!)!"]}, {"level": 6, "name": "CREATE", "subtitle": "Write Out Concert `E♭ Major` & Mark Every Trombone Slide Position", "content": "Verify all 3 flats (`B♭, E♭, A♭`) using `W-W-H-W-W-W-H`!", "keyPoints": ["`E♭(3) - F(1) - G(4) - A♭(3) - B♭(1) - C(6) - D(4) - E♭(3)`!"]}], "questions": [{"id": "g9-arts-q1", "bloomLevel": 4, "bloomTag": "APPLY & ANALYZE", "title": "AMU1O Theory & Band Mastery: Major Scales, Key Signatures & Acoustic Tuning", "prompt": "(a) Using the Major Scale formula **`W-W-H-W-W-W-H`** (remembering `B–C` and `E–F` are natural half steps!), construct ALL 8 notes of **Concert `F Major`** AND **Concert `G Major`**, naming the exact sharp or flat in each.\n(b) On a cold January morning in Ottawa, you enter the band room and your trombone plays **FLAT** (`−15 cents`) on your tuner. Explain WHY cold air makes brass play flat AND which direction to adjust your tuning slide.\n(c) Explain how the **Order of Sharps** relates to the **Order of Flats**—and why writing `F - G - A - A♯ - C` breaks standard scale-spelling rules!", "step1_deconstruct": {"instruction": "Build both scales letter-by-letter in (a), link acoustics + slide direction in (b), and explain mirror order + 7-unique-letters rule in (c)!", "guidingQuestions": ["In `F Major`, what half step follows `A` (`B♭`, NOT `A♯`!)?", "In `G Major`, what whole step follows `E` (`F♯`)?", "Does pushing the tuning slide IN shorten or lengthen the tube?"], "modelPlan": "(a) F Major = F-G-A-B♭-C-D-E-F (1♭: B♭); G Major = G-A-B-C-D-E-F♯-G (1♯: F♯). (b) Cold air slows sound wave speed → lower pitch (flat); warm up horn + push tuning slide IN (shorter tube raises pitch!). (c) Exact reverse (`BEADGCF` ↔ `FCGDAEB`); every scale must use all 7 letters A–G once!"}, "step2_anchor": {"instruction": "Theory Anchors:", "referenceItems": ["`W-W-H-W-W-W-H` | Natural Half Steps: `B–C` & `E–F`", "Flat (too low) → Push IN (shorter!) | Sharp (too high) → Pull OUT (longer!)"]}, "step3_substeps": [{"label": "Step 3a: Construct ALL 8 notes of **Concert `F Major`** AND **Concert `G Major`**", "placeholder": "F Major: F - ... (Accidental: ...)\nG Major: G - ... (Accidental: ...)", "hint": "F Major has `B♭`; G Major has `F♯`!", "modelSubAnswer": "• **F Major:** `F - G - A - B♭ - C - D - E - F` (1 flat: **`B♭`**)\n• **G Major:** `G - A - B - C - D - E - F♯ - G` (1 sharp: **`F♯`**)"}, {"label": "Step 3b: Explain cold-room flat tuning AND exact slide adjustment", "placeholder": "Cold air lowers pitch because...\nSlide adjustment: ...", "hint": "Sound travels slower in cold air (lowering frequency = flat); warm your horn with steady air and **push the tuning slide slightly IN** (shorter tube raises pitch)!", "modelSubAnswer": "Sound waves travel more slowly through cold air, lowering vibration frequency so brass instruments sound **flat**. Warm the horn with gentle breath first, then **push the tuning slide slightly IN** to shorten the tubing and raise the pitch back into tune!"}, {"label": "Step 3c: Compare Order of Sharps vs. Flats AND explain why `F-G-A-A♯-C` is wrong", "placeholder": "Order relationship: ...\nWhy A♯ is wrong in F Major: ...", "hint": "`FCGDAEB` is the exact reverse of `BEADGCF`; every Major Scale must contain each letter `A–G` exactly ONCE (no skipped `B` / repeated `A`)!", "modelSubAnswer": "• The **Order of Sharps (`F-C-G-D-A-E-B`)** is the exact reverse mirror of the **Order of Flats (`B-E-A-D-G-C-F`)**!\n• Writing `F-G-A-A♯-C` uses the letter `A` twice and skips `B` completely—proper theory uses each letter `A–G` exactly once, so the 4th note MUST be spelled **`B♭`**!"}], "step4_checks": ["Did I get `B♭` in F Major and `F♯` in G Major with all 8 notes?", "Did I specify pushing the tuning slide **IN** to fix a **flat** pitch?", "Did I note the exact mirror order (`BEADGCF` ↔ `FCGDAEB`) and the 1-of-each-letter rule?"], "step5_modelAnswer": {"basicAnswer": "F: F-G-A-Bb-C-D-E-F. G: G-A-B-C-D-E-F#-G. Cold air slows waves; push slide in. Mirror order; use every letter once.", "expandedAnswer": "Part (a): `F Major = F-G-A-B♭-C-D-E-F` (1♭: `B♭`); `G Major = G-A-B-C-D-E-F♯-G` (1♯: `F♯`).\nPart (b): Cold air reduces sound-wave speed, dropping brass pitch flat; warm the tubing and push the tuning slide slightly **IN** (shorter tube = higher pitch).\nPart (c): Sharps (`F-C-G-D-A-E-B`) reverse Flats (`B-E-A-D-G-C-F`), and every diatonic Major Scale uses all 7 letters `A–G` once (`B♭`, never `A♯` in F Major).", "extensionPrompt": "Extension: Use `W-W-H-W-W-W-H` to build `D Major` — check that it produces exactly 2 sharps (`F♯` and `C♯`)!"}}]}, {"id": "g9-arts-u2", "title": "Unit 2 (AVI1O & ADA1O): Feldman's 4-Step Art Critique & Dramatic Monologues", "studyFirstTag": "Critique ANY artwork like a museum curator (`D-A-I-J`) & break down stage monologues!", "curriculumStrand": "Ontario AVI1O / ADA1O: Critical Analysis Process & Dramatic Craft", "svgDiagram": "g9_pe_arts_svg", "lessons": [{"id": "g9-arts-u2-l1", "title": "Lesson 2.1: Feldman's 4-Step Art Critique (`D-A-I-J`), Value Shading & Monologue Beats", "readTime": "3 min read", "bigIdea": "Never start an art critique with *'I like it'*! High school `AVI1O` uses **Feldman's 4-Step Method** (**Describe → Analyze → Interpret → Judge**) to build rock-solid visual evidence BEFORE judging!", "paragraphs": ["When writing an Ontario Grade 9 Visual Arts (`AVI1O`) critique—say on a Canadian Group of Seven painting by *Lawren Harris* or *Tom Thomson*—follow **Feldman's 4 Steps** in strict order:\n1. **Describe (Just the Facts!):** List *only* what your eyes literally see (medium, objects, shapes, colours—ZERO opinions or guesses!).\n2. **Analyze (Elements & Principles):** Explain *how* the artist organized Line, Colour, **Value** (light-to-dark shading creating 3D form!), Contrast, Balance, and Focal Point to guide your eye.\n3. **Interpret (Mood & Meaning):** Now explain what emotion, story, or cultural message those visual choices communicate—backed by your Step 2 proof!\n4. **Judge (Evaluative Verdict):** Finally evaluate *how successfully* the artwork achieved its artistic goal (aesthetic, expressive, or technical impact)!", "In Grade 9 Drama (`ADA1O`), actors break down a **Monologue** using the **O-O-T Framework**: **Objective** (What does my character desperately WANT right now?), **Obstacle** (What/who is blocking them?), and **Tactics** (Active playable verbs—*to persuade, to guilt-trip, to calm, to challenge*—that shift across distinct **Beats** of the speech!)."], "keyTakeaway": "Art Critique = **Describe** (facts) → **Analyze** (Elements/Principles) → **Interpret** (meaning/mood) → **Judge** (evidence-backed verdict). Drama Monologue = **Objective + Obstacle + Active Tactics**!", "deepReadTitle": "🎨 Shading Value Scale & Monologue Action Verbs", "deepReadText": "• 5 Elements of Realistic 3D Shading: Highlight → Midtone → Core Shadow → Reflected Light → Cast Shadow!\n• Weak Drama Goal: 'Be sad' (unplayable!) → Strong Playable Tactic: 'To beg my friend to stay'!", "quickCheck": {"question": "In **Feldman's 4-Step Art Critique**, which statement belongs strictly in **Step 1 (Describe)** rather than Interpret or Judge?", "options": ["'This painting feels super lonely and proves the artist was heartbroken.'", "'The oil painting shows a single wind-bent pine tree standing on dark grey rock above rippled blue water under warm yellow clouds.'", "'This is a masterpiece and easily deserves 10/10.'"], "correctIdx": 1, "explanation": "Step 1 (**Describe**) records pure observable visual facts without guessing emotions (**Interpret**) or giving ratings (**Judge**)!"}, "videos": [{"id": "UFXQgRd4UZ0", "title": "Feldman's 4 Steps to Art Criticism", "channel": "mandersart", "why": "Direct Ontario AVI1O guide to Describe, Analyze, Interpret, and Judge."}]}], "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Recall Feldman's 4 Steps (`D-A-I-J`) & Drama `O-O-T`", "content": "Lock in Grade 9 Arts critique & performance:", "keyPoints": ["Feldman: 1) Describe (facts) → 2) Analyze (Elements/Principles) → 3) Interpret (meaning) → 4) Judge (verdict).", "Monologue `O-O-T`: Objective (want) • Obstacle (block) • Tactics (active playable verbs!)."]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Explain Why Step 1 (Describe) Bans Opinion Words", "content": "Slowing down to list objective visual details first forces you to notice subtle shadows, lines, and background clues you'd otherwise skip!", "analogy": "🔍 Detective Crime-Scene Analogy: A smart detective catalogs every physical clue (`Describe`) before building a theory (`Interpret`) and presenting a verdict (`Judge`)!", "keyPoints": ["Value contrast (deep darks + bright highlights) creates instant 3D realism!"]}, {"level": 3, "name": "APPLY", "subtitle": "Run Feldman's 4 Steps on Tom Thomson's *The Jack Pine*", "content": "See how each step builds cleanly on the last:", "workedExample": {"prompt": "Critique a windswept northern Ontario pine tree against a fiery sunset:", "steps": ["Describe: One twisted pine on rocky shore; dark branches silhouetted against red-gold sky.", "Analyze: High value contrast + asymmetrical balance draw eyes directly to the gnarled trunk.", "Interpret: Expresses rugged resilience and awe in Canada's Shield wilderness.", "Judge: Highly effective—bold brushstrokes and stark contrast capture northern solitude vividly!"]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Weak Emotion-Playing vs. Strong Playable Tactics (Drama)", "content": "Level up every Grade 9 stage performance:", "comparisonTable": {"headers": ["Weak Direction", "Why It Falls Flat", "Strong Playable Tactic (`O-O-T`)"], "rows": [["'Act angry!'", "Turns into flat yelling", "'To corner the teammate until they admit the mistake'"], ["'Act nervous!'", "Looks stiff & repetitive", "'To hide my shaking hands while persuading the judge'"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Spot Mixed-Up Feldman Steps in a Student Critique", "content": "Keep each step in its proper lane:", "keyPoints": ["Putting `'I love the cool mood'` inside **Describe** mixes Judge + Interpret into Step 1—save emotions for Step 3 and verdicts for Step 4!"]}, {"level": 6, "name": "CREATE", "subtitle": "Outline a 4-Step Critique of Your Own Favourite Artwork or Album Cover", "content": "Apply Describe, Analyze, Interpret, and Judge concisely.", "keyPoints": ["Name at least 3 Elements/Principles (Value, Contrast, Focal Point, Balance) in Step 2!"]}], "questions": [{"id": "g9-arts-q2", "bloomLevel": 6, "bloomTag": "ANALYZE & EVALUATE", "title": "AVI1O / ADA1O Studio Critique: Feldman's 4 Steps & Monologue `O-O-T`", "prompt": "(a) Imagine a dramatic charcoal drawing showing **a single bright streetlamp illuminating a narrow, wet cobblestone alley at midnight, casting long dark shadows stretching toward a tiny open doorway at the back**.\nRun **Steps 1 & 2 of Feldman's Critique** (**Describe** purely objectively, then **Analyze** using at least 3 Elements/Principles such as Value, Contrast, Perspective/Line, and Focal Point).\n(b) Complete **Steps 3 & 4** (**Interpret** the emotional meaning/mood backed by your Step 2 analysis, then **Judge** its artistic effectiveness).\n(c) **Drama `O-O-T`:** Plan a 30-second monologue where a Grade 9 student tries to convince a strict coach to let them try out after missing the signup deadline—state their exact **Objective**, **Obstacle**, and **2 Shifting Tactics** (active verbs!).", "step1_deconstruct": {"instruction": "Keep Describe 100% factual in (a), name 3 Elements/Principles in Analyze, back Interpret/Judge with evidence in (b), and use playable action verbs in (c)!", "guidingQuestions": ["Did I keep ALL emotion words OUT of Step 1 (Describe)?", "Did I cite Value, Contrast, and Perspective/Focal Point in Step 2 (Analyze)?", "Are my 2 Drama Tactics playable verbs (`to apologize`, `to challenge`, `to prove`)?"], "modelPlan": "(a) Describe: charcoal medium, lone lamp, wet stones, long shadows, small open door. Analyze: extreme value contrast, converging perspective lines leading to lit doorway focal point. (b) Interpret: hope cutting through uncertainty; Judge: highly effective chiaroscuro mood. (c) Objective = earn tryout spot; Obstacle = strict deadline rule; Tactics = 1) to take accountability, 2) to prove hustle/dedication!"}, "step2_anchor": {"instruction": "Arts Anchors:", "referenceItems": ["Feldman: 1) Describe (facts) → 2) Analyze (Elements/Principles) → 3) Interpret (mood/meaning) → 4) Judge (verdict)", "Drama `O-O-T`: Objective + Obstacle + Shifting Active Tactics"]}, "step3_substeps": [{"label": "Step 3a: Write Feldman **Step 1 (Describe)** AND **Step 2 (Analyze — 3+ Elements/Principles)**", "placeholder": "1. Describe (pure facts): ...\n2. Analyze (Value, Contrast, Perspective, Focal Point): ...", "hint": "Zero mood/opinion words in Describe! In Analyze, discuss stark light-vs-dark **Value Contrast**, **One-Point Perspective** alley lines, and the lit doorway **Focal Point**!", "modelSubAnswer": "• **1. Describe:** A monochrome charcoal drawing depicting a wet cobblestone alleyway at night lit by one overhead streetlamp, with elongated dark shadows extending toward a small open doorway in the distance.\n• **2. Analyze:** Extreme **Value Contrast** between crisp white highlights on wet stone and deep black shadows creates dramatic depth. Strong **converging perspective lines** along the alley walls guide the viewer's eye straight to the illuminated doorway as the **Focal Point**."}, {"label": "Step 3b: Write Feldman **Step 3 (Interpret)** AND **Step 4 (Judge)**", "placeholder": "3. Interpret (mood & meaning): ...\n4. Judge (verdict backed by evidence): ...", "hint": "Connect the lone bright lamp + distant open doorway to quiet courage/hope amid mystery, then judge how successfully charcoal value contrast achieves that mood!", "modelSubAnswer": "• **3. Interpret:** The solitary light cutting through heavy midnight shadows evokes quiet suspense mixed with hope—suggesting that even in uncertain darkness, an inviting path forward remains open.\n• **4. Judge:** The artwork succeeds strongly on both technical and expressive levels: choosing rich charcoal amplifies dramatic chiaroscuro lighting and immediately immerses the viewer in the scene's atmosphere."}, {"label": "Step 3c: Map the Drama Monologue **Objective**, **Obstacle**, and **2 Shifting Tactics**", "placeholder": "Objective: ...\nObstacle: ...\nTactic 1 → Tactic 2: ...", "hint": "Use active playable verbs (`to own up honestly` → `to appeal to the coach's love of grit/hustle`)!", "modelSubAnswer": "• **Objective:** To persuade the coach to grant one fair 10-minute tryout slot.\n• **Obstacle:** The coach enforces strict deadlines to teach team accountability.\n• **Tactic 1 (Beat 1 — Humble Accountability):** *To apologize directly* without excuses and validate the coach's rule.\n• **Tactic 2 (Beat 2 — Determined Proof):** *To challenge the coach* to watch just 5 minutes of sprint/defensive hustle after practice before deciding!"}], "step4_checks": ["Is my Feldman Step 1 (Describe) 100% factual with zero opinion/emotion words?", "Did I analyze 3+ Elements/Principles (Value, Contrast, Perspective/Focal Point)?", "Do my Drama Tactics use active, playable verbs that shift between beats?"], "step5_modelAnswer": {"basicAnswer": "Describe: dark alley, lamp, open door. Analyze: value contrast and perspective. Interpret: hope in darkness. Judge: effective mood. Drama: want tryout, blocked by rule, apologize then prove grit.", "expandedAnswer": "Part (a) Describe: Monochrome charcoal alley at midnight under one streetlamp with wet cobblestones, long dark shadows, and a small distant open doorway. Analyze: High **Value Contrast**, reflected **Texture** on wet stone, and **Converging Perspective Lines** pull focus straight to the lit doorway **Focal Point**.\nPart (b) Interpret: Conveys tension tempered by quiet hope—a clear destination glowing beyond uncertainty. Judge: Highly effective use of charcoal lighting and spatial depth to immerse viewers emotionally.\nPart (c) Drama `O-O-T`: Objective = earn a tryout; Obstacle = coach's strict deadline; Beat 1 Tactic = *to take full responsibility*; Beat 2 Tactic = *to prove relentless work ethic*.", "extensionPrompt": "Extension: Try shading a quick 5-step Value Scale (white → deep black) with a regular pencil—smooth pressure transitions instantly level up Grade 9 drawings!"}}]}]}];
    const DIAGRAMS = {"g9_french_adv_svg": "\n    <svg viewBox=\"0 0 800 225\" class=\"topic-svg\" role=\"img\" aria-label=\"Grade 9 FSF1D Conditionnel, Si-Clauses, Pronouns Y/EN and Qui/Que\">\n      <rect x=\"0\" y=\"0\" width=\"800\" height=\"225\" rx=\"14\" fill=\"#0f172a\"/>\n      <rect x=\"16\" y=\"18\" width=\"246\" height=\"189\" rx=\"12\" fill=\"#1e293b\" stroke=\"#3b82f6\" stroke-width=\"2\"/>\n      <text x=\"139\" y=\"44\" fill=\"#60a5fa\" font-size=\"13.5\" font-weight=\"bold\" text-anchor=\"middle\">1. Conditionnel &amp; Si-Clause</text>\n      <text x=\"139\" y=\"64\" fill=\"#93c5fd\" font-size=\"11\" text-anchor=\"middle\">Future Stem + Imparfait Endings</text>\n      <text x=\"30\" y=\"92\" fill=\"#fde047\" font-size=\"12\" font-weight=\"bold\">Si + IMPARFAIT → CONDITIONNEL</text>\n      <text x=\"30\" y=\"116\" fill=\"#e2e8f0\" font-size=\"11.5\">« Si j'<tspan fill=\"#34d399\" font-weight=\"bold\">avais</tspan> le temps, j'<tspan fill=\"#60a5fa\" font-weight=\"bold\">irais</tspan>! »</text>\n      <text x=\"30\" y=\"142\" fill=\"#fca5a5\" font-size=\"11.5\" font-weight=\"bold\">NEVER put -rais right after Si!</text>\n      <text x=\"30\" y=\"168\" fill=\"#cbd5e1\" font-size=\"11.5\">Polite: Je voudrais / Pourriez-vous</text>\n      <text x=\"30\" y=\"190\" fill=\"#a7f3d0\" font-size=\"11\">ser- • aur- • ir- • fer- • voudr- • pourr-</text>\n\n      <rect x=\"277\" y=\"18\" width=\"246\" height=\"189\" rx=\"12\" fill=\"#1e293b\" stroke=\"#10b981\" stroke-width=\"2\"/>\n      <text x=\"400\" y=\"44\" fill=\"#34d399\" font-size=\"13.5\" font-weight=\"bold\" text-anchor=\"middle\">2. Pronouns Y vs. EN</text>\n      <text x=\"292\" y=\"76\" fill=\"#38bdf8\" font-size=\"12.5\" font-weight=\"bold\">Y = Place / à + thing ('there')</text>\n      <text x=\"292\" y=\"98\" fill=\"#e2e8f0\" font-size=\"11.5\">« Tu vas à Québec? Oui, j'<tspan fill=\"#38bdf8\" font-weight=\"bold\">y</tspan> vais! »</text>\n      <text x=\"292\" y=\"132\" fill=\"#fbbf24\" font-siz ily &amp; Refugees</text>\n      <text x=\"418\" y=\"174\" fill=\"#fed7aa\" font-size=\"10.5\">Aging Boomers vs Young Indig.</text>\n\n      <rect x=\"604\" y=\"44\" width=\"180\" height=\"164\" rx=\"10\" fill=\"#1e293b\" stroke=\"#a855f7\" stroke-width=\"2\"/>\n      <text x=\"694\" y=\"68\" fill=\"#c084fc\" font-size=\"12.5\" font-weight=\"bold\" text-anchor=\"middle\">4. Liveable Cities</text>\n      <text x=\"614\" y=\"92\" fill=\"#e2e8f0\" font-size=\"11\">• GIS Layered Mapping</text>\n      <text x=\"614\" y=\"112\" fill=\"#e2e8f0\" font-size=\"11\">• Beat Urban Heat Island:</text>\n      <text x=\"614\" y=\"130\" fill=\"#6ee7b7\" font-size=\"11\">  Trees, Green Roofs &amp;</text>\n      <text x=\"614\" y=\"146\" fill=\"#6ee7b7\" font-size=\"11\">  Permeable Pavement</text>\n      <text x=\"614\" y=\"174\" fill=\"#d8b4fe\" font-size=\"10.5\">15-Min Complete Streets!</text>\n    </svg>\n    ", "g9_math_mth1w_svg": "\n    <svg viewBox=\"0 0 800 230\" class=\"topic-svg\" role=\"img\" aria-label=\"Grade 9 MTH1W Exponent Laws, Perpendicular Slopes, Cones/Spheres and Appreciation/Depreciation\">\n      <rect x=\"0\" y=\"0\" width=\"800\" height=\"230\" rx=\"14\" fill=\"#0f172a\"/>\n      <rect x=\"16\" y=\"18\" width=\"248\" height=\"194\" rx=\"12\" fill=\"#1e293b\" stroke=\"#38bdf8\" stroke-width=\"2\"/>\n      <text x=\"140\" y=\"42\" fill=\"#38bdf8\" font-size=\"13.5\" font-weight=\"bold\" text-anchor=\"middle\">1. 5 Exponent Laws (MTH1W)</text>\n      <text x=\"30\" y=\"72\" fill=\"#e2e8f0\" font-size=\"12\">• aᵐ · aⁿ = aᵐ⁺ⁿ  |  aᵐ ÷ aⁿ = aᵐ⁻ⁿ</text>\n      <text x=\"30\" y=\"96\" fill=\"#e2e8f0\" font-size=\"12\">• (aᵐ)ⁿ = aᵐⁿ   (Square coeffs too!)</text>\n      <text x=\"30\" y=\"122\" fill=\"#fde047\" font-size=\"12.5\" font-weight=\"bold\">• a⁰ = 1   |   a⁻ⁿ = 1 / aⁿ</text>\n      <text x=\"30\" y=\"150\" fill=\"#fca5a5\" font-size=\"12\" font-weight=\"bold\">Shield: (−3)² = +9 vs. −3² = −9!</text>\n      <text x=\"30\" y=\"178\" fill=\"#6ee7b7\" font-size=\"11.5\">Kill fractions: × EVERY term by LCD!</text>\n\n      <rect x=\"276\" y=\"18\" width=\"248\" height=\"194\" rx=\"12\" fill=\"#1e293b\" stroke=\"#10b981\" stroke-width=\"2\"/>\n      <text x=\"400\" y=\"42\" fill=\"#34d399\" font-size=\"13.5\" font-weight=\"bold\" text-anchor=\"middle\">2. Slopes &amp; Linear Systems</text>\n      <text x=\"290\" y=\"74\" fill=\"#6ee7b7\" font-size=\"12\" font-weight=\"bold\">• Parallel (∥): m₁ = m₂ (Same!)</text>\n      <text x=\"290\" y=\"100\" fill=\"#fde047\" font-size=\"12\" font-weight=\"bold\">• Perp (⊥): Flip Fraction &amp; Sign!</text>\n      <text x=\"290\" y=\"122\" fill=\"#e2e8f0\" font-size=\"11.5\">   m = 2/3  →  m⊥ = −3/2</text>\n      <text x=\"290\" y=\"150\" fill=\"#93c5fd\" font-size=\"12\">• POI: Set y₁ = y₂ → find (x, y)!</text>\n      <text x=\"290\" y=\"178\" fill=\"#cbd5e1\" font-size=\"11.5\">Constant First Diff (Δy) = Linear!</text>\n\n      <rect x=\"536\" y=\"18\" width=\"248\" height=\"194\" rx=\"12\" fill=\"#1e293b\" stroke=\"#f59e0b\" stroke-width=\"2\"/>\n      <text x=\"660\" y=\"42\" fill=\"#fbbf24\" font-size=\"13.5\" font-weight=\"bold\" text-anchor=\"middle\">3. 3D Solids &amp; Finance</text>\n      <text x=\"550\" y=\"72\" fill=\"#e2e8f0\" font-size=\"12\">• Cone: V = ⅓πr²h | SA = πr² + πrs</text>\n      <text x=\"550\" y=\"96\" fill=\"#fde047\" font-size=\"11.5\" font-weight=\"bold\">  Slant Height: s = √(r² + h²)!</text>\n      <text x=\"550\" y=\"122\" fill=\"#e2e8f0\" font-size=\"12\">• Sphere: V = ⁴⁄₃πr³ | SA = 4πr²</text>\n      <text x=\"550\" y=\"150\" fill=\"#6ee7b7\" font-size=\"12\">• Appreciation: A = P(1 + r)ᵗ</text>\n      <text x=\"550\" y=\"176\" fill=\"#fca5a5\" font-size=\"12\">• Depreciation: A = P(1 − r)ᵗ</text>\n    </svg>\n    ", "g9_sci_chem_elec_svg": "\n    <svg viewBox=\"0 0 800 230\" class=\"topic-svg\" role=\"img\" aria-label=\"Grade 9 SNC1W Bohr Diagram, Ohm's Law Circuits, and Star Life Cycles\">\n      <rect x=\"0\" y=\"0\" width=\"800\" height=\"230\" rx=\"     function formatTime() {

    function fmtText(str) {
      return String(str || '')
        .replace(/`([^`]+)`/g, '<code class="inline-code">$1</code>')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/(^|[\s(\[?'"])\*([^\s*][^*]*?[^\s*]|[^\s*])\*(?=[\s.,;:!?\)?'"]|$)/g, '$1<em>$2</em>');
    }
    function escapeHtml(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    
    let isSpeakingLesson = false;
    function stopSpeech() {
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      isSpeakingLesson = false;
      const btn = document.getElementById('listenLessonBtn');
      if (btn) btn.textContent = '🔊 Listen';
    }
    function speakLessonAloud(courseId, uIdx, lIdx) {
      if (!('speechSynthesis' in window)) return;
      if (isSpeakingLesson) {
        stopSpeech();
        return;
      }
      const c = COURSES.find(x => x.id === courseId) || COURSES[app.courseIdx];
      const l = c.units[uIdx].lessons[lIdx];
      const fullText = `${l.title}. Big idea: ${l.bigIdea}. ${l.paragraphs.join(' ')} Remember this: ${l.keyTakeaway}`.replace(/[`*]/g, '');
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(fullText);
      u.lang = 'en-CA';
      u.rate = 0.96;
      isSpeakingLesson = true;

      if (btn) btn.textContent = '⏹ Stop Audio';
      u.onend = () => { stopSpeech(); };
      u.onerror = () => { stopSpeech(); };

    // Feature #2: Live Detail & Weak-Word Upgrade Meter (E. Catana & O. Macri)
    const WEAK_WORDS = {
      'fun': 'energizing / engaging',
      'good': 'beneficial / effective',
      'nice': 'supportive / impressive',
      'bad': 'harmful / challenging',
      'stuff': 'equipment / materials',
      'things': 'elements / factors',
      'very': '(use a stronger verb/adjective!)',
      'really': '(use a sharper detail!)'
    };

    function analyzeStudentText(text, courseId) {
      const cleaned = (text || '').trim();
      const words = cleaned ? cleaned.split(/\s+/).filter(Boolean) : [];
      const count = words.length;
      const target = (courseId === 'math') ? 10 : (courseId === 'french' ? 12 : 25);
      const foundWeak = [];
      if (['english', 'geo', 'history', 'science', 'pe', 'arts', 'tech'].includes(courseId)) {
        const lower = ' ' + cleaned.toLowerCase().replace(/[^a-z\s]/g, ' ') + ' ';
        Object.keys(WEAK_WORDS).forEach(w => {
          if (lower.includes(' ' + w + ' ')) foundWeak.push(`"${w}" → ${WEAK_WORDS[w]}`);
        });
      }
      return { count, target, met: count >= target, foundWeak };
    }

    function updateLiveMeter(courseId, val) {
      const el = document.getElementById('liveDetailMeter');
      if (!el) return;
      const info = analyzeStudentText(val, courseId);
      const statusHtml = info.met
        ? `<span class="meter-good">✅ Great detail! (${info.count} words)</span>`
        : `<span>✍️ Detail Meter: <strong>${info.count}</strong> / ${info.target}+ words target</span>`;
      const weakHtml = info.foundWeak.length
        ? `<span class="meter-warn">✨ Upgrade tip: ${escapeHtml(info.foundWeak.slice(0, 2).join(' | '))}</span>`
        : `<span style="color:var(--text-muted);">Tip: Show all steps &amp; specifics!</span>`;
      el.innerHTML = statusHtml + weakHtml;
    }

    // Feature #3: Infinite Randomized Math Careless-Error & French Drill Engine

    function genMathDrill() {
      const types = ['exp_sign', 'exp_neg_zero', 'perp_slope', 'cone_slant', 'depreciate', 'ohms_law', 'circle_thm'];
      const t = types[Math.floor(Math.random() * types.length)];
      if (t === 'exp_sign') {
        const b = Math.floor(Math.random() * 5) + 2; // 2..6
        const c = Math.floor(Math.random() * 5) + 1;
        const ans = -(b * b) + c;
        const trap = (b * b) + c;
        return {
          topic: 'MTH1W Exponent Sign Shield (−a² vs. (−a)²)',
          prompt: `Evaluate WITHOUT brackets on the base:  −${b}² + ${c}`,
          answer: String(ans),
          trapAnswer: String(trap),
          trapMsg: `Bracket Trap! Without brackets, −${b}² means −(${b}×${b}) = −${b*b}, NOT +${b*b}!`,
          steps: `−${b}² = −${b*b}, so −${b*b} + ${c} = ${ans}.`
        };
      } else if (t === 'exp_neg_zero') {
        const a = Math.floor(Math.random() * 6) + 2;
        const b = [2, 4, 5][Math.floor(Math.random() * 3)];
        const ans = +(1 + (1 / b)).toFixed(2);
        const zeroTrap = +(0 + (1 / b)).toFixed(2);
        return {
          topic: 'Zero & Negative Exponents (Decimal Answer)',
          prompt: `Evaluate as a decimal:  ${a}⁰ + ${b}⁻¹`,
          answer: String(ans),
          trapAnswer: String(zeroTrap),
          trapMsg: `Zero Exponent Trap! ${a}⁰ equals 1 (NOT 0!), and ${b}⁻¹ = 1/${b} = ${1/b}!`,
          steps: `${a}⁰ = 1 and ${b}⁻¹ = 1/${b} = ${1/b} → Total = ${ans}.`
        };
      } else if (t === 'perp_slope') {
        const pairs = [[2, -0.5], [4, -0.25], [5, -0.2], [-2, 0.5], [-4, 0.25]];
        const [m, mp] = pairs[Math.floor(Math.random() * pairs.length)];
        return {
          topic: 'Perpendicular Slope (Negative Reciprocal!)',
          prompt: `A line has slope m = ${m}. Find the PERPENDICULAR slope as a decimal (e.g. -0.5):`,
          answer: String(mp),
          trapAnswer: String(-m),
          trapMsg: `Reciprocal Trap! You flipped the sign (−${m}) without flipping the fraction (1/${m})!`,
          steps: `Flip ${m}/1 → 1/${m} AND flip the sign → ${mp}.`
        };
      } else if (t === 'cone_slant') {
        const triples = [[3,4,5],[6,8,10],[5,12,13],[9,12,15]];
        const [r, h, s] = triples[Math.floor(Math.random() * triples.length)];
        return {
          topic: 'Cone Slant Height (3D Pythagoras)',
          prompt: `A cone has radius r = ${r} cm and vertical height h = ${h} cm. Find its Slant Height s:`,
          answer: String(s),
          trapAnswer: String(r*r + h*h),
          trapMsg: `Forgot √ Trap! s² = ${r}² + ${h}² = ${s*s} → take √${s*s} = ${s} cm!`,
          steps: `s = √(${r}² + ${h}²) = √${s*s} = ${s} cm.`
        };
      } else if (t === 'depreciate') {
        const P = [1000, 2000, 5000][Math.floor(Math.random() * 3)];
        const A = +(P * 0.8 * 0.8).toFixed(2);
        const linTrap = +(P * 0.6).toFixed(2);
        return {
          topic: 'MTH1W Depreciation: A = P(1 − r)ᵗ',
          prompt: `A $${P} laptop depreciates 20% per year. Find its value ($) after 2 years:`,
          answer: String(A),
          trapAnswer: String(linTrap),
          trapMsg: `Linear Trap! Losing 20% twice does NOT subtract 40% ($${linTrap})—multiply $${P} × 0.80² = $${A}!`,
          steps: `A = ${P} × (0.80)² = ${P} × 0.64 = $${A}.`
        };
      } else if (t === 'circle_thm') {
        const insc = [32, 38, 44, 52, 58, 64][Math.floor(Math.random() * 6)];
        const cent = insc * 2;
        return {
          topic: 'EQAO Circle Theorem (Central = 2 × Inscribed!)',
          prompt: `A circle has Central Angle = ${cent}° on arc AB. Find the Inscribed Angle (°) on the same arc:`,
          answer: String(insc),
          trapAnswer: String(cent),
          trapMsg: `Circle Angle Trap! Inscribed Angle at the rim is HALF the Central Angle (${cent}° ÷ 2 = ${insc}°), not equal!`,
          steps: `Inscribed Angle = Central Angle ÷ 2 = ${cent}° ÷ 2 = ${insc}°.`
        };
      } else {
        const I = Math.floor(Math.random() * 5) + 2;
        const R = Math.floor(Math.random() * 6) + 3;
        const V = I * R;
        return {
          topic: "SNC1W Ohm's Law Bonus (I = V ÷ R)",
          prompt: `A ${V} V circuit has Resistance R = ${R} Ω. Calculate Current I (in Amps):`,
          answer: String(I),
          trapAnswer: String(V * R),
          trapMsg: `Rearranging Trap! Since V = I × R, divide I = V ÷ R = ${V} ÷ ${R} = ${I} A (do not multiply!).`,
          steps: `I = V ÷ R = ${V} V ÷ ${R} Ω = ${I} A.`
        };
      }
    }

    function checkMathDrill() {
      const inp = document.getElementById('mathDrillInput');
      if (!inp || !inp.value.trim()) return;
      const val = inp.value.trim().replace(/[$,\s]/g, '');
      const numVal = parseFloat(val);
      const target = parseFloat(drill.q.answer);
      drill.userAns = val;
      if (!isNaN(numVal) && Math.abs(numVal - target) < 0.02) {
        saved.drillStats.mathCorrect = (saved.drillStats.mathCorrect || 0) + 1;
        saveState();
        drill.feedback = { ok: true, msg: `🎉 Spot on! ${drill.q.steps}` };
      } else if (drill.q.trapAnswer && !isNaN(numVal) && Math.abs(numVal - parseFloat(drill.q.trapAnswer)) < 0.02) {
        drill.feedback = { ok: false, msg: `🛡️ ${drill.q.trapMsg} (${drill.q.steps})` };
      } else {
        drill.feedback = { ok: false, msg: `💡 Not quite (Answer: ${drill.q.answer}). ${drill.q.steps}` };
      }
      openToolsModal('drills');
    }

    function handleBackupFile(ev) {
      const file = ev.target.files && ev.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          if (parsed && parsed.data) {
            saved = Object.assign({ lessonsRead:{}, qcAnswers:{}, inputs:{}, checks:{}, qaDone:{}, weakSpots:{}, feedbackNotes:[], streak:{days:0,lastDate:''}, drillStats:{mathCorrect:0,frenchCorrect:0,sprintsDone:0} }, parsed.data);
            saveState();
            if (parsed.theme === 'dark') document.body.classList.add('dark');
            else document.body.classList.remove('dark');
            alert('✅ Progress backup restored successfully!');
            closeModal();
            render();
          } else {
            alert('Invalid backup file format.');
          }
        } catch (err) {
          alert('Could not read backup file: ' + err.message);
        }
      };
      reader.readAsText(file);
    }

    let quizState = { subjectId: 'all', mode: 'flash', idx: 0, flipped: false, score: 0, answered: null };

    function getReviewDeck(subjectId) {
      const deck = [];
      COURSES.forEach(c => {
        if (subjectId !== 'all' && c.id !== subjectId) return;
        c.units.forEach(u => {
          (u.lessons || []).forEach(l => {
            if (l.quickCheck) {
              deck.push({
                courseName: c.name,
                icon: c.icon,
                title: l.title,
                front: l.bigIdea,
                back: l.keyTakeaway,
                qc: l.quickCheck,
                lessonId: l.id
              });
            }
          });
        });
      });
      return deck;
    }

    function setQuizSubject(subId) {
      quizState.subjectId = subId;
      quizState.idx = 0;
      quizState.flipped = false;
      quizState.answered = null;
      quizState.score = 0;
      openToolsModal('quiz');
    }

    function setQuizMode(m) {
      quizState.mode = m;
      quizState.idx = 0;
      quizState.flipped = false;
      quizState.answered = null;
      quizState.score = 0;
      openToolsModal('quiz');
    }

    function answerSimQuiz(choiceIdx) {
      if (quizState.answered !== null) return;
      const deck = getReviewDeck(quizState.subjectId);
      const card = deck[quizState.idx];
      quizState.answered = choiceIdx;
      if (choiceIdx === card.qc.correctIdx) {
        quizState.score++;
      } else {
        const key = `${card.courseName}: ${card.title} (Quiz Sim)`;
        saved.weakSpots[key] = (saved.weakSpots[key] || 0) + 1;
        saveState();
      }
      openToolsModal('quiz');
    }

    function nextSimCard() {
      const deck = getReviewDeck(quizState.subjectId);
      quizState.idx = (quizState.idx + 1) % deck.length;
      quizState.flipped = false;
      quizState.answered = null;
      openToolsModal('quiz');
    }

      let lines = ['ZAID GRADE 9 ONTARIO PROGRESS SUMMARY', '===================================='];
      let totDone = 0, totAll = 0;
      COURSES.forEach(c => {
        const p = courseProgress(c);
        totDone += p.done; totAll += p.total;
        lines.push(`${c.name}: ${p.done}/${p.total} completed (${p.pct}%)`);
      });
      lines.push(`OVERALL PROGRESS: ${totDone}/${totAll} (${Math.round((totDone/totAll)*100)}%)`);
      const weak = Object.entries(saved.weakSpots || {}).filter(([,v]) => v > 0);
      if (weak.length) {
        lines.push('', 'TOPICS TO REVIEW NEXT:');
        weak.forEach(([k, v]) => lines.push(`- ${k} (${v}x)`));
      }
      const txt = lines.join('\n');
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(() => {

${escapeHtml(n.text)}</div>

    function openExtraNotesCard(course, lesson) {

    function openHintWithLog(partLabel, hintText) {
      const c = COURSES[app.courseIdx];
      const q = c.units[app.unitIdx].questions[app.questionIdx];
      const key = `${c.name}: ${q.title} (${partLabel} hint)`;

      saveState();
      openModal(`💡 Hint for ${partLabel}`, `<div class="info-box">${escapeHtml(hintText)}</div>`);
    }

    function openQuestionPromptCard(q) {
      openModal(`🎯 ${q.title}`, `<div class="info-box">${q.prompt}</div>`);

    // Navigation
    function goHome() { app.screen = 'home'; render(); window.scrollTo(0, 0); }
    function openCourse(cIdx) {
      app.courseIdx = cIdx;
      app.openUnitIdx = 0;
      app.screen = 'course';
      render();
      window.scrollTo(0, 0);
    }
    function openLesson(cIdx, uIdx, lIdx, tab = 'read') {
      app.courseIdx = cIdx;
      app.unitIdx = uIdx;
      app.lessonIdx = lIdx;
      app.lessonTab = tab;
      app.activeVideoIdx = 0;
      app.screen = 'lesson';
      render();
      window.scrollTo(0, 0);
    }
    function openBloom(cIdx, uIdx, lvl = 1) {
      app.courseIdx = cIdx;
      app.unitIdx = uIdx;
      app.bloomLvl = lvl;
      app.screen = 'bloom';
      render();
      window.scrollTo(0, 0);
    }
    function openQuestion(cIdx, uIdx, qIdx, step = 1) {
      app.courseIdx = cIdx;
      app.unitIdx = uIdx;
      app.questionIdx = qIdx;
      app.qaStep = step;
      app.subStepIdx = 0;
      app.screen = 'question';
      render();
      window.scrollTo(0, 0);
    }

    function loadYouTube(slotId, vidId, title) {
      const el = document.getElementById(slotId);
      if (!el) return;
      el.innerHTML = `
        <div class="yt-iframe-wrap">
          <iframe
            src="https://www.youtube-nocookie.com/embed/${vidId}?autoplay=1&rel=0"
            title="${escapeHtml(title)}"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen
          ></iframe>
        </div>
      `;
    }

    function courseProgress(course) {
      let total = 0, done = 0;
      course.units.forEach(u => {
        (u.lessons || []).forEach(l => { total++; if (saved.lessonsRead[l.id]) done++; });
        (u.questions || []).forEach(q => {
          total++;
          if (saved.qaDone[q.id] || q.step4_checks.every((_, i) => !!saved.checks[`${q.id}_chk_${i}`])) done++;
        });
      });
      return { total, done, pct: total ? Math.round((done / total) * 100) : 0 };
    }

    function getNextTask() {
      for (let cIdx = 0; cIdx < COURSES.length; cIdx++) {
        const c = COURSES[cIdx];
        for (let uIdx = 0; uIdx < c.units.length; uIdx++) {
          const u = c.units[uIdx];
          for (let lIdx = 0; lIdx < (u.lessons || []).length; lIdx++) {
            if (!saved.lessonsRead[u.lessons[lIdx].id]) {
              return { type: 'lesson', cIdx, uIdx, lIdx, course: c, item: u.lessons[lIdx] };
            }
          }
          for (let qIdx = 0; qIdx < (u.questions || []).length; qIdx++) {
            const q = u.questions[qIdx];
            if (!saved.qaDone[q.id] && !q.step4_checks.every((_, i) => !!saved.checks[`${q.id}_chk_${i}`])) {
              return { type: 'question', cIdx, uIdx, qIdx, course: c, item: q };
            }
          }
        }
      }
      return { type: 'lesson', cIdx: 0, uIdx: 0, lIdx: 0, course: COURSES[0], item: COURSES[0].units[0].lessons[0] };
    }

    /* ============================================================
       ADAPTIVE TOP BAR (Minimal & Quiet in Focus Mode!)
       ============================================================ */
    function renderTopBar() {
      const bar = document.getElementById('topBar');
      if (app.screen === 'home') {
        bar.innerHTML = `
          <button class="brand-trigger" onclick="goHome()">

            <span>Zaid's Grade 9 Study Space</span>
          </button>
          <button class="btn btn-primary" onclick="openToolsModal('tools')">🧰 Study Tools &amp; Charts</button>
        `;
      } else if (app.screen === 'course') {
        const c = COURSES[app.courseIdx];
        bar.innerHTML = `
          <button class="btn" onclick="goHome()">← All Subjects</button>
          <span class="focus-center-title">${c.icon} ${c.name}</span>
          <button class="btn" onclick="openToolsModal('charts')">📚 Charts &amp; Tools</button>
        `;
      } else {
        const c = COURSES[app.courseIdx];
        bar.innerHTML = `
          <button class="btn" onclick="openCourse(${app.courseIdx})">← Back to ${c.name}</button>
          <span class="focus-center-title">${c.icon} ${app.screen === 'lesson' ? `Lesson ${app.lessonIdx + 1}` : (app.screen === 'bloom' ? `Bloom's Level ${app.bloomLvl}/6` : `Step ${app.qaStep}/5`)}</span>
          <button class="btn btn-soft" onclick="openToolsModal('charts')">🧰 Help</button>
        `;
      }
    }

    /* ============================================================
       SCREEN 1: CLEAN HOME HUB
       ============================================================ */
    function renderHome() {
      const next = getNextTask();
      let done = 0, total = 0;
      COURSES.forEach(c => { const p = courseProgress(c); done += p.done; total += p.total; });

      const makeCard = (c, idx) => {
        const p = courseProgress(c);
        const cls = c.tierClass === 'tier-urgent' ? 'pill-urgent' : (c.tierClass === 'tier-strong' ? 'pill-core' : 'pill-extra');
        const lbl = c.tierClass === 'tier-urgent' ? 'Study First' : (c.tierClass === 'tier-strong' ? 'Core' : 'High School Credit');
        return `
          <button class="subject-card anim-card" onclick="openCourse(${idx})">
            <div class="subject-top">
              <div class="emoji-box">${c.icon}</div>
              <span class="pill-tag ${cls}">${lbl}</span>
            </div>
            <div>
              <h3>${c.name}</h3>
              <p>${c.friendlySub}</p>
            </div>
            <div>
              <div style="display:flex; justify-content:space-between; font-size:0.78rem; color:var(--text-muted); font-weight:600;">
                <span>${c.units.length} ${c.units.length === 1 ? 'Unit' : 'Units'}</span>
                <span>${p.done}/${p.total} done</span>
              </div>
              <div class="prog-track"><div class="prog-fill" style="width:${p.pct}%;"></div></div>
            </div>
          </button>
        `;
      };

      const priority = COURSES.map((c, i) => ({ c, i })).filter(x => x.c.tierClass === 'tier-urgent');
      const core = COURSES.map((c, i) => ({ c, i })).filter(x => ['math', 'english', 'science'].includes(x.c.id));
      const extra = COURSES.map((c, i) => ({ c, i })).filter(x => ['history', 'tech', 'pe', 'arts'].includes(x.c.id));

      const startFn = next.type === 'lesson'
        ? `openLesson(${next.cIdx}, ${next.uIdx}, ${next.lIdx}, 'read')`
        : `openQuestion(${next.cIdx}, ${next.uIdx}, ${next.qIdx}, 1)`;

      return `
        <div class="wrap-home">
          <section class="hero anim-card">
            <div>
              ${(saved.streak && saved.streak.days > 0) ? `<span class="streak-chip">🔥 ${saved.streak.days}-Day Study Streak</span>` : ''}
              <h1>Hi Zaid! Ready for your next card?</h1>
              <p>Next up in <strong>${next.course.icon} ${next.course.name}</strong>: ${next.item.title}</p>
              <button class="hero-btn" onclick="${startFn}">
                ${next.type === 'lesson' ? '📖 Open Lesson Card →' : '✏️ Open Practice Card →'}
              </button>
            </div>
            <div class="hero-ring">
              <div class="hero-ring-num">${done} / ${total}</div>
              <div class="hero-ring-sub">Cards Completed</div>
            </div>
          </section>

          <div class="group-label">
            <span>🔥 Study First</span>
            <span class="sub">Tap a subject card to open its lessons</span>
          </div>
          <div class="grid-2">${priority.map(x => makeCard(x.c, x.i)).join('')}</div>

          <div class="group-label">
            <span>📘 Core Subjects</span>
          </div>
          <div class="grid-3">${core.map(x => makeCard(x.c, x.i)).join('')}</div>

          <div style="margin-top:26px;">
            <button class="btn" onclick="app.showMoreSubjects=!app.showMoreSubjects; render();">
              ${app.showMoreSubjects ? '▾ Hide Tech (TAS1O), Health & PE & The Arts' : '▸ More Credits (Mandatory Tech TAS1O, PPL1O Health & PE, Grade 9 Arts)'}
            </button>
          </div>
          ${app.showMoreSubjects ? `<div class="grid-3" style="margin-top:14px;">${extra.map(x => makeCard(x.c, x.i)).join('')}</div>` : ''}
        </div>
      `;
    }

    /* ============================================================
       SCREEN 2: COURSE UNIT CARDS (1 UNIT OPEN AT A TIME!)
       ============================================================ */
    function renderCourse() {
      const c = COURSES[app.courseIdx];
      return `
        <div class="wrap-focus">
          <div style="margin-bottom:20px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;">

                        <button class="card-tile" onclick="openQuestion(${app.courseIdx}, ${uIdx}, ${qIdx}, 1)">
