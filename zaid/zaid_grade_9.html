"REMEMBER", "subtitle": "Recall Canada's Electricity Mix, Critical Minerals & FPIC", "content": "Lock in Strand C essentials:", "keyPoints": ["Canada electricity: ~60% Hydro, ~15% Nuclear, growing Wind/Solar (>80% non-emitting!).", "FPIC = Free, Prior, and Informed Consent with Indigenous nations before resource projects."]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Explain Why EV Batteries Still Require Responsible Mining", "content": "Clean tech shifts Canada away from burning fossil fuels—while increasing demand for Northern Ontario lithium, nickel, and copper.", "analogy": "🔋 Battery Reality Check: Even green technologies need real minerals—so ethical mining, recycling old batteries, and Indigenous partnerships matter hugely!", "keyPoints": ["Circular economy = recycling EV battery minerals so we mine far less new ore!"]}, {"level": 3, "name": "APPLY", "subtitle": "Weigh Stakeholders in a Proposed Northern Ontario Lithium Mine", "content": "Apply a 3-stakeholder lens:", "workedExample": {"prompt": "Map Economy, Environment, and Indigenous perspectives on a Northern Ontario mine:", "steps": ["Economy: High-paying jobs + Canadian EV supply chain.", "Environment: Wetland/peatland carbon storage & water runoff protection.", "Indigenous Nations: Treaty rights, FPIC consultation, revenue sharing & environmental monitoring!"]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Renewable vs. Nuclear vs. Fossil Electricity", "content": "Evaluate reliability, emissions & cost:", "comparisonTable": {"headers": ["Source", "CO₂ Emissions", "24/7 Reliability?", "Key Challenge"], "rows": [["Hydro", "Very Low", "✅ Yes", "Flooding river valleys"], ["Nuclear", "Very Low", "✅ Yes (Baseload)", "High build cost + waste storage"], ["Wind / Solar", "Very Low", "⚠️ Intermittent", "Needs battery/hydro backup"], ["Natural Gas", "Moderate–High", "✅ Yes (Peaker)", "Greenhouse gas emissions"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Critique 'All-or-Nothing' Resource Debates", "content": "Use geographic nuance:", "keyPoints": ["Smart CGC1W thinkers propose balanced transitions—combining conservation, grid storage, clean nuclear/hydro, Indigenous partnerships, and retraining workers!"]}, {"level": 6, "name": "CREATE", "subtitle": "Draft a 3-Point Clean Energy & Stewardship Plan for Ontario 2035", "content": "Balance rising EV/AI electricity demand with net-zero goals.", "keyPoints": ["Include energy efficiency, hydro/nuclear/wind+battery mix, and Indigenous Guardians co-management!"]}], "questions": [{"id": "g9-geo-q2", "bloomLevel": 5, "bloomTag": "EVALUATE & ANALYZE", "title": "CGC1W Resource Lab: Ontario's Clean Grid, Critical Minerals & FPIC", "prompt": "Ontario needs 30% more clean electricity by 2035 as families switch to EVs and electric heat pumps, and companies want to mine lithium/nickel in Northern Ontario's Shield.\n(a) Explain why **Wind & Solar** alone cannot power Ontario at 8:00 p.m. on a calm −25°C January night, and name the **2 non-emitting baseload sources** Ontario relies on.\n(b) Evaluate **1 benefit** AND **1 environmental risk** of mining critical minerals (lithium/nickel) in Northern Ontario.\n(c) Explain what **FPIC** (Free, Prior, and Informed Consent) means and why partnering with First Nations Guardians strengthens sustainable resource management.", "step1_deconstruct": {"instruction": "Address intermittency + Ontario's baseload sources in (a), weigh benefit vs. risk of mining in (b), and explain FPIC + stewardship in (c).", "guidingQuestions": ["What happens to solar panels at night and wind turbines in calm air?", "Why are Northern Ontario's peatlands/rivers sensitive to mining?", "What do the 4 letters F-P-I-C require?"], "modelPlan": "(a) Solar/wind are intermittent → Ontario pairs them with 24/7 Nuclear + Hydro (+ battery storage). (b) Benefit: EV batteries/jobs; Risk: disturbing carbon-rich peatlands & watershed pollution. (c) FPIC respects Indigenous treaty consent before building; Guardians combine local ecological knowledge with science."}, "step2_anchor": {"instruction": "Strand C Anchors:", "referenceItems": ["Ontario Baseload: Nuclear (~55–60%) + Hydro (~25%) + Wind/Solar + Battery Storage", "FPIC = Free, Prior, and Informed Consent + Two-Eyed Seeing stewardship"]}, "step3_substeps": [{"label": "Step 3a: Explain Wind/Solar intermittency AND Ontario's 2 main clean baseload sources", "placeholder": "On a calm winter night, wind and solar... Therefore, Ontario relies on...", "hint": "No sun at night + calm air = low output; Ontario uses 24/7 **Nuclear** and **Hydroelectricity** (plus grid batteries)!", "modelSubAnswer": "Solar panels generate zero electricity at night and wind turbines slow during calm winter cold snaps (**intermittency**). Therefore, Ontario pairs renewables with 24/7 carbon-free **Nuclear** (~55–60%) and **Hydroelectricity** (~25%), plus emerging battery storage."}, {"label": "Step 3b: Weigh 1 benefit AND 1 environmental risk of Northern Ontario critical-mineral mining", "placeholder": "Benefit: ...\nEnvironmental Risk: ...", "hint": "Benefit: Domestic lithium/nickel for EV batteries & jobs; Risk: Disturbing carbon-storing peatlands and watershed runoff!", "modelSubAnswer": "• **Benefit:** Supplies Canadian-mined nickel and lithium needed for EV batteries and grid storage while creating high-skilled jobs.\n• **Environmental Risk:** Building mines and roads across Northern Ontario's boreal peatlands can release massive stored carbon and risk heavy-metal runoff into northern rivers unless tightly regulated."}, {"label": "Step 3c: Define **FPIC** and explain how Indigenous Guardians improve stewardship", "placeholder": "FPIC stands for... Partnering with Indigenous Guardians strengthens sustainability because...", "hint": "Free, Prior, and Informed Consent BEFORE construction + combining Traditional Ecological Knowledge with Western science!", "modelSubAnswer": "**FPIC** stands for **Free, Prior, and Informed Consent**—meaning Indigenous nations have the right to be consulted transparently and decide freely *before* projects enter their treaty/traditional territories. Indigenous Guardians programs combine centuries of local ecological knowledge with Western science (**Two-Eyed Seeing**) to monitor water, wildlife, and forest health long-term."}], "step4_checks": ["Did I correctly explain intermittency AND name Nuclear + Hydro for Ontario?", "Did I present BOTH a benefit and a concrete environmental risk in Step 3b?", "Did I define FPIC accurately and connect it to Indigenous stewardship?"], "step5_modelAnswer": {"basicAnswer": "Wind/solar stop at night so we use nuclear/hydro. Mining gives batteries but hurts land. FPIC asks First Nations first.", "expandedAnswer": "Part (a): Because wind and solar are intermittent on calm winter nights, Ontario anchors its clean grid with 24/7 **Nuclear** and **Hydroelectricity** alongside growing battery storage.\nPart (b): Northern Ontario critical minerals enable domestic EV batteries and skilled jobs, yet mining risks disturbing carbon-rich boreal peatlands and freshwater watersheds without strict safeguards.\nPart (c): **FPIC (Free, Prior, and Informed Consent)** honours Indigenous treaty rights before projects proceed, and Indigenous Guardians apply *Two-Eyed Seeing* to protect rivers, biodiversity, and community well-being.", "extensionPrompt": "Extension: How does recycling lithium and nickel from old EV batteries reduce pressure to open brand-new mines?"}}]}, {"id": "g9-geo-u3", "title": "Unit 3 (Strand D): Changing Populations — Demographics, Immigration & Aging Canada", "studyFirstTag": "Why immigration drives >90% of Canada's growth—and how demographics reshape our future!", "curriculumStrand": "Ontario CGC1W Strand D: Changing Populations", "svgDiagram": "g9_cgc_svg", "lessons": [{"id": "g9-geo-u3-l1", "title": "Lesson 3.1: Natural Increase vs. Net Migration, Immigration Classes & Indigenous Youth", "readTime": "3 min read", "bigIdea": "With Canada's birth rate at a record low (~1.3 children/woman) and Baby Boomers retiring, **Net Migration (Immigration)** now drives over **90% of Canada's population growth**—while Indigenous peoples are Canada's **fastest-growing young population**!", "paragraphs": ["Demographers calculate population change using one simple equation: **`Population Growth = Natural Increase (Births − Deaths) + Net Migration (Immigrants − Emigrants)`**. Today, Canada's **Natural Increase** is tiny because families have fewer children (below the **2.1 replacement rate**!) while life expectancy exceeds 82 years. Without immigration, Canada's workforce would shrink rapidly, leaving too few nurses, engineers, teachers, and tradespeople to support retiring Baby Boomers!", "Canada welcomes newcomers through **3 Official Immigration Classes**: (1) **Economic Class (~60%)**—selected using the **Express Entry Points System** (age, education, skilled work experience, English/French fluency!); (2) **Family Class (~25%)**—reuniting spouses, parents, and children; and (3) **Refugees (~15%)**—protecting people fleeing war or persecution under international humanitarian law.", "At the same time, recognize a vital demographic contrast inside Canada: **First Nations, Métis, and Inuit peoples** have an **Expansive** pyramid (average age ~10 years younger than non-Indigenous Canadians!)—making investment in Indigenous schools, housing, and careers essential for Canada's future!"], "keyTakeaway": "`Pop Growth = (Births − Deaths) + (Immigrants − Emigrants)`. Canada's 3 Immigration Classes: **Economic (~60% Points System)**, **Family (~25%)**, **Refugees (~15%)**.", "deepReadTitle": "📊 Demographic Formulas (CGC1W Strand D)", "deepReadText": "• Natural Increase Rate (NIR) = Birth Rate − Death Rate\n• Net Migration Rate (NMR) = Immigration Rate − Emigration Rate\n• Population Growth Rate (PGR) = NIR + NMR\n• Rule of 70 (Doubling Time): `Years to Double ≈ 70 ÷ Growth Rate (%)`!", "quickCheck": {"question": "If a country has a Birth Rate of `10/1000`, Death Rate of `9/1000`, Immigration Rate of `12/1000`, and Emigration Rate of `2/1000`, what is its **Population Growth Rate**?", "options": ["1 per 1000 (0.1%)", "11 per 1000 (1.1% — driven mostly by Net Migration!)", "33 per 1000 (3.3%)"], "correctIdx": 1, "explanation": "`NIR = 10 − 9 = +1`; `NMR = 12 − 2 = +10`; `PGR = 1 + 10 = 11 per 1000` (`1.1%`), showing Net Migration drives over 90% of growth!"}, "videos": [{"id": "RLmKfXwWQtE", "title": "Population Pyramids: Powerful Predictors of the Future", "channel": "TED-Ed", "why": "Visualizes aging pyramids, dependency load, and demographic shifts."}]}], "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Recall Demographic Equations & Canada's 3 Immigration Classes", "content": "Lock in Strand D formulas:", "keyPoints": ["`PGR = (Births − Deaths) + (Immigrants − Emigrants)` | Doubling Time = `70 ÷ % Growth`.", "3 Classes: Economic (~60% points), Family (~25%), Refugees (~15%)."]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Explain Why Rapid Growth Requires Matching Housing & Transit", "content": "Welcoming newcomers strengthens the economy AND requires cities to build homes, hospitals, and schools at the same pace!", "analogy": "🍽️ Dinner Party Analogy: Inviting helpful guests makes the gathering richer and livelier—as long as you also set enough chairs and cook enough food (housing & infrastructure)!", "keyPoints": ["Smart policy aligns immigration targets with housing construction, credential recognition (doctors/engineers!), and transit!"]}, {"level": 3, "name": "APPLY", "subtitle": "Apply the Rule of 70 & Growth Rate Formulas", "content": "Calculate doubling time cleanly:", "workedExample": {"prompt": "City A grows at `2%` per year; City B grows at `0.5%` per year. Compare doubling times:", "steps": ["City A: `70 ÷ 2 = 35 years` to double!", "City B: `70 ÷ 0.5 = 140 years` to double!"]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Non-Indigenous vs. Indigenous Canadian Demographics", "content": "Spot the key internal contrast:", "comparisonTable": {"headers": ["Group", "Pyramid Shape", "Key Policy Priority"], "rows": [["Overall Canadian Population", "Constrictive (aging Boomers)", "Senior care, skilled immigration, housing"], ["Indigenous Peoples in Canada", "Expansive (young & fast-growing)", "Youth education, clean water, trades & leadership"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Evaluate the 'Foreign Credential Barrier' Facing Skilled Immigrants", "content": "Why do doctors or engineers from abroad sometimes struggle to work in their field in Ontario?", "keyPoints": ["Slow licensing exams waste vital talent Canada desperately needs—fast-tracking fair credential assessment benefits everyone!"]}, {"level": 6, "name": "CREATE", "subtitle": "Recommend 2 Policies to Balance Canada's Aging Workforce", "content": "Combine housing-aligned immigration with youth/trades investment.", "keyPoints": ["Cite credential recognition, affordable housing near transit, and Indigenous youth empowerment!"]}], "questions": [{"id": "g9-geo-q3", "bloomLevel": 4, "bloomTag": "APPLY & ANALYZE", "title": "CGC1W Demographics Lab: Growth Math, Immigration Classes & Aging Canada", "prompt": "(a) Canada's Birth Rate is `9.5/1000`, Death Rate is `8.5/1000`, Immigration Rate is `12.0/1000`, and Emigration Rate is `2.0/1000`. Calculate **Natural Increase (`NIR`)**, **Net Migration (`NMR`)**, **Population Growth Rate (`PGR` in %)**, and **Doubling Time (`Rule of 70`)**!\n(b) Name and briefly explain Canada's **3 official Immigration Classes**, and explain why the Express Entry system awards extra points for **French/English bilingualism** and **skilled trades/healthcare**.\n(c) Explain **1 economic benefit** AND **1 infrastructure challenge** of rapid urban population growth in cities like Ottawa and Toronto.", "step1_deconstruct": {"instruction": "Run exact demographic math in (a), cover all 3 classes + points rationale in (b), and balance benefit vs. challenge in (c).", "guidingQuestions": ["How do you convert `11 per 1,000` into a percentage (`÷ 10 = 1.1%`)?", "What is `70 ÷ 1.1`?", "What are the 3 immigration classes?"], "modelPlan": "(a) NIR = 1.0/1000; NMR = 10.0/1000; PGR = 11.0/1000 = 1.1%; Doubling = 70÷1.1 ≈ 63.6 yrs. (b) Economic, Family, Refugee; points target aging-workforce gaps & bilingual vitality. (c) Benefit: fills healthcare/trades & funds pensions; Challenge: housing supply & transit/hospital capacity must keep pace!"}, "step2_anchor": {"instruction": "Formulas:", "referenceItems": ["`NIR = BR − DR` | `NMR = IR − ER` | `PGR = NIR + NMR` (per 1000 → `÷ 10` for `%`!)", "Rule of 70: `Doubling Time = 70 ÷ PGR(%)`"]}, "step3_substeps": [{"label": "Step 3a: Calculate `NIR`, `NMR`, `PGR (%)`, and `Doubling Time`", "placeholder": "NIR = ...\nNMR = ...\nPGR = ... per 1000 = ...%\nDoubling Time = 70 ÷ ... = ... yrs", "hint": "1.0 + 10.0 = 11.0 per 1000 = `1.1%`! Then `70 ÷ 1.1 ≈ 63.6 years`!", "modelSubAnswer": "• `NIR = 9.5 − 8.5 = +1.0 / 1000`\n• `NMR = 12.0 − 2.0 = +10.0 / 1000`\n• `PGR = 1.0 + 10.0 = 11.0 / 1000 = 1.1%`\n• `Doubling Time = 70 ÷ 1.1 ≈ 63.6 years`"}, {"label": "Step 3b: Explain Canada's 3 Immigration Classes & why points reward skills/bilingualism", "placeholder": "1. Economic: ...\n2. Family: ...\n3. Refugees: ...\nExtra points reward...", "hint": "Connect retiring Baby Boomers → need nurses, engineers, trades & bilingual workers!", "modelSubAnswer": "1. **Economic Class (~60%):** Skilled workers chosen via Express Entry points.\n2. **Family Class (~25%):** Reuniting relatives sponsored by Canadian citizens/PRs.\n3. **Refugees (~15%):** Humanitarian protection for people fleeing danger.\n• Express Entry rewards healthcare/trades skills and French/English fluency to fill Baby Boomer retirement shortages and strengthen official bilingualism."}, {"label": "Step 3c: Balance 1 economic benefit AND 1 infrastructure challenge of fast urban growth", "placeholder": "Benefit: ...\nInfrastructure Challenge: ...", "hint": "Benefit = filling worker shortages & growing tax base; Challenge = building affordable housing, LRT transit & school/clinic capacity fast enough!", "modelSubAnswer": "• **Economic Benefit:** New workers fill critical healthcare, engineering, and construction shortages while growing the taxpayer base funding senior pensions.\n• **Infrastructure Challenge:** If housing construction, transit (like Ottawa's O-Train), hospitals, and classrooms don't expand at the exact same pace, rent prices spike and public services get overcrowded."}], "step4_checks": ["Did I convert `11 per 1000` cleanly to `1.1%` before dividing `70 ÷ 1.1`?", "Did I name all 3 official immigration classes accurately?", "Did I explain BOTH an economic benefit AND a concrete housing/infrastructure challenge?"], "step5_modelAnswer": {"basicAnswer": "NIR 1, NMR 10, PGR 1.1%, Double 63.6 yrs. Economic, Family, Refugee. Helps jobs, strains housing.", "expandedAnswer": "Part (a): `NIR = 1.0/1000`, `NMR = 10.0/1000`, `PGR = 11.0/1000 = 1.1%`, Doubling Time = `70 ÷ 1.1 ≈ 63.6 years`.\nPart (b): Canada admits Economic (~60%, points-based for skilled workers/bilingualism to offset Baby Boomer retirements), Family (~25%), and Refugee (~15%, humanitarian protection) newcomers.\nPart (c): Rapid urban growth expands the labour force and innovation economy, yet requires synchronized investment in affordable transit-oriented housing, hospitals, and schools.", "extensionPrompt": "Extension: Why does fast-tracking foreign credential recognition for immigrant doctors and nurses solve BOTH workforce shortages and housing construction needs?"}}]}, {"id": "g9-geo-u4", "title": "Unit 4 (Strand E): Liveable Communities, Smart Growth & Resilient Ottawa", "studyFirstTag": "Apply the 15-Minute City, Urban Heat Island fixes & GIS mapping to real cities!", "curriculumStrand": "Ontario CGC1W Strand E: Liveable Communities", "svgDiagram": "g9_cgc_svg", "lessons": [{"id": "g9-geo-u4-l1", "title": "Lesson 4.1: The 15-Minute City, Urban Heat Islands & GIS Spatial Planning", "readTime": "3 min read", "bigIdea": "A **Liveable Community** blends affordability, clean transit, green parks, and climate resilience—using **GIS (Geographic Information Systems)** layered maps to design **15-Minute Neighbourhoods**!", "paragraphs": ["Why do dark asphalt parking lots feel 5°C hotter in July than shaded city parks? That's the **Urban Heat Island (UHI) Effect**: concrete and black roofs absorb solar radiation and trap heat all evening! Smart Canadian cities fight UHI and storm flooding at the same time using **Green Infrastructure**: urban tree canopies, **green roofs**, **permeable pavement** (so rainwater soaks into the ground instead of flooding sewers!), and naturalised riverfront parks.", "City planners increasingly embrace the **15-Minute Neighbourhood** (and **Complete Streets**): designing communities where daily essentials—schools, groceries, parks, libraries, and O-Train/bus stops—sit within a safe 15-minute walk, roll, or bike ride, giving teens and seniors independence without needing a car for every errand!", "Behind the scenes, geographers use **GIS (Geographic Information Systems)**—digital map software that stacks transparent data layers (e.g., *Layer 1: Floodplains* + *Layer 2: Bus Routes* + *Layer 3: Tree Canopy* + *Layer 4: School Locations*) to pinpoint the exact smartest site for a new clinic, park, or LRT stop!"], "keyTakeaway": "Beat **Urban Heat Islands** & floods with **Green Infrastructure** (trees, green roofs, permeable pavement). Use **GIS layered maps** to plan walkable **15-Minute Complete Streets**!", "deepReadTitle": "🗺️ GIS Map Layers & Liveability Checklist", "deepReadText": "• GIS = Digital layered spatial data (Flood zone + Transit + Population Density + Parks)\n• Complete Street = Safe sidewalks + Protected bike lanes + Reliable transit + Car lanes\n• Liveability Pillars: Affordable Housing • Clean Transit • Green Space • Accessibility • Climate Resilience!", "quickCheck": {"question": "How does **permeable pavement** paired with an **urban tree canopy** solve TWO Grade 9 urban problems at once?", "options": ["It forces cars to drive faster on highways.", "It cools the Urban Heat Island with shade AND lets storm rainwater soak into soil instead of overwhelming city sewers!", "It increases urban sprawl into farmland."], "correctIdx": 1, "explanation": "Trees cool hot asphalt (beating Urban Heat Island) while permeable pavement lets storm water infiltrate safely, cutting flash floods!"}, "videos": [{"id": "ZMn-bCdThEg", "title": "Sustainable Cities (Crash Course Geography #49)", "channel": "CrashCourse", "why": "Engaging high-school look at green infrastructure, transit, and liveable design."}]}], "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Recall Urban Heat Island, GIS & 15-Minute City Concepts", "content": "Lock in Strand E terms:", "keyPoints": ["Urban Heat Island = dark asphalt traps heat | Green Infrastructure = trees, green roofs, permeable pavement.", "GIS = digital layered maps combining physical + human spatial data."]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Explain How Complete Streets Benefit Grade 9 Students Directly", "content": "Protected bike lanes, wide sidewalks, and frequent transit let teens reach school, music, and sports safely without relying on parent car rides.", "analogy": "🚲 Freedom Pass Analogy: Complete Streets turn a neighbourhood from 'car-only' into 'everyone-welcome'—kids, seniors, cyclists, wheelchair users, and drivers!", "keyPoints": ["Reducing car trips also drops neighbourhood noise and air pollution."]}, {"level": 3, "name": "APPLY", "subtitle": "Select 4 GIS Map Layers to Site a New Ottawa Youth Recreation Centre", "content": "Think like an urban GIS analyst:", "workedExample": {"prompt": "Which 4 GIS layers locate the fairest new community centre?", "steps": ["Layer 1: Youth population density (ages 10–19)", "Layer 2: Existing O-Train / OC Transpo routes", "Layer 3: Locations of existing gyms (spot underserved gaps!)", "Layer 4: Floodplain/Greenbelt boundaries (avoid flood hazards!)."]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Grey vs. Green Urban Infrastructure", "content": "See how nature outperforms plain concrete:", "comparisonTable": {"headers": ["Need", "Traditional Grey Infrastructure", "Modern Green Infrastructure"], "rows": [["Stormwater", "Giant concrete pipes & asphalt lots", "Rain gardens, wetlands & permeable pavement"], ["Summer Cooling", "More air-conditioning (extra grid load)", "Street trees, reflective cool roofs & green roofs"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Audit a Car-Only Suburban Strip Mall for Liveability Gaps", "content": "Spot missing Complete Street features:", "keyPoints": ["Huge asphalt parking lot (Heat Island + runoff!), missing crosswalks/bike racks, zero mixed-use apartments above shops!"]}, {"level": 6, "name": "CREATE", "subtitle": "Redesign One Local Ottawa Street Using 3 Liveability Upgrades", "content": "Propose realistic changes for a safer, greener community.", "keyPoints": ["Include protected bike lanes, shade trees/bioswales, and mixed-use transit access!"]}], "questions": [{"id": "g9-geo-q4", "bloomLevel": 6, "bloomTag": "EVALUATE & CREATE", "title": "CGC1W Urban Planner Lab: GIS Layers, Heat Islands & 15-Minute Ottawa", "prompt": "Ottawa is redeveloping an aging, giant asphalt shopping-mall parking lot near a new O-Train station.\n(a) Explain the **Urban Heat Island Effect** AND name **2 Green Infrastructure** features that cool the site and reduce flash flooding.\n(b) Name **3 specific GIS Map Layers** urban planners should overlay before finalizing building and park locations.\n(c) Propose a **15-Minute Complete Street** redesign for this site describing 3 concrete features that make it liveable for Grade 9 teens, families, and seniors.", "step1_deconstruct": {"instruction": "Define UHI + 2 green fixes in (a), list 3 logical GIS layers in (b), and design 3 concrete 15-minute features in (c).", "guidingQuestions": ["Why does black asphalt heat up a neighbourhood?", "Which 3 GIS data layers prevent building in floods or ignoring transit?", "What makes a street truly 'Complete' for walkers, cyclists, and transit riders?"], "modelPlan": "(a) Dark concrete/asphalt traps solar heat; fix with green roofs, urban trees & permeable pavement/rain gardens. (b) Floodplains, Transit routes, Population density/existing parks. (c) Mixed-use affordable apartments above shops, protected bike lanes + wide sidewalks, shaded community plaza/library near LRT."}, "step2_anchor": {"instruction": "Strand E Anchors:", "referenceItems": ["Urban Heat Island → Green roofs, trees, permeable pavement", "GIS = Stacked Spatial Layers | Complete Street = Walk + Bike + Transit + Accessibility"]}, "step3_substeps": [{"label": "Step 3a: Explain Urban Heat Island AND give 2 Green Infrastructure fixes", "placeholder": "Urban Heat Island occurs when...\n2 Green Infrastructure fixes: 1. ... 2. ...", "hint": "Dark asphalt absorbs solar energy; trees + green roofs + permeable pavement cool the air and soak up storm runoff!", "modelSubAnswer": "• **Urban Heat Island:** Dark asphalt parking lots and concrete buildings absorb solar heat and radiate it back, making cities several degrees hotter than surrounding green space.\n• **2 Green Infrastructure Fixes:** (1) **Permeable pavement & bioswale rain gardens** let heavy rain soak into soil instead of flooding sewers; (2) **Dense shade trees & green roofs** cool summer air naturally."}, {"label": "Step 3b: List & justify 3 GIS Map Layers planners should stack for this site", "placeholder": "Layer 1: ...\nLayer 2: ...\nLayer 3: ...", "hint": "Think Floodplain/Drainage, Transit/Walkability radius, Population Density/Income equity, or Existing Tree Canopy!", "modelSubAnswer": "1. **Floodplain & Stormwater Layer:** Ensures buildings sit safely above flood zones while placing parks in low-lying runoff areas.\n2. **Transit & Pedestrian Network Layer:** Connects building entrances directly to O-Train platforms and bus bays.\n3. **Existing Parks & Tree Canopy Layer:** Pinpoints heat hotspots and underserved neighbourhoods needing green space most."}, {"label": "Step 3c: Design 3 concrete features for a 15-Minute Complete Street redevelopment", "placeholder": "1. Housing/Commercial: ...\n2. Movement (Complete Street): ...\n3. Public Space: ...", "hint": "Include mixed-use apartments (with affordable units!), protected bike lanes/accessible sidewalks, and a shaded library/basketball court!", "modelSubAnswer": "1. **Mixed-Use Housing:** Mid-rise apartments (including family-sized affordable units) right above grocery stores, clinics, and cafés.\n2. **Complete Street Mobility:** Physically protected bike lanes, snow-cleared accessible sidewalks, and direct covered walkways to the O-Train station.\n3. **Community Heart:** A shaded public plaza with free Wi-Fi, benches for seniors, and multi-sport courts for teens!"}], "step4_checks": ["Did I explain Urban Heat Island AND give 2 real Green Infrastructure tools?", "Are all 3 GIS layers actual mappable spatial datasets?", "Does my Complete Street serve teens, families, AND seniors without forcing car use?"], "step5_modelAnswer": {"basicAnswer": "Asphalt gets hot so add trees and green roofs. Use GIS for floods and transit. Add apartments, bike lanes, and parks.", "expandedAnswer": "Part (a): Dark asphalt and roofs create Urban Heat Islands; planting shade canopies, building green roofs, and installing permeable pavement cool the site while absorbing stormwater.\nPart (b): Stacking GIS layers for (1) Floodplains/Drainage, (2) O-Train/Bus Transit Access, and (3) Existing Tree Canopy/Park Gaps optimizes safety and equity.\nPart (c): A 15-Minute Complete Street replaces the parking crater with mixed-use affordable apartments above daily shops, protected bike/pedestrian routes directly to LRT, and a shaded multi-generational park/court.", "extensionPrompt": "Extension: How does redeveloping an old parking lot ('infill development') protect Ottawa's Greenbelt farmland at the same time?"}}]}]}, {"id": "math", "code": "MTH1W (Grade 9 De-Streamed Mathematics)", "name": "Mathematics (MTH1W)", "friendlySub": "Exponent Laws, Polynomials, Slopes/Systems, Cones/Spheres & Python", "teacher": "Grade 9 MTH1W", "status": "Core High School Credit", "tier": "Tier 2: Core Mastery", "tierClass": "tier-strong", "icon": "📐", "reportComment": "Complete Ontario 2021 De-Streamed Grade 9 Mathematics (MTH1W — all 6 strands including Coding & Financial Literacy): Real Numbers & Exponent Laws (Zero/Negative), Polynomials & Fraction Equations, Linear Relations (Parallel/Perpendicular & Systems), Cones/Pyramids/Spheres, Linear Regression & Appreciation/Depreciation.", "nextSteps": ["Master all 5 Exponent Laws (Product, Quotient, Power-of-a-Power, Zero = 1, Negative = Reciprocal!)", "Clear denominators first in fraction equations & ALWAYS verify with LS = RS", "Know Parallel (equal slope) vs. Perpendicular (negative reciprocal slope!) and Point of Intersection", "Watch 3D Pythagoras traps (Slant Height `s` vs. Vertical Height `h` in Cones & Pyramids!)"], "units": [{"id": "g9-math-u1", "title": "Unit 1 (Strand B): Exponent Laws — Product, Quotient, Power, Zero & Negative", "studyFirstTag": "Unlock all 5 MTH1W Exponent Laws and crush `-3²` vs. `(-3)²` traps forever!", "curriculumStrand": "Ontario MTH1W Strand B: Number — Powers, Exponents & Real Numbers", "svgDiagram": "g9_math_mth1w_svg", "lessons": [{"id": "g9-math-u1-l1", "title": "Lesson 1.1: The 5 Exponent Laws (`aᵐ·aⁿ`, `a⁰ = 1`, `a⁻ⁿ = 1/aⁿ`) & Sign Traps", "readTime": "3 min read", "bigIdea": "When bases match, **Multiply → ADD exponents**, **Divide → SUBTRACT exponents**, **Power of a Power → MULTIPLY exponents**, **Anything⁰ = `1`**, and **Negative Exponents FLIP into fractions (`a⁻ⁿ = 1/aⁿ`)**!", "paragraphs": ["Grade 9 `MTH1W` builds all future high-school algebra on **5 Exponent Laws** (for the SAME base `a ≠ 0`):\n1. **Product Law:** `aᵐ × aⁿ = aᵐ⁺ⁿ` (e.g., `x³ · x⁴ = x⁷` — ADD exponents!)\n2. **Quotient Law:** `aᵐ ÷ aⁿ = aᵐ⁻ⁿ` (e.g., `5⁷ ÷ 5² = 5⁵` — SUBTRACT!)\n3. **Power of a Power:** `(aᵐ)ⁿ = aᵐ·ⁿ` (e.g., `(2x³)² = 2²·x⁶ = 4x⁶` — MULTIPLY exponents, and don't forget to square the coefficient `2² = 4`!)", "Now master the two famous Grade 9 laws:\n4. **Zero Exponent Law:** **`a⁰ = 1`** (Why? Because `5³ ÷ 5³ = 5³⁻³ = 5⁰`, and anything divided by itself equals `1`!).\n5. **Negative Exponent Law:** **`a⁻ⁿ = 1 / aⁿ`** (A negative exponent NEVER makes the answer negative—it creates a **reciprocal fraction**! Example: `2⁻³ = 1 / 2³ = 1/8`, and `(2/3)⁻² = (3/2)² = 9/4`!).", "Ultimate MTH1W Error Shield — spot the bracket difference: **`(−3)² = (−3)(−3) = +9`**, whereas **`−3² = −(3×3) = −9`** (without brackets, the exponent ONLY touches the `3`, NOT the minus sign!)."], "keyTakeaway": "Multiply→Add • Divide→Subtract • Power-of-Power→Multiply • `a⁰ = 1` • `a⁻ⁿ = 1/aⁿ` (Reciprocal!). Watch `(−3)² = +9` vs. `−3² = −9`!", "deepReadTitle": "⚡ MTH1W Exponent Law Cheat Card", "deepReadText": "• `aᵐ · aⁿ = aᵐ⁺ⁿ`  |  `aᵐ / aⁿ = aᵐ⁻ⁿ`  |  `(aᵐ)ⁿ = aᵐⁿ`\n• `a⁰ = 1` (for `a ≠ 0`)  |  `a⁻ⁿ = 1 / aⁿ`  |  `(a/b)⁻ⁿ = (b/a)ⁿ`\n• Trap Check: `(3x⁴)² = 9x⁸` (square the 3 AND multiply `4×2`!)", "quickCheck": {"question": "Evaluate `5⁰ + 2⁻³` as an exact fraction or mixed number:", "options": ["−6 (0 + −6)", "1 1/8  (or 9/8, since 5⁰ = 1 and 2⁻³ = 1/8!)", "1/8 (since 5⁰ = 0)"], "correctIdx": 1, "explanation": "`5⁰ = 1` (NOT 0!) and `2⁻³ = 1 / 2³ = 1/8` (NOT −6!), so `1 + 1/8 = 9/8` (`1 1/8`)!"}, "videos": [{"id": "LkhPRz7Hocg", "title": "Algebra Basics: Laws of Exponents", "channel": "mathantics", "why": "Gold-standard visual breakdown of Product, Quotient, and Power laws."}, {"id": "TKj8kEofbAw", "title": "Negative Exponents Explained!", "channel": "The Organic Chemistry Tutor", "why": "Makes negative and zero exponents crystal clear for MTH1W."}]}], "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Recall All 5 MTH1W Exponent Laws", "content": "Memorize every law cleanly:", "keyPoints": ["`aᵐ·aⁿ = aᵐ⁺ⁿ` | `aᵐ÷aⁿ = aᵐ⁻ⁿ` | `(aᵐ)ⁿ = aᵐⁿ` | `a⁰ = 1` | `a⁻ⁿ = 1/aⁿ`."]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Prove WHY `a⁰ = 1` and `2⁻³ = 1/8` Using Patterns", "content": "Every time the exponent drops by 1, you divide by the base!", "analogy": "🪜 Ladder Pattern: `2³ = 8` → `÷2` → `2² = 4` → `÷2` → `2¹ = 2` → `÷2` → `2⁰ = 1` → `÷2` → `2⁻¹ = 1/2` → `2⁻² = 1/4` → `2⁻³ = 1/8`!", "keyPoints": ["Math isn't arbitrary rules—every exponent law follows one seamless division pattern!"]}, {"level": 3, "name": "APPLY", "subtitle": "Simplify a Multi-Law MTH1W Fraction Expression", "content": "Work inside-out, top-to-bottom:", "workedExample": {"prompt": "Simplify `(2x³)³ ÷ (4x⁵)`:", "steps": ["Step 1 (Power of a Power): `(2x³)³ = 2³ · x⁹ = 8x⁹`.", "Step 2 (Divide numbers & subtract exponents): `(8 ÷ 4) · x⁹⁻⁵ = 2x⁴`!"]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Classic Exponent Trap Pairs", "content": "Never lose marks on these 3 pairs:", "comparisonTable": {"headers": ["Expression A", "Value A", "Expression B", "Value B"], "rows": [["`(−3)²`", "+9", "`−3²`", "−9 (no brackets!)"], ["`3⁻²`", "`1/9` (positive fraction!)", "`−3²`", "−9"], ["`(2x³)²`", "`4x⁶` (square 2!)", "`2(x³)²`", "`2x⁶`"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Debug a Broken Grade 9 Exponent Solution", "content": "Catch both mistakes:", "keyPoints": ["❌ `(3x²)³ = 9x⁵` → 🔧 Mistake 1: `3³ = 27`, NOT `3×3=9`! Mistake 2: `(x²)³ = x⁶`, NOT `x²⁺³=x⁵`! ✅ Correct: `27x⁶`!"]}, {"level": 6, "name": "CREATE", "subtitle": "Create & Simplify a Combined Fraction-Exponent Challenge", "content": "Combine negative exponents and fraction bases like `(3/4)⁻² × (3/4)⁰`.", "keyPoints": ["`(3/4)⁻² = (4/3)² = 16/9`, times `1` = `16/9`!"]}], "questions": [{"id": "g9-math-q1", "bloomLevel": 4, "bloomTag": "APPLY & ANALYZE", "title": "MTH1W Exponent Laws & Negative-Power Error-Shield Lab", "prompt": "Simplify and evaluate all 3 Grade 9 `MTH1W` expressions (leave fractions exact, zero negative exponents in final answers!):\n(a) Evaluate `−4² + (−4)² + 7⁰` (watch brackets carefully!).\n(b) Simplify completely as a single power / algebraic term: `((3x⁴)² · x³) ÷ (9x⁷)`.\n(c) Evaluate as exact fractions: `3⁻² + (2/5)⁻¹`.", "step1_deconstruct": {"instruction": "Deploy the MTH1W Exponent Shield: brackets in (a), power-of-power on coefficients in (b), and reciprocal flips in (c)!", "guidingQuestions": ["What is `−4²` vs. `(−4)²`?", "In `(3x⁴)²`, what happens to BOTH `3` and `x⁴`?", "What is `(2/5)⁻¹` flipped upside down?"], "modelPlan": "(a) −16 + 16 + 1 = 1! (b) (9x⁸ · x³) ÷ 9x⁷ = 9x¹¹ ÷ 9x⁷ = x⁴! (c) 1/9 + 5/2 = 2/18 + 45/18 = 47/18!"}, "step2_anchor": {"instruction": "Laws:", "referenceItems": ["`−4² = −16` vs. `(−4)² = +16` | `7⁰ = 1`", "`(3x⁴)² = 9x⁸` | `aᵐ·aⁿ = aᵐ⁺ⁿ` | `aᵐ÷aⁿ = aᵐ⁻ⁿ`", "`a⁻ⁿ = 1/aⁿ` | `(a/b)⁻¹ = b/a`"]}, "step3_substeps": [{"label": "Step 3a: Evaluate `−4² + (−4)² + 7⁰` step-by-step", "placeholder": "−4² = ... | (−4)² = ... | 7⁰ = ...\nTotal = ...", "hint": "`−16 + 16 + 1 = 1`!", "modelSubAnswer": "`−4² = −16`, `(−4)² = +16`, `7⁰ = 1` → `−16 + 16 + 1 = 1`!"}, {"label": "Step 3b: Simplify `((3x⁴)² · x³) ÷ (9x⁷)` cleanly", "placeholder": "(3x⁴)² = ...\nNumerator = ...\nDivide by 9x⁷ = ...", "hint": "Square `3` → `9`, multiply `4×2=8` (`9x⁸`); add `8+3=11` (`9x¹¹`); divide `9÷9=1` and subtract `11−7=4` → `x⁴`!", "modelSubAnswer": "• `(3x⁴)² = 9x⁸`\n• `9x⁸ · x³ = 9x¹¹`\n• `9x¹¹ ÷ 9x⁷ = (9÷9)x¹¹⁻⁷ = x⁴`!"}, {"label": "Step 3c: Evaluate `3⁻² + (2/5)⁻¹` as a single exact fraction", "placeholder": "3⁻² = 1/... | (2/5)⁻¹ = ...\nCommon denominator (18): ...", "hint": "`1/9 + 5/2` → common denominator `18` → `2/18 + 45/18 = 47/18`!", "modelSubAnswer": "• `3⁻² = 1/3² = 1/9`\n• `(2/5)⁻¹ = 5/2`\n• Common denominator `18`: `2/18 + 45/18 = 47/18` (`2 11/18`)!"}], "step4_checks": ["Did I get `−4² = −16` and `(−4)² = +16` (so total = `1`)?", "Did I square the `3` in `(3x⁴)² = 9x⁸` instead of leaving `3`?", "Did I flip `(2/5)⁻¹` to positive `5/2` and add fractions with common denominator `18`?"], "step5_modelAnswer": {"basicAnswer": "(a) 1, (b) x⁴, (c) 47/18.", "expandedAnswer": "Part (a): `−16 + 16 + 1 = 1`.\nPart (b): `((3x⁴)² · x³) ÷ (9x⁷) = (9x⁸ · x³) ÷ 9x⁷ = 9x¹¹ ÷ 9x⁷ = x⁴`.\nPart (c): `3⁻² + (2/5)⁻¹ = 1/9 + 5/2 = 2/18 + 45/18 = 47/18`.", "extensionPrompt": "Extension: What is the exact simplified value of `(2x⁻³y²)⁻¹` with positive exponents only? (Hint: `x³ / (2y²)`!)"}}]}, {"id": "g9-math-u2", "title": "Unit 2 (Strand C): Polynomials, Fraction Equations & Rearranging Formulas", "studyFirstTag": "Expand brackets cleanly, wipe out fractions in 1 step & rearrange Science formulas!", "curriculumStrand": "Ontario MTH1W Strand C: Algebra — Polynomials & Algebraic Equations", "svgDiagram": "g9_math_mth1w_svg", "lessons": [{"id": "g9-math-u2-l1", "title": "Lesson 2.1: Simplifying Polynomials & Clearing Fractions in Equations", "readTime": "3 min read", "bigIdea": "Combine ONLY **like terms** (exact same variable AND exact same exponent: `3x² + 5x² = 8x²`, NEVER mix `x²` with `x`!), and kill fractions in equations on Line 1 by multiplying EVERY term by the **LCD**!", "paragraphs": ["A **Polynomial** is a sum of terms like `4x² − 3x + 7`. Only **Like Terms** (`x²` with `x²`, `x` with `x`, constants with constants) can be added or subtracted—and when adding like terms, the exponent **NEVER changes** (`3x² + 2x² = 5x²`, NOT `5x⁴`!). Watch the **Negative Distributive Trap**: in `5x − 2(3x − 4)`, distribute the **−2** to BOTH terms inside → `5x − 6x + 8 = −x + 8` (minus times minus = `+8`!).", "Hate equations with fractions like `(x + 2)/3 + x/2 = 4`? Use the **LCD Fraction Killer**! Find the Lowest Common Denominator of `3` and `2` (`LCD = 6`) and multiply **EVERY SINGLE TERM on BOTH sides by 6** (including the plain `4`!): `2(x + 2) + 3x = 24` → `2x + 4 + 3x = 24` → `5x = 20` → `x = 4`! Fractions vanished in ONE step!", "You will also **Rearrange Science & Geometry Formulas**—like solving `y = mx + b` for `x`, or `V = I × R` (Ohm's Law!) for `I`: simply undo operations in reverse BEDMAS (`y − b = mx` → `x = (y − b) / m`)!"], "keyTakeaway": "Distribute negative signs to EVERY term inside brackets (`−2(3x − 4) = −6x + 8`). Kill fractions in equations by multiplying EVERY term on BOTH sides by the **LCD**!", "deepReadTitle": "🔧 Formula Rearranging & Polynomial Check", "deepReadText": "• Combine Like Terms: `3x² + 4x − x² + 5 = 2x² + 4x + 5` (`x²` and `x` stay separate!)\n• LCD Fraction Killer: Multiply EVERY term (even whole numbers!) by the LCD!\n• Science Formula Flip: `d = v × t` → `t = d / v` | `A = ½bh` → `h = 2A / b`!", "quickCheck": {"question": "Simplify `4(2x − 3) − 3(x − 5)` carefully (watch the double negative!):", "options": ["5x − 27", "5x + 3", "11x + 3"], "correctIdx": 1, "explanation": "`4(2x − 3) = 8x − 12`, and `−3(x − 5) = −3x + 15` (negative × negative = `+15`!). Combine: `(8x − 3x) + (−12 + 15) = 5x + 3`!"}, "videos": [{"id": "DKC74YKJpNY", "title": "Algebra Basics: Simplifying Polynomials", "channel": "mathantics", "why": "Crystal-clear rules for combining like terms without changing exponents."}, {"id": "GYNK6NDNEFk", "title": "How to Solve Linear Equations with Fractions", "channel": "The Organic Chemistry Tutor", "why": "Demonstrates the 1-step LCD Fraction Killer method."}]}], "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Recall Like Terms, Negative Distribution & LCD Killer", "content": "Lock in Unit 2 algebra skills:", "keyPoints": ["Like terms = identical variable & exponent (exponents don't change when adding!).", "Multiply EVERY term on BOTH sides by LCD to clear denominators instantly."]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Explain Why `−(3x − 5)` Flips BOTH Signs Inside Brackets", "content": "A minus sign in front of brackets is an invisible `−1` multiplying every single term inside!", "analogy": "🔄 Light-Switch Analogy: Multiplying by `−1` flips EVERY sign switch inside the parentheses (`+` → `−` and `−` → `+`)!", "keyPoints": ["`−(3x − 5) = −3x + 5`!"]}, {"level": 3, "name": "APPLY", "subtitle": "Solve `(2x − 1)/4 = (x + 5)/3` Using the LCD Killer", "content": "Clear both denominators in Line 1:", "workedExample": {"prompt": "Solve `(2x − 1)/4 = (x + 5)/3`:", "steps": ["Multiply both sides by `LCD = 12`: `3(2x − 1) = 4(x + 5)`.", "Expand: `6x − 3 = 4x + 20` → `2x = 23` → **`x = 11.5` (`23/2`)**!"]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Adding Terms vs. Multiplying Terms", "content": "Never mix up these two operations:", "comparisonTable": {"headers": ["Operation", "Example", "Result", "Exponent Rule"], "rows": [["Add Like Terms", "`3x² + 5x²`", "`8x²`", "Exponent STAYS `2`!"], ["Multiply Terms", "`(3x²)(5x²)`", "`15x⁴`", "Exponents ADD (`2+2=4`)!"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Catch the 'Forgot to Multiply the Plain Number' LCD Error", "content": "Spot the classic fraction equation trap:", "keyPoints": ["In `x/2 + 3 = 7`, multiplying by `2` gives `x + 6 = 14` (NOT `x + 3 = 7` — you MUST multiply `3` and `7` by `2` too!)!"]}, {"level": 6, "name": "CREATE", "subtitle": "Rearrange Two Grade 9 Science Formulas for Any Variable", "content": "Isolate `R` in Ohm's Law (`V = I·R`) and `h` in Trapezoid Area (`A = ½(a + b)h`).", "keyPoints": ["`R = V / I` and `h = 2A / (a + b)`!"]}], "questions": [{"id": "g9-math-q2", "bloomLevel": 4, "bloomTag": "APPLY & ANALYZE", "title": "MTH1W Polynomial Expansion, LCD Fraction Killer & Formula Flip Lab", "prompt": "(a) Expand and simplify completely: `3x(2x − 5) − 2(x² − 4x + 6)` (watch every sign!).\n(b) Solve using the **LCD Fraction Killer** and prove with `LS = RS`: `(x + 1)/3 + (x − 2)/2 = 3`.\n(c) **Science/Geometry Formula Flip:** Rearrange the Perimeter of a Rectangle `P = 2L + 2W` to isolate `W` by itself, then find `W` when `P = 54 m` and `L = 16 m`!", "step1_deconstruct": {"instruction": "Watch `3x·2x = 6x²` and negative distribution in (a), multiply EVERY term (including `3`!) by `LCD = 6` in (b), and undo `+2L` then `×2` in (c)!", "guidingQuestions": ["What is `−2 × (−4x)` and `−2 × (+6)`?", "What is `6 × 3` on the right side of Part (b)?", "In `P = 2L + 2W`, what do you subtract first?"], "modelPlan": "(a) 6x²−15x − 2x²+8x−12 = 4x² − 7x − 12. (b) Multiply by 6: 2(x+1)+3(x−2)=18 → 5x−4=18 → x=22/5=4.4. (c) W = (P − 2L)/2 → (54−32)/2 = 11 m!"}, "step2_anchor": {"instruction": "Rules:", "referenceItems": ["`3x(2x) = 6x²` | `−2(−4x) = +8x`", "Multiply EVERY term by `LCD = 6` (don't skip the `3`!)", "Isolate `W`: subtract `2L`, then divide by `2`"]}, "step3_substeps": [{"label": "Step 3a: Expand & collect like terms in `3x(2x − 5) − 2(x² − 4x + 6)`", "placeholder": "Expand: 6x² − 15x ...\nCollect like terms: ...", "hint": "`6x² − 15x − 2x² + 8x − 12` → `4x² − 7x − 12`!", "modelSubAnswer": "• Expand: `6x² − 15x − 2x² + 8x − 12`\n• Collect Like Terms: `(6x² − 2x²) + (−15x + 8x) − 12 = 4x² − 7x − 12`!"}, {"label": "Step 3b: Solve `(x + 1)/3 + (x − 2)/2 = 3` via `LCD = 6` + verify `LS = RS`", "placeholder": "Multiply all terms by 6: 2(x+1) + 3(x−2) = 18\nSolve for x = ...\nLS = ... | RS = 3", "hint": "`2x + 2 + 3x − 6 = 18` → `5x − 4 = 18` → `5x = 22` → `x = 22/5 = 4.4`!", "modelSubAnswer": "• Multiply all terms by `6`: `2(x + 1) + 3(x − 2) = 18`\n• Expand: `2x + 2 + 3x − 6 = 18` → `5x − 4 = 18` → `5x = 22` → **`x = 4.4` (`22/5`)**.\n• Check `LS`: `(4.4+1)/3 + (4.4−2)/2 = 5.4/3 + 2.4/2 = 1.8 + 1.2 = 3 = RS` ✅!"}, {"label": "Step 3c: Rearrange `P = 2L + 2W` for `W` & evaluate at `P = 54 m, L = 16 m`", "placeholder": "W = ...\nWhen P=54, L=16 → W = ... m", "hint": "`P − 2L = 2W` → `W = (P − 2L) / 2` → `(54 − 32)/2 = 11 m`!", "modelSubAnswer": "• Subtract `2L`: `P − 2L = 2W`\n• Divide by `2`: **`W = (P − 2L) / 2`**\n• Evaluate: `W = (54 − 2(16)) / 2 = (54 − 32) / 2 = 22 / 2 = 11 m`!"}], "step4_checks": ["Did I distribute `−2` to ALL three terms (`−2x² + 8x − 12`)?", "Did I multiply `3` by `6` (`= 18`) and confirm `LS = 1.8 + 1.2 = 3`?", "Did I rearrange `P = 2L + 2W` symbolically BEFORE plugging in `54` and `16`?"], "step5_modelAnswer": {"basicAnswer": "(a) 4x² − 7x − 12, (b) x = 4.4, (c) W = (P−2L)/2 = 11 m.", "expandedAnswer": "Part (a): `6x² − 15x − 2x² + 8x − 12 = 4x² − 7x − 12`.\nPart (b): Multiply by `LCD = 6` → `2(x+1) + 3(x−2) = 18` → `5x − 4 = 18` → **`x = 4.4` (`22/5`)** (`LS = 1.8 + 1.2 = 3 = RS` ✅).\nPart (c): `W = (P − 2L) / 2` → `(54 − 32) / 2 = 11 m`.", "extensionPrompt": "Extension: Rearrange Newton's Kinetic Energy preview `E = ½mv²` to isolate mass `m` (`m = 2E / v²`)!"}}]}, {"id": "g9-math-u3", "title": "Unit 3 (Strand C): Parallel/Perpendicular Lines, Linear Systems & Python Coding", "studyFirstTag": "Master negative-reciprocal slopes, Point of Intersection & Python functions!", "curriculumStrand": "Ontario MTH1W Strand C: Linear & Non-Linear Relations + Coding", "svgDiagram": "g9_math_mth1w_svg", "lessons": [{"id": "g9-math-u3-l1", "title": "Lesson 3.1: Parallel vs. Perpendicular Slopes, First Differences & Linear Systems", "readTime": "3 min read", "bigIdea": "**Parallel lines** have **EQUAL slopes** (`m₁ = m₂`); **Perpendicular lines** (90° right angles!) have **NEGATIVE RECIPROCAL slopes** (flip the fraction AND flip the sign: `2/3 → −3/2`)!", "paragraphs": ["How can you tell if two lines are **Parallel** or **Perpendicular** without graphing? Just look at their slopes `m` in `y = mx + b`!\n• **Parallel (`∥`):** Exact SAME slope, different y-intercept (e.g., `y = 3x + 2` and `y = 3x − 7` never touch!).\n• **Perpendicular (`⊥`):** Multiply their slopes and get `−1` — just **Flip the Fraction AND Flip the Sign**! So `m = 2/3` is perpendicular to `m = −3/2`, and `m = 4` (`4/1`) is perpendicular to `m = −1/4`!", "How do you know if a Table of Values is **Linear** or **Non-Linear** (like a curve `y = x²`)? Check the **First Differences** (`Δy` when `x` rises by constant steps): if First Differences are **100% CONSTANT**, it's Linear! If they change (`+1, +3, +5, +7`), it's Non-Linear!", "Finally, where do TWO linear equations cross (**Point of Intersection / Linear System**)? Set their `y`-values equal (`m₁x + b₁ = m₂x + b₂`), solve for `x`, and plug `x` back into EITHER equation to get the exact `(x, y)` coordinate—or check it automatically in a **MTH1W Python `while`/`for` loop**!"], "keyTakeaway": "Parallel = SAME `m` | Perpendicular = **Negative Reciprocal `m`** (flip fraction + flip sign!). Constant First Differences = Linear. System POI: set `y₁ = y₂` and solve `(x, y)`!", "deepReadTitle": "📐 Parallel, Perpendicular & Special Lines Vault", "deepReadText": "• Perpendicular Flip Examples: `3/4 → −4/3` | `−5 → +1/5` | `1 → −1`\n• Horizontal Line: `y = 5` (Slope `m = 0`) | Vertical Line: `x = 3` (Slope = UNDEFINED!)\n• Standard Form → Slope-Intercept: `2x + y = 6` → isolate `y` → `y = −2x + 6` (`m = −2, b = 6`)!", "quickCheck": {"question": "A line has equation `y = (2/3)x − 4`. What is the slope of a line **PERPENDICULAR** to it?", "options": ["2/3", "−2/3", "−3/2 (flipped fraction AND flipped sign!)"], "correctIdx": 2, "explanation": "Perpendicular slopes are **negative reciprocals**: flip `2/3` to `3/2` and flip `+` to `−` → **`−3/2`** (check: `2/3 × −3/2 = −1` ✅)!"}, "videos": [{"id": "LTb2-LE7StE", "title": "Writing Equations of Parallel and Perpendicular Lines", "channel": "The Organic Chemistry Tutor", "why": "Step-by-step mastery of negative reciprocals and solving for b."}, {"id": "MRAIgJmRmag", "title": "Graphing Systems of Equations (Point of Intersection)", "channel": "Khan Academy", "why": "Visualizes how two lines intersect at one exact (x, y) solution."}, {"id": "94UHCEmprCY", "title": "Python For Loops Tutorial", "channel": "Programming with Mosh", "why": "Crisp coding foundation for MTH1W Ontario Python loop tasks."}]}, {"id": "g9-math-u3-l2", "title": "Lesson 3.2: Direct vs. Partial Variation, `x`/`y`-Intercepts & Line Transformations (EQAO!)", "readTime": "3 min read", "bigIdea": "**Direct Variation (`y = mx`)** passes straight through `(0, 0)` with zero flat fee; **Partial Variation (`y = mx + b`)** starts at `(0, b)`—and finding **`x`- & `y`-Intercepts** graphs ANY `Ax + By = C` line in 10 seconds!", "paragraphs": ["A favourite **Ontario EQAO Grade 9 Math** distinction is **Direct vs. Partial Variation**:\n• **Direct Variation (`y = mx`):** No initial fee (`b = 0`), passes through the origin **`(0, 0)`**, and the ratio `y/x` is always constant! (e.g., earning `$18/hr` → `y = 18x`).\n• **Partial Variation (`y = mx + b`, `b ≠ 0`):** Has a fixed starting value + a constant rate! (e.g., `$50` catering fee + `$15/guest` → `y = 15x + 50`).", "How do you graph a Standard-Form line like **`3x + 4y = 24`** in 10 seconds without rearranging? Find its **two Intercepts** (the points where the line hits the axes!):\n• **`x`-intercept (set `y = 0`):** `3x = 24` → `x = 8` → plot **`(8, 0)`**!\n• **`y`-intercept (set `x = 0`):** `4y = 24` → `y = 6` → plot **`(0, 6)`**! Connect `(8, 0)` and `(0, 6)` with a ruler—DONE!", "Finally, know **Transformations of `y = x`** (`MTH1W C4.3`): changing `b` (`y = x + 4` or `y = x − 3`) **shifts the line UP/DOWN** without changing steepness; changing `m` makes it **steeper** (`|m| > 1`), **flatter** (`0 < |m| < 1`), or **reflected downhill** (`m < 0`)!"], "keyTakeaway": "Direct = `y = mx` (origin `(0,0)`) | Partial = `y = mx + b` (`b ≠ 0`). To find **`x`-int, plug `y = 0`**; to find **`y`-int, plug `x = 0`**!", "deepReadTitle": "📉 EQAO Intercept & Transformation Quick Card", "deepReadText": "• `x`-intercept = `(x, 0)` (set `y = 0`)  |  `y`-intercept = `(0, y)` (set `x = 0`)\n• From `y = x` to `y = −3x + 5`: Reflected downhill (`−`), 3× steeper (`3`), shifted UP `5` units!", "quickCheck": {"question": "For the line `2x − 5y = 20`, what are its exact **`x`-intercept** and **`y`-intercept**?", "options": ["x-int = (10, 0) and y-int = (0, −4)", "x-int = (2, 0) and y-int = (0, −5)", "x-int = (−4, 0) and y-int = (0, 10)"], "correctIdx": 0, "explanation": "Set `y = 0`: `2x = 20` → **`(10, 0)`**. Set `x = 0`: `−5y = 20` → `y = −4` → **`(0, −4)`**!"}, "videos": [{"id": "pq1XOuApmK0", "title": "Direct and Partial Variation (Ontario Grade 9 Math)", "channel": "Kyle Pearce", "why": "Built directly for Ontario Grade 9 linear relations and EQAO."}, {"id": "_-LvA1xlQLs", "title": "How to Find X and Y Intercepts of a Line", "channel": "The Organic Chemistry Tutor", "why": "Fast, foolproof walkthrough of the plug-in-zero intercept method."}]}], "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Recall Parallel, Perpendicular, Horizontal/Vertical & First Differences", "content": "Lock in Unit 3 linear rules:", "keyPoints": ["Parallel: `m₁ = m₂` | Perpendicular: `m₂ = −1/m₁` (flip fraction & sign).", "Horizontal (`y = c`) has `m = 0` | Vertical (`x = c`) has UNDEFINED slope."]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Explain Why `y = x²` Fails the First-Difference Test", "content": "Because `x²` accelerates (`0, 1, 4, 9, 16`), its jumps grow (`+1, +3, +5, +7`)—not constant—making a curved parabola instead of a straight line!", "analogy": "🚗 Acceleration Analogy: Cruise control at 80 km/h adds the exact same distance every hour (**Linear**); flooring the gas pedal adds more distance each second (**Non-Linear**!).", "keyPoints": ["Always check that `x` increases by EQUAL steps before inspecting `Δy`!"]}, {"level": 3, "name": "APPLY", "subtitle": "Write the Equation of a Perpendicular Line Through `(6, 1)`", "content": "Follow the 3-step MTH1W blueprint:", "workedExample": {"prompt": "Find the line perpendicular to `y = 3x − 5` passing through `(6, 1)`:", "steps": ["Step 1 (Perp Slope): Flip `3/1` + sign → `m = −1/3`.", "Step 2 (Plug `(6, 1)` into `y = mx + b`): `1 = (−1/3)(6) + b` → `1 = −2 + b` → `b = 3`.", "Step 3 (Equation): **`y = (−1/3)x + 3`**!"]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Standard Form vs. Slope-Intercept Form", "content": "Convert `Ax + By + C = 0` to `y = mx + b`:", "comparisonTable": {"headers": ["Standard Form", "Isolate `y` Step", "Slope-Intercept (`y = mx + b`)", "Slope & y-int"], "rows": [["`6x + 2y − 10 = 0`", "`2y = −6x + 10` (÷2)", "`y = −3x + 5`", "`m = −3, b = 5`"], ["`3x − y + 4 = 0`", "`3x + 4 = y`", "`y = 3x + 4`", "`m = 3, b = 4`"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Catch Two Common MTH1W Linear Errors", "content": "Avoid these easy point-losers:", "keyPoints": ["1. Only flipping the sign (`2/3 → −2/3`) without flipping the fraction! 2. Finding ONLY `x` for a Point of Intersection and forgetting to solve for `y` as `(x, y)`!"]}, {"level": 6, "name": "CREATE", "subtitle": "Write a 4-Line Python Script Finding Where Two Cell-Phone Plans Match", "content": "Check `for gb in range(1, 20):` where `planA == planB`!", "keyPoints": ["Models linear systems directly in Ontario MTH1W code!"]}], "questions": [{"id": "g9-math-q3", "bloomLevel": 5, "bloomTag": "APPLY & ANALYZE", "title": "MTH1W Linear Relations Lab: Perpendicular Line, Point of Intersection & Standard Form", "prompt": "(a) Convert `4x − 2y + 10 = 0` into `y = mx + b` form, and state its slope `m` and y-intercept `b`.\n(b) Find the exact equation (`y = mx + b`) of a line **PERPENDICULAR** to your line from Part (a) that passes through the point `(4, 7)`!\n(c) Find the exact **Point of Intersection `(x, y)`** of the linear system `y = 2x + 5` and `y = −x + 14`, and verify in BOTH equations!", "step1_deconstruct": {"instruction": "Isolate `y` in (a), take negative reciprocal slope + solve for `b` in (b), and solve `(x, y)` for BOTH coordinates in (c)!", "guidingQuestions": ["When isolating `y` in `4x − 2y + 10 = 0`, what is `m`?", "What is the negative reciprocal of `m = 2`?", "After finding `x` in Part (c), did I also find `y`?"], "modelPlan": "(a) 2y = 4x+10 → y = 2x + 5 (m=2, b=5). (b) Perp m = −1/2; 7 = (−1/2)(4)+b → 7 = −2+b → b = 9 → y = −0.5x + 9. (c) 2x+5 = −x+14 → 3x=9 → x=3, y=11 → POI (3, 11)!"}, "step2_anchor": {"instruction": "Rules:", "referenceItems": ["Perpendicular to `m = 2` (`2/1`) is `m = −1/2`", "POI requires BOTH coordinates `(x, y)` verified in both lines!"]}, "step3_substeps": [{"label": "Step 3a: Convert `4x − 2y + 10 = 0` to `y = mx + b` and identify `m` & `b`", "placeholder": "4x + 10 = 2y → y = ...\nm = ... | b = ...", "hint": "Move `−2y` to the right (`4x + 10 = 2y`), then divide everything by `2` → `y = 2x + 5`!", "modelSubAnswer": "`4x + 10 = 2y` → divide by `2`: **`y = 2x + 5`** (`m = 2`, `b = 5`)."}, {"label": "Step 3b: Find the PERPENDICULAR line through `(4, 7)`", "placeholder": "Perp slope m = ...\n7 = (...)(4) + b → b = ...\nEquation: y = ...", "hint": "Negative reciprocal of `2` is `−1/2`! Plug `(4, 7)`: `7 = −2 + b` → `b = 9`!", "modelSubAnswer": "• Perpendicular slope `m = −1/2`\n• Plug `(4, 7)`: `7 = (−1/2)(4) + b` → `7 = −2 + b` → `b = 9`\n• Equation: **`y = (−1/2)x + 9`**!"}, {"label": "Step 3c: Solve the Point of Intersection `(x, y)` of `y = 2x + 5` and `y = −x + 14`", "placeholder": "2x + 5 = −x + 14 → x = ...\ny = ...\nPOI = (..., ...)", "hint": "`3x = 9` → `x = 3`! Then `y = 2(3) + 5 = 11` (and `−3 + 14 = 11` ✅)!", "modelSubAnswer": "• Set equal: `2x + 5 = −x + 14` → `3x = 9` → `x = 3`\n• Find `y`: `y = 2(3) + 5 = 11` (Check line 2: `−3 + 14 = 11` ✅)\n• Point of Intersection: **`(3, 11)`**!"}], "step4_checks": ["Did I get `y = 2x + 5` (dividing ALL terms by 2)?", "Did I flip BOTH fraction and sign (`2 → −1/2`) for the perpendicular line?", "Did I give the full ordered pair `(3, 11)` and verify in both equations?"], "step5_modelAnswer": {"basicAnswer": "(a) y = 2x + 5, (b) y = −0.5x + 9, (c) POI (3, 11).", "expandedAnswer": "Part (a): `4x − 2y + 10 = 0` → `2y = 4x + 10` → **`y = 2x + 5`** (`m = 2, b = 5`).\nPart (b): Perpendicular slope `m = −1/2`; passing through `(4, 7)` gives `7 = −2 + b` → `b = 9`, so **`y = (−1/2)x + 9`**.\nPart (c): `2x + 5 = −x + 14` → `x = 3`, `y = 11` → **`POI = (3, 11)`**.", "extensionPrompt": "Extension: What happens if you try to find the POI of TWO PARALLEL lines like `y = 2x + 5` and `y = 2x − 1`? (`5 = −1` → Zero solutions — parallel lines never cross!)"}}]}, {"id": "g9-math-u4", "title": "Unit 4 (Strand E): Cones, Pyramids, Spheres, Circle Theorems & Optimization", "studyFirstTag": "Master 3D solids, EQAO Circle Theorems (Central=2×Inscribed) & Max-Area Optimization!", "curriculumStrand": "Ontario MTH1W Strand E: Geometry & Measurement (EQAO Complete)", "svgDiagram": "g9_eqao_circle_svg", "lessons": [{"id": "g9-math-u4-l1", "title": "Lesson 4.1: Cones, Pyramids & Spheres — The `⅓` Rule & Slant Height (`s`) Trap!", "readTime": "3 min read", "bigIdea": "A **Cone** holds **exactly `⅓`** the volume of a matching Cylinder (`V = ⅓πr²h`), a **Pyramid** holds **exactly `⅓`** of a matching Prism (`V = ⅓Bh`), and a **Sphere** uses `V = (4/3)πr³` and `SA = 4πr²`!", "paragraphs": ["Here is an unforgettable Grade 9 lab demonstration: take a hollow **Cone** and a **Cylinder** with the exact same radius `r` and height `h`. Fill the cone with water and pour it into the cylinder—it takes **EXACTLY THREE** cones to fill the cylinder! That proves **`V_cone = ⅓πr²h`** and **`V_pyramid = ⅓(Base Area) × h`**!", "Now meet the #1 Grade 9 `MTH1W` geometry trap: **Vertical Height (`h`) vs. Slant Height (`s`)**! Volume ALWAYS uses the straight-up **vertical height (`h`)**, while Surface Area of a cone (`SA = πr² + πrs`) or pyramid (`SA = b² + 2bs`) ALWAYS uses the diagonal outside **slant height (`s`)**! How do `r`, `h`, and `s` connect? A right triangle inside the cone: **`r² + h² = s²`** (Pythagoras again!)!", "And for **Spheres** (basketballs, planets, water droplets!): **`V = (4/3)πr³`** (watch the **cube `r³`**!) and **`SA = 4πr²`** (exactly 4 flat circles of the same radius!). Also remember Exterior Angles of ANY convex polygon ALWAYS sum to **`360°`**!"], "keyTakeaway": "Cone `V = ⅓πr²h`, `SA = πr² + πrs` (`s = √(r² + h²)`) | Pyramid `V = ⅓b²h` | Sphere `V = 4/3πr³`, `SA = 4πr²`. ALWAYS halve diameter first!", "deepReadTitle": "🍦 3D Formula Shield (MTH1W Strand E)", "deepReadText": "• Cone: `V = πr²h ÷ 3` | `SA = πr² + πrs` (Slant `s = √(r² + h²)`!)\n• Square-Based Pyramid: `V = b²h ÷ 3` | `SA = b² + 2bs` (Slant `s = √((b/2)² + h²)`!)\n• Sphere: `V = 4πr³ ÷ 3` | `SA = 4πr²`\n• Any Convex Polygon: Exterior Angle Sum = `360°` ALWAYS!", "quickCheck": {"question": "A cone has radius `r = 3 cm` and vertical height `h = 4 cm`. What is its **Slant Height `s`** needed to find Surface Area?", "options": ["s = 4 cm (same as vertical height)", "s = 5 cm (using Pythagoras: √(3² + 4²) = √25 = 5!)", "s = 7 cm (3 + 4)"], "correctIdx": 1, "explanation": "`r = 3` and `h = 4` form the legs of a right triangle inside the cone, so slant height `s = √(3² + 4²) = 5 cm`!"}, "videos": [{"id": "KhObCvV73go", "title": "Volume of a Cone (Math with Mr. J)", "channel": "Math with Mr. J", "why": "Shows the ⅓ cylinder relationship clearly."}, {"id": "JQD__LQTrYA", "title": "Volume of a Pyramid (Math with Mr. J)", "channel": "Math with Mr. J", "why": "Walks through base area × height ÷ 3 step-by-step."}, {"id": "9_Y8P3oHwL0", "title": "Interior Angles of a Polygon (Geometry)", "channel": "The Organic Chemistry Tutor", "why": "Covers polygon interior/exterior angle proofs for MTH1W."}]}, {"id": "g9-math-u4-l2", "title": "Lesson 4.2: EQAO Circle Geometry Theorems & 2D/3D Optimization Mastery", "readTime": "3 min read", "bigIdea": "Master **3 EQAO Circle Theorems** (`Central = 2 × Inscribed`, `Tangent ⊥ Radius = 90°`, `Centre ⊥ Chord bisects chord`) AND **Optimization** (for fixed perimeter, a **SQUARE** always maximizes area!)!", "paragraphs": ["Ontario `MTH1W` (`E1.2`) tests **Circle Geometry Theorems** directly on EQAO:\n1. **Central vs. Inscribed Angle:** On the same arc, the **Central Angle** (vertex at centre `O`) is ALWAYS **DOUBLE** the **Inscribed Angle** (vertex on the circle rim)! Special case: ANY angle inscribed in a **semicircle** (standing on a diameter!) is ALWAYS **`90°`**!\n2. **Tangent–Radius Theorem:** A tangent line skimming the outside of a circle meets the radius at an exact **`90°` right angle** (instant Pythagoras setup!).\n3. **Chord Perpendicular Bisector:** A line drawn from the circle's centre `90°` perpendicular to a chord ALWAYS **cuts that chord in exact half**!", "Now master **EQAO Optimization**: suppose you have **`40 m`** of fencing to enclose the **LARGEST possible rectangular garden Area**.\n• **4-Sided Enclosure:** Make a **SQUARE**! `Side = 40 ÷ 4 = 10 m` → `Max Area = 10 × 10 = 100 m²` (compare `15 × 5 = 75 m²` — square always wins!).\n• **3-Sided Enclosure (against a school wall!):** Split fencing **half for the long side parallel to the wall (`20 m`)** and **half split across the 2 widths (`10 m` each)** → **`L = 2W`** → `Max Area = 20 × 10 = 200 m²`!", "In 3D Optimization, a **Cube** (`L = W = H`) minimizes surface area (packaging cardboard!) for a fixed volume—and for a cylinder, optimal proportions happen when **Height = Diameter (`h = 2r`)**!"], "keyTakeaway": "Circle Theorems: `Central = 2 × Inscribed` (`Semicircle = 90°`), `Tangent ⊥ Radius = 90°`, `Centre ⊥ Chord = Bisector`. Optimization: **4 sides → Square (`P÷4`)**; **3 sides (wall) → `L = 2W`**!", "deepReadTitle": "⭕ EQAO Circle & Optimization Super-Sheet", "deepReadText": "• Central Angle = `2 × Inscribed Angle` (same arc!) | Inscribed angles on the SAME arc are EQUAL!\n• 4-sided Max Area: Square (`s = P ÷ 4`) | 3-sided Max Area (1 wall): `W = P ÷ 4`, `L = P ÷ 2` (`L = 2W`!)\n• 3D Min Packaging: Cube (`s = ∛V`) | Optimal Cylinder: `h = d = 2r`!", "quickCheck": {"question": "A circle's **Central Angle** is `130°` on arc AB. What is the **Inscribed Angle** on the same arc—AND what is the max rectangular area using `32 m` of 4-sided fencing?", "options": ["260° and 60 m²", "65° (half of 130°!) and 64 m² (8 m × 8 m square!)", "130° and 64 m²"], "correctIdx": 1, "explanation": "Inscribed Angle = `130° ÷ 2 = 65°`! And with `32 m` of 4-sided fencing, a square (`32 ÷ 4 = 8 m`) maximizes area at `8 × 8 = 64 m²`!"}, "videos": [{"id": "nd46bA9DKE0", "title": "Circle Theorems: Central Angles, Inscribed Angles & Tangents", "channel": "The Organic Chemistry Tutor", "why": "Covers every circle angle theorem tested on Ontario Grade 9 EQAO."}, {"id": "8h6dlZ4KQv8", "title": "Optimizing Area of a Rectangle (Grade 9 Ontario Math)", "channel": "Math By The Pixel", "why": "Ontario teacher explaining 4-sided and 3-sided area optimization cleanly."}]}], "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Recall Cone, Pyramid, Sphere & Exterior Angle Rules", "content": "Lock in all Strand E formulas:", "keyPoints": ["Cone `V = ⅓πr²h`, `SA = πr² + πrs` | Pyramid `V = ⅓b²h` | Sphere `V = 4/3πr³`, `SA = 4πr²`.", "Slant height uses Pythagoras (`s = √(r² + h²)`); Exterior angles of ANY polygon = `360°`!"]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Explain Why Pyramid Slant Height Uses `b/2` Instead of Full Base `b`", "content": "The pyramid's centre height drops straight to the MIDDLE of the square base—only HALF a base width (`b/2`) away from the outer edge!", "analogy": "⛺ Tent Pole Analogy: The centre tent pole stands right in the middle of the tent floor, so the horizontal leg to the tent wall is HALF the floor width (`b/2`)!", "keyPoints": ["Classic MTH1W trap: plugging full `b` instead of `b/2` into Pythagoras!"]}, {"level": 3, "name": "APPLY", "subtitle": "Compute Volume & Surface Area of a Cone (`r = 6, h = 8`)", "content": "Use Pythagoras for `s` first:", "workedExample": {"prompt": "Cone with `r = 6 cm`, `h = 8 cm` (`π = 3.14`):", "steps": ["Volume: `V = 3.14 × 6² × 8 ÷ 3 = 3.14 × 36 × 8 ÷ 3 = 301.44 cm³`.", "Slant Height: `s = √(6² + 8²) = √100 = 10 cm`!", "SA: `3.14(6²) + 3.14(6)(10) = 113.04 + 188.4 = 301.44 cm²`!"]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Vertical Height (`h`) vs. Slant Height (`s`)", "content": "Always pick the right height:", "comparisonTable": {"headers": ["Measurement", "Used For?", "Geometry Role"], "rows": [["Vertical Height `h`", "**Volume** (`⅓πr²h`)", "Perpendicular 90° straight up inside solid"], ["Slant Height `s`", "**Surface Area** (`πrs`)", "Hypotenuse running along slanted outside face (`s > h` ALWAYS!)"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Catch Sphere Cube & Diameter Traps", "content": "Check these 2 high-school mistakes:", "keyPoints": ["1. Squaring `r²` instead of cubing `r³` in Sphere Volume! 2. Forgetting to divide diameter by 2 first!"]}, {"level": 6, "name": "CREATE", "subtitle": "Calculate Wasted Air Inside a Basketball Packaging Cube", "content": "Subtract Sphere Volume (`r = 12 cm`) from Cube Volume (`24³`) to find packing space!", "keyPoints": ["Cube `24³ = 13,824 cm³` minus Sphere `4/3(3.14)(12³) = 7,234.6 cm³` → ~48% empty air!"]}], "questions": [{"id": "g9-math-q4", "bloomLevel": 5, "bloomTag": "APPLY & ANALYZE", "title": "MTH1W 3D Mastery Lab: Cone Slant-Height Trap, Sphere & Polygon Proof", "prompt": "Solve all 3 `MTH1W` Geometry problems showing exact formulas & units (`π = 3.14`):\n(a) A waffle cone has **DIAMETER = `10 cm`** and vertical height **`h = 12 cm`**. Find its **Volume (`cm³`)**, then use Pythagoras to find its **Slant Height `s`** and curved **Lateral Surface Area (`πrs`, no lid!)**.\n(b) A basketball has radius **`r = 12 cm`**. Calculate its **Volume (`cm³`)** AND **Surface Area (`cm²`)**.\n(c) Each **exterior angle** of a regular polygon measures `45°`. How many sides (`n`) does it have (`360° ÷ 45°`), and what is ONE **interior angle**?", "step1_deconstruct": {"instruction": "Watch Diameter→Radius (`r=5`) and `5-12-13` Pythagoras in (a), cube `12³` in (b), and exterior angle rule `360°/n` in (c)!", "guidingQuestions": ["What is `r = 10 ÷ 2` and `√(5² + 12²)`?", "What is `12³` (NOT `12²`) for Sphere Volume?", "What do one interior + one exterior angle add to (`180°`)?"], "modelPlan": "(a) r=5; V = 3.14×25×12÷3 = 314 cm³; s = √(25+144) = 13 cm; Lateral SA = 3.14×5×13 = 204.1 cm². (b) V = 4/3(3.14)(1728) = 7,234.56 cm³; SA = 4(3.14)(144) = 1,808.64 cm². (c) n = 360÷45 = 8 sides (octagon!); interior = 180−45 = 135°."}, "step2_anchor": {"instruction": "Formulas:", "referenceItems": ["Cone `V = πr²h ÷ 3` | Lateral SA = `πrs` (`s = √(r² + h²)`)", "Sphere `V = 4πr³ ÷ 3` | `SA = 4πr²`", "Regular Polygon: `n = 360° ÷ Exterior Angle` | `Interior = 180° − Exterior`"]}, "step3_substeps": [{"label": "Step 3a: Find the Cone's Volume (`cm³`), Slant Height `s`, and Lateral SA (`cm²`)", "placeholder": "r = 5 cm | V = 3.14 × 5² × 12 ÷ 3 = ... cm³\ns = √(5² + 12²) = ... cm\nLateral SA = 3.14 × 5 × ... = ... cm²", "hint": "25×12÷3 = 100 → `V = 314 cm³`! `5-12-13` triple → `s = 13 cm`! `3.14 × 65 = 204.1 cm²`!", "modelSubAnswer": "• `r = 10 ÷ 2 = 5 cm`\n• `V = 3.14 × 5² × 12 ÷ 3 = 3.14 × 100 = 314 cm³`\n• Slant Height `s = √(5² + 12²) = √169 = 13 cm`\n• Lateral SA (no lid) = `3.14 × 5 × 13 = 204.1 cm²`"}, {"label": "Step 3b: Find Volume (`cm³`) AND Surface Area (`cm²`) of the `r = 12 cm` basketball", "placeholder": "V = 4 × 3.14 × 12³ ÷ 3 = ... cm³\nSA = 4 × 3.14 × 12² = ... cm²", "hint": "`12³ = 1,728` and `1,728 ÷ 3 = 576` → `4 × 3.14 × 576 = 7,234.56 cm³`! `SA = 4 × 3.14 × 144 = 1,808.64 cm²`!", "modelSubAnswer": "• `V = (4/3) × 3.14 × 12³ = (4/3) × 3.14 × 1,728 = 7,234.56 cm³`\n• `SA = 4 × 3.14 × 12² = 4 × 3.14 × 144 = 1,808.64 cm²`"}, {"label": "Step 3c: Find side count `n` and interior angle from a `45°` exterior angle", "placeholder": "n = 360° ÷ 45° = ... sides (...)\nInterior angle = 180° − 45° = ...", "hint": "360 ÷ 45 = 8 sides (Octagon!) and `180° − 45° = 135°`!", "modelSubAnswer": "• `n = 360° ÷ 45° = 8 sides` (**Regular Octagon**!)\n• One Interior Angle = `180° − 45° = 135°` (Double check: `(8−2)×180° ÷ 8 = 1080° ÷ 8 = 135°` ✅!)."}], "step4_checks": ["Did I halve diameter `10 ÷ 2 = 5 cm` AND compute `s = 13 cm` via Pythagoras?", "Did I use `12³ = 1,728` for Sphere Volume (`cm³`) and `12² = 144` for SA (`cm²`)?", "Did I confirm `n = 8` sides and `135°` interior angle?"], "step5_modelAnswer": {"basicAnswer": "Cone V=314, s=13, SA=204.1; Sphere V=7234.56, SA=1808.64; Octagon 135°.", "expandedAnswer": "Part (a): `r = 5 cm`; `V = 314 cm³`; `s = √(5²+12²) = 13 cm`; Lateral `SA = πrs = 204.1 cm²`.\nPart (b): Sphere `V = 4/3(3.14)(12³) = 7,234.56 cm³`; `SA = 4(3.14)(12²) = 1,808.64 cm²`.\nPart (c): `n = 360° ÷ 45° = 8` (Regular Octagon); interior angle = `180° − 45° = 135°`.", "extensionPrompt": "Extension: Notice how `V_sphere = 4 × SA_sphere` when `r = 12` (`7234.56 = 4 × 1808.64`)—because `(4/3)πr³ ÷ (4πr²) = r/3 = 12/3 = 4`!"}}, {"id": "g9-math-q6", "bloomLevel": 5, "bloomTag": "APPLY & ANALYZE (EQAO!)", "title": "EQAO MTH1W Special Lab: Circle Geometry Theorems, Intercepts & Optimization", "prompt": "Tackle these **3 classic Ontario Grade 9 EQAO Math problems**:\n(a) **Circle Theorems:** A circle with centre `O` and radius `r = 6 cm` has a tangent line touching point `A` on the circle, running `8 cm` to an external point `P`. (1) What angle is `∠OAP`? (2) Use Pythagoras to find distance `OP`! (3) If Central Angle `∠AOB = 114°`, find Inscribed Angle `∠ACB` on the same arc!\n(b) **3-Sided Optimization:** A school has **`48 m`** of fencing to build a rectangular outdoor robotics arena against ONE existing brick school wall (so only 3 sides need fence!). Find the exact Width `W`, Length `L`, and **Maximum Area (`m²`)**!\n(c) **Direct vs. Partial & Intercepts:** Classify `y = 14x` vs. `3x + 2y = 18` as Direct or Partial Variation, and find BOTH the `x`-intercept and `y`-intercept of `3x + 2y = 18`!", "step1_deconstruct": {"instruction": "Deploy Tangent `90°` + `6-8-10` Pythagoras + `½` Inscribed Angle in (a), 3-sided `L = 2W` in (b), and plug `0` for intercepts in (c)!", "guidingQuestions": ["What angle does a tangent ALWAYS make with a radius (`90°`)?", "For a 3-sided fence against a wall (`48 m`), how do `W, L, W` split `48 m` (`12, 24, 12`)?", "When `y = 0` in `3x + 2y = 18`, what is `x`?"], "modelPlan": "(a) ∠OAP=90° (Tangent⊥Radius); OP = √(6²+8²) = 10 cm; ∠ACB = 114°÷2 = 57°! (b) 3-sided optimal: W = 48÷4 = 12 m, L = 48÷2 = 24 m → Max Area = 288 m²! (c) y=14x Direct ((0,0)); 3x+2y=18 Partial (b=9); x-int (6,0), y-int (0,9)!"}, "step2_anchor": {"instruction": "EQAO Super-Rules:", "referenceItems": ["Tangent ⊥ Radius = `90°` | Inscribed Angle = `½ × Central Angle`", "3-Sided Max Area (against wall): `W = P ÷ 4`, `L = P ÷ 2` (`L = 2W`!)", "`x`-int: set `y = 0` | `y`-int: set `x = 0`"]}, "step3_substeps": [{"label": "Step 3a: Solve all 3 Circle Theorem parts (`∠OAP`, distance `OP`, and Inscribed `∠ACB`)", "placeholder": "1. ∠OAP = ...° (reason)\n2. OP = √(6² + 8²) = ... cm\n3. ∠ACB = 114° ÷ 2 = ...°", "hint": "Tangent ⊥ Radius = `90°` → `6-8-10` right triangle (`OP = 10 cm`) → `114° ÷ 2 = 57°`!", "modelSubAnswer": "1. `∠OAP = 90°` (**Tangent–Radius Theorem**).\n2. `OP = √(6² + 8²) = √(36 + 64) = √100 = 10 cm`.\n3. Inscribed `∠ACB = 114° ÷ 2 = 57°` (**Central = 2 × Inscribed**)."}, {"label": "Step 3b: Maximize the 3-sided robotics arena area using `48 m` of fence against a wall", "placeholder": "W = 48 ÷ 4 = ... m | L = 48 ÷ 2 = ... m\nCheck fence: W + L + W = ... m\nMax Area = ... m²", "hint": "Half (`24 m`) goes to the wall-parallel length `L`, and the other `24 m` splits across two widths (`12 m` each) → `12 × 24 = 288 m²`!", "modelSubAnswer": "• Width `W = 48 ÷ 4 = 12 m` | Length `L = 48 ÷ 2 = 24 m` (Check: `12 + 24 + 12 = 48 m` ✅)\n• **Maximum Area = `12 m × 24 m = 288 m²`** (beats a 4-sided square `12×12 = 144 m²` by DOUBLE!)"}, {"label": "Step 3c: Classify Direct vs. Partial AND find BOTH intercepts of `3x + 2y = 18`", "placeholder": "y = 14x is ... | 3x + 2y = 18 is ...\nx-int (y=0): (..., 0) | y-int (x=0): (0, ...)", "hint": "`y = 14x` passes through `(0, 0)` (Direct); `3x + 2y = 18` has `y`-int `(0, 9)` (Partial) and `x`-int `(6, 0)`!", "modelSubAnswer": "• `y = 14x` → **Direct Variation** (starts at `(0, 0)`).\n• `3x + 2y = 18` → **Partial Variation** (`y = −1.5x + 9`, `b = 9 ≠ 0`).\n• **`x`-intercept (`y = 0`):** `3x = 18` → **`(6, 0)`** | **`y`-intercept (`x = 0`):** `2y = 18` → **`(0, 9)`**!"}], "step4_checks": ["Did I state Tangent ⊥ Radius (`90°`), compute `OP = 10 cm`, and halve `114° → 57°`?", "Did I use the 3-sided optimization rule (`12 m × 24 m = 288 m²`, checking `12+24+12=48 m`)?", "Did I write BOTH intercepts as ordered pairs `(6, 0)` and `(0, 9)`?"], "step5_modelAnswer": {"basicAnswer": "90°, 10 cm, 57°; 12m × 24m = 288 m²; Direct vs Partial, (6,0) and (0,9).", "expandedAnswer": "Part (a): `∠OAP = 90°` (Tangent ⊥ Radius); `OP = √(6²+8²) = 10 cm`; Inscribed `∠ACB = 114° ÷ 2 = 57°`.\nPart (b): Against 1 wall, optimal 3-sided dimensions are `W = 12 m`, `L = 24 m` (`12+24+12 = 48 m`) → **Max Area = `288 m²`**.\nPart (c): `y = 14x` is Direct (`b=0`); `3x + 2y = 18` is Partial (`b=9`) with `x`-intercept **`(6, 0)`** and `y`-intercept **`(0, 9)`**.", "extensionPrompt": "Extension: On EQAO, what if a question gives you a chord of length `16 cm` at distance `6 cm` from the circle's centre `O`? Half-chord = `8 cm`, so radius `r = √(6² + 8²) = 10 cm`!"}}]}, {"id": "g9-math-u5", "title": "Unit 5 (Strands D & F): Linear Regression, Appreciation & Depreciation", "studyFirstTag": "Predict trends with Line of Best Fit + model cars losing value vs. investments growing!", "curriculumStrand": "Ontario MTH1W Strands D & F: Data Literacy & Financial Literacy", "svgDiagram": "g9_math_mth1w_svg", "lessons": [{"id": "g9-math-u5-l1", "title": "Lesson 5.1: Interpolation vs. Extrapolation & Appreciation vs. Depreciation", "readTime": "3 min read", "bigIdea": "**Interpolation** predicts *inside* your known data range (more reliable), **Extrapolation** predicts *beyond* it (riskier!)—and **`A = P(1 ± r)ᵗ`** models BOTH **Appreciation** (`+r`, value grows!) and **Depreciation** (`−r`, cars/laptops lose value!)!", "paragraphs": ["In Grade 9 `MTH1W` Data Literacy, you fit a **Line of Best Fit (`y = mx + b`)** to real-world scatter plots (like *Study Time* vs. *Grade* or *Car Age* vs. *Resale Value*) and judge correlation strength (`Strong Positive`, `Weak Negative`, `No Correlation`). Predicting a value **IN-between** your measured data points is **Interpolation** (think *IN*side = reliable); extending the line **OUT-side** your data range is **Extrapolation** (*EX*it = riskier because trends can curve or hit limits!).", "In `MTH1W` Financial Literacy, distinguish two life-changing asset behaviours:\n• **Appreciation (`A = P(1 + r)ᵗ`):** Assets that GAIN value over time (index investments, real estate, rare collectibles).\n• **Depreciation (`A = P(1 − r)ᵗ`):** Assets that LOSE value every year (cars, smartphones, laptops!). Example: A `$30,000` new car depreciating `15%` per year keeps `85%` (`× 0.85`) each year: after 3 years it's worth `$30,000 × (0.85)³ = $18,423.75`!", "Smart Grade 9 Budgeting Rule: Spend wisely on depreciating items (like buying a reliable 3-year-old car *after* the steepest depreciation drop!), and invest early into appreciating assets!"], "keyTakeaway": "**IN**terpolation = inside data | **EX**trapolation = outside data. Appreciation = `P(1 + r)ᵗ`; **Depreciation** = `P(1 − r)ᵗ` (keeps `1 − r` each year!).", "deepReadTitle": "📉 Depreciation vs. Appreciation Quick Formula", "deepReadText": "• Appreciates 8%/yr → multiplier `1 + 0.08 = 1.08` → `A = P(1.08)ᵗ`\n• Depreciates 20%/yr → multiplier `1 − 0.20 = 0.80` → `A = P(0.80)ᵗ`\n• Correlation ≠ Causation! (Ice cream sales & sunburns correlate strongly because SUMMER causes both!)", "quickCheck": {"question": "A `$2,000` gaming laptop **depreciates** by `20%` per year (`A = 2000 × (0.80)ᵗ`). What is it worth after `2` years?", "options": ["$1,200 (subtracted 40% linearly)", "$1,280 (`2000 × 0.80² = 2000 × 0.64`!)", "$2,880 (appreciated instead!)"], "correctIdx": 1, "explanation": "Losing 20% each year means it keeps `80%` (`0.80`): Year 1 = `$1,600`, Year 2 = `$1,600 × 0.80 = $1,280`!"}, "videos": [{"id": "DmGLQkUm-4g", "title": "Line of Best Fit Equation (Scatter Plots)", "channel": "Mario's Math Tutoring", "why": "Shows how to write y = mx + b from a scatter plot and interpolate/extrapolate."}, {"id": "m5Tf6vgoJtQ", "title": "Exponential Growth & Decay Word Problems", "channel": "Khan Academy", "why": "Masters both (1 + r)ᵗ appreciation and (1 − r)ᵗ depreciation."}]}, {"id": "g9-math-u5-l2", "title": "Lesson 5.2: Comparing Two Data Sets — Box Plots, Histograms & Outliers (MTH1W Strand D)", "readTime": "3 min read", "bigIdea": "To compare two distributions fairly on `MTH1W` EQAO, compare BOTH their **Centre (Mean vs. Median)** AND their **Spread (Range vs. IQR)**—always choosing **Median + IQR** when extreme outliers skew the data!", "paragraphs": ["In Grade 9 `MTH1W` Data Literacy (`D1.2`), you analyze **Histograms** (touching bars grouping continuous intervals like `70–79, 80–89, 90–100`) and side-by-side **Box Plots** to compare two real groups (e.g., *Class A* vs. *Class B* test scores, or *Summer* vs. *Winter* transit times).", "Remember the **Outlier Rule**: one extreme value (like one billionaire walking into a coffee shop, or one `15%` missed quiz!) drags the **Mean** and **Range** wildly off-centre, while the **Median (Q2)** and **Interquartile Range (`IQR = Q3 − Q1`)** stay rock-steady! Use the **Shape Check**: symmetric bell-shaped data → Mean ≈ Median; skewed data with outliers → report **Median + IQR**!", "When comparing two Box Plots side-by-side, a **shorter box (smaller IQR)** means more **consistent** scores, while a box shifted further right means higher typical performance!"], "keyTakeaway": "Histograms have **touching bars** for continuous intervals. When outliers exist, **Median & IQR** beat Mean & Range! Smaller IQR = more consistent data!", "deepReadTitle": "📊 Histogram vs. Bar Graph Quick Check", "deepReadText": "• Bar Graph: Separate categories (French, Math, Science) → **GAPS** between bars!\n• Histogram: Continuous numerical intervals (`0–10, 10–20, 20–30`) → **TOUCHING** bars!", "quickCheck": {"question": "Team A has `Median = 82, IQR = 6`; Team B has `Median = 82, IQR = 22`. Which statement is mathematically TRUE?", "options": ["Team B is far more consistent because its IQR is larger.", "Both teams have the same typical middle score (`82`), but Team A is much more consistent (tighter middle 50% spread)!", "Team A has a higher median than Team B."], "correctIdx": 1, "explanation": "Identical medians (`82`), yet Team A's tiny `IQR = 6` proves its middle 50% of scores are clustered far more tightly and consistently than Team B's `IQR = 22`!"}, "videos": [{"id": "s_w3EJ2Jzw0", "title": "Comparing Histograms and Box Plots", "channel": "Khan Academy", "why": "Shows how to compare centre, spread, consistency, and skew across two distributions."}]}], "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Recall Interpolation/Extrapolation & Appreciation/Depreciation", "content": "Lock in Strands D & F:", "keyPoints": ["Interpolation = inside data range | Extrapolation = beyond data range.", "Appreciation = `P(1 + r)ᵗ` | Depreciation = `P(1 − r)ᵗ` | Correlation ≠ Causation!"]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Explain Why 'Correlation Does NOT Prove Causation'", "content": "Two trends moving together can both be driven by a hidden 3rd factor!", "analogy": "🍦 Summer Analogy: Ice cream sales and swimming pool visits rise together—eating ice cream doesn't cause swimming; warm July weather causes BOTH!", "keyPoints": ["Always check for lurking third variables before claiming X causes Y!"]}, {"level": 3, "name": "APPLY", "subtitle": "Compare a Car Losing 15%/yr vs. an Investment Gaining 8%/yr", "content": "Track both over 3 years:", "workedExample": {"prompt": "Compare `$10,000` in a car (`−15%/yr`) vs. `$10,000` invested (`+8%/yr`) after 3 years:", "steps": ["Car: `10000 × (0.85)³ = $6,141.25` (
