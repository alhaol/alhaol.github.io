ig gym (dans le grand gymnase)."]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare 3 Ways to Ask a Question in French", "content": "See how French turns statements into questions:", "comparisonTable": {"headers": ["Method", "How It Works", "Example"], "rows": [["1. Intonation (Casual)", "Raise your voice at the end + add '?'", "Tu aimes le gymnase?"], ["2. Est-ce que (All-Purpose!)", "Add 'Est-ce que' at the start", "Est-ce que tu aimes le gymnase?"], ["3. Question Word + Est-ce que", "Où / Quand / Pourquoi / Quel + est-ce que", "Pourquoi est-ce que tu aimes le gymnase?"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Check Reflexive Verbs & QUEL Gender Errors", "content": "Spot the 2 errors in: « Je lève à 7h30 et quel heure commence le match? »", "keyPoints": ["❌ Missing reflexive 'me' in 'Je lève' → ✅ « Je me lève à 7h30 »", "❌ 'heure' is feminine ('une heure') → ✅ « et à quelle heure commence le match? »"]}, {"level": 6, "name": "CREATE", "subtitle": "Write a 3-Line French Email About Your Morning & Ask a Friend to Join Gym", "content": "Combine reflexive morning verbs with a 'Quel' or 'Est-ce que' invitation question.", "keyPoints": ["Directly builds everyday speaking and writing fluency for N. Bishop!"]}], "questions": [{"id": "fr-u5-q1", "bloomLevel": 4, "bloomTag": "ANALYZE & APPLY", "title": "Authentic French Poster Reading + Morning Routine & Questions", "prompt": "Read the school notice from Lesson 5.1:\n« AVIS AUX ÉLÈVES DE 7e ANNÉE : Tournoi de Basketball! Quand : Jeudi à 12h15 dans le grand gymnase. Menu spécial à la cafétéria : Sandwich au poulet, salade fraîche et fruit (5,50 $). Est-ce que tu veux participer avec ton équipe? Inscris ton nom avant mercredi! »\n\nComplete all 3 parts:\n(a) Extract the 4 key facts in English: What is the event, When/Where is it, What is the deadline to sign up, and What is on the special cafeteria menu?\n(b) Write 2 French sentences about your morning routine before school using reflexive verbs ('se réveiller' / 'se lever' / 'se préparer') so you arrive on time!\n(c) Write 2 French questions to ask a friend about the tournament using 'Est-ce que' and 'Quelle' (e.g., asking if they want to play and what time it starts).", "step1_deconstruct": {"instruction": "Scan the poster for days ('jeudi', 'mercredi'), time ('12h15'), price ('5,50 $'), and food Mots-Amis.", "guidingQuestions": ["Which day is 'jeudi' vs. 'mercredi'?", "What reflexive pronoun goes with 'Je' ('me')?", "Is 'heure' masculine or feminine ('quelle heure')?"], "modelPlan": "(a) Basketball tournament, Thursday 12:15 PM in big gym, deadline before Wednesday, chicken sandwich + fresh salad + fruit for $5.50. (b) Je me réveille / Je me lève / Je me prépare. (c) Est-ce que tu veux jouer? + À quelle heure commence le tournoi?"}, "step2_anchor": {"instruction": "Days & Routine Anchor:", "referenceItems": ["lundi (Mon), mardi (Tue), mercredi (Wed), jeudi (Thu), vendredi (Fri)", "poulet = chicken | salade fraîche = fresh salad | avant = before", "Je me réveille (wake up) | Je me lève (get up) | Je me prépare (get ready)"]}, "step3_substeps": [{"label": "Step 3a: Part (a) — Extract all 4 facts from the French school notice in English", "placeholder": "Event: ...\nWhen & Where: ...\nSign-up Deadline: ...\nCafeteria Menu & Price: ...", "hint": "Jeudi = Thursday; mercredi = Wednesday; 12h15 = 12:15 PM.", "modelSubAnswer": "• Event: Grade 7 Basketball Tournament.\n• When & Where: Thursday at 12:15 PM in the big gym.\n• Deadline: Sign up your name before Wednesday.\n• Special Cafeteria Menu: Chicken sandwich, fresh salad, and fruit for $5.50."}, {"label": "Step 3b: Part (b) — Write 2 French sentences about your morning routine using reflexive verbs (Je me...)", "placeholder": "Le jeudi matin, je me réveille à ... et je me prépare...", "hint": "Don't forget 'me' right before the verb: 'Je me lève à sept heures et je me prépare vite pour arriver à l'heure!'", "modelSubAnswer": "« Le jeudi matin, je me réveille à sept heures et je me lève immédiatement. Ensuite, je me prépare pour l'école afin d'arriver à l'heure! »"}, {"label": "Step 3c: Part (c) — Write 2 French questions using 'Est-ce que' and 'Quelle'", "placeholder": "1. Est-ce que tu...\n2. À quelle heure...", "hint": "Ask if your friend wants to play on your team and what time the match starts!", "modelSubAnswer": "1. « Est-ce que tu veux jouer au basketball dans mon équipe jeudi? »\n2. « À quelle heure est-ce que le tournoi commence exactement? »"}], "step4_checks": ["Did I translate 'jeudi' (Thursday) and 'mercredi' (Wednesday) accurately in Part (a)?", "Did I include the reflexive pronoun 'me' in Part (b) ('je me réveille / je me lève / je me prépare')?", "Did I use feminine 'Quelle' before 'heure' in Part (c)?"], "step5_modelAnswer": {"basicAnswer": "Basketball Thursday 12:15, sign up before Wednesday, chicken sandwich $5.50. Je me lève à 7h. Est-ce que tu joues?", "expandedAnswer": "Complete Grade 7+ Response:\n(a) Notice Facts: Grade 7 Basketball Tournament on Thursday at 12:15 PM in the large gym; players must register before Wednesday; special cafeteria combo is a chicken sandwich, fresh salad, and fruit for $5.50.\n(b) Morning Routine: « Le jeudi matin, je me réveille à sept heures et je me lève tout de suite. Je me prépare rapidement pour arriver à l'école à l'heure! »\n(c) Questions: « Est-ce que tu veux participer au tournoi dans mon équipe? À quelle heure est-ce que nous allons au gymnase? »", "extensionPrompt": "Real-Life Connection: Remember the report card showed 2 lates—using your French morning routine checklist helps turn 2 lates into 0!"}}]}], "friendlySub": "Decoding, adjectives, verbs, negation, passé composé & reading", "accent": "#2563eb"}, {"id": "geo", "code": "CGC / Geography 7", "name": "Geography", "teacher": "O. Macri (OM)", "status": "Progressing With Difficulty", "tier": "Tier 1: Priority Focus", "tierClass": "tier-urgent", "icon": "🗺️", "reportComment": "Zaid is learning to read topographical maps and identify landforms. Next step: focus effort on finishing all classwork with consistent effort and regularly reviewing concepts to prepare for upcoming quizzes. (OM)", "nextSteps": ["Master reading topographical maps: contour intervals, steep vs. gentle slopes, and river valleys", "Identify major Canadian & global landforms (Shield, Plains, Mountains, Valleys, Plateaus)", "Finish 100% of sub-questions in classwork using the Completion Checklist", "Review key Geography flashcards before every quiz with O. Macri"], "units": [{"id": "geo-u1", "title": "Unit 1: Topographical Maps, Contour Lines & Landform Identification", "curriculumStrand": "Ontario Grade 7 Geography Strand A: Physical Patterns in a Changing World (A1, A2, A3)", "svgDiagram": "topo_map_svg", "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Key Topographical Map & Landform Definitions (Quiz Flashcards)", "content": "To ace O. Macri's Geography quizzes, memorize these core definitions and map rules:", "keyPoints": ["🗻 Topographical Map: A 2D map that shows the 3D shape, elevation (height), and landforms of Earth's surface using contour lines.", "📏 Contour Line: An imaginary line on a map connecting all points that have the EXACT same elevation above sea level (0 m).", "🔢 Contour Interval (CI): The vertical difference in elevation between two adjacent contour lines (e.g., if CI = 20 m, lines go 0 m, 20 m, 40 m, 60 m...).", "Bold Index Contour: Every 5th contour line is printed thicker and labeled with its elevation number to help you count quickly.", "🏔️ Major Landforms: Mountains (high elevation, steep relief, >600 m), Shield (ancient eroded rock with lakes, like the Canadian Shield), Plains/Lowlands (flat or gently rolling land), Plateau (flat-topped highland), Valley (low area between hills/mountains, often carved by a river or glacier)."]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Explain How 2D Contour Lines Reveal 3D Steepness & River Flow", "content": "Why do contour lines squeeze together in some places and spread far apart in others?", "analogy": "🏃‍♂️ Gym Bleachers vs. School Ramp Analogy: Imagine climbing the gym bleachers where every step goes up 20 cm in a tiny horizontal space—that's a STEEP cliff (contour lines packed tightly together). Now imagine walking up a long wheelchair ramp that rises the same height over 30 metres—that's a GENTLE slope (contour lines spaced far apart)!", "keyPoints": ["Rule 1 (Steep Slope / Cliff): Contour lines are VERY CLOSE together.", "Rule 2 (Gentle Slope / Flat Plain): Contour lines are FAR APART.", "Rule 3 (Hill / Peak): Concentric closed loops getting higher toward the centre.", "Rule 4 (River Valley 'Rule of Vs'): When contour lines cross a river, they form a 'V' shape that points UPSTREAM (toward higher elevation / the source of the river). Therefore, the river flows in the OPPOSITE direction of the V-point!"]}, {"level": 3, "name": "APPLY", "subtitle": "Calculate Contour Intervals, Missing Elevations & Relief Step-by-Step", "content": "Follow this exact 4-step formula on every map question in classwork and quizzes:", "workedExample": {"prompt": "On a topographical map, one bold Index Contour is labeled 100 m and the next bold Index Contour (5 spaces higher) is labeled 200 m. Point X is 3 lines above 100 m. What is the Contour Interval, what is the elevation of Point X, and what is the total relief from Sea Level (0 m) to Point X?", "steps": ["Step 1 (Find Difference Between Index Contours): 200 m − 100 m = 100 m.", "Step 2 (Divide by Number of Spaces Between Them): 100 m ÷ 5 spaces = 20 m per space. So Contour Interval (CI) = 20 m!", "Step 3 (Count Up to Point X): Start at 100 m and add 3 intervals of 20 m: 100 m + (3 × 20 m) = 160 m.", "Step 4 (Include Units!): Point X elevation = 160 m above sea level."]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Canadian Landform Regions & Their Topographical Signatures", "content": "Analyze how Canada's major landform regions look on a topographical map and how humans interact with them:", "comparisonTable": {"headers": ["Landform Region", "Topographical Contour Pattern", "Physical Characteristics", "Human Activity & Settlement"], "rows": [["Western Cordillera (Rockies)", "Extremely tight, jagged contour rings (2000m–3500m+)", "Young, sharp fold mountains, deep V-shaped river & U-shaped glacial valleys", "Forestry, hydroelectricity, ski tourism, transportation passes"], ["Canadian Shield", "Irregular, bumpy contours (200m–600m) with thousands of lakes", "Ancient Precambrian igneous/metamorphic rock scraped by glaciers", "Mining (nickel, gold, copper), forestry, recreation"], ["Interior Plains", "Very wide, far-apart contour lines (gradual slope)", "Flat to gently rolling sedimentary bedrock, rich prairie soil", "Agriculture (wheat, cattle), oil/gas, wind/solar energy"], ["Great Lakes–St. Lawrence Lowlands (Ottawa/Nepean!)", "Widely spaced low contours (50m–200m) along river valleys", "Fertile glacial plains, Ottawa & St. Lawrence rivers, escarpments", "Highest population density in Canada, farming, industry, cities"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Audit Incomplete Classwork & Quiz Traps (O. Macri's Checklist)", "content": "Why do students lose marks on Geography quizzes even when they understand maps? Let's audit the 3 classic traps:", "keyPoints": ["Trap #1 (Reversing River Direction): Seeing V-shaped contours pointing North and saying 'The river flows North.' ❌ Fix: The V points UPSTREAM (uphill), so the water flows DOWNHILL (South)!", "Trap #2 (Forgetting Units & Compass Directions): Writing '40' instead of '40 m' or 'the left side' instead of 'the West side'.", "Trap #3 (Leaving Part B of a Question Blank): Many Geography questions ask 'Identify the landform AND explain why it is suitable for settlement.' Answering only the first half caps your mark at 50%!"]}, {"level": 6, "name": "CREATE", "subtitle": "Design an Emergency Search-and-Rescue Route & Settlement Plan on a Contour Map", "content": "Synthesize contour intervals, slope steepness, river flow, and landform stability to justify where to build a sustainable community and trail system.", "keyPoints": ["Justify Trail Route: Choose the East ridge where contour lines are spaced 3 cm apart (gentle gradient) instead of the West cliff where contour lines are 2 mm apart (dangerous rockfall hazard).", "Justify Bridge Location: Place the bridge where the river valley narrows and flat floodplains won't submerge the road during spring snowmelt."]}], "questions": [{"id": "geo-q1", "bloomLevel": 4, "bloomTag": "APPLY & ANALYZE", "title": "Topographical Map Lab: Eagle Peak & Pine River Valley", "prompt": "Look at the interactive Topographical Map Diagram above (Eagle Peak & Pine River):\n• Sea level (coastline) is at 0 m.\n• The bold Index Contour is at 100 m (5 contour spaces above 0 m).\n• Eagle Peak's inner ring is 3 contour lines above the 100 m index contour, with a summit spot height dot of 172 m.\n• The West slope has contour lines packed tightly together; the East slope has contour lines spaced widely apart.\n• Pine River crosses the contour lines, and the 'V' shapes in the contour lines point toward the North-West (NW).\n\nComplete ALL 4 parts of your classwork in deep multi-step work:\n(a) Calculate the Contour Interval (CI) and the elevation of the inner ring around Eagle Peak.\n(b) Calculate the maximum possible elevation of the summit if the spot height (172 m) wasn't printed.\n(c) Compare the West slope vs. the East slope and recommend which side a Grade 7 hiking class should climb.\n(d) Determine the compass direction in which Pine River is flowing and explain how you know.", "step1_deconstruct": {"instruction": "STOP & PLAN (O. Macri Classwork Completion Rule): Count how many sub-questions are asked (4 parts: a, b, c, d) so zero parts are left unfinished!", "guidingQuestions": ["What are the 4 sub-questions (a, b, c, d) I must complete?", "What numbers are given? (Sea level = 0 m, Index contour = 100 m at 5 spaces, inner ring = 3 lines above 100 m).", "What map rules apply to slope steepness and river 'V' shapes?"], "modelPlan": "I will answer all 4 parts: (a) Divide 100 m by 5 spaces to find CI, then add 3 intervals to 100 m. (b) Find the highest possible elevation just below the next invisible contour line. (c) Contrast West (tight lines = steep) vs. East (wide lines = gentle). (d) Apply the Rule of Vs for Pine River (V points NW upstream -> river flows SE downstream)."}, "step2_anchor": {"instruction": "ANCHOR CHART FORMULAS: Select the Topographical Rules.", "referenceItems": ["Contour Interval (CI) = (Index Contour 2 − Index Contour 1) ÷ Number of spaces", "Maximum Peak Height Rule = Next Contour Line Elevation − 1 m", "Slope Rule: Close lines = Steep cliff | Wide lines = Gentle slope", "River Rule of Vs: Contour 'V' points UPSTREAM -> River flows in the OPPOSITE compass direction"]}, "step3_substeps": [{"label": "Step 3a: Part (a) — Show your math for the Contour Interval (CI) and the elevation of the inner contour ring (3 lines above 100 m)", "placeholder": "CI = 100 m ÷ 5 = ...\nInner ring = 100 m + (3 × ...) = ... m", "hint": "100 m divided by 5 spaces gives 20 m per line. Then add 3 × 20 m to 100 m!", "modelSubAnswer": "Contour Interval (CI) = (100 m − 0 m) ÷ 5 spaces = 20 m.\nInner Contour Ring Elevation = 100 m + (3 lines × 20 m) = 100 m + 60 m = 160 m."}, {"label": "Step 3b: Part (b) — If the 172 m spot height wasn't printed, what would be the maximum possible whole-metre elevation of Eagle Peak?", "placeholder": "The inner ring is 160 m. If it reached the next contour line, it would be 180 m, so the maximum possible height is...", "hint": "If the mountain reached 180 m, the map maker would have drawn another 180 m ring! Since there is no 180 m ring, what is 1 m less than 180 m?", "modelSubAnswer": "Since the highest drawn contour ring is 160 m and the Contour Interval is 20 m, the next contour ring would be 180 m. Because there is no 180 m ring drawn, the peak must be above 160 m but below 180 m—so the maximum whole-metre elevation is 179 m."}, {"label": "Step 3c: Part (c) & Part (d) — Compare the West vs. East hiking slopes AND determine Pine River's flow direction using the Rule of Vs", "placeholder": "Part (c) Slope Recommendation: The class should hike up the East slope because...\nPart (d) River Flow: Pine River flows toward the...", "hint": "If the contour 'V' points North-West (NW), what is the exact opposite compass direction?", "modelSubAnswer": "Part (c) Slope Comparison: The Grade 7 class should climb the East slope because the contour lines on the East side are spaced widely apart, indicating a gradual, gentle slope that is safe for hiking. The West side has tightly packed contour lines, indicating a dangerous, steep cliff.\n\nPart (d) River Flow Direction: Pine River flows toward the South-East (SE). By the Rule of Vs, contour lines bend into a 'V' pointing upstream (toward higher elevation in the North-West), so water flows downhill in the opposite direction (South-East) toward sea level."}], "step4_checks": ["Did I include 'm' (metres) on every elevation and contour interval number?", "Did I answer all 4 parts (a, b, c, and d) so my classwork is 100% complete?", "Did I double-check that my river flow direction (SE) is the opposite of the V-point direction (NW)?"], "step5_modelAnswer": {"basicAnswer": "(a) 20m, 160m. (b) 179m. (c) East side is less steep. (d) South-East.", "expandedAnswer": "Complete Grade 7 Model Solution (O. Macri Quiz-Ready Standard):\n(a) Contour Interval & Inner Ring: Since there are 5 spaces between 0 m and the 100 m index contour, CI = 100 m ÷ 5 = 20 m. The inner ring is 3 intervals above 100 m: 100 m + (3 × 20 m) = 160 m.\n(b) Maximum Possible Summit Elevation: Without a spot height, the peak is higher than the last ring (160 m) but lower than the next ring (180 m), giving a maximum whole-metre elevation of 179 m (which matches the actual spot height of 172 m!).\n(c) Slope Analysis & Recommendation: The hiking class should take the East slope. On the East side, the contour lines are spaced far apart, meaning elevation increases gradually over a long horizontal distance (gentle gradient). On the West side, the contour lines are crowded together, showing a steep cliff.\n(d) Pine River Flow Direction: Pine River flows South-East (SE). Contour lines crossing a river valley form 'V' shapes that point upstream toward higher ground (North-West), meaning gravity pulls the water downstream in the opposite direction (South-East).", "extensionPrompt": "Extension Challenge (Bloom Level 6): Calculate the vertical relief between the 40 m contour bridge on Pine River and the 172 m summit of Eagle Peak!"}}, {"id": "geo-q2", "bloomLevel": 5, "bloomTag": "ANALYZE & EVALUATE", "title": "Landforms of Canada & Settlement Decision-Making", "prompt": "Compare the Great Lakes–St. Lawrence Lowlands (where Ottawa/Nepean is located!) with the Canadian Shield. Why does the Great Lakes–St. Lawrence Lowlands have over 50% of Canada's population despite being the smallest landform region, while the giant Canadian Shield has a much smaller, spread-out population? Support your answer with 3 physical geography factors (topography/landform, soil/bedrock, and climate/waterways).", "step1_deconstruct": {"instruction": "STOP & PLAN: Identify the two regions being compared and the 3 required physical geography factors.", "guidingQuestions": ["Which two Canadian landform regions am I comparing?", "What are the 3 factors I must include? (1. Topography/slope, 2. Soil vs. bare rock, 3. Climate & waterways)"], "modelPlan": "Compare Great Lakes–St. Lawrence Lowlands vs. Canadian Shield across: (1) Flat lowland plains vs. rugged rocky shield, (2) Deep fertile glacial soil for farming vs. thin acidic soil over hard Precambrian bedrock, and (3) Warmer southern climate + St. Lawrence/Ottawa river trade routes."}, "step2_anchor": {"instruction": "ANCHOR CHART LOOKUP: Landform Characteristics vs. Human Settlement Needs.", "referenceItems": ["Great Lakes–St. Lawrence Lowlands: Flat plains, rich clay/silt soils from ancient glacial lakes (Lake Champlain Sea around Ottawa!), warm growing season, major navigable rivers.", "Canadian Shield: Covers ~50% of Canada, ancient igneous/metamorphic rock scraped bare by glaciers, thin soil, cold boreal climate, rich in minerals (nickel, gold, copper) and hydro power."]}, "step3_substeps": [{"label": "Step 3a: Factor 1 (Topography & Building) — Compare building cities/roads on Lowland Plains vs. the rocky Canadian Shield", "placeholder": "In the Great Lakes–St. Lawrence Lowlands, the land is flat or gently rolling, which makes it easy to...", "hint": "Think about blasting through solid granite bedrock vs. building on flat plains.", "modelSubAnswer": "Factor 1 (Topography & Infrastructure): The Great Lakes–St. Lawrence Lowlands has flat to gently rolling topography (widely spaced contour lines), making it easy and affordable to build cities, highways, railways, and airports. In contrast, the Canadian Shield consists of rugged, uneven Precambrian rock and thousands of bogs/lakes, requiring expensive rock-blasting to build roads."}, {"label": "Step 3b: Factor 2 (Soil & Agriculture) — Compare food production in both regions", "placeholder": "For agriculture, the Lowlands have deep, fertile soil left behind by glaciers, whereas the Canadian Shield...", "hint": "Remember what glaciers did: they scraped soil OFF the Shield and deposited it INTO the Lowlands!", "modelSubAnswer": "Factor 2 (Soil & Agriculture): Glaciers scraped soil off the Canadian Shield and deposited deep, nutrient-rich sediments in the Lowlands. This allows intensive farming to feed millions of people in Ontario and Quebec, whereas the Shield has thin, rocky soil unsuitable for large-scale farming."}, {"label": "Step 3c: Factor 3 (Climate & Water Transportation) + Conclusion on Resource Economies", "placeholder": "Finally, the Lowlands are further south with a warmer climate and connected to the St. Lawrence River...", "hint": "Mention how the Ottawa and St. Lawrence Rivers and Great Lakes support trade and fresh water.", "modelSubAnswer": "Factor 3 (Climate & Waterways): Located at a lower latitude moderated by the Great Lakes, the Lowlands enjoy a milder climate and longer growing season, plus direct ship access via the St. Lawrence Seaway and Ottawa River. Meanwhile, the Canadian Shield has harsher winters and settlements are primarily resource towns focused on mining, forestry, and hydroelectricity."}], "step4_checks": ["Did I mention both regions (Great Lakes–St. Lawrence Lowlands AND Canadian Shield) in each comparison?", "Did I cover all 3 required physical factors (Topography, Soil/Farming, Climate/Waterways)?", "Did I review the key terms ('Precambrian bedrock', 'glaciers', 'fertile soil', 'topography') for O. Macri's quiz?"], "step5_modelAnswer": {"basicAnswer": "The Lowlands are flat and warm with good soil for farms and cities, while the Canadian Shield is rocky and cold.", "expandedAnswer": "Complete Multi-Paragraph Geography Response:\nAlthough the Great Lakes–St. Lawrence Lowlands is Canada's smallest landform region, it supports over half of Canada's population (including Ottawa and Nepean) due to three interconnected physical factors:\n1. Topography & Construction: Its flat, low-elevation plains allow easy construction of dense cities, transit, and highways, whereas the Canadian Shield's rugged Precambrian bedrock and countless lakes make large-scale urban construction difficult.\n2. Glacial Soils & Agriculture: During the last Ice Age, glaciers scraped soil off the Canadian Shield and deposited deep, fertile marine clay and silt across the Lowlands. This supports productive agriculture, while the Shield's thin soil mainly supports boreal forests and mining towns.\n3. Climate & Navigable Waterways: Situated further south and moderated by the Great Lakes, the Lowlands have a warmer climate and direct access to international shipping along the St. Lawrence and Ottawa Rivers.", "extensionPrompt": "Quiz Self-Test: Without looking, name 3 natural resources extracted from the Canadian Shield!"}}], "studyFirstTag": "Start Here: How to Read Contour Lines & River Valleys on Maps", "lessons": [{"id": "geo-u1-l1", "title": "Lesson 1.1: Reading Topographical Maps & Contour Lines", "readTime": "3 min read", "bigIdea": "A topographical map turns a 3D mountain or river valley into a flat 2D map using elevation rings called contour lines.", "paragraphs": ["Imagine standing at the ocean beach—that is 0 metres above sea level. Now imagine walking up a hill and painting a glowing line all the way around the hill every time you climb exactly 20 metres higher (20 m, 40 m, 60 m, 80 m, 100 m). If a drone flew straight overhead and took a photo, those glowing rings are CONTOUR LINES!", "The vertical height jump between one contour line and the next is called the Contour Interval (CI). To help you read maps quickly without counting 50 tiny lines, map makers print every 5th contour line thicker and label it with its height—that thick line is an Index Contour. To find the Contour Interval, subtract two Index Contours and divide by the number of spaces between them (for example: 100 m ÷ 5 spaces = 20 m).", "Contour spacing tells you how steep the land is! When contour lines are packed tightly together, the elevation is shooting up in a tiny horizontal distance—that is a STEEP CLIFF. When contour lines are spread wide apart, the ground rises slowly—that is a GENTLE SLOPE or flat plain."], "keyTakeaway": "Close contour lines = Steep Cliff! Wide contour lines = Gentle Slope! Contour Interval = Elevation Difference ÷ Spaces.", "deepReadTitle": "🌊 The River 'Rule of Vs' (Don't Fall for the Quiz Trap!)", "deepReadText": "Whenever a river carves a valley across a hill, the contour lines bend into sharp 'V' shapes pointing into the hill. Always remember: the tip of the 'V' points UPSTREAM (toward higher elevation / the mountain source). Because gravity pulls water downhill, the river flows in the EXACT OPPOSITE direction of the V-point!", "quickCheck": {"question": "On a map, Pine River crosses contour lines whose 'V' shapes point North-West (NW). Which way is the water flowing?", "options": ["North-West (NW)", "South-East (SE)", "North-East (NE)"], "correctIdx": 1, "explanation": "The 'V' always points UPSTREAM (NW). Gravity pulls the river downhill in the exact opposite direction: South-East (SE)!"}, "videos": [{"id": "pvw5ZM1OKcY", "title": "What is a Contour (Topographic) Map?", "channel": "Mike Sammartano", "why": "Shows contour lines, index contours, steep vs. gentle slopes, and river V-shapes."}, {"id": "CoVcRxza8nI", "title": "How to Read a Topo Map (3D Terrain Demo)", "channel": "REI", "why": "Real-world 3D visual of how flat contour rings map to mountains and valleys."}]}, {"id": "geo-u1-l2", "title": "Lesson 1.2: Canada's Major Landform Regions (Including Ottawa!)", "readTime": "3 min read", "bigIdea": "Physical landforms shape where Canadians live, farm, mine, and build cities.", "paragraphs": ["Earth's surface is sculpted by internal forces (plate tectonics folding and lifting mountains) and external forces (glaciers, rivers, and wind eroding rock and depositing soil). In Canada, these forces created distinct landform regions.", "We live in the Great Lakes–St. Lawrence Lowlands (Ottawa/Nepean, Toronto, Montreal). Even though it is Canada's SMALLEST landform region, over 50% of Canadians live here! Why? During the last Ice Age, giant glaciers scraped fertile soil off northern Canada and dumped deep, flat layers of rich soil right here, next to warm waterways like the Ottawa and St. Lawrence Rivers.", "Right north of Ottawa sits the giant Canadian Shield—ancient, hard Precambrian rock covering half of Canada with thousands of lakes, thin rocky soil, and rich mineral deposits (nickel, gold, copper). Out west, the Western Cordillera (Rocky Mountains) features dramatic jagged peaks and tight contour lines, while the Interior Plains stretch flat and wide for wheat farming."], "keyTakeaway": "Flat, fertile lowlands with mild climates attract dense cities and farming; ancient rocky shields support mining, forestry, and hydroelectricity.", "deepReadTitle": "🏔️ Quick Landform Vocabulary for O. Macri's Quizzes", "deepReadText": "• Relief: The difference in height between the highest peak and lowest valley.\n• Plateau: A high-elevation landform with a flat top.\n• Valley: Low land carved between hills or mountains (V-shaped by rivers; U-shaped by glaciers).\n• Escarpment: A steep cliff separating two flat areas of different elevation (like the Niagara Escarpment).", "quickCheck": {"question": "Why does the small Great Lakes–St. Lawrence Lowlands have far more people and farms than the giant Canadian Shield?", "options": ["Because it has jagged rocky mountains and glaciers.", "Because it has flat terrain, deep fertile glacial soil, warmer climate, and major rivers.", "Because the Canadian Shield has no water or lakes."], "correctIdx": 1, "explanation": "Flat lowlands make building cities and roads easy, and deep glacial soils + warmer southern climate + navigable rivers support farming and trade!"}, "videos": [{"id": "Q_VFQUZ9oo4", "title": "Introducing the Regions of Canada! (Canadian Social Studies)", "channel": "Super Simple Sheets", "why": "Fast overview of Canada's major landform regions."}, {"id": "ynCxYFTWig4", "title": "The Great Lakes–St. Lawrence Lowlands (Ottawa/Ontario Region)", "channel": "Super Simple Sheets", "why": "Explains why over half of Canadians live right in our landform region!"}]}]}, {"id": "geo-u2", "title": "Unit 2: Natural Resources Around the World — Use, Extraction & Sustainability", "curriculumStrand": "Ontario Grade 7 Geography Strand B: Natural Resources Around the World: Use and Sustainability (B1, B2, B3)", "svgDiagram": "topo_map_svg", "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "The 3 Types of Natural Resources (Renewable, Non-Renewable, Flow)", "content": "Every natural resource on Earth falls into one of 3 categories—a guaranteed quiz question in O. Macri's class:", "keyPoints": ["🌲 1. Renewable Resources: Resources that can regenerate or replace themselves naturally within a human lifetime IF managed sustainably (e.g., forests/trees, fish stocks, fresh water cycles, soil, crops).", "🛢️ 2. Non-Renewable Resources: Resources formed over millions of years by geological processes that exist in finite amounts—once extracted and burned/used, they are gone (e.g., fossil fuels like crude oil, natural gas, coal; metallic minerals like nickel, gold, copper, lithium).", "☀️ 3. Flow Resources: Resources that are neither 'used up' nor need to reproduce—they must be captured when and where they occur in nature (e.g., solar energy/sunlight, wind energy, ocean tides, running river water)."]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "How a Renewable Resource Can Become Depleted (Unsustainable Extraction)", "content": "Wait—if trees and fish are 'renewable', how did the Atlantic Cod fishery off Newfoundland collapse in 1992?", "analogy": "🏦 Piggy Bank Interest vs. Principal Analogy: If a forest grows 1,000 new trees a year and you harvest 800 trees while replanting seedlings (Sustained Yield), the forest lasts forever! If you clear-cut 5,000 trees a year without replanting, you destroy the ecosystem faster than nature can regenerate.", "keyPoints": ["Sustainable Development: Meeting the resource needs of people today WITHOUT compromising the ability of future generations to meet their own needs.", "Indigenous Stewardship (Seven Generations Principle): Making decisions about land, water, and resources by considering the impact seven generations into the future."]}, {"level": 3, "name": "APPLY", "subtitle": "Classify Extraction Methods & Their Environmental Impacts", "content": "Apply geographic analysis to compare unsustainable vs. sustainable resource extraction in Canada:", "workedExample": {"prompt": "Compare Forestry Methods: Clear-Cutting vs. Selective Cutting", "steps": ["Method 1 (Clear-Cutting): Cutting down 100% of trees in a large tract. Cheapest and fastest for timber companies, but causes severe soil erosion into rivers, destroys wildlife habitats, and releases stored carbon.", "Method 2 (Shelterwood / Selective Cutting): Harvesting only mature or specific trees while leaving younger trees and canopy cover intact. Costs more initially, but prevents soil erosion on steep contour slopes and preserves biodiversity."]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Analyze the Ecological, Economic & Social Trade-Offs of Mining in Canada", "content": "Why is mining EV battery minerals (nickel, lithium, cobalt) in Northern Ontario's Canadian Shield ('Ring of Fire') a complex geographic issue?", "comparisonTable": {"headers": ["Perspective / Dimension", "Benefits & Opportunities", "Challenges & Environmental Risks", "Sustainable Mitigation"], "rows": [["Economic", "High-paying jobs, billions in GDP, minerals needed for electric vehicles & clean tech", "Boom-and-bust town cycles when ore runs out; expensive remote roads", "Value-added processing in Ontario; revenue-sharing agreements"], ["Environmental", "Supplies metals for solar panels, wind turbines, and EV batteries", "Open-pit scarring, toxic tailings ponds, disruption of carbon-rich peatlands (muskeg)", "Strict tailings recycling, underground mining, mandatory land reclamation"], ["Social & Indigenous Rights", "Potential partnerships and infrastructure (clean water, broadband, roads) for remote communities", "Threatens traditional hunting/fishing watersheds if done without consent", "Free, Prior, and Informed Consent (FPIC) & Indigenous-led environmental monitoring"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Audit Quiz Answers on Resource Classification", "content": "Avoid the #1 quiz confusion between Renewable and Flow resources:", "keyPoints": ["Quiz Trap: Is Wind or Sunlight a 'Renewable Resource' or a 'Flow Resource'? -> ✅ In the Ontario Grade 7 Geography Curriculum, sunlight, wind, and tides are specifically classified as FLOW resources because human actions cannot deplete or regenerate them; they flow continuously!", "Quiz Trap: Are diamonds or nickel renewable if we recycle metals? -> ✅ Metals are NON-RENEWABLE in the Earth's crust, even though recycling extends our supply above ground."]}, {"level": 6, "name": "CREATE", "subtitle": "Design a Sustainable Resource Management Charter for a Canadian Town", "content": "Synthesize topographical landforms (Strand A) and sustainable resource extraction (Strand B) into an integrated plan.", "keyPoints": ["Connects steep mountain/river topography to hydroelectricity, selective forestry, and watershed protection."]}], "questions": [{"id": "geo-u2-q1", "bloomLevel": 5, "bloomTag": "ANALYZE & EVALUATE", "title": "Natural Resources Quiz-Ready Lab: Classification & Sustainable Forestry/Mining", "prompt": "Prepare for O. Macri's Strand B Geography quiz by completing all 3 parts in deep multi-step work:\n(a) Classify each of these 6 resources as Renewable, Non-Renewable, or Flow, and state the reason for each: (1) Solar energy, (2) Canadian Shield Nickel ore, (3) British Columbia Douglas Fir forests, (4) Alberta Crude Oil, (5) Bay of Fundy Ocean Tides, (6) Atlantic Cod fish.\n(b) Explain how a Renewable resource (like forests or fish) can be ruined if humans extract it unsustainably.\n(c) Imagine a timber company wants to clear-cut a forest on the STEEP West slope of Eagle Peak right above Pine River (from Unit 1!). Using both Topographical Map concepts and Sustainability concepts, explain 2 severe environmental consequences that would happen when heavy spring rain hits that steep clear-cut slope, and recommend a sustainable alternative.", "step1_deconstruct": {"instruction": "STOP & PLAN: Verify that you address all 6 items in (a), the depletion mechanism in (b), and the Strand A + Strand B connection in (c).", "guidingQuestions": ["In Part (a), which items are living/regenerating (Renewable), geological/finite (Non-Renewable), or continuous natural forces (Flow)?", "In Part (c), what happens to soil on a STEEP slope (tightly packed contour lines) when tree roots are removed and rain falls above a river?"], "modelPlan": "(a) Classify all 6 into Renewable (3, 6), Non-Renewable (2, 4), and Flow (1, 5). (b) Explain harvesting faster than regeneration rate. (c) Connect steep slope gravity + no tree roots -> soil erosion/mudslides into Pine River + flooding, and recommend selective cutting + buffer zones."}, "step2_anchor": {"instruction": "ANCHOR DEFINITIONS: Renewable vs. Non-Renewable vs. Flow.", "referenceItems": ["Renewable = Regrows/reproduces naturally if managed (Forests, Fish).", "Non-Renewable = Finite geological deposit formed over millions of years (Nickel, Crude Oil).", "Flow = Continuous natural movement captured on site (Solar, Wind, Tides)."]}, "step3_substeps": [{"label": "Step 3a: Part (a) — Classify all 6 resources into Renewable, Non-Renewable, or Flow with a brief reason", "placeholder": "• Renewable: ...\n• Non-Renewable: ...\n• Flow: ...", "hint": "Group them cleanly into the 3 categories so you don't miss any of the 6 items!", "modelSubAnswer": "• Renewable Resources: (3) BC Douglas Fir forests and (6) Atlantic Cod fish — because living trees and fish can reproduce and replenish themselves within a human lifetime if harvested sustainably.\n• Non-Renewable Resources: (2) Canadian Shield Nickel ore and (4) Alberta Crude Oil — because minerals and fossil fuels take millions of years to form underground and exist in finite quantities.\n• Flow Resources: (1) Solar energy and (5) Bay of Fundy Ocean Tides — because sunlight and tidal currents flow continuously in nature regardless of human use and must be captured where they occur."}, {"label": "Step 3b: Part (b) — Explain how a Renewable resource becomes depleted", "placeholder": "A renewable resource like fish or forests can become depleted when the rate of human extraction is...", "hint": "Compare the speed of extraction/harvesting to the speed of natural reproduction/regeneration.", "modelSubAnswer": "A renewable resource becomes depleted when humans harvest it faster than its natural rate of regeneration (over-exploitation) or destroy its breeding habitat—such as overfishing Atlantic Cod with factory trawlers until the spawning population collapsed."}, {"label": "Step 3c: Part (c) — Analyze the impact of clear-cutting the steep West slope above Pine River + state a sustainable solution", "placeholder": "1. Impact 1 (Soil Erosion & Landslides): ...\n2. Impact 2 (Pine River Ecosystem): ...\n3. Sustainable Solution: ...", "hint": "Tree roots hold soil on steep contour slopes and absorb rainwater!", "modelSubAnswer": "1. Severe Soil Erosion & Mudslides: Because the West slope has tightly packed contour lines (very steep gradient), removing all tree roots leaves the topsoil loose. Heavy spring rain will wash the soil downhill in landslides.\n2. River Siltation & Flooding: Mud and sediment will wash directly into Pine River, choking fish spawning beds, clouding the water, and causing flash flooding downstream.\n3. Sustainable Alternative: Ban logging on the steepest cliff contours, leave an uncut 'riparian buffer zone' of trees along Pine River, and use Selective Cutting with immediate replanting on the gentler East slope."}], "step4_checks": ["Did I classify all 6 resources in Part (a) and distinguish Flow (Solar, Tides) from Renewable (Forests, Fish)?", "Did I explain extraction rate vs. regeneration rate in Part (b)?", "Did I connect steep contour lines to soil erosion, river damage, and selective cutting in Part (c)?"], "step5_modelAnswer": {"basicAnswer": "(a) Renewable: trees, fish. Non-renewable: nickel, oil. Flow: solar, tides. (b) Taking too much too fast. (c) Soil washes down the steep hill into the river; use selective cutting instead.", "expandedAnswer": "Complete Quiz-Ready Geography Solution:\n(a) Resource Classification:\n• Renewable: Douglas Fir forests (#3) and Atlantic Cod (#6) regenerate biologically over short cycles.\n• Non-Renewable: Nickel ore (#2) and Crude Oil (#4) are finite geological deposits that cannot replenish in human timeframes.\n• Flow: Solar energy (#1) and Ocean Tides (#5) are continuous natural energy flows.\n(b) Depletion of Renewables: If harvesting exceeds the ecosystem's reproductive capacity (sustained yield), populations crash and cannot recover.\n(c) Topographical & Environmental Analysis of Clear-Cutting a Steep Slope: Clear-cutting the steep West slope (closely spaced contour lines) removes the root networks that anchor soil and absorb runoff. Heavy rain would trigger (1) rapid soil erosion and landslides down the cliff, and (2) severe sedimentation and flash flooding in Pine River, destroying aquatic habitats. Instead, foresters should leave a protected buffer zone along the river and practice selective cutting only on the gentle East slope.", "extensionPrompt": "Indigenous Stewardship Connection: How does the Haudenosaunee and Anishinaabe 'Seven Generations Principle' guide decisions like protecting Pine River?"}}], "studyFirstTag": "Next: Renewable vs. Non-Renewable vs. Flow Resources (Quiz Prep)", "lessons": [{"id": "geo-u2-l1", "title": "Lesson 2.1: Renewable, Non-Renewable & Flow Resources", "readTime": "3 min read", "bigIdea": "Knowing the difference between Renewable, Non-Renewable, and Flow resources—and how humans manage them—is the heart of Geography Strand B.", "paragraphs": ["Everything humans use from nature—timber for houses, nickel for EV batteries, fish for food, sunlight for solar panels—is a natural resource. Geographers divide all natural resources into three exact groups.", "1) Renewable Resources (trees, fish, fresh water, soil) can regrow or reproduce naturally within a human lifetime—AS LONG AS humans don't harvest them faster than nature can replace them. 2) Non-Renewable Resources (crude oil, natural gas, coal, nickel, gold) took millions of years to form inside Earth's crust; once dug up and burned or used, Earth cannot make more in human time.", "3) Flow Resources (sunlight, wind, ocean tides, running river currents) are constantly moving natural forces. Humans cannot 'use up' the wind or sunlight, nor do they reproduce like living plants—we simply capture their energy where and when they flow."], "keyTakeaway": "Living/regrowing = Renewable | Finite geological rock/fuel = Non-Renewable | Continuous natural force (sun/wind/tides) = Flow.", "deepReadTitle": "🌲 Clear-Cutting vs. Selective Cutting & Seven Generations", "deepReadText": "If a forestry company clear-cuts every tree off a steep hillside, there are no roots left to hold the soil when heavy rain falls, causing mudslides and choking nearby rivers with silt. Sustainable forestry uses Selective Cutting (leaving young trees and river buffer zones intact) and follows principles like Indigenous Seven Generations Stewardship—making resource choices that protect people 7 generations from now.", "quickCheck": {"question": "In the Ontario Grade 7 Geography curriculum, how are Sunlight and Ocean Tides classified?", "options": ["Non-Renewable Resources", "Flow Resources", "Mineral Resources"], "correctIdx": 1, "explanation": "Sunlight, wind, and ocean tides are Flow Resources—they flow continuously and must be captured on-site!"}, "videos": [{"id": "HA8-zysCxE4", "title": "Natural Resources | Renewable & Nonrenewable Resources", "channel": "MAD GARDEN Science", "why": "Clear Grade 7 visual guide to natural resource classification and sustainability."}]}]}, {"id": "geo-u3", "title": "Unit 3 (Nelson Ch. 1): Plate Tectonics, Volcanoes, Weathering & Erosion", "studyFirstTag": "How forces inside and outside Earth build mountains and carve valleys", "curriculumStrand": "Ontario Grade 7 Geography Strand A — Nelson GEO 7 Chapter 1: Landform Patterns", "svgDiagram": "topo_map_svg", "lessons": [{"id": "geo-u3-l1", "title": "Lesson 3.1: Plate Tectonics — Convergent, Divergent & Transform Boundaries", "readTime": "3 min read", "bigIdea": "Earth's crust is broken into giant puzzle pieces (tectonic plates) floating on hot, slow-moving mantle rock—where they meet, mountains, earthquakes, and volcanoes are born!", "paragraphs": ["Why are the Rocky Mountains and Himalayas towering peaks while the Prairies are flat? Because Earth's outer shell (lithosphere) is cracked into about 15 major tectonic plates slowly pushed by convection currents deep in the mantle—moving a few centimetres per year (about as fast as your fingernails grow!).", "At CONVERGENT boundaries (plates colliding together →←), two continental plates crumple upward into giant fold mountains (like the Himalayas), OR a heavy oceanic plate dives underneath a continental plate (subduction), creating deep ocean trenches, explosive volcanoes, and mountain chains (like the Pacific Ring of Fire along British Columbia!).", "At DIVERGENT boundaries (plates pulling apart ←→), hot magma rises to form new ocean floor and mid-ocean ridges (like the Mid-Atlantic Ridge in Iceland). At TRANSFORM boundaries (plates grinding sideways past each other ↑↓), stuck rock builds up massive stress until it snaps in powerful earthquakes (like California's San Andreas Fault)!"], "keyTakeaway": "Convergent (→←) builds mountains & volcanoes | Divergent (←→) creates rift valleys & new crust | Transform (↑↓) triggers powerful earthquakes!", "deepReadTitle": "🌋 Why Does Canada Have Earthquakes in British Columbia?", "deepReadText": "Off the west coast of Vancouver Island, the oceanic Juan de Fuca Plate is subducting beneath the North American Plate (a Convergent boundary along the Pacific Ring of Fire). That's why B.C. has active mountain building and earthquake drills!", "videos": [{"id": "mlaq8GM4c_M", "title": "Plate Tectonics | Convergent, Divergent & Transform Boundaries", "channel": "MAD GARDEN Science", "why": "Clear visual animations of all 3 plate boundary types and how they create landforms."}], "quickCheck": {"question": "Which type of plate boundary occurs when two tectonic plates collide head-on, pushing up tall fold mountains or causing subduction volcanoes?", "options": ["Divergent boundary (pulling apart)", "Convergent boundary (colliding together)", "Transform boundary (sliding sideways)"], "correctIdx": 1, "explanation": "Convergent means coming together (→←)—collisions fold Earth's crust into mountains or push oceanic crust down into magma!"}}, {"id": "geo-u3-l2", "title": "Lesson 3.2: Weathering, Erosion & Deposition (The 3 Outside Sculptors)", "readTime": "3 min read", "bigIdea": "While plate tectonics builds landforms UP from inside Earth, Weathering, Erosion, and Deposition wear them DOWN and reshape them on the outside!", "paragraphs": ["Even the tallest jagged mountain eventually wears down into smooth hills—just like the ancient Canadian Shield! Three connected external forces sculpt every landform on Earth: Weathering, Erosion, and Deposition.", "1) WEATHERING = BREAKING IT: Water seeps into tiny rock cracks, freezes in Ottawa's −25°C winter, expands, and splits the rock apart (freeze-thaw weathering), while plant roots and weak acid rain break rocks into smaller sediment pieces—WITHOUT moving them yet.", "2) EROSION = MOVING IT: Flowing rivers, ocean waves, wind, and giant Ice Age glaciers pick up those broken rock pieces and carry them away. 3) DEPOSITION = DROPPING IT: When moving water, wind, or melting glaciers slow down, they drop their sediment to build brand-new landforms like fertile river deltas, sandy beaches, and sand dunes!"], "keyTakeaway": "Weathering = Breaks rock | Erosion = Moves sediment | Deposition = Drops sediment to build deltas, beaches & plains!", "deepReadTitle": "🧊 Glaciers: The Bulldozers That Shaped Ontario!", "deepReadText": "15,000 years ago, a 2-kilometre-thick ice sheet covered Ontario! As it moved south, glacial erosion scraped soil off the Canadian Shield and carved the Great Lakes basins. When it melted, glacial deposition left behind the fertile flat soils of Ottawa and Southern Ontario!", "videos": [{"id": "QJUs4e2X5Uo", "title": "Weathering and Erosion — What Is the Difference?", "channel": "Learn Bright", "why": "Memorable examples distinguishing breaking (weathering), moving (erosion), and dropping (deposition)."}], "quickCheck": {"question": "When a fast river slows down as it enters a calm lake and drops mud and sand to form a triangular fan-shaped delta, which process is happening?", "options": ["Weathering", "Erosion", "Deposition"], "correctIdx": 2, "explanation": "Deposition is 'dropping it'—when water slows down, it deposits sediment to build deltas and floodplains!"}}], "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Internal vs. External Landform Forces", "content": "Memorize the 3 plate boundaries and the W-E-D trio:", "keyPoints": ["Internal Forces (Build Up): Convergent (→←), Divergent (←→), Transform (↑↓)", "External Forces (Wear Down/Reshape): Weathering (Breaks), Erosion (Moves), Deposition (Drops)"]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Why Old Mountains (Appalachians) Are Round While Young Mountains (Rockies) Are Jagged", "content": "Time + Weathering/Erosion acts like sandpaper on rock.", "analogy": "🧱 Sidewalk Chalk Analogy: Brand-new chalk has sharp, jagged edges (like the young Rockies). After weeks of drawing and rain wearing it down, it becomes short and rounded (like the ancient Appalachians and Canadian Shield)!", "keyPoints": ["Sharp contours = young tectonic uplift; smooth rolling hills = millions of years of erosion."]}, {"level": 3, "name": "APPLY", "subtitle": "Trace a Rock's Journey from Mountain Peak to River Delta", "content": "Watch W → E → D work in sequence:", "workedExample": {"prompt": "How does granite from a high mountain peak end up as fertile soil in a lowland delta?", "steps": ["Step 1 (Weathering): Freeze-thaw ice splits granite boulders off the cliff into gravel and sand.", "Step 2 (Erosion): Rushing mountain streams carry the rock fragments downstream, grinding them finer.", "Step 3 (Deposition): When the river reaches flat plains and slows down near the ocean, it deposits rich silt to build a fertile delta."]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare the 3 Tectonic Plate Boundaries", "content": "Quiz-ready comparison chart:", "comparisonTable": {"headers": ["Boundary Type", "Plate Motion", "Landforms Created", "Real Example"], "rows": [["Convergent", "Collide (→←)", "Fold mountains, ocean trenches, volcanoes", "Himalayas, Andes, B.C. Ring of Fire"], ["Divergent", "Pull apart (←→)", "Mid-ocean ridges, rift valleys, new crust", "Mid-Atlantic Ridge (Iceland), East African Rift"], ["Transform", "Slide past (↑↓)", "Fault lines, shallow severe earthquakes", "San Andreas Fault (California)"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Audit Confusion Between Weathering and Erosion", "content": "Fix the #1 Geography quiz mistake:", "keyPoints": ["❌ Student Answer: 'Water freezing in a rock crack and breaking it is erosion.'", "✅ Correction: Freezing water only BREAKS the rock in place—that is WEATHERING! It only becomes EROSION once gravity, wind, or running water MOVES the pieces away."]}, {"level": 6, "name": "CREATE", "subtitle": "Predict How Ottawa's Landscape Would Change Over 10 Million Years", "content": "Synthesize weathering, river erosion, and human urban engineering.", "keyPoints": ["Connects Nelson GEO 7 Chapter 1 to local Ontario geography!"]}], "questions": [{"id": "geo-u3-q1", "bloomLevel": 4, "bloomTag": "ANALYZE & APPLY", "title": "Nelson Ch. 1 Lab: Tectonic Forces vs. Weathering, Erosion & Deposition", "prompt": "Answer all 3 parts of this Nelson GEO 7 Chapter 1 challenge in complete multi-step work:\n(a) Compare a Convergent boundary with a Transform boundary: describe how the plates move at each, and state the main landform or hazard created at each.\n(b) Explain why British Columbia's Coast Mountains are tall and jagged while the Canadian Shield is low, rounded bedrock, using both internal (tectonic) and external (erosion/glaciers) forces.\n(c) Put Weathering, Erosion, and Deposition in the exact order they occur when winter freeze-thaw cycles and the Ottawa River create a sandy shoreline downstream, explaining what happens at each step.", "step1_deconstruct": {"instruction": "Count all 3 parts (a, b, c) and check that every part includes scientific geography terms.", "guidingQuestions": ["In (a), how do Convergent (→←) and Transform (↑↓) plates differ?", "In (b), which landform is older and has been eroded by glaciers for billions of years?", "In (c), what is the exact W -> E -> D sequence?"], "modelPlan": "(a) Contrast Convergent collision (mountains/volcanoes) vs. Transform sliding (faults/earthquakes). (b) Rockies/Coast Mtns = young convergent uplift; Canadian Shield = ancient rock eroded flat by glaciers and weathering. (c) 1. Freeze-thaw Weathering breaks rock -> 2. River Erosion transports sand -> 3. River Deposition drops sand where water slows."}, "step2_anchor": {"instruction": "Chapter 1 Key Terms:", "referenceItems": ["Convergent = colliding (→←) | Transform = grinding sideways (↑↓)", "Weathering = Breaking | Erosion = Moving | Deposition = Dropping"]}, "step3_substeps": [{"label": "Step 3a: Part (a) — Compare Convergent vs. Transform plate boundaries (motion + landforms/hazards)", "placeholder": "At a Convergent boundary, plates... creating... In contrast, at a Transform boundary, plates...", "hint": "Mention fold mountains/subduction volcanoes for Convergent, and fault lines/earthquakes for Transform!", "modelSubAnswer": "At a Convergent boundary, two tectonic plates collide head-on (→←), folding Earth's crust upward into tall mountain ranges or forcing oceanic crust downward (subduction) to trigger volcanoes and deep trenches. At a Transform boundary, plates slide horizontally past each other (↑↓); friction locks the rocks until they snap, creating fault lines and severe earthquakes without building giant volcanic mountain chains."}, {"label": "Step 3b: Part (b) — Contrast B.C.'s jagged Coast Mountains vs. the low, rounded Canadian Shield", "placeholder": "B.C.'s mountains are tall and jagged because... Meanwhile, the Canadian Shield is low and smooth because...", "hint": "Connect recent convergent tectonic uplift in B.C. vs. billions of years of weathering and Ice Age glacial erosion on the Shield!", "modelSubAnswer": "British Columbia's Coast Mountains are relatively young and sit near an active convergent plate boundary, so internal tectonic uplift continues pushing sharp, jagged peaks skyward faster than erosion can wear them flat. In contrast, the Canadian Shield is billions of years old and far from active plate edges—external forces like weathering, rivers, and giant Ice Age glaciers have scraped it down into low, smooth bedrock hills."}, {"label": "Step 3c: Part (c) — Trace Weathering → Erosion → Deposition along the Ottawa River", "placeholder": "1. Weathering: ...\n2. Erosion: ...\n3. Deposition: ...", "hint": "Freeze-thaw breaks cliff rock -> flowing river moves pieces -> calm bay drops sand!", "modelSubAnswer": "1. Weathering (Breaking): Water enters cracks in cliff rock along the upper Ottawa River, freezes in winter, expands, and breaks rock into sand and gravel.\n2. Erosion (Moving): Fast-flowing spring meltwater picks up those rock fragments and carries them downstream.\n3. Deposition (Dropping): Where the river widens and slows down in a calm bay, the water loses energy and drops the sand to build a beach shoreline."}], "step4_checks": ["Did I finish all 3 parts (a, b, and c) completely?", "Did I clearly separate Weathering (breaking in place) from Erosion (moving) and Deposition (dropping)?", "Did I mention both internal tectonic uplift AND external glacial/weathering erosion in Part (b)?"], "step5_modelAnswer": {"basicAnswer": "(a) Convergent crashes and makes mountains; transform slides and makes earthquakes. (b) Shield is older and worn down. (c) Breaks, moves, drops.", "expandedAnswer": "Complete Nelson GEO 7 Ch. 1 Exemplar:\n(a) Plate Boundaries: Convergent boundaries occur where plates collide (→←), creating fold mountains, ocean trenches, and subduction volcanoes (e.g., B.C. Ring of Fire). Transform boundaries occur where plates grind horizontally past one another (↑↓), creating fault lines and major earthquakes (e.g., San Andreas Fault).\n(b) B.C. Mountains vs. Canadian Shield: B.C.'s mountains are geologically young and actively uplifted by internal convergent plate tectonics, keeping their peaks jagged. The Canadian Shield consists of ancient Precambrian rock that has been worn down for billions of years by external weathering and Ice Age glaciers scraping it smooth.\n(c) W-E-D Sequence: First, freeze-thaw Weathering breaks shoreline rock into fragments in place. Next, flowing water in the Ottawa River causes Erosion by transporting the sediment downstream. Finally, where the current slows in a calm curve or bay, Deposition drops the sand to build a new shoreline.", "extensionPrompt": "Quiz Review: Name the 3rd type of plate boundary (←→) and one country sitting right on top of it!"}}]}, {"id": "geo-u4", "title": "Unit 4 (Nelson Ch. 2–3): L.O.W.E.R.N. Climate Factors, Climate Graphs & World Biomes", "studyFirstTag": "Read climate graphs, master L.O.W.E.R.N., and connect climate to world vegetation", "curriculumStrand": "Ontario Grade 7 Geography Strand A — Nelson GEO 7 Chapters 2 & 3", "svgDiagram": "geo_climate_svg", "lessons": [{"id": "geo-u4-l1", "title": "Lesson 4.1: L.O.W.E.R.N. Climate Factors & Reading Climate Graphs", "readTime": "3 min read", "bigIdea": "Weather is what you wear today; Climate is the 30-year pattern—and 6 factors (L.O.W.E.R.N.) plus a Climate Graph explain why Ottawa freezes while Vancouver stays rainy and mild!", "paragraphs": ["Why does Vancouver, B.C. stay around +4°C in January while Ottawa drops to −10°C even though Vancouver is actually slightly FURTHER NORTH?! Geographers explain every climate on Earth using the 6-letter code L.O.W.E.R.N.: Latitude (distance from Equator), Ocean Currents (warm Pacific vs. cold Labrador currents), Winds & Air Masses, Elevation (higher = colder), Relief (moist air climbing mountains dumps rain on the windward side and leaves a dry 'rain shadow' on the leeward side), and Near Water!", "Nearness to Water splits Canada into two big climate types: MARITIME climates (right next to oceans, like Vancouver or Halifax) have mild winters, cool summers, a SMALL Temperature Range (< 25°C), and high precipitation (> 1,000 mm/year). CONTINENTAL climates (far inland from oceans, like Ottawa, Winnipeg, or Calgary) have hot summers, freezing winters, and a LARGE Temperature Range (> 25°C)!", "On O. Macri's quizzes, you will read a CLIMATE GRAPH (see the Visual Diagram!): Blue BARS show monthly Precipitation in millimetres (mm, left scale), and the red LINE shows average monthly Temperature in degrees Celsius (°C, right scale). To find the Temperature Range, subtract the coldest month from the hottest month (careful with negatives! In Ottawa: 21°C − (−10°C) = 21 + 10 = 31°C!)."], "keyTakeaway": "Climate Graph: Blue Bars = Precipitation (mm) | Red Line = Temperature (°C) | Temp Range > 25°C = Continental; < 25°C = Maritime!", "deepReadTitle": "🧮 Math Connection: Subtracting Negative Temperatures!", "deepReadText": "Just like D. Forbes's integer rule `a − (−b) = a + b`:\n• Ottawa: July = +21°C, January = −10°C → Range = 21 − (−10) = 21 + 10 = 31°C (Continental!).\n• Vancouver: July = +18°C, January = +4°C → Range = 18 − 4 = 14°C (Maritime!).", "videos": [{"id": "Op9yhM0E3dM", "title": "Understanding Climate and L.O.W.E.R. Near Water", "channel": "Mr. Eddy", "why": "Walks through all 6 L.O.W.E.R.N. factors using Canadian geography examples."}, {"id": "I_X08A8dlkM", "title": "How to Read a Climate Graph: Weather vs. Climate", "channel": "letsBug Geography", "why": "Shows step-by-step how to read temperature lines, precipitation bars, and calculate range."}], "quickCheck": {"question": "A city has a July high of +20°C and a January low of −12°C. What is its Temperature Range, and is it Maritime or Continental?", "options": ["8°C — Maritime climate", "32°C — Continental climate", "−32°C — Polar climate"], "correctIdx": 1, "explanation": "20 − (−12) = 20 + 12 = 32°C! Because 32°C is greater than 25°C, this huge seasonal swing marks a Continental climate!"}}, {"id": "geo-u4-l2", "title": "Lesson 4.2: World Biomes & Natural Vegetation Patterns (Nelson Ch. 3)", "readTime": "3 min read", "bigIdea": "Tell a geographer a region's temperature and rainfall, and they can immediately predict what plants and biome grow there!", "paragraphs": ["Natural vegetation means plants that grow on their own without human planting—and they depend directly on temperature, precipitation, and soil. Large global ecosystems with matching climate, plants, and wildlife are called BIOMES.", "Traveling north from the Equator to Canada's Arctic shows how Latitude controls biomes: near the hot, wet Equator grow Tropical Rainforests (tall broadleaf canopies, huge biodiversity); in dry bands with < 250 mm of rain grow Deserts (cacti with deep roots and waxy skin to save water); in moderate-rain continental interiors grow Grasslands/Prairies (deep-rooted grasses ideal for farming wheat).", "Across Canada, southern Ontario (Ottawa/Nepean!) sits in the Mixed Deciduous & Coniferous Forest (maples and oaks that drop leaves in autumn + pines). Moving north into the cold Canadian Shield takes you into the giant Boreal Forest (Taiga)—hardy evergreen spruce and pine needles that shed heavy snow—and finally north of the Tree Line into the frozen Arctic Tundra (permafrost soil, short mosses and lichens, zero trees!)."], "keyTakeaway": "Climate controls vegetation! Hot + Wet = Tropical Rainforest | Dry = Desert | Moderate + Inland = Grasslands | Cold North = Boreal Forest → Frozen Tundra (above Tree Line).", "deepReadTitle": "🌲 How Coniferous (Evergreen) Trees Survive Ottawa & Boreal Winters", "deepReadText": "• Cone shape sheds heavy winter snow so branches don't snap.\n• Waxy needles prevent moisture loss in freezing dry air.\n• Keeping needles green all year lets them start photosynthesis the very first warm spring day!", "videos": [{"id": "gT5pGA2H-x8", "title": "Biomes and Ecosystems for Kids — Major World Vegetation Regions", "channel": "Learn Bright", "why": "Visual tour of Rainforest, Desert, Grassland, Deciduous Forest, Boreal/Taiga, and Tundra biomes."}], "quickCheck": {"question": "Why are there no tall trees growing in Canada's northern Arctic Tundra biome?", "options": ["Because there is too much hot tropical rainfall.", "Because permafrost (permanently frozen ground) and freezing short summers prevent deep tree roots from growing.", "Because loggers cut down all the trees in the Arctic."], "correctIdx": 1, "explanation": "Above the Tree Line, permanently frozen subsoil (permafrost) and very short cold summers only allow low-growing mosses, grasses, and lichens!"}}], "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "L.O.W.E.R.N. & The 6 Major Biomes", "content": "Quiz flashcard memory anchors:", "keyPoints": ["L.O.W.E.R.N.: Latitude, Ocean Currents, Winds/Air Masses, Elevation, Relief, Near Water", "Maritime (< 25°C range, > 1,000 mm precip) vs. Continental (> 25°C range, lower precip)", "Biomes: Tropical Rainforest, Desert, Grassland, Deciduous/Mixed Forest, Boreal (Taiga), Tundra"]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "How Mountains Create a Wet Side and a Dry 'Rain Shadow'", "content": "Relief (the 'R' in L.O.W.E.R.N.) explains why Vancouver is soaked while Kelowna/Calgary behind the Rockies are dry!", "analogy": "🧽 Wet Sponge Analogy: Moist ocean air hits the Coast Mountains and gets forced up. Cold high air squeezes the sponge, dumping rain on Vancouver (windward side). By the time the air crosses the peak and sinks down the far side (leeward side), the sponge is dry—creating a Rain Shadow!", "keyPoints": ["Windward slope = Wet | Leeward slope = Dry Rain Shadow."]}, {"level": 3, "name": "APPLY", "subtitle": "Classify Two Canadian Cities from Climate Graph Data", "content": "Apply the Maritime vs. Continental test:", "workedExample": {"prompt": "City A (Vancouver): Min +4°C, Max +18°C, Total Precip 1,190 mm. City B (Ottawa): Min −10°C, Max +21°C, Total Precip 940 mm.", "steps": ["Step 1 (City A Range): 18 − 4 = 14°C (< 25°C) and Precip > 1,000 mm → MARITIME climate (moderated by warm Pacific Ocean).", "Step 2 (City B Range): 21 − (−10) = 31°C (> 25°C) and Precip < 1,000 mm → CONTINENTAL climate (far inland from oceans)."]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Major World Biomes by Climate & Plant Adaptations", "content": "Study how climate dictates vegetation:", "comparisonTable": {"headers": ["Biome", "Climate Pattern", "Vegetation & Adaptation"], "rows": [["Tropical Rainforest", "Hot all year (+26°C), > 2,000 mm rain", "Tall layered broadleaf trees, drip-tip leaves"], ["Desert", "Hot or cold, < 250 mm precip/yr", "Cacti, waxy skin, deep/wide shallow roots"], ["Boreal Forest (Taiga)", "Long freezing winters, short summers", "Coniferous spruce/pine, waxy needles, cone shape"], ["Arctic Tundra", "Freezing most of year, permafrost", "No trees! Lichens, mosses, tiny arctic shrubs"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Catch Integer Sign Errors When Calculating Temperature Range", "content": "Don't let a math careless error cost you Geography marks!", "keyPoints": ["❌ Trap: Finding the range between +21°C and −10°C as 21 − 10 = 11°C! (Forgot the negative sign!)", "✅ Fix: Count the distance from −10°C up to 0°C (10 degrees) PLUS from 0°C up to +21°C (21 degrees) = 31°C!"]}, {"level": 6, "name": "CREATE", "subtitle": "Explain How Global Climate Change Shifts Canada's Biomes Northward", "content": "Predict what happens to permafrost, the Boreal Tree Line, and winter snowpack as average temperatures rise.", "keyPoints": ["Thawing permafrost damages northern roads and releases trapped methane gas!"]}], "questions": [{"id": "geo-u4-q1", "bloomLevel": 4, "bloomTag": "APPLY & ANALYZE", "title": "Nelson Ch. 2–3 Lab: Ottawa vs. Vancouver Climate Graph & Biome Analysis", "prompt": "Use the Ottawa Climate Graph diagram and L.O.W.E.R.N. to complete all 3 parts:\n• Ottawa, ON: Coldest month (Jan) = −10°C | Warmest month (Jul) = +21°C | Annual Precipitation = 940 mm\n• Vancouver, BC: Coldest month (Jan) = +4°C | Warmest month (Jul) = +18°C | Annual Precipitation = 1,190 mm\n\n(a) Calculate the exact Temperature Range for BOTH Ottawa and Vancouver (show your integer math with units °C!) and classify each city as Maritime or Continental.\n(b) Using at least TWO letters of L.O.W.E.R.N., explain WHY Vancouver's winter (+4°C) is 14 degrees warmer than Ottawa's (−10°C) even though Vancouver is farther north!\n(c) Moving north from Ottawa into northern Ontario's Boreal Forest and then into Nunavut's Tundra, describe how the natural vegetation changes and explain ONE adaptation coniferous trees use to survive freezing winters.", "step1_deconstruct": {"instruction": "Check all 3 parts (a, b, c) and watch the negative integer in Ottawa's range!", "guidingQuestions": ["What is 21 − (−10) for Ottawa's Temperature Range?", "Which L.O.W.E.R.N. factors explain Vancouver's warm wet winter (Ocean Currents + Near Water + Relief)?", "Why do trees disappear in the Arctic Tundra?"], "modelPlan": "(a) Ottawa = 31°C (Continental), Vancouver = 14°C (Maritime). (b) Use Near Water (Pacific Ocean moderates temperature) + Warm North Pacific Ocean Current. (c) Mixed Forest -> Coniferous Boreal Forest (waxy needles/cone shape) -> Treeless Tundra (permafrost)."}, "step2_anchor": {"instruction": "Climate Graph & L.O.W.E.R.N. Rules:", "referenceItems": ["Temperature Range = Highest Temp − Lowest Temp (watch a − (−b) = a + b!)", "Maritime: Range < 25°C & Precip > 1,000 mm | Continental: Range > 25°C", "Vancouver sits next to the Warm North Pacific Ocean Current!"]}, "step3_substeps": [{"label": "Step 3a: Part (a) — Calculate Temperature Range for Ottawa AND Vancouver and classify each as Maritime or Continental", "placeholder": "Ottawa Range = 21°C − (−10°C) = ...°C → ...\nVancouver Range = 18°C − 4°C = ...°C → ...", "hint": "21 − (−10) = 21 + 10 = 31°C (>25°C = Continental). 18 − 4 = 14°C (<25°C and 1,190 mm > 1,000 mm = Maritime).", "modelSubAnswer": "• Ottawa, ON: Temperature Range = 21°C − (−10°C) = 21 + 10 = 31°C. Since the range is over 25°C and precipitation (940 mm) is under 1,000 mm, Ottawa has a CONTINENTAL climate.\n• Vancouver, BC: Temperature Range = 18°C − 4°C = 14°C. Since the range is under 25°C and precipitation (1,190 mm) is over 1,000 mm, Vancouver has a MARITIME climate."}, {"label": "Step 3b: Part (b) — Use 2 L.O.W.E.R.N. factors to explain why Vancouver's winter is much warmer than Ottawa's", "placeholder": "1. Near Water (N): ...\n2. Ocean Currents (O): ...", "hint": "Water cools down much slower than land, and the North Pacific Current brings warm water past B.C.!", "modelSubAnswer": "1. Near Water (N): Large oceans heat up and cool down far slower than inland landmasses. The Pacific Ocean acts like a giant thermal blanket keeping Vancouver mild in winter, whereas Ottawa sits deep inland where land freezes rapidly.\n2. Ocean Currents (O): The warm North Pacific Current flows right along B.C.'s coast, warming the onshore westerly winds that blow into Vancouver (plus Relief from the Coast Mountains squeezes out heavy rain!)."}, {"label": "Step 3c: Part (c) — Describe the vegetation shift northward (Ottawa → Boreal → Tundra) + 1 Coniferous adaptation", "placeholder": "Traveling north from Ottawa, vegetation shifts from... One coniferous adaptation is...", "hint": "Mention Mixed Forest -> Boreal Coniferous Forest -> Treeless Tundra (permafrost), plus waxy needles or cone shape!", "modelSubAnswer": "Traveling north as Latitude increases and temperatures drop, vegetation transitions from Ottawa's Mixed Forest (maples, oaks, pines) into the vast Boreal Forest (hardy evergreen spruce and fir), and finally past the Tree Line into the treeless Arctic Tundra where permafrost only supports mosses and lichens. Coniferous trees survive winter using a conical shape that sheds heavy snow without breaking branches and waxy needles that prevent moisture loss."}], "step4_checks": ["Did I catch the negative sign in Ottawa's math: 21°C − (−10°C) = 31°C (and include °C units)?", "Did I explain TWO specific L.O.W.E.R.N. factors in Part (b)?", "Did I describe the biome shift AND give a specific coniferous tree adaptation in Part (c)?"], "step5_modelAnswer": {"basicAnswer": "(a) Ottawa 31°C Continental, Vancouver 14°C Maritime. (b) Ocean water and warm currents keep Vancouver warm. (c) Trees get smaller and stop in the tundra; pine needles hold water.", "expandedAnswer": "Complete Grade 7+ Climate & Biome Analysis:\n(a) Climate Graph Math & Classification: Ottawa's Temperature Range is 21°C − (−10°C) = 31°C (>25°C, 940 mm precip) → Continental climate. Vancouver's Temperature Range is 18°C − 4°C = 14°C (<25°C, 1,190 mm precip) → Maritime climate.\n(b) L.O.W.E.R.N. Explanation: First, Near Water (N)—the Pacific Ocean retains warmth through winter while inland Ottawa loses heat rapidly. Second, Ocean Currents (O)—the warm North Pacific Current heats onshore westerly winds blowing across Vancouver.\n(c) Northward Biome Shift & Adaptation: Moving north, Mixed Forests transition into the coniferous Boreal Forest (Taiga) and then into the treeless Arctic Tundra where permanently frozen permafrost blocks tree roots. Boreal evergreens survive freezing winters through snow-shedding conical shapes and waxy, moisture-saving needles.", "extensionPrompt": "Bonus L.O.W.E.R.N. Check: Why is Kelowna (just east of B.C.'s Coast Mountains) dry and semi-desert-like compared to rainy Vancouver?"}}]}, {"id": "geo-u5", "title": "Unit 5 (Nelson Ch. 4–8): Watersheds, Rivers, Flow Energy & Mining Reclamation", "studyFirstTag": "How drainage basins work & how Canada balances energy, mining, and sustainability", "curriculumStrand": "Ontario Grade 7 Geography Strands A (Ch. 4) & B (Ch. 5–8 Sustainability)", "svgDiagram": "topo_map_svg", "lessons": [{"id": "geo-u5-l1", "title": "Lesson 5.1: Watersheds, River Meanders & Deltas (Nelson Ch. 4)", "readTime": "3 min read", "bigIdea": "Every drop of rain that falls on our school roof in Nepean belongs to a giant connected funnel called a Watershed—eventually flowing to the Ottawa River, St. Lawrence River, and Atlantic Ocean!", "paragraphs": ["A WATERSHED (or Drainage Basin) is the entire area of land where all rain and melting snow drains downhill into one main river system. High ridges of land separating two neighbouring watersheds are called DIVIDES—like the Continental Divide along the Rocky Mountains that sends west-side water to the Pacific Ocean and east-side water to Hudson Bay or the Arctic!", "As a river travels from steep mountains (Upper Course) down to flat plains (Lower Course), its shape changes completely! High in steep terrain, fast water cuts straight, deep V-shaped valleys. Down on flat lowlands, the slower river bends into giant S-shaped loops called MEANDERS—eroding the outer bank where water flows faster and depositing sand on the slower inner bank.", "Because every tiny stream (tributary) feeds into the main river, pollution dumped upstream—like winter road salt, farm fertilizer, or plastics—travels through the entire watershed all the way to the river mouth (delta) and ocean! Protecting upstream wetlands acts like a natural sponge that filters dirty water and stops downstream flooding."], "keyTakeaway": "Watershed = land area draining to one river | Divide = high ridge separating watersheds | Meander = S-shaped bend on flat land | Upstream pollution affects everyone downstream!", "deepReadTitle": "🌊 Canada's 5 Major Ocean Drainage Basins", "deepReadText": "Canada's water drains into 5 giant basins: (1) Atlantic Ocean (including Ottawa & Great Lakes–St. Lawrence!), (2) Hudson Bay (largest in Canada!), (3) Arctic Ocean (Mackenzie River), (4) Pacific Ocean (Fraser River), and (5) tiny corner into the Gulf of Mexico.", "videos": [{"id": "Y3VPNcf1ARo", "title": "All About Watersheds — Geography Activity", "channel": "The Digital Classroom Experience", "why": "Directly aligned with Ontario Grade 7 Geography (divides, tributaries, drainage basins)."}, {"id": "CDEj62HGNkk", "title": "How Rivers Shape the Landscape: Crash Course Geography #23", "channel": "CrashCourse", "why": "Engaging visual breakdown of upper-course valleys, meanders, oxbow lakes, and deltas."}], "quickCheck": {"question": "If an industrial factory accidentally spills chemicals into a small tributary stream in the upper part of a watershed, who is affected?", "options": ["Only the tiny stream right next to the factory.", "Every town, farm, fish habitat, and river system downstream in the entire watershed.", "Nobody, because watersheds isolate streams from each other."], "correctIdx": 1, "explanation": "All tributaries in a watershed connect downhill into the main river and ocean—what happens upstream impacts every community downstream!"}}, {"id": "geo-u5-l2", "title": "Lesson 5.2: Flow Energy (Hydro/Wind/Solar) & Mining Reclamation (Nelson Ch. 5–8)", "readTime": "3 min read", "bigIdea": "Every energy source and mine has geographical pros and cons—true sustainability means choosing smart locations AND restoring land through Reclamation!", "paragraphs": ["Canada produces over 60% of its electricity from HYDROELECTRICITY—a Flow Resource that uses rushing river water to spin turbines with zero smokestack carbon emissions! Alongside Solar panels (best in sunny plains like Alberta/Saskatchewan), Wind turbines (great on breezy prairies and Great Lakes shores), and Tidal power (ideal in Nova Scotia's Bay of Fundy, which has the world's highest tides!), flow energy is transforming Canada's grid.", "Yet even clean Flow Resources have geographic trade-offs! Building a giant hydroelectric dam floods huge river valleys, disrupts fish migration, and can displace Indigenous communities upstream—while wind and solar depend on weather and need battery storage (which requires mining lithium and nickel!).", "For Non-Renewable Resources like Canadian Shield minerals (gold, copper, nickel), modern sustainability requires two commitments: (1) Circular Economy (Reduce, Reuse, Recycle metals from old electronics to shrink our Ecological Footprint), and (2) LAND RECLAMATION—when a mine closes, companies must clean up toxic tailings, reshape pits, replace topsoil, and replant native trees so wildlife returns (just like Sudbury, Ontario's famous regreening project!)."], "keyTakeaway": "Match Flow Energy to local geography (Hydro = big rivers, Tidal = Bay of Fundy, Solar/Wind = sunny/windy plains) AND require Land Reclamation after mining!", "deepReadTitle": "🌱 Success Story: The Sudbury Regreening Reclamation Project (Ontario!)", "deepReadText": "Decades ago, nickel smelting left hills around Sudbury, Ontario barren and black (Apollo astronauts even trained there!). Starting in 1978, citizens, scientists, and mining companies spread crushed limestone to neutralize acidic soil and planted over 10 MILLION native trees—turning Sudbury back into a green forest!", "videos": [{"id": "5agrNMvugvI", "title": "Power From Water: Hydropower, Tidal Power & Wave Energy", "channel": "Miacademy Learning Channel", "why": "Explains how flow water energy works in different coastal and river geographies."}, {"id": "GqHBXzu0DYc", "title": "Renewable Energy Technology: Solar, Wind, Water & Earth Power", "channel": "Doodle Beez", "why": "Compares geographical pros and trade-offs of clean flow energy sources."}, {"id": "3XnnKizjzhc", "title": "Power From Water Part 2: Sustainability, Trade-Offs & Remediation", "channel": "Miacademy Learning Channel", "why": "Shows how engineers weigh ecosystem impacts and restore damaged environments."}], "quickCheck": {"question": "What is 'Land Reclamation' after a non-renewable mining operation finishes?", "options": ["Abandoning the open pit and moving immediately to a new forest.", "Cleaning up tailings, reshaping the ground, adding topsoil, and replanting native vegetation so the ecosystem recovers.", "Filling the mine with plastic waste from nearby cities."], "correctIdx": 1, "explanation": "Reclamation restores disturbed mining land back into healthy, usable ecosystems—like Ontario's famous Sudbury Regreening project!"}}], "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Watershed & Sustainability Core Terms", "content": "Key Nelson Chapters 4–8 quiz vocabulary:", "keyPoints": ["Watershed (Drainage Basin), Tributary, Divide, Meander, Delta", "Ecological Footprint: The area of Earth needed to supply our resources and absorb our waste", "Land Reclamation: Restoring mined/disturbed land back to healthy ecosystems"]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Why Geography Decides Which Clean Energy Works Best", "content": "You wouldn't build a tidal dam in landlocked Saskatchewan or giant wind farms in a sheltered canyon!", "analogy": "🏀 Team Lineup Analogy: In gym basketball, you put your fastest sprinter at point guard and your tallest player at center. Smart energy planners match each province's geography to its natural superpower—Hydro in Quebec/Manitoba/B.C., Tidal in the Bay of Fundy, Solar/Wind on the sunny/windy Prairies!", "keyPoints": ["Every energy source has both benefits and environmental trade-offs."]}, {"level": 3, "name": "APPLY", "subtitle": "Trace a Watershed & Recommend Energy for 3 Canadian Regions", "conten
