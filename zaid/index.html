=\"154\" width=\"18\" height=\"18\" rx=\"3\"/><rect x=\"695\" y=\"157\" width=\"18\" height=\"18\" rx=\"3\"/>\n      </g>\n    </svg>\n    ", "history_timeline_svg": "\n    <svg viewBox=\"0 0 800 200\" class=\"topic-svg\" role=\"img\" aria-label=\"Ontario Grade 7 History Term 2 Timeline 1713 to 1838\">\n      <rect x=\"0\" y=\"0\" width=\"800\" height=\"200\" rx=\"14\" fill=\"#0f172a\"/>\n      <line x1=\"40\" y1=\"100\" x2=\"760\" y2=\"100\" stroke=\"#64748b\" stroke-width=\"4\"/>\n      <g transform=\"translate(75, 100)\">\n        <circle cx=\"0\" cy=\"0\" r=\"10\" fill=\"#38bdf8\"/>\n        <text x=\"0\" y=\"-25\" fill=\"#38bdf8\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\">1713</text>\n        <text x=\"0\" y=\"28\" fill=\"#e2e8f0\" font-size=\"11\" text-anchor=\"middle\">Treaty of</text>\n        <text x=\"0\" y=\"43\" fill=\"#e2e8f0\" font-size=\"11\" text-anchor=\"middle\">Utrecht</text>\n      </g>\n      <g transform=\"translate(205, 100)\">\n        <circle cx=\"0\" cy=\"0\" r=\"10\" fill=\"#f97316\"/>\n        <text x=\"0\" y=\"-25\" fill=\"#fb923c\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\">1755</text>\n        <text x=\"0\" y=\"28\" fill=\"#e2e8f0\" font-size=\"11\" text-anchor=\"middle\">Acadian</text>\n        <text x=\"0\" y=\"43\" fill=\"#e2e8f0\" font-size=\"11\" text-anchor=\"middle\">Expulsion</text>\n      </g>\n      <g transform=\"translate(335, 100)\">\n        <circle cx=\"0\" cy=\"0\" r=\"10\" fill=\"#ef4444\"/>\n        <text x=\"0\" y=\"-25\" fill=\"#f87171\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\">1763</text>\n        <text x=\"0\" y=\"28\" fill=\"#e2e8f0\" font-size=\"11\" text-anchor=\"middle\">Royal Proclamation</text>\n        <text x=\"0\" y=\"43\" fill=\"#fca5a5\" font-size=\"11\" text-anchor=\"middle\">(Assimilation)</text>\n      </g>\n      <g transform=\"translate(475, 100)\">\n        <circle cx=\"0\" cy=\"0\" r=\"10\" fill=\"#10b981\"/>\n        <text x=\"0\" y=\"-25\ l=\"#34d399\" font-size=\"14\" font-weight=\"bold\" text-anchor=\"middle\">3. Passé Composé (Past!)</text>\n      <text x=\"662\" y=\"72\" fill=\"#6ee7b7\" font-size=\"12.5\" font-weight=\"bold\" text-anchor=\"middle\">AVOIR + Past Participle</text>\n      <text x=\"560\" y=\"102\" fill=\"#e2e8f0\" font-size=\"12\">• -ER → <tspan fill=\"#34d399\" font-weight=\"bold\">-é</tspan>  (J'ai jou<tspan fill=\"#34d399\" font-weight=\"bold\">é</tspan>)</text>\n      <text x=\"560\" y=\"126\" fill=\"#e2e8f0\" font-size=\"12\">• -IR → <tspan fill=\"#34d399\" font-weight=\"bold\">-i</tspan>  (J'ai fin<tspan fill=\"#34d399\" font-weight=\"bold\">i</tspan>)</text>\n      <text x=\"560\" y=\"150\" fill=\"#e2e8f0\" font-size=\"12\">• -RE → <tspan fill=\"#34d399\" font-weight=\"bold\">-u</tspan>  (J'ai vend<tspan fill=\"#34d399\" font-weight=\"bold\">u</tspan>)</text>\n      <text x=\"662\" y=\"178\" fill=\"#a7f3d0\" font-size=\"11\" text-anchor=\"middle\">Irregulars: fait, vu, pris, lu, écrit</text>\n    </svg>\n    "};

    let app = {
      screen: 'home',         // 'home' | 'course' | 'lesson' | 'bloom' | 'question'
      courseIdx: 0,
      unitIdx: 0,
      openUnitIdx: 0,         // Only 1 unit card open at a time on Course screen!
      lessonIdx: 0,
      lessonTab: 'read',      // Focused 1-activity card inside Lesson: 'read' | 'watch' | 'check'
      activeVideoIdx: 0,
      bloomLvl: 1,
      questionIdx: 0,
      qaStep: 1,              // 1..5
      subStepIdx: 0,          // 0..2
      showMoreSubjects: false,
      teacherMode: false
    };

    let saved = JSON.parse(localStorage.getItem('zaid_grade7_v5') || '{"lessonsRead":{},"qcAnswers":{},"inputs":{},"checks":{},"qaDone":{},"weakSpots":{},"feedbackNotes":[]}');
    if (!saved.weakSpots) saved.weakSpots = {};
    if (!saved.feedbackNotes) saved.feedbackNotes = [];

    // Focus Timer
    let timerSec = 15 * 60;
    let timerId = null;

    function formatTime() {
      const m = String(Math.floor(timerSec / 60)).padStart(2, '0');
      const s = String(timerSec % 60).padStart(2, '0');
      return `${m}:${s}`;
    }
    function toggleTimer() {
      if (timerId) {
        clearInterval(timerId); timerId = null;
      } else {
        timerId = setInterval(() => {
          if (timerSec > 0) {
            timerSec--;
            const el = document.getElementById('modalTimerDigits');
            if (el) el.textContent = formatTime();
          } else {
            clearInterval(timerId); timerId = null;
          }
        }, 1000);
      }
      openToolsModal();
    }
    function resetTimer() {
      if (timerId) clearInterval(timerId);
      timerId = null;
      timerSec = 15 * 60;
      openToolsModal();
    }

    function saveState() { localStorage.setItem('zaid_grade7_v5', JSON.stringify(saved)); }
    function escapeHtml(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function speakFrench(txt) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(txt);
        u.lang = 'fr-CA';
        u.rate = 0.92;
        window.speechSynthesis.speak(u);
      }
    }
    function toggleTheme() {
      const isDark = document.body.classList.toggle('dark');
      localStorage.setItem('zaid_grade7_theme', isDark ? 'dark' : 'light');
      openToolsModal();
    }

    // Pop-Up Focus Cards (Keeps the main screen 100% clean!)
    function openModal(title, bodyHtml) {
      document.getElementById('modalCard').innerHTML = `
        <div class="modal-head">
          <h3>${title}</h3>
          <button class="btn" onclick="closeModal()">✕ Close</button>
        </div>
        <div>${bodyHtml}</div>
      `;
      document.getElementById('modalBackdrop').classList.add('open');
    }
    function closeModal() {
      document.getElementById('modalBackdrop').classList.remove('open');
    }

    function addFeedbackNote() {
      const inp = document.getElementById('feedbackInput');
      if (!inp || !inp.value.trim()) return;
      const c = COURSES[app.courseIdx];
      saved.feedbackNotes.unshift({
        date: new Date().toLocaleDateString(),
        context: app.screen === 'home' ? 'Home' : `${c.name} (${app.screen})`,
        text: inp.value.trim()
      });
      saveState();
      openToolsModal('feedback');
    }

    function deleteFeedbackNote(idx) {
      saved.feedbackNotes.splice(idx, 1);
      saveState();
      openToolsModal('feedback');
    }

    function copyFeedbackMemory() {
      const weakKeys = Object.keys(saved.weakSpots).filter(k => saved.weakSpots[k] > 0);
      let out = '### Zaid Study Feedback & Weak Spots\n';
      if (weakKeys.length) {
        out += '**Weak Spots (Missed Quick Checks / Hints Used):**\n';
        weakKeys.forEach(k => { out += `- ${k}: ${saved.weakSpots[k]}x\n`; });
      }
      if (saved.feedbackNotes.length) {
        out += '**Notes / Requested Fixes:**\n';
        saved.feedbackNotes.forEach(n => { out += `- [${n.date} | ${n.context}] ${n.text}\n`; });
      }
      if (!weakKeys.length && !saved.feedbackNotes.length) {
        out += '- No friction notes logged yet.';
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(out).then(() => {
          const btn = document.getElementById('copyMemBtn');
          if (btn) btn.textContent = '✅ Copied to Clipboard!';
        });
      } else {
        prompt('Copy this feedback into LESSONS_LEARNED.md:', out);
      }
    }

    function renderSearchResults(qText) {
      const box = document.getElementById('topicSearchResults');
      if (!box) return;
      const q = (qText || '').trim().toLowerCase();
      const hits = [];
      COURSES.forEach((c, cIdx) => {
        c.units.forEach((u, uIdx) => {
          (u.lessons || []).forEach((l, lIdx) => {
            const hay = `${c.name} ${u.title} ${l.title} ${l.bigIdea} ${l.keyTakeaway}`.toLowerCase();
            if (!q || hay.includes(q)) {
              hits.push({ label: `📖 ${c.name}: ${l.title}`, sub: u.title, action: `closeModal(); openLesson(${cIdx}, ${uIdx}, ${lIdx}, 'read');` });
            }
          });
          (u.questions || []).forEach((qa, qIdx) => {
            const hay = `${c.name} ${u.title} ${qa.title}`.toLowerCase();
            if (q && hay.includes(q)) {
              hits.push({ label: `✏️ Practice (${c.name}): ${qa.title}`, sub: u.title, action: `closeModal(); openQuestion(${cIdx}, ${uIdx}, ${qIdx}, 1);` });
            }
          });
        });
      });
      box.innerHTML = hits.slice(0, 14).map(h => `
        <button class="card-tile" style="margin-bottom:8px; padding:11px 14px;" onclick="${h.action}">
          <div><span class="tile-title" style="font-size:0.9rem;">${h.label}</span><span class="tile-sub">${h.sub}</span></div>
          <span class="btn btn-soft" style="padding:4px 10px; font-size:0.78rem;">Open →</span>
        </button>
      `).join('') || `<div class="info-box">No matching lessons found for "${escapeHtml(qText)}". Try keywords like <strong>contour</strong>, <strong>LOWERN</strong>, <strong>passé composé</strong>, <strong>BEDMAS</strong>, or <strong>particle</strong>.</div>`;
    }

    function openToolsModal(tab = 'tools') {
      const isDark = document.body.classList.contains('dark');
      let body = `
        <div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px;">
          <button class="btn ${tab === 'tools' ? 'btn-primary' : ''}" onclick="openToolsModal('tools')">⏱️ Timer &amp; Mode</button>
          <button class="btn ${tab === 'charts' ? 'btn-primary' : ''}" onclick="openToolsModal('charts')">📚 Anchor Charts</button>
          <button class="btn ${tab === 'search' ? 'btn-primary' : ''}" onclick="openToolsModal('search')">🔍 Jump to Topic</button>
          <button class="btn ${tab === 'feedback' ? 'btn-primary' : ''}" onclick="openToolsModal('feedback')">💡 Weak Spots &amp; Feedback</button>
          <button class="btn ${tab === 'report' ? 'btn-primary' : ''}" onclick="openToolsModal('report')">📋 Report Card</button>
        </div>
      `;

      if (tab === 'tools') {

    function courseProgress(course) {
      let total = 0, done = 0;
      course.units.forEach(u => {
        (u.lessons || []).forEach(l => { total++; if (saved.lessonsRead[l.id]) done++; });
        (u.questions || []).forEach(q => {
          total++;
          if (saved.qaDone[q.id] || q.step4_checks.every((_, i) => !!saved.checks[`${q.id}_chk_${i}`])) done++;
        });
      });
      return { total, done, pct: total ? Math.round((done / total) * 100) : 0 };
    }

    function getNextTask() {
      for (let cIdx = 0; cIdx < COURSES.length; cIdx++) {
        const c = COURSES[cIdx];
        for (let uIdx = 0; uIdx < c.units.length; uIdx++) {
          const u = c.units[uIdx];
          for (let lIdx = 0; lIdx < (u.lessons || []).length; lIdx++) {
            if (!saved.lessonsRead[u.lessons[lIdx].id]) {
              return { type: 'lesson', cIdx, uIdx, lIdx, course: c, item: u.lessons[lIdx] };
            }
          }
          for (let qIdx = 0; qIdx < (u.questions || []).length; qIdx++) {
            const q = u.questions[qIdx];
            if (!saved.qaDone[q.id] && !q.step4_checks.every((_, i) => !!saved.checks[`${q.id}_chk_${i}`])) {
              return { type: 'question', cIdx, uIdx, qIdx, course: c, item: q };
            }
          }
        }
      }
      return { type: 'lesson', cIdx: 0, uIdx: 0, lIdx: 0, course: COURSES[0], item: COURSES[0].units[0].lessons[0] };
    }

      if (idx === correctIdx) {
        saved.lessonsRead[lessonId] = true;
      } else {
        const c = COURSES[app.courseIdx];
        const l = c.units[app.unitIdx].lessons[app.lessonIdx];
        const key = `${c.name}: ${l.title}`;
        saved.weakSpots[key] = (saved.weakSpots[key] || 0) + 1;
      }
      saveState();
      render();
    }

    function finishLesson(lessonId) {
      saved.lessonsRead[lessonId] = true;
      saveState();
      const u = COURSES[app.courseIdx].units[app.unitIdx];
      if (app.lessonIdx + 1 < u.lessons.length) {
        openLesson(app.courseIdx, app.unitIdx, app.lessonIdx + 1, 'read');
      } else {
        openQuestion(app.courseIdx, app.unitIdx, 0, 1);
      }
    }

          <article class="focus-card anim-card">
            <span class="card-kicker">🎬 Focus Mode: Watch Video</span>
            <h1 class="card-heading" style="font-size:1.3rem;">${v.title}</h1>
            <p style="font-size:0.9rem; color:var(--text-muted); margin-bottom:16px;">${v.channel} • ${v.why}</p>

            ${l.videos.length > 1 ? `
              <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;">
                ${l.videos.map((vid, idx) => `
                  <button class="btn ${idx === vIdx ? 'btn-primary' : 'btn-soft'}" style="padding:6px 12px; font-size:0.82rem;" onclick="app.activeVideoIdx=${idx}; render();">Video ${idx + 1}</button>
                `).join('')}
              </div>
            ` : ''}

            <div class="video-stage" id="${slotId}">
              <div class="yt-poster" style="background-image:url('https://i.ytimg.com/vi/${v.id}/hqdefault.jpg');" onclick="loadYouTube('${slotId}', '${v.id}', '${v.title.replace(/'/g, "\'")}')">
                <div class="yt-poster-overlay">
                  <span class="yt-play-circle">▶ Play Video Lesson</span>
                </div>
              </div>
            </div>

            <div style="text-align:right;">
              <a class="btn btn-soft" style="font-size:0.8rem; padding:6px 12px;" href="https://www.youtube.com/watch?v=${v.id}" target="_blank" rel="noopener noreferrer">↗ Open directly on YouTube</a>
            </div>

            <div class="card-footer">
              <button class="btn" onclick="app.lessonTab='read'; render(); window.scrollTo(0,0);">← Back to Reading</button>
              <button class="btn btn-primary btn-lg" onclick="app.lessonTab='check'; render(); window.scrollTo(0,0);">⚡ Next: Quick Check →</button>
            </div>
          </article>
        `;
      } else {
        // FOCUS CARD 3: PURE 1-QUESTION QUICK CHECK!
        cardHtml = `
          <article class="focus-card anim-card">
            <span class="card-kicker" style="color:var(--purple);">⚡ Quick Check</span>
            <h1 class="card-heading" style="font-size:1.32rem;">${qc.question}</h1>
            <div>
              ${qc.options.map((opt, idx) => {
                let cls = 'qc-choice';
                if (answered) {
                  if (idx === qc.correctIdx) cls += ' correct';
                  else if (idx === chosen) cls += ' wrong';
                }
                return `<button class="${cls}" onclick="answerQC('${l.id}', ${idx}, ${qc.correctIdx})"><strong>${String.fromCharCode(65 + idx)}.</strong> ${opt}</button>`;
              }).join('')}
            </div>
            ${answered ? `
              <div class="qc-result ${isCorrect ? 'ok' : 'err'}">
                ${isCorrect ? '🎉 <strong>Awesome job!</strong> ' : '💡 <strong>Good try!</strong> '} ${qc.explanation}
              </div>
            ` : ''}
            <div class="card-footer">
              <button class="btn" onclick="app.lessonTab='${hasVideos ? 'watch' : 'read'}'; render(); window.scrollTo(0,0);">← Back</button>
              <button class="btn btn-success btn-lg" onclick="finishLesson('${l.id}')">
                ${hasNextLesson ? `Next Lesson (${app.lessonIdx + 2}/${u.lessons.length}) →` : `✏️ Ready! Solve Multi-Step Question →`}
              </button>
            </div>
          </article>
        `;
      }

      return `
        <div class="wrap-focus">
          <!-- Clean 3-Card Focus Switcher: Read | Watch | Check -->
          <div class="mode-pills">
            <button class="mode-pill ${app.lessonTab === 'read' ? 'active' : ''}" onclick="app.lessonTab='read'; render();">📖 1. Read</button>
            ${hasVideos ? `<button class="mode-pill ${app.lessonTab === 'watch' ? 'active' : ''}" onclick="app.lessonTab='watch'; render();">🎬 2. Watch (${l.videos.length})</button>` : ''}
            <button class="mode-pill ${app.lessonTab === 'check' ? 'active' : ''}" onclick="app.lessonTab='check'; render();">⚡ ${hasVideos ? '3' : '2'}. Check</button>
          </div>
          ${cardHtml}
        </div>
      `;
    }

    /* ============================================================
       SCREEN 3B: BLOOM'S 6-STEP FOCUS CARDS
       ============================================================ */
    function renderBloom() {
      const c = COURSES[app.courseIdx];
      const u = c.units[app.unitIdx];
      const b = u.bloomLadder.find(x => x.level === app.bloomLvl) || u.bloomLadder[0];
      const pts = b.keyPoints || [];
      const topPts = pts.slice(0, 2);
      const morePts = pts.slice(2);

      return `
        <div class="wrap-focus">
          <div class="step-dots">
            ${u.bloomLadder.map(st => `
              <button class="step-dot ${st.level === app.bloomLvl ? 'active' : ''}" onclick="openBloom(${app.courseIdx}, ${app.unitIdx}, ${st.level})">
                ${st.level}. ${st.name}
              </button>
            `).join('')}
          </div>

          <article class="focus-card anim-card">
            <span class="card-kicker">🧠 Bloom's Card ${b.level} of 6 • ${b.name}</span>
            <h1 class="card-heading">${b.subtitle}</h1>
            <div class="prose"><p>${b.content}</p></div>

            ${topPts.map(pt => `<div class="info-box">${pt}</div>`).join('')}

            <div class="bonus-strip">
              ${morePts.length ? `<button class="btn btn-soft" onclick="openModal('➕ More Key Points', '${morePts.map(p => '<div class=\'info-box\'>' + escapeHtml(p) + '</div>').join('').replace(/'/g, "\'")}')">➕ ${morePts.length} More Points</button>` : ''}
              ${b.analogy ? `<button class="btn btn-soft" onclick="openModal('💡 Real-Life Connection', '<div class=\'info-box\'>${escapeHtml(b.analogy).replace(/'/g, "\'")}</div>')">💡 Real-Life Example</button>` : ''}
              ${b.workedExample ? `<button class="btn btn-primary" onclick="openModal('🛠️ Worked Example', '<div class=\'info-box\'><strong>${escapeHtml(b.workedExample.prompt).replace(/'/g, "\'")}</strong></div>${b.workedExample.steps.map(s => '<div class=\'info-box\'>' + escapeHtml(s) + '</div>').join('').replace(/'/g, "\'")}')">🛠️ Open Worked Example</button>` : ''}
              ${b.comparisonTable ? `<button class="btn btn-primary" onclick="openBloomTableModal()">📊 Open Comparison Chart</button>` : ''}
              ${b.frenchAudioSamples && b.frenchAudioSamples.length ? `<button class="btn btn-soft" onclick="openFrenchAudioModal()">🔊 Practice French Audio</button>` : ''}
            </div>

            <div class="card-footer">
              ${app.bloomLvl > 1
                ? `<button class="btn" onclick="openBloom(${app.courseIdx}, ${app.unitIdx}, ${app.bloomLvl - 1})">← Card ${app.bloomLvl - 1}</button>`
                : `<button class="btn" onclick="openCourse(${app.courseIdx})">← Course Map</button>`}
              ${app.bloomLvl < 6
                ? `<button class="btn btn-primary btn-lg" onclick="openBloom(${app.courseIdx}, ${app.unitIdx}, ${app.bloomLvl + 1})">Next Card (${app.bloomLvl + 1}/6) →</button>`
                : `<button class="btn btn-success btn-lg" onclick="openQuestion(${app.courseIdx}, ${app.unitIdx}, 0, 1)">✏️ Solve Practice Question →</button>`}
            </div>
          </article>
        </div>
      `;
    }

    function openBloomTableModal() {
      const u = COURSES[app.courseIdx].units[app.unitIdx];
      const b = u.bloomLadder.find(x => x.level === app.bloomLvl);
      if (!b || !b.comparisonTable) return;
      const t = b.comparisonTable;
      const html = `<div style="overflow-x:auto;"><table class="comp-table"><thead><tr>${t.headers.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${t.rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
      openModal('📊 Comparison Chart', html);
    }

    function openFrenchAudioModal() {
      const u = COURSES[app.courseIdx].units[app.unitIdx];
      const b = u.bloomLadder.find(x => x.level === app.bloomLvl);
      if (!b || !b.frenchAudioSamples) return;
      const html = b.frenchAudioSamples.map(s => `<button class="audio-btn" onclick="speakFrench('${s.replace(/'/g, "\'")}')">🔊 ${s}</button>`).join('');
      openModal('🔊 Tap Any French Sentence to Hear It', html);
    }

    /* ============================================================
       SCREEN 3C: FOCUSED 1-STEP-AT-A-TIME QUESTION SOLVER CARD
       ============================================================ */
    function handleWorkInput(key, val) {
      saved.inputs[key] = val;
      saveState();
    }
    function handleVerifyCheck(qId, key, checked) {
      saved.checks[key] = checked;
      const q = COURSES[app.courseIdx].units[app.unitIdx].questions[app.questionIdx];
      if (q.step4_checks.every((_, i) => !!saved.checks[`${q.id}_chk_${i}`])) saved.qaDone[qId] = true;
      saveState();
      render();
    }

    function renderQuestion() {
      const c = COURSES[app.courseIdx];
      const u = c.units[app.unitIdx];
      const q = u.questions[app.questionIdx];
      const allChecks = q.step4_checks.every((_, i) => !!saved.checks[`${q.id}_chk_${i}`]);
      const unlocked = app.teacherMode || allChecks;

      const steps = [
        { n: 1, t: '1. Plan' },
        { n: 2, t: '2. Rules' },
        { n: 3, t: '3. Solve' },
        { n: 4, t: '4. Check' },
        { n: 5, t: '5. Answer' }
      ];

      let inner = '';
      if (app.qaStep === 1) {
        inner = `
          <span class="card-kicker">Step 1 of 5 • Read &amp; Plan</span>
          <h1 class="card-heading" style="font-size:1.3rem;">${q.title}</h1>
          <div class="info-box" style="border-left:4px solid var(--purple);">${q.prompt}</div>
          <div class="bonus-strip">
            <button class="btn btn-soft" onclick="openModal('❓ Guiding Questions', '${q.step1_deconstruct.guidingQuestions.map((g, i) => '<div class=\'info-box\'><strong>Think ' + (i+1) + ':</strong> ' + escapeHtml(g) + '</div>').join('').replace(/'/g, "\'")}')">❓ Need Help Planning?</button>
            <button class="btn btn-soft" onclick="openModal('👁️ Model Plan', '<div class=\'info-box\'>${escapeHtml(q.step1_deconstruct.modelPlan).replace(/'/g, "\'")}</div>')">👁️ See Model Plan</button>
          </div>
        `;
      } else if (app.qaStep === 2) {
        inner = `
          <span class="card-kicker">Step 2 of 5 • Rules You Need</span>
          <h1 class="card-heading" style="font-size:1.3rem;">Review the Rules Before Solving</h1>
          ${q.step2_anchor.referenceItems.map(r => `<div class="info-box">📌 ${r}</div>`).join('')}
          <div class="bonus-strip">
            <button class="btn btn-soft" onclick="openQuestionPromptCard(COURSES[${app.courseIdx}].units[${app.unitIdx}].questions[${app.questionIdx}])">🎯 Re-read Question</button>
            <button class="btn btn-soft" onclick="openToolsModal('charts')">📚 Full Anchor Charts</button>
          </div>
        `;
      } else if (app.qaStep === 3) {
        const sIdx = Math.min(app.subStepIdx, q.step3_substeps.length - 1);
        const sub = q.step3_substeps[sIdx];
        const key = `${q.id}_sub_${sIdx}`;
        const val = saved.inputs[key] || '';
        inner = `
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:10px;">
            <span class="card-kicker" style="margin:0;">Step 3 of 5 • Part ${sIdx + 1} of ${q.step3_substeps.length}</span>
            <button class="btn btn-soft" style="padding:5px 11px; font-size:0.8rem;" onclick="openQuestionPromptCard(COURSES[${app.courseIdx}].units[${app.unitIdx}].questions[${app.questionIdx}])">🎯 Re-read Question</button>
          </div>
          <div style="display:flex; gap:6px; margin-bottom:14px;">
            ${q.step3_substeps.map((_, i) => {
              const typed = (saved.inputs[`${q.id}_sub_${i}`] || '').trim().length > 2;
              return `<button class="btn ${i === sIdx ? 'btn-primary' : 'btn-soft'}" style="padding:5px 12px; font-size:0.8rem;" onclick="app.subStepIdx=${i}; render();">Part 3${String.fromCharCode(97 + i)} ${typed ? '✓' : ''}</button>`;
            }).join('')}
          </div>
          <label style="font-weight:700; font-size:1.04rem; display:block;">${sub.label}</label>
          <textarea class="work-area" placeholder="${escapeHtml(sub.placeholder)}" oninput="handleWorkInput('${key}', this.value)">${escapeHtml(val)}</textarea>
          <div class="bonus-strip">
            <button class="btn btn-soft" onclick="openHintWithLog('Part 3${String.fromCharCode(97 + sIdx)}', COURSES[${app.courseIdx}].units[${app.unitIdx}].questions[${app.questionIdx}].step3_substeps[${sIdx}].hint)">💡 Open Hint Card</button>
            <button class="btn btn-soft" onclick="openModal('✅ Model Work for Part 3${String.fromCharCode(97 + sIdx)}', '<div class=\'info-box\'>${escapeHtml(sub.modelSubAnswer).replace(/\n/g, '<br/>').replace(/'/g, "\'")}</div>')">✅ Check Part 3${String.fromCharCode(97 + sIdx)}</button>
          </div>
        `;
      } else if (app.qaStep === 4) {
        inner = `
          <span class="card-kicker">Step 4 of 5 • Double-Check Shield</span>
          <h1 class="card-heading" style="font-size:1.3rem;">Check Off Each Box to Unlock the Answer</h1>
          ${q.step4_checks.map((chk, idx) => {
            const k = `${q.id}_chk_${idx}`;
            return `
              <label class="check-tile">
                <input type="checkbox" ${saved.checks[k] ? 'checked' : ''} onchange="handleVerifyCheck('${q.id}', '${k}', this.checked)" />
                <span>${chk}</span>
              </label>
            `;
          }).join('')}
          ${allChecks ? `<div class="takeaway">✅ All checked! Tap <strong>See Model Answer</strong> below.</div>` : ''}
        `;
      } else {
        inner = `
          <span class="card-kicker">Step 5 of 5 • Compare &amp; Celebrate</span>
          <h1 class="card-heading" style="font-size:1.3rem;">Grade 7+ Multi-Step Exemplar</h1>
          ${unlocked ? `
            <div class="takeaway" style="white-space:pre-line;">${q.step5_modelAnswer.expandedAnswer}</div>
            <div class="bonus-strip">
              <button class="btn btn-soft" onclick="openModal('⚠️ Too-Short Answer vs. Full Answer', '<div class=\'info-box\'>${escapeHtml(q.step5_modelAnswer.basicAnswer).replace(/'/g, "\'")}</div>')">⚠️ Compare with Brief Answer</button>
              <button class="btn btn-soft" onclick="openModal('🚀 Bonus Extension Challenge', '<div class=\'info-box\'>${escapeHtml(q.step5_modelAnswer.extensionPrompt).replace(/'/g, "\'")}</div>')">🚀 Bonus Extension</button>
            </div>
          ` : `
            <div class="info-box" style="text-align:center; padding:24px;">
              <strong>🔒 Complete Step 4 Double-Check First!</strong>
Check all boxes in Step 4 (or turn on Parent Mode inside 🧰 Help).
            </div>
          `}
        `;
      }

      const nextButton = () => {
        if (app.qaStep === 3 && app.subStepIdx + 1 < q.step3_substeps.length) {
          return `<button class="btn btn-primary btn-lg" onclick="app.subStepIdx=${app.subStepIdx + 1}; render();">Continue to Part 3${String.fromCharCode(98 + app.subStepIdx)} →</button>`;
        }
        if (app.qaStep === 4) {
          return `<button class="btn btn-success btn-lg" onclick="app.qaStep=5; render();">See Model Answer →</button>`;
        }
        if (app.qaStep < 5) {
          return `<button class="btn btn-primary btn-lg" onclick="app.qaStep=${app.qaStep + 1}; render();">Next Step (${app.qaStep + 1}/5) →</button>`;
        }
        if (app.questionIdx + 1 < u.questions.length) {
          return `<button class="btn btn-success btn-lg" onclick="openQuestion(${app.courseIdx}, ${app.unitIdx}, ${app.questionIdx + 1}, 1)">Next Question →</button>`;
        }
        return `<button class="btn btn-success btn-lg" onclick="openCourse(${app.courseIdx})">🎉 Done! Back to ${c.name}</button>`;
      };

      const prevButton = () => {
        if (app.qaStep === 3 && app.subStepIdx > 0) {
          return `<button class="btn" onclick="app.subStepIdx=${app.subStepIdx - 1}; render();">← Part 3${String.fromCharCode(96 + app.subStepIdx)}</button>`;
        }
        if (app.qaStep > 1) {
          return `<button class="btn" onclick="app.qaStep=${app.qaStep - 1}; render();">← Back</button>`;
        }
        return `<button class="btn" onclick="openLesson(${app.courseIdx}, ${app.unitIdx}, 0, 'read')">← Read Lesson</button>`;
      };

      return `
        <div class="wrap-focus">
          <div class="step-dots">
            ${steps.map(s => `
              <button class="step-dot ${s.n === app.qaStep ? 'active' : ''} ${s.n < app.qaStep ? 'done' : ''}" onclick="app.qaStep=${s.n}; render();">${s.t}</button>
            `).join('')}
          </div>
          <section class="focus-card anim-card">
            ${inner}
            <div class="card-footer">
              ${prevButton()}
              ${nextButton()}
            </div>
          </section>
        </div>
      `;
    }

    function render() {
      renderTopBar();
      const root = document.getElementById('stageRoot');
      if (app.screen === 'home') root.innerHTML = renderHome();
      else if (app.screen === 'course') root.innerHTML = renderCourse();
      else if (app.screen === 'lesson') root.innerHTML = renderLesson();
      else if (app.screen === 'bloom') root.innerHTML = renderBloom();
      else if (app.screen === 'question') root.innerHTML = renderQuestion();
    }

    // Restore saved theme & hash support
    (function initHash() {
      const h = window.location.hash.replace('#', '');
      if (localStorage.getItem('zaid_grade7_theme') === 'dark' || h.includes('dark')) {
        document.body.classList.add('dark');
      }
      const route = h.replace('&dark', '').replace('dark', '');
      if (route.startsWith('course=')) return openCourse(parseInt(route.split('=')[1], 10) || 0);
      if (route.startsWith('lesson=')) {
        const p = route.split('=')[1].split('-');
        return openLesson(+p[0]||0, +p[1]||0, +p[2]||0, p[3] || 'read');
      }
      if (route.startsWith('question=')) {
        const p = route.split('=')[1].split('-').map(x => +x || 0);
        return openQuestion(p[0], p[1], p[2], p[3] || 1);
      }
      render();
    })();
  </script>
</body>
</html>
