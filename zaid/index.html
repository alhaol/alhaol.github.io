 the extra 4 g of salt using 3 postulates of the Particle Theory", "placeholder": "1. (Particle Motion): When thermal energy is added, the water particles...\n2. (Spaces Between Particles): Because they move faster, the spaces between water particles...\n3. (Collisions & Attraction): The fast-moving water particles collide with...", "hint": "Mention: (1) Particles are always moving & move faster when heated, (2) Spaces between particles expand, (3) Attractive forces between water and salt pull the remaining salt particles into the spaces.", "modelSubAnswer": "1. Particle Motion (Postulate 4): Adding heat (thermal energy) to reach 80°C causes the water and salt particles to move much faster (higher kinetic energy).\n2. Spaces Between Particles (Postulate 3): As the water (solvent) particles move faster and bump into each other, they spread slightly farther apart, creating more empty space between them.\n3. Attractive Forces & Collisions (Postulate 5): The faster-moving water particles collide more frequently with the 4 g of solid salt crystals, overcoming the attraction holding the salt crystals together and pulling the salt particles into the expanded spaces until the entire 40 g is uniformly dissolved."}, {"label": "Step 3c: Part (c) — Describe the exact separation process to recover BOTH pure dry salt AND pure liquid water", "placeholder": "To recover both the salt and the water, I would use distillation instead of simple evaporation because...", "hint": "Explain what boils at 100°C, what happens in the cooling condenser tube, and what stays behind in the boiling flask.", "modelSubAnswer": "To recover BOTH substances, we must use Distillation (not simple open evaporation, which loses the water vapour into the air). When the salt solution is heated to 100°C in a distillation flask, the water particles gain enough energy to boil and turn into steam (gas), while the heavy salt particles have a much higher boiling point and stay behind as pure dry salt crystals. The steam travels through a cold condenser tube, where it cools, loses thermal energy, and condenses back into pure liquid drinking water (distillate) in a separate receiving beaker."}], "step4_checks": ["Did I use the words 'solute' (salt), 'solvent' (water), 'saturated', and 'homogeneous solution'?", "Did I avoid the careless mistake of saying the salt 'melted'?", "Did I explicitly reference Particle Motion, Spaces Between Particles, and Attractive Forces in Part (b)?", "Did I explain Distillation (evaporation + condensation) in Part (c) so BOTH water and salt are saved?"], "step5_modelAnswer": {"basicAnswer": "(a) Saturated solution with extra salt at the bottom. (b) Heat makes particles move faster and make more room for the salt. (c) Use distillation to boil and condense the water and keep the salt.", "expandedAnswer": "Complete Grade 7+ Scientific Explanation (D. Forbes Precision Standard):\n(a) Classification at 10°C: The liquid is a saturated solution (homogeneous mixture) because all available spaces between the water (solvent) particles at 10°C are filled with 36 g of dissolved salt (solute) particles. Because 4 g of undissolved salt crystals remain visible at the bottom, the total beaker system is a two-phase heterogeneous mixture.\n(b) Particle Theory Explanation at 80°C: According to the Particle Theory, (1) adding thermal energy causes water particles to move much faster; (2) faster motion pushes the water particles slightly farther apart, enlarging the empty spaces between them; and (3) more frequent, energetic collisions allow water particles to attract and pull the remaining 4 g of salt particles away from the crystal and into those newly expanded spaces.\n(c) Recovering Both Components via Distillation: Heating the solution in a closed distillation apparatus boils the water solvent into water vapour at 100°C while leaving pure solid salt behind in the boiling flask. Passing the water vapour through a cooled condenser tube removes thermal energy, condensing the gas back into pure liquid water in a second container.", "extensionPrompt": "Extension Connection (Structures & Heat Strand): Why do engineers leave narrow expansion gaps ('expansion joints') between steel sections of bridges in Ottawa? Explain using the Particle Theory between −25°C winter and +35°C summer!"}}], "studyFirstTag": "Start Here: 5 Rules of Particle Theory + Solutions vs. Mixtures", "lessons": [{"id": "sci-u1-l1", "title": "Lesson 1.1: The 5 Rules of the Particle Theory of Matter", "readTime": "3 min read", "bigIdea": "Everything you can touch, drink, or breathe is made of microscopic moving particles—and those 5 rules explain every chemistry lab!", "paragraphs": ["D. Forbes noted that you already have a solid grasp of Particle Theory and Pure Substances & Mixtures! Let's sharpen your vocabulary from 'usually accurate' to 100% scientific precision.", "Memorize the 5 Postulates: (1) All matter is made of tiny particles. (2) All particles of ONE pure substance are identical; different substances have different particles. (3) There are empty spaces between particles. (4) Particles are ALWAYS moving—and adding heat (thermal energy) makes them move FASTER and spread FARTHER APART! (5) Attractive forces hold particles together (strongest in solids, weakest in gases).", "Watch out for the #1 vocabulary trap in Grade 7 Science: When sugar or salt disappears in hot water, do NOT say it 'melted'! Melting happens when heat alone turns a solid into its own liquid (like ice turning into liquid water). When a SOLUTE (salt) spreads evenly into the empty spaces between a SOLVENT (water), the exact scientific word is DISSOLVING!"], "keyTakeaway": "Heating adds thermal energy → particles move faster → spaces between solvent particles expand → more solute can dissolve!", "deepReadTitle": "🧪 Pure Substances vs. Solutions vs. Mechanical Mixtures + Distillation", "deepReadText": "• Pure Substance: Only ONE kind of particle (distilled water, pure gold, table salt).\n• Homogeneous Mixture (Solution): 2+ types of particles mixed so evenly it looks like one clear phase (salt water, air, apple juice). When full at a given temperature, it is SATURATED.\n• Heterogeneous Mechanical Mixture: You can see 2+ distinct parts (trail mix, sand + water, undissolved salt sitting on the bottom).\n• Separation Tip: Open evaporation saves only the dissolved solid (salt), whereas DISTILLATION (boiling + condensing steam back to liquid) recovers BOTH pure dry salt AND pure liquid water!", "quickCheck": {"question": "Why does salt dissolve faster and in larger amounts in 80°C water than in 10°C water?", "options": ["Because the hot water melts the salt into liquid salt.", "Because hot water particles move faster, collide harder with salt crystals, and spread slightly farther apart.", "Because cold water has no spaces between particles."], "correctIdx": 1, "explanation": "100% scientific precision! Thermal energy increases particle speed, collision force, and spaces between solvent particles—without using the inaccurate word 'melts'!"}, "videos": [{"id": "pTzUnPWSFeg", "title": "Particle Theory, Pure Substances, and Mixtures (Grade 7 Science)", "channel": "The Digital Classroom Experience", "why": "Directly aligned with the Ontario Grade 7 Science Particle Theory & Mixtures unit!"}]}]}, {"id": "sci-u2", "title": "Unit 2: Heat in the Environment, Form/Function of Structures & Ecosystems", "curriculumStrand": "Ontario Grade 7 Science Strands E (Heat), D (Structures & Mechanisms) & B (Interactions in Ecosystems)", "svgDiagram": "science_particle_svg", "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Core Anchors: Heat Transfer (3 Types), Structural Forces (4 Types) & Ecosystems", "content": "Master the big 3 remaining strands of Ontario Grade 7 Science with D. Forbes:", "keyPoints": ["🔥 Strand E — Heat in the Environment (3 Transfer Methods):\n• Conduction: Transfer of thermal energy through direct particle-to-particle collisions in SOLIDS (e.g., a metal spoon in hot soup).\n• Convection: Transfer of thermal energy in FLUIDS (liquids and gases) where warmer, less-dense fluid rises and cooler, denser fluid sinks in a convection current.\n• Radiation: Transfer of energy through electromagnetic (infrared) waves that can travel through empty space/vacuum (e.g., heat from the Sun or a campfire).", "🌉 Strand D — Structures & Mechanisms (3 Structure Types & 4 Internal Forces):\n• Structure Types: Solid (concrete dam), Frame (skeleton/bicycle frame/gym roof trusses), Shell (egg, bike helmet, dome).\n• 4 Internal Forces: Tension (pulling apart/stretching), Compression (pushing/squeezing together), Torsion (twisting), Shear (sliding/tearing in opposite directions).", "🌿 Strand B — Interactions in the Environment (Ecosystems):\n• Biotic (living: plants, animals, bacteria) vs. Abiotic (non-living: sunlight, water, soil, temperature).\n• Energy Pyramid: Producers (plants via photosynthesis) -> Primary Consumers (herbivores) -> Secondary/Tertiary Consumers (carnivores/omnivores) -> Decomposers (fungi/bacteria)."]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "How the Particle Theory Explains Convection Currents & Structural Expansion", "content": "Notice how the Particle Theory from Unit 1 explains BOTH Heat in the Environment AND Structural Engineering!", "analogy": "🏀 Gym Air Conditioning & Bridge Expansion Analogy: Why does the top row of the gym bleachers feel warmer than the gym floor? When air particles are heated, they move faster and spread farther apart (becoming less dense), so they float UP to the ceiling while cool, tightly packed air sinks to the floor (Convection)! And why do Ottawa bridges have metal tooth-like gaps? In +35°C summer heat, steel particles vibrate faster and expand; without expansion joints, compression forces would buckle the bridge!", "keyPoints": ["Thermal Energy vs. Temperature: Temperature is the AVERAGE kinetic energy (speed) of particles; Thermal Energy is the TOTAL kinetic energy of ALL particles in an object (a giant iceberg at 0°C has more total thermal energy than a tiny teacup of boiling water at 100°C because the iceberg has trillions more particles!)."]}, {"level": 3, "name": "APPLY", "subtitle": "Analyze Internal Forces Acting on a Bridge or Athlete", "content": "Apply structural engineering concepts to identify all 4 internal forces in action:", "workedExample": {"prompt": "When a heavy snowplow drives across the Vimy Memorial Bridge in Ottawa (an arch/suspension truss bridge), what internal forces act on its parts?", "steps": ["1. Compression: The concrete piers and arch ribs are squeezed downward by the weight (load) of the snowplow.", "2. Tension: The steel suspension cables holding up the road deck are pulled tight and stretched.", "3. Shear: Where steel bolts connect horizontal beams to vertical columns, opposing forces try to slice the bolts sideways.", "4. Torsion: High crosswinds blowing unevenly against the bridge deck try to twist the structure."]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Solid, Frame & Shell Structures + Triangle Truss Stability", "content": "Why do engineers build stadium roofs and bridges out of triangles instead of squares?", "comparisonTable": {"headers": ["Structure Type", "How It Resists Loads", "Advantages", "Disadvantages & Failure Risk"], "rows": [["Solid Structure (Dam, Brick, Mountain)", "Uses massive weight and solid material in compression", "Extremely strong under compression, won't easily tip", "Very heavy, expensive, uses huge amounts of material, no interior space"], ["Frame Structure (Truss Bridge, Skeleton, Gym Roof)", "Network of beams/struts joined at nodes shares tension & compression", "Lightweight, economical, open interior space; TRIANGLES cannot deform without bending a side!", "Joints/connections can fail under shear if not braced with triangles"], ["Shell Structure (Bike Helmet, Igloo, Fuselage)", "Curved outer surface distributes load evenly in all directions", "Strong yet hollow/lightweight; great for protection and containers", "A tiny crack or dent weakens the entire shell"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Audit an Energy Pyramid & Heat Loss Design", "content": "Check these two critical Grade 7 Science principles:", "keyPoints": ["10% Ecological Energy Rule: When energy moves up a food chain (Grass -> Rabbit -> Fox), roughly 90% of the energy at each level is used for life processes or lost as heat, and only 10% is passed to the next level! ( E.g., 10,000 J of grass -> 1,000 J in rabbits -> 100 J in foxes).", "Thermos (Vacuum Flask) Audit: A high-tech thermos stops ALL 3 heat transfer types: (1) A vacuum between double walls has no particles, stopping Conduction and Convection; (2) A shiny silver mirror coating reflects infrared waves, stopping Radiation!"]}, {"level": 6, "name": "CREATE", "subtitle": "Design an Energy-Efficient, Snow-Load-Resistant Canadian Eco-Gymnasium", "content": "Synthesize Heat (insulation against Conduction/Convection/Radiation), Structures (triangular roof trusses & low centre of gravity), and Ecosystems (solar flow resources & native plants).", "keyPoints": ["Connects all 4 Ontario Grade 7 Science strands into one engineering design!"]}], "questions": [{"id": "sci-u2-q1", "bloomLevel": 6, "bloomTag": "ANALYZE, EVALUATE & CREATE", "title": "Ottawa Winter Engineering Lab: Heat Transfer, Particle Theory & Structural Forces", "prompt": "Engineers are designing a new gymnasium roof and heating system for a school in Ottawa where winter temperatures drop to −30°C and heavy wet snow piles on the roof:\n(a) HEAT & PARTICLE THEORY: Explain how thermal energy would escape from the warm gym (+20°C) to the freezing outside (−30°C) through Conduction, Convection, and Radiation, and explain how double-paned argon-gas windows with reflective coating stop all 3.\n(b) STRUCTURES & FORCES: When 20,000 kg of wet snow (Dynamic/Live Load) sits on the flat gym roof supported by steel beams, which internal force acts on the TOP edge of a bending horizontal beam, which internal force acts on the BOTTOM edge of that beam, and why should engineers add diagonal struts to form TRIANGLES (trusses)?\n(c) ECOSYSTEM ENERGY MATH: Outside the school, a courtyard ecosystem has 50,000 kilojoules (kJ) of solar energy captured by native plants (Producers). Using the 10% Ecological Energy Rule, calculate how much energy reaches (1) Primary Consumers (insects/rabbits), (2) Secondary Consumers (robins/toads), and (3) Tertiary Consumers (hawks), and explain why top predators are always fewer in number than plants.", "step1_deconstruct": {"instruction": "STOP & PLAN: Break down the 3 distinct science strands tested in (a) Heat, (b) Structures, and (c) Ecosystems.", "guidingQuestions": ["Part (a): What are the 3 methods of heat transfer (Conduction, Convection, Radiation) and how does a double-pane reflective window block each one?", "Part (b): When a horizontal beam bends downward in the middle under heavy snow, is the top surface squeezed (compression) or stretched (tension)? What about the bottom surface?", "Part (c): Multiply 50,000 kJ by 10% (÷ 10) at each step up the food chain!"], "modelPlan": "(a) Define Conduction, Convection, and Radiation and link each to trapped argon gas (poor conductor), narrow sealed pane (stops convection loops), and reflective film (reflects infrared radiation). (b) Top of bending beam = Compression, Bottom = Tension; triangular trusses distribute forces along rigid sides. (c) 50,000 kJ -> 5,000 kJ -> 500 kJ -> 50 kJ."}, "step2_anchor": {"instruction": "ANCHOR RULES: Heat Transfer + Bending Beam Forces + 10% Energy Rule.", "referenceItems": ["Bending Beam Rule: Load pushing down from above squeezes the TOP surface (Compression) and stretches the BOTTOM surface (Tension).", "Triangle Rigidity Rule: A square frame collapses into a parallelogram under sideways shear force, whereas a triangle cannot change shape without lengthening or shortening a side.", "10% Energy Rule: Divide energy by 10 at each trophic level up the pyramid."]}, "step3_substeps": [{"label": "Step 3a: Part (a) HEAT — Explain Conduction, Convection, and Radiation heat loss AND how the high-tech window blocks all 3", "placeholder": "1. Conduction: ...\n2. Convection: ...\n3. Radiation: ...", "hint": "Gases (like argon) have particles far apart, making them great insulators against conduction!", "modelSubAnswer": "1. Conduction: Fast-moving warm air particles inside the gym collide with the inner glass pane, transferring kinetic energy through the solid glass. Trapping argon gas between two glass panes slows conduction dramatically because gas particles are far apart and collide rarely.\n2. Convection: Warm air rises to the ceiling and circulates against cold surfaces. Sealing the narrow gap between the two panes prevents large convection currents from circulating.\n3. Radiation: Warm objects emit infrared electromagnetic waves. A low-emissivity (Low-E) reflective silver coating on the glass reflects infrared heat waves back inside the gym."}, {"label": "Step 3b: Part (b) STRUCTURES — Identify the forces on the TOP and BOTTOM of the snow-loaded roof beam, and explain why triangular trusses prevent collapse", "placeholder": "When the 20,000 kg snow load pushes down:\n• Top edge of beam experiences: ...\n• Bottom edge of beam experiences: ...\n• Triangular trusses help because: ...", "hint": "Top edge squeezes together (Compression); bottom edge stretches apart (Tension)!", "modelSubAnswer": "• Dead vs. Live Load: The roof's own weight is the Dead (Static) Load, while the 20,000 kg of snow is the Live (Dynamic) Load.\n• Internal Beam Forces: As the horizontal beam sags slightly downward under the snow, its TOP edge is squeezed together (Compression) and its BOTTOM edge is stretched apart (Tension).\n• Why Triangles Work: Adding diagonal struts creates a triangular truss. Unlike rectangles (which twist at the corners into parallelograms), a triangle is geometrically rigid—forces are distributed evenly as pure compression and tension along the straight struts."}, {"label": "Step 3c: Part (c) ECOSYSTEMS — Calculate the energy at all 3 consumer levels starting from 50,000 kJ in plants, and explain why hawks are rare", "placeholder": "Producers (Plants): 50,000 kJ\n1. Primary Consumers: ...\n2. Secondary Consumers: ...\n3. Tertiary Consumers (Hawks): ...\nExplanation: ...", "hint": "Divide by 10 three times: 50,000 -> 5,000 -> 500 -> 50 kJ!", "modelSubAnswer": "• Producers (Plants): 50,000 kJ\n1. Primary Consumers (Herbivores): 50,000 kJ × 10% = 5,000 kJ\n2. Secondary Consumers (Small Carnivores): 5,000 kJ × 10% = 500 kJ\n3. Tertiary Consumers (Hawks): 500 kJ × 10% = 50 kJ\n• Scientific Explanation: Because 90% of energy is lost as thermal energy (heat) and metabolic work at each trophic step, only 1/1,000th (50 kJ) of the original plant energy reaches the tertiary level, meaning an ecosystem can support millions of plants but only a few top predators."}], "step4_checks": ["Did I explain all 3 heat transfer mechanisms (Conduction, Convection, Radiation) using particle motion in Part (a)?", "Did I correctly state Compression on the TOP and Tension on the BOTTOM of the sagging roof beam in Part (b)?", "Did I double-check my zeros in Part (c): 50,000 kJ -> 5,000 kJ -> 500 kJ -> 50 kJ?"], "step5_modelAnswer": {"basicAnswer": "(a) Argon stops conduction/convection, mirror stops radiation. (b) Top is compression, bottom is tension; triangles are strong. (c) 5,000 kJ, 500 kJ, 50 kJ.", "expandedAnswer": "Complete Multi-Strand Science Solution (D. Forbes Level 4+ Standard):\n(a) Heat & Particle Theory: Conduction occurs via particle-to-particle collisions through solids (blocked by the wide-spaced particles of argon gas between panes). Convection occurs via rising warm / sinking cool fluid currents (blocked by the narrow, sealed space between panes). Radiation occurs via infrared waves (blocked by the reflective Low-E coating).\n(b) Structural Engineering: The 20,000 kg snow load is a Live Load that bends the horizontal beam downward, putting its upper surface under Compression (squeezed) and its lower surface under Tension (stretched). Diagonal struts form triangular trusses, which are geometrically rigid because a triangle's angles cannot deform without changing the length of its sides.\n(c) Ecosystem Energy Pyramid: Starting with 50,000 kJ in Producers, the 10% rule yields 5,000 kJ for Primary Consumers, 500 kJ for Secondary Consumers, and just 50 kJ for Tertiary Consumers (hawks). Because 90% of energy is dissipated as heat at every step, top predators require vast territories and remain scarce.", "extensionPrompt": "Bonus Connection: How does a hawk soaring high above the school yard use CONVECTION currents ('thermals') in the air to glide upward without flapping its wings?"}}], "studyFirstTag": "Next: Heat Transfer, Bridge Forces & Ecosystem 10% Rule", "lessons": [{"id": "sci-u2-l1", "title": "Lesson 2.1: Heat Transfer, Bridge Forces & The 10% Ecosystem Rule", "readTime": "3 min read", "bigIdea": "The same Particle Theory explains how heat escapes a building in an Ottawa winter, while triangles keep roofs strong and energy flows through ecosystems.", "paragraphs": ["Thermal energy always flows from warmer objects to cooler objects in 3 ways: CONDUCTION (direct particle collisions through solids, like a hot metal spoon), CONVECTION (circular currents in liquids/gases where warm, less-dense fluid rises and cool fluid sinks), and RADIATION (infrared electromagnetic waves that travel through empty space, like sunlight).", "In Structures & Mechanisms, every bridge or gym roof resists 4 internal forces: Compression (squeezing together), Tension (pulling apart), Shear (sliding/tearing sideways), and Torsion (twisting). When heavy snow pushes down on a horizontal roof beam, the beam bends downward—squeezing the TOP edge (Compression) and stretching the BOTTOM edge (Tension)! Engineers add diagonal braces to form TRIANGLES because a triangle cannot collapse into a slanted shape.", "In Ecosystems, plants (Producers) capture solar energy. As energy moves up the food chain (Producers → Primary Consumers → Secondary Consumers → Tertiary Consumers), about 90% is used for life or lost as heat at every step—leaving only 10% for the next level! That is why a forest has millions of plants, thousands of rabbits, and only a handful of hawks."], "keyTakeaway": "Heat: Conduction (solids), Convection (fluids), Radiation (waves) | Bending Beam: Top = Compression, Bottom = Tension | Food Chain: ÷ 10 each level!", "deepReadTitle": "🪟 How a Thermos or Double-Pane Window Stops All 3 Heat Transfers", "deepReadText": "A double-paned argon window stops Conduction (gas particles are far apart), stops Convection (sealed narrow gap stops air loops), and stops Radiation (shiny reflective Low-E coating bounces infrared waves back inside).", "quickCheck": {"question": "If plants capture 50,000 kJ of energy, how much energy reaches Secondary Consumers (2 levels up) using the 10% rule?", "options": ["5,000 kJ", "500 kJ", "50 kJ"], "correctIdx": 1, "explanation": "Producers (50,000 kJ) → Primary Consumers (÷10 = 5,000 kJ) → Secondary Consumers (÷10 = 500 kJ)!"}, "videos": [{"id": "2z1Z8iZ0Mxg", "title": "Heat Transfer: Conduction, Convection, and Radiation", "channel": "Sheryl McLaughlin", "why": "Clear explanation of all 3 thermal energy transfer pathways."}]}]}], "friendlySub": "Particle theory, mixtures, heat transfer & structures", "accent": "#0284c7"}, {"id": "history", "code": "CHC / History 7 (Term 2 Prep)", "name": "History (Term 2 Prep)", "teacher": "O. Macri (OM)", "status": "Term 2 Delivery (Head Start)", "tier": "Tier 3: Term 2 Head Start", "tierClass": "tier-prep", "icon": "🏛️", "reportComment": "HISTORY will be delivered and assessed in Term 2. (OM) — Proactively preparing Term 2 Ontario Grade 7 History with O. Macri so Zaid starts ahead on classwork and quizzes!", "nextSteps": ["Build a strong timeline of New France & British North America (1713–1800) before Term 2 begins", "Analyze historical perspectives (First Nations, Métis, Inuit, Canadiens/Habitants, Acadians, British, Loyalists)", "Apply the same classwork completion and quiz review habits used in O. Macri's Geography class"], "units": [{"id": "hist-u1", "title": "Unit 1: New France, British North America (1713–1800) & Conflict/Challenges (1800–1850)", "curriculumStrand": "Ontario Grade 7 History Strand A (1713–1800) & Strand B (1800–1850)", "svgDiagram": "history_timeline_svg", "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Core Term 2 Timeline & Key Historical Figures/Terms (1713–1850)", "content": "Get ahead for Term 2 with O. Macri by mastering the anchor dates and groups of early Canada:", "keyPoints": ["📜 1713 — Treaty of Utrecht: Ended war in Europe; France ceded Acadia (Nova Scotia) to Britain, turning French-speaking Acadians into British subjects.", "🌾 Seigniorial System (New France): Long, narrow strip farms along the St. Lawrence River owned by a Seigneur and farmed by Habitants so every family had river access for water and transport.", "⛵ 1755 — Expulsion of the Acadians (Le Grand Dérangement): British authorities forcibly deported ~11,000 Acadians when they refused to sign an unconditional oath of allegiance to fight against French/Indigenous allies.", "⚔️ 1756–1763 — Seven Years' War & Battle of the Plains of Abraham (1759): British forces (Wolfe) defeated French forces (Montcalm) at Quebec City; Treaty of Paris (1763) transferred New France to Britain.", "👑 1763 — Royal Proclamation vs. 1774 — Quebec Act: 1763 recognized Indigenous hunting territories West of the Appalachians and tried to assimilate French Canadiens; 1774 restored French civil law, the seigniorial system, and Catholic rights to keep Canadiens loyal during the American Revolution.", "🛡️ 1812–1814 — War of 1812 & 1837–1838 Rebellions: Shawnee leader Tecumseh, General Isaac Brock, Laura Secord, and Canadien/British militia defended Upper/Lower Canada; later in 1837, reformers (Mackenzie & Papineau) rebelled for Responsible Government."]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Understand 'Historical Perspective' & Cause-and-Consequence", "content": "In Grade 7 History, events look completely different depending on WHICH group's shoes you stand in!", "analogy": "🎭 Drama & Sports Referee Analogy: When a referee makes a call in a championship gym game, Team A, Team B, and the crowd all experience the exact same event differently based on their goals. In 1763 or 1774, First Nations, French Canadiens, and British merchants each had completely different goals for land, trade, and culture.", "keyPoints": ["Why did Britain flip its policy from the Royal Proclamation (1763) to the Quebec Act (1774) in just 11 years? Because the Thirteen Colonies to the south were about to rebel (1775), and Britain desperately needed the French-speaking Canadiens in Quebec not to join the American Revolution!"]}, {"level": 3, "name": "APPLY", "subtitle": "Trace Cause -> Event -> Consequence Chains", "content": "Apply the 3-link Historical Chain to explain how the Treaty of Utrecht (1713) led to the Acadian Expulsion (1755):", "workedExample": {"prompt": "Connect 1713 to 1755 using Cause and Consequence:", "steps": ["Underlying Cause (1713): The Treaty of Utrecht gave French Acadia to Britain, leaving French Catholic Acadians living under British Protestant rule.", "Rising Tension (1730–1754): Acadians wanted to stay neutral ('the Neutral French'), refusing to take up arms against either the French or the Mi'kmaq (their allies and trading partners).", "Trigger & Consequence (1755): As the Seven Years' War loomed, British Governor Charles Lawrence demanded an unconditional oath to bear arms; when Acadian deputies refused, British troops burned their farms and deported ~11,000 Acadians across the Atlantic and to Louisiana (where 'Acadian' became 'Cajun')."]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare the Royal Proclamation (1763) vs. The Quebec Act (1774)", "content": "This comparison is one of the most important quiz and assignment topics in Ontario Grade 7 History:", "comparisonTable": {"headers": ["Feature", "Royal Proclamation of 1763", "Quebec Act of 1774"], "rows": [["Goal toward Canadiens", "Assimilation (make Quebec British in language, laws, and Protestant religion)", "Accommodation / Biculturalism (protect French culture to keep Quebec loyal)"], ["Language & Religion", "Catholics barred from holding government office (Test Act)", "Guaranteed free practice of Catholicism; restored church tithes; new oath allowed Catholics in council"], ["Legal & Land System", "Replaced French laws with British law; ended new seigneuries", "Restored French Civil Law (for property/family) + British Criminal Law; protected Seigniorial System"], ["Territory & Indigenous Lands", "Created vast 'Indian Territory' west of Appalachians; Crown treaty required for land purchases", "Expanded Quebec's borders into the Ohio Valley, angering the 13 American Colonies"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Evaluate Who Truly Won the War of 1812 from Multiple Perspectives", "content": "Both the United States and British North America claimed victory in 1814, but what about First Nations allies led by Tecumseh?", "keyPoints": ["🇬🇧🇨🇦 British North America Perspective: Successful defence—American invasions were repelled, borders stayed intact (Treaty of Ghent), and a shared sense of Canadian identity began to grow.", "🇺🇸 American Perspective: Felt they defended their sovereignty at sea against the Royal Navy.", "🪶 First Nations Perspective (Tragic Loss): Despite Tecumseh's crucial alliance with General Brock that saved Upper Canada in 1812, Tecumseh was killed at the Battle of the Thames (1813), and the Treaty of Ghent failed to create the independent Indigenous confederacy homeland Britain had promised."]}, {"level": 6, "name": "CREATE", "subtitle": "Write a Multi-Perspective Historical Dispatch from 1774", "content": "Synthesize historical evidence to write two contrasting primary-source diary reactions to the Quebec Act of 1774: one from a Canadien Habitant along the St. Lawrence River, and one from a merchant in the Thirteen Colonies.", "keyPoints": ["Historical Empathy Check: Use accurate period terms (seigneurie, dîme/tithe, Ohio Valley, French civil law, Governor Carleton)."]}], "questions": [{"id": "hist-q1", "bloomLevel": 4, "bloomTag": "ANALYZE & EVALUATE", "title": "Term 2 Head Start: Royal Proclamation (1763) vs. Quebec Act (1774)", "prompt": "Why did the British government change its strategy in Quebec from Assimilation in the Royal Proclamation of 1763 to Accommodation in the Quebec Act of 1774? In your multi-step response:\n(a) Explain what Britain tried to do in 1763 and why it failed.\n(b) Identify 3 specific rights or systems restored to French Canadiens in the Quebec Act of 1774.\n(c) Explain how the Thirteen American Colonies reacted to the Quebec Act and why.", "step1_deconstruct": {"instruction": "STOP & PLAN: Break down the 3 required parts (a, b, c) and identify key historical terms.", "guidingQuestions": ["What do 'Assimilation' (1763) and 'Accommodation' (1774) mean?", "Why didn't English settlers flood into Quebec after 1763 as Britain expected?", "Why was Britain worried about the Thirteen Colonies in 1774?"], "modelPlan": "(a) Define assimilation in 1763 and explain that French Canadiens still outnumbered British settlers 70,000 to <1,000. (b) List the 3 restored pillars in 1774: Catholic rights, French Civil Law, and the Seigniorial system. (c) Explain why the 13 Colonies called it one of the 'Intolerable Acts' (Ohio Valley land + fear of Catholic/appointed government)."}, "step2_anchor": {"instruction": "ANCHOR TIMELINE FACTS: 1763 vs. 1774.", "referenceItems": ["Population Reality (1763–1774): Over 99% of non-Indigenous residents in Quebec were French Catholic Canadiens; Governors James Murray and Guy Carleton realized assimilation was impossible.", "Three Pillars of 1774: (1) Freedom of Catholic worship & holding office, (2) French Civil Law alongside British Criminal Law, (3) Seigniorial land system preserved, plus boundaries expanded into the Ohio Valley."]}, "step3_substeps": [{"label": "Step 3a: Part (a) — Explain Britain's 1763 Assimilation goal and why Governor Carleton realized it needed to change by 1774", "placeholder": "In the Royal Proclamation of 1763, Britain tried to assimilate the Canadiens by... However, this failed because...", "hint": "Mention the huge population difference (over 70,000 Canadiens vs. only a few hundred British merchants) and rising unrest in the 13 Colonies!", "modelSubAnswer": "In the Royal Proclamation of 1763, Britain attempted to assimilate the French Canadiens by imposing British laws, discouraging the seigniorial system, and barring Catholics from government office. However, this policy failed because hardly any British colonists moved north to Quebec (leaving over 70,000 Canadiens outnumbering British settlers by more than 100 to 1). By 1774, with rebellion brewing in the Thirteen American Colonies, Governor Guy Carleton warned Britain that it had to win the loyalty of the Canadiens so they wouldn't join the Americans."}, {"label": "Step 3b: Part (b) — List and explain 3 specific things the Quebec Act of 1774 restored or protected for the Canadiens", "placeholder": "1. Religion: ...\n2. Law: ...\n3. Land System: ...", "hint": "Cover Catholic religion/office, French Civil Law, and the Seigniorial system.", "modelSubAnswer": "The Quebec Act of 1774 accommodated the Canadiens in three major ways:\n1. Religion & Politics: It guaranteed freedom of worship for Roman Catholics, allowed the Church to collect tithes, and created a new oath so Catholics could serve on the governing council.\n2. Dual Legal System: It restored French Civil Law for property and family matters while keeping British Criminal Law.\n3. Land System: It officially protected the French Seigniorial System of long riverfront strip farms."}, {"label": "Step 3c: Part (c) — Explain why the Thirteen American Colonies were furious about the Quebec Act of 1774", "placeholder": "Colonists in the Thirteen Colonies were angry about the Quebec Act because it expanded Quebec's border into...", "hint": "Where did American land speculators want to expand? (The Ohio Valley!)", "modelSubAnswer": "Colonists in the Thirteen American Colonies were outraged and labeled the Quebec Act one of the 'Intolerable Acts' because it expanded Quebec's territory south into the fertile Ohio River Valley—land that American colonists had fought for and wanted to settle. They also resented Britain granting official rights to the Catholic Church and governing Quebec without an elected assembly, which helped spark the American Revolution in 1775."}], "step4_checks": ["Did I clearly contrast 'Assimilation' (1763) with 'Accommodation' (1774)?", "Did I include all 3 restored rights in Part (b) (Catholicism, French Civil Law, Seigniorial System)?", "Did I explain the Ohio Valley connection in Part (c)?"], "step5_modelAnswer": {"basicAnswer": "(a) Britain wanted Canadiens to stay loyal during the American Revolution. (b) Kept Catholic religion, French civil law, and seigneuries. (c) Americans wanted the Ohio Valley land.", "expandedAnswer": "Complete Grade 7+ History Response (O. Macri Term 2 Exemplar):\n(a) From Assimilation to Accommodation: In 1763, the Royal Proclamation aimed to assimilate French Canadiens into British culture. However, few English settlers moved to Quebec, leaving over 70,000 Canadiens as the vast majority. As tensions escalated toward war in the Thirteen Colonies, Governor Guy Carleton convinced Britain to switch to accommodation in 1774 to secure Canadien loyalty.\n(b) Three Restored Rights in the Quebec Act (1774): First, it protected the Roman Catholic faith and allowed Catholics to hold government office via a modified oath. Second, it restored French Civil Law alongside British Criminal Law. Third, it legalized and preserved the Seigniorial land system.\n(c) Reaction of the Thirteen Colonies: American colonists viewed the Quebec Act as one of the 'Intolerable Acts' because it handed the resource-rich Ohio Valley to Quebec, blocking American westward expansion, and protected French Catholic institutions.", "extensionPrompt": "Extension Question: When American armies invaded Quebec in 1775 expecting Canadiens to join them, how did the Habitants and Catholic clergy actually respond?"}}], "studyFirstTag": "Term 2 Head Start: 1713–1850 Timeline & 1763 vs. 1774", "lessons": [{"id": "hist-u1-l1", "title": "Lesson 1.1: New France, 1763 Royal Proclamation vs. 1774 Quebec Act", "readTime": "3 min read", "bigIdea": "Get a Term 2 head start with O. Macri! Understand how Britain flipped from trying to erase French culture (1763) to protecting it (1774).", "paragraphs": ["In the 1700s, Britain and France were fierce rivals fighting for control of North America. After the Treaty of Utrecht (1713) handed Acadia to Britain, tensions exploded into the Seven Years' War (1756–1763), leading to the tragic Expulsion of the Acadians (1755) and Britain's victory at the Battle of the Plains of Abraham (1759).", "When Britain took control of New France in 1763, King George III issued the Royal Proclamation of 1763. Its goal toward the French-speaking Canadiens was ASSIMILATION—replacing French laws with British laws and banning Catholics from government office—while also recognizing First Nations hunting lands west of the Appalachian Mountains.", "Just 11 years later, Britain did a complete U-turn! Why? Over 70,000 French Canadiens still massively outnumbered British settlers, and the Thirteen American Colonies to the south were about to rebel! To keep Quebec loyal, Britain passed the Quebec Act of 1774 (ACCOMMODATION): restoring Catholic rights, French Civil Law, and the Seigniorial farm system, and expanding Quebec into the Ohio Valley—which infuriated the American colonists."], "keyTakeaway": "1763 Royal Proclamation = Assimilation (failed!) → 1774 Quebec Act = Accommodation (kept Quebec loyal during the American Revolution!).", "deepReadTitle": "⚔️ Quick Look Ahead: War of 1812 & 1837 Rebellions", "deepReadText": "In 1812–1814, General Isaac Brock, Shawnee leader Tecumseh, Laura Secord, and Canadian militia defended British North America against U.S. invasions. Later in 1837–1838, reformers (William Lyon Mackenzie in Upper Canada and Louis-Joseph Papineau in Lower Canada) challenged elite councils, paving the way for Responsible Government (democracy).", "quickCheck": {"question": "Why did Britain pass the Quebec Act of 1774 restoring French Civil Law, Catholic rights, and the Seigniorial System?", "options": ["Because France won the Seven Years' War.", "To win and keep the loyalty of the 70,000+ French Canadiens as rebellion grew in the Thirteen American Colonies.", "Because American colonists asked Britain to expand Quebec."], "correctIdx": 1, "explanation": "Governor Guy Carleton warned Britain that assimilation had failed and accommodating the Canadiens was essential to prevent Quebec from joining the American Revolution!"}, "videos": [{"id": "HHmrN_R4diE", "title": "The Royal Proclamation of 1763 — A Law That Shaped Canada", "channel": "Super Simple Sheets", "why": "Term 2 head start on 1763 Assimilation & First Nations treaty foundations."}, {"id": "BDrbu_68GF8", "title": "The Quebec Act of 1774 Explained: A Landmark in Canadian History", "channel": "Super Simple Sheets", "why": "Explains why Britain switched to Accommodation in 1774 and how it shaped Canada."}]}]}], "friendlySub": "Term 2 head start: New France, 1763, 1774 & War of 1812", "accent": "#d97706"}, {"id": "pe", "code": "PPL7 / Health & PE 7", "name": "Health & Physical Education", "teacher": "DK & O. Macri", "status": "Progressing Well", "tier": "Tier 3: Personal Goal & Strength", "tierClass": "tier-goal", "icon": "🏀", "reportComment": "PE: Zaid demonstrates considerable effectiveness in fitness activities and sport-specific skills. He usually shows safety awareness and is an active contributor in PE. (DK) | He shared that his favourite parts of school are the larger cafeteria and gym. Going forward, we will work on managing his own behaviour in class while supporting his personal goal to improve in gym. (O. Macri)", "nextSteps": ["Track and achieve your personal goal to improve in gym using the F.I.T.T. & S.M.A.R.T. Fitness Planner", "Transfer the self-discipline, focus, and teamwork you show in gym directly into classroom self-regulation", "Apply biomechanics (centre of gravity, force, follow-through) to level up sport-specific skills"], "units": [{"id": "pe-u1", "title": "Unit 1: Biomechanics, F.I.T.T. Fitness Conditioning & Self-Regulation Transfer", "curriculumStrand": "Ontario Grade 7 Health & Physical Education: Active Living (Strand B), Movement Competence (Strand C) & SEL Skills (Strand A)", "svgDiagram": "pe_biomechanics_svg", "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Core Principles: F.I.T.T. Training Formula & Phases of a Movement Skill", "content": "You already show 'considerable effectiveness in fitness activities and sport-specific skills' (DK)! Here is the sport-science framework to push your personal gym goal to the next level:", "keyPoints": ["🏋️‍♂️ The F.I.T.T. Conditioning Formula:\n• F — Frequency: How often you train (e.g., 4–5 days per week).\n• I — Intensity: How hard you work (e.g., Target Heart Rate Zone: 65%–85% of Max HR).\n• T — Time: How long each session lasts (e.g., 30–60 minutes of active movement).\n• T — Type: The specific kind of exercise (Cardiorespiratory endurance, Muscular strength/endurance, Flexibility, or Sport-specific agility).", "🎯 The 3 Phases of Every Sport Skill:\n• Phase 1: Preparation (wide base of support, knees bent, low centre of gravity, eyes on target).\n• Phase 2: Execution (transferring momentum from legs -> core -> arms/feet at the point of release or strike).\n• Phase 3: Follow-Through (continuing motion toward the target to maximize accuracy and absorb force safely)."]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "How Gym Self-Discipline Transfers to Classroom Self-Regulation", "content": "O. Macri and D. Forbes noted two superpowers you already have in gym and group settings: high energy and strong teamwork. Why do top athletes practice 'Impulse Control'?", "analogy": "⚽ Offside Trap & Pump-Fake Analogy: In basketball or soccer, if a defender lunges at the first pump-fake without waiting a split-second to read the play, they get fouled out. In class, blurting out an answer or rushing a math step is just like jumping at a pump-fake! Pausing 3 seconds to raise your hand or double-check your work is the exact same athletic discipline.", "keyPoints": ["The 3-Second Athlete Reset: (1) Breathe in through the nose (just like trombone breathing!), (2) Lock eyes on the play/teacher, (3) Execute with control (raise hand / write the step)."]}, {"level": 3, "name": "APPLY", "subtitle": "Apply Biomechanics & Science (Centre of Gravity) to Gym Performance", "content": "Notice how Grade 7 Science (Structures & Forces) and Grade 7 PE connect directly:", "workedExample": {"prompt": "How do you make yourself nearly impossible to knock off balance when playing defence in basketball or shielding the ball in soccer?", "steps": ["Step 1 (Lower Centre of Gravity): Bend your knees and hips to bring your centre of mass closer to the gym floor.", "Step 2 (Widen Base of Support): Place your feet shoulder-width (or wider) apart in a staggered athletic stance.", "Step 3 (Keep Line of Gravity Inside Base): Keep your torso balanced between your feet so external pushing forces cannot tip your line of gravity outside your shoes."]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Analyze Offensive vs. Defensive Tactical Principles Across Territory Games", "content": "Compare tactical decisions across basketball, soccer, ultimate frisbee, and floorball:", "comparisonTable": {"headers": ["Game Situation", "Space & Positioning", "Team Communication", "Self-Regulation & Safety (DK)"], "rows": [["On Offence (With Possession)", "Spread the court/field ('Create Space'), cut into open lanes, give-and-go triangles", "Call for passes clearly, encourage teammates after missed shots", "Control speed near walls/bleachers, avoid charging"], ["In Transition", "Sprint back immediately or push fast break before defence sets", "Point and call out unmarked opponents", "Keep head up to avoid collisions in high-traffic zones"], ["On Defence (Without Possession)", "Compress space around the goal/key, stay between opponent and basket ('Goal-side')", "Call switches and screens early", "Defend with feet and balance rather than reaching/fouling"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Evaluate a Personal Gym & Classroom Goal Plan Using S.M.A.R.T. Criteria", "content": "Why does 'I want to get better at gym' fail, while a S.M.A.R.T. plan succeeds?", "keyPoints": ["❌ Vague Goal: 'I want to improve in gym and behave better in class.'", "✅ S.M.A.R.T. Goal (Specific, Measurable, Achievable, Relevant, Time-bound): 'Over the next 4 weeks, I will improve my cardiovascular stamina by completing the 12-minute gym run without walking breaks, improve my free-throw/passing accuracy to 7/10 using a full follow-through, and practice self-regulation in academic classes by raising my hand and waiting to be called on 100% of the time.'"]}, {"level": 6, "name": "CREATE", "subtitle": "Design Your 4-Week Longfields-Davidson Heights Gym & Focus Gameplan", "content": "Build a personalized training and self-regulation tracker combining F.I.T.T. conditioning, biomechanics, and classroom focus.", "keyPoints": ["Combines O. Macri's goal ('managing his own behaviour in class while supporting his personal goal to improve in gym') and DK's feedback ('considerable effectiveness in fitness activities and sport-specific skills')."]}], "questions": [{"id": "pe-q1", "bloomLevel": 6, "bloomTag": "APPLY & CREATE", "title": "Personal Gym Improvement & Classroom Self-Regulation Gameplan", "prompt": "On your report card, O. Macri wrote: 'He shared that his favourite parts of school are the larger cafeteria and gym. Going forward, we will work on managing his own behaviour in class while supporting his personal goal to improve in gym.' And DK noted you already show 'considerable effectiveness in fitness activities and sport-specific skills.'\n\nDesign a complete 3-part Personal Action Plan:\n(a) Use the F.I.T.T. formula (Frequency, Intensity, Time, Type) to design a weekly fitness routine to boost your stamina and speed in the gym.\n(b) Use the 3 Phases of Movement (Preparation, Execution, Follow-Through) to explain how you will level up one specific sport skill (e.g., basketball shot/pass, soccer strike, volleyball serve, or badminton smash).\n(c) Explain your 'Athlete Reset' strategy for transferring your gym focus and teamwork into managing classroom behaviour (raising your hand instead of blurting out, and staying on task during independent work).", "step1_deconstruct": {"instruction": "STOP & PLAN: Identify the 3 components of your personal gameplan.", "guidingQuestions": ["What do the 4 letters of F.I.T.T. stand for in Part (a)?", "Which specific sport skill will I break down into Preparation, Execution, and Follow-Through in Part (b)?", "How will I connect athletic discipline to classroom self-regulation in Part (c)?"], "modelPlan": "(a) Build a 4-element F.I.T.T. plan for stamina/agility. (b) Analyze the 3 biomechanical phases of a basketball jump shot or soccer pass. (c) Create a 3-step 'Athlete Reset' rule for raising my hand and staying focused during independent work."}, "step2_anchor": {"instruction": "ANCHOR FRAMEWORKS: F.I.T.T. + 3 Phases of Movement + Athlete Reset.", "referenceItems": ["F.I.T.T.: Frequency (days/wk), Intensity (heart rate/effort), Time (minutes), Type (cardio/agility/strength)", "3 Movement Phases: Preparation (stance/balance) -> Execution (force transfer) -> Follow-Through (accuracy/control)"]}, "step3_substeps": [{"label": "Step 3a: Part (a) — Write your F.I.T.T. Weekly Conditioning Plan for Gym Stamina & Agility", "placeholder": "Frequency: ...\nIntensity: ...\nTime: ...\nType: ...", "hint": "Be specific with numbers (e.g., 4 days/week, 30–45 minutes, shuttle runs + bodyweight strength).", "modelSubAnswer": "• Frequency: 4 to 5 days per week (PE classes + lunchtime intramurals/after-school practice).\n• Intensity: Moderate-to-vigorous (70%–85% max heart rate during shuttle drills and scrimmages).\n• Time: 40 minutes per session (5 min dynamic warm-up, 30 min active drills/game play, 5 min cooldown stretch).\n• Type: Interval sprints and shuttle runs (cardio/agility) + planks, push-ups, and squats (core/leg power)."}, {"label": "Step 3b: Part (b) — Break down 1 specific sport skill into Preparation, Execution, and Follow-Through", "placeholder": "Chosen Skill: ...\n1. Preparation: ...\n2. Execution: ...\n3. Follow-Through: ...", "hint": "Mention Centre of Gravity and Base of Support in the Preparation phase!", "modelSubAnswer": "Chosen Skill: Basketball Jump Shot / Accurate Chest Pass\n1. Preparation: Widen base of support to shoulder-width, bend knees to lower centre of gravity, square shoulders and eyes to the target.\n2. Execution: Push explosively through the legs, transfer momentum smoothly through the core and shooting/passing arm, and release the ball off the fingertips with backspin.\n3. Follow-Through: Extend the elbow fully and snap the wrist downward ('goose-neck' follow-through) pointing directly at the rim or teammate's chest to guarantee accuracy."}, {"label": "Step 3c: Part (c) — Write your Classroom 'Athlete Reset' Protocol (Connecting Gym Discipline to O. Macri, D. Forbes & N. Bishop's classes)", "placeholder": "Just like an athlete doesn't jump at a pump-fake or leave a play half-finished, in class I will:\n1. When I know an answer: ...\n2. During independent work time: ...", "hint": "Address (1) raising your hand instead of blurting out, and (2) completing 15-minute independent work blocks without needing teacher prompts.", "modelSubAnswer": "Classroom Athlete Reset Protocol:\n1. Impulse Control (No Blurting): Just like waiting for the whistle in gym before starting a drill, when I know the answer in D. Forbes's or O. Macri's class, I will take one calm breath, write my keyword on my page, and raise my hand quietly.\n2. Independent Work Stamina: Just like pacing myself in a 12-minute fitness run, during individual work in N. Bishop's or E. Catana's class, I will break my assignment into 3 small quarters and finish every section before looking up or talking to peers."}], "step4_checks": ["Did I include all 4 parts of F.I.T.T. (Frequency, Intensity, Time, Type)?", "Did I include all 3 biomechanical phases (Preparation, Execution, Follow-Through)?", "Did I connect my personal gym goal directly to classroom self-regulation and stamina?"], "step5_modelAnswer": {"basicAnswer": "I will run more in gym, practice shooting, and raise my hand in class.", "expandedAnswer": "Complete Personal Gym & Self-Regulation Action Plan:\n(a) F.I.T.T. Conditioning Plan: Frequency: 4–5 times weekly; Intensity: 75%–85% max heart rate; Time: 40 minutes per session; Type: High-intensity shuttle runs, defensive footwork slides, and core/lower-body strength exercises.\n(b) Biomechanical Skill Breakdown (Basketball Shooting/Passing): Preparation: Establish a balanced, shoulder-width base of support with bent knees (low centre of gravity). Execution: Transfer upward force from legs through core and extend the arm smoothly. Follow-Through: Hold the wrist snap toward the target to ensure consistent trajectory.\n(c) Classroom Athlete Transfer: I will treat classroom focus like championship game discipline—using a 3-second pause to jot my thought down and raise my hand instead of blurting out, and using 'quarter-by-quarter' stamina to finish all independent classwork with zero teacher prompts.", "extensionPrompt": "Live Goal Check: Open the Gym & Stamina Tracker at the top of this portal and log your first completed focus sprint today!"}}], "studyFirstTag": "Personal Gym Goal: F.I.T.T. Training + 3-Phase Sport Skills", "lessons": [{"id": "pe-u1-l1", "title": "Lesson 1.1: The F.I.T.T. Formula, 3-Phase Sport Skills & Athlete Focus", "readTime": "3 min read", "bigIdea": "You already shine in gym—now use sport science (F.I.T.T. + Biomechanics) to level up your skills and carry that same athlete self-control into every class!", "paragraphs": ["Great athletes don't just practice randomly—they train using the F.I.T.T. formula: Frequency (how many days a week), Intensity (how hard your heart works), Time (how many minutes), and Type (cardio stamina, agility drills, or strength).", "Every sport skill—shooting a basketball, passing a soccer ball, serving a volleyball—succeeds when you nail 3 Biomechanical Phases: (1) Preparation (wide base of support, bent knees for a low Centre of Gravity, eyes locked on target), (2) Execution (power rising from legs → core → arm/foot), and (3) Follow-Through (extending straight toward your target for accuracy).", "Best of all, pro athletes master Impulse Control! On defence, jumping at the first pump-fake gets you fouled out. Waiting one calm beat to read the play is the EXACT same skill as pausing 3 seconds in class to raise your hand instead of blurting out!"], "keyTakeaway": "F.I.T.T. builds fitness stamina; Preparation → Execution → Follow-Through builds precision; the 3-Second Athlete Reset builds classroom self-regulation.", "deepReadTitle": "🎯 Turning 'Get Better in Gym' into a S.M.A.R.T. Goal", "deepReadText": "Specific, Measurable, Achievable, Relevant, Time-bound: Instead of 'improve in gym', set a measurable target like 'Complete 4 active fitness sessions per week and hit 7/10 free throws/passes using a full follow-through within 4 weeks.'", "quickCheck": {"question": "In the Preparation phase of defence or shooting, why should you bend your knees and widen your stance?", "options": ["To raise your centre of gravity higher off the floor.", "To lower your centre of gravity and widen your base of support for maximum stability.", "To make it harder to move sideways."], "correctIdx": 1, "explanation": "Just like Grade 7 Science (Structures), a wider base + lower centre of gravity makes you stable and explosive!"}, "videos": [{"id": "0BTIzXOZJmI", "title": "Brain Bites — The F.I.T.T. Principle for Personal Fitness", "channel": "Lynn Hefele", "why": "Quick, memorable visual breakdown of Frequency, Intensity, Time, and Type for your Gym goal!"}]}]}], "friendlySub": "F.I.T.T. gym goal plan, sport biomechanics & focus habits", "accent": "#ea580c"}, {"id": "arts", "code": "ARTS7 / Music, Drama & Visual Arts", "name": "The Arts (Music, Drama, Art)", "teacher": "JS (Music/Drama) & E. Catana (Visual Arts)", "status": "Progressing Well", "tier": "Tier 3: Creative Mastery", "tierClass": "tier-strong", "icon": "🎺", "reportComment": "MUSIC: Zaid follows routines and assembles the trombone correctly. He often uses proper posture and breathing. He can usually form the appropriate embouchure and produce the correct pitch. (JS) | DRAMA: Zaid participates appropriately in community building games/activities and is able to identify how audience behaviour impacts a performance. (JS) | ART: Zaid applies elements of design to create works of art. Zaid is encouraged to continue to develop and explore creative ideas. (EC)", "nextSteps": ["Music (Trombone — JS): Move from 'often/usually' to 'always' locking in posture, deep diaphragmatic breathing, firm corner embouchure, and exact slide positions (1st to 7th)", "Drama (JS): Analyze how active vs. disruptive audience behaviour changes actors' focus, projection, and stage energy", "Visual Arts (E. Catana): Combine all 7 Elements of Design with Principles of Design (contrast, emphasis, balance) to expand creative compositions"], "units": [{"id": "arts-u1", "title": "Unit 1: Trombone Pitch & Acoustics (Music), Audience Impact (Drama) & Elements of Design (Art)", "curriculumStrand": "Ontario Grade 7 The Arts: Music (C1, C2), Drama (B1, B3) & Visual Arts (D1, D2)", "svgDiagram": "trombone_arts_svg", "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Core Anchors across Music (Trombone), Drama, and Visual Arts", "content": "You are progressing well across all three Arts strands! Keep these essential anchors ready:", "keyPoints": ["🎺 Music (Trombone — JS):\n• Embouchure: Firm corners of the mouth (like saying 'Mmm'), flat chin, relaxed vibrating centre of the lips (50/50 upper-to-lower lip ratio in the mouthpiece).\n• Breathing & Posture: Sit tall on the front edge of the chair, feet flat, left hand supporting the trombone weight, right hand moving the slide lightly with two fingers and thumb; breathe deeply from the diaphragm (belly expands, shoulders stay relaxed).\n• The 7 Slide Positions & Concert Bb Major Scale: Bb (1st pos.) -> C (6th pos.) -> D (4th pos.) -> Eb (3rd pos.) -> F (1st pos.) -> G (4th pos.) -> A (2nd pos.) -> High Bb (1st pos.).", "🎭 Drama (JS):\n• The Actor-Audience Feedback Loop: Live theatre requires two active roles—performers (focus, character commitment, vocal projection, blocking) and the audience (active listening, eye contact, respectful silence during tension, supportive applause).", "🎨 Visual Arts (E. Catana):\n• The 7 Elements of Design: Line, Shape (2D), Form (3D), Space (positive/negative, foreground/background, perspective), Colour (warm/cool, complementary), Texture (tactile/visual), and Value (lightness/darkness shading)."]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "How Trombone Physics, Embouchure & Slide Length Control Pitch", "content": "Why can the trombone play BOTH a low Bb and a higher F in 1st position without moving the slide at all?", "analogy": "🔬 Science & Music Connection: A trombone is an acoustic brass tube! Extending the slide from 1st to 7th position makes the column of vibrating air LONGER, which lowers the pitch. Tightening the corners of your embouchure and using faster air speed makes your lips buzz at a higher frequency (Harmonic Series / Partials), jumping up to higher notes in the exact same slide position!", "keyPoints": ["Flat vs. Sharp on Trombone: If a note sounds slightly flat (too low), pull the slide slightly IN (closer to 1st) and support with faster warm air. If it sounds sharp (too high), push the slide slightly OUT."]}, {"level": 3, "name": "APPLY", "subtitle": "Troubleshoot Trombone Tone & Apply the 7 Elements of Design", "content": "Apply JS's and E. Catana's feedback to upgrade performance and artwork:", "workedExample": {"prompt": "Problem: When playing Concert F or G on the trombone, the sound comes out airy or cracks to the wrong partial. How do you fix it in 3 steps?", "steps": ["Step 1 (Posture & Diaphragm Check): Sit tall on the front half of your chair and take a deep 'yawn' breath from the diaphragm so the air stream is steady and pressurized.", "Step 2 (Embouchure Check): Firm the corners of your mouth ('Mmm'), keep your chin flat and pointed down, and do NOT puff your cheeks or press the mouthpiece too hard against your lips.", "Step 3 (Slide & Ear Check): Buzz the target pitch first or hear it in your head, align your slide precisely (1st position for F, 4th position—bell rim even with slide brace/end—for G), and start the note with a clean 'Tah' or 'Dah' tongue articulation."]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Analyze How Audience Behaviour Impacts Drama Performances & Classroom Learning", "content": "JS praised your ability to 'identify how audience behaviour impacts a performance.' Notice how this exact insight applies to both Drama AND every classroom at Longfields-Davidson Heights!", "comparisonTable": {"headers": ["Audience / Class Behaviour", "Impact on Performers / Speaker", "Impact on Group Atmosphere", "Connection to Self-Regulation Goal"], "rows": [["Active Eye Contact & Quiet Focus", "Builds performer confidence, sharpens timing, allows subtle vocal emotion", "Creates trust so peers take creative risks", "Staying focused during instruction helps the whole class learn faster"], ["Blurting Out / Side Conversations", "Breaks actor concentration ('breaks character'), drowns out quiet dialogue", "Creates anxiety and derails the scene's rhythm", "Raising your hand instead of blurting protects everyone's focus!"], ["Supportive Feedback & Applause", "Validates effort and encourages deeper creative exploration", "Strengthens community building (Zaid's Collaboration = G!)", "Using your strong encouragement skills to lift up peers"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Critique a Visual Art Composition Using Elements & Principles of Design", "content": "E. Catana encouraged you to 'continue to develop and explore creative ideas.' Use this Art Critique Checklist to expand a simple sketch into a complete artwork:", "keyPoints": ["Check 1 (Space & Depth): Did I leave empty white paper around one small drawing in the middle, OR did I develop a Foreground, Middle Ground, and Background?", "Check 2 (Value & Texture): Did I shade with a full range of Value (highlight, mid-tone, core shadow, cast shadow) and add visual Texture so 2D shapes look like 3D Forms?", "Check 3 (Colour & Contrast): Did I use Complementary Colours (e.g., Blue/Orange, Red/Green, Purple/Yellow) or Warm-vs-Cool contrast to make the focal point pop?"]}, {"level": 6, "name": "CREATE", "subtitle": "Synthesize Music, Drama & Visual Arts in a Creative Design Plan", "content": "Combine trombone acoustics, dramatic staging, and visual design elements into an original artistic concept.", "keyPoints": ["Demonstrates mastery across JS's and E. Catana's Grade 7 Arts expectations."]}], "questions": [{"id": "arts-q1", "bloomLevel": 5, "bloomTag": "APPLY & EVALUATE", "title": "Triple-Arts Mastery Lab: Trombone Pitch (JS), Audience Impact (JS) & Design Expansion (EC)", "prompt": "Answer all 3 Arts challenges in deep multi-step work based on your report card strengths and next steps:\n(a) MUSIC (JS): Explain how posture, diaphragmatic breathing, embouchure, and slide position work together on the trombone to play a clear, in-tune Concert F (1st position) followed by a Concert D (4th position).\n(b) DRAMA (JS): Explain two specific ways that audience behaviour impacts a live drama performance, and connect this to why raising your hand (instead of blurting out) matters during classroom discussions.\n(c) VISUAL ARTS (E. Catana): Imagine you have drawn a basic pencil outline of a basketball player or trombonist in the centre of a blank page. Explain how you would apply at least 4 Elements of Design (Space, Value, Colour, Line/Texture) to expand that simple sketch into a rich, creative composition.", "step1_deconstruct": {"instruction": "STOP & PLAN: Make sure you address all 3 Arts strands—(a) Trombone/Music, (b) Drama/Audience, and (c) Visual Arts/Elements of Design.", "guidingQuestions": ["Part (a): What 4 physical factors control trombone tone and pitch from F (1st) to D (4th)?", "Part (b): How does an audience affect actors' focus and confidence, and how does that mirror classroom self-regulation?", "Part (c): Which 4 of the 7 Elements of Design will I apply to transform a plain central outline into a full composition?"], "modelPlan": "(a) Detail posture, diaphragm breath, firm-corner embouchure, and slide shift from 1st to 4th position. (b) Analyze the actor-audience loop and connect it to classroom hand-raising. (c) Apply Space (foreground/background), Value (3D shading), Colour (warm/cool contrast), and Line/Texture."}, "step2_anchor": {"instruction": "ANCHOR TERMS: Trombone Technique + Drama Loop + 7 Elements of Design.", "referenceItems": ["Trombone: Diaphragmatic breathing, Embouchure (firm corners, flat chin, buzzing centre), Articulation ('Tah'), Slide Positions (1st = closed, 4th = just past the bell).", "7 Elements of Design: Line, Shape, Form, Space, Colour, Texture, Value."]}, "step3_substeps": [{"label": "Step 3a: Part (a) MUSIC — Explain the step-by-step technique to play a clear Concert F (1st pos.) to Concert D (4th pos.) on trombone", "placeholder": "1. Posture & Breathing: ...\n2. Embouchure: ...\n3. Slide Position & Air Adjustment from F (1st) to D (4th): ...", "hint": "Mention sitting tall, deep belly breathing, firm mouth corners ('Mmm'), and moving the slide smoothly from 1st to 4th position (just past the bell).", "modelSubAnswer": "1. Posture & Breathing: Sit tall on the front edge of the chair with shoulders relaxed and take a deep diaphragmatic breath so the air column is steady and supported.\n2. Embouchure: Form a balanced embouchure with a flat chin, firm corners ('Mmm'), and unpuffed cheeks so the centre of the lips vibrates cleanly inside the mouthpiece.\n3. Slide & Pitch Control: Start Concert F in 1st position (slide fully in) with a crisp 'Tah' tongue articulation and fast air. To play Concert D, smoothly move the slide out with two fingers and thumb to 4th position (slide brace aligned just past the rim of the bell) while relaxing the lip tension slightly for the lower partial."}, {"label": "Step 3b: Part (b) DRAMA — Explain 2 ways audience behaviour impacts performers AND connect it to classroom self-regulation", "placeholder": "In Drama, when the audience shows active listening vs. side talking, it affects the actors by... This connects to classroom discussions because...", "hint": "Think about actor concentration, vocal projection, and risk-taking vs. breaking focus when someone blurts out.", "modelSubAnswer": "In Drama, audience behaviour directly shapes the quality of a performance in two ways: (1) Focus & Timing—when the audience is quiet and attentive, actors can stay in character, hear their scene partners' cues, and deliver emotional moments without losing concentration; (2) Confidence & Risk-Taking—respectful eye contact and applause encourage performers to project their voices and commit fully to their roles. This connects directly to classroom self-regulation: when a student raises their hand instead of blurting out, it respects the teacher's and classmates' 'stage,' allowing everyone to think deeply without interruption."}, {"label": "Step 3c: Part (c) VISUAL ARTS — Expand a simple central outline sketch using 4 Elements of Design (Space, Value, Colour, Line/Texture)", "placeholder": "1. Space: ...\n2. Value & Form: ...\n3. Colour: ...\n4. Line & Texture: ...", "hint": "Turn the flat 2D Shape into a 3D Form with shading (Value), fill the background (Space), use warm/cool Contrast (Colour), and add motion lines/surface detail (Line & Texture)!", "modelSubAnswer": "To expand a basic outline into a rich creative artwork:\n1. Space (Foreground/Background): Add overlapping elements—place the rim of the basketball net or music stand in the foreground, the main figure in the middle ground, and a perspective gym court or concert stage in the background so negative space is activated.\n2. Value & Form: Apply gradual pencil or paint shading (highlights, mid-tones, core shadows, and cast shadows) to transform flat 2D shapes into 3D forms.\n3. Colour (Contrast): Use vibrant warm colours (reds, oranges, golds) on the main subject against cool background colours (deep blues and purples) to create strong focal emphasis.\n4. Line & Texture: Add expressive dynamic contour lines to show movement/sound waves and cross-hatching/stippling to capture the bumpy texture of a basketball or the metallic reflection of a brass trombone."}], "step4_checks": ["Music Check: Did I include posture, diaphragmatic breathing, embouchure, and slide positions (1st and 4th)?", "Drama Check: Did I explain 2 audience impacts AND connect them to raising my hand in class?", "Visual Arts Check: Did I explicitly name and apply at least 4 Elements of Design (Space, Value, Colour, Line/Texture)?"], "step5_modelAnswer": {"basicAnswer": "(a) Sit up straight, breathe deep, use good embouchure, move slide from 1st to 4th. (b) Good audiences help actors focus. (c) Add background, shading, colour, and texture.", "expandedAnswer": "Complete Grade 7+ Arts Portfolio Response (JS & E. Catana Standard):\n(a) Music (Trombone): Producing an accurate Concert F to Concert D requires sitting tall on the edge of the chair for full diaphragmatic breathing, forming a firm-cornered embouchure ('Mmm') without puffing cheeks, articulating cleanly with 'Tah' in 1st position for F, and smoothly extending the slide to 4th position (just past the bell) for D with steady air support.\n(b) Drama (Audience Impact): Audience behaviour controls both actor concentration and creative risk-taking. Disruptive noise breaks character and ruins comedic/dramatic timing, whereas attentive listening empowers performers to project and inhabit their roles. Similarly, practicing self-regulation by raising your hand in class protects the learning space for all peers.\n(c) Visual Arts (Expanding Creative Ideas): To expand a basic sketch, I would apply (1) Space by creating foreground, middle ground, and background depth; (2) Value to shade flat 2D shapes into 3D forms with highlights and cast shadows; (3) Colour by contrasting warm focal subjects against cool backgrounds; and (4) Line & Texture to convey physical movement and realistic surface detail.", "extensionPrompt": "Creative Bonus: Sketch or describe a poster combining your favourite things at school (Gym + Trombone + Science/Math) using at least 5 Elements of Design!"}}], "studyFirstTag": "Music, Drama & Art: Trombone Slide Map, Stage Focus & Design Elements", "lessons": [{"id": "arts-u1-l1", "title": "Lesson 1.1: Trombone Tone & Slide Physics, Drama Audience Loop & 7 Elements of Design", "readTime": "3 min read", "bigIdea": "Lock in steady breathing and firm embouchure on trombone (JS), respect the stage-audience loop in Drama, and expand art ideas with the 7 Elements of Design (EC).", "paragraphs": ["MUSIC (Trombone — JS): Your trombone is an acoustic air column! Pushing the slide out from 1st to 7th position lengthens the air tube and lowers the pitch. Meanwhile, sitting tall on the edge of your chair, taking a deep belly (diaphragmatic) breath, and forming a firm-cornered embouchure ('Mmm', flat chin, relaxed vibrating lip centre) lets you hit higher notes like Concert F (1st pos.) cleanly without cracking!", "DRAMA (JS): Live theatre runs on an Actor-Audience Feedback Loop. Attentive eye contact and quiet focus give performers the confidence to stay in character and nail their timing—whereas talking or blurting out breaks concentration. Notice how that same respect makes every classroom discussion stronger!", "VISUAL ARTS (E. Catana): To expand a basic pencil sketch into a standout Grade 7 artwork, layer the 7 Elements of Design: Line, Shape (2D), Form (3D), Space (foreground/middle ground/background), Colour (warm vs. cool contrast), Texture (surface feel), and Value (light-to-dark shading that makes flat shapes pop into 3D!)."], "keyTakeaway": "Trombone = Posture + Diaphragm Air + Firm Corners ('Mmm') + Exact Slide Position | Art Expansion = Fill Space + Shade Value + Contrast Colour!", "deepReadTitle": "🎺 Concert Bb Scale Slide Map (Quick Memorizer)", "deepReadText": "Bb (1st) → C (6th) → D (4th, just past the bell!) → Eb (3rd) → F (1st) → G (4th) → A (2nd) → High Bb (1st).", "quickCheck": {"question": "Which Element of Design uses light-to-dark shading (highlights and shadows) to make a flat 2D shape look like a 3D form?", "options": ["Line", "Value", "Outline"], "correctIdx": 1, "explanation": "Value (lightness and darkness shading) transforms flat 2D Shapes into realistic 3D Forms!"}, "videos": [{"id": "56RW-2f7W_c", "title": "Trombone Technique 101: Embouchure & Tone (Music)", "channel": "Practicing Musician", "why": "Directly supports JS's report card goal on trombone embouchure and clear pitch!"}, {"id": "dE8pUuSmnpc", "title": "The 7 Elements of Art Explained (Visual Arts)", "channel": "Miss Teresa Art", "why": "Supports E. Catana's Art goal: Line, Shape, Form, Space, Colour, Texture & Value."}]}]}], "friendlySub": "Trombone tone & slides, drama audience loop & 7 art elements", "accent": "#9333ea"}];

   <svg viewBox=\"0 0 800 280\" class=\"topic-svg\" role=\"img\" aria-label=\"Interactive Topographical Map of Eagle Peak and Pine River\">\n      <rect x=\"0\" y=\"0\" width=\"800\" height=\"280\" rx=\"14\" fill=\"#0f172a\"/>\n      <!-- Compass Rose -->\n      <g transform=\"translate(730, 55)\">\n        <circle cx=\"0\" cy=\"0\" r=\"32\" fill=\"#1e293b\" stroke=\"#475569\" stroke-width=\"2\"/>\n        <polygon points=\"0,-26 -6,-6 0,-12 6,-6\" fill=\"#ef4444\"/>\n        <polygon points=\"0,26 -6,6 0,12 6,6\" fill=\"#94a3b8\"/>\n        <text x=\"0\" y=\"-30\" fill=\"#f87171\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\">N</text>\n        <text x=\"0\" y=\"42\" fill=\"#94a3b8\" font-size=\"11\" text-anchor=\"middle\">S</text>\n        <text x=\"-38\" y=\"4\" fill=\"#94a3b8\" font-size=\"11\" text-anchor=\"middle\">W</text>\n        <text x=\"38\" y=\"4\" fill=\"#94a3b8\" font-size=\"11\" text-anchor=\"middle\">E</text>\n      </g>\n      <!-- Contour Lines: Sea Level 0m (Outer) to 160m (Inner) -->\n      <!-- 0m Sea Level Coastline -->\n      <ellipse cx=\"350\" cy=\"145\" rx=\"310\" ry=\"118\" fill=\"#064e3b\" fill-opacity=\"0.25\" stroke=\"#38bdf8\" stroke-width=\"3\" stroke-dasharray=\"6,3\"/>\n      <text x=\"615\" y=\"235\" fill=\"#38bdf8\" font-size=\"12\" font-weight=\"bold\">0 m (Sea Level)</text>\n      <!-- 20m, 40m, 60m, 80m contours (shifted left to show steep West vs gentle East!) -->\n      <ellipse cx=\"320\" cy=\"145\" rx=\"265\" ry=\"102\" fill=\"none\" stroke=\"#6ee7b7\" stroke-width=\"1.3\"/>\n      <ellipse cx=\"292\" cy=\"145\" rx=\"222\" ry=\"87\" fill=\"none\" stroke=\"#6ee7b7\" stroke-width=\"1.3\"/>\n      <ellipse cx=\"265\" cy=\"145\" rx=\"182\" ry=\"72\" fill=\"none\" stroke=\"#6ee7b7\" stroke-width=\"1.3\"/>\n      <ellipse cx=\"240\" cy=\"145\" rx=\"145\" ry=\"58\" fill=\"none\" stroke=\"#6ee7b7\" stroke-width=\"1.3\"/>\n      <!-- 100m BOLD INDEX CONTOUR (5 spaces above 0m!) -->\n      <ellipse cx=\"215\" cy=\"145\ f172a\"/>\n      <!-- Left: Vertical BEDMAS Funnel -->\n      <polygon points=\"30,25 430,25 390,62 70,62\" fill=\"#1d4ed8\"/>\n      <text x=\"230\" y=\"48\" fill=\"#fff\" font-size=\"14\" font-weight=\"bold\" text-anchor=\"middle\">1. BRACKETS: (−4)² − 3 × [ √144 + (−20)÷(−4) − 11 ]</text>\n      <polygon points=\"70,68 390,68 350,105 110,105\" fill=\"#2563eb\"/>\n      <text x=\"230\" y=\"91\" fill=\"#fff\" font-size=\"14\" font-weight=\"bold\" text-anchor=\"middle\">2. EXPONENTS &amp; ROOTS: (−4)² = +16  |  √144 = 12</text>\n      <polygon points=\"110,111 350,111 310,148 150,148\" fill=\"#3b82f6\"/>\n      <text x=\"230\" y=\"134\" fill=\"#fff\" font-size=\"14\" font-weight=\"bold\" text-anchor=\"middle\">3. DIV &amp; MULT (Left→Right): 16 − (3 × 6) = 16 − 18</text>\n      <polygon points=\"150,154 310,154 275,195 185,195\" fill=\"#10b981\"/>\n      <text x=\"230\" y=\"179\" fill=\"#0f172a\" font-size=\"14\" font-weight=\"bold\" text-anchor=\"middle\">4. ADD &amp; SUB: −8</text>\n\n      <!-- Right: D. Forbes Careless Error Shield -->\n      <rect x=\"460\" y=\"22\" width=\"320\" height=\"185\" rx=\"12\" fill=\"#1e293b\" stroke=\"#f59e0b\" stroke-width=\"2\"/>\n      <text x=\"620\" y=\"48\" fill=\"#fbbf24\" font-size=\"15\" font-weight=\"bold\" text-anchor=\"middle\">🛡️ D. Forbes Careless Error Shield</text>\n      <text x=\"478\" y=\"78\" fill=\"#e2e8f0\" font-size=\"13\">✅ (−4)² = (−4)×(−4) = +16  (NOT −16 or −8!)</text>\n      <text x=\"478\" y=\"106\" fill=\"#e2e8f0\" font-size=\"13\">✅ √144 = 12  (What times itself = 144, NOT ÷2!)</text>\n      <text x=\"478\" y=\"134\" fill=\"#e2e8f0\" font-size=\"13\">✅ (−20) ÷ (−4) = +5  (Same signs = POSITIVE)</text>\n      <text x=\"478\" y=\"162\" fill=\"#e2e8f0\" font-size=\"13\">✅ a − (−b) = a + b  (Add the opposite!)</text>\n      <text x=\"478\" y=\"190\" fill=\"#86efac\" font-size=\"13\" font-weight=\"bold\">✅ Write 1 step per line — never rush 3 steps!</text>\n    </svg>\n    ", "english_peel_svg": "\n    <svg \"12\" text-anchor=\"middle\">'As a result...'</text>\n      <text x=\"504\" y=\"142\" fill=\"#6ee7b7\" font-size=\"12\" text-anchor=\"middle\">Connect WHY your evidence</text>\n      <text x=\"504\" y=\"160\" fill=\"#6ee7b7\" font-size=\"12\" text-anchor=\"middle\">proves your point</text>\n\n      <rect x=\"614\" y=\"20\" width=\"168\" height=\"180\" rx=\"12\" fill=\"#7c2d12\" stroke=\"#fb923c\" stroke-width=\"2\"/>\n      <text x=\"698\" y=\"50\" fill=\"#fed7aa\" font-size=\"18\" font-weight=\"bold\" text-anchor=\"middle\">L — LINK &amp; EDIT</text>\n      <text x=\"698\" y=\"82\" fill=\"#e2e8f0\" font-size=\"12\" text-anchor=\"middle\">'Ultimately,' wrap-up</text>\n      <text x=\"698\" y=\"114\" fill=\"#fdba74\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\">+ A.R.M.S. Revision</text>\n      <text x=\"698\" y=\"138\" fill=\"#fdba74\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\">+ C.O.P.S. Proofread</text>\n    </svg>\n    ", "science_particle_svg": "\n    <svg viewBox=\"0 0 800 220\" class=\"topic-svg\" role=\"img\" aria-label=\"Particle Theory of Matter and Pure Substances vs Mixtures Diagram\">\n      <rect x=\"0\" y=\"0\" width=\"800\" height=\"220\" rx=\"14\" fill=\"#0f172a\"/>\n      <!-- Beaker 1: Pure Substance -->\n      <rect x=\"30\" y=\"35\" width=\"215\" height=\"160\" rx=\"10\" fill=\"#1e293b\" stroke=\"#38bdf8\" stroke-width=\"2\"/>\n      <text x=\"137\" y=\"60\" fill=\"#38bdf8\" font-size=\"14\" font-weight=\"bold\" text-anchor=\"middle\">Pure Substance (e.g. Water)</text>\n      <text x=\"137\" y=\"80\" fill=\"#94a3b8\" font-size=\"11\" text-anchor=\"middle\">100% Identical Particles (Postulate 2)</text>\n      <g fill=\"#38bdf8\">\n        <circle cx=\"75\" cy=\"115\" r=\"10\"/><circle cx=\"115\" cy=\"115\" r=\"10\"/><circle cx=\"155\" cy=\"115\" r=\"10\"/><circle cx=\"195\" cy=\"115\" r=\"10\"/>\n        <circle cx=\"85\" cy=\"155\" r=\"10\"/><circle cx=\"125\" cy=\"155\" r=\"10\"/><circle cx=\"165\" cy=\"155\" r
