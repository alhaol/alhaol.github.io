t": "Match geography to sustainable energy:", "workedExample": {"prompt": "Choose the best Flow Energy source for: (1) Bay of Fundy, NS; (2) Northern Quebec's huge shield rivers; (3) Southern Alberta's sunny flat plains.", "steps": ["1. Bay of Fundy, NS → Tidal Power (highest ocean tides in the world!).", "2. Northern Quebec → Hydroelectricity (vast rushing rivers dropping over rocky Shield elevation).", "3. Southern Alberta → Solar & Wind Power (most sunny days in Canada + wide-open flat windy prairies)."]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Flow Energy Options & Trade-Offs", "content": "Evaluate pros and cons like a Grade 7 geographer:", "comparisonTable": {"headers": ["Energy Type", "Best Geography", "Key Benefit", "Trade-Off / Challenge"], "rows": [["Hydroelectricity", "Large rivers with steep elevation drops", "Reliable 24/7 clean power, zero smog", "Reservoirs flood valleys & disrupt fish/communities"], ["Wind & Solar", "Wide open windy/sunny plains or coasts", "Zero emissions, fast to install", "Intermittent (needs batteries/grid storage)"], ["Tidal Power", "Narrow coastal bays with huge tide swings", "100% predictable lunar tide cycles", "Expensive saltwater turbines; affects marine life"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Weigh Both Sides of a Mine + Reclamation Plan", "content": "Grade 7 Geography asks you to look at Economic, Environmental, AND Social perspectives—never just one!", "keyPoints": ["Always check: (1) Jobs & clean-tech minerals needed? (2) Watershed & wildlife protection? (3) Indigenous consent & post-mining Land Reclamation?"]}, {"level": 6, "name": "CREATE", "subtitle": "Design a Zero-Pollution Watershed & Clean Energy Plan for Your Community", "content": "Combine wetland protection, recycling/circular economy, and locally matched flow energy.", "keyPoints": ["Synthesizes all 8 chapters of Nelson GEO 7!"]}], "questions": [{"id": "geo-u5-q1", "bloomLevel": 6, "bloomTag": "ANALYZE, EVALUATE & CREATE", "title": "Nelson Ch. 4–8 Capstone: Watershed Protection, Flow Energy & Mining Reclamation", "prompt": "Complete all 3 parts of this Nelson GEO 7 Sustainability Capstone:\n(a) WATERSHEDS (Ch. 4): Explain what a Watershed and a Divide are, and explain why protecting wetlands upstream in the Ottawa River watershed helps prevent flooding and pollution downstream in Ottawa and Montreal.\n(b) FLOW ENERGY MATCHING (Ch. 7): Recommend the BEST Flow Resource energy source for (1) Nova Scotia's Bay of Fundy and (2) Southern Alberta's prairies, stating ONE clear benefit AND ONE challenge/trade-off for each.\n(c) MINING RECLAMATION (Ch. 8): After a nickel mine in Northern Ontario's Canadian Shield finishes extracting ore, explain 3 concrete steps of Land Reclamation required to restore the land and protect nearby lakes, using Sudbury's regreening as inspiration.", "step1_deconstruct": {"instruction": "Verify all 3 parts (a, b, c) and make sure Part (b) includes BOTH a benefit AND a trade-off for each region!", "guidingQuestions": ["What does a wetland do during heavy spring snowmelt (acts like a sponge and natural filter)?", "Which Flow resource matches Bay of Fundy (Tidal) vs. Southern Alberta (Solar/Wind)?", "What 3 physical steps restore mined land during Reclamation?"], "modelPlan": "(a) Define watershed & divide; explain wetlands absorbing floodwater and filtering pollutants before they reach Ottawa/Montreal. (b) Bay of Fundy = Tidal (predictable vs. marine impact/cost); Alberta = Solar/Wind (sunny/windy vs. intermittent storage). (c) 1. Treat tailings/neutralize acid soil, 2. Reshape pits & add topsoil, 3. Replant native trees/monitor lakes."}, "step2_anchor": {"instruction": "Nelson Ch. 4–8 Anchor Terms:", "referenceItems": ["Watershed = land draining to one river | Divide = high ridge separating watersheds", "Bay of Fundy = Tidal Power | Southern Alberta = Solar & Wind Power", "Land Reclamation = Cleaning tailings + Neutralizing soil + Replanting native forests (e.g., Sudbury, ON)"]}, "step3_substeps": [{"label": "Step 3a: Part (a) — Define Watershed & Divide, and explain how upstream wetlands protect Ottawa & Montreal downstream", "placeholder": "A watershed is... A divide is... Protecting upstream wetlands helps Ottawa and Montreal because...", "hint": "Wetlands soak up spring snowmelt (reducing floods) and trap sediment/pollutants naturally!", "modelSubAnswer": "A watershed (drainage basin) is the entire area of land where all precipitation drains downhill into one main river, while a divide is the high ridge separating two watersheds. Because all upstream tributaries flow into the Ottawa and St. Lawrence Rivers, preserving upstream wetlands acts like a giant natural sponge—absorbing heavy spring snowmelt to prevent downstream flooding and filtering out sediment and runoff pollutants before the water reaches Ottawa and Montreal."}, {"label": "Step 3b: Part (b) — Match Flow Energy to (1) Bay of Fundy and (2) Southern Alberta (with 1 benefit + 1 trade-off each)", "placeholder": "1. Bay of Fundy → ... (Benefit: ... | Trade-off: ...)\n2. Southern Alberta → ... (Benefit: ... | Trade-off: ...)", "hint": "Bay of Fundy has the world's highest tides; Alberta has wide, sunny, windy plains!", "modelSubAnswer": "1. Bay of Fundy, NS → Tidal Power. Benefit: Tides are 100% predictable daily cycles generating zero-emission electricity. Trade-off: Underwater turbines are expensive to maintain in harsh saltwater and must be designed carefully to protect marine wildlife.\n2. Southern Alberta → Solar & Wind Power. Benefit: Wide-open flat prairies get abundant sunshine and strong steady winds with zero air pollution. Trade-off: Both are intermittent (when the sun sets or wind calms), requiring battery storage or backup grid connections."}, {"label": "Step 3c: Part (c) — Outline 3 concrete Land Reclamation steps to restore a closed Northern Ontario mine", "placeholder": "1. Clean & neutralize: ...\n2. Reshape & rebuild soil: ...\n3. Replant & monitor: ...", "hint": "Think of Sudbury's regreening: neutralize acidic soil with limestone, safely cap tailings, replace topsoil, and plant native trees!", "modelSubAnswer": "1. Clean & Stabilize Tailings: Safely treat and seal waste rock/tailings ponds so acidic runoff never leaks into Canadian Shield lakes or groundwater.\n2. Reshape & Neutralize Soil: Re-contour steep pit edges for safety, spread crushed limestone to neutralize acidic soil (as done in Sudbury), and restore nutrient-rich topsoil.\n3. Replant Native Species & Monitor: Plant millions of native Boreal trees, shrubs, and grasses, and conduct long-term water testing with local Indigenous communities to confirm wildlife and fish habitats return."}], "step4_checks": ["Did I define BOTH Watershed and Divide in Part (a)?", "Did I include BOTH a Benefit AND a Trade-off for both Bay of Fundy and Southern Alberta in Part (b)?", "Did I list 3 specific, actionable Reclamation steps in Part (c)?"], "step5_modelAnswer": {"basicAnswer": "(a) Watershed drains water to a river; wetlands stop floods. (b) Fundy uses tides, Alberta uses sun/wind. (c) Clean waste, add soil, plant trees.", "expandedAnswer": "Complete Nelson GEO 7 Ch. 4–8 Exemplar:\n(a) Watersheds & Wetlands: A watershed is the land area draining into a single river system, separated from neighbouring basins by high ridges called divides. Because tributaries carry everything downhill, protecting upstream wetlands in the Ottawa River watershed slows spring runoff (preventing downstream floods) and naturally filters pollutants before water reaches Ottawa and Montreal.\n(b) Flow Energy Matching: (1) Bay of Fundy, NS is ideal for Tidal Power (Benefit: 100% predictable zero-emission energy; Trade-off: high saltwater maintenance costs and marine habitat concerns). (2) Southern Alberta is ideal for Solar and Wind Power (Benefit: high sunshine and steady winds with zero smokestack emissions; Trade-off: weather intermittency requiring energy storage).\n(c) Mining Land Reclamation: Inspired by Sudbury's regreening success, closing a Canadian Shield mine requires (1) sealing and treating tailings to protect surrounding watersheds, (2) reshaping pits and spreading limestone + topsoil to neutralize soil acidity, and (3) replanting native Boreal vegetation alongside ongoing ecological and Indigenous-partnered water monitoring.", "extensionPrompt": "Action Challenge: Name 2 daily actions you can take at home or in the school cafeteria to shrink your own Ecological Footprint!"}}]}], "friendlySub": "Complete Nelson GEO 7: Topo maps, tectonics, climate, biomes & sustainability", "accent": "#059669"}, {"id": "math", "code": "MTH7 / Mathematics 7", "name": "Mathematics", "teacher": "D. Forbes (DF)", "status": "Progressing Well", "tier": "Tier 2: Push to Very Well", "tierClass": "tier-strong", "icon": "📐", "reportComment": "Zaid demonstrates strong mathematical thinking and solid problem-solving skills. Key questions, discussions and test marks indicate he has a good understanding of the units studied so far (place value, factors, multiples, square roots, integers and order of operations). To reach his full potential, he is encouraged to stay focused during instruction, double-check his work for careless errors, and practice self-regulation by raising his hand rather than blurting out during class. Attempt extension opportunities. (DF)", "nextSteps": ["Run the 'D. Forbes Careless Error Shield' on every calculation (check negative signs, exponents, and BEDMAS order)", "Write down each line of BEDMAS vertically instead of doing 3 steps in your head at once", "Pause, write your plan first, and verify before answering (Self-Regulation habit)", "Conquer Level 5 & Level 6 Extension Problems across Integers, Roots, Factors/Multiples, and Algebra"], "units": [{"id": "math-u1", "title": "Unit 1: Integers, Square Roots, Factors/Multiples & Order of Operations (BEDMAS)", "curriculumStrand": "Ontario Grade 7 Mathematics Strand B: Number Sense & Operations (B1, B2)", "svgDiagram": "math_bedmas_svg", "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Recall Core Number Rules: Factors, Multiples, Perfect Squares & Integers", "content": "You already have a strong foundation in these 6 sub-topics studied with D. Forbes—keep this rapid-fire reference sharp:", "keyPoints": ["🔢 Factors vs. Multiples: Factors divide evenly INTO a number (Factors of 12: 1, 2, 3, 4, 6, 12 — finite list!). Multiples are what you get when you multiply a number by 1, 2, 3... (Multiples of 12: 12, 24, 36, 48... — infinite list!).", "🏆 GCF vs. LCM: GCF (Greatest Common Factor) splits things into equal groups. LCM (Lowest Common Multiple) finds when two repeating cycles line up again.", "⬛ Perfect Squares & Square Roots: 1²=1, 2²=4, 3²=9, 4²=16, 5²=25, 6²=36, 7²=49, 8²=64, 9²=81, 10²=100, 11²=121, 12²=144, 13²=169, 14²=196, 15²=225. Note: √64 = 8 because 8 × 8 = 64.", "➕➖ Integer Sign Rules: Subtracting a negative is the same as adding a positive: a − (−b) = a + b! For multiplication/division: Same signs = POSITIVE (+); Different signs = NEGATIVE (−).", "🏔️ BEDMAS Priority: (1) Brackets [ ( ) ], (2) Exponents & Roots (x², √x), (3) Division & Multiplication (LEFT to RIGHT!), (4) Addition & Subtraction (LEFT to RIGHT!)."]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Why Careless Errors Happen in Fast Mental Math (And How to Beat Them)", "content": "Because you have fast mathematical intuition, your brain often jumps to Step 3 while your pencil is still on Step 1! That's where careless sign or order errors sneak in.", "analogy": "🏀 Gym Free-Throw Routine: Even NBA stars who can shoot from half-court follow the exact same pre-shot routine at the free-throw line (bounce, breathe, align elbow, follow through). Writing BEDMAS as a vertical 'funnel'—changing only ONE operation per line and copying the rest down—makes careless errors almost impossible!", "keyPoints": ["Watchout #1: (−5)² vs. −5². Inside brackets, (−5)² = (−5) × (−5) = +25. Without brackets, −5² means −(5 × 5) = −25!", "Watchout #2: Division & Multiplication are TIED in rank! In 24 ÷ 4 × 2, do NOT multiply 4 × 2 first! Go LEFT to RIGHT: (24 ÷ 4) × 2 = 6 × 2 = 12.", "Watchout #3: Integer subtraction: −8 − (−3) becomes −8 + 3 = −5 (not −11!)."]}, {"level": 3, "name": "APPLY", "subtitle": "Execute Vertical Funnel BEDMAS with Integers & Roots", "content": "Study how every line changes only one priority tier and copies everything else straight down:", "workedExample": {"prompt": "Evaluate: (−3)² − 4 × [ √81 + (−15) ÷ 3 ]", "steps": ["Line 1 (Inside Brackets — Square Root & Division first): √81 = 9 and (−15) ÷ 3 = −5. Expression becomes: (−3)² − 4 × [ 9 + (−5) ]", "Line 2 (Finish Brackets): 9 + (−5) = 4. Expression becomes: (−3)² − 4 × 4", "Line 3 (Exponents): (−3)² = (−3) × (−3) = +9. Expression becomes: 9 − 4 × 4", "Line 4 (Multiplication before Subtraction!): 4 × 4 = 16. Expression becomes: 9 − 16", "Line 5 (Final Integer Subtraction): 9 − 16 = −7. (Double-check: 9 is smaller than 16, so result must be negative!)."]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Distinguish GCF vs. LCM Word Problems & Prime Factorization Trees", "content": "How do you know immediately whether a word problem requires GCF or LCM?", "comparisonTable": {"headers": ["Feature", "Greatest Common Factor (GCF)", "Lowest Common Multiple (LCM)"], "rows": [["Core Action", "Cutting, dividing, or packaging items into equal groups with zero leftovers", "Repeating cycles, laps, or schedules happening at the same time again"], ["Size of Answer", "Smaller than or equal to the smallest given number", "Larger than or equal to the largest given number"], ["Prime Factor Rule (36 = 2²×3², 48 = 2⁴×3¹)", "Multiply SHARED primes with LOWEST exponents: 2² × 3¹ = 12", "Multiply ALL primes with HIGHEST exponents: 2⁴ × 3² = 144"], ["Gym Example", "Splitting 36 basketballs and 48 pinnies into the maximum number of identical team kits (12 kits)", "Zaid runs a gym lap every 36 seconds and a friend every 48 seconds; when do they cross the start line together? (144 seconds)"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Spot the 3 Careless Errors in a Student's Solution (D. Forbes Audit)", "content": "Can you find all 3 classic careless mistakes in this student's work for:  20 − 2 × [ √64 − (−3)² ] ÷ 2 ?", "keyPoints": ["Student Line 1: 20 − 2 × [ 32 − (+9) ] ÷ 2  --> ❌ Careless Error #1: Divided 64 by 2 (getting 32) instead of taking the square root √64 = 8!", "Student Line 2 (if they used 8): 20 − 2 × [ 8 − (−9) ] ÷ 2 --> ❌ Careless Error #2: Wrote (−3)² = −9 instead of +9!", "Student Line 3: Subtracted 20 − 2 = 18 before multiplying! --> ❌ Careless Error #3: Violated BEDMAS by subtracting before multiplying/dividing.", "✅ Correct Solution: 20 − 2 × [ 8 − 9 ] ÷ 2 = 20 − 2 × (−1) ÷ 2 = 20 − (−2) ÷ 2 = 20 − (−1) = +21."]}, {"level": 6, "name": "CREATE", "subtitle": "D. Forbes Extension Challenge: Target Number & Missing Bracket Design", "content": "Stretch your mathematical thinking with multi-constraint design problems:", "keyPoints": ["Extension 1 (Target Bracket Puzzle): Insert one pair of brackets into  −6 + 4 × 3² − √100 ÷ 2  so that the final answer equals −23.", "Extension 2 (GCF × LCM Theorem): Verify and explain why for ANY two positive integers A and B, (GCF of A and B) × (LCM of A and B) always equals A × B!"]}], "questions": [{"id": "math-q1", "bloomLevel": 5, "bloomTag": "APPLY & EVALUATE", "title": "Multi-Step BEDMAS with Integers, Exponents & Square Roots (+ Error Shield)", "prompt": "Evaluate the following expression step-by-step using vertical BEDMAS lines, and explain how you verified each potential careless-error trap:\n\nExpression:   (−4)² − 3 × [ √144 + (−20) ÷ (−4) − 11 ] + (−6)", "step1_deconstruct": {"instruction": "STOP & PLAN (D. Forbes Self-Regulation Rule): Do NOT calculate in your head yet! List the exact order in which you will attack the parts of this expression.", "guidingQuestions": ["What is inside the square brackets [ √144 + (−20) ÷ (−4) − 11 ]? Which two operations inside the brackets must happen BEFORE addition/subtraction?", "Outside the brackets, we have (−4)², multiplication by 3, subtraction, and adding (−6). Which goes first?"], "modelPlan": "1. Inside [ ]: Evaluate √144 and (−20) ÷ (−4) first, then add and subtract left-to-right to get one bracket value.\n2. Outside [ ]: Evaluate the exponent (−4)².\n3. Multiply 3 by the bracket value.\n4. Perform final subtraction and addition from left to right."}, "step2_anchor": {"instruction": "ANCHOR RULES: Check Sign & Root Traps before computing.", "referenceItems": ["√144 = 12 (since 12 × 12 = 144 — do NOT divide 144 by 2!)", "(−20) ÷ (−4) = +5 (Negative divided by Negative = POSITIVE!)", "(−4)² = (−4) × (−4) = +16 (Negative base inside brackets squared = POSITIVE!)"]}, "step3_substeps": [{"label": "Step 3a: Evaluate the inside of the square brackets [ √144 + (−20) ÷ (−4) − 11 ] step-by-step", "placeholder": "√144 = ...\n(−20) ÷ (−4) = ...\nSo inside [ ] we have: ... + ... − 11 = ...", "hint": "Replace √144 with 12 and (−20) ÷ (−4) with +5. Then compute 12 + 5 − 11.", "modelSubAnswer": "Inside brackets:\n• √144 = 12\n• (−20) ÷ (−4) = +5\n• [ 12 + 5 − 11 ] = [ 17 − 11 ] = 6."}, {"label": "Step 3b: Rewrite the whole expression with your bracket answer (6) and evaluate the exponent (−4)²", "placeholder": "(−4)² − 3 × [ 6 ] + (−6)\n= ... − 3 × 6 + (−6)", "hint": "Remember (−4)² = (−4) × (−4) = +16.", "modelSubAnswer": "Substitute [6] and evaluate (−4)² = +16:\nExpression becomes: 16 − 3 × 6 + (−6)"}, {"label": "Step 3c: Complete the multiplication first, then perform the final integer subtraction and addition left-to-right", "placeholder": "16 − (3 × 6) + (−6)\n= 16 − ... + (−6)\n= ...", "hint": "3 × 6 = 18. Then 16 − 18 = −2. Finally, −2 + (−6) = ?", "modelSubAnswer": "• Multiply first: 3 × 6 = 18\n• Expression: 16 − 18 + (−6)\n• Subtract left-to-right: 16 − 18 = −2\n• Add (−6): −2 + (−6) = −8.\nFinal Answer = −8."}], "step4_checks": ["Careless Error Check 1: Did I write √144 = 12 (and NOT 72)?", "Careless Error Check 2: Did I make (−20) ÷ (−4) = +5 (positive) and (−4)² = +16 (positive)?", "Careless Error Check 3: Did I multiply 3 × 6 = 18 BEFORE subtracting from 16?", "Careless Error Check 4: Did I check the final integer sign: 16 − 18 = −2, and −2 + (−6) = −8?"], "step5_modelAnswer": {"basicAnswer": "−8", "expandedAnswer": "Complete Vertical Funnel Solution (D. Forbes Full-Marks Standard):\n  (−4)² − 3 × [ √144 + (−20) ÷ (−4) − 11 ] + (−6)\n= (−4)² − 3 × [ 12 + (+5) − 11 ] + (−6)      (Evaluated root √144=12 and integer division −20÷−4=+5)\n= (−4)² − 3 × [ 6 ] + (−6)                    (Completed bracket operations: 12 + 5 − 11 = 6)\n= 16 − 3 × 6 + (−6)                           (Evaluated exponent: (−4)×(−4) = +16)\n= 16 − 18 + (−6)                              (Multiplied 3 × 6 = 18 before subtraction)\n= −2 + (−6)                                   (Subtracted left-to-right: 16 − 18 = −2)\n= −8                                          (Added two negatives: −2 + (−6) = −8)", "extensionPrompt": "D. Forbes Extension Challenge: What would the final answer be if the subtraction sign in front of the 3 was changed to a division sign, and the 3 was changed to (−2)?"}}, {"id": "math-q2", "bloomLevel": 6, "bloomTag": "ANALYZE & CREATE (EXTENSION)", "title": "D. Forbes Extension Opportunity: Gym Tournament GCF, LCM & Square Number Design", "prompt": "Zaid is helping organize an intramural tournament in the Longfields-Davidson Heights gym:\n• Part 1: There are 72 basketballs, 96 pinnies (jerseys), and 120 water bottles. What is the greatest number of identical team equipment bags that can be made using ALL items with zero leftovers, and how many of each item go into one bag?\n• Part 2: During warm-ups, Group A completes a court shuttle drill every 18 seconds, and Group B completes a full-court circuit every 24 seconds. If both groups blow the whistle together at t = 0 seconds, after how many seconds will they blow the whistle at the exact same instant for the 3rd time (not counting t = 0)?\n• Part 3 (Extension): Is the sum of your answers from Part 1 (number of bags) and Part 2 (seconds for the 3rd whistle) a perfect square? Prove it and find its square root or nearest integer roots!", "step1_deconstruct": {"instruction": "STOP & PLAN: Classify Part 1 and Part 2 as GCF or LCM before touching any numbers.", "guidingQuestions": ["Part 1 splits 72, 96, and 120 into equal bags with no leftovers: Is that GCF or LCM?", "Part 2 aligns repeating time cycles of 18 s and 24 s (and asks for the 3rd time!): Is that GCF or LCM?", "Part 3 asks us to test if (Part 1 bags + Part 2 time) is a perfect square."], "modelPlan": "Part 1: Find GCF(72, 96, 120) and divide each item count by the GCF. Part 2: Find LCM(18, 24) for the 1st simultaneous whistle, then multiply by 3 for the 3rd time. Part 3: Add both results and check if the sum equals n²."}, "step2_anchor": {"instruction": "ANCHOR TOOL: Prime Factorizations for 72, 96, 120 and 18, 24.", "referenceItems": ["72 = 8 × 9 = 2³ × 3² | 96 = 32 × 3 = 2⁵ × 3¹ | 120 = 8 × 15 = 2³ × 3¹ × 5¹", "18 = 2 × 9 = 2¹ × 3² | 24 = 8 × 3 = 2³ × 3¹"]}, "step3_substeps": [{"label": "Step 3a: Part 1 — Calculate GCF(72, 96, 120) and determine the exact contents of 1 equipment bag", "placeholder": "GCF(72, 96, 120) = ...\nPer bag: ... basketballs, ... pinnies, ... water bottles", "hint": "Shared prime factors of 72, 96, and 120 are 2³ (8) and 3¹ (3). What is 8 × 3? Then divide 72, 96, and 120 by that number!", "modelSubAnswer": "GCF(72, 96, 120) = 2³ × 3¹ = 8 × 3 = 24 identical bags.\nContents per bag:\n• Basketballs: 72 ÷ 24 = 3 basketballs\n• Pinnies: 96 ÷ 24 = 4 pinnies\n• Water bottles: 120 ÷ 24 = 5 water bottles."}, {"label": "Step 3b: Part 2 — Find LCM(18, 24) for the 1st whistle alignment, then calculate the time for the 3rd simultaneous whistle", "placeholder": "LCM(18, 24) = ... seconds (1st time)\n3rd time = 3 × ... = ... seconds", "hint": "Multiples of 24: 24, 48, 72... Does 18 divide evenly into 72? Don't forget to multiply by 3 for the 3rd time!", "modelSubAnswer": "LCM(18, 24) = 2³ × 3² = 8 × 9 = 72 seconds (1st simultaneous whistle after t = 0).\nFor the 3rd simultaneous whistle: 72 seconds × 3 = 216 seconds (or 3 minutes 36 seconds)."}, {"label": "Step 3c: Part 3 (Extension) — Add (Number of Bags + Seconds for 3rd Whistle) and test if it is a perfect square", "placeholder": "Sum = 24 + 216 = ...\nPerfect squares near this number: 15² = ..., 16² = ...", "hint": "24 + 216 = 240. Check 15² = 225 and 16² = 256! Wait—what if you added Number of Bags (24) + 1st Whistle LCM (72)? Check both!", "modelSubAnswer": "• Sum with 3rd whistle: 24 + 216 = 240. Since 15² = 225 and 16² = 256, 240 is NOT a perfect square (√240 ≈ 15.49, lying almost halfway between 15 and 16).\n• Bonus Observation: Even if we used the 1st whistle (24 + 72 = 96), 9² = 81 and 10² = 100, so √96 ≈ 9.80. However, if we took the 2nd whistle (72 × 2 = 144), 144 itself is a perfect square (√144 = 12)!"}], "step4_checks": ["Did I answer BOTH parts of Part 1 (the number of bags = 24 AND the items per bag: 3, 4, 5)?", "In Part 2, did I catch the word '3rd time' and multiply the LCM (72 s) by 3 to get 216 s?", "Did I verify my GCF by checking that 24 × 3 = 72, 24 × 4 = 96, and 24 × 5 = 120?"], "step5_modelAnswer": {"basicAnswer": "Part 1: 24 bags (3 balls, 4 pinnies, 5 bottles). Part 2: 216 seconds. Part 3: 240 is between 15² and 16².", "expandedAnswer": "Complete Extension Solution:\n• Part 1 (GCF Equipment Packaging): Using prime factorization, 72 = 2³×3², 96 = 2⁵×3¹, and 120 = 2³×3¹×5¹. The GCF is 2³×3¹ = 24 bags. Dividing each total by 24 gives 3 basketballs, 4 pinnies, and 5 water bottles per bag (Check: gcd(3,4,5) = 1, so no further common factor exists).\n• Part 2 (LCM Cycle Alignment): Multiples of 18 are 18, 36, 54, 72... and multiples of 24 are 24, 48, 72... Thus LCM(18, 24) = 72 seconds for the 1st simultaneous whistle. The 3rd simultaneous whistle occurs at 72 s × 3 = 216 seconds.\n• Part 3 (Square Root Extension Proof): 24 + 216 = 240. Because 15² = 225 and 16² = 256, 225 < 240 < 256, proving 240 is not a perfect square and 15 < √240 < 16 (specifically √240 ≈ 15.49).", "extensionPrompt": "Super Extension: How many more equipment bags would you need to add to 240 so the total becomes the next perfect square (16² = 256)?"}}], "studyFirstTag": "Start Here: BEDMAS + Integers + Square Roots (Zero Careless Errors)", "lessons": [{"id": "math-u1-l1", "title": "Lesson 1.1: Factors, Multiples, GCF, LCM & Square Roots", "readTime": "3 min read", "bigIdea": "Master the exact difference between Factors (splitting up) and Multiples (repeating cycles), plus fast square root recognition.", "paragraphs": ["Students with strong mental math sometimes mix up 'Factors' and 'Multiples' when reading fast. Remember the memory trick: Factors are FEW (they divide evenly INTO a number, so they are smaller than or equal to the number: factors of 12 are 1, 2, 3, 4, 6, 12). Multiples are MANY (multiply by 1, 2, 3...: multiples of 12 are 12, 24, 36, 48...).", "In word problems, use GCF (Greatest Common Factor) when you are splitting items evenly into the maximum number of identical groups or bags with zero leftovers. Use LCM (Lowest Common Multiple) when two repeating schedules, gym laps, or flashing lights start together and you want to know when they line up again!", "A Perfect Square is what you get when you multiply a whole number by itself (like 7 × 7 = 49, or 12 × 12 = 144). The Square Root symbol (√) reverses that: √144 asks 'What positive number times itself equals 144?' The answer is 12! Never fall for the classic careless mistake of dividing 144 by 2!"], "keyTakeaway": "GCF = split into identical bags | LCM = align repeating cycles | √x = what times itself equals x (NEVER divide by 2!).", "deepReadTitle": "🔢 Perfect Squares Cheat Sheet (1² to 15²)", "deepReadText": "1²=1 | 2²=4 | 3²=9 | 4²=16 | 5²=25 | 6²=36 | 7²=49 | 8²=64 | 9²=81 | 10²=100 | 11²=121 | 12²=144 | 13²=169 | 14²=196 | 15²=225.\nTo estimate a non-perfect square like √55: since 7²=49 and 8²=64, √55 is between 7 and 8 (closer to 7.4).", "quickCheck": {"question": "Zaid runs a gym lap every 18 seconds and a friend runs one every 24 seconds. Which tool finds when they cross the start line together again?", "options": ["GCF(18, 24) = 6 seconds", "LCM(18, 24) = 72 seconds", "Square Root of 18 + 24"], "correctIdx": 1, "explanation": "Repeating cycles lining up in the future always use LCM! Multiples of 24: 24, 48, 72 (and 18 × 4 = 72)."}, "videos": [{"id": "B4zejSI8zho", "title": "Math Antics — Exponents and Square Roots", "channel": "Math Antics", "why": "Visualizes exponents, perfect squares, and square roots so you never divide by 2 by mistake!"}]}, {"id": "math-u1-l2", "title": "Lesson 1.2: Integers, BEDMAS & The Careless Error Shield", "readTime": "3 min read", "bigIdea": "Slowing down to write ONE BEDMAS line at a time turns strong mathematical thinking into 100% test accuracy.", "paragraphs": ["D. Forbes noted that you already have strong math problem-solving skills—your key to reaching the very top is eliminating careless sign and order errors! Almost every careless mistake in Grade 7 happens in one of three spots.", "Trap #1 — Negative Exponents With Brackets: (−4)² means (−4) × (−4) = +16 (two negatives make a positive!). Without brackets, −4² means the opposite of 4², which is −16. Always check if the minus sign is INSIDE the brackets!", "Trap #2 — Integer Sign Rules: When multiplying or dividing two integers, SAME signs give a POSITIVE (+), and DIFFERENT signs give a NEGATIVE (−). So (−20) ÷ (−4) = +5! And when subtracting a negative, add the opposite: 5 − (−3) = 5 + 3 = 8.", "Trap #3 — Left-to-Right BEDMAS: Brackets first, then Exponents/Roots, then Division & Multiplication TOGETHER from left to right, then Addition & Subtraction TOGETHER from left to right. Write each line directly underneath the previous line like a funnel!"], "keyTakeaway": "Change ONE priority tier per line and copy the untouched numbers straight down. Never subtract before multiplying!", "deepReadTitle": "🛡️ Spot the Difference: 16 − 3 × 6", "deepReadText": "Wrong (rushing left-to-right): (16 − 3) × 6 = 13 × 6 = 78 ❌\nRight (BEDMAS — Multiply first!): 16 − (3 × 6) = 16 − 18 = −2 ✅", "quickCheck": {"question": "What is the exact value of (−3)² + (−12) ÷ (−4)?", "options": ["−6", "+12", "+6"], "correctIdx": 1, "explanation": "(−3)² = +9, and (−12) ÷ (−4) = +3 (negative ÷ negative = positive). Then 9 + 3 = +12!"}, "videos": [{"id": "dAgfnK528RA", "title": "Math Antics — Order Of Operations (BEDMAS)", "channel": "Math Antics", "why": "The gold-standard breakdown of why BEDMAS order prevents careless errors."}]}]}, {"id": "math-u2", "title": "Unit 2: Fractions/Decimals/Percents, Algebraic Equations & Circle/Cylinder Geometry", "curriculumStrand": "Ontario Grade 7 Mathematics Strands B (Fractions/Ratios), C (Algebra) & E (Spatial Sense / Measurement)", "svgDiagram": "math_bedmas_svg", "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Core Formulas: Fractions, Algebra Balance & Circle/Cylinder Geometry", "content": "Prepare to dominate upcoming Grade 7 Math units with D. Forbes using these exact formulas:", "keyPoints": ["🍰 Fractions, Decimals & Percents: To add/subtract fractions, find a Common Denominator (using LCM!). To multiply fractions: multiply numerators straight across and denominators straight across. Benchmark conversions: 1/4 = 0.25 = 25% | 3/4 = 0.75 = 75% | 1/5 = 0.20 = 20% | 1/8 = 0.125 = 12.5%.", "⚖️ Solving Linear Equations (Algebra): An equation is a balanced scale! Whatever inverse operation you do to the Left Side, you MUST do to the Right Side. Undo addition/subtraction FIRST, then undo multiplication/division.", "⭕ Circle Geometry: Diameter (d) = 2 × radius (r) | Circumference (C) = π × d = 2 × π × r | Area of a Circle (A) = π × r² (where π ≈ 3.14).", "🥫 Volume of a Cylinder / Right Prism: Volume = (Area of Base) × Height. For a cylinder: V = π × r² × h (Units are CUBIC: cm³ or m³!)."]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Why Area Uses r² (Square Units) and Volume Multiplies by Height (Cubic Units)", "content": "Never mix up Circumference (2πr) and Area (πr²)!", "analogy": "🏀 Gym Center Circle & Water Bottle Analogy: Walking around the painted perimeter line of the center jump-ball circle in the gym is 1D length = Circumference (C = πd, measured in m). Painting the entire flat floor inside that circle is 2D surface = Area (A = πr², measured in m²). Stacking circular slices up to fill your gym water bottle is 3D space = Volume of a Cylinder (V = πr²h, measured in cm³ or mL)!", "keyPoints": ["Careless Error Trap in Circles: If a question gives you the DIAMETER d = 10 cm, do NOT plug 10 into πr²! First divide by 2 to get radius r = 5 cm, THEN square it: r² = 5² = 25!"]}, {"level": 3, "name": "APPLY", "subtitle": "Solve a Two-Step Algebraic Equation & Check by Substitution", "content": "With D. Forbes, the best part about Algebra is that you can ALWAYS know 100% if your answer is right before handing in your test by plugging your answer back in (Left Side = Right Side check)!", "workedExample": {"prompt": "Solve for x and verify:   3x − 7 = 20", "steps": ["Step 1 (Undo −7 by adding 7 to BOTH sides): 3x − 7 + 7 = 20 + 7  ⇒  3x = 27", "Step 2 (Undo ×3 by dividing BOTH sides by 3): 3x ÷ 3 = 27 ÷ 3  ⇒  x = 9", "Step 3 (D. Forbes LS = RS Verification!): Left Side = 3(9) − 7 = 27 − 7 = 20. Right Side = 20. Since LS = RS, x = 9 is 100% verified!"]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Circumference, Circle Area & Cylinder Volume Traps", "content": "Analyze the exact differences so you never pick the wrong formula on a test:", "comparisonTable": {"headers": ["Measurement", "Formula", "Units", "Classic Careless Error to Avoid"], "rows": [["Circumference (Distance around circle)", "C = π × d  or  2 × π × r", "Linear (cm, m)", "Using r instead of d without multiplying by 2"], ["Area of Circle (Flat 2D space inside)", "A = π × r²", "Square (cm², m²)", "Using diameter d instead of radius r, OR doing r × 2 instead of r × r!"], ["Volume of Cylinder (3D capacity)", "V = π × r² × h", "Cubic (cm³, m³)", "Forgetting to square the radius r before multiplying by height h"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Spot the Careless Errors in a Circle & Cylinder Solution", "content": "Audit this student's work for finding the Volume of a cylinder with Diameter = 8 cm and Height = 10 cm:", "keyPoints": ["❌ Student Work: V = 3.14 × 8² × 10 = 3.14 × 16 × 10 = 502.4 cm", "🔍 Careless Error #1 (Diameter vs. Radius): Used d = 8 cm instead of dividing by 2 to get radius r = 4 cm!", "🔍 Careless Error #2 (Squaring Trap): Wrote 8² = 16 (multiplied by 2) instead of squaring!", "🔍 Careless Error #3 (Units): Wrote 'cm' instead of cubic units 'cm³'!", "✅ Correct Solution: r = 8 ÷ 2 = 4 cm. V = π × r² × h = 3.14 × 4² × 10 = 3.14 × 16 × 10 = 502.4 cm³. (Funny coincidence in numbers, but two fatal process errors that would fail on any other diameter!)"]}, {"level": 6, "name": "CREATE", "subtitle": "Extension: Multi-Step Algebra, Fractions & Geometry Synthesis", "content": "Combine fractions, algebra, and geometry to solve real-world design problems.", "keyPoints": ["Note: 1 cm³ of volume holds exactly 1 mL of liquid (so 1,000 cm³ = 1 Litre)!"]}], "questions": [{"id": "math-u2-q1", "bloomLevel": 6, "bloomTag": "APPLY, EVALUATE & EXTEND", "title": "Algebra & Cylinder Geometry Extension Lab (+ D. Forbes LS=RS Verification)", "prompt": "Solve this 3-part problem showing every intermediate step and verification check:\n• Part 1 (Algebraic Equation + LS=RS Check): Solve for n in the equation:  4n − 15 = 33, and prove your answer is correct using a formal Left Side = Right Side (LS = RS) check.\n• Part 2 (Cylinder Volume & Diameter Trap): Zaid's cylindrical gym water bottle has a DIAMETER of 10 cm and a height of 20 cm. Using π ≈ 3.14, calculate the total Volume of the bottle in cm³ (note: 1 cm³ = 1 mL).\n• Part 3 (Fractions & Percent Extension): Before gym class, the water bottle is 3/4 full. During gym class, Zaid drinks 40% of the water that was in the bottle. How many mL (cm³) of water are left in the bottle after gym?", "step1_deconstruct": {"instruction": "STOP & PLAN: Identify the traps in Part 1, Part 2, and Part 3 before calculating!", "guidingQuestions": ["Part 1: Which operation do I undo first in 4n − 15 = 33?", "Part 2: The problem gives DIAMETER = 10 cm! What MUST I do before using V = πr²h?", "Part 3: First find 3/4 of the total volume, then find how much remains after drinking 40% of that amount (meaning 60% of that water stays!)."], "modelPlan": "Part 1: Add 15 to both sides, divide by 4, and verify LS=RS. Part 2: Divide d=10 by 2 to get r=5 cm, then compute V = 3.14 × 5² × 20. Part 3: Multiply total volume by 3/4 (0.75), then multiply by 60% (0.60) to find remaining mL."}, "step2_anchor": {"instruction": "ANCHOR FORMULAS: Algebra Balance + Cylinder Volume + Fractions/Percents.", "referenceItems": ["Radius r = Diameter ÷ 2 (So r = 10 cm ÷ 2 = 5 cm!)", "Cylinder Volume V = π × r² × h = 3.14 × 5² × 20", "1 cm³ = 1 mL | 3/4 = 0.75 | Drinking 40% leaves 100% − 40% = 60% (0.60)"]}, "step3_substeps": [{"label": "Step 3a: Part 1 — Solve 4n − 15 = 33 step-by-step AND write the LS = RS verification check", "placeholder": "4n − 15 + 15 = 33 + 15\n4n = ...\nn = ...\nLS Check: 4(...) − 15 = ...", "hint": "33 + 15 = 48. Then 48 ÷ 4 = 12.", "modelSubAnswer": "4n − 15 = 33\n4n − 15 + 15 = 33 + 15   (Add 15 to both sides)\n4n = 48\n4n ÷ 4 = 48 ÷ 4          (Divide both sides by 4)\nn = 12\n\nVerification (LS = RS Check):\nLeft Side (LS) = 4(12) − 15 = 48 − 15 = 33.\nRight Side (RS) = 33.\nSince LS = RS, n = 12 is verified!"}, {"label": "Step 3b: Part 2 — Find the radius r from diameter = 10 cm, and calculate the Cylinder Volume V = π × r² × h (with h = 20 cm)", "placeholder": "r = 10 cm ÷ 2 = 5 cm\nV = 3.14 × (5)² × 20\nV = 3.14 × 25 × 20 = ... cm³", "hint": "25 × 20 = 500. Then multiply 3.14 × 500!", "modelSubAnswer": "• Radius: r = 10 cm ÷ 2 = 5 cm (Avoided the diameter trap!)\n• Area of circular base: A = π × r² = 3.14 × 5² = 3.14 × 25 = 78.5 cm²\n• Volume of cylinder: V = 78.5 cm² × 20 cm = 1,570 cm³ (which equals 1,570 mL)."}, {"label": "Step 3c: Part 3 (Extension) — Calculate 3/4 of 1,570 mL, then find how much water remains after drinking 40% of it", "placeholder": "Starting water (3/4 full) = 1570 × 0.75 = ... mL\nWater remaining (60% of starting water) = ... × 0.60 = ... mL", "hint": "1,570 × 0.75 = 1,177.5 mL. Then multiply 1,177.5 × 0.60 (or subtract 40%)!", "modelSubAnswer": "• Step 1 (3/4 full before gym): (3/4) × 1,570 mL = 0.75 × 1,570 = 1,177.5 mL.\n• Step 2 (Drinks 40%, so 60% remains): 1,177.5 mL × 0.60 = 706.5 mL (or 1,177.5 − 471 = 706.5 mL).\n• Shortcut Fraction Check: (3/4) × (3/5) = 9/20 = 45% of total bottle = 0.45 × 1,570 = 706.5 mL!"}], "step4_checks": ["Did I write out the formal LS = RS check in Part 1 to prove n = 12?", "Did I divide the diameter (10 cm) by 2 to get radius r = 5 cm BEFORE squaring in Part 2?", "Did I include cubic units (cm³ / mL) and double-check my decimal multiplication in Part 3?"], "step5_modelAnswer": {"basicAnswer": "Part 1: n = 12. Part 2: 1,570 cm³. Part 3: 706.5 mL.", "expandedAnswer": "Complete Grade 7+ Multi-Step Math Solution:\n• Part 1 (Algebra): 4n − 15 = 33 ⇒ 4n = 48 ⇒ n = 12. Check: LS = 4(12) − 15 = 48 − 15 = 33 = RS ✅.\n• Part 2 (Cylinder Volume): Given diameter d = 10 cm, radius r = 10 ÷ 2 = 5 cm. Using V = πr²h: V ≈ 3.14 × (5 cm)² × 20 cm = 3.14 × 25 × 20 = 1,570 cm³ (1,570 mL).\n• Part 3 (Fractions & Percents Extension): At 3/4 capacity, the bottle holds 0.75 × 1,570 mL = 1,177.5 mL. Drinking 40% leaves 60% of the water: 0.60 × 1,177.5 mL = 706.5 mL (or 706.5 cm³) remaining.", "extensionPrompt": "Surface Area Extension: How much stainless steel (in cm²) is needed to make the curved side + flat circular bottom of that open-top water bottle (SA = πr² + 2πrh)?"}}], "studyFirstTag": "Next: Solving Algebra Equations + Circle & Cylinder Formulas", "lessons": [{"id": "math-u2-l1", "title": "Lesson 2.1: Solving Two-Step Algebra Equations & Circle/Cylinder Formulas", "readTime": "3 min read", "bigIdea": "Treat every algebra equation like a balanced scale, and always turn Diameter into Radius BEFORE squaring in circle formulas!", "paragraphs": ["An algebraic equation like 4n − 15 = 33 is a perfectly balanced scale. Your mission is to get 'n' alone by undoing operations in REVERSE BEDMAS order: undo addition or subtraction first (add 15 to BOTH sides → 4n = 48), then undo multiplication or division (divide BOTH sides by 4 → n = 12).", "Best of all, you never have to guess if your algebra answer is right! Plug n = 12 back into the Left Side: 4(12) − 15 = 48 − 15 = 33, which matches the Right Side (33). That 5-second LS = RS check catches 100% of algebra mistakes.", "In Measurement & Geometry, remember the 3 circle formulas using π ≈ 3.14: Circumference (perimeter around) C = π × d; Circle Area (flat space inside) A = π × r²; and Cylinder Volume (3D liquid capacity) V = π × r² × h. Watch out for the #1 Geometry trap: if a question gives you the DIAMETER (all the way across), divide it by 2 to get the RADIUS before using πr²!"], "keyTakeaway": "Algebra: Undo +/− first, then ×/÷, then run LS = RS! Circles/Cylinders: Always convert Diameter → Radius (r = d ÷ 2) first!", "deepReadTitle": "🥫 Real-World Volume Tip (cm³ = mL)", "deepReadText": "Every 1 cubic centimetre (1 cm³) of volume holds exactly 1 millilitre (1 mL) of water! So if a water bottle has radius 5 cm and height 20 cm, its volume is 3.14 × 5² × 20 = 3.14 × 25 × 20 = 1,570 cm³ = 1,570 mL (1.57 Litres).", "quickCheck": {"question": "A circular gym hoop has a DIAMETER of 10 cm. What value of 'r' must you plug into Area = π × r²?", "options": ["r = 10 cm", "r = 5 cm", "r = 20 cm"], "correctIdx": 1, "explanation": "Radius is half the diameter: r = 10 ÷ 2 = 5 cm! Then r² = 25."}, "videos": [{"id": "O-cawByg2aA", "title": "Math Antics — Circles, Circumference And Area", "channel": "Math Antics", "why": "Clearly explains radius vs. diameter, π, circumference (πd), and area (πr²)."}]}]}], "friendlySub": "BEDMAS, integers, square roots, algebra & circles", "accent": "#7c3aed"}, {"id": "english", "code": "ENG7 / Language 7", "name": "Language (English)", "teacher": "E. Catana (EC)", "status": "Progressing Well", "tier": "Tier 2: Push to Very Well", "tierClass": "tier-strong", "icon": "✍️", "reportComment": "Zaid demonstrates a strong understanding of various text forms, writing conventions, and clear ideas. He participates in class discussions. To continue improving, he should focus on expanding his ideas and thoroughly edit his work. (EC)", "nextSteps": ["Turn clear 1-sentence ideas into rich 6–8 sentence paragraphs using the P.E.E.L. Detail Expander", "Bridge your strong class discussion voice into writing ('If I can say 4 sentences about it aloud, I can write 4 detailed sentences!')", "Upgrade vague words ('good, fun, nice, bad, stuff') into precise Grade 7 academic and sensory vocabulary", "Run E. Catana's 2-Stage Editor (A.R.M.S. for Revision + C.O.P.S. for Proofreading) before submitting"], "units": [{"id": "eng-u1", "title": "Unit 1: The Detail Expander (P.E.E.L. Paragraphs), Text Forms & Multi-Step Editing", "curriculumStrand": "Ontario Grade 7 Language Curriculum: Comprehension (Strand C) & Composition / Writing (Strand D)", "svgDiagram": "english_peel_svg", "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "The 2 Core Frameworks: P.E.E.L. (Idea Expansion) & A.R.M.S./C.O.P.S. (Editing)", "content": "E. Catana noted that your ideas are already clear and your understanding of text forms is strong! To reach 'Progressing Very Well', use these two anchor frameworks on every writing task:", "keyPoints": ["🧱 P.E.E.L. Paragraph Expander:\n• P — Point (Topic Sentence): State your main argument or idea clearly.\n• E — Evidence / Example (x2): Give specific facts, quotes, sensory details, or real examples (ask: Who? When? Where? How?).\n• E — Explanation: Explain WHY your example proves your point ('This demonstrates that...', 'As a result...').\n• L — Link (Concluding Sentence): Connect back to your main point and leave the reader with a strong takeaway.", "🛠️ Stage 1 Revision — A.R.M.S. (Expanding Ideas):\n• Add sensory details, adjectives, and a second example.\n• Remove repetitive or off-topic filler.\n• Move sentences so transitions flow logically.\n• Substitute weak words ('fun', 'good', 'stuff') with power vocabulary ('energizing', 'beneficial', 'equipment').", "🔍 Stage 2 Editing — C.O.P.S. (Conventions Check):\n• Capitalization (proper nouns, start of sentences).\n• Overall appearance & complete sentences (fix run-ons and fragments).\n• Punctuation (commas after introductory phrases, apostrophes, periods).\n• Spelling (homophones like their/there/they're, affect/effect)."]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Why 'Telling' Is Short and 'Showing + Explaining' Expands Your Writing", "content": "In class discussions, you naturally give examples and react to classmates. In writing, students often stop after writing the Point ('Gym class is important because it keeps us active.'). That is only the P of P.E.E.L.!", "analogy": "🎺 Music & Trombone Analogy: Playing a single quarter note on the trombone shows you know the pitch, but performing a full musical phrase with dynamics, rhythm, and resonance makes the audience feel the music. Expanding your writing with Evidence and Explanation turns a single note into a full composition!", "keyPoints": ["The 'Because -> For Example -> This Matters Because' Chain: Every time you write a sentence, ask yourself 2 follow-up questions: (1) 'What is a specific example of this?' and (2) 'How or why does this impact people?'"]}, {"level": 3, "name": "APPLY", "subtitle": "Watch a 17-Word Draft Expand into a 110-Word Grade 7+ Paragraph", "content": "See how E. Catana's Detail Expander transforms a brief sentence step by step:", "workedExample": {"prompt": "Prompt: Why are school spaces like the gymnasium and cafeteria important for Grade 7 students?", "steps": ["❌ Unexpanded Draft (17 words): 'The gym and cafeteria are the best parts of school because they are fun and we see friends.'", "Step 1 (Upgrade Point): 'Shared spaces like the school gymnasium and cafeteria are essential for Grade 7 students because they build physical stamina, social collaboration, and mental focus.'", "Step 2 (Add Specific Evidence #1 — Gym): 'For instance, during physical education in the large gymnasium, students practice sport-specific skills and team strategies that release stress after sitting in academic classes.'", "Step 3 (Add Specific Evidence #2 — Cafeteria): 'Similarly, the spacious cafeteria provides a welcoming community hub where students from different homerooms share meals, exchange ideas, and build positive peer relationships.'", "Step 4 (Add Explanation & Concluding Link): 'When students have opportunities to move their bodies and connect socially, they return to afternoon lessons with sharper concentration and stronger self-regulation.'"]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Major Grade 7 Text Forms & Their Structural Features", "content": "Build on your strength in understanding text forms by analyzing how purpose changes structure and tone:", "comparisonTable": {"headers": ["Text Form", "Primary Purpose", "Key Structural Elements", "Tone & Language Features"], "rows": [["Persuasive / Opinion Essay", "Convince the reader to agree with a viewpoint or take action", "Hook, Thesis Statement, P.E.E.L. body paragraphs, Counter-argument, Call to action", "Formal, evidence-based, transition words (Furthermore, Consequently, Undeniably)"], ["Expository / Informational Report", "Explain how something works or analyze a topic objectively", "Headings, subheadings, topic sentences, diagrams/charts, glossary", "Objective, precise domain vocabulary (e.g., contour interval, particle theory)"], ["Narrative / Short Story", "Tell an engaging story that explores a theme or character conflict", "Exposition, inciting incident, rising action, climax, resolution", "Sensory imagery (sight, sound, motion), dialogue, 'Show, Don't Tell' verbs"], ["Media / Digital Text", "Communicate a targeted message to a specific audience using multimodal design", "Headline, visual layout, focal point, caption, subtext", "Concise, high-impact verbs, persuasive appeals (ethos, pathos, logos)"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Thorough Editing Audit: Fix a Unedited Paragraph Using A.R.M.S. & C.O.P.S.", "content": "Find the 5 conventions errors (C.O.P.S.) AND the 2 weak-vocabulary spots (A.R.M.S.) in this draft:", "keyPoints": ["❌ Raw Draft: « Working in groups is good for students because their able to share ideas, when we work together in mr forbes science class we solved a hard problem about mixtures. It was really nice. »", "🔧 C.O.P.S. Fixes: (1) 'their' -> 'they're' (they are), (2) comma splice after 'ideas,' -> change to a period and capital 'When', (3) 'mr forbes' -> 'Mr. Forbes's', (4) comma after introductory clause 'In Mr. Forbes's science class,', (5) tense shift 'when we work... we solved' -> keep consistent past or present tense.", "🚀 A.R.M.S. Vocabulary Expansion: Replace 'good' with 'beneficial' and replace 'It was really nice.' with 'Collaborating allowed each teammate to test hypotheses and explain the Particle Theory with greater accuracy.'"]}, {"level": 6, "name": "CREATE", "subtitle": "Write & Self-Edit a Multi-Paragraph Persuasive or Narrative Piece", "content": "Combine voice, P.E.E.L. expansion, and C.O.P.S. editing to produce polished Grade 7+ writing.", "keyPoints": ["Rule of 3 Details: Never leave a paragraph with fewer than 2 concrete examples and 3 precise adjectives/verbs."]}], "questions": [{"id": "eng-q1", "bloomLevel": 6, "bloomTag": "EVALUATE & CREATE", "title": "The E. Catana Detail Expander & Multi-Step Editor Workbench", "prompt": "Here is a short, unedited 2-sentence student draft responding to the prompt: 'Should Grade 7 students have daily Physical Education (Gym) class?'\n\nRaw Draft: « I think grade 7 students should have gym every day because its fun and good for you. In gym we play games with friends and it helps us not be bored in class. »\n\nIn deep multi-step work:\n1. Diagnose what is missing and identify the grammar/word-choice weaknesses in the raw draft.\n2. Expand the draft into a rich 5-to-6 sentence P.E.E.L. paragraph with specific details (fitness, teamwork, brain focus/self-regulation).\n3. Apply the A.R.M.S. & C.O.P.S. Editing Checklist to produce a polished final paragraph.", "step1_deconstruct": {"instruction": "STOP & PLAN: Diagnose the raw draft before rewriting.", "guidingQuestions": ["What C.O.P.S. errors are in 'grade 7' and 'its fun'?", "Which vague words ('fun', 'good for you', 'games', 'not be bored') need to be upgraded with A.R.M.S.?", "What specific evidence from your own experience in gym and academic classes can you add?"], "modelPlan": "Fix 'grade 7' -> 'Grade 7' and 'its' -> 'it's' (it is). Upgrade 'fun/good' to 'energizing, cardiovascular fitness, collaborative teamwork, and self-regulation'. Build a 5-sentence P.E.E.L. paragraph."}, "step2_anchor": {"instruction": "ANCHOR TOOL: Power Vocabulary Bank & Transition Connectors.", "referenceItems": ["Power Verbs & Nouns: cardiovascular stamina, sport-specific skills, peer collaboration, self-regulation, mental concentration, physical outlet", "Transition Starters: 'First and foremost,', 'For example,', 'Furthermore,', 'As a result,', 'Ultimately,'"]}, "step3_substeps": [{"label": "Step 3a: Write a strong Point (Topic Sentence) that upgrades 'fun and good for you' into 2 specific benefits", "placeholder": "Grade 7 students should have daily Physical Education because...", "hint": "Mention both physical fitness/skills AND mental focus/teamwork!", "modelSubAnswer": "Grade 7 students should participate in daily Physical Education because regular athletic activity strengthens physical fitness, builds teamwork, and sharpens mental focus for academic classes."}, {"label": "Step 3b: Write 2–3 sentences of Evidence & Explanation (Specific details from the gym + how movement helps focus in math/French/geography)", "placeholder": "For example, during gym class, students develop... Furthermore, burning energy in the gym helps students...", "hint": "Include concrete details: sport-specific drills, encouraging teammates, and returning to class calm and ready to focus.", "modelSubAnswer": "For example, during daily gym sessions, students build cardiovascular stamina and sport-specific skills while practicing respectful collaboration and encouraging their peers. Furthermore, having an active outlet to release excess energy during the school day directly supports self-regulation when students return to their desks. After an engaging workout, students can concentrate longer during independent work in subjects like mathematics, French, and geography."}, {"label": "Step 3c: Write a Concluding Link sentence and perform a full C.O.P.S. edit on your combined paragraph", "placeholder": "Ultimately, daily Physical Education is not just a break from learning—it is...", "hint": "Wrap up by linking physical health to overall student success.", "modelSubAnswer": "Ultimately, daily Physical Education is far more than just a break—it is an essential foundation that keeps middle school students healthy, cooperative, and ready to learn."}], "step4_checks": ["A.R.M.S. Check: Did I eliminate vague words ('fun', 'good', 'stuff') and include at least 4 precise Grade 7 vocabulary words?", "P.E.E.L. Check: Does my paragraph contain at least 5 complete sentences (Point + 2 Evidence/Explanation sentences + Concluding Link)?", "C.O.P.S. Check: Did I capitalize 'Grade 7' and 'Physical Education', use commas after transition phrases ('For example,', 'Furthermore,'), and check spelling?"], "step5_modelAnswer": {"basicAnswer": "Grade 7 students should have gym every day because it is healthy and helps us focus in class.", "expandedAnswer": "Complete Expanded & Edited Exemplar (E. Catana Level 4+ Standard — 112 words):\n« Grade 7 students should participate in daily Physical Education because regular athletic activity strengthens physical health, builds respectful teamwork, and sharpens mental focus for academic learning. For example, when students practice sport-specific skills and fitness circuits in the gymnasium, they develop physical stamina while actively encouraging and collaborating with their peers. Furthermore, having a structured daily outlet for physical movement directly improves classroom self-regulation. After releasing pent-up energy in the gym, students return to subjects like mathematics, French, and geography with calmer focus and greater stamina for independent work. Ultimately, daily Physical Education is an essential investment in both student well-being and academic achievement. »", "extensionPrompt": "Extension Challenge: Add 1 counter-argument sentence ('Although some people argue that daily gym takes time away from classroom subjects, research shows...') and refute it!"}}], "studyFirstTag": "Start Here: Turn Short Ideas into Rich Paragraphs (P.E.E.L. + Editing)", "lessons": [{"id": "eng-u1-l1", "title": "Lesson 1.1: Expanding Good Ideas with P.E.E.L. (From 1 Sentence to 6!)", "readTime": "3 min read", "bigIdea": "Your ideas are already clear—using the P.E.E.L. blueprint turns a short 1-sentence answer into a rich, persuasive Grade 7 paragraph.", "paragraphs": ["E. Catana wrote on your report card that you already have clear ideas and strong understanding of text forms. So why do teachers ask you to 'expand your written work to include greater detail'? Because in class discussions, you naturally explain your thoughts out loud—but on paper, it is tempting to stop after writing just the main point!", "Think of a great paragraph like building a burger with P.E.E.L.: Start with your P (Point)—a clear topic sentence stating your opinion and two specific reasons. Next, add two layers of E (Evidence/Examples)—concrete details that answer Who, Where, and How using starters like 'For example,' and 'Furthermore,'.", "Third, add E (Explanation)—tell the reader WHY your examples prove your point ('As a result...', 'This shows that...'). Finally, close with L (Link)—a strong final sentence tying back to the big picture ('Ultimately,...')."], "keyTakeaway": "Never stop after writing your Point! Always ask yourself: (1) What is a specific example? (2) Why does this matter?", "deepReadTitle": "🛠️ Lesson 1.2: E. Catana's 2-Stage Editor (A.R.M.S. & C.O.P.S.)", "deepReadText": "Editing isn't just checking spelling—it has two stages:\n1) A.R.M.S. (Make Ideas Stronger): Add details, Remove filler, Move sentences for flow, and Substitute weak words ('fun', 'good', 'stuff', 'nice') with power words ('energizing', 'beneficial', 'equipment', 'collaborative').\n2) C.O.P.S. (Polish Conventions): Check Capitalization (Grade 7, proper nouns), Overall sentence flow (fix run-on commas!), Punctuation (it's = it is vs. its = belonging to it), and Spelling (they're / their / there).", "quickCheck": {"question": "Which sentence best uses A.R.M.S. & C.O.P.S. to upgrade: « gym is fun because its good for you »?", "options": ["Gym is super fun because its really good for kids.", "Daily Physical Education is energizing because it builds cardiovascular stamina and teamwork.", "gym is good because we play stuff with friends."], "correctIdx": 1, "explanation": "It fixes capitalization ('Physical Education'), removes the 'its' apostrophe error, and upgrades vague words ('fun', 'good') into precise Grade 7 vocabulary ('energizing', 'cardiovascular stamina', 'teamwork')!"}, "videos": [{"id": "t8W4XDPYFwc", "title": "Using the PEEL Paragraph Method (Grade 7–8 English)", "channel": "Schooling Online", "why": "Shows exactly how to expand a 1-sentence idea into a rich Point-Evidence-Explain-Link paragraph."}]}]}, {"id": "eng-u2", "title": "Unit 2: Deep Reading Comprehension, Inference & Media Literacy Analysis", "curriculumStrand": "Ontario Grade 7 Language: Comprehension (Strand C) & Digital Media Texts (Strand A/C)", "svgDiagram": "english_peel_svg", "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Core Reading & Media Concepts: Inference, Theme, Subtext & Appeals", "content": "When reading short stories, articles, or digital media in E. Catana's class, anchor these key terms:", "keyPoints": ["🔎 Inference Equation: Text Clues (Direct Quotes/Actions) + Prior Knowledge (What you know about life) = Inference (Reading between the lines!).", "🌟 Theme vs. Plot: Plot is WHAT happens in the story ('A boy practices trombone and makes the band'). Theme is the universal MESSAGE about life ('Consistent self-discipline and perseverance turn initial struggle into mastery').", "📺 Media Literacy Triangle: Every media text (poster, commercial, website, social video) is analyzed through (1) Audience & Purpose, (2) Production Techniques (camera angle, lighting, colour, music), and (3) Implicit vs. Explicit Message."]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Why Reading Answers Need Direct Evidence + Deep Explanation", "content": "Just like writing essays, reading comprehension answers in Grade 7 require expanding your ideas beyond a 1-sentence opinion!", "analogy": "🕵️‍♂️ Detective Case File Analogy: A detective in court can't just say 'I think the suspect was nervous.' They must present the physical clue ('His hands were shaking and he avoided eye contact') and explain what it proves. In English, your quote/detail is the clue, and your explanation is the proof!", "keyPoints": ["The R.A.C.E. / P.E.E.L. Reading Response Formula: Restate & Answer the question -> Cite a specific detail/quote from the text -> Explain how that detail proves your inference."]}, {"level": 3, "name": "APPLY", "subtitle": "Decode Character Motivation & Implicit Meaning Step-by-Step", "content": "Watch how a brief reading answer is expanded into a thorough Grade 7 response:", "workedExample": {"prompt": "Passage Excerpt: « Malik stared at the steep contour lines on his geography worksheet. Around him, classmates were chatting about the after-school basketball game. Malik took a slow breath, opened his notebook to the anchor chart from Tuesday's lesson, and underlined the three parts of Question 4 before picking up his pencil. »\nQuestion: What can you infer about Malik's growth as a learner?", "steps": ["❌ Brief Answer (Too short!): 'Malik is trying hard to finish his geography work.'", "Step 1 (Inference Claim): 'We can infer that Malik has developed strong self-regulation and organization strategies when facing challenging academic tasks.'", "Step 2 (Text Evidence): 'Specifically, even though his peers are talking about basketball around him, Malik takes \"a slow breath,\" consults \"the anchor chart from Tuesday's lesson,\" and underlines all three parts of the question before writing.'", "Step 3 (Deep Explanation): 'These deliberate actions show that instead of getting distracted or rushing into a careless answer, he uses resource tools and breaks complex work into manageable steps.'"]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Analyze Persuasive Appeals & Camera Angles in Media Texts", "content": "Compare how media creators influence Grade 7 audiences:", "comparisonTable": {"headers": ["Media Technique", "How It Works", "Effect on the Audience"], "rows": [["Ethos (Credibility)", "Featuring a pro athlete, scientist, or trusted expert", "Builds trust and authority in the message"], ["Pathos (Emotion)", "Inspiring orchestral/brass music, slow-motion teamwork shots", "Creates excitement, empathy, or belonging"], ["Logos (Logic & Facts)", "Statistics, graphs, and performance data ('Improves stamina by 35%')", "Convinces the logical mind with measurable proof"], ["Low Camera Angle (Looking Up)", "Camera shoots from floor level looking up at the athlete/subject", "Makes the subject appear powerful, heroic, and confident"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Audit a Reading Response for Depth & Conventions (E. Catana Rubric)", "content": "Before submitting any reading comprehension response, check these 3 criteria:", "keyPoints": ["1. Did I embed at least one specific detail or short quotation from the text?", "2. Did I write at least 2 sentences explaining HOW my evidence supports my point (using phrases like 'This illustrates that...' or 'By doing this, the author reveals...')?", "3. Did I run C.O.P.S. to check quotation marks, capitals, and spelling?"]}, {"level": 6, "name": "CREATE", "subtitle": "Design & Justify a Multimodal Media Campaign for School Community Spirit", "content": "Synthesize media literacy appeals (ethos, pathos, logos), visual design elements, and persuasive writing.", "keyPoints": ["Links English Media Literacy with Visual Arts Elements of Design!"]}], "questions": [{"id": "eng-u2-q1", "bloomLevel": 5, "bloomTag": "ANALYZE & EVALUATE", "title": "Deep Reading Inference & R.A.C.E./P.E.E.L. Expansion Workbench", "prompt": "Read this short narrative passage carefully:\n\n« Twenty minutes before the winter concert at Longfields-Davidson Heights, the backstage hallway buzzed with nervous energy. Leo gripped his trombone slide so tightly his knuckles turned white; he had cracked the high F twice during morning rehearsal. Sitting beside him, Tariq noticed Leo's shallow breathing. Without making a big deal of it, Tariq tapped his own stomach, smiled, and mimed a slow, deep breath in for four counts, then hummed a steady low Bb. Leo's shoulders dropped an inch. He mirrored the breath, adjusted his posture on the edge of the folding chair, and played a warm, resonant F that echoed cleanly down the hall. »\n\nAnswer in a deep, expanded multi-step reading response (5–6 sentences, thoroughly edited):\nWhat does this passage reveal about Tariq's leadership style and how peer collaboration affects performance under pressure? Support your answer with at least TWO specific details from the text and explain their impact.", "step1_deconstruct": {"instruction": "STOP & PLAN: Identify the two parts of the question (Tariq's leadership style + impact on Leo's performance) and select 2 concrete text clues.", "guidingQuestions": ["How is Leo feeling at the start? ('knuckles turned white', 'shallow breathing', cracked high F).", "What specific actions does Tariq take instead of criticizing Leo? ('Without making a big deal', tapped stomach, mimed slow breath, hummed low Bb).", "How does Leo's physical state and musical performance change as a result?"], "modelPlan": "Point: Tariq demonstrates empathetic, supportive leadership that calms anxiety and unlocks peak performance. Evidence 1: Leo's white knuckles/shallow breathing vs. Tariq quietly modeling deep breathing and humming Bb. Evidence 2: Leo's shoulders dropping and playing a 'warm, resonant F'. Explanation & Link: Connects quiet encouragement to confidence under pressure."}, "step2_anchor": {"instruction": "ANCHOR TOOL: R.A.C.E. / P.E.E.L. Reading Response Connectors.", "referenceItems": ["Point Starter: 'This passage reveals that true leadership relies on empathy and calm modeling, which helps peers overcome anxiety under pressure.'", "Evidence Starters: 'For instance, when Tariq notices Leo's \"white\" knuckles and \"shallow breathing,\" he...' | 'Furthermore, the text states that...'", "Explanation Starters: 'This subtle gesture demonstrates that...' | 'Consequently, Tariq's supportive collaboration allows Leo to...'"]}, "step3_substeps": [{"label": "Step 3a: Write your Topic Sentence (Point) answering both parts of the prompt", "placeholder": "This passage reveals that Tariq is an empathetic, encouraging leader whose calm support...", "hint": "State clearly what kind of leader Tariq is and how collaboration helps performers under pressure.", "modelSubAnswer": "This passage reveals that Tariq is an empathetic, observant leader whose quiet encouragement helps a nervous teammate regain self-regulation and perform with confidence under pressure."}, {"label": "Step 3b: Integrate 2 specific text details/quotes (Evidence) and explain WHY they matter (Explanation)", "placeholder": "For example, when Leo grips his trombone until his \"knuckles turned white\" because of his earlier mistake, Tariq does not embarrass him; instead, he...", "hint": "Quote phrases like \"knuckles turned white\", \"shallow breathing\", and \"warm, resonant F\" and explain how Tariq's breathing cue worked.", "modelSubAnswer": "For example, when Leo grips his trombone until his \"knuckles turned white\" from fear of repeating his rehearsal mistake, Tariq avoids embarrassing him in front of the band. Instead, Tariq calmly models a slow four-count diaphragmatic breath and hums a steady \"low Bb\" to anchor his friend. Consequently, this respectful, non-judgmental support breaks Leo's panic cycle: his \"shoulders dropped an inch,\" he corrects his posture, and he produces a \"warm, resonant F.\""}, {"label": "Step 3c: Write a Concluding Link sentence on the theme of collaboration & perform a C.O.P.S. edit", "placeholder": "Ultimately, the author demonstrates that when teammates support one another with patience...", "hint": "Connect the scene to the universal theme of teamwork and encouragement.", "modelSubAnswer": "Ultimately, the passage illustrates that when teammates encourage one another with patience and practical strategies, collaboration transforms nervous tension into shared success."}], "step4_checks": ["Did I include at least 2 specific details or short quotes from the passage in quotation marks?", "Did I explain HOW Tariq's actions changed Leo's physical posture, breathing, and trombone tone?", "Did I edit my response with C.O.P.S. (capital letters on 'Tariq', 'Leo', 'Bb', 'F', and proper punctuation inside quotation marks)?"], "step5_modelAnswer": {"basicAnswer": "Tariq is a good friend who helps Leo breathe so he can play the high F on his trombone without being nervous.", "expandedAnswer": "Complete Expanded Reading Comprehension Exemplar (E. Catana Level 4+ Standard):\n« This passage reveals that Tariq is an empathetic, observant leader whose quiet encouragement helps a nervous peer regain self-regulation and perform with confidence under pressure. At the beginning of the scene, Leo is paralyzed by anxiety over cracking a note earlier, gripping his trombone until his \"knuckles turned white\" and taking \"shallow breathing.\" Rather than criticizing him or drawing unwanted attention, Tariq calmly models a slow four-count diaphragmatic breath and hums a steady \"low Bb.\" This supportive, non-judgmental gesture immediately lowers Leo's stress—his \"shoulders dropped an inch\"—allowing him to reset his posture and play a \"warm, resonant F.\" Ultimately, the author demonstrates that respectful peer collaboration and encouragement can transform performance anxiety into mastery. »", "extensionPrompt": "Self-Connection: Notice how Tariq displays the exact 'Collaboration: G (Good)' trait N. Bishop praised on your report card ('actively sharing ideas while supporting and encouraging peers')!"}}], "studyFirstTag": "Next: Reading Between the Lines (Inference + Evidence)", "lessons": [{"id": "eng-u2-l1", "title": "Lesson 2.1: Reading Between the Lines (Inference & Text Evidence)", "readTime": "3 min read", "bigIdea": "Authors don't always tell you how a character feels—they SHOW you through actions, body language, and dialogue.", "paragraphs": ["If a story says, 'Leo gripped his trombone slide so tightly his knuckles turned white,' the author never uses the word 'nervous'—yet you immediately know Leo is stressed! That is called making an INFERENCE: Text Clues + Your Background Knowledge = Deep Meaning.", "When answering a reading comprehension question in Grade 7, follow the exact same expansion rule as writing: Restate & Answer the question clearly, Cite 2 specific short quotes or details from the passage, and Explain how those clues prove your point.", "The same detective skill works in Media Literacy! Every poster, ad, or video tries to persuade you using Ethos (trusted expert), Pathos (emotion/music), or Logos (facts and stats)—plus camera angles and colours chosen on purpose."], "keyTakeaway": "An inference without a quote/text clue is just a guess. Always back up your reading idea with 2 specific details from the text!", "deepReadTitle": "🔎 Plot vs. Theme (Don't Mix Them Up!)", "deepReadText": "• Plot = WHAT happens in the story (specific character names and events).\n• Theme = The universal LIFE MESSAGE anyone can learn from the story (no character names! Example: 'Quiet, supportive teamwork can turn fear under pressure into confidence').", "quickCheck": {"question": "If a character's 'shoulders dropped an inch' after a friend helps them breathe before a concert, what can we infer?", "options": ["The character got even more nervous.", "The character physically relaxed and released tension.", "The character dropped their instrument."], "correctIdx": 1, "explanation": "Raised, tight shoulders show stress; shoulders dropping is a physical clue that tension melted away!"}, "videos": [{"id": "GXw-qn8dCWw", "title": "Making Inferences (Reading Between the Lines)", "channel": "Growing Primary", "why": "Visualizes how text clues + prior knowledge combine to make strong reading inferences."}]}]}], "friendlySub": "P.E.E.L. detail expansion, editing & reading inference", "accent": "#db2777"}, {"id": "science", "code": "SNC7 / Science & Tech 7", "name": "Science and Technology", "teacher": "D. Forbes (DF)", "status": "Progressing Well", "tier": "Tier 2: Push to Very Well", "tierClass": "tier-strong", "icon": "🔬", "reportComment": "Zaid demonstrates a solid understanding of the Particle Theory and Pure Substances & Mixtures, usually explaining concepts accurately. (DF)", "nextSteps": ["Move from 'usually explaining accurately' to 'always explaining with 100% scientific precision'", "Connect the 5 Postulates of the Particle Theory to Pure Substances, Mixtures, Concentration, and Heat Transfer", "Master upcoming Ontario Grade 7 strands: Heat in the Environment, Form & Function of Structures, and Interactions in Ecosystems"], "units": [{"id": "sci-u1", "title": "Unit 1: Particle Theory of Matter, Pure Substances & Mixtures (+ Heat & Structures Preview)", "curriculumStrand": "Ontario Grade 7 Science & Technology: Matter and Energy (Strand C) + Earth/Space (Strand E) & Structures (Strand D)", "svgDiagram": "science_particle_svg", "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "The 5 Postulates of the Particle Theory of Matter & Matter Classification", "content": "Whenever D. Forbes asks a 'Why?' question in Chemistry or Heat, the answer always comes back to the 5 Rules of the Particle Theory:", "keyPoints": ["⚛️ Rule 1: All matter is made up of tiny, microscopic particles.", "⚛️ Rule 2: All particles of ONE pure substance are identical (same size, shape, and properties); different pure substances are made of different particles.", "⚛️ Rule 3: There are empty spaces between particles (small spaces in solids/liquids, huge spaces in gases).", "⚛️ Rule 4: Particles are ALWAYS moving (vibrating in solids, sliding in liquids, flying rapidly in gases). Adding heat (thermal energy) makes particles move FASTER and spread farther apart!", "⚛️ Rule 5: There are attractive forces between particles (strongest in solids, weaker in liquids, weakest in gases)."]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Pure Substances vs. Homogeneous Solutions vs. Heterogeneous Mechanical Mixtures", "content": "How can a clear liquid like salt water be a mixture when it looks just like pure water?", "analogy": "🥗 Cafeteria Lunch Analogy: A bottle of distilled water has only H₂O particles (Pure Substance). A bowl of vegetable soup or trail mix in the cafeteria lets you see the separate pieces with your eyes (Heterogeneous Mechanical Mixture). Apple juice or salt dissolved in water has 2+ types of particles, but they attract and hide in the spaces between each other so it looks like one uniform phase (Homogeneous Mixture / Solution)!", "keyPoints": ["Solute vs. Solvent: In a solution, the SOLUTE is the substance in smaller amount that gets dissolved (e.g., salt, sugar), and the SOLVENT is the substance in larger amount that does the dissolving (e.g., water — the 'Universal Solvent')."]}, {"level": 3, "name": "APPLY", "subtitle": "Explain Why Volume Shrinks When Mixing Alcohol and Water (Using Particle Theory)", "content": "Apply Postulates 2, 3, and 5 to explain a classic Grade 7 Science lab phenomenon:", "workedExample": {"prompt": "Lab Observation: You pour 50 mL of pure water and 50 mL of pure rubbing alcohol into a graduated cylinder. Instead of 100 mL, the total volume measures only 96 mL! Why?", "steps": ["Step 1 (Identify Particles — Rule 2): Water particles and alcohol particles are two different pure substances with different particle sizes.", "Step 2 (Identify Spaces — Rule 3): There are empty spaces between the particles of water and between the particles of alcohol.", "Step 3 (Explain Interlocking — Rule 5): Like pouring small marbles into a bucket of basketballs in the gym equipment room, the smaller water particles slip into the empty spaces between the larger alcohol particles, reducing the total volume to 96 mL!"]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Mixture Separation Methods & Heat Transfer Mechanisms", "content": "Analyze how physical properties determine which separation technique works, and how Particle Theory explains Heat:", "comparisonTable": {"headers": ["Concept / Method", "How It Works Scientifically", "What Type of Mixture / System?", "Real-World Example"], "rows": [["Filtration", "Porous barrier traps larger solid particles while small liquid particles pass through", "Mechanical mixture (insoluble solid + liquid)", "Coffee filter, water treatment sand beds"], ["Evaporation", "Heating speeds up solvent particles until they escape as gas, leaving solute behind", "Solution (recovering dissolved solid solute)", "Harvesting sea salt from ocean water"], ["Distillation", "Boils liquid solvent into gas and condenses it back into pure liquid in a cool tube", "Solution (recovering pure liquid solvent or two liquids)", "Desalinating ocean water into pure drinking water"], ["Magnetism / Sifting", "Uses magnetic attraction or particle size differences", "Solid-solid mechanical mixture", "Recycling plants separating steel cans from aluminum"], ["Conduction, Convection, Radiation (Heat Preview)", "Conduction = particle collisions in solids; Convection = warm fluid rising/cool sinking; Radiation = electromagnetic waves", "Thermal Energy Transfer in Earth Systems", "Metal spoon warming (conduction), boiling soup (convection), sunlight (radiation)"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Audit Scientific Explanations for Precision (D. Forbes Rubric Check)", "content": "D. Forbes noted you 'usually explain concepts accurately.' Here is the difference between a 'Usually Accurate (Level 3)' explanation and a '100% Precise (Level 4+)' explanation:", "keyPoints": ["Question: Why does sugar dissolve faster in hot tea than in iced tea?", "⚠️ Informal Answer (Level 3): 'Because the hot tea melts the sugar faster and has more energy.' (Inaccurate word: 'melts'—melting is a phase change from heat alone; dissolving is mixing solute into solvent!).", "✅ Precise Scientific Answer (Level 4+): 'According to the Particle Theory, heating the tea adds thermal energy, causing the water (solvent) particles to move faster and collide more frequently and forcefully with the sugar (solute) crystals. Furthermore, faster-moving water particles spread slightly farther apart, creating larger spaces for sugar particles to disperse uniformly.'"]}, {"level": 6, "name": "CREATE", "subtitle": "Design a 4-Stage Industrial Separation Protocol for an Environmental Spill", "content": "Synthesize magnetism, flotation/skimming, filtration, and distillation to clean up a complex polluted mixture.", "keyPoints": ["Complex Mixture: Water + dissolved road salt + sand + iron filings + floating vegetable oil -> Must be separated in the exact optimal sequence so one step doesn't ruin the next!"]}], "questions": [{"id": "sci-q1", "bloomLevel": 5, "bloomTag": "ANALYZE & EVALUATE", "title": "Particle Theory Precision Lab: Solutions, Saturation & Temperature", "prompt": "A student puts 40 g of salt (solute) into 100 mL of cold water (solvent) at 10°C and stirs. Most of the salt dissolves, leaving a clear liquid on top, but 4 g of undissolved salt crystals sit at the bottom of the beaker. Next, the student heats the beaker to 80°C, and the remaining 4 g of salt disappears completely!\n\nAnswer in deep multi-step scientific work:\n(a) Classify the contents of the beaker at 10°C (is the top liquid a pure substance or solution? Is it saturated or unsaturated? What is the whole beaker containing liquid + bottom crystals?).\n(b) Using at least 3 specific postulates of the Particle Theory, explain WHY heating the water to 80°C allowed the remaining 4 g of salt to dissolve.\n(c) Explain how you could recover BOTH the pure dry salt AND the pure drinking water in separate containers.", "step1_deconstruct": {"instruction": "STOP & PLAN: Identify the exact scientific vocabulary required for parts (a), (b), and (c) so you don't use informal words like 'melted'!", "guidingQuestions": ["Part (a): What do we call a solution that cannot dissolve any more solute at a given temperature? (Saturated!)", "Part (b): Which 3 Particle Theory rules explain dissolving when temperature increases? (Particle motion/speed, spaces between particles, attractive forces/collisions).", "Part (c): If we want to keep BOTH the water and the salt, why isn't simple evaporation enough? Which method captures the water vapour too?"], "modelPlan": "(a) Top liquid = saturated homogeneous solution; whole beaker with undissolved crystals at bottom = heterogeneous mechanical mixture. (b) Use thermal energy -> faster particle motion -> stronger collisions & larger spaces between solvent particles. (c) Use Distillation (not just open evaporation) to condense and keep the pure water while leaving pure salt behind."}, "step2_anchor": {"instruction": "ANCHOR VOCABULARY CHECK: Never confuse 'Dissolving' with 'Melting'!", "referenceItems": ["Saturated Solution: A solution in which no more solute can dissolve at a specific temperature (spaces between solvent particles are full).", "Solubility & Temperature: Increasing temperature increases kinetic energy of particles, increasing solubility of most solids in liquids.", "Distillation = Evaporation + Condensation (recovers BOTH solute and solvent!)."]}, "step3_substeps": [{"label": "Step 3a: Part (a) — Classify the liquid at 10°C (saturated vs. unsaturated solution) and the overall beaker with the 4 g of solid salt at the bottom", "placeholder": "At 10°C, the clear liquid is a ... solution because... However, the entire beaker including the 4 g of undissolved crystals at the bottom is a...", "hint": "Since 36 g dissolved and 4 g could not dissolve at 10°C, the solution is holding its maximum capacity!", "modelSubAnswer": "At 10°C, the clear liquid portion is a saturated homogeneous mixture (solution) because the water (solvent) has dissolved the maximum amount of salt (solute, 36 g) possible at 10°C. Because 4 g of visible solid salt remains settled at the bottom as a second phase, the overall beaker contents form a heterogeneous mechanical mixture."}, {"label": "Step 3b: Part (b) — Explain WHY heating to 80°C dissolved
