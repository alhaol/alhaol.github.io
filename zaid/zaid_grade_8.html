 counsellors, or Kids Help Phone `1-800-668-6868` / text `CONNECT` to `686868`), and separating healthy challenges from overwhelming burnout.", "Grade 8 Health also sharpens your shield against **Body-Image & Supplement Myths** on social media: influencers routinely use filters, lighting tricks, and paid sponsorships to sell 'miracle' energy drinks or protein powders that teens do NOT need—balanced whole foods and water fuel Grade 8 growth far better!", "Finally, practice **Digital Safety & Consent**: NEVER forward private photos, rumours, or screenshots without enthusiastic permission; remember anything shared digitally can become permanent; and be an **Upstander** (supporting targets or alerting a trusted adult) rather than a silent bystander against cyberbullying!"], "keyTakeaway": "Break mental health stigma by seeking support early (`Kids Help Phone: text CONNECT to 686868`). Question filtered social-media fitness ads, and practice strict **digital consent** & **upstander** habits!", "deepReadTitle": "🛡️ Grade 8 Resilience & Support Toolkit", "deepReadText": "• Trusted Circle: Parents/caregivers, school guidance counsellor, coach, doctor\n• Free 24/7 Youth Support in Canada: Kids Help Phone — Call `1-800-668-6868` or Text `CONNECT` to `686868`\n• Pause Rule Online: Before posting/forwarding, ask: Is it True? Is it Kind? Do I have Consent? Would I want my family/future school to see it?", "quickCheck": {"question": "A friend confides that they have felt intensely anxious and exhausted for three weeks and haven't told anyone because they 'don't want to look weak.' What is the healthiest supportive response?", "options": ["Tell them to toughen up and hide it until exams are over.", "Listen without judgment, normalize that mental health matters just like physical health, and encourage talking together to a parent or school counsellor.", "Post about it in a group chat to get advice from classmates."], "correctIdx": 1, "explanation": "Listening empathetically, challenging stigma, and connecting them with a trusted adult or counsellor is the gold-standard supportive response!"}, "videos": [{"id": "lgS5RNP0L2w", "title": "5 Ways to Become Mentally Resilient", "channel": "TherapyToThePoint", "why": "Practical, empowering resilience habits teens can apply immediately."}]}], "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Recall Stigma, Resilience Habits & Digital Consent", "content": "Lock in Strand D life skills:", "keyPoints": ["Stigma = unfair shame that blocks help-seeking | Kids Help Phone = text `CONNECT` to `686868`.", "Digital Consent = never share someone's image/message without clear permission."]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Explain How Social Media Filters Distort Body Image", "content": "Comparing your real everyday self to a stranger's edited, filtered highlight reel creates unfair pressure.", "analogy": "🎬 Movie Special Effects Analogy: Nobody expects to fly like a CGI superhero in real life—treat heavily edited fitness ads with the exact same critical eye!", "keyPoints": ["Focus on what your body can DO (strength, endurance, music, energy), not filtered ads!"]}, {"level": 3, "name": "APPLY", "subtitle": "Practice an Upstander Script Against Cyberbullying", "content": "Respond safely and effectively:", "workedExample": {"prompt": "Someone shares an embarrassing screenshot of a classmate in a group chat.", "steps": ["Step 1: Do NOT laugh, like, or forward it.", "Step 2: Privately check in with the targeted classmate ('That wasn't cool—I've got your back').", "Step 3: Report/alert a trusted adult or school staff if harassment continues."]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Healthy Stress vs. Overwhelming Distress", "content": "Know when everyday nerves need extra support:", "comparisonTable": {"headers": ["State", "Example", "Smart Response"], "rows": [["Everyday Stress", "Pre-quiz butterflies or game nerves", "Prep early, box breathing, exercise, sleep"], ["Persistent Distress", "Weeks of exhaustion, isolation, hopelessness", "Talk early to parents, counsellor, or Kids Help Phone!"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Evaluate High-Caffeine Energy Drink Marketing to Teens", "content": "Spot health risks behind slick branding:", "keyPoints": ["High caffeine/sugar spikes cause heart jitters, sleep disruption, and energy crashes—water + real meals beat energy drinks every time!"]}, {"level": 6, "name": "CREATE", "subtitle": "Create a Personal Grade 8 Balance & Stress Plan", "content": "List 3 proactive habits + 2 trusted people in your support network.", "keyPoints": ["Include sleep/movement, screen boundaries, and trusted adults you can talk to anytime!"]}], "questions": [{"id": "g8-pe-q2", "bloomLevel": 5, "bloomTag": "EVALUATE & APPLY", "title": "Healthy Living Decision Lab: Resilience, Media Myths & Digital Upstander", "prompt": "(a) Explain what **mental health stigma** is, why it is harmful, and name **2 trusted supports** a Grade 8 student in Ontario can turn to.\n(b) A classmate wants to buy expensive caffeinated 'Pro-Athlete Focus Shots' promoted by a TikTok influencer. Give **2 evidence-based reasons** to skip them and suggest a healthier alternative.\n(c) Someone forwards a private embarrassing photo of a peer in a group chat. Outline **3 concrete Upstander steps** respecting digital consent.", "step1_deconstruct": {"instruction": "Define stigma + 2 supports in (a), critique energy shots + offer healthy swap in (b), and give 3 concrete Upstander actions in (c).", "guidingQuestions": ["Why does stigma stop people from getting help early?", "What risks do high-caffeine drinks pose to growing Grade 8s?", "What should you NEVER do AND what SHOULD you do in a group chat?"], "modelPlan": "(a) Stigma = negative stereotypes causing silence; supports = parents/school counsellor + Kids Help Phone (686868). (b) Paid ad bias + caffeine crashes/sleep loss; swap = water + balanced snack + sleep. (c) Refuse to forward/like, support targeted peer privately, report to a trusted adult."}, "step2_anchor": {"instruction": "Strand D Anchors:", "referenceItems": ["Mental Health = just as real as physical health | Text `CONNECT` to `686868`", "Digital Consent + Upstander = Don't forward • Support target • Alert trusted adult"]}, "step3_substeps": [{"label": "Step 3a: Define mental health stigma & name 2 Ontario youth supports", "placeholder": "Stigma is... It is harmful because...\n2 Trusted Supports: 1. ... 2. ...", "hint": "Mention parents/guidance counsellor AND Kids Help Phone (`1-800-668-6868` / text `CONNECT` to `686868`)!", "modelSubAnswer": "**Mental health stigma** is unfair judgment or shame around emotional struggles. It harms teens by making them hide stress instead of getting early care. Two reliable Ontario supports are: (1) a **parent, coach, or school guidance counsellor**, and (2) **Kids Help Phone** (free 24/7: call `1-800-668-6868` or text `CONNECT` to `686868`)."}, {"label": "Step 3b: Give 2 reasons to skip influencer energy shots + 1 healthier fuel swap", "placeholder": "Reason 1: ...\nReason 2: ...\nHealthier Swap: ...", "hint": "Mention paid sponsorship bias + high caffeine disrupting sleep/heart rate; swap = water + fruit/nuts + solid sleep!", "modelSubAnswer": "1. **Paid Ad Bias:** Influencers are paid to hype products regardless of real science.\n2. **Health Risks:** High caffeine and sugar trigger jitters, heart-rate spikes, afternoon crashes, and wrecked sleep.\n• **Healthier Swap:** Cold water, a balanced snack (fruit + protein/whole grains), and 9+ hours of sleep!"}, {"label": "Step 3c: List 3 concrete Upstander actions for the group-chat photo", "placeholder": "1. ...\n2. ...\n3. ...", "hint": "1. Don't forward/react; 2. Support the peer privately; 3. Speak up safely or alert a trusted adult/school!", "modelSubAnswer": "1. **Refuse to amplify:** Do NOT like, laugh at, screenshot, or forward the photo (respecting digital consent).\n2. **Support the target privately:** Message the peer to let them know it was wrong and they aren't alone.\n3. **Take protective action:** Tell the group to delete it if safe, and alert a trusted adult/school staff immediately so it gets shut down."}], "step4_checks": ["Did I clearly define stigma AND list 2 concrete Ontario supports?", "Did I include both media skepticism and health risks in Step 3b?", "Did I list 3 clear, safe Upstander actions in Step 3c?"], "step5_modelAnswer": {"basicAnswer": "Stigma makes people hide stress. Ask parents or counsellors. Energy shots have too much caffeine. Don't forward the photo and tell an adult.", "expandedAnswer": "Part (a): Mental health stigma is negative stereotyping that shames people into silence; trusted Ontario supports include parents/school counsellors and Kids Help Phone (`1-800-668-6868` / text `CONNECT` to `686868`).\nPart (b): Skip influencer focus shots due to paid-ad bias and caffeine/sugar sleep crashes—fuel with water, whole foods, and solid sleep instead.\nPart (c) Upstander Steps: (1) Refuse to forward or react, (2) privately check in to support the targeted peer, and (3) request deletion / alert a trusted adult immediately.", "extensionPrompt": "Extension: What is 1 calming 60-second habit (like Box Breathing or shooting hoops) you use when school week stress builds up?"}}]}]}, {"id": "arts", "code": "The Arts 8 (Music, Drama & Visual Arts)", "name": "The Arts", "friendlySub": "Trombone Key Signatures/Syncopation, Subtext Drama & 2-Point Perspective", "teacher": "Grade 8 Arts", "status": "Creative Mastery", "tier": "Tier 3: Creative Mastery", "tierClass": "tier-extra", "icon": "🎺", "reportComment": "Complete Ontario Grade 8 Arts: Instrumental Music (Bass Clef Key Signatures, Concert Bb/Eb Scales, Syncopation & Articulation on Trombone), Drama (Subtext, Ensemble & Forum Theatre), and Visual Arts (2-Point Perspective & Colour Harmony).", "nextSteps": ["Check Key Signatures FIRST before playing any band piece on trombone (Bb & Eb = 2 flats!)", "Master off-beat syncopation and crisp articulation (legato vs. staccato) in band", "Use Two-Point Perspective (2 Vanishing Points on the Horizon Line) for realistic 3D architectural art"], "units": [{"id": "g8-arts-u1", "title": "Unit 1 (Music): Trombone Key Signatures, Syncopation & Expressive Articulation", "studyFirstTag": "Decode Bass Clef flats (`B-E-A-D`), count off-beat syncopation & polish band tone!", "curriculumStrand": "Ontario Grade 8 Arts — Music: Theory, Performance & Expression", "svgDiagram": "g8_pe_arts_svg", "lessons": [{"id": "g8-arts-u1-l1", "title": "Lesson 1.1: Bass Clef Key Signatures, Syncopation & Trombone Articulation", "readTime": "3 min read", "bigIdea": "Checking the **Key Signature** BEFORE your first breath saves 90% of wrong notes on trombone—and mastering **Syncopation** (accenting the unexpected off-beat!) brings jazz and band pieces alive!", "paragraphs": ["Every band piece starts with a **Key Signature** right beside the Bass Clef showing which notes stay flat (`♭`) or sharp (`♯`) throughout the whole song! Memorize the **Order of Flats**: **`B - E - A - D - G - C - F`** (*BEAD + Greatest Common Factor!*). Your two favourite Grade 8 concert band keys on trombone are **Concert B♭ Major** (2 flats: `B♭` in 1st pos, `E♭` in 3rd pos) and **Concert E♭ Major** (3 flats: `B♭, E♭, A♭`—note `A♭` is in 3rd position instead of `A♮` in 2nd!).", "**Syncopation** happens when a composer puts strong accents on the **weak off-beats (`&` / beats 2 & 4)** instead of the steady marching beats (`1, 2, 3, 4`). Count steadily with your foot tapping down on numbers (`1, 2, 3, 4`) and lifting up on `&` (`1 & 2 & 3 & 4 &`)—never rush syncopated eighth-quarter-eighth rhythms!", "Finally, Grade 8 trombone artistry shines through **Articulation & Dynamics**: **Staccato** (dot over/under note = short & detached `'Tah!'`), **Legato** (smooth connected `'Dah'` tongue—essential on trombone so you don't accidentally glissando-smear between slide positions!), and **Crescendo (`<`) / Decrescendo (`>`)** shaping musical phrases cleanly."], "keyTakeaway": "Order of Flats = `B-E-A-D-G-C-F` (Concert B♭ = `B♭, E♭`; Concert E♭ = `B♭, E♭, A♭`). Use soft `'Dah'` legato tonguing on trombone to stay smooth without smearing!", "deepReadTitle": "🎺 Grade 8 Trombone Sight-Reading 4-Step Check (S.T.A.R.)", "deepReadText": "• S — Signature (Key Signature flats + Time Signature `4/4` or `3/4`)\n• T — Tempo & Rhythm (Spot dotted rhythms & syncopation!)\n• A — Accidentals & Articulation (Staccato dots, accents, legato slurs)\n• R — Road Map (Repeats, 1st/2nd endings, D.S. al Coda!)", "quickCheck": {"question": "A band piece has **3 flats** (`B♭, E♭, A♭`) in the Key Signature. Which key is it in, and what slide position do you use for `A♭`?", "options": ["Concert F Major; A♭ in 1st position", "Concert E♭ Major; A♭ in 3rd position (instead of A natural in 2nd!)", "Concert C Major; A♭ in 7th position"], "correctIdx": 1, "explanation": "3 flats (`B♭, E♭, A♭`) = **Concert E♭ Major**, and lowering `A♮` (2nd pos) by a half-step moves the slide out 1 position to **3rd position (`A♭`)**!"}, "videos": [{"id": "YEOfCL-prWs", "title": "Flats, Sharps and Key Signatures — Bass Clef", "channel": "Keith Marshall", "why": "Specifically designed for Bass Clef instruments like trombone!"}]}], "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Recall Order of Flats, Syncopation & Articulations", "content": "Lock in Grade 8 band theory:", "keyPoints": ["Flats Order: `B-E-A-D-G-C-F` | Concert B♭ (2♭: B♭, E♭) | Concert E♭ (3♭: B♭, E♭, A♭).", "Staccato = short/crisp (`Tah`) • Legato = smooth (`Dah`) • Syncopation = accenting off-beats (`&`)."]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Explain Why Trombonists Must Use Soft 'Dah' Tonguing on Legato Slurs", "content": "Because a trombone slide changes pitch continuously, blowing without a gentle `'Dah'` tongue creates a goofy cartoon siren smear (glissando)!", "analogy": "🎨 Paintbrush Analogy: A gentle `'Dah'` breath-tongue connects notes like smooth blended brushstrokes without smearing the canvas!", "keyPoints": ["Move the slide **fast and crisp** right on the beat, even in slow legato songs!"]}, {"level": 3, "name": "APPLY", "subtitle": "Apply the S.T.A.R. Sight-Reading Routine to a New Band Piece", "content": "Scan for 15 seconds before playing:", "workedExample": {"prompt": "You see 3 flats, `4/4` time, and `mf < f` under a 4-bar phrase.", "steps": ["S: Concert E♭ (`B♭, E♭, A♭` — watch 3rd pos A♭!).", "T: 4 quarter beats per bar.", "A/R: Start medium-loud (`mf`) and smoothly crescendo to loud (`f`)!"]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Articulation Styles on Trombone", "content": "Match symbol, syllable, and sound:", "comparisonTable": {"headers": ["Mark", "Name", "Tongue Syllable", "Musical Character"], "rows": [["Dot (•)", "Staccato", "Crisp 'Tah' (space between)", "Light, bouncy, detached"], ["Curved Line", "Legato / Slur", "Soft 'Dah' (fast slide!)", "Smooth, singing, connected"], ["`>`", "Accent", "Firm 'TAH' air push", "Bold punchy emphasis"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Diagnose 2 Common Band Rhythm Mistakes", "content": "Fix rushing & missed flats:", "keyPoints": ["1. Playing `A♮` (2nd) instead of `A♭` (3rd) in E♭ Major! 2. Rushing through syncopated rests—always subdivide `1 & 2 & 3 & 4 &` mentally!"]}, {"level": 6, "name": "CREATE", "subtitle": "Sketch a 2-Bar Syncopated Trombone Warm-Up Phrase", "content": "Combine steady air support, a syncopated `eighth-quarter-eighth` bar, and a `mp < f` crescendo.", "keyPoints": ["Keep foot tapping evenly on beats 1–2–3–4 while accenting the `&` of beat 2!"]}], "questions": [{"id": "g8-arts-q1", "bloomLevel": 4, "bloomTag": "APPLY & ANALYZE", "title": "Grade 8 Band & Trombone Mastery Workbench (Key Signatures & Expression)", "prompt": "Your Grade 8 concert band hands out a new jazz-band chart with **3 flats** in the Bass Clef key signature, syncopated off-beat rhythms, and legato markings (`mp < f`).\n(a) Name the exact **3 flat notes** (in order) and the **Concert Major Key**, and state which slide position changes compared to Concert B♭ Major.\n(b) Explain what **Syncopation** is and describe 1 technique to stay locked in tempo while playing syncopated bars.\n(c) Explain how a trombonist plays a **Legato** phrase cleanly WITHOUT accidental glissando smearing, AND what `mp < f` tells you to do!", "step1_deconstruct": {"instruction": "Identify 3 flats + key + slide change in (a), syncopation + counting strategy in (b), and legato `'Dah'` + dynamic crescendo in (c).", "guidingQuestions": ["What are the first 3 letters of `B-E-A-D-G-C-F`?", "What does syncopation accent?", "How does soft `'Dah'` + fast slide movement prevent smearing?"], "modelPlan": "(a) B♭, E♭, A♭ = Concert E♭ Major; A moves from 2nd (A♮) to 3rd pos (A♭). (b) Accents on weak off-beats; subdivide `1 & 2 & 3 & 4 &` silently with steady toe tap. (c) Soft `'Dah'` tongue + crisp fast slide shift; grow smoothly from medium-soft to loud."}, "step2_anchor": {"instruction": "Music Anchors:", "referenceItems": ["Flats: `B-E-A-D-G-C-F` | 3♭ = Concert E♭ (`A♭` = 3rd pos!)", "`mp` = mezzo piano (medium soft) | `<` = crescendo | `f` = forte (loud)"]}, "step3_substeps": [{"label": "Step 3a: Name the 3 flats, Concert Key, and key slide-position change", "placeholder": "3 Flats: ...\nKey: Concert ... Major\nSlide Change: ...", "hint": "First 3 flats = `B♭, E♭, A♭` → Concert E♭ Major (`A` shifts from 2nd to 3rd position)!", "modelSubAnswer": "• **3 Flats:** `B♭, E♭, A♭`\n• **Key:** **Concert E♭ Major**\n• **Slide Change:** Watch every `A`—play **`A♭` in 3rd position** instead of `A♮` in 2nd position!"}, {"label": "Step 3b: Define Syncopation + give 1 rock-solid counting strategy", "placeholder": "Syncopation means...\nTo stay in time, I...", "hint": "Accenting weak off-beats (`&`); keep foot pulsing steadily on beats 1-2-3-4 while subdividing `1 & 2 & 3 & 4 &`!", "modelSubAnswer": "**Syncopation** places musical emphasis on unexpected weak off-beats (like the `&` between numbers) rather than steady downbeats. To stay rock-solid in time, silently subdivide **`1 & 2 & 3 & 4 &`** while tapping your toe lightly inside your shoe on beats 1–2–3–4!"}, {"label": "Step 3c: Explain clean Trombone Legato technique AND interpret `mp < f`", "placeholder": "For clean legato on trombone...\n`mp < f` means...", "hint": "Soft `'Dah'` tongue + fast snap-slide right on the beat; `mp < f` = medium soft growing smoothly to loud!", "modelSubAnswer": "For smooth **legato** without cartoon smearing, keep steady warm air flowing, flick the slide **quickly right on the beat**, and use a gentle **`'Dah'`** tongue syllable at the exact instant the slide arrives. The dynamic `mp < f` tells you to start **medium-soft (`mezzo piano`)** and **crescendo (`<`)** smoothly up to **loud (`forte`)**!"}], "step4_checks": ["Did I name `B♭, E♭, A♭` = Concert E♭ Major and spot `A♭` in 3rd position?", "Did I define syncopation accurately and explain subdividing (`1 & 2 &...`)?", "Did I mention BOTH `'Dah'` legato tonguing + fast slide movement AND decode `mp < f`?"], "step5_modelAnswer": {"basicAnswer": "Bb Eb Ab, Eb major, 3rd pos. Syncopation is off-beat. Use soft tongue and get louder.", "expandedAnswer": "Part (a): The 3 flats are `B♭, E♭, A♭` (**Concert E♭ Major**), shifting `A` from 2nd position (`A♮`) out to **3rd position (`A♭`)**.\nPart (b): Syncopation stresses weak off-beats (`&`); subdividing `1 & 2 & 3 & 4 &` against a steady pulse prevents rushing.\nPart (c): Clean trombone legato combines uninterrupted warm airflow, rapid right-on-the-beat slide shifts, and a gentle `'Dah'` tongue articulation; `mp < f` instructs a smooth crescendo from medium-soft (`mezzo piano`) to loud (`forte`).", "extensionPrompt": "Extension: What happens to your pitch if you push louder (`f`) without supporting from your diaphragm? (It goes sharp or splats—use wider warm air!)"}}]}, {"id": "g8-arts-u2", "title": "Unit 2 (Drama & Visual Arts): Two-Point Perspective, Colour Harmony & Dramatic Subtext", "studyFirstTag": "Draw 3D street corners with 2 Vanishing Points + master Subtext on stage!", "curriculumStrand": "Ontario Grade 8 Arts — Visual Arts & Drama", "svgDiagram": "g8_pe_arts_svg", "lessons": [{"id": "g8-arts-u2-l1", "title": "Lesson 2.1: Two-Point Perspective Art, Colour Schemes & Drama Subtext", "readTime": "3 min read", "bigIdea": "In **Two-Point Perspective**, you look at the **corner** of a building so left walls converge to **VP1**, right walls converge to **VP2**, and ALL vertical corners stay 100% straight up-and-down (`90°`)!", "paragraphs": ["In Grade 7 Visual Arts, you used **One-Point Perspective** (looking straight down a hallway to 1 Vanishing Point). In Grade 8, **Two-Point Perspective** creates realistic 3D street corners and city skylines! Draw a horizontal **Horizon Line** (eye level) and place **TWO Vanishing Points (`VP1` far left, `VP2` far right)**. Draw your building's nearest vertical corner straight up-and-down, connect its top and bottom to `VP1` for the left wall and to `VP2` for the right wall—and keep EVERY vertical edge strictly parallel to the side of the page!", "Pair strong perspective with deliberate **Colour Harmony**: **Complementary colours** (opposites on the colour wheel: Blue/Orange, Red/Green) create high-energy pop; **Analogous colours** (3 neighbours: Blue, Blue-Green, Green) create calm unity; **Monochromatic** (1 hue + white tints / black shades) sets dramatic mood.", "In **Grade 8 Drama**, elevate your acting with **Subtext**—the hidden emotion or intention *underneath* the spoken words! Saying *'I'm totally fine'* with crossed arms, tight shoulders, and avoiding eye contact tells the audience the exact opposite of the literal script. In **Forum Theatre**, audiences can even shout *'Freeze!'* and step onto stage to rehearse fairer real-world choices!"], "keyTakeaway": "2-Point Perspective = Horizon Line + `VP1` (left faces) + `VP2` (right faces) + **strictly vertical edges (`90°`)**. In Drama, **Subtext** communicates hidden feelings through tone, posture, and pauses!", "deepReadTitle": "🎨 Colour Harmony & Drama Subtext Quick Guide", "deepReadText": "• Complementary = Opposites (High contrast!) | Analogous = Neighbours (Calm harmony!) | Monochromatic = 1 colour + Tints/Shades\n• 2-Point Rule: Left walls → VP1 | Right walls → VP2 | Verticals → Straight 90°!\n• Subtext = What a character REALLY feels underneath polite or guarded dialogue!", "quickCheck": {"question": "When drawing a 3D city corner in **Two-Point Perspective**, which direction do the left walls, right walls, and vertical building corners point?", "options": ["All lines point to one single dot in the middle of the page.", "Left wall edges point to VP1, right wall edges point to VP2, and vertical corners stay strictly straight up-and-down (`90°`).", "Vertical corners tilt diagonally toward VP1 and VP2."], "correctIdx": 1, "explanation": "In 2-Point Perspective, receding left/right wall edges meet `VP1` and `VP2` on the horizon line, while vertical building edges always stay perfectly vertical (`90°`)!"}, "videos": [{"id": "yNq78n02fMQ", "title": "How to Draw a City Using Two-Point Perspective", "channel": "Circle Line Art School", "why": "Step-by-step demonstration of VP1, VP2, and crisp 90° verticals."}]}], "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Recall 2-Point Perspective, Colour Schemes & Subtext", "content": "Lock in Unit 2 Arts foundations:", "keyPoints": ["2-Point Perspective = Horizon Line + VP1 + VP2 + strictly vertical 90° corners.", "Colour: Complementary (opposites) • Analogous (neighbours) • Monochromatic (1 hue + tints/shades) | Drama: Subtext (hidden meaning)."]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Explain Why Vertical Lines Never Tilt in 2-Point Perspective", "content": "In 2-point perspective, your camera looks level toward the horizon, so vertical walls stay parallel—tilted lines make buildings look like they're collapsing!", "analogy": "📐 Ruler Check Analogy: Line your ruler edge flush with the top/bottom of your sketchbook before drawing any window or wall corner!", "keyPoints": ["Only 3-point perspective (looking straight up at a skyscraper) tilts vertical lines!"]}, {"level": 3, "name": "APPLY", "subtitle": "Stage One Line of Dialogue with Two Opposite Subtexts", "content": "See how acting choices change meaning completely:", "workedExample": {"prompt": "Script Line: « Sure, go ahead without me. »", "steps": ["Subtext A (Encouraging): Warm smile, open palms, upbeat tone → 'I genuinely want you to succeed!'", "Subtext B (Hurt/Left Out): Eyes drop to floor, quiet flat voice, slow turn away → 'It hurts that you didn't wait for me.'"]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare 1-Point vs. 2-Point Perspective", "content": "Pick the right tool for your drawing:", "comparisonTable": {"headers": ["Technique", "Viewer Angle", "Vanishing Points", "Best Subject"], "rows": [["1-Point Perspective", "Facing flat front wall", "1 VP in centre", "School hallway, train tracks"], ["2-Point Perspective", "Facing 3D corner edge", "2 VPs (far left & right)", "Street corner, futuristic city block"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Audit a Student Perspective Drawing for 2 Classic Glitches", "content": "Check before shading:", "keyPoints": ["1. Placing VP1 & VP2 too close together (causes warped 'fish-eye' buildings—put VPs near the far edges!). 2. Forgetting to line up window tops/bottoms to VP1/VP2!"]}, {"level": 6, "name": "CREATE", "subtitle": "Plan a Dramatic City-Corner Artwork with Intentional Colour Mood", "content": "Combine 2-point perspective geometry with either an Analogous twilight palette or high-contrast Complementary neon accents.", "keyPoints": ["Explain how your colour choice reinforces the artwork's mood!"]}], "questions": [{"id": "g8-arts-q2", "bloomLevel": 6, "bloomTag": "APPLY & CREATE", "title": "Visual Arts & Drama Studio: 2-Point Perspective, Colour Mood & Subtext", "prompt": "(a) Outline the exact **4 drawing steps** to sketch a 3D corner building (with windows on both walls!) in **Two-Point Perspective**—naming where left edges, right edges, and verticals go.\n(b) You want to paint that city street to feel **calm, cool, and rainy at dusk**. Pick the best **Colour Scheme** (Complementary, Analogous, or Monochromatic), name 3 specific colours you would use, and explain WHY.\n(c) **Drama Subtext Challenge:** Show how an actor could perform the exact same line—*« Great job, you really nailed that. »*—in TWO totally different ways (1 = Sincere Pride, 2 = Hidden Jealousy) using voice tone, eye contact, and posture!", "step1_deconstruct": {"instruction": "Give crisp geometry steps in (a), match colour harmony to calm dusk mood in (b), and contrast body/voice acting cues in (c).", "guidingQuestions": ["Where do VP1 and VP2 sit, and what angle are vertical walls?", "Which colour scheme creates calm unity vs. bold clash?", "How do tone, pause, posture, and eye contact flip the subtext?"], "modelPlan": "(a) Horizon Line + far-edge VP1/VP2 → vertical corner → connect left wall/windows to VP1, right wall/windows to VP2, all verticals 90°. (b) Analogous cool blues/blue-greens/violets (or Monochromatic blue tints/shades) create serene harmony. (c) Sincere = bright voice, warm eye contact, open stance; Jealous = flat tone, forced tiny smile, crossed arms/glancing away."}, "step2_anchor": {"instruction": "Arts Anchors:", "referenceItems": ["2-Point: Horizon Line + VP1 (left) + VP2 (right) + 90° Verticals", "Analogous = peaceful unity | Complementary = dramatic pop | Subtext = tone + posture + gaze"]}, "step3_substeps": [{"label": "Step 3a: List the 4 steps to draw a 2-Point Perspective corner building with windows", "placeholder": "1. Draw Horizon Line & place VP1/VP2...\n2. Draw vertical corner...\n3. ...\n4. ...", "hint": "Keep VPs wide apart, align BOTH wall tops/bottoms AND window tops/bottoms to VP1 (left) and VP2 (right), and keep all vertical sides straight 90°!", "modelSubAnswer": "1. Draw a level **Horizon Line** and place **VP1** (far left) and **VP2** (far right).\n2. Draw the nearest building corner as a straight **90° vertical line**.\n3. Connect top and bottom of that corner to **VP1** (left wall) and **VP2** (right wall), closing both walls with straight vertical edges.\n4. Draw window tops/bottoms aiming directly back to **VP1** (left wall) or **VP2** (right wall), keeping all window sides strictly vertical (`90°`)!"}, {"label": "Step 3b: Choose a Colour Harmony for a calm rainy dusk street & justify with 3 colours", "placeholder": "Colour Scheme: ...\n3 Colours: ...\nWhy it creates the mood: ...", "hint": "Analogous cool colours (`blue, blue-violet, teal/blue-green`) or Monochromatic blue tints/shades create quiet harmony!", "modelSubAnswer": "• **Colour Scheme:** **Analogous** (cool neighbours on the colour wheel).\n• **3 Colours:** Deep indigo (`blue-violet`), slate `blue`, and muted `blue-green`.\n• **Why:** Because neighbouring cool hues share blue undertones with low visual clash, they naturally evoke calm, quiet rainy twilight—with just a tiny touch of warm streetlight contrast if desired!"}, {"label": "Step 3c: Contrast 2 opposite Subtext performances of « Great job, you really nailed that. »", "placeholder": "1. Sincere Pride (Voice, Eyes, Posture): ...\n2. Hidden Jealousy (Voice, Eyes, Posture): ...", "hint": "Detail exact vocal emphasis, pauses, eye contact, and physical posture for BOTH versions!", "modelSubAnswer": "• **Version 1 (Sincere Pride):** Warm upbeat tone emphasizing *'really nailed'*, steady bright eye contact, relaxed open shoulders stepping toward the partner.\n• **Version 2 (Hidden Jealousy):** Flat clipped rhythm with a slight pause before *'nailed'*, brief glance away instead of steady eye contact, crossed arms and stiff shoulders leaning slightly back."}], "step4_checks": ["Did I specify VP1 for left faces/windows, VP2 for right faces/windows, and 90° verticals?", "Did I match my chosen colour scheme accurately to a calm rainy dusk mood?", "Did I give specific vocal, eye-contact, and body-posture cues for BOTH subtexts?"], "step5_modelAnswer": {"basicAnswer": "Use 2 vanishing points and straight verticals. Use blue analogous colours for calm. Change your voice and posture for jealousy.", "expandedAnswer": "Part (a): (1) Draw Horizon Line + wide-spaced VP1/VP2; (2) Draw the front 90° vertical corner; (3) Connect receding left edges/windows to VP1 and right edges/windows to VP2; (4) Keep every vertical corner and window edge strictly 90°.\nPart (b): An **Analogous** cool palette (indigo, slate blue, blue-green) creates serene, unified rainy-dusk harmony because adjacent hues blend peacefully.\nPart (c): Sincere pride uses warm inflection, open posture, and steady eye contact; hidden jealousy flips the exact same words using flat clipped tone, guarded crossed arms, and evasive glances.", "extensionPrompt": "Extension: Try sketching a quick 2-point perspective street corner on paper—remember to keep your ruler strictly parallel to the page edge for every vertical!"}}]}]}];
    const DIAGRAMS = {"g8_french_past_svg": "\n    <svg viewBox=\"0 0 800 225\" class=\"topic-svg\" role=\"img\" aria-label=\"Grade 8 French Past Tenses and Futur Simple Anchor Diagram\">\n      <rect x=\"0\" y=\"0\" width=\"800\" height=\"225\" rx=\"14\" fill=\"#0f172a\"/>\n      <rect x=\"16\" y=\"18\" width=\"246\" height=\"189\" rx=\"12\" fill=\"#1e293b\" stroke=\"#3b82f6\" stroke-width=\"2\"/>\n      <text x=\"139\" y=\"44\" fill=\"#60a5fa\" font-size=\"13.5\" font-weight=\"bold\" text-anchor=\"middle\">1. Passé Composé (ÊTRE)</text>\n      <text x=\"139\" y=\"64\" fill=\"#93c5fd\" font-size=\"11\" text-anchor=\"middle\">DR MRS VANDERTRAMP + Reflexives</text>\n      <text x=\"32\" y=\"92\" fill=\"#e2e8f0\" font-size=\"12\">• aller, venir, partir, arriver, sortir</text>\n      <text x=\"32\" y=\"114\" fill=\"#e2e8f0\" font-size=\"12\">• entrer, rentrer, rester, tomber</text>\n      <text x=\"32\" y=\"136\" fill=\"#fde047\" font-size=\"12\" font-weight=\"bold\">MUST AGREE (+e / +s / +es)!</text>\n      <text x=\"32\" y=\"160\" fill=\"#6ee7b7\" font-size=\"12\">Elle est all<tspan font-weight=\"bold\">ée</tspan> • Ils sont part<tspan font-weight=\"bold\">is</tspan></text>\n      <text x=\"32\" y=\"184\" fill=\"#cbd5e1\" font-size=\"11.5\">Je me suis réveillé à 7h!</text>\n\n      <rect x=\"277\" y=\"18\" width=\"246\" height=\"189\" rx=\"12\" fill=\"#1e293b\" stroke=\"#10b981\" stroke-width=\"2\"/>\n      <text x=\"400\" y=\"44\" fill=\"#34d399\" font-size=\"13.5\" font-weight=\"bold\" text-anchor=\"middle\">2. Imparfait vs. PC Movie Rule</text>\n      <text x=\"400\" y=\"66\" fill=\"#a7f3d0\" font-size=\"11\" text-anchor=\"middle\">NOUS stem + -ais,-ais,-ait,-ions,-iez,-aient</text>\n      <text x=\"293\" y=\"94\" fill=\"#6ee7b7\" font-size=\"12\" font-weight=\"bold\">Imparfait = Background / Habit</text>\n      <text x=\"293\" y=\"114\" fill=\"#e2e8f0\" font-size=\"11.5\">« Il faisait beau, je jouais... »</text>\n      <text x=\"293\" y=\"142\" fill=\"#fbbf24\" font-size=\"12\" font-weight=\"bold\">PC = Sudden Action (Soudain!)</text>\n      <text x=\"293\" y=\"162\" fill=\"#e2e8f0\" font-size=\"11.5\">« ...quand soudain il a plu! »</text>\n      <text x=\"293\" y=\"188\" fill=\"#93c5fd\" font-size=\"11.5\">Only irregular stem: être → ét-</text>\n\n      <rect x=\"538\" y=\"18\" width=\"246\" height=\"189\" rx=\"12\" fill=\"#1e293b\" stroke=\"#f59e0b\" stroke-width=\"2\"/>\n      <text x=\"661\" y=\"44\" fill=\"#fbbf24\" font-size=\"13.5\" font-weight=\"bold\" text-anchor=\"middle\">3. Futur Simple &amp; Pronouns</text>\n      <text x=\"661\" y=\"66\" fill=\"#fed7aa\" font-size=\"11\" text-anchor=\"middle\">R-stem + -ai, -as, -a, -ons, -ez, -ont</text>\n      <text x=\"554\" y=\"94\" fill=\"#e2e8f0\" font-size=\"12\">• être → <tspan fill=\"#fde047\" font-weight=\"bold\">ser-</tspan> | avoir → <tspan fill=\"#fde047\" font-weight=\"bold\">aur-</tspan></text>\n      <text x=\"554\" y=\"116\" fill=\"#e2e8f0\" font-size=\"12\">• aller → <tspan fill=\"#fde047\" font-weight=\"bold\">ir-</tspan>  | faire → <tspan fill=\"#fde047\" font-weight=\"bold\">fer-</tspan></text>\n      <text x=\"554\" y=\"146\" fill=\"#38bdf8\" font-size=\"12\" font-weight=\"bold\">COD Pronouns BEFORE verb:</text>\n      <text x=\"554\" y=\"168\" fill=\"#e2e8f0\" font-size=\"12\">le / la / l' / les → « Je <tspan fill=\"#38bdf8\" font-weight=\"bold\">les</tspan> finis! »</text>\n      <text x=\"554\" y=\"188\" fill=\"#cbd5e1\" font-size=\"11.5\">2 verbs: « Je vais <tspan fill=\"#38bdf8\" font-weight=\"bold\">la</tspan> lire! »</text>\n    </svg>\n    ", "g8_geo_pop_svg": "\n    <svg viewBox=\"0 0 800 230\" class=\"topic-svg\" role=\"img\" aria-label=\"Grade 8 Geography Population Pyramids and Settlement Patterns\">\n      <rect x=\"0\" y=\"0\" width=\"800\" height=\"230\" rx=\"14\" fill=\"#0f172a\"/>\n      <text x=\"400\" y=\"28\" fill=\"#38bdf8\" font-size=\"14\" font-weight=\"bold\" text-anchor=\"middle\">🗺️ Nelson GEO 8: Reading Population Pyramids &amp; Settlement Patterns</text>\n      <!-- Expansive Pyramid -->\n      <rect x=\"18\" y=\"42\" width=\"180\" height=\"170\" rx=\"10\" fill=\"#1e293b\" stroke=\"#f97316\" stroke-width=\"2\"/>\n      <text x=\"108\" y=\"64\" fill=\"#fb923c\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\">1. EXPANSIVE</text>\n      <polygon points=\"108,82 48,166 168,166\" fill=\"#f97316\" fill-opacity=\"0.35\" stroke=\"#fb923c\" stroke-width=\"2.5\"/>\n      <text x=\"108\" y=\"186\" fill=\"#e2e8f0\" font-size=\"11\" text-anchor=\"middle\">Wide Base = Rapid Growth</text>\n      <text x=\"108\" y=\"202\" fill=\"#fed7aa\" font-size=\"10.5\" text-anchor=\"middle\">Needs: Schools &amp; Youth Jobs</text>\n      <!-- Stationary Pyramid -->\n      <rect x=\"212\" y=\"42\" width=\"180\" height=\"170\" rx=\"10\" fill=\"#1e293b\" stroke=\"#10b981\" stroke-width=\"2\"/>\n      <text x=\"302\" y=\"64\" fill=\"#34d399\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\">2. STATIONARY</text>\n      <polygon points=\"274,82 330,82 350,166 254,166\" fill=\"#10b981\" fill-opacity=\"0.32\" stroke=\"#34d399\" stroke-width=\"2.5\"/>\n      <text x=\"302\" y=\"186\" fill=\"#e2e8f0\" font-size=\"11\" text-anchor=\"middle\">Straight Sides = Stable</text>\n      <text x=\"302\" y=\"202\" fill=\"#a7f3d0\" font-size=\"10.5\" text-anchor=\"middle\">Balanced Births &amp; Deaths</text>\n      <!-- Constrictive Pyramid -->\n      <rect x=\"406\" y=\"42\" width=\"180\" height=\"170\" rx=\"10\" fill=\"#1e293b\" stroke=\"#3b82f6\" stroke-width=\"2\"/>\n      <text x=\"496\" y=\"64\" fill=\"#60a5fa\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\">3. CONSTRICTIVE</text>\n      <polygon points=\"452,88 540,88 524,166 468,166\" fill=\"#3b82f6\" fill-opacity=\"0.32\" stroke=\"#60a5fa\" stroke-width=\"2.5\"/>\n      <text x=\"496\" y=\"186\" fill=\"#e2e8f0\" font-size=\"11\" text-anchor=\"middle\">Narrow Base = Aging</text>\n      <text x=\"496\" y=\"202\" fill=\"#bfdbfe\" font-size=\"10.5\" text-anchor=\"middle\">Needs: Senior Care &amp; Workers</text>\n      <!-- Density & HDI Formula Box -->\n      <rect x=\"600\" y=\"42\" width=\"182\" height=\"170\" rx=\"10\" fill=\"#1e293b\" stroke=\"#a855f7\" stroke-width=\"2\"/>\n      <text x=\"691\" y=\"66\" fill=\"#c084fc\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\">📊 Key GEO 8 Math</text>\n      <text x=\"612\" y=\"92\" fill=\"#fde047\" font-size=\"11.5\" font-weight=\"bold\">Density = Pop ÷ km²</text>\n      <text x=\"612\" y=\"112\" fill=\"#e2e8f0\" font-size=\"11\">• Sparse: &lt;15 /km²</text>\n      <text x=\"612\" y=\"128\" fill=\"#e2e8f0\" font-size=\"11\">• Mod: 15–150 /km²</text>\n      <text x=\"612\" y=\"144\" fill=\"#e2e8f0\" font-size=\"11\">• Dense: &gt;150 /km²</text>\n      <text x=\"612\" y=\"170\" fill=\"#6ee7b7\" font-size=\"11.5\" font-weight=\"bold\">HDI (0.00–1.00):</text>\n      <text x=\"612\" y=\"188\" fill=\"#e2e8f0\" font-size=\"10.5\">Health + Education + Income</text>\n    </svg>\n    ", "g8_math_pyth_slope_svg": "\n    <svg viewBox=\"0 0 800 230\" class=\"topic-svg\" role=\"img\" aria-label=\"Grade 8 Math Pythagorean Theorem, Slope y=mx+b, and Compound Interest\">\n      <rect x=\"0\" y=\"0\" width=\"800\" height=\"230\" rx=\"14\" fill=\"#0f172a\"/>\n      <!-- Left: Pythagorean Theorem -->\n      <rect x=\"16\" y=\"18\" width=\"248\" height=\"194\" rx=\"12\" fill=\"#1e293b\" stroke=\"#38bdf8\" stroke-width=\"2\"/>\n      <text x=\"140\" y=\"42\" fill=\"#38bdf8\" font-size=\"13.5\" font-weight=\"bold\" text-anchor=\"middle\">1. Pythagoras: a² + b² = c²</text>\n      <polygon points=\"55,152 175,152 55,72\" fill=\"#38bdf8\" fill-opacity=\"0.2\" stroke=\"#38bdf8\" stroke-width=\"3\"/>\n      <rect x=\"55\" y=\"138\" width=\"14\" height=\"14\" fill=\"none\" stroke=\"#fde047\" stroke-width=\"2\"/>\n      <text x=\"36\" y=\"118\" fill=\"#e2e8f0\" font-size=\"12\" font-weight=\"bold\">a=6</text>\n      <text x=\"115\" y=\"168\" fill=\"#e2e8f0\" font-size=\"12\" f font-size=\"11.5\">Drama Subtext = Tone + Posture + Eye Contact!</text>\n    </svg>\n    "};

    let app = {
      screen: 'home',         // 'home' | 'course' | 'lesson' | 'bloom' | 'question'
      courseIdx: 0,
      unitIdx: 0,
      openUnitIdx: 0,         // Only 1 unit card open at a time on Course screen!
      lessonIdx: 0,
      lessonTab: 'read',      // Focused 1-activity card inside Lesson: 'read' | 'watch' | 'check'
      activeVideoIdx: 0,
      bloomLvl: 1,
      questionIdx: 0,
      qaStep: 1,              // 1..5
      subStepIdx: 0,          // 0..2
      showMoreSubjects: false,
      teacherMode: false
    };

    let saved = JSON.parse(localStorage.getItem('zaid_grade8_v1') || '{"lessonsRead":{},"qcAnswers":{},"inputs":{},"checks":{},"qaDone":{},"weakSpots":{},"feedbackNotes":[]}');
    if (!saved.weakSpots) saved.weakSpots = {};
    if (!saved.feedbackNotes) saved.feedbackNotes = [];
    if (!saved.streak) saved.streak = { days: 0, lastDate: '' };
    if (!saved.drillStats) saved.drillStats = { mathCorrect: 0, frenchCorrect: 0, sprintsDone: 0 };

    function recordDailyActivity() {
      const today = new Date().toISOString().slice(0, 10);
      if (saved.streak.lastDate === today) return;
      const yest = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
      saved.streak.days = (saved.streak.lastDate === yest) ? (saved.streak.days + 1) : 1;
      saved.streak.lastDate = today;
    }

    // Focus Timer
    let timerSec = 15 * 60;
    let timerId = null;

    function formatTime() {
      const m = String(Math.floor(timerSec / 60)).padStart(2, '0');
      const s = String(timerSec % 60).padStart(2, '0');
      return `${m}:${s}`;
    }
    function toggleTimer() {
      if (timerId) {
        clearInterval(timerId); timerId = null;
      } else {
        timerId = setInterval(() => {
          if (timerSec > 0) {
            timerSec--;
            const el = document.getElementById('modalTimerDigits');
            if (el) el.textContent = formatTime();
          } else {
            clearInterval(timerId); timerId = null;
            saved.drillStats.sprintsDone = (saved.drillStats.sprintsDone || 0) + 1;
            saveState();
          }
        }, 1000);
      }
      openToolsModal();
    }
    function resetTimer() {
      if (timerId) clearInterval(timerId);
      timerId = null;
      timerSec = 15 * 60;
      openToolsModal();
    }

    function saveState() { recordDailyActivity(); localStorage.setItem('zaid_grade8_v1', JSON.stringify(saved)); }
    function fmtText(str) {
      return String(str || '')
        .replace(/`([^`]+)`/g, '<code class="inline-code">$1</code>')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/(^|[\s(\[?'"])\*([^\s*][^*]*?[^\s*]|[^\s*])\*(?=[\s.,;:!?\)?'"]|$)/g, '$1<em>$2</em>');
    }
    function escapeHtml(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    
    let isSpeakingLesson = false;
    function stopSpeech() {
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      isSpeakingLesson = false;
      const btn = document.getElementById('listenLessonBtn');
      if (btn) btn.textContent = '🔊 Listen';
    }
    function speakLessonAloud(courseId, uIdx, lIdx) {
      if (!('speechSynthesis' in window)) return;
      if (isSpeakingLesson) {
        stopSpeech();
        return;
      }
      const c = COURSES.find(x => x.id === courseId) || COURSES[app.courseIdx];
      const l = c.units[uIdx].lessons[lIdx];
      const fullText = `${l.title}. Big idea: ${l.bigIdea}. ${l.paragraphs.join(' ')} Remember this: ${l.keyTakeaway}`.replace(/[`*]/g, '');
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(fullText);
      u.lang = 'en-CA';
      u.rate = 0.96;
      isSpeakingLesson = true;
      const btn = document.getElementById('listenLessonBtn');
      if (btn) btn.textContent = '⏹ Stop Audio';
      u.onend = () => { stopSpeech(); };
      u.onerror = () => { stopSpeech(); };
      window.speechSynthesis.speak(u);
    }

    // Feature #2: Live Detail & Weak-Word Upgrade Meter (E. Catana & O. Macri)
    const WEAK_WORDS = {
      'fun': 'energizing / engaging',
      'good': 'beneficial / effective',
      'nice': 'supportive / impressive',
      'bad': 'harmful / challenging',
      'stuff': 'equipment / materials',
      'things': 'elements / factors',
      'very': '(use a stronger verb/adjective!)',
      'really': '(use a sharper detail!)'
    };

    function analyzeStudentText(text, courseId) {
      const cleaned = (text || '').trim();
      const words = cleaned ? cleaned.split(/\s+/).filter(Boolean) : [];
      const count = words.length;
      const target = (courseId === 'math') ? 10 : (courseId === 'french' ? 12 : 25);
      const foundWeak = [];
      if (['english', 'geo', 'history', 'science', 'pe', 'arts', 'tech'].includes(courseId)) {
        const lower = ' ' + cleaned.toLowerCase().replace(/[^a-z\s]/g, ' ') + ' ';
        Object.keys(WEAK_WORDS).forEach(w => {
          if (lower.includes(' ' + w + ' ')) foundWeak.push(`"${w}" → ${WEAK_WORDS[w]}`);
        });
      }
      return { count, target, met: count >= target, foundWeak };
    }

    function updateLiveMeter(courseId, val) {
      const el = document.getElementById('liveDetailMeter');
      if (!el) return;
      const info = analyzeStudentText(val, courseId);
      const statusHtml = info.met
        ? `<span class="meter-good">✅ Great detail! (${info.count} words)</span>`
        : `<span>✍️ Detail Meter: <strong>${info.count}</strong> / ${info.target}+ words target</span>`;
      const weakHtml = info.foundWeak.length
        ? `<span class="meter-warn">✨ Upgrade tip: ${escapeHtml(info.foundWeak.slice(0, 2).join(' | '))}</span>`
        : `<span style="color:var(--text-muted);">Tip: Show all steps &amp; specifics!</span>`;
      el.innerHTML = statusHtml + weakHtml;
    }

    // Feature #3: Infinite Randomized Math Careless-Error & French Drill Engine
    let drill = { mode: 'math', q: null, userAns: '', feedback: null };

    function genMathDrill() {
      const types = ['pyth_hyp', 'pyth_leg', 'slope_2pt', 'ineq_flip', 'sci_not_neg', 'compound_2yr'];
      const t = types[Math.floor(Math.random() * types.length)];
      if (t === 'pyth_hyp') {
        const triples = [[3,4,5],[6,8,10],[5,12,13],[8,15,17],[9,12,15]];
        const [a, b, c] = triples[Math.floor(Math.random() * triples.length)];
        return {
          topic: 'Pythagorean Theorem (Find Hypotenuse c)',
          prompt: `Right triangle legs are a = ${a} cm and b = ${b} cm. Find hypotenuse c (numbers only):`,
          answer: String(c),
          trapAnswer: String(a*a + b*b),
          trapMsg: `Forgot Square Root Trap! ${a}² + ${b}² = ${a*a + b*b} is c², NOT c! Take √${a*a + b*b} = ${c}!`,
          steps: `c² = ${a}² + ${b}² = ${a*a} + ${b*b} = ${c*c} → c = √${c*c} = ${c} cm.`
        };
      } else if (t === 'pyth_leg') {
        const triples = [[3,4,5],[6,8,10],[5,12,13],[9,12,15]];
        const [a, b, c] = triples[Math.floor(Math.random() * triples.length)];
        return {
          topic: 'Pythagorean Theorem (Find Missing Leg!)',
          prompt: `A right triangle has HYPOTENUSE c = ${c} m and leg b = ${b} m. Find missing leg a:`,
          answer: String(a),
          trapAnswer: String(a*a),
          trapMsg: `Forgot √ Trap! Subtract c² − b² = ${c*c} − ${b*b} = ${a*a}, then take √${a*a} = ${a}!`,
          steps: `Because c = ${c} is longest, SUBTRACT: a² = ${c}² − ${b}² = ${c*c - b*b} → a = √${a*a} = ${a} m.`
        };
      } else if (t === 'slope_2pt') {
        const m = [2, 3, 4, -2, -3][Math.floor(Math.random() * 5)];
        const x1 = Math.floor(Math.random() * 4) + 1;
        const dx = Math.floor(Math.random() * 3) + 2;
        const x2 = x1 + dx;
        const y1 = Math.floor(Math.random() * 6) + 2;
        const y2 = y1 + m * dx;
        return {
          topic: 'Linear Slope m = (y₂ − y₁) ÷ (x₂ − x₁)',
          prompt: `Find the Slope (m) of the line through (${x1}, ${y1}) and (${x2}, ${y2}):`,
          answer: String(m),
          trapAnswer: String(-m),
          trapMsg: `Slope Sign Trap! Subtract in the SAME order: (${y2} − ${y1}) ÷ (${x2} − ${x1}) = ${y2 - y1} ÷ ${dx} = ${m}!`,
          steps: `m = (${y2} − ${y1}) ÷ (${x2} − ${x1}) = ${y2 - y1} ÷ ${dx} = ${m}.`
        };
      } else if (t === 'ineq_flip') {
        const k = -(Math.floor(Math.random() * 4) + 2); // -2..-5
        const xVal = Math.floor(Math.random() * 6) + 2;
        const rhs = k * xVal;
        return {
          topic: 'Negative Coefficient Equation / Inequality Check',
          prompt: `Solve for x:  ${k}x = ${rhs}   (Watch the sign!)`,
          answer: String(xVal),
          trapAnswer: String(-xVal),
          trapMsg: `Integer Division Sign Trap! Negative ÷ Negative = POSITIVE (${rhs} ÷ ${k} = +${xVal})!`,
          steps: `Divide both sides by ${k}: x = (${rhs}) ÷ (${k}) = +${xVal}.`
        };
      } else if (t === 'sci_not_neg') {
        const a = Math.floor(Math.random() * 7) + 2;
        const p = Math.floor(Math.random() * 3) + 2; // 2..4
        const dec = (a / Math.pow(10, p)).toFixed(p);
        return {
          topic: 'Scientific Notation (Negative Exponent = Tiny Decimal!)',
          prompt: `Write ${a} × 10⁻${p} as a standard decimal (e.g., 0.005):`,
          answer: String(dec),
          trapAnswer: String(-a * Math.pow(10, p)),
          trapMsg: `Negative Exponent Trap! 10⁻${p} is NOT negative—move decimal ${p} places LEFT to make tiny decimal ${dec}!`,
          steps: `Move decimal ${p} places left from ${a}.0 → ${dec}.`
        };
      } else {
        const P = [200, 400, 500, 1000][Math.floor(Math.random() * 4)];
        const A = +(P * 1.1 * 1.1).toFixed(2);
        const simpleTrap = +(P + P * 0.1 * 2).toFixed(2);
        return {
          topic: 'Compound Interest (A = P(1 + r)ᵗ)',
          prompt: `Find the total balance ($) of $${P} at 10% COMPOUNDED annually for 2 years:`,
          answer: String(A),
          trapAnswer: String(simpleTrap),
          trapMsg: `Simple vs. Compound Trap! $${simpleTrap} is Simple Interest—Compound multiplies $${P} × 1.10² = $${A}!`,
          steps: `A = ${P} × (1.10)² = ${P} × 1.21 = $${A}.`
        };
      }
    }

    function checkMathDrill() {
      const inp = document.getElementById('mathDrillInput');
      if (!inp || !inp.value.trim()) return;
      const val = inp.value.trim().replace(/[$,\s]/g, '');
      const numVal = parseFloat(val);
      const target = parseFloat(drill.q.answer);
      drill.userAns = val;
      if (!isNaN(numVal) && Math.abs(numVal - target) < 0.02) {
        saved.drillStats.mathCorrect = (saved.drillStats.mathCorrect || 0) + 1;
        saveState();
        drill.feedback = { ok: true, msg: `🎉 Spot on! ${drill.q.steps}` };
      } else if (drill.q.trapAnswer && !isNaN(numVal) && Math.abs(numVal - parseFloat(drill.q.trapAnswer)) < 0.02) {
        drill.feedback = { ok: false, msg: `🛡️ ${drill.q.trapMsg} (${drill.q.steps})` };
      } else {
        drill.feedback = { ok: false, msg: `💡 Not quite (Answer: ${drill.q.answer}). ${drill.q.steps}` };
      }
      openToolsModal('drills');
    }

    function handleBackupFile(ev) {
      const file = ev.target.files && ev.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          if (parsed && parsed.data) {
            saved = Object.assign({ lessonsRead:{}, qcAnswers:{}, inputs:{}, checks:{}, qaDone:{}, weakSpots:{}, feedbackNotes:[], streak:{days:0,lastDate:''}, drillStats:{mathCorrect:0,frenchCorrect:0,sprintsDone:0} }, parsed.data);
            saveState();
            if (parsed.theme === 'dark') document.body.classList.add('dark');
            else document.body.classList.remove('dark');
            alert('✅ Progress backup restored successfully!');
            closeModal();
            render();
          } else {
            alert('Invalid backup file format.');
          }
        } catch (err) {
          alert('Could not read backup file: ' + err.message);
        }
      };
      reader.readAsText(file);
    }

    function getReviewDeck(subjectId) {

        c.units.forEach(u => {

                front: l.bigIdea,
                back: l.keyTakeaway,
                qc: l.quickCheck,
                lessonId: l.id

      });

    function courseProgress(course) {
      let total = 0, done = 0;
      course.units.forEach(u => {
        (u.lessons || []).forEach(l => { total++; if (saved.lessonsRead[l.id]) done++; });
        (u.questions || []).forEach(q => {
          total++;
          if (saved.qaDone[q.id] || q.step4_checks.every((_, i) => !!saved.checks[`${q.id}_chk_${i}`])) done++;
        });
      });
      return { total, done, pct: total ? Math.round((done / total) * 100) : 0 };
    }

    function getNextTask() {
      for (let cIdx = 0; cIdx < COURSES.length; cIdx++) {
        const c = COURSES[cIdx];
        for (let uIdx = 0; uIdx < c.units.length; uIdx++) {
          const u = c.units[uIdx];
          for (let lIdx = 0; lIdx < (u.lessons || []).length; lIdx++) {
            if (!saved.lessonsRead[u.lessons[lIdx].id]) {
              return { type: 'lesson', cIdx, uIdx, lIdx, course: c, item: u.lessons[lIdx] };
            }
          }
          for (let qIdx = 0; qIdx < (u.questions || []).length; qIdx++) {
            const q = u.questions[qIdx];
            if (!saved.qaDone[q.id] && !q.step4_checks.every((_, i) => !!saved.checks[`${q.id}_chk_${i}`])) {
              return { type: 'question', cIdx, uIdx, qIdx, course: c, item: q };
            }
          }
        }
      }
      return { type: 'lesson', cIdx: 0, uIdx: 0, lIdx: 0, course: COURSES[0], item: COURSES[0].units[0].lessons[0] };
    }

    /* ============================================================
       ADAPTIVE TOP BAR (Minimal & Quiet in Focus Mode!)
       ============================================================ */
    function renderTopBar() {
      const bar = document.getElementById('topBar');
      if (app.screen === 'home') {
        bar.innerHTML = `
          <button class="brand-trigger" onclick="goHome()">
            <span class="brand-icon">Z8</span>
            <span>Zaid's Grade 8 Study Space</span>
          </button>
          <button class="btn btn-primary" onclick="openToolsModal('tools')">🧰 Study Tools &amp; Charts</button>
        `;
      } else if (app.screen === 'course') {
        const c = COURSES[app.courseIdx];
        bar.innerHTML = `
          <button class="btn" onclick="goHome()">← All Subjects</button>
          <span class="focus-center-title">${c.icon} ${c.name}</span>
          <button class="btn" onclick="openToolsModal('charts')">📚 Charts &amp; Tools</button>
        `;
      } else {
        const c = COURSES[app.courseIdx];
        bar.innerHTML = `
          <button class="btn" onclick="openCourse(${app.courseIdx})">← Back to ${c.name}</button>
          <span class="focus-center-title">${c.icon} ${app.screen === 'lesson' ? `Lesson ${app.lessonIdx + 1}` : (app.screen === 'bloom' ? `Bloom's Level ${app.bloomLvl}/6` : `Step ${app.qaStep}/5`)}</span>
          <button class="btn btn-soft" onclick="openToolsModal('charts')">🧰 Help</button>
        `;
      }
    }

    /* ============================================================
       SCREEN 1: CLEAN HOME HUB
       ============================================================ */
    function renderHome() {
      const next = getNextTask();
      let done = 0, total = 0;
      COURSES.forEach(c => { const p = courseProgress(c); done += p.done; total += p.total; });

      const makeCard = (c, idx) => {
        const p = courseProgress(c);
        const cls = c.tierClass === 'tier-urgent' ? 'pill-urgent' : (c.tierClass === 'tier-strong' ? 'pill-core' : 'pill-extra');
        const lbl = c.tierClass === 'tier-urgent' ? 'Study First' : (c.tierClass === 'tier-strong' ? 'Core' : 'Full Year / Goal');
        return `
          <button class="subject-card anim-card" onclick="openCourse(${idx})">
            <div class="subject-top">
              <div class="emoji-box">${c.icon}</div>
              <span class="pill-tag ${cls}">${lbl}</span>
            </div>
            <div>
              <h3>${c.name}</h3>
              <p>${c.friendlySub}</p>
            </div>
            <div>
              <div style="display:flex; justify-content:space-between; font-size:0.78rem; color:var(--text-muted); font-weight:600;">
                <span>${c.units.length} ${c.units.length === 1 ? 'Unit' : 'Units'}</span>
                <span>${p.done}/${p.total} done</span>
              </div>
              <div class="prog-track"><div class="prog-fill" style="width:${p.pct}%;"></div></div>
            </div>
          </button>
        `;
      };

      const priority = COURSES.map((c, i) => ({ c, i })).filter(x => x.c.tierClass === 'tier-urgent');
      const core = COURSES.map((c, i) => ({ c, i })).filter(x => ['math', 'english', 'science'].includes(x.c.id));
      const extra = COURSES.map((c, i) => ({ c, i })).filter(x => ['history', 'tech', 'pe', 'arts'].includes(x.c.id));

      const startFn = next.type === 'lesson'
        ? `openLesson(${next.cIdx}, ${next.uIdx}, ${next.lIdx}, 'read')`
        : `openQuestion(${next.cIdx}, ${next.uIdx}, ${next.qIdx}, 1)`;

      return `
        <div class="wrap-home">
          <section class="hero anim-card">
            <div>
              ${(saved.streak && saved.streak.days > 0) ? `<span class="streak-chip">🔥 ${saved.streak.days}-Day Study Streak</span>` : ''}
              <h1>Hi Zaid! Ready for your next card?</h1>
              <p>Next up in <strong>${next.course.icon} ${next.course.name}</strong>: ${next.item.title}</p>
              <button class="hero-btn" onclick="${startFn}">
                ${next.type === 'lesson' ? '📖 Open Lesson Card →' : '✏️ Open Practice Card →'}
              </button>
            </div>
            <div class="hero-ring">
              <div class="hero-ring-num">${done} / ${total}</div>
              <div class="hero-ring-sub">Cards Completed</div>
            </div>
          </section>

          <div class="group-label">
            <span>🔥 Study First</span>
            <span class="sub">Tap a subject card to open its lessons</span>
          </div>
          <div class="grid-2">${priority.map(x => makeCard(x.c, x.i)).join('')}</div>

          <div class="group-label">
            <span>📘 Core Subjects</span>
          </div>
          <div class="grid-3">${core.map(x => makeCard(x.c, x.i)).join('')}</div>

          <div style="margin-top:26px;">
            <button class="btn" onclick="app.showMoreSubjects=!app.showMoreSubjects; render();">
              ${app.showMoreSubjects ? '▾ Hide History, Health & PE & The Arts' : '▸ More Subjects (History 1850–1914, Health & PE, The Arts)'}
            </button>
          </div>
          ${app.showMoreSubjects ? `<div class="grid-3" style="margin-top:14px;">${extra.map(x => makeCard(x.c, x.i)).join('')}</div>` : ''}
        </div>
      `;
    }

       SCREEN 2: COURSE UNIT CARDS (1 UNIT OPEN AT A TIME!)

      const c = COURSES[app.courseIdx];
      return `
        <div class="wrap-focus">
