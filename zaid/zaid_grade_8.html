s. Self`: fear/embarrassment). Dusty hidden case = suppressed passion/shame; unzipping & wiping it = overcoming fear!", "modelSubAnswer": "• **Conflict:** Internal (**Person vs. Self**)—Omar battles his own lingering shame and fear of public embarrassment.\n• **Symbolism:** The dusty hidden trumpet case symbolizes Omar's buried passion and avoidance of failure; unzipping and wiping the tarnished bell symbolizes confronting fear and reclaiming confidence."}, {"label": "Step 3b: Write a universal 1-sentence Theme Statement (NO character names!)", "placeholder": "True confidence grows when...", "hint": "Avoid the name 'Omar' or 'trumpet'—make it apply to ANY person in real life!", "modelSubAnswer": "True growth happens when people stop hiding their past mistakes and use their own setbacks to encourage others."}, {"label": "Step 3c: Write a 4-sentence R.A.C.E.S. paragraph with 1 smoothly embedded quote", "placeholder": "In the passage, the author demonstrates that... For instance, when Omar '...', this shows...", "hint": "Embed `'unzipped the dusty case, wiped the tarnished bell'` or `'I messed this up in front of the whole school too'` inside your own sentence!", "modelSubAnswer": "In the passage, the author shows that embracing past failures transforms shame into leadership. After hiding his instrument for months out of fear, Omar finally breaks his paralysis when he 'unzipped the dusty case, wiped the tarnished bell,' and admitted his own assembly mistake to a struggling younger student. This deliberate physical action—clearing away months of dust—reveals that helping someone else allows him to forgive himself. Ultimately, the story proves that vulnerability turns personal setbacks into strengths that lift an entire community."}], "step4_checks": ["Did I identify **Person vs. Self** AND explain what the case symbolizes?", "Is my Theme Statement a complete universal sentence with ZERO character names?", "Did I weave my quote smoothly inside my sentence and explain HOW it proves the theme?"], "step5_modelAnswer": {"basicAnswer": "Omar is scared of failing. The theme is helping people. He opens his trumpet case.", "expandedAnswer": "Part (a): Internal **Person vs. Self** conflict (shame vs. resilience). The dusty hidden case symbolizes suppressed passion and fear of failure, while wiping it clean symbolizes healing and courage.\nPart (b) Theme: *Acknowledging past mistakes frees people from fear and empowers them to uplift others.*\nPart (c) R.A.C.E.S.: The author reveals that vulnerability turns embarrassment into confidence. Although Omar initially hides his talent, his turning point arrives when he 'unzipped the dusty case, wiped the tarnished bell,' and openly shared his own assembly stumble with a younger musician. By physically dusting off his instrument to mentor a peer, Omar shifts his focus from self-doubt to empathy—proving that resilience grows fastest when we transform mistakes into guidance for others.", "extensionPrompt": "Extension: Notice how Omar's story echoes Grade 7–8 Trombone & Classroom Initiative—what symbol would represent resilience in a sports story?"}}]}, {"id": "g8-eng-u3", "title": "Unit 3 (Strand B): Active vs. Passive Voice, Semicolons, Colons & Morphology", "studyFirstTag": "Make sentences punchy with Active Voice and master `;` vs. `:` punctuation!", "curriculumStrand": "Ontario 2023 Grade 8 Language Strand B: Grammar, Syntax & Vocabulary", "svgDiagram": "g8_eng_hist_svg", "lessons": [{"id": "g8-eng-u3-l1", "title": "Lesson 3.1: Active vs. Passive Voice & Semicolon (`;`) vs. Colon (`:`) Mastery", "readTime": "3 min read", "bigIdea": "**Active Voice** puts the DOER first (`Zaid launched the rocket`) for crisp energy; **Semicolons (`;`)** link two complete related sentences, while **Colons (`:`)** introduce a list or dramatic reveal after a complete sentence!", "paragraphs": ["Compare these two sentences: **Passive:** *'The winning goal was scored by Maya.'* vs. **Active:** *'Maya scored the winning goal.'* In Active Voice, the **Subject DOES the action**—making essays, stories, and reports tighter, clearer, and punchier! (Note: Passive voice IS useful in formal Science labs when the experiment matters more than the person: *'50 mL of water was heated to 80°C.'*)", "Upgrade your punctuation with two high-school-ready marks:\n1. **Semicolon (`;`):** Acts like a soft period joining **TWO complete independent sentences** that share a close idea—ZERO `and/but` after it! Example: *`The rain drenched the field; however, the championship game continued.`* (Never use `;` before a fragment!)\n2. **Colon (`:`):** Announces a list, quote, or big explanation—and the part **BEFORE the colon MUST be a complete sentence!** Example: *`Three essentials powered our hike: water, a compass, and warm wool socks.`*", "Watch the classic Colon Trap: ❌ *'My favourite subjects are: math, science, and music.'* Why is that wrong? Because `'My favourite subjects are'` is NOT a complete sentence! Fix it by adding 'three courses' before the colon OR removing the colon completely!"], "keyTakeaway": "Active = Subject DOES action (`Maya scored`). `;` joins TWO complete sentences. `:` follows a COMPLETE sentence to reveal a list or explanation!", "deepReadTitle": "⚡ Quick Punctuation & Voice Test", "deepReadText": "• Zombie Test for Passive Voice: If you can add `'by zombies'` after the verb (`The cake was eaten [by zombies]`), it's PASSIVE!\n• Semicolon Check: Can BOTH sides stand alone as full sentences? If YES → `;` works!\n• Colon Check: Is everything LEFT of `:` a complete sentence? If YES → `:` works!", "quickCheck": {"question": "Which sentence uses **Active Voice** AND a **Colon (`:`)** with 100% Grade 8 accuracy?", "options": ["The camp checklist was packed by Zaid: a tent, flashlight, and map.", "Zaid packed three essentials for camp: a tent, a flashlight, and a topographic map.", "Zaid packed: a tent, a flashlight, and a map."], "correctIdx": 1, "explanation": "Option B has Active Voice ('Zaid packed') AND a complete sentence before the colon ('Zaid packed three essentials for camp')!"}, "videos": [{"id": "W1_IRU6zx9g", "title": "Active vs. Passive Voice Explained", "channel": "Dr. Jodie Salter", "why": "Fast, memorable test for spotting and fixing passive voice."}, {"id": "41XNKfR56OY", "title": "Introduction to the Semicolon", "channel": "Khan Academy", "why": "Shows exactly how semicolons link two independent clauses cleanly."}, {"id": "0yZ0ehTLxoo", "title": "Linking Function of the Colon", "channel": "Khan Academy", "why": "Master the complete-sentence rule before every colon."}]}], "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Recall Active Voice, Semicolon & Colon Rules", "content": "Lock in all 3 grammar superpowers:", "keyPoints": ["Active = Doer → Verb → Object (try the 'by zombies' test to spot Passive!).", "`;` = Complete Sentence + `;` + Complete Sentence | `:` = Complete Sentence + `:` + List/Reveal."]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Explain When Science Prefers Passive Voice", "content": "English essays favour Active Voice for vivid energy, whereas lab reports sometimes use Passive Voice to spotlight the procedure objectively.", "analogy": "🎥 Camera Focus Analogy: Active Voice aims the spotlight at the person ('Zaid measured 20 mL'); Passive Voice aims the spotlight at the lab action ('20 mL was measured').", "keyPoints": ["Use Active Voice 90%+ of the time in English stories and arguments!"]}, {"level": 3, "name": "APPLY", "subtitle": "Repair Passive Voice & Broken Punctuation", "content": "Edit step-by-step:", "workedExample": {"prompt": "Fix: 'Mistakes were made by the players, the coach stayed calm.'", "steps": ["Flip Passive → Active: 'The players made mistakes'", "Fix the comma splice with a semicolon: *'The players made mistakes; the coach stayed calm.'*"]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Comma vs. Semicolon vs. Colon", "content": "Pick the exact punctuation mark every time:", "comparisonTable": {"headers": ["Mark", "Rule", "Correct Example"], "rows": [["Comma + FANBOYS", "2 sentences + `, and/but/so`", "I studied hard, so I felt confident."], ["Semicolon (`;`)", "2 closely linked sentences (no FANBOYS!)", "I studied hard; my score jumped 15%."], ["Colon (`:`)", "Complete sentence → list/explanation", "I had one goal: finish every sub-step."]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Catch Colon Fragment Traps", "content": "Spot the subtle mistake most Grade 8s miss:", "keyPoints": ["❌ `We visited: Ottawa, Kingston, and Montreal.` → ✅ `We visited three Ontario cities: Ottawa, Kingston, and Montreal.`"]}, {"level": 6, "name": "CREATE", "subtitle": "Write 3 Polished Grade 8 Showcase Sentences", "content": "Demonstrate Active Voice, a Semicolon with `however`, and a Colon introducing a 3-item list.", "keyPoints": ["Check BOTH sides of `;` and the left side of `:`!"]}], "questions": [{"id": "g8-eng-q3", "bloomLevel": 5, "bloomTag": "EVALUATE & APPLY", "title": "Sentence Surgery Lab: Active Voice, Semicolons & Colons", "prompt": "Repair all 3 broken drafts using Grade 8 syntax rules:\n(a) **Flip Passive → Active Voice:** « The championship trophy was lifted by our Grade 8 team after the buzzer was beaten by Leo's three-pointer. »\n(b) **Fix the Comma Splice using a Semicolon (`;`) + Conjunctive Adverb (`however` or `therefore`):** « Ottawa winters drop below −20°C, thousands of skaters still glide down the Rideau Canal. »\n(c) **Fix the Broken Colon (`:`):** « Our science kit included: a microscope, two glass slides, and distilled water. »", "step1_deconstruct": {"instruction": "Identify the true Doers in (a), the two independent clauses in (b), and the incomplete pre-colon fragment in (c)!", "guidingQuestions": ["Who actually lifted the trophy and beat the buzzer?", "Where does `; however,` sit between two complete sentences?", "How do we make the words BEFORE `:` a complete sentence?"], "modelPlan": "(a) Our Grade 8 team lifted the championship trophy after Leo's three-pointer beat the buzzer. (b) Ottawa winters drop below −20°C; however, thousands of skaters still glide down the Rideau Canal. (c) Our science kit included three lab essentials: a microscope, two glass slides, and distilled water."}, "step2_anchor": {"instruction": "Grammar rules:", "referenceItems": ["Active = Doer acts directly!", "Semicolon + `however`: `[Full Sentence]; however, [Full Sentence].`", "Colon rule: Complete sentence MUST precede `:`!"]}, "step3_substeps": [{"label": "Step 3a: Rewrite Sentence (a) in crisp **Active Voice**", "placeholder": "Our Grade 8 team lifted...", "hint": "Make `Our Grade 8 team` and `Leo's three-pointer` the active subjects!", "modelSubAnswer": "« Our Grade 8 team lifted the championship trophy after Leo's three-pointer beat the buzzer. »"}, {"label": "Step 3b: Repair Sentence (b) with `; however,`", "placeholder": "Ottawa winters drop below −20°C; however, ...", "hint": "Notice the semicolon BEFORE `however` and the comma RIGHT AFTER `however`!", "modelSubAnswer": "« Ottawa winters drop below −20°C; however, thousands of skaters still glide down the Rideau Canal. »"}, {"label": "Step 3c: Repair Sentence (c) so a COMPLETE sentence precedes the colon (`:`)", "placeholder": "Our science kit included three items: ...", "hint": "Add a noun phrase like `three lab essentials` right before `:`!", "modelSubAnswer": "« Our science kit included three essential lab supplies: a microscope, two glass slides, and distilled water. »"}], "step4_checks": ["Does Sentence (a) pass the 'no by-zombies' Active Voice check?", "Does Sentence (b) have `;` BEFORE `however` and `,` AFTER `however`?", "Is everything to the LEFT of `:` in Sentence (c) a full stand-alone sentence?"], "step5_modelAnswer": {"basicAnswer": "Our team lifted the trophy. Winters drop; however, skaters glide. Kit included three items: ...", "expandedAnswer": "(a) Active Voice: « Our Grade 8 team lifted the championship trophy after Leo's three-pointer beat the buzzer. »\n(b) Semicolon + Transition: « Ottawa winters drop below −20°C; however, thousands of skaters still glide down the Rideau Canal. »\n(c) Complete-Clause Colon: « Our science kit included three lab essentials: a microscope, two glass slides, and distilled water. »", "extensionPrompt": "Extension: Write 1 original sentence about your trombone or gym class using a semicolon (`;`) cleanly!"}}]}, {"id": "g8-eng-u4", "title": "Unit 4 (Strand A): Critical Media Literacy, Algorithmic Bias & Fact-Checking", "studyFirstTag": "Outsmart clickbait, filter bubbles, deepfakes & biased recommendation feeds!", "curriculumStrand": "Ontario 2023 Grade 8 Language Strand A: Digital Media Literacy", "svgDiagram": "g8_eng_hist_svg", "lessons": [{"id": "g8-eng-u4-l1", "title": "Lesson 4.1: Filter Bubbles, Algorithmic Bias & Lateral Reading Fact-Checks", "readTime": "3 min read", "bigIdea": "Social-media algorithms are engineered to maximize **watch time and outrage**, NOT truth—so Grade 8 digital detectives use **Lateral Reading** (opening new tabs to check the source!) before sharing anything!", "paragraphs": ["Ever notice how clicking ONE dramatic video suddenly floods your entire feed with 20 similar clips? That is a **Filter Bubble (Echo Chamber)** driven by recommendation algorithms. Algorithms reward whatever triggers strong emotions—especially anger, shock, or fear—because outraged users scroll longer and see more ads!", "That also creates **Confirmation Bias**: our brains naturally trust headlines that agree with what we already believe, while ignoring contradictory evidence. Add AI-generated images and voice deepfakes, and looking *only* at how polished a website looks is no longer enough.", "Professional fact-checkers use **Lateral Reading**: instead of scrolling down a suspicious article (vertical reading), **immediately open a new browser tab** and search the website's owner, funding, and whether independent trusted news/science organizations confirm the claim! Remember: **S.I.F.T.** — **S**top, **I**nvestigate the source, **F**ind better coverage, **T**race claims back to original data!"], "keyTakeaway": "Algorithms optimize for clicks/outrage, not accuracy. Beat echo chambers with **Lateral Reading** + **S.I.F.T.** (Stop → Investigate source → Find better coverage → Trace original proof)!", "deepReadTitle": "🕵️ S.I.F.T. Rapid Fact-Check Checklist", "deepReadText": "• S — STOP: Pause before reposting anything that makes you feel instant outrage or shock!\n• I — INVESTIGATE the source: Who owns/funds this account in a NEW tab?\n• F — FIND better coverage: Do 2+ credible independent outlets report it?\n• T — TRACE to original: Find the actual scientific paper, quote, or uncropped video!", "quickCheck": {"question": "A viral short claims 'Scientists ban drinking cold water!' with 2 million views. What is the BEST first **Lateral Reading** move?", "options": ["Check how many likes and comments the video has.", "Open a new tab to check who posted it and whether credible health sources like Health Canada confirm it.", "Read the video description carefully from top to bottom."], "correctIdx": 1, "explanation": "Popularity (likes/views) never proves truth! Lateral reading means leaving the post and checking independent, credible sources in a new tab."}, "videos": [{"id": "gV0_raKR2UQ", "title": "Algorithmic Bias and Fairness (Crash Course AI)", "channel": "CrashCourse", "why": "Shows how algorithms amplify bias and filter bubbles in real feeds."}]}], "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Recall Filter Bubbles, Confirmation Bias & S.I.F.T.", "content": "Lock in Strand A media literacy skills:", "keyPoints": ["Filter Bubble = algorithm feeds you only views you already click.", "S.I.F.T. = Stop • Investigate source • Find better coverage • Trace original data."]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Explain Why Outrage Spreads Faster Than Nuanced Facts", "content": "Engagement algorithms measure clicks, comments, and watch time—and emotional anger triggers more comments than calm science.", "analogy": "🍬 Junk Food Analogy: Algorithms serve sugary outrage snacks because they grab instant attention, even when balanced nutritional facts are healthier for your mind!", "keyPoints": ["Pause whenever a post screams 'THEY DON'T WANT YOU TO KNOW THIS!'"]}, {"level": 3, "name": "APPLY", "subtitle": "Run a 60-Second S.I.F.T. Audit on a Viral Claim", "content": "Practice Lateral Reading:", "workedExample": {"prompt": "Viral Post: 'Ottawa bans all snow days forever starting next week!' (Source: @CrazySchoolNews99)", "steps": ["Stop: Instant shock trigger!", "Investigate: Anonymous meme account—NOT OCDSB!", "Find/Trace: Check official `ocdsb.ca` → Zero announcement → Clickbait hoax!"]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Vertical vs. Lateral Reading", "content": "See how real fact-checkers work:", "comparisonTable": {"headers": ["Habit", "Vertical Reading (Weak)", "Lateral Reading (Pro)"], "rows": [["Action", "Stays on the suspicious page", "Opens new tabs immediately"], ["Focus", "Judges fancy logo/graphics", "Checks ownership, bias & outside proof"], ["Accuracy", "Easily fooled by fake sites", "Spots hoaxes & sponsorships in 30 seconds!"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Spot Hidden Sponsored Content & AI Manipulations", "content": "Check subtle cues:", "keyPoints": ["Look for `#ad` / 'paid partnership', missing author names, weird hands/backgrounds in AI images, and missing publication dates!"]}, {"level": 6, "name": "CREATE", "subtitle": "Create a 4-Rule Digital Media Survival Card for Grade 8s", "content": "Write 4 crisp habits to break out of filter bubbles.", "keyPoints": ["Include S.I.F.T., Lateral Reading, following diverse credible sources, and pausing before sharing!"]}], "questions": [{"id": "g8-eng-q4", "bloomLevel": 5, "bloomTag": "EVALUATE & ANALYZE", "title": "Digital Detective Lab: Algorithms, Confirmation Bias & S.I.F.T. Audit", "prompt": "A trending 30-second video from an account called *@HealthHackPro* (which also sells $45 'Brain Boost Gummies' in its bio) claims: *'SHOCKING! Schools are hiding the fact that 10 minutes of video games replaces 2 hours of sleep!'*\n\n(a) Identify **2 red flags** showing commercial bias or clickbait manipulation.\n(b) Explain how **Recommendation Algorithms** and **Confirmation Bias** could still push this false video to millions of Grade 8 students.\n(c) Walk through all 4 steps of **S.I.F.T.** (Stop, Investigate, Find, Trace) showing how you would verify or debunk this claim!", "step1_deconstruct": {"instruction": "Spot bias/clickbait in (a), explain algorithm + psychology in (b), and apply all 4 S.I.F.T. steps in (c).", "guidingQuestions": ["Why is selling $45 gummies in the bio a massive conflict of interest?", "Why might tired teens *want* to believe this claim (Confirmation Bias)?", "What does each letter of S.I.F.T. stand for?"], "modelPlan": "(a) Profit conflict ($45 gummies) + all-caps emotional clickbait ('SHOCKING! hiding!'). (b) Algorithms amplify angry/surprised shares; Confirmation Bias makes gamers want to believe it. (c) Stop, Investigate @HealthHackPro, Find credible pediatric sleep science, Trace missing study."}, "step2_anchor": {"instruction": "Media Literacy Anchors:", "referenceItems": ["Conflict of Interest = profiting directly from fear/hype", "S.I.F.T. = Stop • Investigate Source • Find Better Coverage • Trace Original Claim"]}, "step3_substeps": [{"label": "Step 3a: Identify 2 concrete red flags in @HealthHackPro's post", "placeholder": "Red Flag 1: ...\nRed Flag 2: ...", "hint": "Spot the $45 gummy shop (commercial conflict of interest) + 'SHOCKING! Schools are hiding...' clickbait language + zero cited scientific source!", "modelSubAnswer": "1. **Commercial Conflict of Interest:** The account profits by selling `$45` 'Brain Boost Gummies' in its bio, motivating sensational health claims.\n2. **Emotional Clickbait & Zero Evidence:** All-caps conspiracy framing ('SHOCKING! Schools are hiding...') with no named university study or doctor."}, {"label": "Step 3b: Explain how **Algorithms** + **Confirmation Bias** make this hoax go viral", "placeholder": "Algorithms spread it because... Confirmation Bias makes students...", "hint": "Algorithms boost videos that trigger comments/replays; Confirmation Bias makes teens *want* to believe gaming replaces sleep!", "modelSubAnswer": "Recommendation algorithms push content with high watch-time, shares, and angry debate in the comments—regardless of truth. Meanwhile, **Confirmation Bias** makes students who love late-night gaming *want* to believe the claim without questioning it, causing them to hit share and trap peers in the same filter bubble!"}, {"label": "Step 3c: Apply all 4 steps of **S.I.F.T.** to verify or debunk the claim", "placeholder": "S (Stop): ...\nI (Investigate): ...\nF (Find): ...\nT (Trace): ...", "hint": "Use Lateral Reading in a new tab—check Health Canada / Canadian Paediatric Society sleep guidelines!", "modelSubAnswer": "• **S (Stop):** Pause at the word 'SHOCKING!'—do not share.\n• **I (Investigate):** Open a new tab to check `@HealthHackPro`—discover it is an uncredentialed supplement marketer, not a sleep researcher.\n• **F (Find Better Coverage):** Search Canadian Paediatric Society / Health Canada—confirm Grade 8s need 9–11 hours of real sleep and screen blue light *hurts* sleep.\n• **T (Trace):** Confirm zero peer-reviewed study exists backing the claim → Debunked!"}], "step4_checks": ["Did I spot BOTH commercial conflict of interest AND clickbait framing?", "Did I explain BOTH Recommendation Algorithms AND Confirmation Bias?", "Did I clearly complete ALL FOUR S.I.F.T. letters using Lateral Reading?"], "step5_modelAnswer": {"basicAnswer": "They sell gummies and use clickbait. Algorithms share it. Use SIFT to check Google.", "expandedAnswer": "Part (a): Red flags include direct financial bias ($45 supplement sales in bio) and outrage clickbait ('SHOCKING! Schools are hiding...') without credible citations.\nPart (b): Engagement algorithms amplify polarizing videos that spark comments and replays, while Confirmation Bias tempts gaming fans to accept an appealing falsehood uncritically.\nPart (c) S.I.F.T.: **Stop** before sharing; **Investigate** `@HealthHackPro` laterally in a new tab (supplement seller, no medical credentials); **Find** trusted sources (Health Canada / Canadian Paediatric Society confirming 9–11 hrs sleep need); **Trace** the claim to confirm no real scientific paper exists.", "extensionPrompt": "Extension: What 1 polite comment could you tell a friend who shares a health hoax in a group chat?"}}]}]}, {"id": "history", "code": "History 8 (Nelson History 8: 1850–1914)", "name": "History (1850–1914)", "friendlySub": "Confederation 1867, Louis Riel, CPR, Indian Act & Suffrage", "teacher": "Grade 8 History", "status": "Full Year Curriculum", "tier": "Tier 3: Term 2 Mastery", "tierClass": "tier-extra", "icon": "🏛️", "reportComment": "Complete Ontario Grade 8 History (Nelson History 8, 1850–1914): Road to Confederation (1867), Red River Resistance & Louis Riel, Indian Act & Residential Schools Truth, Canadian Pacific Railway & Chinese Head Tax, Industrialization, Laurier Era & Women's Suffrage.", "nextSteps": ["Analyze every historical event from MULTIPLE perspectives (English, French, Métis, First Nations, Women, Immigrants)", "Master key milestones: 1867 BNA Act, 1869–70 Red River, 1876 Indian Act, 1885 Last Spike, 1890–1914 Industrialization", "Connect Cause & Consequence clearly in multi-step written history responses"], "units": [{"id": "g8-hist-u1", "title": "Unit 1 (1850–1867): Road to Confederation & The BNA Act (1867)", "studyFirstTag": "Why 4 British colonies united in 1867—and who was left out of the room!", "curriculumStrand": "Ontario Grade 8 History Strand A: Creating Canada (1850–1890)", "svgDiagram": "g8_eng_hist_svg", "lessons": [{"id": "g8-hist-u1-l1", "title": "Lesson 1.1: 5 Reasons for Confederation, Conferences & Federal vs. Provincial Powers", "readTime": "3 min read", "bigIdea": "On **July 1, 1867**, the **British North America (BNA) Act** united **Ontario, Quebec, New Brunswick, and Nova Scotia** into the Dominion of Canada to solve political deadlock, defence fears, and trade loss!", "paragraphs": ["Why did four separate British colonies agree to unite in 1867? Historians group the causes into **5 Big Drivers**: (1) **Political Deadlock** in the Province of Canada (Canada West & Canada East kept voting opposite ways until George Brown, John A. Macdonald, and George-Étienne Cartier formed the *Great Coalition*); (2) **Need for an Intercolonial Railway** linking ice-free Maritime ports year-round; (3) **End of Free Trade (Reciprocity)** with the U.S. in 1866; (4) **Fear of American Expansion (*Manifest Destiny*) & Fenian Raids** after the U.S. Civil War; and (5) **Britain encouraging self-defence** to cut colonial costs.", "Through the **Charlottetown (1864)**, **Quebec (1864)**, and **London (1866)** Conferences, leaders designed **Federalism** in the **1867 BNA Act**: splitting power so the **Federal Government** (in Ottawa!) handled national defence, currency, trade, and railways, while **Provincial Governments** controlled education, healthcare, and civil law (protecting Quebec's French language and Catholic schools!).", "Critical Perspective Check: The 36 'Fathers of Confederation' were all wealthy white European men. **First Nations, Inuit, Métis, Women, and Black Canadians were completely excluded** from the negotiations—creating deep injustices that Canada is still working through today."], "keyTakeaway": "July 1, 1867 (**BNA Act**) united ON, QC, NB, NS under **Federalism** (National powers in Ottawa; Local education/culture in Provinces)—while excluding Indigenous peoples and women!", "deepReadTitle": "🏛️ 1867 Confederation Quick Fact Card", "deepReadText": "• Original 4 Provinces (1867): Ontario, Quebec, New Brunswick, Nova Scotia (PEI & NL said NO in 1867!)\n• Federal Powers (Ottawa): Defence, postal service, currency, trade, railways, criminal law\n• Provincial Powers: Education, hospitals, property/civil rights (vital to George-Étienne Cartier & Quebec!)", "quickCheck": {"question": "Why did **George-Étienne Cartier** (Canada East/Quebec) insist on **Federalism** (giving Provinces control over education and civil law) before agreeing to Confederation?", "options": ["So Quebec could print its own separate currency and run its own army.", "To protect French language, Catholic schools, and Quebec's cultural identity inside a majority-English country.", "To join the United States instead of Britain."], "correctIdx": 1, "explanation": "Federalism guaranteed Quebec provincial control over schools, language, and civil law while sharing national defence and trade!"}, "videos": [{"id": "5h5Pqgkjgws", "title": "The Story Behind Confederation: How Canada United", "channel": "Super Simple Sheets", "why": "Direct Nelson History 8 coverage of the 5 drivers and 1864 conferences."}]}], "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Recall the 5 Causes of Confederation & Original 4 Provinces", "content": "Lock in 1867 foundations:", "keyPoints": ["Original 4 (1867): ON, QC, NB, NS (PM Sir John A. Macdonald).", "5 Causes: Political Deadlock, Railway, End of U.S. Trade, Fear of U.S./Fenians, British support."]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Explain Why Federalism Solved the Compromise", "content": "Giving provinces local powers let Quebec and the Maritimes protect their identities while uniting for defence and trade.", "analogy": "🏠 Apartment Building Analogy: The Federal government manages the roof, plumbing, and security; each Province decorates and runs its own apartment!", "keyPoints": ["Without Provincial control over schools/culture, Quebec would NEVER have signed!"]}, {"level": 3, "name": "APPLY", "subtitle": "Sort Powers into Federal vs. Provincial Jurisdictions", "content": "Practice the BNA Act split:", "workedExample": {"prompt": "Sort: Military, Public Schools, Currency ($), Hospitals.", "steps": ["Federal (Ottawa): Military & Currency ($).", "Provincial: Public Schools (OCDSB!) & Hospitals."]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Perspectives on Confederation (1867)", "content": "Not everyone celebrated July 1, 1867:", "comparisonTable": {"headers": ["Group", "Perspective on 1867 Confederation"], "rows": [["Ontario Business / Macdonald", "Enthusiastic — wanted railways, trade & western expansion"], ["Maritime Critics (Joseph Howe, NS)", "Worried tiny provinces would be outvoted by Ontario/Quebec"], ["First Nations, Métis & Women", "Excluded completely from conferences & voting rights"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Evaluate Who Benefited Most vs. Who Was Excluded in 1867", "content": "Apply Ontario Historical Thinking (Historical Perspective):", "keyPoints": ["Confederation achieved political stability and railways for settlers, while ignoring Indigenous sovereignty and women's democratic rights."]}, {"level": 6, "name": "CREATE", "subtitle": "Write a 3-Perspective Newspaper Front Page from July 1, 1867", "content": "Voice an Ottawa supporter, a skeptical Nova Scotian, and an excluded Indigenous leader.", "keyPoints": ["Cite concrete 1867 issues: railway, representation by population, and exclusion from treaties!"]}], "questions": [{"id": "g8-hist-q1", "bloomLevel": 4, "bloomTag": "ANALYZE & EVALUATE", "title": "Nelson History 8 Lab: Causes of Confederation & Multiple Perspectives (1867)", "prompt": "(a) Explain **3 distinct causes** that pushed British North American colonies to unite in 1867.\n(b) Explain how **Federalism** in the BNA Act convinced Quebec's **George-Étienne Cartier** to join (give 2 Federal powers and 2 Provincial powers).\n(c) Using **Historical Perspective**, explain why **First Nations/Métis peoples** OR **Nova Scotia's Anti-Confederation critics** had serious concerns about the 1867 deal.", "step1_deconstruct": {"instruction": "3 causes in (a), Federalism + 4 powers in (b), and clear multi-perspective critique in (c).", "guidingQuestions": ["Which 3 of the 5 causes can I explain with specifics?", "Which powers went to Ottawa vs. Provinces?", "Who was locked out of the 1864–1866 conferences?"], "modelPlan": "(a) Political Deadlock, U.S. Manifest Destiny/Fenian Raids, End of Reciprocity trade / Intercolonial Railway. (b) Federal = defence & trade; Provincial = education & civil law (protecting French identity). (c) First Nations/Métis were never consulted as sovereign nations; Nova Scotia feared losing trade autonomy."}, "step2_anchor": {"instruction": "1867 Anchors:", "referenceItems": ["Original 4: ON, QC, NB, NS | BNA Act = July 1, 1867", "Federal = Defence, Trade, Currency, Railways | Provincial = Education, Healthcare, Civil Law"]}, "step3_substeps": [{"label": "Step 3a: Explain 3 causes driving Confederation in 1867", "placeholder": "1. Political Deadlock: ...\n2. Defence Threats: ...\n3. Trade & Railway: ...", "hint": "Mention the Great Coalition, Fenian Raids / U.S. Civil War fear, and the end of U.S. Reciprocity + Intercolonial Railway!", "modelSubAnswer": "1. **Political Deadlock:** Canada West and Canada East blocked each other's bills until rivals formed the Great Coalition.\n2. **Security Threats:** After the U.S. Civil War, Fenian Raids and American *Manifest Destiny* made united defence urgent.\n3. **Trade & Railway:** Ending free trade with the U.S. (1866) meant colonies needed an Intercolonial Railway to trade with one another."}, {"label": "Step 3b: Explain Federalism (2 Federal + 2 Provincial powers) & why Cartier agreed", "placeholder": "Federal (Ottawa): ...\nProvincial: ...\nCartier agreed because...", "hint": "Provincial control over education & civil law safeguarded Quebec's French language and culture!", "modelSubAnswer": "• **Federal Powers (Ottawa):** National defence, currency, trade, and interprovincial railways.\n• **Provincial Powers:** Education, hospitals, and property/civil law.\n• **Why Cartier agreed:** Provincial control protected French language, Catholic schools, and Quebec's distinct legal traditions inside Canada."}, {"label": "Step 3c: Explain the concerns of First Nations/Métis OR Maritime critics in 1867", "placeholder": "In 1867, ... had serious concerns because...", "hint": "Mention exclusion from all conferences, BNA Act claiming control over 'Indians and Lands reserved for Indians' without consent!", "modelSubAnswer": "First Nations and Métis nations were completely excluded from the Charlottetown, Quebec, and London Conferences even though the BNA Act unilaterally placed 'Indians and Lands reserved for Indians' under federal control without Indigenous consent—setting the stage for western resistance and coercive assimilation policies."}], "step4_checks": ["Did I explain 3 specific causes (not just list 1-word labels)?", "Did I accurately give 2 Federal + 2 Provincial powers and tie them to Cartier?", "Did I analyze an excluded/critical perspective with historical evidence?"], "step5_modelAnswer": {"basicAnswer": "They united for defence, trade, and deadlock. Ottawa got defence, provinces got schools. Indigenous people were left out.", "expandedAnswer": "Part (a): Three major causes were (1) Political Deadlock in the Province of Canada, (2) fear of U.S. *Manifest Destiny* and Fenian Raids, and (3) losing U.S. Reciprocity free trade, which made an Intercolonial Railway vital.\nPart (b): Federalism gave Ottawa national defence, currency, and trade while granting Provinces education, healthcare, and civil law—assuring Cartier that Quebec's French language and schools would survive.\nPart (c): Indigenous peoples and women were completely shut out of the 1864–1866 conferences; claiming federal jurisdiction over Indigenous lands without consent sparked resistance across the West.", "extensionPrompt": "Extension: Why did Prince Edward Island wait until 1873 (and Newfoundland until 1949!) to join Confederation?"}}]}, {"id": "g8-hist-u2", "title": "Unit 2 (1869–1885): Louis Riel, Red River Resistance, Treaties & The Indian Act", "studyFirstTag": "How Métis leadership created Manitoba—and the truth about the 1876 Indian Act!", "curriculumStrand": "Ontario Grade 8 History Strand A: Western Expansion & Indigenous Rights", "svgDiagram": "g8_eng_hist_svg", "lessons": [{"id": "g8-hist-u2-l1", "title": "Lesson 2.1: Red River Resistance (1869–70), Louis Riel, Numbered Treaties & Indian Act", "readTime": "3 min read", "bigIdea": "When Canada bought Rupert's Land in 1869 WITHOUT asking the Métis living there, **Louis Riel** led the **Red River Resistance**, winning the **Manitoba Act (1870)**—while later federal policies like the **1876 Indian Act** and **Residential Schools** aimed at forced assimilation!", "paragraphs": ["In 1869, Canada purchased vast **Rupert's Land** from the Hudson's Bay Company and sent land surveyors straight onto Métis river-lot farms in Red River—without consulting a single Métis resident! Educated bilingual Métis leader **Louis Riel** stopped the surveyors, formed a lawful **Provisional Government**, and drafted the **Métis List of Rights**. Negotiating directly with Ottawa led to the **Manitoba Act of 1870**, bringing **Manitoba** into Canada with bilingual rights, Catholic/Protestant schools, and 1.4 million acres promised to Métis families (though Ottawa later broke many land promises!).", "Between 1871 and 1921, Canada signed **11 Numbered Treaties** with First Nations across the Prairies and Northern Ontario to open land for settlers and railways. First Nations leaders—facing starvation after settlers overhunted the bison—viewed treaties as sacred **land-sharing partnerships** guaranteeing education, healthcare, and hunting rights, whereas the Crown treated them as permanent land surrenders.", "In **1876**, Parliament passed the **Indian Act**—a discriminatory law controlling who had 'Status,' banning Indigenous ceremonies (like the Potlatch), restricting movement off reserves (Pass System), and later mandating **Residential Schools** designed to forcibly sever Indigenous children from their families, languages, and cultures. Today, Canada's **Truth and Reconciliation Commission (TRC)** 94 Calls to Action guide healing and justice."], "keyTakeaway": "Louis Riel's **Red River Resistance** created **Manitoba (1870)** protecting Métis/French rights. The **1876 Indian Act** & **Residential Schools** enforced assimilation, which Canada confronts today through **TRC Reconciliation**.", "deepReadTitle": "⚖️ Key Turning Points (1869–1885)", "deepReadText": "• 1869–70: Red River Resistance → Louis Riel's List of Rights → **Manitoba Act (1870)**\n• 1871–1921: Numbered Treaties (1–11) — Sacred sharing agreement vs. Crown land surrender\n• 1876: **Indian Act** → Status rules, ceremony bans, Residential Schools (Truth & Reconciliation!)\n• 1885: North-West Resistance (Batoche) → Execution of Louis Riel deepened English-French divide!", "quickCheck": {"question": "Why did **Louis Riel** and the Métis stop Canadian land surveyors at Red River in 1869?", "options": ["They wanted to sell Manitoba to Britain for a higher price.", "Canada bought Rupert's Land and began dividing Métis farms without consulting the people already living there.", "They opposed bilingualism and Catholic schools."], "correctIdx": 1, "explanation": "Canada treated Rupert's Land as empty property without consulting the Métis; Riel's Provisional Government defended Métis land, language, and religious rights, leading to the 1870 Manitoba Act!"}, "videos": [{"id": "YIxJ7I8vRzU", "title": "Louis Riel and the Red River Resistance", "channel": "Super Simple Sheets", "why": "Explains Riel's Provisional Government, List of Rights, and Manitoba Act."}, {"id": "gs5f4EzSBNY", "title": "The Indian Act — Transforming Indigenous Lives", "channel": "Super Simple Sheets", "why": "Age-appropriate, accurate Grade 8 overview of the 1876 Indian Act and TRC."}]}], "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Recall Red River (1869–70), Numbered Treaties & Indian Act (1876)", "content": "Lock in key Strand A milestones:", "keyPoints": ["Louis Riel → Provisional Government → Métis List of Rights → Manitoba Act (1870).", "Indian Act (1876) → Assimilation laws, ceremony bans, Residential Schools → TRC 94 Calls to Action."]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Explain Why Two Sides Read the Numbered Treaties So Differently", "content": "Oral Indigenous traditions understood land as shared stewardship (never 'owned' like furniture), while British legal contracts treated treaties as permanent land sales.", "analogy": "🤝 Misaligned Contract Analogy: Imagine signing a shared gym-court schedule thinking everyone plays together, while the other party locks the doors claiming sole ownership!", "keyPoints": ["Language barriers and starving conditions after the bison collapse made negotiations deeply unequal."]}, {"level": 3, "name": "APPLY", "subtitle": "Connect Métis Grievances to the Manitoba Act (1870)", "content": "Match each demand to its outcome:", "workedExample": {"prompt": "How did Riel's List of Rights shape Manitoba?", "steps": ["Demand: Provincial status (not appointed territory) → Won Manitoba as Canada's 5th province!", "Demand: Bilingual legislature/courts + Catholic schools + Métis land grants → Written directly into the 1870 Manitoba Act!"]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Historical Views of Louis Riel (1885 vs. Today)", "content": "Why Riel remains one of Canada's most debated figures:", "comparisonTable": {"headers": ["Perspective", "How Louis Riel Was Viewed"], "rows": [["1885 Ontario / Macdonald", "Condemned as a 'rebel/traitor' after Thomas Scott & Batoche → executed in 1885"], ["1885 Quebec & Métis", "Defended as a champion of Francophone & Métis rights; execution sparked outrage"], ["Modern Canada & Manitoba", "Honoured as Founder of Manitoba & courageous defender of minority/Indigenous rights"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Evaluate the Long-Term Legacy of the 1876 Indian Act", "content": "Connect 1876 policies to modern reconciliation:", "keyPoints": ["Suppressing languages, governance, and families through Residential Schools caused intergenerational trauma—making TRC education essential for every Grade 8 student."]}, {"level": 6, "name": "CREATE", "subtitle": "Write a 2-Paragraph Historical Significance Reflection on the Manitoba Act", "content": "Explain why Louis Riel is officially recognized as Manitoba's founder today.", "keyPoints": ["Cite his lawful Provisional Government, List of Rights, and protection of bilingual/Indigenous voices."]}], "questions": [{"id": "g8-hist-q2", "bloomLevel": 5, "bloomTag": "ANALYZE & EVALUATE", "title": "Louis Riel, Numbered Treaties & Indian Act Perspective Lab", "prompt": "(a) Explain WHY the Métis resisted Canadian surveyors at Red River in 1869, and name **2 rights** won in the **1870 Manitoba Act**.\n(b) Compare how **First Nations leaders** vs. **the Canadian federal government** understood the **Numbered Treaties**.\n(c) Explain the primary goal of the **1876 Indian Act** and **Residential Schools**, and state 1 concrete way Canadians support Truth and Reconciliation today.", "step1_deconstruct": {"instruction": "Cover Red River causes + Manitoba Act wins in (a), Treaty contrast in (b), and Indian Act truth + TRC action in (c).", "guidingQuestions": ["Why were Métis families alarmed by square British land surveys?", "What did 'sharing land' mean to First Nations vs. 'surrender' to Ottawa?", "What was the assimilation purpose of Residential Schools?"], "modelPlan": "(a) Unconsulted Rupert's Land sale threatened Métis river-lot farms; won provincehood, bilingualism, denominational schools & Métis land promise. (b) First Nations saw sacred sharing partnerships + survival aid; Crown sought permanent land surrender for settlers/CPR. (c) Forced assimilation; TRC 94 Calls to Action (learning truth, Orange Shirt Day, clean water/language revitalization)."}, "step2_anchor": {"instruction": "Key Terms:", "referenceItems": ["Red River Resistance (1869–70) → Louis Riel → Manitoba Act (1870)", "Numbered Treaties (sharing vs. surrender) • 1876 Indian Act (assimilation) • TRC 94 Calls to Action"]}, "step3_substeps": [{"label": "Step 3a: Explain Red River causes + 2 rights secured in the 1870 Manitoba Act", "placeholder": "Cause: Canada bought Rupert's Land without...\n2 Rights Won: 1. ... 2. ...", "hint": "Mention unconsulted surveyors threatening narrow river-lot farms + bilingual rights / schools / Manitoba provincehood!", "modelSubAnswer": "• **Cause:** Canada purchased Rupert's Land and sent surveyors to carve square grids right over Métis river-lot farms without consulting Red River residents.\n• **2 Rights Won:** (1) Manitoba joined as an equal **province** with elected government, and (2) protection for **French & English bilingualism**, Catholic/Protestant schools, and 1.4 million acres promised to Métis families."}, {"label": "Step 3b: Contrast First Nations vs. Federal understandings of the Numbered Treaties", "placeholder": "First Nations viewed treaties as...\nThe Canadian government viewed treaties as...", "hint": "Contrast sacred ongoing **sharing partnerships** (healthcare, farming tools, hunting rights) with one-time **land surrender**!", "modelSubAnswer": "• **First Nations:** Viewed treaties as sacred, nation-to-nation **land-sharing partnerships** guaranteeing hunting/fishing rights, education, medicine, and farming support as the bison vanished.\n• **Federal Government:** Viewed written treaty clauses as a permanent **land surrender** clearing the Prairies for European settlers and the railway."}, {"label": "Step 3c: Explain the goal of the 1876 Indian Act/Residential Schools + 1 TRC action today", "placeholder": "The goal was...\nToday, Canadians support Reconciliation by...", "hint": "Use the exact term **forced assimilation** + mention TRC 94 Calls to Action, Indigenous language revival, or clean water equity!", "modelSubAnswer": "The **1876 Indian Act** and **Residential Schools** aimed at **forced assimilation**—stripping First Nations of self-governance, ceremonies, languages, and family bonds. Today, Canadians support Truth and Reconciliation by learning accurate history, honouring Survivors (e.g., National Day for Truth and Reconciliation), advocating for clean drinking water on reserves, and backing the **TRC's 94 Calls to Action**."}], "step4_checks": ["Did I name 2 real rights from the 1870 Manitoba Act?", "Did I contrast BOTH perspectives on the Numbered Treaties clearly?", "Did I accurately name **forced assimilation** and connect to TRC Reconciliation?"], "step5_modelAnswer": {"basicAnswer": "Canada surveyed Métis land without asking. Manitoba got bilingual rights. Treaties were misunderstood. Indian Act tried assimilation.", "expandedAnswer": "Part (a): Canada bought Rupert's Land and surveyed Métis river-lots without consultation; Riel's Provisional Government negotiated the **1870 Manitoba Act**, winning provincial status, bilingual institutions, religious schools, and Métis land grants.\nPart (b): First Nations viewed Numbered Treaties as sacred sharing partnerships securing survival and rights, whereas Ottawa treated them as permanent land cessions for railway settlement.\nPart (c): The **1876 Indian Act** and **Residential Schools** sought forced assimilation by suppressing Indigenous governance, culture, and languages; today, fulfilling the **TRC 94 Calls to Action** (accurate education, Indigenous language support, and equitable infrastructure) advances reconciliation.", "extensionPrompt": "Extension: Why did the 1885 execution of Louis Riel cause such a massive political rift between Ontario and Quebec?"}}]}, {"id": "g8-hist-u3", "title": "Unit 3 (1871–1885): National Policy, Canadian Pacific Railway & Chinese Head Tax", "studyFirstTag": "Macdonald's 3-part National Policy, building the CPR & honouring Chinese rail workers!", "curriculumStrand": "Ontario Grade 8 History Strand A: Nation-Building & Injustice", "svgDiagram": "g8_eng_hist_svg", "lessons": [{"id": "g8-hist-u3-l1", "title": "Lesson 3.1: The National Policy (1879), The Last Spike (1885) & The Chinese Head Tax", "readTime": "3 min read", "bigIdea": "Sir John A. Macdonald's **National Policy** linked Canada sea-to-sea with the **Canadian Pacific Railway (CPR)**—built through deadly Rocky Mountain passes largely by **15,000+ Chinese labourers** who were later hit with the racist **Chinese Head Tax**!", "paragraphs": ["To convince British Columbia to join Canada (1871) and stop American takeover of the Prairies, Prime Minister Macdonald launched the **1879 National Policy** with **3 interlocking pieces**: (1) **Protective Tariffs** (taxes on U.S. imports so Canadians bought Canadian factory goods), (2) **Western Settlement** (free Dominion Lands homesteads for European farmers), and (3) **Transcontinental Railway (CPR)** shipping Eastern manufactured goods West and Western wheat East!", "Blasting the CPR through granite cliffs in British Columbia was brutally dangerous. Contractors hired over **15,000 Chinese workers**—paying them **half** what white workers earned (`$1/day` vs. `$2/day`), charging them for their own gear, and assigning them the deadliest nitroglycerin rock-blasting jobs (at least 600+ died). On **November 7, 1885**, the **Last Spike** was hammered at Craigellachie, BC—and not a single Chinese worker was invited to stand in the famous photograph!", "Even worse: the moment the railway finished in **1885**, Parliament passed the **Chinese Immigration Act**, imposing a discriminatory **$50 Head Tax** (later hiked to **$500** in 1903—two years' wages!) specifically on Chinese immigrants, followed by the 1923 Exclusion Act. Canada issued a formal national apology and redress in **2006**."], "keyTakeaway": "National Policy = **Protective Tariffs + Western Settlement + CPR (Last Spike 1885)**. Remember BOTH the nation-building railway AND the sacrifice & Head Tax injustice faced by Chinese Canadian workers!", "deepReadTitle": "🚂 Macdonald's 3-Part National Policy Loop", "deepReadText": "1. Protective Tariffs → Protect Ontario/Quebec factories from cheap U.S. imports\n2. Western Settlement → Populate Prairies with farmers growing wheat\n3. CPR (Completed 1885) → Carry Eastern goods West & Western wheat East (and unite BC to Ottawa!)", "quickCheck": {"question": "How did the Canadian government treat Chinese railway workers immediately AFTER the CPR's Last Spike was driven in 1885?", "options": ["Granted them free Prairie homesteads and voting rights.", "Passed the discriminatory Chinese Head Tax ($50, later $500) to discourage Chinese families from settling in Canada.", "Made them equal shareholders in the Canadian Pacific Railway."], "correctIdx": 1, "explanation": "Despite Chinese workers risking their lives on the deadliest BC mountain sections for half pay, Ottawa passed the racist Chinese Head Tax in 1885!"}, "videos": [{"id": "anmNLDXV8Ns", "title": "The Last Spike: Building Canada's Transcontinental Railway", "channel": "Super Simple Sheets", "why": "Covers the National Policy, BC cliffs, and Chinese railway workers accurately."}]}], "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Recall the 3 Pillars of the National Policy & 1885 Milestones", "content": "Lock in Unit 3 facts:", "keyPoints": ["National Policy (1879): 1) Protective Tariffs • 2) Western Settlement • 3) Transcontinental Railway (CPR).", "1885: Last Spike at Craigellachie, BC + Chinese Head Tax ($50 → $500)."]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Explain How the 3 Parts of the National Policy Fed Each Other", "content": "Each pillar depended on the other two like three legs of a stool!", "analogy": "🪑 Three-Legged Stool Analogy: Without tariffs, U.S. factories undercut Ontario; without settlers, the railway had no passengers/wheat; without the railway, settlers couldn't reach the Prairies!", "keyPoints": ["Prairie farmers disliked tariffs because tariffs made farm machinery cost more!"]}, {"level": 3, "name": "APPLY", "subtitle": "Analyze Primary-Source Contrast: The 1885 Last Spike Photo", "content": "Ask who is IN the frame vs. who is MISSING:", "workedExample": {"prompt": "What does the famous 1885 Last Spike photo reveal and hide?", "steps": ["Reveals: Celebratory European executives & politicians claiming national unity.", "Hides: The 15,000+ Chinese labourers who built BC's toughest sections and the Indigenous nations whose lands the track crossed!"]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Impacts of the CPR on Different Groups", "content": "Multi-perspective audit:", "comparisonTable": {"headers": ["Group", "Impact of the CPR (1885)"], "rows": [["BC & Central Canada", "Fulfilled 1871 Confederation promise; fast cross-country trade"], ["First Nations & Métis", "Accelerated settler influx, bison loss & troop transport during 1885 Resistance"], ["Chinese Workers", "Endured dangerous half-pay labour, then hit with Head Tax ($50→$500)"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Evaluate Historical Continuity & Change (1885 → 2006)", "content": "Why did Canada apologize in 2006 for the Chinese Head Tax?", "keyPoints": ["Acknowledging past state-sponsored racism honours Chinese Canadians' vital role in building modern Canada and guards against future discrimination."]}, {"level": 6, "name": "CREATE", "subtitle": "Design a Plaque Honoring Chinese CPR Workers at Craigellachie, BC", "content": "Write 3–4 respectful historical sentences recognizing their sacrifice and confronting the Head Tax.", "keyPoints": ["Include exact facts: 15,000+ workers, half wages, mountain blasting, and 1885–1923 Head Tax/Exclusion!"]}], "questions": [{"id": "g8-hist-q3", "bloomLevel": 4, "bloomTag": "ANALYZE & EVALUATE", "title": "National Policy, CPR & Chinese Canadian Workers Inquiry Lab", "prompt": "(a) Name and explain all **3 pillars** of Sir John A. Macdonald's **1879 National Policy**.\n(b) Explain **1 positive consequence** AND **1 negative consequence** of completing the CPR in 1885 (using two different historical groups!).\n(c) Describe the working conditions faced by **Chinese railway workers** in BC AND explain the injustice of the **1885 Chinese Head Tax**.", "step1_deconstruct": {"instruction": "All 3 pillars in (a), two contrasting perspectives in (b), and exact facts on Chinese workers + Head Tax in (c).", "guidingQuestions": ["What are the 3 legs of the National Policy?", "Who celebrated the CPR vs. who lost land/autonomy?", "How much were Chinese workers paid vs. white workers, and what happened right after 1885?"], "modelPlan": "(a) Tariffs, Western Settlement, CPR. (b) Positive: united BC & boosted trade; Negative: displaced Indigenous nations / sped troops to 1885 Resistance. (c) Half pay + deadliest nitroglycerin blasting → excluded from Last Spike photo & hit with $50→$500 Head Tax."}, "step2_anchor": {"instruction": "Key Facts:", "referenceItems": ["National Policy = Protective Tariffs + Western Settlement + CPR", "15,000+ Chinese workers ($1/day vs. $2/day) → 1885 Head Tax ($50, raised to $500 in 1903)"]}, "step3_substeps": [{"label": "Step 3a: Explain all 3 pillars of Macdonald's National Policy", "placeholder": "1. Protective Tariffs: ...\n2. Western Settlement: ...\n3. CPR: ...", "hint": "Connect tariffs (factories), homesteads (farmers), and the railway (shipping goods coast-to-coast)!", "modelSubAnswer": "1. **Protective Tariffs:** Taxed U.S. imports to protect growing factories in Ontario and Quebec.\n2. **Western Settlement:** Offered cheap Prairie homesteads to populate the West with wheat farmers.\n3. **Canadian Pacific Railway (CPR):** Built a coast-to-coast rail link fulfilling BC's Confederation promise and moving goods/wheat across Canada."}, {"label": "Step 3b: Contrast 1 positive AND 1 negative impact of the 1885 CPR", "placeholder": "Positive (for BC / Business): ...\nNegative (for Indigenous / Métis nations): ...", "hint": "Mention trade/unity with BC vs. rapid displacement of First Nations/Métis lands and bison!", "modelSubAnswer": "• **Positive:** Linked British Columbia to Eastern Canada in days instead of months, spurring national trade and preventing U.S. annexation.\n• **Negative:** Crossed Indigenous and Métis territories, accelerated bison destruction and land loss, and enabled Ottawa to rush troops West in days during the 1885 North-West Resistance."}, {"label": "Step 3c: Describe Chinese CPR workers' conditions AND the 1885 Head Tax injustice", "placeholder": "Conditions: Over 15,000 Chinese workers...\nHead Tax: Once finished in 1885, Ottawa...", "hint": "Half pay (`$1/day`), deadliest mountain blasting, excluded from Last Spike photo, then `$50`→`$500` Head Tax!", "modelSubAnswer": "Over **15,000 Chinese workers** built the deadliest Rocky Mountain cliff sections using dangerous explosives for half pay (`$1/day`), losing hundreds of lives while paying for their own supplies. Right after the 1885 Last Spike—where they were left out of the photo—Ottawa imposed the racist **$50 Chinese Head Tax** (later **$500**), separating families and targeting Chinese immigrants exclusively until a 2006 national apology."}], "step4_checks": ["Did I explain ALL THREE pillars of the National Policy?", "Did I include 2 distinct historical perspectives in Step 3b?", "Did I explain BOTH the mountain working conditions AND the Head Tax ($50→$500)?"], "step5_modelAnswer": {"basicAnswer": "Tariffs, settlers, railway. It united Canada but hurt Indigenous people. Chinese workers were paid less and taxed.", "expandedAnswer": "Part (a): Macdonald's National Policy combined (1) Protective Tariffs for Central Canadian factories, (2) Western Settlement homesteads, and (3) the CPR linking east and west.\nPart (b): Positively, the CPR fulfilled Canada's promise to BC and accelerated national trade; negatively, it accelerated Indigenous land dispossession and enabled fast troop deployment against the 1885 North-West Resistance.\nPart (c): Over 15,000 Chinese workers endured the deadliest BC rock-blasting for half pay, were omitted from the Last Spike ceremony, and were immediately targeted by the discriminatory 1885 Head Tax ($50→$500), formally apologized for in 2006.", "extensionPrompt": "Extension: Why did Prairie farmers complain that Macdonald's protective tariffs favoured Ontario factories at farmers' expense?"}}]}, {"id": "g8-hist-u4", "title": "Unit 4 (1890–1914): Industrialization, Laurier Era, Women's Suffrage & Road to WWI", "studyFirstTag": "Factories, child labour & unions, Nellie McClung's suffrage victory & Canada in 1914!", "curriculumStrand": "Ontario Grade 8 History Strand B: Canada, A Changing Society (1890–1914)", "svgDiagram": "g8_eng_hist_svg", "lessons": [{"id": "g8-hist-u4-l1", "title": "Lesson 4.1: Industrialization, Urban Workers, Laurier's Boom & Women's Suffrage", "readTime": "3 min read", "bigIdea": "Between 1890 and 1914, electric factories, streetcars, and **Laurier-era immigration** transformed Canada into an urban industrial nation—sparking **labour unions** and **Women's Suffrage** movements fighting for fairness!", "paragraphs": ["Between 1890 and 1914, **Industrialization** shifted Canada from small craft workshops to massive steam- and electric-powered factories in Montreal, Toronto, and Hamilton. Thousands of families poured into crowded city tenements (**Urbanization**). Before reform laws, factory workers—including **children as young as 10**—worked 60-hour weeks for pennies in unsafe sweatshops with zero safety guards or sick pay! Workers organized **Labour Unions** and strikes to win 8-hour days, child-labour bans, and workplace safety.", "Under Prime Minister **Sir Wilfrid Laurier** (1896–1911), Immigration Minister **Clifford Sifton** advertised 'The Last Best West' across Eastern Europe, bringing millions of Ukrainian, Polish, and British settlers to Alberta and Saskatchewan (both became provinces in **1905**!). Yet discriminatory policies still blocked non-European immigrants (like the 1908 Continuous Journey rule and the tragic **1914 Komagata Maru** turning away South Asian British subjects!).", "Meanwhile, courageous suffragists—like **Dr. Emily Stowe** (Canada's first female doctor), **Nellie McClung**, and **Adelaide Hoodless**—fought relentlessly for **Women's Suffrage** (the right to vote). McClung's famous 1914 satirical *Mock Parliament* flipped the script on Premier Rodmond Roblin, helping **Manitoba** become the first Canadian province to grant many women the vote in **1916** (though Indigenous and Asian Canadian women still had to fight decades longer!)."], "keyTakeaway": "1890–1914 transformed Canada via **Industrialization** (unions fighting child labour), **Laurier-era immigration** (1905 AB/SK, alongside racist barriers like Komagata Maru), and **Women's Suffrage** (*Nellie McClung*, *Emily Stowe*)!", "deepReadTitle": "⚡ Strand B Social Reformers & Milestones (1890–1914)", "deepReadText": "• Labour Unions → Fought 60-hr weeks, child labour & unsafe factories\n• Sir Wilfrid Laurier & Clifford Sifton → 'Last Best West' boom (Alberta & Saskatchewan 1905!)\n• Women's Suffrage → Emily Stowe & Nellie McClung's Mock Parliament → Manitoba 1916!\n• Foreign Policy Tensions → Boer War (1899), Naval Service Bill (1910), & WWI begins Aug 1914!", "quickCheck": {"question": "How did **Nellie McClung's** famous 1914 *Mock Parliament* advance the Women's Suffrage movement in Canada?", "options": ["It banned all men from working in Manitoba factories.", "It used sharp humour and satire—having women play politicians debating whether men were 'too emotional' to vote—exposing sexist arguments as ridiculous!", "It immediately gave every person in Canada the federal vote in 1914."], "correctIdx": 1, "explanation": "McClung's witty *Mock Parliament* mirrored Premier Roblin's exact excuses back at him, swaying public opinion and helping win the 1916 Manitoba vote!"}, "videos": [{"id": "xLhWV4VBdxw", "title": "Industrial Revolution in Canada", "channel": "Super Simple Sheets", "why": "Explains factories, urbanization, child labour, and labour unions clearly."}, {"id": "4_OyhaNsVfU", "title": "Social and Economic Changes in Canada (1890–1914)", "channel": "The Digital Classroom Experience", "why": "Directly aligned to Ontario Grade 8 History Strand B."}, {"id": "SdbG6EIHrbs", "title": "Heritage Minutes: Nellie McClung", "channel": "Historica Canada", "why": "Unforgettable 60-second dramatization of Nellie McClung's Mock Parliament!"}]}], "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Recall Industrialization, Laurier Era & Suffrage Leaders", "content": "Lock in Strand B highlights:", "keyPoints": ["1890–1914: Factories & Unions | AB & SK join (1905) | Komagata Maru (1914) | Nellie McClung & Emily Stowe (Suffrage)."]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Explain How Factory Urbanization Sparked Social Reform", "content": "Crowded factory towns made unsafe child labour and dirty water impossible to ignore—driving unions, public sanitation, and women's organizations.", "analogy": "⚙️ Domino Effect Analogy: Factories pulled families into cities → harsh working conditions sparked unions & women's reformers → safer laws & voting rights followed!", "keyPoints": ["Social reform wasn't gifted automatically—ordinary workers and women organized to win every right!"]}, {"level": 3, "name": "APPLY", "subtitle": "Compare Laurier's 'Open West' vs. Selective Exclusion", "content": "Spot the contradiction in 1900s immigration policy:", "workedExample": {"prompt": "How was Clifford Sifton's immigration policy simultaneously welcoming AND discriminatory?", "steps": ["Welcoming: Recruited millions of British, American, and Eastern European farmers to the Prairies.", "Discriminatory: Raised the Chinese Head Tax to $500 and used the 1908 'Continuous Journey' rule to block South Asian immigrants (Komagata Maru, 1914)!"]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Life in 1867 vs. 1914 Canada", "content": "Trace Continuity & Change across Grade 8 History:", "comparisonTable": {"headers": ["Area", "Canada in 1867", "Canada in 1914"], "rows": [["Provinces", "4 (ON, QC, NB, NS)", "9 (added MB, BC, PEI, AB, SK!)"], ["Work & Living", "Mostly rural farms & workshops", "Rapidly growing electric factory cities"], ["Voting Rights", "Property-owning men only", "Suffrage nearing breakthrough (1916 MB); still excluded Indigenous/Asian voters"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Evaluate Why English & French Canadians Clashed Over British Imperial Wars", "content": "Connect the Boer War (1899) & Naval Service Bill (1910):", "keyPoints": ["Imperialists (many English Canadians) felt loyal to Britain's empire; French Canadian nationalists (like Henri Bourassa) believed Canada shouldn't fight distant British wars—forcing Laurier into tough compromises."]}, {"level": 6, "name": "CREATE", "subtitle": "Write a Persuasive 1914 Speech Supporting Either Factory Safety OR Women's Suffrage", "content": "Speak from the historical perspective of a Grade 8-aged factory worker or suffragist.", "keyPoints": ["Cite real 1890–1914 facts: 60-hour weeks, child safety, or McClung's Mock Parliament!"]}], "questions": [{"id": "g8-hist-q4", "bloomLevel": 5, "bloomTag": "ANALYZE & EVALUATE", "title": "Nelson History 8 Strand B Lab: Industrialization, Immigration & Suffrage (1890–1914)", "prompt": "(a) Describe **2 harsh working/living conditions** caused by rapid Industrialization (1890–1914) AND explain how **Labour Unions** fought to improve them.\n(b) Explain the contradiction in Laurier-era immigration by comparing Clifford Sifton's Prairie recruitment with the **1914 Komagata Maru** OR **Chinese Head Tax**.\n(c) Explain how **Nellie McClung** helped win Women's Suffrage—AND name **1 group of women** who were STILL excluded from voting in 1916–1918!", "step1_deconstruct": {"instruction": "Factory conditions + union gains in (a), immigration contrast in (b), and McClung + incomplete voting equality in (c)!", "guidingQuestions": ["What did child labourers and factory workers endure?", "Who was welcomed under Sifton vs. who was blocked?", "Did Manitoba's 1916 suffrage win apply to ALL women equally?"], "modelPlan": "(a) 60-hr weeks, child labour, unsafe machines, crowded tenements → Unions struck for shorter hours, safer factories & child-labour laws. (b) Welcomed European farmers (AB/SK 1905) while blocking South Asian/Chinese migrants (Komagata Maru / $500 Head Tax). (c) McClung's Mock Parliament exposed sexism; Indigenous and Asian Canadian women still excluded for decades!"}, "step2_anchor": {"instruction": "Strand B Anchors:", "referenceItems": ["Industrialization → Child labour, 60-hr weeks, tenements → Labour Unions", "Laurier/Sifton ('Last Best West') vs. Komagata Maru (1914) & $500 Head Tax", "Nellie McClung (1914 Mock Parliament → 1916 MB vote) — NOT yet universal!"]}, "step3_substeps": [{"label": "Step 3a: Describe 2 harsh industrial conditions AND how Labour Unions responded", "placeholder": "Conditions: 1. ... 2. ...\nUnions fought back by...", "hint": "Mention child labour / 60-hour weeks / dangerous unguarded machinery + unions organizing strikes for safety & 8-hour days!", "modelSubAnswer": "• **2 Harsh Conditions:** (1) Workers—including children as young as 10—toiled 60+ hours a week around unguarded machinery for tiny wages; (2) Families lived in overcrowded, poorly sanitized urban tenements.\n• **Union Action:** Workers formed Labour Unions and organized strikes to demand child-labour bans, safer factories, fairer wages, and shorter workdays."}, {"label": "Step 3b: Explain the contradiction in Laurier-era immigration (1896–1914)", "placeholder": "On one hand, Sifton actively recruited... On the other hand, Canada excluded...", "hint": "Contrast recruiting millions of European Prairie farmers with raising the Head Tax to `$500` and turning away the *Komagata Maru* (1914)!", "modelSubAnswer": "Clifford Sifton aggressively advertised 'The Last Best West' across Britain and Eastern Europe (helping create Alberta and Saskatchewan in 1905), yet Canada simultaneously enforced discriminatory barriers against non-European migrants—hiking the Chinese Head Tax to `$500` (1903) and using the 'Continuous Journey' law to turn away 376 South Asian passengers aboard the **Komagata Maru** in 1914."}, {"label": "Step 3c: Explain Nellie McClung's impact AND name 1 group still excluded after 1916–1918", "placeholder": "Nellie McClung advanced suffrage by... However, ... women were still excluded!", "hint": "Mention the 1914 *Mock Parliament* satire + Indigenous (First Nations) and Asian Canadian women!", "modelSubAnswer": "Nellie McClung mobilized public support through speeches and her famous 1914 *Mock Parliament*, satirizing anti-suffrage excuses until Manitoba granted women the provincial vote in 1916. However, voting rights were **not yet universal**: **First Nations women** (until 1960 without losing Status) and **Asian Canadian women** (until the late 1940s) remained unfairly excluded!"}], "step4_checks": ["Did I connect harsh factory conditions directly to Labour Union reforms?", "Did I contrast BOTH sides of Laurier-era immigration with real historical examples?", "Did I credit Nellie McClung AND note who was still excluded from the 1916–1918 vote?"], "step5_modelAnswer": {"basicAnswer": "Factories were unsafe so unions struck. Canada wanted European farmers but blocked Asian ships. Nellie McClung got Manitoba women the vote, not Indigenous women.", "expandedAnswer": "Part (a): Rapid industrialization brought 60-hour workweeks, child labour, unsafe unguarded machines, and crowded tenements; Labour Unions organized collective bargaining and strikes to win safety standards and shorter days.\nPart (b): While Laurier and Sifton welcomed millions of European Prairie farmers (creating AB & SK in 1905), racist policies like the $500 Chinese Head Tax and the 1914 rejection of the *Komagata Maru* blocked Asian immigrants.\nPart (c): Nellie McClung's witty 1914 *Mock Parliament* helped secure Manitoba's landmark 1916 suffrage victory—yet Indigenous and Asian Canadian women continued fighting for decades to achieve equal voting rights.", "extensionPrompt": "Extension: How did World War I (beginning August 1914) accelerate BOTH women's suffrage and Canada's independence from Britain?"}}]}]}, {"id": "pe", "code": "Health & PE 8 (Ontario HPE)", "name": "Health & PE", "friendlySub": "Overload/Progression Training, Tactics, Resilience & Digital Safety", "teacher": "Grade 8 HPE", "status": "Personal Goal", "tier": "Tier 3: Personal Goal", "tierClass": "tier-extra", "icon": "🏀", "reportComment": "Complete Ontario Grade 8 Health & Physical Education: Training Principles (Overload, Progression, Specificity & F.I.T.T.), Tactical Game Transfer, Mental Health Resilience & Anti-Stigma, and Healthy Decision-Making / Digital Consent.", "nextSteps": ["Apply Overload, Progression, and Specificity safely to beat fitness plateaus", "Transfer open-space tactics across territory games (basketball, soccer, ultimate)", "Recognize mental health stigma and practice proactive stress-management strategies"], "units": [{"id": "g8-pe-u1", "title": "Unit 1: Training Principles (Overload, Progression, Specificity) & Tactical Transfer", "studyFirstTag": "Train smarter in gym & sports without burnout or injury!", "curriculumStrand": "Ontario Grade 8 HPE Strands B & C: Active Living & Movement Competence", "svgDiagram": "g8_pe_arts_svg", "lessons": [{"id": "g8-pe-u1-l1", "title": "Lesson 1.1: Overload, Progression & Specificity + Territory Game Tactics", "readTime": "3 min read", "bigIdea": "To keep improving in basketball, soccer, or running without getting injured, combine **Specificity** (train the skill you want), **Overload** (push slightly beyond comfort), and **Progression** (increase gradually over weeks)!", "paragraphs": ["In Grade 7, you learned the **F.I.T.T.** formula (Frequency, Intensity, Time, Type). In Grade 8, athletes level up with three scientific **Training Principles**:\n1. **Specificity:** Your body adapts to *exactly* what you practice—practicing 30-second sprint bursts builds basketball court speed better than slow jogging.\n2. **Overload:** Doing the exact same easy workout forever causes a plateau; you must safely challenge muscles/lungs slightly harder than usual.\n3. **Progression:** Never double your mileage overnight! Increase load gradually (~10% per week) with rest days so muscles rebuild stronger instead of tearing!", "On the court or field, Grade 8 PE emphasizes **Tactical Transfer** across **Territory Games** (basketball, soccer, hockey, ultimate frisbee): on offense, **create open space** with give-and-go cuts and triangulated passing lanes; on defense, **stay between your opponent and the net** while keeping vision on BOTH player and ball!", "Smart athletes pair physical conditioning with **Recovery**: dynamic warm-ups before play, static stretching after, hydration, and 9–10 hours of sleep—where your body actually repairs muscle fibres and locks in new motor skills!"], "keyTakeaway": "**Specificity** = train the exact energy system | **Overload** = challenge slightly past normal | **Progression** = build gradually (~10%/wk) + rest days to avoid injury!", "deepReadTitle": "🏀 Territory Game Universal Tactics", "deepReadText": "• Offense: Pass & cut into open space (Give-and-Go!) • Keep wide spacing so 1 defender can't guard 2 teammates!\n• Defense: Stay goal-side (`You between opponent & hoop/net`) • Communicate switches cleanly!", "quickCheck": {"question": "A Grade 8 runner who usually runs `2 km` suddenly tries running `10 km` at full speed in one afternoon and pulls a hamstring. Which training principle did they violate?", "options": ["Specificity", "Progression (jumped load way too fast instead of increasing gradually!)", "Hydration"], "correctIdx": 1, "explanation": "Jumping straight from `2 km` to `10 km` violates **Progression**—safe Overload builds gradually so muscles and tendons adapt without injury!"}, "videos": [{"id": "TocsLwo7l9A", "title": "What Is Overload, Progression & Specificity?", "channel": "National Council on Strength and Fitness", "why": "Crisp, practical breakdown of the 3 Grade 8 training principles."}]}], "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Recall Overload, Progression, Specificity & Territory Tactics", "content": "Lock in Grade 8 fitness science:", "keyPoints": ["Specificity (exact sport) • Overload (push safely past routine) • Progression (gradual ~10% increases + rest)."]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Explain Why Rest Days Make Athletes Stronger", "content": "Workouts create microscopic muscle stress; sleep and rest days are when your body repairs fibres thicker and stronger!", "analogy": "🏗️ Building Analogy: Exercise orders the bricks; sleep and recovery days are when the construction crew builds the stronger wall!", "keyPoints": ["Overtraining with zero rest days causes fatigue, slow reaction times, and injuries."]}, {"level": 3, "name": "APPLY", "subtitle": "Design a 4-Week Progressive Basketball Endurance Plan", "content": "Apply Overload + Progression safely:", "workedExample": {"prompt": "Improve court shuttle sprints from 6 reps to 10 reps safely:", "steps": ["Week 1: 6 sprints (3×/wk) | Week 2: 7 sprints | Week 3: 8–9 sprints | Week 4: 10 sprints + 2 recovery days every week!"]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Offense vs. Defense Tactics Across Territory Sports", "content": "Transfer skills from soccer to basketball:", "comparisonTable": {"headers": ["Phase", "Basketball", "Soccer / Ultimate"], "rows": [["Offense", "Pass & cut (Give-and-Go), wide spacing", "Pass & move into open wing lane"], ["Defense", "Stay between attacker & basket, active hands", "Stay goal-side, force attacker wide"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Audit an Unsafe Crash-Workout Plan", "content": "Spot burnout traps before they happen:", "keyPoints": ["Training 7 days straight with zero warm-up and jumping weights by 50% violates Progression & Recovery!"]}, {"level": 6, "name": "CREATE", "subtitle": "Build a Personal Grade 8 Fitness & Sport Goal Card", "content": "Write 1 SMART fitness goal using Specificity, Overload, Progression, and F.I.T.T.", "keyPoints": ["Include exact weekly progression and 2 recovery days!"]}], "questions": [{"id": "g8-pe-q1", "bloomLevel": 5, "bloomTag": "APPLY & CREATE", "title": "Grade 8 Athlete Training Plan & Territory Tactics Lab", "prompt": "Zaid wants to boost his basketball stamina and defensive footwork for Grade 8 intramurals in 4 weeks.\n(a) Explain how to apply **Specificity**, **Overload**, and **Progression** to build his 4-week plan safely.\n(b) Name **2 universal Territory-Game tactics** (1 offensive, 1 defensive) that work identically in BOTH basketball and soccer.\n(c) Explain why skipping rest days and sleeping only 6 hours actually *hurts* athletic performance.", "step1_deconstruct": {"instruction": "Apply all 3 training principles in (a), 1 offensive + 1 defensive shared tactic in (b), and recovery biology in (c).", "guidingQuestions": ["Which drill specifically mirrors basketball bursts?", "How do we progress gradually over Weeks 1–4?", "What happens during sleep/rest days?"], "modelPlan": "(a) Specificity = shuttle sprints/defensive slides; Overload = slightly faster/extra reps; Progression = +1–2 reps per week + rest days. (b) Offense: Give-and-Go into open space; Defense: stay goal-side. (c) Sleep repairs muscles & builds reaction speed; overtraining causes injury."}, "step2_anchor": {"instruction": "HPE Anchors:", "referenceItems": ["Specificity + Overload + Progression + Recovery", "Territory Games: Create space on offense • Protect goal-side on defense"]}, "step3_substeps": [{"label": "Step 3a: Apply Specificity, Overload & Progression to a 4-week basketball plan", "placeholder": "Specificity: ...\nOverload: ...\nProgression (Weeks 1-4): ...", "hint": "Use basketball court sprints/slides (Specificity), push slightly past comfort (Overload), and build ~10% per week (Progression)!", "modelSubAnswer": "• **Specificity:** Practice court shuttle sprints and defensive lateral slides (matching real game bursts).\n• **Overload:** Push sprint pace slightly faster than usual comfort for 3 sessions/week.\n• **Progression:** Start with 6 shuttles in Week 1, increasing gradually to 7, 8, and 10 by Week 4 with rest days between sessions."}, {"label": "Step 3b: Give 1 Offensive + 1 Defensive tactic shared by Basketball & Soccer", "placeholder": "Offense: ...\nDefense: ...", "hint": "Think Give-and-Go / wide spacing on offense, and staying between attacker and goal/hoop on defense!", "modelSubAnswer": "• **Offense:** Use the **Give-and-Go** (pass and immediately cut into open space) and maintain wide spacing so one defender cannot guard two players.\n• **Defense:** Stay **goal-side** (between your opponent and the hoop/net) while keeping eyes on both the player and the ball."}, {"label": "Step 3c: Explain why skipping rest days and sleep backfires", "placeholder": "Skipping rest and sleep hurts performance because...", "hint": "Connect muscle repair, injury risk, focus, and reaction time!", "modelSubAnswer": "Muscles actually rebuild stronger during **rest days and 9–10 hours of sleep**, not during the workout itself. Sleeping only 6 hours slows reaction time, weakens decision-making on defense, and raises the risk of overuse injuries and burnout."}], "step4_checks": ["Did I clearly distinguish Specificity, Overload, and Progression?", "Did I provide BOTH an offensive and a defensive cross-sport tactic?", "Did I connect sleep/rest to muscle repair and reaction time?"], "step5_modelAnswer": {"basicAnswer": "Do basketball sprints, add more each week. Pass into space, stay between player and net. Sleep helps muscles.", "expandedAnswer": "Part (a): **Specificity** uses court sprints/defensive slides; **Overload** pushes slightly past comfortable effort; **Progression** increases volume gradually (~10%/week from 6 to 10 reps) with rest days.\nPart (b): Offensively, pass-and-cut (Give-and-Go) and wide spacing break down defenses in both sports; defensively, staying goal-side while tracking ball and player prevents easy scores.\nPart (c): Sleep and rest days drive muscle fibre repair, memory consolidation of motor skills, and crisp game-time reaction speed while preventing overuse injury.", "extensionPrompt": "Extension: Track 1 real 15-minute workout this week and note how dynamic warm-ups improve your first sprint!"}}]}, {"id": "g8-pe-u2", "title": "Unit 2 (Health Strand D): Mental Health Resilience, Media Myths & Digital Safety", "studyFirstTag": "Bust mental health stigma, spot fitness/nutrition myths & practice safe digital boundaries!", "curriculumStrand": "Ontario Grade 8 HPE Strand D: Healthy Living", "svgDiagram": "g8_pe_arts_svg", "lessons": [{"id": "g8-pe-u2-l1", "title": "Lesson 2.1: Breaking Mental Health Stigma, Stress Resilience & Digital Consent", "readTime": "3 min read", "bigIdea": "**Mental health is just like physical health**—everyone has it, it fluctuates, and asking a trusted adult or counsellor for help early is a sign of **strength**, never weakness!", "paragraphs": ["Just like a sprained ankle needs ice and support, stress, anxiety, or feeling overwhelmed deserves real care—yet **stigma** (negative stereotypes or silence) stops many teens from speaking up. Building **Mental Resilience** relies on practical daily habits: movement/sports, real sleep, talking honestly with trusted adults (parents, teachers, school
