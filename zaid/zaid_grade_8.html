e Moving to Cities? (Crash Course Geography)", "channel": "CrashCourse", "why": "Explains urbanization, push/pull factors, and megacities visually."}, {"id": "iFPokf8mwPk", "title": "What Is Urban Planning? (Crash Course Geography)", "channel": "CrashCourse", "why": "Connects urban sprawl to sustainable transit and Smart Growth."}]}], "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Recall Push/Pull Factors, Megacities & 6 Urban Land Uses", "content": "Master these core urbanization terms:", "keyPoints": ["Megacity = urban area with 10+ million people.", "Smart Growth = high-density mixed-use buildings + public transit + greenbelts + walkable neighbourhoods."]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Explain Why Urban Sprawl Costs Cities More Money", "content": "Spread-out suburbs need kilometres of extra pavement, snowplows, hydro lines, and water pipes per household.", "analogy": "🍕 Pizza Topping Analogy: Spreading 10 pepperonis across a giant table-sized crust leaves huge empty gaps—whereas a compact pizza keeps everything rich and efficient!", "keyPoints": ["Compact transit-oriented neighbourhoods lower per-person carbon footprint AND municipal taxes."]}, {"level": 3, "name": "APPLY", "subtitle": "Classify Urban Land-Use Conflicts", "content": "Evaluate competing needs in a growing city:", "workedExample": {"prompt": "A developer wants to build a warehouse next to a Grade 8 school and wetland. Identify 2 land-use conflicts.", "steps": ["Conflict 1 (Industrial vs. Institutional): Heavy diesel trucks create noise, air pollution, and safety hazards for walking students.", "Conflict 2 (Industrial vs. Open Space): Paving wetlands removes flood absorption and destroys wildlife habitat."]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Urban Sprawl vs. Smart Growth Cities", "content": "Contrast the two development models:", "comparisonTable": {"headers": ["Feature", "Urban Sprawl", "Smart Growth"], "rows": [["Housing", "Low-density detached houses only", "Mixed-use apartments, townhomes & shops"], ["Transport", "Car-dependent highways", "LRT/bus rapid transit, sidewalks & bike lanes"], ["Farmland", "Paved over permanently", "Protected by Greenbelts & urban boundaries"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Evaluate Trade-Offs of High-Density Intensification", "content": "Consider both pros and challenges of building taller near transit:", "keyPoints": ["Pros: Protects farmland, boosts transit ridership, lowers emissions. Challenges: Requires funding for parks, schools, and affordable family-sized apartments."]}, {"level": 6, "name": "CREATE", "subtitle": "Design a Sustainable Neighbourhood for Ottawa (Nepean 2035)", "content": "Propose 3 concrete Smart Growth features around an O-Train station.", "keyPoints": ["Include mixed-use buildings, protected green space, solar/green roofs, and safe protected bike lanes."]}], "questions": [{"id": "g8-geo-q2", "bloomLevel": 5, "bloomTag": "ANALYZE & EVALUATE", "title": "Urban Sprawl vs. Smart Growth: Ottawa Greenbelt Decision Lab", "prompt": "Ottawa's population is growing quickly. City Council must choose between **Plan A** (opening protected Greenbelt farmland for 5,000 car-dependent detached houses) and **Plan B** (building mixed-use mid-rise apartments, shops, and bike lanes within 500 m of an O-Train LRT station).\n\n(a) Identify 2 **Pull Factors** bringing new residents to Ottawa.\n(b) Explain 2 environmental OR economic drawbacks of **Plan A** (Urban Sprawl).\n(c) Recommend Plan A or Plan B with 3 specific Smart Growth reasons.", "step1_deconstruct": {"instruction": "Break into 3 clear parts: (a) 2 Pull factors, (b) 2 drawbacks of sprawl, (c) clear recommendation + 3 Smart Growth reasons.", "guidingQuestions": ["What draws people INTO Ottawa (Pull)?", "What happens to farmland and car traffic under Plan A?", "How does Plan B connect housing, transit, and emissions?"], "modelPlan": "(a) Tech/government jobs + universities/healthcare. (b) Loss of fertile farmland/wetlands + higher CO2 emissions/infrastructure costs. (c) Recommend Plan B: protects Greenbelt, enables LRT commuting, lowers per-home service costs."}, "step2_anchor": {"instruction": "Key Geography terms to deploy:", "referenceItems": ["Pull Factors (jobs, universities, transit, safety)", "Urban Sprawl → farmland loss, car emissions, costly pipes/roads", "Smart Growth → mixed-use, transit-oriented, Greenbelt protection"]}, "step3_substeps": [{"label": "Step 3a: List & briefly explain 2 Pull Factors attracting people to Ottawa", "placeholder": "1. ...\n2. ...", "hint": "Think government/tech jobs, Carleton/uOttawa, parks/safety!", "modelSubAnswer": "1. **Diverse careers:** Government, tech (Kanata North), and healthcare jobs.\n2. **Services & Education:** Access to universities, hospitals, transit, and community recreation."}, {"label": "Step 3b: Explain 2 drawbacks of Plan A (building on the Greenbelt)", "placeholder": "Drawback 1 (Environmental): ...\nDrawback 2 (Economic/Traffic): ...", "hint": "Cover permanent loss of farmland/wildlife + car congestion and costly snowplowing/pipes!", "modelSubAnswer": "1. **Environmental:** Permanently destroys fertile farmland and wetlands that absorb floodwater and store carbon.\n2. **Traffic & Cost:** Forces thousands of long car commutes (raising CO₂) and forces taxpayers to build and maintain kilometres of new roads, sewers, and power lines."}, {"label": "Step 3c: Recommend Plan B with 3 Smart Growth arguments", "placeholder": "I recommend Plan B because (1)..., (2)..., and (3)...", "hint": "Connect LRT transit, mixed-use walkability, and protecting the Greenbelt!", "modelSubAnswer": "I strongly recommend **Plan B (Smart Growth)** because: (1) residents can walk 500 m to the O-Train LRT, slashing daily greenhouse gases; (2) mixed-use ground-floor shops create vibrant walkable neighbourhoods; and (3) Ottawa's Greenbelt farmland and trails stay permanently protected for future generations."}], "step4_checks": ["Did I name 2 real Pull Factors (not Push Factors)?", "Did I explain 2 concrete drawbacks of sprawl in Step 3b?", "Did I support my recommendation with 3 distinct Smart Growth reasons?"], "step5_modelAnswer": {"basicAnswer": "Plan B is better because trains are good and sprawl hurts farms.", "expandedAnswer": "Part (a) Pull Factors: Ottawa attracts residents through stable public-sector/tech employment and high-quality universities, hospitals, and safe parks.\nPart (b) Plan A Drawbacks: Paving the Greenbelt permanently eliminates productive farmland and flood-buffering wetlands while locking residents into long car commutes and expensive sprawling roads/water infrastructure.\nPart (c) Recommendation: Choose **Plan B (Smart Growth)**—locating mixed-use apartments within 500 m of O-Train LRT cuts carbon emissions, supports local walkable businesses, maximizes existing pipes/transit, and preserves Ottawa's Greenbelt.", "extensionPrompt": "Extension: What 1 community amenity (like a school or park) should Plan B include so families with kids love living in mid-rise apartments?"}}]}, {"id": "g8-geo-u3", "title": "Unit 3 (Strand B): Global Inequalities, HDI & Population Pyramids", "studyFirstTag": "Measure Quality of Life with HDI and read any Population Pyramid in 10 seconds!", "curriculumStrand": "Ontario Grade 8 Geography Strand B: Global Development & Quality of Life", "svgDiagram": "g8_geo_pop_svg", "lessons": [{"id": "g8-geo-u3-l1", "title": "Lesson 3.1: Human Development Index (HDI) & Quality of Life Indicators", "readTime": "3 min read", "bigIdea": "Money alone (`GDP per capita`) does NOT measure Quality of Life! The UN's **Human Development Index (HDI)** scores countries from `0.00` to `1.00` using Health, Education, and Income.", "paragraphs": ["Why can two countries have similar average incomes yet very different daily lives? Because wealth might belong to a tiny elite while schools and clinics stay underfunded. To measure real **Quality of Life**, the United Nations created the **Human Development Index (HDI)**, combining three pillars: **1) Life Expectancy** (Health), **2) Years of Schooling / Literacy Rate** (Education), and **3) Gross National Income (GNI) per Capita** (Standard of Living).", "An HDI score close to **1.00** (like Canada ~0.93 or Norway ~0.96) indicates **Very High Human Development**—clean drinking water, high literacy, low infant mortality, and long lifespans. Scores below **0.55** signal **Low Human Development**, where communities often face barriers such as limited clean water, healthcare shortages, or historical impacts of colonialism and debt.", "Geographers also track **Infant Mortality Rate** (deaths under age 1 per 1,000 births), **Fertility Rate** (average children per woman), and **Access to Safe Water**. Notice how all indicators connect: when girls gain equal access to secondary education, literacy rises, family incomes grow, and infant mortality drops dramatically!"], "keyTakeaway": "HDI (`0.00–1.00`) = **Health** (Life Expectancy) + **Education** (Schooling/Literacy) + **Income** (GNI per Capita). Higher education—especially for girls—lifts every indicator!", "deepReadTitle": "📈 Reading Key Quality-of-Life Indicators", "deepReadText": "• High HDI (>0.80): High life expectancy (80+ yrs), Literacy >95%, Low infant mortality (<6/1000)\n• Low HDI (<0.55): Shorter life expectancy (~55–65 yrs), Higher birth & infant mortality rates, heavy Primary-sector farming\n• Watch Out: Even inside High-HDI Canada, inequality exists (e.g., remote First Nations drinking water access!).", "quickCheck": {"question": "Which 3 pillars make up the UN Human Development Index (HDI)?", "options": ["Land area, climate temperature, and military size.", "Life expectancy (health), education/schooling, and income per capita.", "Population density, number of megacities, and oil exports."], "correctIdx": 1, "explanation": "HDI measures Health (Life Expectancy), Education (Years of Schooling), and Standard of Living (GNI per capita) on a 0 to 1 scale!"}, "videos": [{"id": "Wm6mn0K2d2A", "title": "Human Development Index (HDI) Explained", "channel": "John Puchein", "why": "Breaks down how the 3 HDI pillars measure real quality of life."}]}, {"id": "g8-geo-u3-l2", "title": "Lesson 3.2: Reading Population Pyramids (Expansive, Stationary & Constrictive)", "readTime": "3 min read", "bigIdea": "A **Population Pyramid** is a double bar graph showing a country's age groups and sex—and its **shape** predicts future needs for schools, jobs, and senior healthcare!", "paragraphs": ["Look at any Population Pyramid: ages climb from the bottom (`0–4`) to the top (`85+`), with males typically on the left and females on the right. Simply glancing at the **silhouette** tells you the country's demographic story!", "1. **Expansive (Wide Triangle Base):** High birth rate + rapid population growth (e.g., Nigeria, Kenya). Huge youth population means the country must invest heavily in elementary schools, clean water, and future jobs.\n2. **Stationary (Beehive / Column):** Balanced birth and death rates → slow, stable growth (e.g., United States, France).\n3. **Constrictive (Narrow Base, Bulging Top):** Very low birth rate + long life expectancy → aging/shrinking population (e.g., Japan, Italy, and increasingly Canada!).", "Geographers also look at the **Dependency Load**—the percentage of people too young (`0–14`) or retired (`65+`) who depend on working-age taxpayers (`15–64`). In Canada, as Baby Boomers retire, our senior dependency load is rising—which is a major reason Canada welcomes skilled immigrants to keep hospitals and the economy thriving!"], "keyTakeaway": "Wide Base = **Expansive** (growing fast, needs schools) | Straight Sides = **Stationary** (stable) | Narrow Base = **Constrictive** (aging, needs senior care & immigration).", "deepReadTitle": "🔺 3 Pyramid Shapes at a Glance", "deepReadText": "• Expansive (▲ Triangle): High birth rate → Rapid growth → Priority: Schools & youth jobs\n• Stationary (▮ Beehive): Moderate births/deaths → Slow steady growth\n• Constrictive (▼ Inverted/Narrow Base): Low birth rate + long life → Aging society → Priority: Healthcare, pensions & immigration", "quickCheck": {"question": "A country's population pyramid has a very NARROW base (ages 0–14) and a wide bulge at ages 55–75. What challenge will it face in 15 years?", "options": ["Not enough elementary schools for a booming baby population.", "A shrinking workforce trying to fund healthcare and pensions for a large senior population.", "Too many teenagers entering the job market at once."], "correctIdx": 1, "explanation": "A constrictive (narrow-base) pyramid signals an aging society with a rising senior dependency load and fewer young workers!"}, "videos": [{"id": "RLmKfXwWQtE", "title": "Population Pyramids: Powerful Predictors of the Future", "channel": "TED-Ed", "why": "Iconic Grade 8 visual explanation of how pyramid shapes predict a nation's future."}]}], "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Recall HDI Pillars & 3 Population Pyramid Shapes", "content": "Anchor these Strand B exam essentials:", "keyPoints": ["HDI (0–1) = Health (Life Expectancy) + Education (Schooling) + Income (GNI/capita).", "Pyramids: Expansive (wide base) • Stationary (even column) • Constrictive (narrow base, aging)."]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Explain Dependency Load", "content": "Working-age adults (15–64) generate the taxes that fund schools (0–14) and senior healthcare/pensions (65+).", "analogy": "🛶 Canoe Analogy: If 2 paddlers carry 6 passengers, everyone tires quickly; a balanced dependency load keeps enough paddlers (`15–64`) moving the economy forward!", "keyPoints": ["Both very young countries AND very old countries can have high dependency loads—just for opposite age groups!"]}, {"level": 3, "name": "APPLY", "subtitle": "Diagnose a Country's Future from Its Data Profile", "content": "Connect numbers to real government planning:", "workedExample": {"prompt": "Country X has HDI = 0.91, Fertility = 1.4, Life Expectancy = 83, Narrow Pyramid Base.", "steps": ["Shape = **Constrictive** (low birth rate, long lifespan).", "Challenge = Rising senior healthcare costs + worker shortages.", "Policy = Expand senior care, support childcare, and welcome skilled immigrants."]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Expansive vs. Constrictive Countries", "content": "Spot the full contrast:", "comparisonTable": {"headers": ["Indicator", "Expansive Pyramid", "Constrictive Pyramid"], "rows": [["HDI Level (Typical)", "Low to Medium", "High to Very High"], ["Birth Rate", "High (wide bottom)", "Low (narrow bottom)"], ["Top Policy Priority", "Schools, clean water, youth jobs", "Senior healthcare, pensions, immigration"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Evaluate Why GDP Alone Fails to Show Inequality", "content": "Spot hidden gaps behind averages:", "keyPoints": ["A country with high oil GDP can still have low literacy or poor rural clinics—that's why HDI includes Health & Education!"]}, {"level": 6, "name": "CREATE", "subtitle": "Propose a 2-Point Development Strategy for a Low-HDI Country", "content": "Pick the two highest-impact investments to raise HDI sustainably.", "keyPoints": ["Invest in clean water/sanitation + universal secondary education (especially for girls)!"]}], "questions": [{"id": "g8-geo-q3", "bloomLevel": 4, "bloomTag": "ANALYZE & EVALUATE", "title": "HDI & Population Pyramid Detective Lab (Two-Country Comparison)", "prompt": "Analyze these two real-style profiles:\n• **Country A**: HDI = 0.52 | Life Expectancy = 61 yrs | Literacy = 62% | Pyramid = Very wide base (42% under age 15).\n• **Country B**: HDI = 0.93 | Life Expectancy = 83 yrs | Literacy = 99% | Pyramid = Narrow base (14% under age 15; 24% over age 65).\n\n(a) Name the exact Population Pyramid shape for Country A AND Country B.\n(b) Identify the #1 future social/economic challenge for EACH country based on its pyramid.\n(c) Recommend 2 specific investments that would raise Country A's HDI score over the next 20 years.", "step1_deconstruct": {"instruction": "Match pyramid shapes in (a), link age bulges to future needs in (b), and tie recommendations directly to HDI's 3 pillars in (c).", "guidingQuestions": ["Which shape has a wide base vs. narrow base?", "Does Country A need more nursing homes or more schools/jobs?", "Which HDI pillars (Health/Education/Income) will your 2 investments lift?"], "modelPlan": "(a) A = Expansive; B = Constrictive. (b) A needs schools, clinics & millions of youth jobs; B faces senior healthcare costs & worker shortages. (c) Invest in girls' secondary education + clean water/healthcare."}, "step2_anchor": {"instruction": "Strand B anchors:", "referenceItems": ["Expansive = wide base (youth boom) | Constrictive = narrow base (aging)", "HDI Pillars = Life Expectancy (Health) + Schooling/Literacy (Education) + GNI per capita (Income)"]}, "step3_substeps": [{"label": "Step 3a: Name the exact Population Pyramid shape for Country A & Country B", "placeholder": "Country A = ... because...\nCountry B = ... because...", "hint": "Wide bottom = Expansive; narrow bottom = Constrictive!", "modelSubAnswer": "• **Country A = Expansive Pyramid** (very wide base with 42% under age 15 showing high birth rates).\n• **Country B = Constrictive Pyramid** (narrow base of 14% youth and large 24% senior group showing low birth rates and long lifespan)."}, {"label": "Step 3b: Explain the #1 future challenge for EACH country", "placeholder": "Country A's #1 challenge: ...\nCountry B's #1 challenge: ...", "hint": "Think schools/youth jobs for A vs. senior healthcare/worker shortages for B!", "modelSubAnswer": "• **Country A:** High youth dependency load—it must rapidly build enough schools, clinics, and clean water systems and create millions of jobs as that huge youth wave enters adulthood.\n• **Country B:** High senior dependency load—fewer working-age taxpayers will need to fund senior healthcare and pensions, requiring skilled immigration and automation."}, {"label": "Step 3c: Recommend 2 high-impact investments to raise Country A's HDI", "placeholder": "Investment 1 (Education/Income): ...\nInvestment 2 (Health): ...", "hint": "Tie directly to Literacy, Life Expectancy, and Income!", "modelSubAnswer": "1. **Universal Secondary Education (especially for girls):** Directly lifts the Education pillar, lowers infant mortality, and qualifies youth for higher-paying secondary/tertiary jobs.\n2. **Clean Drinking Water & Local Clinics:** Prevents waterborne diseases, directly raising Life Expectancy (Health pillar) and letting students stay healthy in school."}], "step4_checks": ["Did I correctly label Country A (Expansive) and Country B (Constrictive)?", "Did I explain opposite age-group challenges (youth vs. seniors) in Step 3b?", "Did BOTH recommendations in Step 3c explicitly connect back to HDI pillars?"], "step5_modelAnswer": {"basicAnswer": "A is expansive and needs schools. B is constrictive and has old people.", "expandedAnswer": "Part (a): Country A has an **Expansive** pyramid (42% youth); Country B has a **Constrictive** pyramid (14% youth, 24% seniors).\nPart (b): Country A faces a large youth dependency load requiring rapid expansion of schools, clean water, and future employment. Country B faces an aging dependency load with worker shortages and growing healthcare/pension costs.\nPart (c): Investing in (1) universal secondary schooling (especially for girls) and (2) clean water infrastructure + primary clinics directly raises Country A's Literacy, Life Expectancy, and future GNI per capita—all three HDI pillars.", "extensionPrompt": "Extension: Why does Canada use a points-based immigration system to help balance its own aging population pyramid?"}}]}, {"id": "g8-geo-u4", "title": "Unit 4 (Strand B): 4 Economic Sectors, Fair Trade & UN Sustainable Development Goals", "studyFirstTag": "How products move from raw farm to app store—and how Fair Trade breaks poverty!", "curriculumStrand": "Ontario Grade 8 Geography Strand B: Economic Systems, Trade & Global Action", "svgDiagram": "g8_geo_pop_svg", "lessons": [{"id": "g8-geo-u4-l1", "title": "Lesson 4.1: Primary, Secondary, Tertiary & Quaternary Sectors + Fair Trade", "readTime": "3 min read", "bigIdea": "Countries that only export raw **Primary** goods (like cocoa beans) earn a tiny slice of the profit—while **Secondary** manufacturing, **Tertiary** services, **Quaternary** tech, and **Fair Trade** multiply local value!", "paragraphs": ["Every job on Earth fits into one of **4 Economic Sectors**:\n1. **Primary** extracts raw materials from nature (farming, mining, forestry, fishing).\n2. **Secondary** manufactures raw materials into finished products (factories turning cocoa into chocolate bars or steel into cars).\n3. **Tertiary** provides services to people (teachers, doctors, retail stores, delivery drivers—over 75% of Canada's workforce!).\n4. **Quaternary** creates knowledge, software, and research (AI engineers in Kanata, medical scientists, architects).", "Here is why global inequality persists: a cocoa farmer in West Africa (Primary sector) often earns less than 6% of the price of a $3 chocolate bar sold in Ottawa, while foreign factories (Secondary) and retailers (Tertiary) keep the rest! If raw commodity prices crash, primary-dependent countries struggle to fund schools and hospitals.", "**Fair Trade** certification helps break this cycle by guaranteeing farmers a stable minimum price (covering sustainable farming costs) plus an extra **Fair Trade Premium** invested directly into community schools, wells, and clinics—advancing the **UN Sustainable Development Goals (SDGs)** like Goal 1 (No Poverty), Goal 4 (Quality Education), and Goal 12 (Responsible Consumption)."], "keyTakeaway": "Primary = raw extraction • Secondary = factory making • Tertiary = services • Quaternary = tech/research. **Fair Trade** guarantees living wages + community premiums to close global inequality!", "deepReadTitle": "🍫 Tracing One Chocolate Bar Across All 4 Sectors", "deepReadText": "• Primary: Farmer harvests raw cocoa beans in Ghana\n• Secondary: Factory roasts beans and molds chocolate bars\n• Tertiary: Grocery store cashier & delivery driver sell the bar in Ottawa\n• Quaternary: Food scientist & supply-chain software developer optimize recipes and shipping!", "quickCheck": {"question": "A software engineer in Kanata designs a logistics app for shipping Fair Trade coffee. Which economic sector is that engineer working in?", "options": ["Primary Sector", "Secondary Sector", "Quaternary Sector"], "correctIdx": 2, "explanation": "Software design, AI, and research belong to the **Quaternary** (knowledge & innovation) sector!"}, "videos": [{"id": "lJPjP8R0obk", "title": "Fairtrade and the UN Sustainable Development Goals", "channel": "Fairtrade Canada", "why": "Canadian video connecting Fair Trade directly to UN SDGs and farmer livelihoods."}]}], "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Recall the 4 Economic Sectors & Fair Trade Pillars", "content": "Know all 4 sectors by heart:", "keyPoints": ["Primary (extract) → Secondary (manufacture) → Tertiary (service) → Quaternary (knowledge/research).", "Fair Trade = Guaranteed minimum living price + Fair Trade community premium + eco-friendly farming."]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Explain Why Value-Added Manufacturing Raises National Wealth", "content": "Selling raw timber earns pennies; turning that timber into furniture or engineered lumber multiplies wages and taxes locally.", "analogy": "🍋 Lemonade Analogy: Selling raw lemons earns $1, but squeezing, branding, and serving cold lemonade earns $10—that's the jump from Primary to Secondary/Tertiary!", "keyPoints": ["Low-HDI countries grow faster when they diversify beyond raw Primary exports."]}, {"level": 3, "name": "APPLY", "subtitle": "Classify 4 Real Ottawa Jobs by Economic Sector", "content": "Practice sorting real careers:", "workedExample": {"prompt": "Classify: (1) Dairy farmer, (2) Bakery factory worker, (3) Grade 8 teacher, (4) Vaccine researcher.", "steps": ["(1) Dairy farmer → Primary", "(2) Bakery factory → Secondary", "(3) Teacher → Tertiary", "(4) Vaccine researcher → Quaternary"]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Emergency Aid vs. Long-Term Development Aid vs. Fair Trade", "content": "Know how different forms of global support work:", "comparisonTable": {"headers": ["Approach", "How It Works", "Strength & Limit"], "rows": [["Emergency Aid", "Food/tents/medicine after disasters", "Saves lives immediately; short-term only"], ["Development Aid", "Wells, schools, microloans, training", "Builds long-term self-reliance"], ["Fair Trade", "Fair prices + community premium via trade", "Empowers farmers without charity dependency!"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Evaluate Consumer Choices Using UN SDGs", "content": "Ask how everyday purchases connect to global fairness:", "keyPoints": ["Checking for Fair Trade labels on coffee/cocoa/bananas supports SDG 1 (No Poverty), SDG 8 (Decent Work), and SDG 12 (Responsible Consumption)."]}, {"level": 6, "name": "CREATE", "subtitle": "Propose a School Fair Trade Awareness Campaign", "content": "Design a 3-point plan to introduce Fair Trade hot chocolate or sports balls at your school.", "keyPoints": ["Include data on farmer share, SDG links, and one measurable student action!"]}], "questions": [{"id": "g8-geo-q4", "bloomLevel": 5, "bloomTag": "ANALYZE & EVALUATE", "title": "Economic Sectors, Fair Trade & UN SDG Action Lab", "prompt": "A Grade 8 class is investigating where a $4 Fair Trade chocolate bar comes from.\n(a) Trace the chocolate bar through all **4 Economic Sectors** (give 1 specific job for Primary, Secondary, Tertiary, and Quaternary).\n(b) Explain why a country that relies ONLY on Primary cocoa exports stays vulnerable to poverty.\n(c) Explain 2 ways buying Fair Trade supports specific **UN Sustainable Development Goals (SDGs)**.", "step1_deconstruct": {"instruction": "Cover all 4 sectors in (a), economic vulnerability in (b), and 2 Fair Trade → SDG links in (c).", "guidingQuestions": ["What job extracts cocoa vs. makes the bar vs. sells it vs. researches/codes logistics?", "What happens if world cocoa prices drop 40%?", "How do Fair Trade minimum prices and community premiums help SDGs?"], "modelPlan": "(a) Primary = cocoa farmer; Secondary = factory chocolatier; Tertiary = grocery clerk/trucker; Quaternary = food scientist/app developer. (b) Low raw profit + price crashes hurt schools/clinics. (c) Fair price → SDG 1/8; Community premium → SDG 4 (Education) & SDG 6 (Clean Water)."}, "step2_anchor": {"instruction": "Key terms:", "referenceItems": ["Primary (raw) • Secondary (factory) • Tertiary (service) • Quaternary (research/tech)", "Fair Trade = Minimum Price + Community Premium + Ban on child labour"]}, "step3_substeps": [{"label": "Step 3a: Give 1 specific job in EACH of the 4 Economic Sectors for a chocolate bar", "placeholder": "Primary: ...\nSecondary: ...\nTertiary: ...\nQuaternary: ...", "hint": "Farmer → Factory worker → Store cashier → Food scientist/software engineer!", "modelSubAnswer": "• **Primary:** Cocoa farmer harvesting raw beans.\n• **Secondary:** Factory worker roasting beans and manufacturing chocolate bars.\n• **Tertiary:** Delivery driver or grocery cashier selling the bar.\n• **Quaternary:** Food scientist testing recipes or software engineer tracking ethical supply chains."}, {"label": "Step 3b: Explain why relying ONLY on Primary exports keeps countries vulnerable", "placeholder": "Relying only on Primary exports is risky because...", "hint": "Mention tiny profit margins on raw goods AND sudden drops in global commodity prices!", "modelSubAnswer": "Raw Primary resources sell for only a tiny fraction of the finished product's retail price, so most profit flows to foreign Secondary/Tertiary companies. Worse, if global cocoa prices crash or drought hits, the entire economy loses revenue needed for schools and hospitals."}, {"label": "Step 3c: Explain 2 ways Fair Trade advances specific UN SDGs", "placeholder": "1. Fair Trade minimum price supports SDG ...\n2. Fair Trade community premium supports SDG ...", "hint": "Cite SDG 1 (No Poverty), SDG 4 (Quality Education), SDG 8 (Decent Work), or SDG 12!", "modelSubAnswer": "1. **Guaranteed Minimum Price (SDG 1 No Poverty & SDG 8 Decent Work):** Protects farmers from sudden price crashes so families earn a reliable living wage without child labour.\n2. **Community Premium (SDG 4 Quality Education & SDG 6 Clean Water):** Extra funds voted on by farmers build local classrooms, solar lights, and clean wells."}], "step4_checks": ["Did I list a clear job for ALL FOUR sectors (Primary, Secondary, Tertiary, Quaternary)?", "Did I explain BOTH low profit share AND price-crash risk in Step 3b?", "Did I connect Fair Trade features to named UN SDGs in Step 3c?"], "step5_modelAnswer": {"basicAnswer": "Farmers grow cocoa, factories make it, stores sell it. Fair trade pays farmers more.", "expandedAnswer": "Part (a): Primary = cocoa farmer; Secondary = chocolate factory worker; Tertiary = grocery retailer/trucker; Quaternary = agricultural scientist/supply-chain software engineer.\nPart (b): Countries dependent solely on Primary exports earn minimal profit per tonne while foreign manufacturers capture most value, and any global price drop or crop failure destabilizes public budgets.\nPart (c): Fair Trade advances **SDG 1 (No Poverty)** and **SDG 8 (Decent Work)** through a guaranteed living minimum price, and advances **SDG 4 (Quality Education)** and **SDG 6 (Clean Water)** via farmer-controlled community premiums funding schools and wells.", "extensionPrompt": "Extension: Why is building a local chocolate factory INSIDE Ghana (Secondary sector) even more transformative than only exporting raw Fair Trade beans?"}}]}]}, {"id": "math", "code": "Mathematics 8 (Ontario 2020 / Nelson 8)", "name": "Mathematics", "friendlySub": "Pythagoras, Slope y=mx+b, Equations, Sci Notation & Compound Interest", "teacher": "Grade 8 Math", "status": "Core Mastery", "tier": "Tier 2: Core Mastery", "tierClass": "tier-strong", "icon": "📐", "reportComment": "Complete Ontario 2020 Grade 8 Mathematics (Nelson My Math Path ON 8 + Khan Academy 8): Real Numbers, Scientific Notation, Proportional Reasoning, Multi-Step Algebra & Slope (y=mx+b), Coding, Pythagorean Theorem, 3D Cylinders/Prisms, Scatter/Box Plots, and Compound Interest.", "nextSteps": ["Keep using the Step 4 Careless Error Shield: signs in integer multiplication/division, flipping inequality signs on ×/÷ negative, and taking √ at the end of Pythagoras!", "Verify every algebra solution with a formal Left Side = Right Side (LS = RS) check", "Write exact formulas first before plugging in numbers (c² = a² + b², y = mx + b, V = πr²h)", "Master Compound Interest vs. Simple Interest to crush Grade 8 & Grade 9 Financial Literacy"], "units": [{"id": "g8-math-u1", "title": "Unit 1 (Strand B): Scientific Notation, Rational/Irrational Numbers & Roots", "studyFirstTag": "Write huge & microscopic numbers cleanly + estimate non-perfect square roots!", "curriculumStrand": "Ontario 2020 Grade 8 Math Strand B: Number Sense", "svgDiagram": "g8_math_pyth_slope_svg", "lessons": [{"id": "g8-math-u1-l1", "title": "Lesson 1.1: Scientific Notation (Giant & Microscopic Numbers!)", "readTime": "3 min read", "bigIdea": "Scientific Notation writes any number as `a × 10ⁿ` where `1 ≤ a < 10`: positive exponents (`10⁺⁶`) mean BIG numbers, and negative exponents (`10⁻⁴`) mean TINY decimals—NOT negative numbers!", "paragraphs": ["In Grade 7, you saw positive powers of 10 for giant space distances (like `3.84 × 10⁵ km` to the Moon). In Grade 8 Science (Cells!) and Math, you also need **negative exponents** for microscopic sizes—like a red blood cell measuring `0.0000075 m = 7.5 × 10⁻⁶ m`!", "Never fall into the #1 Grade 8 trap: **`7.5 × 10⁻⁶` is NOT a negative number!** A negative exponent simply means *divide by 10 six times* (move the decimal 6 places LEFT to make a tiny positive decimal `0.0000075`). A positive exponent means *multiply by 10* (move decimal RIGHT to make a big number).", "Always check the front coefficient `a`! Is `34 × 10⁴` valid scientific notation? **NO!** Because `34` is NOT between `1` and `10`. Shift the decimal 1 place left to `3.4`, and bump the exponent up by 1 → `3.4 × 10⁵`!"], "keyTakeaway": "Front number MUST satisfy `1 ≤ a < 10`. Positive exponent = BIG number (≥10); Negative exponent = TINY positive decimal (between 0 and 1)!", "deepReadTitle": "🔬 Quick Scientific Notation Conversion Table", "deepReadText": "• 4,500,000 = `4.5 × 10⁶` (decimal moved 6 places left)\n• 0.00032 = `3.2 × 10⁻⁴` (decimal moved 4 places right)\n• Watch Out: `0.45 × 10⁵` is invalid → fix to `4.5 × 10⁴`!", "quickCheck": {"question": "A plant cell is `0.000048 m` wide. How is this written in proper Scientific Notation?", "options": ["48 × 10⁻⁶ m", "4.8 × 10⁻⁵ m", "-4.8 × 10⁵ m"], "correctIdx": 1, "explanation": "Move the decimal 5 places right so the front number is `4.8` (between 1 and 10). Because the original number is tiny (<1), the exponent is `−5`: `4.8 × 10⁻⁵ m`!"}, "videos": [{"id": "bXkewQ7WEdI", "title": "Math Antics — Scientific Notation", "channel": "mathantics", "why": "Crystal-clear visual breakdown of both positive and negative exponents."}]}, {"id": "g8-math-u1-l2", "title": "Lesson 1.2: Rational vs. Irrational Numbers & Estimating Square Roots", "readTime": "3 min read", "bigIdea": "**Rational numbers** can be written as a fraction `a/b` (terminating or repeating decimals); **Irrational numbers** (`π`, `√2`, `√50`) go on forever with zero repeating pattern!", "paragraphs": ["Every whole number (`7 = 7/1`), integer (`−4 = −4/1`), terminating decimal (`0.75 = 3/4`), and repeating decimal (`0.333... = 1/3`) is **Rational**—think *Ratio* = fraction! Even `√49 = 7` is rational because 49 is a perfect square.", "But what about `√50` or `π = 3.14159265...`? They are **Irrational**—their decimal digits never end and never repeat! In Grade 8, you estimate non-perfect square roots to one decimal place **without a calculator** using the **Perfect Square Sandwich**.", "Let's estimate `√53`: Sandwich `53` between its two nearest perfect squares: `√49 = 7` and `√64 = 8`. Notice `53` is only `4` away from `49` out of a total gap of `64 − 49 = 15`. Since `4/15 ≈ 0.27`, we estimate `√53 ≈ 7.3`! Check: `7.3² = 53.29` — spot on!"], "keyTakeaway": "Rational = can be written as `a/b` (stops or repeats). Irrational = non-perfect roots & `π` (never stops or repeats). Estimate `√n` by sandwiching between two perfect squares!", "deepReadTitle": "🧱 Perfect Squares 1²–15² Speed Wall", "deepReadText": "1, 4, 9, 16, 25, 36, 49, 64, 81, 100, 121, 144, 169 (13²), 196 (14²), 225 (15²)\n• Sign Rules Reminder (× / ÷): Same signs (`− × −`) = POSITIVE | Different signs (`+ × −`) = NEGATIVE!", "quickCheck": {"question": "Which number is IRRATIONAL, and what is the best 1-decimal estimate for `√79`?", "options": ["`√64` is irrational; `√79 ≈ 8.2`", "`√79` is irrational; `√79 ≈ 8.9` (very close to √81 = 9!)", "`0.666...` is irrational; `√79 ≈ 39.5`"], "correctIdx": 1, "explanation": "`79` is not a perfect square so `√79` is irrational; it sits right below `√81 = 9` (between 64 and 81), so `√79 ≈ 8.9`!"}, "videos": [{"id": "wswkQxG-Kk8", "title": "Rational Numbers Explained", "channel": "Math with Mr. J", "why": "Clearly defines fractions, terminating, and repeating decimals."}, {"id": "GupzujexBFA", "title": "Irrational Numbers Explained", "channel": "Math with Mr. J", "why": "Shows why π and non-perfect square roots are irrational."}]}, {"id": "g8-math-u1-l3", "title": "Lesson 1.3: Positive & Negative Fraction BEDMAS & Square Roots of Fractions", "readTime": "3 min read", "bigIdea": "All **Rational Numbers** (positive & negative fractions and decimals) follow the exact same integer sign rules (`− × − = +`)—and **`√(a/b) = √a ÷ √b`** (`√(9/25) = 3/5`)!", "paragraphs": ["Ontario 2020 Grade 8 Number Sense (`B2.2–B2.5`) levels up fractions by adding **NEGATIVE signs**! Always combine your Grade 7 fraction rules with integer sign rules:\n• **Add/Subtract:** Find a **Common Denominator**, then add/subtract the numerators watching signs (`−2/3 + 1/4 = −8/12 + 3/12 = −5/12`).\n• **Multiply:** Multiply straight across (`top × top / bottom × bottom`) + sign rule (`(−3/4) × (−2/5) = +6/20 = +3/10`).\n• **Divide:** **Keep – Change – Flip** (`(−2/3) ÷ (4/5) = (−2/3) × (5/4) = −10/12 = −5/6`)!", "For **Mixed Numbers** like `−1 ½ × 2 ⅓`, NEVER multiply the whole parts separately! Convert BOTH to **improper fractions** first (`−3/2 × 7/3 = −21/6 = −7/2 = −3 ½`)!", "Finally, take **Square Roots of Fractions** in 2 seconds by taking the root of the top AND bottom separately: **`√(16/49) = √16 / √49 = 4/7`**! (Check: `(4/7)² = 16/49` ✅! Notice `√(0.25) = √(25/100) = 5/10 = 0.5`—bigger than `0.25`!)"], "keyTakeaway": "Negative fractions follow integer sign rules (`Same = +, Different = −`). Always turn mixed numbers improper before ×/÷, and split roots **`√(a/b) = √a / √b`**!", "deepReadTitle": "➗ Rational Number Error-Shield", "deepReadText": "• Keep-Change-Flip: `(−a/b) ÷ (c/d) = (−a/b) × (d/c)` — always simplify final fractions!\n• Cool Decimal Root Check: `√(0.09) = 0.3` (NOT `0.03`, since `0.3 × 0.3 = 0.09`!)", "quickCheck": {"question": "Evaluate `(−3/4) ÷ (9/8)` in lowest terms AND evaluate `√(36/49)`:", "options": ["−27/32 and 18/49", "−2/3 and 6/7", "+2/3 and 6/7"], "correctIdx": 1, "explanation": "Keep-Change-Flip: `(−3/4) × (8/9) = −24/36 = −2/3`! And `√(36/49) = √36 / √49 = 6/7`!"}, "videos": [{"id": "xkO3kVOJ7nQ", "title": "How to Add & Work with Negative Fractions", "channel": "Math with Mr. J", "why": "Crystal-clear step-by-step practice with signed rational numbers."}]}], "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Recall Scientific Notation, Rational/Irrational & Integer Rules", "content": "Lock in Unit 1 number rules:", "keyPoints": ["Scientific Notation: `a × 10ⁿ` with `1 ≤ a < 10` (`10⁻ⁿ` = tiny positive decimal).", "Rational = fraction/terminating/repeating; Irrational = π and non-perfect square roots."]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Explain Why `3.5 × 10⁻⁴` Is Positive, Not Negative", "content": "A negative exponent means reciprocal/division (`1 / 10⁴ = 0.0001`), never a negative sign in front.", "analogy": "🔬 Microscope Zoom Analogy: `10⁺⁴` zooms OUT to telescope scale (10,000× bigger), while `10⁻⁴` zooms IN to microscope scale (10,000× smaller)!", "keyPoints": ["Only a minus sign in front of `a` (`−3.5 × 10⁴`) makes a number negative."]}, {"level": 3, "name": "APPLY", "subtitle": "Estimate `√115` Without a Calculator", "content": "Use the 3-step Perfect Square Sandwich:", "workedExample": {"prompt": "Estimate `√115` to 1 decimal place:", "steps": ["Step 1 (Sandwich): `√100 = 10` and `√121 = 11`.", "Step 2 (Distance fraction): `115 − 100 = 15` out of gap `121 − 100 = 21` → `15/21 ≈ 0.71`.", "Step 3 (Estimate & Check): `√115 ≈ 10.7` (`10.7² = 114.49` — awesome!)."]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Classify Numbers Across the Real Number System", "content": "See how every number fits:", "comparisonTable": {"headers": ["Number", "Rational or Irrational?", "Why?"], "rows": [["−8", "Rational (Integer)", "Can write as −8/1"], ["0.454545...", "Rational", "Repeating decimal = 5/11"], ["√81", "Rational (= 9)", "Perfect square!"], ["√30", "Irrational (≈ 5.5)", "Non-perfect root; endless non-repeating decimal"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Catch Classic Unit 1 Careless Traps", "content": "Spot both errors:", "keyPoints": ["❌ Writing `√50 = 25` (dividing by 2 trap!) → ✅ `√50 ≈ 7.1`.", "❌ Writing `42 × 10⁻³` → ✅ Front number must be <10: `4.2 × 10⁻²`!"]}, {"level": 6, "name": "CREATE", "subtitle": "Compare Real-World Sizes Using Scientific Notation", "content": "Calculate how many times wider a `1.5 × 10⁻³ m` grain of sand is than a `7.5 × 10⁻⁶ m` red blood cell.", "keyPoints": ["Divide coefficients (`1.5 ÷ 7.5 = 0.2`) and subtract exponents (`−3 − (−6) = +3`) → `0.2 × 10³ = 200` times wider!"]}], "questions": [{"id": "g8-math-q1", "bloomLevel": 4, "bloomTag": "APPLY & ANALYZE", "title": "Real Numbers, Microscopic Scientific Notation & Root Sandwich Lab", "prompt": "Solve all 3 parts showing every step (no calculator for estimating!):\n(a) Convert BOTH measurements into proper Scientific Notation: Earth-to-Sun distance = `149,600,000 km`, and Virus diameter = `0.00000012 m`.\n(b) Classify each number as **Rational** or **Irrational** (explain why): `−0.75`, `√121`, `√60`, `0.272727...`.\n(c) Estimate `√60` to one decimal place using the Perfect Square Sandwich, then evaluate `(−3)³ − (−4) × (−5)`!", "step1_deconstruct": {"instruction": "Check all 3 sub-tasks and watch for the negative-exponent and negative-cube sign traps!", "guidingQuestions": ["Is `149,600,000` positive or negative exponent? What about `0.00000012`?", "What is `(−3)³` (odd exponent = negative!)?", "Which two perfect squares surround `60`?"], "modelPlan": "(a) 1.496×10⁸ km and 1.2×10⁻⁷ m. (b) −0.75 (R), √121=11 (R), √60 (I), 0.2727... (R). (c) √60 between √49=7 & √64=8 (≈7.7); (−3)³−(−4)(−5) = −27 − (+20) = −47."}, "step2_anchor": {"instruction": "Error-Shield Rules:", "referenceItems": ["`1 ≤ a < 10` for Scientific Notation", "`(−3)³ = (−3)×(−3)×(−3) = −27` (Odd exponent keeps minus!)", "`(−4) × (−5) = +20` (Same signs = POSITIVE)"]}, "step3_substeps": [{"label": "Step 3a: Convert BOTH distances into proper Scientific Notation", "placeholder": "149,600,000 km = ...\n0.00000012 m = ...", "hint": "Count exact decimal jumps! 149,600,000 → 8 jumps left; 0.00000012 → 7 jumps right!", "modelSubAnswer": "• `149,600,000 km = 1.496 × 10⁸ km`\n• `0.00000012 m = 1.2 × 10⁻⁷ m`"}, {"label": "Step 3b: Classify `−0.75`, `√121`, `√60`, and `0.272727...` as Rational or Irrational", "placeholder": "-0.75 = ... | √121 = ... | √60 = ... | 0.2727... = ...", "hint": "Only ONE of these 4 numbers is irrational!", "modelSubAnswer": "• `−0.75` = Rational (`−3/4`, terminates)\n• `√121 = 11` = Rational (perfect square!)\n• `√60` = **Irrational** (non-perfect square root)\n• `0.272727...` = Rational (repeating decimal = `3/11`)"}, {"label": "Step 3c: Estimate `√60` (1 decimal) AND evaluate `(−3)³ − (−4) × (−5)`", "placeholder": "√60 is between √49 (7) and √64 (8) → ≈ ...\n(−3)³ − (−4)×(−5) = ...", "hint": "60 is 11 above 49 out of 15 → `7.7`! For BEDMAS: `−27 − 20 = −47`!", "modelSubAnswer": "• `√60`: Between `√49 = 7` and `√64 = 8`; `11/15 ≈ 0.73` → **`√60 ≈ 7.7`** (`7.7² = 59.29`).\n• BEDMAS: `(−3)³ − (−4)×(−5) = −27 − (+20) = −47`."}], "step4_checks": ["Are BOTH scientific notation coefficients between 1 and 10 (`1.496` and `1.2`)?", "Did I recognize `√121 = 11` as Rational and `√60` as Irrational?", "Did I evaluate `(−3)³ = −27` and `(−4)×(−5) = +20` so `−27 − 20 = −47`?"], "step5_modelAnswer": {"basicAnswer": "1.496×10⁸, 1.2×10⁻⁷. √60 is irrational ≈ 7.7. Answer -47.", "expandedAnswer": "Part (a): `149,600,000 km = 1.496 × 10⁸ km` | `0.00000012 m = 1.2 × 10⁻⁷ m`.\nPart (b): `−0.75` (Rational, `−3/4`), `√121 = 11` (Rational), `0.2727...` (Rational, repeating), `√60` (**Irrational**, non-terminating non-repeating).\nPart (c): `√60` sits `11/15` of the way from `√49=7` to `√64=8`, giving **`≈ 7.7`**. For BEDMAS: `(−3)³ − (−4)(−5) = −27 − 20 = −47`.", "extensionPrompt": "Extension: What is the exact value of `2⁻³` written as a fraction? (Hint: `1 / 2³ = 1/8`!)"}}]}, {"id": "g8-math-u2", "title": "Unit 2 (Strand B): Proportional Reasoning, Percent Change & Multi-Step Tax", "studyFirstTag": "Calculate percent increase/decrease, markups, and solve scale proportions!", "curriculumStrand": "Ontario 2020 Grade 8 Math Strand B: Proportional Relationships", "svgDiagram": "g8_math_pyth_slope_svg", "lessons": [{"id": "g8-math-u2-l1", "title": "Lesson 2.1: Percent Increase/Decrease & Multi-Step Discounts + 13% HST", "readTime": "3 min read", "bigIdea": "**Percent Change** always divides the *change* by the **ORIGINAL** amount: `% Change = (|New − Original| ÷ Original) × 100%`!", "paragraphs": ["Suppose your favourite basketball shoes jump from `$80` to `$100`. That's a `$20` increase. What is the **Percent Increase**? Always divide by the **ORIGINAL** (`$80`), never the new price! `($20 ÷ $80) × 100% = 25%` increase. Watch the reverse trap: if a `$100` pair drops `$20` back to `$80`, that is a `$20 ÷ $100 = 20%` decrease—different denominator, different percent!", "For multi-step Ontario store problems (e.g., **25% off** AND **13% Ontario HST**), use **Multiplier Shortcuts**! A 25% discount means you pay `75% = × 0.75`. Adding 13% HST means you pay `113% = × 1.13`. Multiply in sequence: `Final Price = Price × 0.75 × 1.13`!", "Never fall for the classic shopper mistake of subtracting `25% − 13% = 12%`! Why? Because the 13% HST is calculated on the **discounted** price, not the original tag! Multiplying `0.75 × 1.13 = 0.8475` (you save `15.25%`, not `12%`!)."], "keyTakeaway": "`% Change = (Change ÷ ORIGINAL) × 100%`. For multi-step percents, multiply step-by-step (`× 0.75 × 1.13`)—NEVER add or subtract percents directly!", "deepReadTitle": "🛒 Multiplier Cheat Sheet", "deepReadText": "• 20% discount → pay `80%` → `× 0.80`\n• 35% markup → pay `135%` → `× 1.35`\n• 13% Ontario HST → pay `113%` → `× 1.13`\n• Cross-Multiply Proportions: `a/b = c/x` → `a × x = b × c`!", "quickCheck": {"question": "A trombone case originally costs `$120` and goes on sale for `$90`. What is the Percent Decrease?", "options": ["30% decrease", "25% decrease", "33.3% decrease"], "correctIdx": 1, "explanation": "Change = `$120 − $90 = $30`. Divide by ORIGINAL (`$120`): `30 ÷ 120 = 0.25 = 25%` decrease!"}, "videos": [{"id": "jAcDJDjQk2g", "title": "Percent of Change | Percent Increase and Decrease", "channel": "Math with Mr. J", "why": "Step-by-step mastery of dividing by the ORIGINAL value."}]}], "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Recall Percent Change & Multiplier Rules", "content": "Lock in these exact formulas:", "keyPoints": ["`% Change = (|New − Original| ÷ Original) × 100%`.", "Multi-Step: `Discount × HST` (never subtract percents!)."]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Explain Why +20% Followed by −20% Does NOT Return to Original", "content": "The second percent acts on a larger base!", "analogy": "💵 $100 Test: `$100 + 20% = $120`. Now take 20% OFF `$120` (`$24` off) → `$96`, NOT `$100`!", "keyPoints": ["Always calculate each percent on the *current* value using multipliers (`1.20 × 0.80 = 0.96`)."]}, {"level": 3, "name": "APPLY", "subtitle": "Solve a Markup → Discount → HST Chain", "content": "Apply multipliers cleanly:", "workedExample": {"prompt": "A store buys a bike for `$200`, marks it up `50%`, then runs a `20%` sale + `13%` HST.", "steps": ["Markup: `$200 × 1.50 = $300`", "20% Sale: `$300 × 0.80 = $240`", "13% HST: `$240 × 1.13 = $271.20`"]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Correct vs. Trap Percent Methods", "content": "Avoid the #1 Grade 8 test blunder:", "comparisonTable": {"headers": ["Problem", "Wrong Shortcut Trap", "Correct Multiplier"], "rows": [["30% off then 13% HST", "−30% + 13% = −17% (`×0.83`)", "`× 0.70 × 1.13 = × 0.791`"], ["$50 rises to $65", "`15 ÷ 65 = 23%` (wrong base!)", "`15 ÷ 50 = 30%` (ORIGINAL!)"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Audit a Store Receipt for Tax & Discount Errors", "content": "Check every line item:", "keyPoints": ["Verify that discount is applied BEFORE 13% HST—and remember multiplying `0.70 × 1.13` equals `1.13 × 0.70` by commutative property!"]}, {"level": 6, "name": "CREATE", "subtitle": "Build a Team Jersey Quote Comparing Two Ottawa Suppliers", "content": "Compare a flat bulk rate vs. a 25% discount + shipping fee using proportions and HST.", "keyPoints": ["Show unit price per jersey AND total with 13% HST."]}], "questions": [{"id": "g8-math-q2", "bloomLevel": 4, "bloomTag": "APPLY & ANALYZE", "title": "Proportional Reasoning, Percent Change & 13% Ontario HST Lab", "prompt": "An Ottawa sports shop buys hoodies for `$40` each, marks them up by **50%** for the price tag, and later puts them on a **20% off** weekend sale (plus **13% Ontario HST**).\n(a) Find the regular price tag (after 50% markup) AND the weekend sale price (before tax).\n(b) Find the final cash-register total WITH 13% Ontario HST.\n(c) What is the overall **Percent Increase** from the shop's `$40` wholesale cost to the pre-tax sale price?", "step1_deconstruct": {"instruction": "Chain the multipliers one step per line—never combine +50% and −20% into +30%!", "guidingQuestions": ["What is `$40 × 1.50`?", "What is `20%` off the `$60` tag (`× 0.80`)?", "In (c), what is the ORIGINAL wholesale cost (`$40`)?"], "modelPlan": "(a) Tag = $40×1.50 = $60; Sale = $60×0.80 = $48. (b) HST Total = $48×1.13 = $54.24. (c) Change = $48−$40 = $8 → ($8÷$40)×100% = 20% increase!"}, "step2_anchor": {"instruction": "Formulas:", "referenceItems": ["50% markup = `× 1.50` | 20% off = `× 0.80` | 13% HST = `× 1.13`", "`% Increase = (New − Original) ÷ Original × 100%`"]}, "step3_substeps": [{"label": "Step 3a: Find the regular price tag (`+50%`) AND sale price (`−20%`)", "placeholder": "Tag = $40 × 1.50 = $...\nSale = ... × 0.80 = $...", "hint": "50% of $40 is $20 → $60 tag. Then 20% off $60 is $12 off → $48!", "modelSubAnswer": "• Regular Price Tag = `$40 × 1.50 = $60.00`\n• Weekend Sale Price (before tax) = `$60 × 0.80 = $48.00`"}, {"label": "Step 3b: Calculate the final register total with 13% Ontario HST", "placeholder": "Final Total = $48 × 1.13 = $...", "hint": "13% of $48 is `$6.24`; `$48 + $6.24 = $54.24`!", "modelSubAnswer": "• Final Total = `$48.00 × 1.13 = $54.24` (HST = `$6.24`)."}, {"label": "Step 3c: Find the overall Percent Increase from `$40` to `$48`", "placeholder": "Change = $48 − $40 = $...\n% Increase = (... ÷ 40) × 100% = ...%", "hint": "Divide the `$8` profit by ORIGINAL `$40`!", "modelSubAnswer": "• Change = `$48 − $40 = $8`\n• `% Increase = (8 ÷ 40) × 100% = 0.20 × 100% = 20%` (Notice `+50%` then `−20%` gave `+20%`, NOT `+30%`!)."}], "step4_checks": ["Did I apply the 20% discount to the `$60` tag (giving `$48`, NOT `$52`)?", "Did I round money to 2 decimal places (`$54.24`)?", "Did I divide `$8` by ORIGINAL `$40` (getting `20%`)?"], "step5_modelAnswer": {"basicAnswer": "Tag $60, Sale $48, Tax $54.24, Increase 20%.", "expandedAnswer": "Part (a): Price Tag = `$40 × 1.50 = $60.00`; Weekend Sale = `$60 × 0.80 = $48.00`.\nPart (b): With 13% Ontario HST = `$48.00 × 1.13 = $54.24`.\nPart (c): Overall Percent Increase = `($48 − $40) ÷ $40 × 100% = 8 ÷ 40 × 100% = 20%` (proving `1.50 × 0.80 = 1.20`, NOT `1.30`!).", "extensionPrompt": "Extension: If the store sells 35 hoodies on sale, what is their total pre-tax profit (`$8 × 35`)?"}}]}, {"id": "g8-math-u3", "title": "Unit 3 (Strand C): Multi-Step Algebra, Slope (y = mx + b), Inequalities & Coding", "studyFirstTag": "Master linear equations, slope, the negative inequality flip, and Python loops!", "curriculumStrand": "Ontario 2020 Grade 8 Math Strand C: Algebra & Coding", "svgDiagram": "g8_math_pyth_slope_svg", "lessons": [{"id": "g8-math-u3-l1", "title": "Lesson 3.1: Variables on Both Sides (`ax + b = cx + d`) & Linear Slope (`y = mx + b`)", "readTime": "3 min read", "bigIdea": "Every straight line follows `y = mx + b`: **`m`** is the **Slope (Rate of Change = Rise ÷ Run)**, and **`b`** is the **y-intercept (Starting Value when `x = 0`)**!", "paragraphs": ["To solve an equation with variables on **BOTH sides**—like `5x − 7 = 2x + 11`—follow the Golden Sorting Rule: **move all `x` terms to one side, and all plain numbers to the other side!** Subtract `2x` from both sides (`3x − 7 = 11`), add `7` to both sides (`3x = 18`), divide by `3` (`x = 6`). Always verify with **LS = RS**: `LS = 5(6)−7 = 23`; `RS = 2(6)+11 = 23` ✅!", "Now meet the superpower equation you will use all through Grade 8, 9, 10, 11, and 12: **`y = mx + b`**. Suppose an Ottawa gym membership charges a `$25` signup fee (`b = 25`) plus `$15` per month (`m = 15`). Its equation is `y = 15x + 25`!", "To find the **Slope (`m`)** between any two points `(x₁, y₁)` and `(x₂, y₂)` on a graph or table, use **`m = Rise ÷ Run = (y₂ − y₁) ÷ (x₂ − x₁)`**. Going uphill left-to-right = positive slope (`m > 0`); going downhill = negative slope (`m < 0`); flat horizontal line = zero slope (`m = 0`)!"], "keyTakeaway": "In `y = mx + b`, `m = (y₂ − y₁) / (x₂ − x₁)` is the rate of change (slope), and `b` is the y-intercept (`x = 0`). Always prove algebra solutions with `LS = RS`!", "deepReadTitle": "📈 Reading `y = mx + b` in 3 Seconds", "deepReadText": "• `y = −4x + 12`: Starts at `(0, 12)` and drops `4` every time `x` goes up by `1` (downhill negative slope!).\n• Two-Point Example: `(1, 5)` and `(4, 17)` → `m = (17 − 5) ÷ (4 − 1) = 12 ÷ 3 = 4`!", "quickCheck": {"question": "A line passes through `(2, 7)` and `(5, 19)`. What is its Slope `m`?", "options": ["m = 3", "m = 4", "m = 12"], "correctIdx": 1, "explanation": "`m = Rise ÷ Run = (19 − 7) ÷ (5 − 2) = 12 ÷ 3 = 4`!"}, "videos": [{"id": "rpMu98yRk40", "title": "Algebra Basics: Slope and Distance", "channel": "mathantics", "why": "Visualizes Rise over Run and positive vs. negative slopes."}, {"id": "MXV65i9g1Xg", "title": "Basic Linear Functions (y = mx + b)", "channel": "mathantics", "why": "Connects tables, graphs, and equations seamlessly."}]}, {"id": "g8-math-u3-l2", "title": "Lesson 3.2: Inequalities (The Negative Flip Rule!) & Grade 8 Coding Loops", "readTime": "3 min read", "bigIdea": "Solving an inequality works JUST like an equation—with **ONE HUGE RULE**: whenever you **multiply or divide both sides by a NEGATIVE number**, **FLIP the inequality sign** (`<` becomes `>`)!", "paragraphs": ["Test the Negative Flip Rule with real numbers! We know `2 < 5` is TRUE. Now multiply both sides by `−1`: `−2` and `−5`. Which is bigger on a number line? `−2 > −5`! Notice the inequality flipped from `<` to `>`! So when solving `−3x ≤ 12`, divide both sides by `−3` and FLIP `≤` to `≥` → **`x ≥ −4`**!", "Remember your number-line dots: open circle `○` for `<` or `>` (does NOT include the endpoint), and solid closed dot `●` for `≤` or `≥` (INCLUDES the endpoint).", "In **Ontario 2020 Grade 8 Coding**, you analyze **sub-programs (functions)** and **nested loops** to model math patterns! For example, `def total_cost(months): return 15 * months + 25` is literally `y = 15x + 25` in Python—and a `for` loop inside a `for` loop (`for r in range(3): for c in range(4):`) runs `3 × 4 = 12` times!"], "keyTakeaway": "Multiply or divide an inequality by a **NEGATIVE** → **FLIP THE SIGN!** In coding, a nested loop of size `A` inside size `B` runs `A × B` total iterations.", "deepReadTitle": "💻 Grade 8 Python Function & Nested Loop Trace", "deepReadText": "```def plan(m): return 15 * m + 25```\n• Calling `plan(4)` returns `15(4) + 25 = 85`!\n• Inequality Check: `−2x + 5 > 13` → `−2x > 8` → divide by `−2` & FLIP → `x < −4` (open circle ○ at −4, arrow LEFT!).", "quickCheck": {"question": "Solve `−4x + 6 ≥ 22`. What is the correct solution?", "options": ["x ≥ −4", "x ≤ −4", "x ≤ 4"], "correctIdx": 1, "explanation": "Subtract 6 → `−4x ≥ 16`. Divide by `−4` and **FLIP** the sign (`≥` → `≤`) → **`x ≤ −4`**!"}, "videos": [{"id": "RyesLifeUBw", "title": "Algebra Basics: Inequalities in Algebra", "channel": "mathantics", "why": "Clearly proves WHY multiplying/dividing by a negative flips the inequality sign."}]}], "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Recall `y = mx + b`, Slope Formula & Negative Flip Rule", "content": "Anchor every Grade 8 Algebra rule:", "keyPoints": ["`y = mx + b` where `m = (y₂ − y₁)/(x₂ − x₁)` and `b` = value at `x = 0`.", "Inequality Rule: Multiply/Divide by a NEGATIVE → FLIP `<` / `>`!"]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Explain Why Negative Division Flips Inequalities", "content": "Multiplying by `−1` mirrors the entire number line across zero—swapping left and right!", "analogy": "🪞 Mirror Analogy: Looking in a mirror flips your left hand to the right—multiplying by a negative flips the entire number line, reversing `<` to `>`!", "keyPoints": ["Adding or subtracting a negative NEVER flips the sign—ONLY multiplying or dividing by a negative!"]}, {"level": 3, "name": "APPLY", "subtitle": "Find the Equation of a Line from 2 Points", "content": "Step through `(1, 8)` and `(4, 20)`:", "workedExample": {"prompt": "Write `y = mx + b` passing through `(1, 8)` and `(4, 20)`:", "steps": ["Step 1 (Slope `m`): `m = (20 − 8) ÷ (4 − 1) = 12 ÷ 3 = 4`.", "Step 2 (Find `b` using `(1, 8)`): `8 = 4(1) + b` → `b = 4`.", "Step 3 (Equation): **`y = 4x + 4`** (Check with `(4, 20)`: `4(4)+4 = 20` ✅!)."]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Two Linear Gym Plans", "content": "Find the exact crossover month:", "comparisonTable": {"headers": ["Plan", "Equation", "Month 1", "Month 5", "When Equal?"], "rows": [["Plan A ($0 fee, $20/mo)", "y = 20x", "$20", "$100", "20x = 15x + 25 → x = 5 mo!"], ["Plan B ($25 fee, $15/mo)", "y = 15x + 25", "$40", "$100", "Cheaper AFTER Month 5!"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Debug an Inequality & Loop Error", "content": "Catch both classic Grade 8 mistakes:", "keyPoints": ["❌ Solving `−5x < 15` as `x < −3` (Forgot to FLIP! Test `x = −10`: `−5(−10) = +50`, NOT `< 15`!). ✅ Correct: `x > −3`."]}, {"level": 6, "name": "CREATE", "subtitle": "Write a Linear Equation + Python Function for a School Fundraiser", "content": "Model selling $8 snacks with a $32 supply cost (`Profit = 8x − 32`).", "keyPoints": ["Find break-even point (`8x − 32 = 0` → `x = 4` snacks) and trace a Python `for` loop for `x = 1..6`!"]}], "questions": [{"id": "g8-math-q3", "bloomLevel": 5, "bloomTag": "APPLY & ANALYZE", "title": "Linear Equations, Negative-Flip Inequalities & Crossover Lab", "prompt": "Two Ottawa bike-rental shops charge:\n• **Shop A:** `$12` flat fee + `$5` per hour (`y = 5x + 12`).\n• **Shop B:** `$0` flat fee + `$8` per hour (`y = 8x`).\n\n(a) Solve `5x + 12 = 8x` to find the exact hour when BOTH shops cost the same, and prove it with `LS = RS`.\n(b) Solve the inequality `−3x + 10 ≤ 28` and describe its number-line graph (circle type & arrow direction).\n(c) Trace this Grade 8 Python code—what are the final printed values?\n`total = 0` | `for h in range(1, 4): total = total + (5 * h + 12)` | `print(total)`", "step1_deconstruct": {"instruction": "Break into 3 clean parts: (a) equation + LS=RS, (b) inequality with negative flip, (c) trace `h = 1, 2, 3` carefully!", "guidingQuestions": ["In `5x + 12 = 8x`, what do you subtract from both sides?", "When dividing by `−3` in Part (b), what happens to `≤`?", "In Python, does `range(1, 4)` stop BEFORE 4 (`1, 2, 3`)?"], "modelPlan": "(a) 12 = 3x → x = 4 hrs ($32 at both). (b) −3x ≤ 18 → FLIP → x ≥ −6 (solid dot ● at −6, arrow right). (c) h=1 (17) + h=2 (22) + h=3 (27) = 66!"}, "step2_anchor": {"instruction": "Unit 3 Error Shield:", "referenceItems": ["`LS = RS` proves algebra accuracy!", "Dividing by `−3` FLIPS `≤` to `≥`!", "Python `range(1, 4)` runs `h = 1, 2, 3` (stops BEFORE 4!)."]}, "step3_substeps": [{"label": "Step 3a: Solve `5x + 12 = 8x` and verify with `LS = RS`", "placeholder": "5x + 12 = 8x → ...\nLS = ... | RS = ...", "hint": "Subtract `5x` from both sides: `12 = 3x` → `x = 4`!", "modelSubAnswer": "`5x + 12 = 8x` → subtract `5x`: `12 = 3x` → divide by `3`: **`x = 4 hours`**.\nCheck: `LS = 5(4) + 12 = 32` | `RS = 8(4) = 32` (`LS = RS` ✅!)."}, {"label": "Step 3b: Solve `−3x + 10 ≤ 28` and describe its number line", "placeholder": "−3x ≤ ...\nx ... (circle type & arrow direction)", "hint": "Subtract 10 → `−3x ≤ 18`. Divide by `−3` AND FLIP `≤` to `≥`!", "modelSubAnswer": "`−3x + 10 ≤ 28` → `−3x ≤ 18` → divide by `−3` & FLIP: **`x ≥ −6`**.\nGraph: **Solid closed dot (`●`)** at `−6` with arrow pointing **RIGHT**."}, {"label": "Step 3c: Trace `for h in range(1, 4): total = total + (5*h + 12)`", "placeholder": "h=1: 5(1)+12 = ... | total = ...\nh=2: ... | h=3: ...\nFinal print(total) = ...", "hint": "Run `h = 1, 2, 3`: `17 + 22 + 27 = 66`!", "modelSubAnswer": "• `h = 1`: `5(1)+12 = 17` → `total = 17`\n• `h = 2`: `5(2)+12 = 22` → `total = 39`\n• `h = 3`: `5(3)+12 = 27` → `total = 66`\nFinal printed output: **`66`**!"}], "step4_checks": ["Did I verify `x = 4` with `LS = RS = 32`?", "Did I FLIP `≤` to `≥` when dividing by `−3` (`x ≥ −6`, solid dot ●)?", "Did I stop Python `range(1, 4)` at `h = 3` (NOT `h = 4`)?"], "step5_modelAnswer": {"basicAnswer": "x = 4, x >= -6, total = 66.", "expandedAnswer": "Part (a): `5x + 12 = 8x` → `12 = 3x` → `x = 4 hours` (both cost `$32`; `LS = 5(4)+12 = 32 = RS`). Shop A is cheaper for rides longer than 4 hours!\nPart (b): `−3x + 10 ≤ 28` → `−3x ≤ 18` → divide by `−3` & flip sign → **`x ≥ −6`** (solid dot `●` at `−6`, arrow right).\nPart (c): `range(1, 4)` executes `h = 1, 2, 3`, adding `17 + 22 + 27 = 66`.", "extensionPrompt": "Extension: Which bike shop should Zaid pick for a 6-hour ride along the Rideau Canal, and how much money does he save?"}}]}, {"id": "g8-math-u4", "title": "Unit 4 (Strand E): Pythagorean Theorem, Polygon Angles & 3D Cylinders/Prisms", "studyFirstTag": "Master `a² + b² = c²` (never forget √!) + Polygon Interior Angles + 3D Volume!", "curriculumStrand": "Ontario 2020 Grade 8 Math Strand E: Spatial Sense & Measurement", "svgDiagram": "g8_math_pyth_slope_svg", "lessons": [{"id": "g8-math-u4-l1", "title": "Lesson 4.1: The Pythagorean Theorem (`a² + b² = c²`) — Hypotenuse vs. Missing Leg!", "readTime": "3 min read", "bigIdea": "In EVERY right triangle, the square on the longest side (**hypotenuse `c`**, opposite the 90° box) equals the sum of the squares on the two shorter legs: **`a² + b² = c²`**!", "paragraphs": ["The **Pythagorean Theorem** is one of the most famous and useful formulas in all of math and engineering—used to find diagonal distances across soccer fields, ladder heights against walls, and TV screen sizes! First, ALWAYS spot the **90° right-angle box**: the side directly **across** from it is the longest side, called the **hypotenuse (`c`)**.", "Case 1 — **Finding Hypotenuse `c` (ADD!)**: If legs are `a = 6 m` and `b = 8 m`, compute `c² = 6² + 8² = 36 + 64 = 100`. NOW STOP! Don't fall into the #1 Grade 8 careless trap of stopping at `100`! Take the **square root**: `c = √100 = 10 m`!", "Case 2 — **Finding a Missing Leg `a` or `b` (SUBTRACT!)**: Suppose a `13 m` ladder (`c = 13`) leans `5 m` from a wall (`b = 5`). Because you already HAVE the longest side `c`, you MUST **subtract**: `a² = c² − b² = 13² − 5² = 169 − 25 = 144` → `a = √144 = 12 m`! Quick sanity check: a leg MUST always be shorter than the hypotenuse (`12 < 13` ✅)!"], "keyTakeaway": "Finding hypotenuse `c`? **ADD** (`c = √(a² + b²)`). Finding a shorter leg `a`? **SUBTRACT** (`a = √(c² − b²)`). NEVER forget the final `√`!", "deepReadTitle": "📐 Famous Pythagorean Triples (Instant Mental Math!)", "deepReadText": "• `3 - 4 - 5` (and multiples `6 - 8 - 10`, `9 - 12 - 15`)\n• `5 - 12 - 13` | `8 - 15 - 17` | `7 - 24 - 25`\n• Sanity Check: Is `c` the longest side? If a leg comes out bigger than `c`, you accidentally added instead of subtracting!", "quickCheck": {"question": "A `10 m` ramp (`c = 10`) rises to a height of `6 m` (`a = 6`). How long is the horizontal base `b`?", "options": ["11.7 m (added 10² + 6²)", "8 m (√(10² − 6²) = √64 = 8)", "64 m (forgot square root!)"], "correctIdx": 1, "explanation": "Because `10 m` is the hypotenuse `c`, SUBTRACT: `b² = 10² − 6² = 100 − 36 = 64` → `b = √64 = 8 m`!"}, "videos": [{"id": "WqhlG3Vakw8", "title": "Math Antics — The Pythagorean Theorem", "channel": "mathantics", "why": "Gold-standard visual proof of a² + b² = c² for both hypotenuse and missing legs."}]}, {"id": "g8-math-u4-l2", "title": "Lesson 4.2: Polygon Interior Angles & Volume/Surface Area of Prisms & Cylinders", "readTime": "3 min read", "bigIdea": "Any `n`-sided polygon splits into `(n − 2)` triangles, so its interior angles add to `(n − 2) × 180°`—and every prism/cylinder volume follows **`V = Area of Base × Height`**!", "paragraphs": ["You already know a triangle's angles add to `180°` and a quadrilateral's add to `360°`. What about a **pentagon** (5 sides), **hexagon** (6 sides), or **octagon** (8 sides)? Draw diagonals from one corner—you always cut the polygon into **`(n − 2)` triangles**! So **`Sum of Interior Angles = (n − 2) × 180°`**. For a regular octagon (`n = 8`): `(8 − 2) × 180° = 1,080°`, and each equal angle is `1,080° ÷ 8 = 135°`!", "For 3D solids in Grade 8, stop memorizing disconnected formulas—use ONE master rule for all prisms and cylinders: **`Volume = (Area of Base) × Height`**!\n• **Cylinder:** Base is a circle (`πr²`), so `V = πr²h` (always halve diameter `d ÷ 2` first!).\n• **Triangular Prism:** Base is a triangle (`½bh`), so `V = (½ × b × h_tri) × Length`!", "For **Surface Area**, unfold the 3D net and add every face: a closed cylinder unfolds into 2 circles + 1 curved rectangle wrapped around the circumference (`2πr`), giving **`SA = 2πr² + 2πrh`**! Always check units: Volume = **cubic (`cm³`)**, Surface Area = **square (`cm²`)**!"], "keyTakeaway": "Polygon Angle Sum = `(n − 2) × 180°` | Prism/Cylinder Volume = `Base Area × Height` (`cm³`) | Cylinder SA = `2πr² + 2πrh` (`cm²`).", "deepReadTitle": "📦 Grade 8 Geometry Formula Vault", "deepReadText": "• Interior Angle Sum = `(n − 2) × 180°` (Pentagon = 540°, Hexagon = 720°, Octagon = 1080°)\n• Cylinder Volume = `πr²h` | Cylinder SA = `2πr² + 2πrh`\n• Triangular Prism Volume = `(base × tri_height ÷ 2) × prism_length`", "quickCheck": {"question": "What is the sum of the interior angles of a hexagon (`n = 6`), AND what is the volume of a cylinder with diameter `10 cm` and height `4 cm` (`π = 3.14`)?", "options": ["720° and 314 cm³ (using r = 5 cm!)", "1080° and 1,256 cm³ (using d = 10 cm)", "540° and 125.6 cm³"], "correctIdx": 0, "explanation": "Hexagon: `(6 − 2) × 180° = 720°`. Cylinder: `r = 10 ÷ 2 = 5 cm` → `V = 3.14 × 5² × 4 = 3.14 × 100 = 314 cm³`!"}, "videos": [{"id": "IaoZhhx_I9s", "title": "Math Antics — Polygons", "channel": "mathantics", "why": "Clear visual breakdown of regular polygons and angle patterns."}, {"id": "fGVlL47TKAw", "title": "How to Find the Volume of a Cylinder", "channel": "Math with Mr. J", "why": "Walks through radius vs. diameter traps cleanly."}, {"id": "4pV7_NuGO2g", "title": "How to Find the Volume of a Triangular Prism", "channel": "Math with Mr. J", "why": "Shows Base Area × Length without confusing triangle height and prism length."}]}, {"id": "g8-math-u4-l3", "title": "Lesson 4.3: Similar Triangles, Scale Factors & Metric Area/Volume/Micro Conversions", "readTime": "3 min read", "bigIdea": "**Similar Triangles** share identical angles and proportional sides (`k = New ÷ Original`)—and watch the **Metric Area/Volume Trap**: `1 m = 100 cm`, so **`1 m² = 100² = 10,000 cm²`** (NOT `100 cm²`!)!", "paragraphs": ["Two triangles are **Similar (`△ABC ~ △DEF`)** if their matching angles are equal and every side multiplies by the exact same **Scale Factor `k`**! Example: a `3–4–5` triangle dilated by `k = 2.5` becomes `7.5–10–12.5`—and you can measure a towering Ottawa flagpole's height using shadow proportions: `Flagpole / 12 m shadow = 1.5 m student / 2 m shadow` → `Flagpole = 9 m`!", "Ontario 2020 Grade 8 Measurement (`E2.1`) also introduces **Extreme Metric Prefixes** (linking Math to Science Cells & Computers!):\n• Tiny: **`milli` (`10⁻³`)**, **`micro` (`µ`, `10⁻⁶` — 1 millionth, cell widths!)**, **`nano` (`n`, `10⁻⁹` — 1 billionth, viruses & computer chips!)**.\n• Huge: **`kilo` (`10³`)**, **`mega` (`M`, `10⁶`)**, **`giga` (`G`, `10⁹`)**, **`tera` (`T`, `10¹²` — hard drives!)**.", "And NEVER fall for the **Squared/Cubed Conversion Trap**! Because `1 m = 100 cm`, a `1 m × 1 m` square tile holds `100 cm × 100 cm = 10,000 cm²`! And for 3D capacity, memorize **`1 cm³ = 1 mL`** and **`1,000 cm³ = 1 Litre`**!"], "keyTakeaway": "Scale Factor `k = New ÷ Original` (Area scales by `k²`!). Extreme Metric jumps by `1,000×`: `Tera ← Giga ← Mega ← Kilo ← Base → Milli → Micro (µ) → Nano (n)`. **`1 m² = 10,000 cm²`** & **`1,000 cm³ = 1 L`**!", "deepReadTitle": "📏 Extreme Metric Staircase (×1,000 Per Jump!)", "deepReadText": "• `1 TB = 1,000 GB = 1,000,000 MB` | `1 mm = 1,000 µm = 1,000,000 nm`\n• Area Trap: `1 m² = 100 × 100 = 10,000 cm²`!\n• Capacity Bridge: `1 cm³ = 1 mL` | `1,000 cm³ = 1 L` | `1 m³ = 1,000 L`!", "quickCheck": {"question": "A `1.6 m` student casts a `2.0 m` shadow while a tree casts a `10.0 m` shadow. How tall is the tree, AND how many `cm²` are in `3 m²`?", "options": ["Tree = 8.0 m; 3 m² = 30,000 cm²", "Tree = 12.5 m; 3 m² = 300 cm²", "Tree = 8.0 m; 3 m² = 300 cm²"], "correctIdx": 0, "explanation": "Scale factor `k = 10 ÷ 2 = 5` → Tree = `1.6 × 5 = 8.0 m`! And `1 m² = 10,000 cm²`, so `3 m² = 30,000 cm²`!"}, "videos": [{"id": "P1f3sJpIYGI", "title": "How to Find Scale Factor with Similar Figures", "channel": "Mario's Math Tutoring", "why": "Clear visual walkthrough of similar triangles and proportions."}, {"id": "eK8gXP3pImU", "title": "Converting Metric Units with Conversion Factors", "channel": "The Organic Chemistry Tutor", "why": "Locks in metric prefix jumps and squared/cubed unit conversions."}]}], "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Recall Pythagoras, Polygon Angles & 3D Formulas", "content": "Lock in Strand E formulas:", "keyPoints": ["Pythagoras: `a² + b² = c²` (`c` = longest hypotenuse across from 90°).", "Polygons: `(n − 2) × 180°` | Cylinder: `V = πr²h`, `SA = 2πr² + 2πrh`."]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Explain Why `r = d ÷ 2` Triples Down in `πr²`", "content": "Forgetting to halve diameter makes your squared area **4 TIMES** too big (`(2r)² = 4r²`)!", "analogy": "🎯 Bullseye Check: Always circle the word DIAMETER in red and immediately write `r = d ÷ 2` on Line 1!", "keyPoints": ["Also check units: Volume is 3D (`cm³`), Surface Area is 2D (`cm²`), Length is 1D (`cm`)."]}, {"level": 3, "name": "APPLY", "subtitle": "Solve a Real-World Ladder + Cylinder Design Problem", "content": "Follow the 3-line formula method:", "workedExample": {"prompt": "Find the diagonal of a `9 m × 12 m` gym mat:", "steps": ["Formula: `c² = a² + b²`", "Substitute: `c² = 9² + 12² = 81 + 144 = 225`", "Square Root: `c = √225 = 15 m`!"]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Adding vs. Subtracting in Pythagoras", "content": "Pick the right operation in 2 seconds:", "comparisonTable": {"headers": ["What Is Unknown?", "Operation", "Formula", "Sanity Check"], "rows": [["Hypotenuse `c` (across from 90°)", "ADD", "`c = √(a² + b²)`", "Answer MUST be > both legs"], ["Missing Leg `a` or `b`", "SUBTRACT", "`a = √(c² − b²)`", "Answer MUST be < hypotenuse `c`"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Spot 3 Classic Geometry Careless Errors", "content": "Catch these before handing in your test:", "keyPoints": ["1. Stopping at `c² = 169` without taking `√169 = 13`. 2. Using diameter instead of radius. 3. Writing `cm²` instead of `cm³` for Volume!"]}, {"level": 6, "name": "CREATE", "subtitle": "Calculate a Scale-Factor Dilation Challenge", "content": "If a cylinder's radius doubles while height stays the same, how many times larger does its volume become?", "keyPoints": ["Since `r` is squared in `πr²h`, doubling `r` multiplies volume by `2² = 4×`!"]}], "questions": [{"id": "g8-math-q4", "bloomLevel": 4, "bloomTag": "APPLY & ANALYZE", "title": "Pythagorean Theorem, Polygon Angles & 3D Cylinder Mastery Lab", "prompt": "Solve all 3 Spatial Sense problems showing formulas and units (`π = 3.14`):\n(a) A `15 m` zip-line cable (`c = 15 m`) runs from the top of a `9 m` tower (`a = 9 m`) to the ground. How far horizontally (`b`) is the anchor from the base of the tower?\n(b) Find the sum of the interior angles of a regular **decagon** (`n = 10` sides), and the measure of ONE interior angle.\n(c) A cylindrical water bottle has **DIAMETER = `8 cm`** and height = `20 cm`. Find its **Volume (`cm³`)** AND **Surface Area (`cm²`)**.", "step1_deconstruct": {"instruction": "Watch all 3 traps: Missing leg (SUBTRACT!) in (a), `(n−2)×180°` in (b), and DIAMETER → RADIUS (`r = 4`) in (c)!", "guidingQuestions": ["Is `15 m` the hypotenuse or a leg?", "For a decagon (`n = 10`), what is `(10 − 2) × 180°`?", "What is the radius `r` if diameter = `8 cm`?"], "modelPlan": "(a) b = √(15²−9²) = √(225−81) = √144 = 12 m. (b) (10−2)×180° = 1440°; one angle = 144°. (c) r = 4 cm; V = 3.14×16×20 = 1004.8 cm³; SA = 2(3.14)(16) + 2(3.14)(4)(20) = 100.48 + 502.4 = 602.88 cm²."}, "step2_anchor": {"instruction": "Formulas:", "referenceItems": ["Missing Leg: `b² = c² − a²` → take `√`!", "Interior Sum = `(n − 2) × 180°` | Regular angle = `Sum ÷ n`", "`r = d ÷ 2` | `V = πr²h` | `SA = 2πr² + 2πrh`"]}, "step3_substeps": [{"label": "Step 3a: Find the horizontal distance `b` of the zip-line anchor", "placeholder": "b² = 15² − 9² = ...\nb = √... = ... m", "hint": "Subtract because 15 m is the hypotenuse! `225 − 81 = 144`, `√144 = 12 m`!", "modelSubAnswer": "`b² = 15² − 9² = 225 − 81 = 144` → **`b = √144 = 12 m`** (`12 < 15` ✅)."}, {"label": "Step 3b: Find interior angle sum AND single angle of a regular decagon (`n = 10`)", "placeholder": "Sum = (10 − 2) × 180° = ...\nOne angle = ... ÷ 10 = ...", "hint": "8 × 180° = 1,440°, then divide by 10!", "modelSubAnswer": "• Sum = `(10 − 2) × 180° = 8 × 180° = 1,440°`\n• Each interior angle = `1,440° ÷ 10 = 144°`."}, {"label": "Step 3c: Find Volume (`cm³`) & Surface Area (`cm²`) of the `d = 8 cm, h = 20 cm` cylinder", "placeholder": "r = 8 ÷ 2 = 4 cm\nV = 3.14 × 4² × 20 = ... cm³\nSA = 2(3.14)(4²) + 2(3.14)(4)(20) = ... cm²", "hint": "First halve `8 ÷ 2 = 4 cm`! `V = 1004.8 cm³`; `SA = 100.48 + 502.4 = 602.88 cm²`!", "modelSubAnswer": "• Radius `r = 8 ÷ 2 = 4 cm`\n• Volume = `3.14 × 4² × 20 = 3.14 × 16 × 20 = 1,004.8 cm³`\n• Surface Area = `2(3.14)(16) + 2(3.14)(4)(20) = 100.48 + 502.4 = 602.88 cm²`"}], "step4_checks": ["Did I SUBTRACT in Pythagoras and take `√144 = 12 m`?", "Did I halve diameter `8 ÷ 2 = 4 cm` BEFORE squaring `r`?", "Did I label Volume in `cm³` and Surface Area in `cm²`?"], "step5_modelAnswer": {"basicAnswer": "b = 12 m; 1440° and 144°; V = 1004.8 cm³, SA = 602.88 cm².", "expandedAnswer": "Part (a): `b² = 15² − 9² = 144` → **`b = 12 m`**.\nPart (b): Decagon (`n=10`) angle sum = `(10−2)×180° = 1,440°`; each regular angle = `144°`.\nPart (c): With `r = 8÷2 = 4 cm`: `V = 3.14×16×20 = 1,004.8 cm³` (just over 1 Litre!); `SA = 2(3.14)(16) + 2(3.14)(4)(20) = 100.48 + 502.4 = 602.88 cm²`.", "extensionPrompt": "Extension: Because `1,000 cm³ = 1 Litre`, does this water bottle hold slightly more or less than 1 Litre?"}}]}, {"id": "g8-math-u5", "title": "Unit 5 (Strands D & F): Scatter Plots, Box Plots & Compound Interest", "studyFirstTag": "Read correlation & quartiles + watch Compound Interest grow exponentially!", "curriculumStrand": "Ontario 2020 Grade 8 Math Strands D & F: Data & Financial Literacy", "svgDiagram": "g8_math_pyth_slope_svg", "lessons": [{"id": "g8-math-u5-l1", "title": "Lesson 5.1: Scatter Plots (Correlation) & Box-and-Whisker Plots (Quartiles)", "readTime": "3 min read", "bigIdea": "**Scatter Plots** reveal relationships (**Positive**, **Negative**, or **No Correlation**) between two variables, while **Box-and-Whisker Plots** slice data into four equal 25% quarters using the **5-Number Summary**!", "paragraphs": ["When you graph two measurements together—like *Hours Studied* vs. *Quiz Score*—you get a **Scatter Plot**. If points trend uphill left-to-right, that's a **Positive Correlation** (more study → higher score). Downhill left-to-right = **Negative Correlation** (more absences → lower score). Random cloud = **No Correlation** (shoe size vs. math grade). A **Line of Best Fit** passes right through the middle of the dots (roughly equal dots above and below!) so you can make predictions.", "A **Box-and-Whisker Plot** summarizes a data set with **5 key numbers**: **Min**, **Q1** (Lower Quartile = median of the lower half), **Median (Q2)**, **Q3** (Upper Quartile = median of the upper half), and **Max**!", "The box itself stretches from `Q1` to `Q3`, covering the middle **50%** of all data! Its width **`IQR = Q3 − Q1`** (Interquartile Range) measures spread *without* getting ruined by extreme outliers!"], "keyTakeaway": "Line of Best Fit balances dots above/below to predict trends. Box Plot 5-Number Summary = `Min, Q1, Median, Q3, Max`; middle 50% width = `IQR = Q3 − Q1`!", "deepReadTitle": "📊 Fast 5-Number Summary Example", "deepReadText": "Sorted Data: `4, 6, 8, 10, 12, 16, 20` (7 numbers)\n• Min = `4` | Max = `20` | Median (Q2) = `10`\n• Lower half `4, 6, 8` → `Q1 = 6` | Upper half `12, 16, 20` → `Q3 = 16`\n• `IQR = Q3 − Q1 = 16 − 6 = 10`!", "quickCheck": {"question": "In a Box-and-Whisker plot, `Q1 = 68%` and `Q3 = 86%`. What percentage of students scored inside the box, and what is the IQR?", "options": ["25% of students; IQR = 18%", "50% of students; IQR = 18%", "75% of students; IQR = 154%"], "correctIdx": 1, "explanation": "The box from Q1 to Q3 ALWAYS holds the middle **50%** of the data, and `IQR = Q3 − Q1 = 86 − 68 = 18%`!"}, "videos": [{"id": "ioieTr41L24", "title": "Estimating the Line of Best Fit (Scatter Plots)", "channel": "Khan Academy", "why": "Shows how to position and read a line of best fit accurately."}, {"id": "b2C9I8HuCe4", "title": "Box-and-Whisker Plots & Quartiles", "channel": "Khan Academy", "why": "Step-by-step guide to finding Min, Q1, Median, Q3, and Max."}]}, {"id": "g8-math-u5-l2", "title": "Lesson 5.2: Simple vs. Compound Interest (`A = P(1 + r)ᵗ`) — The Snowball Effect!", "readTime": "3 min read", "bigIdea": "**Simple Interest** pays interest ONLY on your starting deposit (`P`), while **Compound Interest** pays **interest ON TOP OF previous interest**—making savings (or credit card debt!) snowball!", "paragraphs": ["In Grade 7, you mastered Simple Interest: `I = P × r × t`. Invest `$1,000` at `10%` Simple Interest for 3 years: you earn `$100` each year (`$100 + $100 + $100 = $300`), ending with `$1,300`.", "Now watch **Compound Interest** (`A = P(1 + r)ᵗ`) on the exact same `$1,000` at `10%` compounded annually:\n• **Year 1:** `$1,000 × 1.10 = $1,100` (earned `$100`)\n• **Year 2:** `$1,100 × 1.10 = $1,210` (earned `$110` — interest on your Year 1 interest!)\n• **Year 3:** `$1,210 × 1.10 = $1,331` (earned `$121`!)\nThat's `$31` extra in just 3 years—and over 30 years it becomes `$17,449` vs. only `$4,000` with Simple Interest!", "Warning for real life: Compound Interest is your **best friend** in a savings/investment account, and your **worst enemy** on an unpaid `19.99%` credit card! Always pay off credit cards in full every month so interest never compounds against you."], "keyTakeaway": "Compound Interest Formula: **`A = P(1 + r)ᵗ`** (`Interest Earned = A − P`). Great for saving early; dangerous on unpaid credit card balances!", "deepReadTitle": "💰 Simple vs. Compound Formula Check", "deepReadText": "• Simple Total: `A = P + (P × r × t)` (Linear straight-line growth!)\n• Compound Total: `A = P × (1 + r)ᵗ` (Exponential curved snowball growth!)\n• Decimal Trap Shield: `6% = 0.06` (so `1 + r = 1.06`, NOT `1.6`!)", "quickCheck": {"question": "You invest `$500` at `10%` interest compounded annually for `2` years (`A = 500 × 1.10²`). How much is in the account?", "options": ["$600 (Simple Interest)", "$605 (Compound Interest: $500 × 1.21)", "$1,100"], "correctIdx": 1, "explanation": "Year 1: `$500 × 1.10 = $550`. Year 2: `$550 × 1.10 = $605` (or `500 × 1.10² = 500 × 1.21 = $605`)!"}, "videos": [{"id": "P182Abv3fOk", "titl
