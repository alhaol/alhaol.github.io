<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zaid's Grade 8 Study Space (Ontario Curriculum)</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --surface: #ffffff;
      --surface-soft: #eef2f8;
      --text: #0f172a;
      --text-body: #2d3b4e;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-soft: #eff6ff;
      --success: #059669;
      --success-soft: #ecfdf5;
      --warning: #d97706;
      --warning-soft: #fffbeb;
      --danger: #dc2626;
      --danger-soft: #fef2f2;
      --purple: #7c3aed;
      --purple-soft: #f5f3ff;
      --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.05);
      --shadow-card: 0 12px 32px rgba(15, 23, 42, 0.08);
      --radius: 20px;
    }
    body.dark {
      --bg: #0b1120;
      --surface: #141e33;
      --surface-soft: #1e2b45;
      --text: #f8fafc;
      --text-body: #e2e8f0;
      --text-muted: #94a3b8;
      --border: #25344d;
      --border-strong: #374a6a;
      --primary: #60a5fa;
      --primary-hover: #3b82f6;
      --primary-soft: rgba(59, 130, 246, 0.22);
      --success: #34d399;
      --success-soft: rgba(16, 185, 129, 0.2);
      --warning: #fbbf24;
      --warning-soft: rgba(245, 158, 11, 0.2);
      --danger: #f87171;
      --danger-soft: rgba(239, 68, 68, 0.2);
      --purple: #c4b5fd;
      --purple-soft: rgba(167, 139, 250, 0.2);
      --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.3);
      --shadow-card: 0 14px 36px rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.68;
      min-height: 100vh;
    }
    button, input, textarea, select {
      font-family: inherit;
      color: inherit;
    }

    /* Smooth Card-Opening Animations (crisp transform without fading text out!) */
    @keyframes cardOpen {
      from { opacity: 0.72; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes sheetSlide {
      from { opacity: 0.8; transform: translateY(14px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .anim-card {
      animation: cardOpen 0.16s ease-out forwards;
    }

    /* Whisper-Quiet Top Bar (Adapts automatically in Focus Mode!) */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    body.dark .topbar {
      background: rgba(20, 30, 51, 0.92);
    }
    .brand-trigger {
      display: flex;
      align-items: center;
      gap: 10px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text);
      font-weight: 800;
      font-size: 1rem;
    }
    .brand-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, #2563eb, #06b6d4);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 0.92rem;
    }
    .focus-center-title {
      font-weight: 700;
      font-size: 0.92rem;
      color: var(--text-muted);
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Clean Buttons */
    .btn {
      background: var(--surface);
      color: var(--text);
      border: 1.5px solid var(--border-strong);
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.16s ease;
      text-decoration: none;
    }
    .btn:hover {
      border-color: var(--primary);
      background: var(--primary-soft);
      transform: translateY(-1px);
    }
    .btn-primary {
      background: #2563eb;
      border-color: #2563eb;
      color: #fff;
    }
    .btn-primary:hover { background: #1d4ed8; border-color: #1d4ed8; color: #fff; }
    .btn-success {
      background: #059669;
      border-color: #059669;
      color: #fff;
    }
    .btn-success:hover { background: #047857; border-color: #047857; color: #fff; }
    .btn-lg {
      padding: 13px 22px;
      font-size: 0.98rem;
      font-weight: 700;
      border-radius: 14px;
    }
    .btn-soft {
      background: var(--surface-soft);
      border-color: transparent;
      color: var(--text-body);
    }
    .btn-soft:hover {
      background: var(--surface);
      border-color: var(--border-strong);
    }

    /* Page Containers */
    .wrap-home {
      max-width: 1020px;
      margin: 0 auto;
      padding: 28px 20px 80px;
    }
    .wrap-focus {
      max-width: 740px;
      margin: 0 auto;
      padding: 24px 18px 90px;
    }

    /* ========================================
       HOME: CLEAN START CARD + INTERACTIVE SUBJECT CARDS
       ======================================== */
    .hero {
      background: linear-gradient(135deg, #2563eb 0%, #0891b2 100%);
      color: #fff;
      border-radius: 24px;
      padding: 28px 32px;
      margin-bottom: 30px;
      box-shadow: 0 14px 32px rgba(37, 99, 235, 0.22);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    .hero h1 { font-size: 1.7rem; font-weight: 800; margin-bottom: 6px; }
    .hero p { font-size: 0.98rem; opacity: 0.93; margin-bottom: 18px; max-width: 540px; }
    .hero-btn {
      background: #fff;
      color: #1d4ed8;
      border: none;
      padding: 13px 24px;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
      transition: transform 0.16s ease;
    }
    .hero-btn:hover { transform: translateY(-2px); }
    .hero-ring {
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 18px;
      padding: 16px 24px;
      text-align: center;
      min-width: 170px;
    }
    .hero-ring-num { font-size: 1.9rem; font-weight: 900; line-height: 1.1; }
    .hero-ring-sub { font-size: 0.78rem; opacity: 0.9; }

    .group-label {
      font-size: 1.1rem;
      font-weight: 800;
      margin: 24px 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .group-label span.sub { font-size: 0.84rem; font-weight: 500; color: var(--text-muted); }

    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    @media (max-width: 820px) { .grid-3 { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 600px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }

    .subject-card {
      background: var(--surface);
      color: var(--text);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 22px;
      cursor: pointer;
      text-align: left;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .subject-card:hover {
      transform: translateY(-4px);
      border-color: var(--primary);
      box-shadow: var(--shadow-card);
    }
    .subject-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .emoji-box {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: var(--surface-soft);
      display: grid;
      place-items: center;
      font-size: 1.55rem;
    }
    .pill-tag {
      font-size: 0.72rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 999px;
      text-transform: uppercase;
    }
    .pill-urgent { background: var(--danger-soft); color: var(--danger); }
    .pill-core { background: var(--success-soft); color: var(--success); }
    .pill-extra { background: var(--warning-soft); color: var(--warning); }

    .subject-card h3 { font-size: 1.14rem; font-weight: 800; }
    .subject-card p { font-size: 0.87rem; color: var(--text-muted); flex: 1; }
    .prog-track { height: 7px; background: var(--surface-soft); border-radius: 999px; overflow: hidden; margin-top: 6px; }
    .prog-fill { height: 100%; background: var(--success); border-radius: 999px; transition: width 0.3s ease; }

    /* ========================================
       COURSE SCREEN: EXPANDABLE UNIT CARDS
       ======================================== */
    .unit-accordion {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }
    .unit-acc-header {
      width: 100%;
      background: none;
      border: none;
      padding: 20px 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      text-align: left;
      color: var(--text);
    }
    .unit-acc-header:hover { background: var(--surface-soft); }
    .unit-acc-body {
      padding: 0 20px 20px;
      border-top: 1px solid var(--border);
      padding-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .card-tile {
      width: 100%;
      background: var(--surface-soft);
      color: var(--text);
      border: 1.5px solid transparent;
      border-radius: 15px;
      padding: 15px 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      text-align: left;
      transition: all 0.16s ease;
    }
    .card-tile:hover {
      background: var(--surface);
      border-color: var(--primary);
      transform: translateX(3px);
      box-shadow: var(--shadow-sm);
    }
    .tile-left { display: flex; align-items: center; gap: 14px; }
    .tile-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
      border: 1.5px solid var(--border-strong);
      display: grid;
      place-items: center;
      font-size: 1.05rem;
      font-weight: 800;
      flex-shrink: 0;
    }
    .tile-icon.done { background: #059669; border-color: #059669; color: #fff; }
    .tile-title { font-weight: 700; font-size: 0.96rem; color: var(--text); display: block; }
    .tile-sub { font-size: 0.8rem; color: var(--text-muted); display: block; }

    /* ========================================
       FOCUSED SINGLE-TASK CARD PLAYER
       (1 Task Only: READ | WATCH | CHECK | SOLVE)
       ======================================== */
    .mode-pills {
      display: flex;
      gap: 8px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      padding: 6px;
      border-radius: 16px;
      margin-bottom: 18px;
      box-shadow: var(--shadow-sm);
    }
    .mode-pill {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 11px 10px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.16s ease;
    }
    .mode-pill.active {
      background: #2563eb;
      color: #fff;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    }

    .focus-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 24px;
      padding: 32px 34px;
      box-shadow: var(--shadow-card);
    }
    @media (max-width: 600px) {
      .focus-card { padding: 22px 18px; }
    }
    .card-kicker {
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--primary);
      margin-bottom: 8px;
      display: block;
    }
    .card-heading {
      font-size: 1.48rem;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 18px;
    }
    .big-idea {
      background: var(--primary-soft);
      border-left: 4px solid var(--primary);
      padding: 14px 18px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 22px;
    }
    .prose p {
      font-size: 1.08rem;
      line-height: 1.85;
      color: var(--text-body);
      margin-bottom: 18px;
    }
    .takeaway {
      background: var(--success-soft);
      border: 1.5px solid var(--success);
      border-radius: 14px;
      padding: 14px 18px;
      margin: 20px 0 8px;
      font-size: 0.96rem;
    }

    /* Quick Bonus Cards Strip (Opens a clean Pop-Up Card!) */
    .bonus-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 18px;
    }

    /* Video Theater Card */
    .video-stage {
      margin-bottom: 18px;
    }
    .yt-poster {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      background-size: cover;
      background-position: center;
      border: 1.5px solid var(--border);
    }
    .yt-poster-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.36);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background 0.16s ease;
    }
    .yt-poster:hover .yt-poster-overlay { background: rgba(15, 23, 42, 0.18); }
    .yt-play-circle {
      background: #dc2626;
      color: #fff;
      font-weight: 800;
      font-size: 1.05rem;
      padding: 14px 26px;
      border-radius: 999px;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.38);
    }
    .yt-iframe-wrap {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      height: 0;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
    }
    .yt-iframe-wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* Quick Check Options */
    .qc-choice {
      width: 100%;
      text-align: left;
      background: var(--surface-soft);
      border: 2px solid transparent;
      color: var(--text);
      padding: 15px 18px;
      border-radius: 14px;
      margin-top: 10px;
      cursor: pointer;
      font-size: 0.98rem;
      font-weight: 500;
      transition: all 0.15s ease;
    }
    .qc-choice:hover { border-color: var(--primary); background: var(--surface); }
    .qc-choice.correct {
      background: var(--success-soft);
      border-color: var(--success);
      color: var(--success);
      font-weight: 700;
    }
    .qc-choice.wrong {
      background: var(--danger-soft);
      border-color: var(--danger);
      color: var(--danger);
    }
    .qc-result {
      margin-top: 14px;
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 0.95rem;
    }
    .qc-result.ok { background: var(--success-soft); color: var(--success); }
    .qc-result.err { background: var(--danger-soft); color: var(--danger); }

    /* Stepper Dots (Question Solver & Bloom's) */
    .step-dots {
      display: flex;
      gap: 6px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .step-dot {
      flex: 1;
      min-width: 82px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      color: var(--text-muted);
      padding: 9px 6px;
      border-radius: 12px;
      font-size: 0.82rem;
      font-weight: 700;
      text-align: center;
      cursor: pointer;
    }
    .step-dot.active { background: #2563eb; border-color: #2563eb; color: #fff; }
    .step-dot.done { background: var(--success-soft); border-color: var(--success); color: var(--success); }

    .work-area {
      width: 100%;
      min-height: 130px;
      background: var(--surface-soft);
      color: var(--text);
      border: 2px solid var(--border-strong);
      border-radius: 14px;
      padding: 15px 18px;
      font-family: inherit;
      font-size: 1rem;
      line-height: 1.65;
      resize: vertical;
      margin: 12px 0;
    }
    .work-area::placeholder { color: var(--text-muted); opacity: 1; }
    .work-area:focus { outline: none; border-color: var(--primary); background: var(--surface); }

    .check-tile {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      background: var(--surface-soft);
      color: var(--text);
      border: 1.5px solid var(--border);
      padding: 14px 16px;
      border-radius: 14px;
      margin-bottom: 10px;
      cursor: pointer;
      font-size: 0.96rem;
    }
    .check-tile input {
      width: 22px;
      height: 22px;
      margin-top: 2px;
      accent-color: var(--success);
      flex-shrink: 0;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 28px;
      padding-top: 18px;
      border-top: 1.5px solid var(--border);
      gap: 12px;
      flex-wrap: wrap;
    }

    /* Clean Pop-Up Card Modal (For Diagrams, Cheat Sheets, Hints, Study Tools!) */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.58);
      backdrop-filter: blur(4px);
      z-index: 300;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }
    .modal-backdrop.open { display: flex; }
    .modal-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 24px;
      max-width: 680px;
      width: 100%;
      max-height: 86vh;
      overflow-y: auto;
      padding: 26px 28px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.3);
      animation: sheetSlide 0.2s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .modal-head h3 { font-size: 1.15rem; font-weight: 800; }

    .info-box {
      background: var(--surface-soft);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 12px;
      font-size: 0.94rem;
      white-space: pre-line;
    }
    .big-idea {
      background: var(--primary-soft);
      color: var(--text);
      border-left: 4px solid var(--primary);
      padding: 14px 18px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 22px;
    }
    .takeaway {
      background: var(--success-soft);
      color: var(--text);
      border: 1.5px solid var(--success);
      border-radius: 14px;
      padding: 14px 18px;
      margin: 20px 0 8px;
      font-size: 0.96rem;
    }
    .comp-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; color: var(--text); }
    .comp-table th, .comp-table td { border: 1px solid var(--border-strong); padding: 10px; text-align: left; color: var(--text); }
    .comp-table th { background: var(--surface-soft); color: var(--text); }
    .audio-btn {
      width: 100%;
      text-align: left;
      background: var(--primary-soft);
      border: 1.5px solid var(--primary);
      color: var(--text);
      padding: 11px 14px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.94rem;
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .topic-svg { width: 100%; height: auto; border-radius: 12px; display: block; }
    .comp-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    .comp-table th, .comp-table td { border: 1px solid var(--border-strong); padding: 10px; text-align: left; }
    .comp-table th { background: var(--surface-soft); }
    .inline-code {
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      background: var(--surface-soft);
      border: 1px solid var(--border);
      padding: 1px 6px;
      border-radius: 6px;
      font-size: 0.92em;
      font-weight: 700;
      color: var(--primary);
    }

    .meter-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: -4px;
      margin-bottom: 12px;
      padding: 8px 12px;
      background: var(--surface-soft);
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    .meter-good { color: var(--success); font-weight: 700; }
    .meter-warn { color: var(--warning); font-weight: 700; }
    .badge-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }
    .skill-badge {
      background: var(--surface-soft);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 12px;

  <script>
    const COURSES = [{"id": "french", "code": "Core French 8 (Ontario FSL)", "name": "Core French", "friendlySub": "Être Past Tense, Imparfait, Futur Simple & Pronouns", "teacher": "Grade 8 FSL", "status": "Priority Mastery", "tier": "Tier 1: Priority Focus", "tierClass": "tier-urgent", "icon": "🗣️", "reportComment": "Grade 8 Core French builds directly on Grade 7 decoding and AVOIR past tense by adding ÊTRE past tense (DR MRS VANDERTRAMP), Imparfait storytelling, Futur Simple, Direct Object Pronouns (le/la/les), and multi-paragraph French opinions.", "nextSteps": ["Memorize the 17 DR MRS VANDERTRAMP verbs that take ÊTRE in the Passé Composé + gender/plural agreement", "Distinguish Passé Composé (completed event) from Imparfait (background description / used to)", "Master Futur Simple endings (-ai, -as, -a, -ons, -ez, -ont) and Direct Object Pronouns (le/la/les)", "Use transition connectors (cependant, de plus, en conclusion) in Grade 8 French writing"], "units": [{"id": "g8-fr-u1", "title": "Unit 1: Passé Composé with ÊTRE (DR MRS VANDERTRAMP) & Agreement", "studyFirstTag": "Master the 17 motion verbs + reflexive past tense agreement rules", "curriculumStrand": "Ontario Grade 8 Core French: Writing Conventions (D2) & Oral Past Narration (B1)", "svgDiagram": "g8_french_past_svg", "lessons": [{"id": "g8-fr-u1-l1", "title": "Lesson 1.1: AVOIR vs. ÊTRE in the Passé Composé (DR MRS VANDERTRAMP)", "readTime": "3 min read", "bigIdea": "While 90% of French verbs use AVOIR in the past tense, 17 'House of Être' motion/change verbs (plus ALL reflexive verbs) use ÊTRE—and their past participle must agree with the subject!", "paragraphs": ["In Grade 7, you learned `Passé Composé` with AVOIR (`J'ai joué`, `J'ai fini`). In Grade 8, you unlock the second half of the past tense: **17 special motion and life-change verbs** that use **ÊTRE** (`je suis, tu es, il/elle est, nous sommes, vous êtes, ils/elles sont`) as their helper verb! Students remember all 17 with the acronym **DR MRS VANDERTRAMP**: *Devenir, Revenir, Monter, Rester, Sortir, Venir, Aller, Naître, Descendre, Entrer, Rentrer, Tomber, Retourner, Arriver, Mourir, Partir* (plus *Passer par*).", "Here is the #1 Grade 8 grammar rule to watch: whenever you use **ÊTRE**, the past participle acts like a chameleon adjective and MUST match the subject! Add `-e` for feminine (`Elle est allée au gymnase`), `-s` for masculine plural (`Nous sommes allés`), and `-es` for feminine plural (`Elles sont parties`).", "Every **reflexive verb** (`se réveiller, se lever, s'amuser`) ALSO uses ÊTRE in the past! Example: `Hier, je me suis réveillé à sept heures et nous nous sommes amusés au gymnase!` Notice how the reflexive pronoun (`me / te / se / nous / vous`) stays glued right in front of `ÊTRE`."], "keyTakeaway": "DR MRS VANDERTRAMP + ALL reflexive verbs take ÊTRE in Passé Composé, and the past participle agrees (+e, +s, +es) with the subject!", "deepReadTitle": "🏠 Complete DR MRS VANDERTRAMP & Irregular Participles", "deepReadText": "• Devenir → devenu | Revenir → revenu | Venir → venu | Naître → né | Mourir → mort\n• Aller → allé | Arriver → arrivé | Entrer → entré | Rester → resté | Tomber → tombé\n• Partir → parti | Sortir → sorti | Descendre → descendu | Monter → monté\n• Agreement Example: Zaid est arrivé (m.s.) | Sarah est arrivée (f.s.) | Les amis sont arrivés (m.p.) | Les filles sont arrivées (f.p.)", "quickCheck": {"question": "How do you correctly write 'Marie went to the library and my friends left early' in Passé Composé?", "options": ["Marie a allé à la bibliothèque et mes amis ont parti tôt.", "Marie est allée à la bibliothèque et mes amis sont partis tôt.", "Marie est allé à la bibliothèque et mes amis sont parti tôt."], "correctIdx": 1, "explanation": "Both 'aller' and 'partir' are DR MRS VANDERTRAMP verbs! They take ÊTRE + agreement: 'Marie est allée' (+e) and 'mes amis sont partis' (+s)!"}, "videos": [{"id": "R7CMGVsanu8", "title": "Être or Avoir in the Passé Composé in French", "channel": "Learn French With Alexa", "why": "Crystal-clear rules on when to pick ÊTRE vs. AVOIR."}, {"id": "p7iiqxYB2JI", "title": "Passé Composé with Être Under 5 Minutes", "channel": "Learn French With Alexa", "why": "Fast visual recap of DR MRS VANDERTRAMP + agreement endings."}]}], "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Recall the 17 House of Être Verbs & 5 Irregular Participles", "content": "Memorize the DR MRS VANDERTRAMP motion pairs (go/come, arrive/leave, enter/exit, go up/go down):", "keyPoints": ["Opposites Trick: aller ↔ venir | arriver ↔ partir | entrer ↔ sortir | monter ↔ descendre | naître ↔ mourir | rester ↔ tomber.", "5 Irregular Participles to drill: venir→venu, devenir→devenu, revenir→revenu, naître→né, mourir→mort."], "frenchAudioSamples": ["Hier soir, je suis allé au gymnase et je suis rentré à huit heures.", "Ma sœur est partie tôt et mes amis sont arrivés à l'école."]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Explain Why ÊTRE Past Participles Agree Like Adjectives", "content": "With ÊTRE, the subject itself moves or changes state—so the participle describes the subject just like an adjective (`Elle est grande` → `Elle est arrivée`).", "analogy": "🏀 Team Jersey Analogy: Just like teammates wear matching uniforms, any verb partnered with ÊTRE makes its past participle wear the exact same gender/plural badge (+e, +s, +es) as the subject!", "keyPoints": ["With AVOIR (`Elle a mangé`), the subject does an action to an object—so NO agreement with the subject!"]}, {"level": 3, "name": "APPLY", "subtitle": "Build Past Tense Reflexive & Motion Sentences", "content": "Follow the 3-step ÊTRE checklist:", "workedExample": {"prompt": "Translate: 'Yesterday morning, I woke up at 7:00, went to school, and my friends arrived late.'", "steps": ["Step 1 (se réveiller = reflexive → ÊTRE): `Hier matin, je me suis réveillé à sept heures.`", "Step 2 (aller = DR MRS VANDERTRAMP → ÊTRE): `Je suis allé à l'école.`", "Step 3 (arriver + plural subject 'mes amis' → add -s!): `et mes amis sont arrivés en retard.`"]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare AVOIR vs. ÊTRE Past Tense Side-by-Side", "content": "Never mix up helper verbs again:", "comparisonTable": {"headers": ["Feature", "AVOIR Passé Composé", "ÊTRE Passé Composé"], "rows": [["Which Verbs?", "90% of verbs (jouer, finir, faire, manger, étudier)", "17 DR MRS VANDERTRAMP + ALL reflexives (se lever)"], ["Helper Verb", "ai, as, a, avons, avez, ont", "suis, es, est, sommes, êtes, sont"], ["Subject Agreement?", "NO! (Elle a joué — never +e)", "YES! (Elle est allée +e | Ils sont partis +s)"], ["Negation Placement", "Je n'ai pas joué", "Je ne suis pas allé / Je ne me suis pas levé"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Debug 3 Classic Grade 8 Passé Composé Traps", "content": "Spot the errors before submitting to your French teacher:", "keyPoints": ["❌ « J'ai allé au parc et ma sœur est parti. »", "🔧 Trap 1: 'aller' NEVER takes AVOIR → `Je suis allé`.", "🔧 Trap 2: 'ma sœur' is feminine → add `-e`: `ma sœur est partie`."]}, {"level": 6, "name": "CREATE", "subtitle": "Write a 4-Sentence Past Weekend Journal Mixing AVOIR & ÊTRE", "content": "Combine at least 2 ÊTRE verbs (e.g., `aller, sortir, rentrer, se réveiller`) and 2 AVOIR verbs (`jouer, manger, étudier`) with exact agreement.", "keyPoints": ["Model: « Samedi, je me suis réveillé à huit heures. Je suis allé au tournoi de basketball avec mes amis. Nous avons gagné deux matchs et nous sommes rentrés très contents! »"]}], "questions": [{"id": "g8-fr-q1", "bloomLevel": 5, "bloomTag": "APPLY & EVALUATE", "title": "DR MRS VANDERTRAMP & Reflexive Past Tense Builder", "prompt": "Write a 3-part French recap of a busy school tournament day using Passé Composé:\n(a) Morning routine using `se réveiller` (reflexive) and `partir` (ÊTRE) with `Je`.\n(b) Arrival & game using `arriver` (ÊTRE, subject = `Mes amis et moi / Nous`) and `jouer` (AVOIR).\n(c) Return home with a feminine subject (`Ma sœur`) using `rentrer` (ÊTRE) and `ne...pas sortir` (negative ÊTRE!).", "step1_deconstruct": {"instruction": "Check helper verb (AVOIR vs. ÊTRE) AND subject gender/plurality for every single verb!", "guidingQuestions": ["Which 4 verbs in this prompt require ÊTRE?", "Which verb takes AVOIR (no subject agreement)?", "Where do `ne` and `pas` go in `Ma sœur n'est pas sortie`?"], "modelPlan": "(a) Je me suis réveillé + je suis parti. (b) Nous sommes arrivés (+s) + nous avons joué (AVOIR). (c) Ma sœur est rentrée (+e) + elle n'est pas sortie (+e)."}, "step2_anchor": {"instruction": "Verify ÊTRE conjugations and negation around the helper verb:", "referenceItems": ["ÊTRE: je suis | nous sommes | elle est", "Agreement: masculine plural = +s (arrivés), feminine singular = +e (rentrée, sortie)", "Negation in Passé Composé wraps ONLY around the helper verb: `elle n'est pas sortie`!"]}, "step3_substeps": [{"label": "Step 3a: Part (a) — Morning routine with `se réveiller` & `partir` (Je)", "placeholder": "Hier matin, je me suis réveillé à... et je suis parti...", "hint": "Use `je me suis réveillé` and `je suis parti pour l'école`.", "modelSubAnswer": "« Hier matin, je me suis réveillé à sept heures et je suis parti rapidement pour l'école. »"}, {"label": "Step 3b: Part (b) — Team arrival (`Nous + arriver`) & game (`Nous + jouer`)", "placeholder": "Nous sommes arrivés au gymnase et nous avons joué...", "hint": "Remember `+s` on `arrivés` (ÊTRE), but NO `-s` on `joué` (AVOIR)!", "modelSubAnswer": "« Nous sommes arrivés au gymnase à neuf heures et nous avons joué un match intense de basketball. »"}, {"label": "Step 3c: Part (c) — Feminine subject (`Ma sœur`) with `rentrer` & negative `sortir`", "placeholder": "Après les cours, ma sœur est rentrée... mais elle n'est pas...", "hint": "Both `rentrée` and `sortie` need feminine `-e`!", "modelSubAnswer": "« Après les cours, ma sœur est rentrée à la maison fatiguée, donc elle n'est pas sortie le soir. »"}], "step4_checks": ["Did I use `je me suis réveillé` (reflexive pronoun before suis)?", "Did I add `-s` to `Nous sommes arrivés` and NO `-s` to `nous avons joué`?", "Did I add feminine `-e` to BOTH `rentrée` and `sortie`, with `n'...pas` around `est`?"], "step5_modelAnswer": {"basicAnswer": "Je me suis réveillé. Nous sommes arrivés. Ma sœur est rentrée.", "expandedAnswer": "Grade 8+ Model Paragraph:\n« Hier matin, je me suis réveillé à sept heures et je suis parti tôt pour le tournoi. Mes amis et moi, nous sommes arrivés au gymnase à neuf heures et nous avons joué un match fantastique de basketball. Après l'école, ma sœur est rentrée directement à la maison et elle n'est pas sortie parce qu'elle a étudié pour son test de sciences! »", "extensionPrompt": "Extension: Rewrite Part (c) with plural feminine subject `Mes amies` (`sont rentrées`, `ne sont pas sorties`)."}}]}, {"id": "g8-fr-u2", "title": "Unit 2: L'Imparfait vs. Passé Composé (Storytelling in the Past)", "studyFirstTag": "Describe childhood memories, weather & background scenes vs. sudden actions", "curriculumStrand": "Ontario Grade 8 Core French: Narrative Past Tenses (B1, C1, D2)", "svgDiagram": "g8_french_past_svg", "lessons": [{"id": "g8-fr-u2-l1", "title": "Lesson 2.1: Forming L'Imparfait (The 'NOUS' Stem Secret) & When to Use It", "readTime": "3 min read", "bigIdea": "To form L'Imparfait ('used to' / 'was doing'), take the present NOUS form of almost ANY verb, chop off `-ons`, and add `-ais, -ais, -ait, -ions, -iez, -aient`!", "paragraphs": ["Grade 8 storytelling needs TWO past tenses working together like a movie camera. **L'Imparfait** sets the background scenery, weather, feelings, age, and repeated childhood habits ('I *used to* play soccer every Saturday', 'It *was* snowing'). **Passé Composé** is the sudden action camera that interrupts the scene ('Suddenly, I *scored* a goal!').", "Good news: L'Imparfait is the **most regular tense in French**! Take the present-tense `nous` form (e.g., `nous jouons`, `nous finissons`, `nous faisons`, `nous avons`), drop `-ons` to get the stem (`jou-`, `finiss-`, `fais-`, `av-`), and add the 6 endings: `Je -ais`, `Tu -ais`, `Il/Elle -ait`, `Nous -ions`, `Vous -iez`, `Ils/Elles -aient`.", "There is literally ONLY ONE irregular stem in the entire French language for L'Imparfait: **ÊTRE → ét-** (`j'étais, tu étais, il/elle était, nous étions, vous étiez, ils/elles étaient`). Example: `Quand j'étais petit, il faisait froid à Ottawa et je jouais au hockey chaque hiver!`"], "keyTakeaway": "NOUS form minus `-ons` + `-ais, -ais, -ait, -ions, -iez, -aient` (only irregular stem: `être → ét-`). Use Imparfait for habits/background, Passé Composé for sudden completed actions!", "deepReadTitle": "🎬 Movie Scene Rule: Imparfait vs. Passé Composé Clue Words", "deepReadText": "• Imparfait Clues (Habit/Scene): toujours (always), souvent (often), chaque samedi (every Saturday), quand j'étais jeune (when I was young), il faisait beau (weather).\n• Passé Composé Clues (Specific Action): hier (yesterday), tout à coup / soudain (suddenly), une fois (once), à huit heures (at 8:00).\n• Movie Combo: « Je marchais (Imparfait — background) à l'école quand tout à coup j'ai vu (PC — interruption!) mon ami! »", "quickCheck": {"question": "Which sentence properly pairs Imparfait (background scene) with Passé Composé (sudden action)?", "options": ["Il a fait beau quand soudain la pluie tombait.", "Il faisait beau et je jouais au soccer quand soudain il a commencé à pleuvoir.", "Il faisait beau et j'ai joué chaque samedi quand j'ai été petit."], "correctIdx": 1, "explanation": "Weather ('il faisait beau') and ongoing play ('je jouais') use Imparfait, while the sudden interruption ('soudain il a commencé') uses Passé Composé!"}, "videos": [{"id": "JK5OMjjAc8A", "title": "French Imperfect Tense VS Passé Composé Tense", "channel": "Learn French With Alexa", "why": "Clearly compares background/habitual Imparfait with completed Passé Composé."}, {"id": "yMSHdUyMvQg", "title": "Practise Your French Imparfait Verbs", "channel": "Learn French With Alexa", "why": "Step-by-step practice locking in the -ais/-ait/-ions/-aient endings."}]}], "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Recall Imparfait Endings & The Only Irregular Stem (`ét-`)", "content": "Drill the universal Imparfait endings:", "keyPoints": ["Je -ais | Tu -ais | Il/Elle -ait | Nous -ions | Vous -iez | Ils/Elles -aient.", "Only irregular stem: ÊTRE → j'étais, nous étions, ils étaient."], "frenchAudioSamples": ["Quand j'étais jeune, je jouais souvent au soccer avec mes amis.", "Il faisait très froid à Ottawa quand nous sommes arrivés au parc."]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Explain the Movie-Scene Analogy for Past Tenses", "content": "Think of Imparfait as the stage lighting and ongoing music, and Passé Composé as the single spotlight event.", "analogy": "🎭 Stage Play Analogy: Imparfait paints the set ('It was raining, the crowd was cheering') while Passé Composé delivers the plot action ('Zaid stepped up and hit the winning shot!').", "keyPoints": ["Ask yourself: 'Was it ongoing/repeated (Imparfait) or a 1-time completed action (Passé Composé)?'"]}, {"level": 3, "name": "APPLY", "subtitle": "Derive Imparfait Stems from Tricky Verbs (`finir, faire, avoir, aller`)", "content": "Always start from present `nous`:", "workedExample": {"prompt": "Find the `Je` and `Nous` Imparfait forms of `finir`, `faire`, and `être`:", "steps": ["`finir`: nous finissons → stem `finiss-` → `je finissais`, `nous finissions`.", "`faire`: nous faisons → stem `fais-` → `je faisais`, `nous faisions`.", "`être` (only exception!): stem `ét-` → `j'étais`, `nous étions`."]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Contrast Imparfait vs. Passé Composé Decision Matrix", "content": "Use this quick audit table before every Grade 8 quiz:", "comparisonTable": {"headers": ["Situation", "Tense Needed", "French Example"], "rows": [["Habit ('used to')", "Imparfait", "Chaque été, nous allions au lac."], ["Weather / Time / Age / Feelings", "Imparfait", "Il avait douze ans et il était content."], ["1-Time Completed Event", "Passé Composé", "Hier, j'ai fini mon projet de sciences."], ["Sudden Interruption (`quand soudain`)", "Imparfait + Passé Composé", "Je dormais quand le téléphone a sonné!"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Fix Misused Past Tenses in a Draft Story", "content": "Audit this Grade 8 paragraph:", "keyPoints": ["❌ « Quand j'ai été petit, j'ai aimé beaucoup le basketball, et hier je gagnais le match. »", "✅ Fixed: « Quand j'étais petit (age/state = Imp), j'aimais beaucoup le basketball (habit = Imp), et hier j'ai gagné le match (1-time event = PC)! »"]}, {"level": 6, "name": "CREATE", "subtitle": "Compose a 4-Sentence Childhood Memory + Sudden Surprise", "content": "Describe a regular habit you used to have plus one specific memorable day.", "keyPoints": ["Use 2 Imparfait verbs (`quand j'étais...`, `je faisais...`) + 2 Passé Composé verbs (`un jour, j'ai...`)."]}], "questions": [{"id": "g8-fr-q2", "bloomLevel": 5, "bloomTag": "ANALYZE & CREATE", "title": "Past-Tense Movie Director: Blending Imparfait & Passé Composé", "prompt": "Write a 3-part French mini-story combining Imparfait and Passé Composé accurately:\n(a) Set the childhood habit (`Quand j'étais en septième année...`) using `être` and `jouer` or `étudier` in the Imparfait.\n(b) Set the weather and ongoing background action (`Il faisait... et nous marchions / jouions...`) in the Imparfait.\n(c) Deliver the sudden interrupting event (`quand tout à coup...`) using Passé Composé!", "step1_deconstruct": {"instruction": "Tag each part as Background/Habit (Imparfait) or Interruption/Event (Passé Composé).", "guidingQuestions": ["What is the Imparfait stem of `être`?", "Which endings match `Je` (`-ais`), `Il` (`-ait`), and `Nous` (`-ions`)?", "Does my interruption verb in (c) take AVOIR or ÊTRE?"], "modelPlan": "(a) j'étais + je jouais (Imparfait). (b) Il faisait beau + nous jouions (Imparfait). (c) tout à coup, j'ai marqué / il a commencé à neiger (Passé Composé)."}, "step2_anchor": {"instruction": "Check stems and clue words:", "referenceItems": ["Imparfait endings: -ais, -ais, -ait, -ions, -iez, -aient (`être` → `ét-`)", "Interruption signal: `quand tout à coup` / `soudain` → switch to Passé Composé!"]}, "step3_substeps": [{"label": "Step 3a: Part (a) — Childhood / Grade 7 habit in Imparfait", "placeholder": "Quand j'étais en septième année, je jouais souvent...", "hint": "Use `Quand j'étais...`, `j'aimais...` or `je jouais...`!", "modelSubAnswer": "« Quand j'étais en septième année, je jouais souvent au basketball dans le gymnase et je pratiquais le trombone chaque semaine. »"}, {"label": "Step 3b: Part (b) — Set the weather & ongoing scene in Imparfait", "placeholder": "Un samedi après-midi, il faisait... et mes amis et moi, nous...", "hint": "Use `il faisait froid/beau` + `nous jouions` (`-ions`!).", "modelSubAnswer": "« Un samedi après-midi, il faisait beau et mes amis et moi, nous jouions calmement dans le parc près de l'école. »"}, {"label": "Step 3c: Part (c) — The sudden interruption in Passé Composé", "placeholder": "Quand tout à coup...", "hint": "Use Passé Composé right after `quand tout à coup` (e.g., `il a commencé à pleuvoir` or `nous avons entendu`).", "modelSubAnswer": "« ...quand tout à coup, le ciel est devenu gris, il a commencé à pleuvoir fort et nous sommes courus à l'abri! »"}], "step4_checks": ["Did I use `j'étais` (Imparfait of être) for background state?", "Did I use `-ions` with `nous` in the Imparfait (`nous jouions`)?", "Did I switch cleanly to Passé Composé after `quand tout à coup`?"], "step5_modelAnswer": {"basicAnswer": "Quand j'étais jeune, je jouais. Il faisait beau quand il a plu.", "expandedAnswer": "Grade 8+ Story Exemplar:\n« Quand j'étais en septième année, je jouais souvent au basketball avec mes amis et je pratiquais mon trombone chaque soir. Un samedi, il faisait très beau et nous faisions un match amical au parc quand tout à coup un orage a éclaté! Nous avons ramassé nos sacs rapidement et nous sommes rentrés en riant! »", "extensionPrompt": "Extension: Add one negative Imparfait sentence (`Nous n'avions pas de parapluie!`)."}}]}, {"id": "g8-fr-u3", "title": "Unit 3: Le Futur Simple & Direct Object Pronouns (le, la, l', les)", "studyFirstTag": "Talk about high school dreams ('I will...') and stop repeating nouns!", "curriculumStrand": "Ontario Grade 8 Core French: Future Communication & Pronouns (B1, D2)", "svgDiagram": "g8_french_past_svg", "lessons": [{"id": "g8-fr-u3-l1", "title": "Lesson 3.1: Le Futur Simple ('Will Do') — Regular & Big 4 Irregular Stems", "readTime": "3 min read", "bigIdea": "To form Le Futur Simple ('I will play', 'We will succeed'), keep the FULL infinitive ending in `-r` and glue on the AVOIR endings: `-ai, -as, -a, -ons, -ez, -ont`!", "paragraphs": ["In Grade 7, you used *Futur Proche* (`Je vais étudier` = I am going to study). In Grade 8, you level up to **Le Futur Simple** (`J'étudierai` = I **will** study), which sounds sharper and is used for big future plans, high school goals, and weather forecasts.", "For regular `-ER` and `-IR` verbs, do NOT chop the ending—use the entire verb as your stem! `parler` → `je parlerai, tu parleras, il parlera, nous parlerons, vous parlerez, ils parleront`. For `-RE` verbs (like `prendre` or `répondre`), drop only the final silent `-e` so the stem ends in `-r` (`je répondrai`, `nous prendrons`).", "Memorize the **Big 5 Irregular Future Stems** (notice EVERY future stem in French ends in the letter **R**!): `être → ser-` (`je serai`), `avoir → aur-` (`j'aurai`), `aller → ir-` (`j'irai`), `faire → fer-` (`je ferai`), `pouvoir → pourr-` (`je pourrai`). Example: `L'année prochaine, j'irai en neuvième année et je ferai beaucoup de progrès!`"], "keyTakeaway": "Future Stem (always ends in `-r`!) + `-ai, -as, -a, -ons, -ez, -ont`. Big 4 Irregulars: `ser-` (être), `aur-` (avoir), `ir-` (aller), `fer-` (faire).", "deepReadTitle": "🚀 High School Goal Sentences in Futur Simple", "deepReadText": "• L'année prochaine, je serai en neuvième année! (Next year, I will be in Grade 9!)\n• J'irai à l'école secondaire et j'aurai de nouveaux cours. (I will go to high school and will have new classes.)\n• Nous réussirons en mathématiques et en sciences! (We will succeed in math and science!)", "quickCheck": {"question": "How do you say 'Next year, I will go to Grade 9 and I will be ready' in Le Futur Simple?", "options": ["L'année prochaine, j'allerai en 9e année et j'êtrai prêt.", "L'année prochaine, j'irai en 9e année et je serai prêt.", "L'année prochaine, je vais aller en 9e année et j'étais prêt."], "correctIdx": 1, "explanation": "'aller' uses irregular stem `ir-` (`j'irai`) and 'être' uses irregular stem `ser-` (`je serai`)!"}, "videos": [{"id": "2cYZfyeySVA", "title": "French Made Easy: Le Futur Simple", "channel": "Learn French With Alexa", "why": "Fast, memorable guide to Futur Simple endings and irregular stems."}, {"id": "6HDCdU3yJtk", "title": "The Future Tense in French: Futur Proche or Futur Simple?", "channel": "Learn French With Alexa", "why": "Clarifies when to use each future form in Grade 8 writing."}]}, {"id": "g8-fr-u3-l2", "title": "Lesson 3.2: Direct Object Pronouns (le, la, l', les) — Stop Repeating Nouns!", "readTime": "3 min read", "bigIdea": "Instead of repeating a noun twice ('I love math. I study math.'), replace it with `le` (him/it-m), `la` (her/it-f), `l'` (before a vowel), or `les` (them)—placed RIGHT BEFORE the verb!", "paragraphs": ["In English, object pronouns come AFTER the verb: 'I see **it**', 'I read **them**'. In French, Direct Object Pronouns (COD) jump **IN FRONT OF THE VERB**! So `Je regarde le film` becomes `Je le regarde` (literally 'I it watch').", "Match the pronoun to the noun it replaces: masculine singular (`le livre` → `le`), feminine singular (`la musique` → `la`), either gender before a vowel/silent h (`j'aime le sport` → `je l'aime`), and any plural (`les devoirs` → `les`, e.g., `Je les finis`).", "Watch out for two-verb sentences (like `Je vais finir mes devoirs`): the pronoun slides right BEFORE the infinitive verb it belongs to → `Je vais les finir!` In Passé Composé, it goes before the helper verb: `Je l'ai fini!` (And fun bonus: when `la`/`les` comes BEFORE `avoir`, the participle agrees: `Je les ai finis!`)"], "keyTakeaway": "Replace direct object nouns with `le / la / l' / les` and place them RIGHT BEFORE the verb (`Je les finis` / `Je vais les finir`).", "deepReadTitle": "🔁 Pronoun Placement Cheat Sheet", "deepReadText": "• Present: « Tu fais le projet? » → « Oui, je le fais! »\n• Negative Present: « Tu oublies tes devoirs? » → « Non, je ne les oublie jamais! »\n• Futur Proche (2 verbs): « Tu vas lire la lettre? » → « Oui, je vais la lire! »", "quickCheck": {"question": "How do you answer « Est-ce que tu finis tes devoirs? » using a Direct Object Pronoun?", "options": ["Oui, je finis les!", "Oui, je les finis!", "Oui, je la finis!"], "correctIdx": 1, "explanation": "'tes devoirs' is plural → use `les`, and place it RIGHT BEFORE the conjugated verb: `Oui, je les finis!`"}, "videos": [{"id": "2aFGlzmmVu4", "title": "How to Use Direct Object Pronouns in French", "channel": "Learn French With Alexa", "why": "Shows exact placement of le, la, l', and les in present and two-verb sentences."}]}, {"id": "g8-fr-u3-l3", "title": "Lesson 3.3: Indirect Object Pronouns (`lui / leur`) & Comparatives (`plus...que`)", "readTime": "3 min read", "bigIdea": "Use **`lui`** ('to him/her') and **`leur`** ('to them') whenever a verb uses **`à + person`** (`parler à`, `donner à`, `téléphoner à`), and compare anything with **`plus / moins / aussi + adj + que`**!", "paragraphs": ["You already mastered Direct Object Pronouns (`le, la, l', les` — NO preposition!). Now add **Indirect Object Pronouns (COI)** for verbs followed by **`à + PERSON`** (`parler à`, `répondre à`, `écrire à`, `donner à`, `téléphoner à`): replace `à + 1 person` (male OR female!) with **`lui`**, and `à + 2+ people` with **`leur`**—placed RIGHT BEFORE the verb! Example: « Tu parles **à ton ami**? » → « Oui, je **lui** parle! » | « Tu écris **à tes amis**? » → « Oui, je **leur** écris! »", "Also upgrade Grade 8 descriptions using **Comparatives & Superlatives**:\n• **More ... than:** `plus + adj + que` (`Ottawa est **plus froid que** Vancouver.`)\n• **Less ... than:** `moins + adj + que` (`Le test était **moins difficile que** prévu.`)\n• **As ... as:** `aussi + adj + que` (`Le soccer est **aussi intense que** le basketball.`)", "Watch the 1 famous irregular comparative (just like English *good → better*, never *more good*!): `bon` becomes **`meilleur / meilleure`** (`Ce livre est **meilleur que** le film!`), and *the best* is **`le meilleur / la meilleure`**!"], "keyTakeaway": "`à + 1 person` → **`lui`** | `à + 2+ people` → **`leur`** (BEFORE verb!). Compare with `plus/moins/aussi + adj + que` (watch **`bon → meilleur`**, NEVER `plus bon`!).", "deepReadTitle": "🗣️ Indirect (`lui/leur`) vs. Direct (`le/la/les`) Trap Check", "deepReadText": "• Direct (no `à`): `Je vois mon ami` → `Je le vois` | `Je vois mes amis` → `Je les vois`\n• Indirect (`à + person`): `Je téléphone à ma sœur` → `Je lui téléphone!` | `Je parle à mes amis` → `Je leur parle!`\n• Superlative: `le/la/les plus + adj` (`Le mont Logan est **la plus haute** montagne du Canada!`)", "quickCheck": {"question": "How do you answer « Est-ce que tu téléphones **à tes grands-parents**? » AND say 'Basketball is **better than** golf'?", "options": ["Oui, je les téléphone! Le basketball est plus bon que le golf.", "Oui, je leur téléphone! Le basketball est meilleur que le golf.", "Oui, je lui téléphone! Le basketball est aussi bon que le golf."], "correctIdx": 1, "explanation": "`téléphoner à` + plural people (`tes grands-parents`) takes **`leur`** (`je leur téléphone`), and `bon` NEVER takes `plus bon` → **`meilleur que`**!"}, "videos": [{"id": "NxlzQgvPfvs", "title": "Direct and Indirect Object Pronouns in French (Lui / Leur)", "channel": "Learn French With Alexa", "why": "Contrasts le/la/les cleanly against lui/leur."}, {"id": "Mj15n078_XM", "title": "Practise French Comparatives (Plus que, Moins que, Meilleur)", "channel": "Learn French With Alexa", "why": "Drills exact adjective agreement and meilleur(e) in Grade 8 comparisons."}]}], "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Recall Future Endings & Direct Object Pronouns", "content": "Lock in these two high-scoring Grade 8 structures:", "keyPoints": ["Futur Simple: -ai, -as, -a, -ons, -ez, -ont | Stems: ser- (être), aur- (avoir), ir- (aller), fer- (faire), pourr- (pouvoir).", "COD Pronouns: le (m.s.), la (f.s.), l' (vowel), les (plural) → ALWAYS go BEFORE the verb!"], "frenchAudioSamples": ["L'année prochaine, j'irai en neuvième année et je ferai de mon mieux!", "Mes devoirs? Je les finis toujours avant le dîner!"]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Explain Word Order Difference Between English & French Pronouns", "content": "English puts 'it/them' after the verb; French pulls `le/la/l'/les` in front of the verb like a magnet.", "analogy": "🧲 Magnet Analogy: The French verb acts like a magnet that pulls `le/la/les` right in front of its face (`Je le vois`, NOT `Je vois le`).", "keyPoints": ["In `Je vais le voir`, the magnet is `voir` (the action happening to `le`), so `le` sticks directly before `voir`."]}, {"level": 3, "name": "APPLY", "subtitle": "Rewrite Repetitive Sentences Using Pronouns & Futur Simple", "content": "Practice making French sound smooth and natural:", "workedExample": {"prompt": "Answer using a COD pronoun + Futur Simple: « Est-ce que tu étudieras la géographie demain? »", "steps": ["Step 1: Identify object = `la géographie` (feminine singular → `la`, but `étudierai` starts with a vowel so `la` → `l'`!).", "Step 2: Place `l'` before `étudierai`: « Oui, je l'étudierai demain! »", "Step 3: Check spelling: `étudier` + `-ai` = `étudierai`."]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Futur Proche vs. Futur Simple", "content": "Know when each future tense shines:", "comparisonTable": {"headers": ["Tense", "Formula", "Tone & Use", "Example"], "rows": [["Futur Proche", "ALLER + infinitive", "Immediate plans ('going to')", "Ce soir, je vais étudier."], ["Futur Simple", "Infinitive/R-stem + -ai/-as/-a...", "Long-term goals, predictions ('will')", "En 9e année, je réussirai!"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Spot Pronoun & Stem Errors", "content": "Fix these common Grade 8 test mistakes:", "keyPoints": ["❌ « J'allerai au gymnase et je regarderai le. »", "✅ Fix: Irregular stem `ir-` (`j'irai`) + pronoun BEFORE verb (`je le regarderai`)!"]}, {"level": 6, "name": "CREATE", "subtitle": "Write 3 Grade 9 Predictions Using Futur Simple & Pronouns", "content": "Predict your Grade 9 classes, sports, and study habits.", "keyPoints": ["Use `je serai`, `j'irai`, `je ferai` + at least one `le/la/les` pronoun!"]}], "questions": [{"id": "g8-fr-q3", "bloomLevel": 5, "bloomTag": "APPLY & CREATE", "title": "Grade 9 Vision Plan (Futur Simple + Direct Object Pronouns)", "prompt": "Answer these 3 Grade 8 French exam tasks:\n(a) Write 2 sentences about your Grade 9 plans using irregular Futur Simple stems (`être → ser-`, `aller → ir-`, or `faire → fer-`).\n(b) Rewrite BOTH sentences replacing the underlined object with `le, la, l',` or `les`:\n    1. « Je finis mes projets de sciences à temps. »\n    2. « Je vais pratiquer la musique demain. »\n(c) Answer negatively using a COD pronoun: « Est-ce que tu oublieras ton dictionnaire? »", "step1_deconstruct": {"instruction": "Check irregular future stems in (a), pronoun gender/placement in (b), and negative pronoun sandwich in (c)!", "guidingQuestions": ["What are the irregular future stems of `aller`, `être`, `faire`?", "In `Je vais pratiquer la musique`, where does `la` go?", "In `Non, je ne l'oublierai pas`, where does `l'` sit inside `ne...pas`?"], "modelPlan": "(a) J'irai en 9e année et je serai prêt / je ferai du sport. (b1) Je les finis à temps. (b2) Je vais la pratiquer demain. (c) Non, je ne l'oublierai pas!"}, "step2_anchor": {"instruction": "Check pronoun placement rules:", "referenceItems": ["1 verb: `Je les finis` | Negative 1 verb: `Je ne l'oublierai pas` (pronoun stays glued to verb INSIDE `ne...pas`!)", "2 verbs: `Je vais la pratiquer` (pronoun right before the infinitive!)"]}, "step3_substeps": [{"label": "Step 3a: Part (a) — 2 Grade 9 future sentences (irregular Futur Simple)", "placeholder": "L'année prochaine, j'irai... et je ferai...", "hint": "Use `j'irai`, `je serai`, `j'aurai`, or `je ferai`!", "modelSubAnswer": "« L'année prochaine, j'irai en neuvième année à Longfields-Davidson Heights et je ferai beaucoup d'efforts en français et en mathématiques! »"}, {"label": "Step 3b: Part (b) — Rewrite both sentences with `les` and `la`", "placeholder": "1. Je ... finis à temps.\n2. Je vais ... pratiquer demain.", "hint": "1. `mes projets` = plural (`les`) before `finis`. 2. `la musique` = fem. sing. (`la`) before `pratiquer`.", "modelSubAnswer": "1. « Je les finis à temps. »\n2. « Je vais la pratiquer demain. »"}, {"label": "Step 3c: Part (c) — Negative Futur Simple answer with `l'` (`ton dictionnaire`)", "placeholder": "Non, je ne l'... jamais!", "hint": "`ton dictionnaire` → `le`, which shortens to `l'` before `oublierai`!", "modelSubAnswer": "« Non, je ne l'oublierai jamais! »"}], "step4_checks": ["Did I use true irregular future stems (`ir-, ser-, fer-, aur-`) instead of `allerai`?", "Did I place `les` BEFORE `finis` and `la` BEFORE `pratiquer`?", "Did I put `l'` INSIDE the `ne...pas/jamais` sandwich right before `oublierai`?"], "step5_modelAnswer": {"basicAnswer": "J'irai en 9e année. Je les finis. Non, je ne l'oublierai pas.", "expandedAnswer": "Grade 8+ Model Answers:\n(a) « L'année prochaine, j'irai en neuvième année, je serai organisé et je ferai partie d'une équipe sportive! »\n(b) 1. « Je les finis à temps. » | 2. « Je vais la pratiquer demain. »\n(c) « Non, je ne l'oublierai jamais parce qu'il m'aide beaucoup! »", "extensionPrompt": "Speaking Bonus: Say « Je ne l'oublierai jamais! » smoothly aloud 3 times."}}]}, {"id": "g8-fr-u4", "title": "Unit 4: French Opinion Essays, Connectors & Authentic Media Reading", "studyFirstTag": "Build high-scoring Grade 8 paragraphs with transition words and clear reasons", "curriculumStrand": "Ontario Grade 8 Core French: Reading (C1) & Persuasive Writing (D1)", "svgDiagram": "g8_french_past_svg", "lessons": [{"id": "g8-fr-u4-l1", "title": "Lesson 4.1: Upgrading Basic Sentences into Grade 8 Opinion Paragraphs", "readTime": "3 min read", "bigIdea": "The fastest way to jump from Level 2 to Level 4 in Grade 8 French writing is linking your ideas with transition words: `D'abord` (First), `De plus` (Furthermore), `Cependant` (However), and `En conclusion` (In conclusion).", "paragraphs": ["By Grade 8, teachers look for connected paragraphs rather than disconnected 4-word sentences. Instead of writing `J'aime le sport. Le sport est bon.`, open with an opinion phrase like **À mon avis** (In my opinion) or **Je pense que** (I think that), then structure your points with clear French connectors.", "Use the **4-Connector Ladder**: **D'abord** (First) introduces your #1 reason, **De plus / Aussi** (Furthermore / Also) adds a second concrete detail, **Cependant / Mais** (However / But) shows mature thinking by acknowledging a challenge, and **Donc / En conclusion** (Therefore / In conclusion) wraps up your point.", "When reading authentic French articles or school announcements in Grade 8, scan for these exact connectors too! Whenever you spot `cependant` or `pourtant`, the author is about to flip to the opposite side of an argument—a classic comprehension quiz question!"], "keyTakeaway": "Structure French opinion paragraphs with `À mon avis` → `D'abord` → `De plus` → `Cependant` → `En conclusion`.", "deepReadTitle": "🔗 Grade 8 French Connector Toolkit", "deepReadText": "• Opinion: À mon avis (In my opinion) | Je crois que (I believe that) | Il est important de... (It is important to...)\n• Adding: D'abord (First) | Ensuite (Next) | De plus (Furthermore) | Par exemple (For example)\n• Contrasting: Cependant (However) | Malgré (Despite) | D'un autre côté (On the other hand)\n• Concluding: Donc (Therefore) | C'est pourquoi (That is why) | En conclusion (In conclusion)", "quickCheck": {"question": "If a French article states: « Les téléphones sont utiles en classe; cependant, ils causent souvent des distractions. » what does `cependant` signal?", "options": ["The author is giving a second positive benefit of phones.", "The author is introducing a contrasting drawback ('however').", "The author is ending the article with a date."], "correctIdx": 1, "explanation": "`cependant` means 'however'—it signals a shift from a benefit (useful) to a drawback (distractions)!"}, "videos": [{"id": "eifFrlspHlk", "title": "Understand Direct Object Pronouns & Flowing Sentences in French", "channel": "Learn French With Alexa", "why": "Helps connect ideas naturally without choppy noun repetition."}]}], "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Recall the 4-Step Opinion Connector Ladder", "content": "Memorize these 4 paragraph glue words:", "keyPoints": ["D'abord (First) → De plus (Furthermore) → Cependant (However) → En conclusion (In conclusion).", "Opinion openers: À mon avis, Je pense que, Selon moi."], "frenchAudioSamples": ["À mon avis, les sports scolaires sont essentiels pour la santé.", "Cependant, il faut aussi équilibrer le temps d'étude et le temps d'écran."]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Explain How `Cependant` Elevates Persuasive Thinking", "content": "Adding one balanced counterclaim (`Cependant...`) shows Level 4 critical thinking in both French and English.", "analogy": "⚖️ Balance Scale Analogy: Showing both sides with `cependant` proves you thought deeply before choosing your conclusion!", "keyPoints": ["Use `cependant` followed by `donc` ('therefore') to swing back to your main solution."]}, {"level": 3, "name": "APPLY", "subtitle": "Connect 3 Short Ideas into One Flowing Paragraph", "content": "Apply the connector ladder to a real school topic:", "workedExample": {"prompt": "Combine: Phones help research + They distract students + Clear classroom rules help.", "steps": ["Start: `À mon avis, la technologie peut aider les élèves à l'école.`", "Add + Contrast: `D'abord, elle permet de faire des recherches rapides. Cependant, les téléphones causent parfois des distractions.`", "Conclude: `En conclusion, il faut établir des règles claires en classe.`"]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Analyze Basic vs. Grade 8+ French Paragraph Structure", "content": "See the jump from Level 2 to Level 4:", "comparisonTable": {"headers": ["Element", "Level 2 Draft", "Level 4 Grade 8 Paragraph"], "rows": [["Opener", "J'aime le gymnase.", "À mon avis, l'éducation physique est indispensable."], ["Connectors", "None (choppy list)", "D'abord... De plus... Cependant... En conclusion..."], ["Tenses Used", "Present only", "Mixes Present + Futur Simple or Passé Composé!"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Audit an Opinion Paragraph for Missing Connectors & Agreement", "content": "Check every French draft with the 3-point checklist:", "keyPoints": ["1. At least 3 connectors? 2. Verb endings match `je/nous/ils`? 3. Noun-adjective agreement (`les règles claires`, `les activités sportives`)?"]}, {"level": 6, "name": "CREATE", "subtitle": "Draft an Authentic French School Opinion Letter", "content": "Write 4–5 connected French sentences proposing one improvement for your school.", "keyPoints": ["Include `À mon avis`, `D'abord`, `De plus`, `Cependant`, and `En conclusion`."]}], "questions": [{"id": "g8-fr-q4", "bloomLevel": 6, "bloomTag": "EVALUATE & CREATE", "title": "Grade 8 French Opinion Paragraph Builder (School Tech or Sports)", "prompt": "Read this short French notice: « Notre école propose d'ajouter 30 minutes d'activités sportives ou de clubs de musique après les cours. Cependant, certains élèves ont beaucoup de devoirs le soir. »\n\nComplete in 3 steps:\n(a) Decode the notice in English—what is the proposal AND what is the concern after `cependant`?\n(b) Write your opinion in French using `À mon avis...`, `D'abord...`, and `De plus...`.\n(c) Add a balanced `Cependant...` sentence and wrap up with `En conclusion...` using a Futur Simple verb (`aidera / réussirons`)!", "step1_deconstruct": {"instruction": "Split the prompt into English reading comprehension (a) and French opinion writing (b & c).", "guidingQuestions": ["What does `ajouter 30 minutes` mean?", "What concern follows `cependant`?", "Which 4 French connectors must appear in Parts (b) and (c)?"], "modelPlan": "(a) Proposal = add 30 mins of after-school sports/music clubs; Concern = some students have lots of homework at night. (b) À mon avis + D'abord + De plus. (c) Cependant + En conclusion + Futur Simple."}, "step2_anchor": {"instruction": "Connector & vocab bank:", "referenceItems": ["À mon avis = In my opinion | D'abord = First | De plus = Furthermore | Cependant = However | En conclusion = In conclusion", "Futur Simple: `cela aidera` (that will help) | `nous réussirons` (we will succeed)"]}, "step3_substeps": [{"label": "Step 3a: Decode the notice in English (Proposal + Concern)", "placeholder": "Proposal: The school proposes to...\nConcern (after cependant): However...", "hint": "`ajouter` = to add; `beaucoup de devoirs` = a lot of homework.", "modelSubAnswer": "Proposal: The school proposes adding 30 minutes of after-school sports activities or music clubs. Concern: However, some students have a lot of homework in the evening."}, {"label": "Step 3b: Write your French opinion + 2 reasons (`À mon avis`, `D'abord`, `De plus`)", "placeholder": "À mon avis, c'est une excellente idée. D'abord, ... De plus, ...", "hint": "Mention health (`la santé`), teamwork (`le travail d'équipe`), or trombone/music!", "modelSubAnswer": "« À mon avis, c'est une excellente idée! D'abord, les activités sportives améliorent notre santé physique. De plus, les clubs de musique encouragent la créativité et l'esprit d'équipe. »"}, {"label": "Step 3c: Add `Cependant` + `En conclusion` with a Futur Simple verb", "placeholder": "Cependant, il faut organiser... En conclusion, ce programme aidera...", "hint": "Use `nous réussirons` or `cela aidera les élèves`!", "modelSubAnswer": "« Cependant, il faut bien gérer son temps pour finir ses devoirs. En conclusion, ce nouveau programme aidera tous les élèves et nous réussirons encore mieux à l'école! »"}], "step4_checks": ["Did I identify BOTH the proposal and the `cependant` concern in Step 3a?", "Did I include `À mon avis`, `D'abord`, `De plus`, `Cependant`, and `En conclusion`?", "Did I include a properly conjugated Futur Simple verb (`aidera` / `réussirons`)?"], "step5_modelAnswer": {"basicAnswer": "The school wants 30 mins of sports. J'aime le sport. C'est bien.", "expandedAnswer": "Part (a): The school proposes adding 30 minutes of after-school sports or music clubs, though some students worry about evening homework.\n\nParts (b)–(c) Grade 8+ French Paragraph:\n« À mon avis, ce projet est une excellente idée! D'abord, le sport après les cours réduit le stress et renforce la santé. De plus, les clubs de musique permettent de collaborer avec nos camarades. Cependant, il est important d'organiser son horaire pour terminer ses devoirs. En conclusion, ce programme motivera les élèves et nous réussirons mieux en classe! »", "extensionPrompt": "Speaking Bonus: Tap `🔊 Listen` or read your finished French paragraph aloud with confident pacing!"}}]}]}, {"id": "geo", "code": "Geography 8 (Nelson GEO 8)", "name": "Geography", "friendlySub": "Settlement, Population Density, Urbanization, HDI & Pyramids", "teacher": "Grade 8 Geography", "status": "Priority Mastery", "tier": "Tier 1: Priority Focus", "tierClass": "tier-urgent", "icon": "🗺️", "reportComment": "Complete Ontario Grade 8 Geography (Nelson GEO 8 Strands A & B): Global Settlement Patterns & Sustainability (Population Density, Urbanization, Smart Cities) and Global Inequalities (HDI, Population Pyramids, Economic Sectors, Fair Trade & UN SDGs).", "nextSteps": ["Always show the full formula and units for Population Density (people / km²)", "Distinguish Linear, Scattered, and Clustered settlement patterns and explain WHY people settle there (Site vs. Situation)", "Interpret Population Pyramids (Expansive, Stationary, Constrictive) and connect them to HDI", "Complete every sub-part (a, b, c) with specific geographic evidence!"], "units": [{"id": "g8-geo-u1", "title": "Unit 1 (Strand A): Settlement Patterns, Site vs. Situation & Population Density", "studyFirstTag": "Why people live where they do + exact Population Density math!", "curriculumStrand": "Ontario Grade 8 Geography Strand A: Global Settlement Patterns & Sustainability", "svgDiagram": "g8_geo_pop_svg", "lessons": [{"id": "g8-geo-u1-l1", "title": "Lesson 1.1: Linear, Scattered & Clustered Settlements + Site vs. Situation", "readTime": "3 min read", "bigIdea": "Humans never spread out evenly across Earth—we arrange ourselves in **Linear**, **Scattered**, or **Clustered** patterns driven by water, flat land, fertile soil, and transportation routes!", "paragraphs": ["Geographers classify human settlements into three core patterns. **Linear** settlements stretch in a narrow line along a river, highway, or coastline (like historic Quebec seigneuries along the St. Lawrence River). **Scattered** settlements are spread far apart in rural areas where each family needs large tracts of land for farming or forestry (like Saskatchewan wheat farms). **Clustered (Nucleated)** settlements pack tightly together around a crossroads, harbour, mine, or city core (like downtown Ottawa or Toronto).", "To explain *why* a city grew in a specific spot, geographers separate **Site** from **Situation**. **Site** means the physical features right under your feet: flat land, fresh drinking water, fertile soil, or a natural harbour. **Situation** means a city's location *relative* to other places and trade routes—for example, Ottawa's site sits at the meeting point of the Ottawa, Gatineau, and Rideau Rivers, while its situation positioned it safely inland along the Rideau Canal between Montreal and Kingston!", "Remember the difference between **Population Distribution** (WHERE people live on a map—shown by dot maps) and **Population Density** (HOW CROWDED an area is—calculated as `Population ÷ Land Area = people/km²`). Canada has a tiny overall density (~4 people/km²), yet over 80% of Canadians live clustered in cities near the southern border!"], "keyTakeaway": "`Population Density = Total Population ÷ Land Area (km²)`. Never confuse **Distribution** (where people are) with **Density** (how crowded per km²).", "deepReadTitle": "📊 Density Categories (Ontario Grade 8 Benchmarks)", "deepReadText": "• Sparse Density: < 15 people/km² (e.g., Nunavut, Northern Ontario Boreal Shield)\n• Moderate Density: 15–150 people/km² (e.g., rural Southern Ontario, France)\n• Dense Density: > 150 people/km² (e.g., Singapore ~8,000/km², Toronto ~4,400/km²)\n• Formula Check: Always write units `people/km²`!", "quickCheck": {"question": "A town of 45,000 people covers a land area of 150 km². What is its Population Density and category?", "options": ["30 people/km² (Moderate)", "300 people/km² (Dense)", "6,750,000 people/km² (Dense)"], "correctIdx": 1, "explanation": "`Density = 45,000 ÷ 150 = 300 people/km²`. Because 300 > 150, it is classified as **Dense**!"}, "videos": [{"id": "aoK8LYG23y8", "title": "Settlement Patterns — Linear, Scattered & Nucleated", "channel": "Super Simple Sheets", "why": "Direct match for Nelson GEO 8 Strand A settlement patterns."}, {"id": "HkYEbJfxQyI", "title": "Population Distribution and Density Explained", "channel": "Heimler's History", "why": "Clarifies why overall country density can hide crowded urban clusters."}]}], "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Recall the 3 Settlement Patterns & Density Formula", "content": "Memorize these Strand A foundations:", "keyPoints": ["Patterns: Linear (along rivers/roads) • Scattered (far apart on farms) • Clustered/Nucleated (grouped around a hub).", "Formula: `Population Density = Population ÷ Area (km²)` — Sparse (<15), Moderate (15–150), Dense (>150)."]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Explain Why Canada's Density Number Can Mislead People", "content": "Averages smooth out giant empty northern regions with packed southern cities.", "analogy": "🏫 Cafeteria Analogy: If 30 students sit at 1 lunch table while 9 tables stay empty, the average is '3 per table'—even though that 1 table is jam-packed! Canada is just like that.", "keyPoints": ["Always pair a country's density with a **distribution map** to see where people actually live."]}, {"level": 3, "name": "APPLY", "subtitle": "Calculate & Classify Density Step-by-Step", "content": "Show formula, substitution, and units:", "workedExample": {"prompt": "Ottawa has ~1,020,000 people across ~2,790 km². Find its population density.", "steps": ["Step 1 (Formula): `Density = Population ÷ Area`", "Step 2 (Substitute): `1,020,000 ÷ 2,790 ≈ 365.6`", "Step 3 (Units & Category): `366 people/km²` → Dense (>150 people/km²)!"]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Site vs. Situation Factors", "content": "Distinguish local physical features from regional connections:", "comparisonTable": {"headers": ["Factor", "Definition", "Ottawa Example", "Coastal Port Example"], "rows": [["Site", "Physical land/water on the spot", "Ottawa/Rideau Rivers + flat valley", "Deep ice-free harbour (Halifax)"], ["Situation", "Links to other cities & trade", "Between Montreal & Toronto; capital", "Gateway to Atlantic shipping lanes"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Evaluate Choropleth Map Errors", "content": "Check why a colour-shaded (choropleth) map can hide details:", "keyPoints": ["Choropleth maps colour an entire province one shade—so Ontario looks moderately populated overall even though 90%+ live in Southern Ontario!"]}, {"level": 6, "name": "CREATE", "subtitle": "Design an Ideal Settlement Site & Justify Its Pattern", "content": "Choose a river-valley crossroads and explain its site advantages, situation links, and clustered layout.", "keyPoints": ["Cite fresh water, flood protection, fertile alluvial soil, and rail/highway connections."]}], "questions": [{"id": "g8-geo-q1", "bloomLevel": 4, "bloomTag": "APPLY & ANALYZE", "title": "Nelson GEO 8 Lab: Population Density & Settlement Pattern Audit", "prompt": "Compare two fictional Canadian regions:\n• **Riverbend Valley**: Population = 24,000 | Land Area = 60 km² (homes built tightly along both banks of a narrow mountain river).\n• **Prairie Ridge**: Population = 18,000 | Land Area = 2,000 km² (large wheat farms spaced kilometres apart).\n\n(a) Calculate the exact Population Density (`people/km²`) for BOTH regions and classify each (Sparse/Moderate/Dense).\n(b) Identify the settlement pattern of EACH region (Linear, Scattered, or Clustered) and explain WHY.\n(c) Explain one Site factor AND one Situation factor that would make Riverbend Valley grow faster over the next 20 years.", "step1_deconstruct": {"instruction": "Identify 3 distinct deliverables: (a) 2 density calculations + categories, (b) 2 patterns + reasons, (c) 1 Site + 1 Situation factor.", "guidingQuestions": ["Which number goes on top in `Population ÷ Area`?", "What units must follow every density answer?", "How is Site different from Situation?"], "modelPlan": "(a) Riverbend = 24,000÷60 = 400 people/km² (Dense); Prairie Ridge = 18,000÷2,000 = 9 people/km² (Sparse). (b) Riverbend = Linear (narrow river valley); Prairie Ridge = Scattered (large farms). (c) Site = fresh water/flat floodplain; Situation = highway/rail link to a major port."}, "step2_anchor": {"instruction": "Formulas & thresholds:", "referenceItems": ["`Population Density = Population ÷ Area (km²)`", "Sparse: <15 | Moderate: 15–150 | Dense: >150 people/km²", "Site = physical spot itself | Situation = connection to surrounding cities/markets"]}, "step3_substeps": [{"label": "Step 3a: Calculate Density + Category for BOTH Riverbend Valley & Prairie Ridge", "placeholder": "Riverbend: 24,000 ÷ 60 = ... people/km² (...)\nPrairie Ridge: 18,000 ÷ 2,000 = ... people/km² (...)", "hint": "24,000 ÷ 60 = 400; 18,000 ÷ 2,000 = 9. Don't forget `people/km²`!", "modelSubAnswer": "• Riverbend Valley: `24,000 ÷ 60 = 400 people/km²` → **Dense** (>150).\n• Prairie Ridge: `18,000 ÷ 2,000 = 9 people/km²` → **Sparse** (<15)."}, {"label": "Step 3b: Name & justify the settlement pattern for EACH region", "placeholder": "Riverbend Valley has a ... pattern because...\nPrairie Ridge has a ... pattern because...", "hint": "Narrow river banks = Linear; spaced-out wheat farms = Scattered!", "modelSubAnswer": "• **Riverbend Valley = Linear pattern** because steep valley walls force homes and roads into a narrow strip along the river.\n• **Prairie Ridge = Scattered pattern** because mechanized wheat farms require vast acreage, spacing families kilometres apart."}, {"label": "Step 3c: Explain 1 Site factor AND 1 Situation factor driving Riverbend's growth", "placeholder": "Site factor: ...\nSituation factor: ...", "hint": "Site = fresh water / hydro power / fertile valley soil. Situation = bridge/highway connecting nearby cities.", "modelSubAnswer": "• **Site factor:** Reliable fresh water from the river for drinking, farming, and small hydro-electric power.\n• **Situation factor:** If a highway or rail corridor connects Riverbend to a major port city, factories and commuters will move there for fast trade access."}], "step4_checks": ["Did I divide `Population ÷ Area` (NOT Area ÷ Population) and include `people/km²`?", "Did I classify BOTH regions (Dense vs. Sparse) AND identify BOTH patterns?", "Did I clearly distinguish physical **Site** from regional **Situation** in Step 3c?"], "step5_modelAnswer": {"basicAnswer": "Riverbend is 400 and linear. Prairie is 9 and scattered.", "expandedAnswer": "Part (a): Riverbend Valley = `24,000 ÷ 60 = 400 people/km²` (Dense). Prairie Ridge = `18,000 ÷ 2,000 = 9 people/km²` (Sparse).\nPart (b): Riverbend follows a **Linear** pattern squeezed along the river banks; Prairie Ridge forms a **Scattered** pattern because large wheat farms separate neighbours by kilometres.\nPart (c): **Site** advantages include fresh water, fertile alluvial soil, and hydro potential; **Situation** advantages include being linked by highway/rail to larger regional markets and employment hubs.", "extensionPrompt": "Extension: What natural hazard risk does Riverbend's linear floodplain site face as climate change increases extreme rainfall?"}}]}, {"id": "g8-geo-u2", "title": "Unit 2 (Strand A): Urbanization, Megacities & Sustainable Smart Cities", "studyFirstTag": "Why over half the world lives in cities—and how to stop urban sprawl!", "curriculumStrand": "Ontario Grade 8 Geography Strand A: Urbanization & Sustainable Land Use", "svgDiagram": "g8_geo_pop_svg", "lessons": [{"id": "g8-geo-u2-l1", "title": "Lesson 2.1: Push/Pull Factors, Urban Sprawl & Sustainable Smart Growth", "readTime": "3 min read", "bigIdea": "Over 56% of humans now live in cities—creating **megacities** (10+ million people) and forcing planners to choose between wasteful **urban sprawl** and compact **Smart Growth**!", "paragraphs": ["**Urbanization** is the shift of people from rural farms into cities. It is driven by **Push Factors** (problems pushing people away from rural areas: drought, lack of jobs, few high schools/hospitals) and **Pull Factors** (opportunities pulling people into cities: university education, diverse careers, transit, entertainment). Cities over 10 million residents—like Tokyo, Delhi, Cairo, and São Paulo—are called **megacities**.", "In North America, cheap cars caused **Urban Sprawl**: low-density suburbs spreading outward over prime farmland and wetlands. Sprawl creates three headaches: long car commutes (more greenhouse gases), expensive roads/water pipes, and permanent loss of Class 1 farmland (like the Greater Golden Horseshoe around Toronto!).", "Ontario fights sprawl using **Smart Growth** and **Greenbelts** (protected rings of forest and farmland, just like the **Ottawa Greenbelt** surrounding Nepean!). Sustainable cities build **mixed-use transit hubs** (apartments above shops right beside LRT train stations), bike lanes, green roofs, and urban parks so residents walk or ride transit instead of driving everywhere."], "keyTakeaway": "Push factors drive people out of rural areas; Pull factors draw them to cities. Fight **urban sprawl** with **Smart Growth**: transit (LRT), greenbelts, mixed-use density, and protected farmland!", "deepReadTitle": "🏙️ 6 Major Urban Land Uses (Nelson GEO 8)", "deepReadText": "1. Residential (~40% — homes/apartments) | 2. Transportation (~30% — roads, LRT, parking)\n3. Institutional (schools, hospitals, city hall) | 4. Open Space / Parks (Ottawa Greenbelt!)\n5. Industrial (factories, warehouses) | 6. Commercial (malls, grocery stores, offices)", "quickCheck": {"question": "Which urban planning strategy BEST reduces greenhouse gases AND protects Ottawa's farmland?", "options": ["Building single-family houses with huge lawns 40 km outside the city.", "Building mixed-use apartments near O-Train LRT stations inside a protected Greenbelt.", "Paving over the Greenbelt to add two wider expressways."], "correctIdx": 1, "explanation": "Mixed-use transit-oriented density inside a protected Greenbelt is the heart of Smart Growth—cutting car emissions and preserving farmland!"}, "videos": [{"id": "ON4oIKza7bw", "title": "Why Are Peopl
