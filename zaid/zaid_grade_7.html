² + 2πrh (h = 10 cm)", "placeholder": "r = 6 ÷ 2 = 3 cm\n2 Circles = 2 × 3.14 × 3² = ...\nCurved Side = 2 × 3.14 × 3 × 10 = ...\nTotal SA = ... cm²", "hint": "2 × 3.14 × 9 = 56.52; 2 × 3.14 × 30 = 188.40. Add them together!", "modelSubAnswer": "• Radius: r = 6 cm ÷ 2 = 3 cm.\n• Top & Bottom Circles: 2 × 3.14 × 3² = 2 × 3.14 × 9 = 56.52 cm².\n• Curved Side Label: 2 × 3.14 × 3 × 10 = 188.40 cm².\n• Total Surface Area = 56.52 + 188.40 = 244.92 cm²."}, {"label": "Step 3c: Part 3 — Find Angles B (Z-pattern) and C (C-pattern) from A = 128°, AND transform point P(−2, 5)", "placeholder": "Angle B (Z-pattern) = ...° | Angle C (C-pattern) = 180° − 128° = ...°\nTranslate P(−2, 5) Right 6, Down 3 → (... , ...)\nReflect across x-axis → (... , ...)", "hint": "−2 + 6 = +4 and 5 − 3 = +2 → (4, 2). Reflecting across the x-axis flips the sign of y!", "modelSubAnswer": "• Parallel Line Angles: Z-pattern Angle B = 128° (alternate angles are equal). C-pattern Angle C = 180° − 128° = 52° (co-interior angles add to 180°).\n• Transformations: Translate P(−2, 5) Right 6, Down 3 → (−2 + 6, 5 − 3) = P'(4, 2). Reflect P'(4, 2) across the x-axis → P''(4, −2)."}], "step4_checks": ["Did I use h = 6 m (NOT slanted 7 m) and divide by 2 in Part 1 (66 m²)?", "Did I divide diameter 6 cm by 2 to get r = 3 cm AND use square units (cm²) in Part 2?", "Did I verify 128° + 52° = 180° AND flip only the y-coordinate when reflecting across the x-axis?"], "step5_modelAnswer": {"basicAnswer": "Part 1: 66 m². Part 2: 244.92 cm². Part 3: B=128°, C=52°; P''(4, −2).", "expandedAnswer": "Complete Spatial Sense Exemplar:\n• Part 1 (Trapezoid): A = (8 + 14) × 6 ÷ 2 = 66 m².\n• Part 2 (Cylinder SA): r = 6 ÷ 2 = 3 cm. SA = 2(3.14)(3²) + 2(3.14)(3)(10) = 56.52 + 188.40 = 244.92 cm².\n• Part 3 (Angles & Grid): Z-pattern Angle B = 128°; C-pattern Angle C = 180° − 128° = 52°. Translating P(−2, 5) by (+6, −3) yields (4, 2), and reflecting across the x-axis flips the y-sign to (4, −2).", "extensionPrompt": "Extension Challenge: What would the Surface Area of that soup can be if the top lid was removed (open-top can)?"}}]}, {"id": "math-u6", "title": "Unit 6 (Nelson Mod. 4 / Khan): Data (Mean/Median/Outliers), Probability & Financial Literacy", "studyFirstTag": "Spot outliers in data, calculate compound probability & master Simple Interest (I = Prt)!", "curriculumStrand": "Ontario 2020 Math Strands D (Data & Probability) & F (Financial Literacy)", "svgDiagram": "math_linear_coding_svg", "lessons": [{"id": "math-u6-l1", "title": "Lesson 6.1: Mean, Median, Mode, Outliers & Compound Probability", "readTime": "3 min read", "bigIdea": "Know which average (Mean vs. Median) tells the honest story when an extreme Outlier appears, and multiply independent probabilities to predict multi-step odds!", "paragraphs": ["Three measures summarize a data set: MEAN (add all numbers and divide by how many), MEDIAN (put numbers IN ORDER from smallest to largest first, then find the exact middle—if two numbers tie in the middle, average them!), and MODE (the number appearing MOST often). Range = Highest − Lowest.", "Now watch out for an OUTLIER—an extreme score way higher or lower than the rest! Suppose Zaid scores 82, 85, 86, 87 on 4 quizzes, and gets a 20 on 1 sick day. That single outlier (20) drags the MEAN way down to 72, while the MEDIAN stays right at 85! That's why Median is far better than Mean whenever a data set has an extreme outlier.", "In PROBABILITY, `P(Event) = (Favourable Outcomes) ÷ (Total Possible Outcomes)`, written as a fraction, decimal, or percent between 0 (impossible) and 1 (certain). For TWO INDEPENDENT EVENTS happening in a row (like flipping Heads on a coin AND rolling a 6 on a die), draw a Tree Diagram or multiply their probabilities: `P(Heads AND 6) = (1/2) × (1/6) = 1/12`!"], "keyTakeaway": "Always SORT data before finding Median! Outliers pull the Mean strongly—use Median instead! Independent Probability: P(A and B) = P(A) × P(B).", "deepReadTitle": "📊 Bias in Surveys (Ontario Strand D)", "deepReadText": "A survey is BIASED if the sample doesn't represent the whole population (e.g., asking ONLY students standing in the gym if the school should cancel music for more gym time!). Always survey a RANDOM, representative sample.", "videos": [{"id": "B1HEzNTGeZ4", "title": "Math Antics — Mean, Median and Mode", "channel": "Math Antics", "why": "Clear visual contrast between Mean, Median, Mode, and sorting data first."}, {"id": "KzfWUEJjG18", "title": "Math Antics — Basic Probability", "channel": "Math Antics", "why": "Explains sample spaces, favourable outcomes, and expressing probability as fractions and percents."}], "quickCheck": {"question": "You flip a fair coin (Heads/Tails) AND spin a 4-colour spinner (Red, Blue, Green, Yellow). What is the probability of getting Tails AND Blue?", "options": ["1/6", "1/8", "2/6"], "correctIdx": 1, "explanation": "Independent events multiply: P(Tails) = 1/2, P(Blue) = 1/4 → (1/2) × (1/4) = 1/8 (12.5%)!"}}, {"id": "math-u6-l2", "title": "Lesson 6.2: Ontario Financial Literacy — Simple Interest (I = Prt) & Foreign Currencies", "readTime": "3 min read", "bigIdea": "Understand how money grows in savings accounts with Simple Interest (`I = P × r × t`) and how Canadian Dollars (CAD) convert to US Dollars or Euros!", "paragraphs": ["In Ontario's 2020 Grade 7 Math Curriculum, Financial Literacy gives you real-world money power! When you deposit money into a savings account (or borrow money), the bank pays (or charges) INTEREST—a percentage fee for using that money over time.", "The SIMPLE INTEREST formula is `I = P × r × t`, where `P` = Principal (starting money in $), `r` = Annual Interest Rate written as a DECIMAL (careful: 4% = 0.04, NOT 0.4!), and `t` = Time in YEARS (if a problem says 6 months, convert to `t = 0.5` years!). Total Amount in the bank = `P + I`!", "When traveling or shopping online from Ottawa, you also convert FOREIGN CURRENCIES using exchange rates! If $1.00 USD = $1.38 CAD, converting $50 USD into Canadian dollars multiplies: `$50 × 1.38 = $69.00 CAD`. Going the reverse way (CAD → USD) divides: `$138 CAD ÷ 1.38 = $100 USD`!"], "keyTakeaway": "Simple Interest: I = P × r × t (r MUST be a decimal like 5% = 0.05; t MUST be in YEARS!) | Total Balance = P + I!", "deepReadTitle": "💰 Simple Interest vs. Compound Interest Sneak Peek", "deepReadText": "• Simple Interest earns interest ONLY on the original Principal every year ($500 at 5% earns $25/yr → $575 after 3 yrs).\n• Compound Interest earns 'interest on top of previous interest'—making savings grow faster (and credit card debt grow dangerously fast if unpaid!).", "videos": [{"id": "aVA4BicW_n8", "title": "Simple Interest Formula (I = Prt) | Grade 7 Math", "channel": "The Magic Of Math", "why": "Walks step-by-step through converting percent rates to decimals and calculating Total Balance = P + I."}], "quickCheck": {"question": "Zaid invests P = $400 at r = 5% simple interest per year for t = 3 years. How much INTEREST (I) does he earn, and what is his TOTAL balance (P + I)?", "options": ["Interest = $600, Total = $1,000", "Interest = $60, Total = $460", "Interest = $20, Total = $420"], "correctIdx": 1, "explanation": "Convert 5% → 0.05! I = 400 × 0.05 × 3 = $60.00 interest. Total Balance = $400 + $60 = $460.00!"}}, {"id": "math-u6-l3", "title": "Lesson 6.3: Circle Graphs (Pie Charts) — Converting Percents to Degrees (`% × 360°`)", "readTime": "3 min read", "bigIdea": "A full circle measures **`360°`**—so to draw or read ANY **Circle Graph (Pie Chart)**, convert each category's percent into a central angle using **`Angle = (Percent ÷ 100) × 360°`**!", "paragraphs": ["In Ontario 2020 Grade 7 Data Literacy (`D1.3`), **Circle Graphs (Pie Charts)** shine whenever you want to compare parts of a **100% whole** (like how Zaid budgets his 24-hour day or how a class voted for gym sports!). Never use a circle graph if percentages don't add to `100%` or if people can vote for two categories!", "To construct a Circle Graph accurately with a protractor, follow the **3-Step Pie Blueprint**:\n1. Find the **Fraction / Percent** of each category (`Category Count ÷ Total`).\n2. Multiply the decimal by **`360°`** to find the exact **Central Angle**! Example: `25%` of a circle = `0.25 × 360° = 90°` (a perfect quarter right angle!); `10%` = `0.10 × 360° = 36°`!\n3. **Double-Check Shield:** Add ALL your central angles together—they MUST total **`360°`** (and all percents MUST total **`100%`**)!", "Reading a Circle Graph in reverse is just as fast: if a class of `40` students shows `35%` chose basketball, multiply `0.35 × 40 = 14 students`!"], "keyTakeaway": "`Central Angle = (Part ÷ Whole) × 360°` (or `Decimal % × 360°`). ALWAYS verify all slices sum to **`100%`** and **`360°`**!", "deepReadTitle": "🥧 Instant Mental Circle-Graph Benchmarks", "deepReadText": "• `50%` = `180°` (half circle)  |  `25%` = `90°` (quarter)  |  `20%` = `72°`\n• `10%` = `36°`  |  `5%` = `18°`  |  `1%` = `3.6°`!", "quickCheck": {"question": "In a Grade 7 survey of `50` students, `15` students voted for Basketball (`30%`). What is the exact **Central Angle** for Basketball on a Circle Graph?", "options": ["30° (forgot to multiply by 360°!)", "108° (`0.30 × 360° = 108°`!)", "54°"], "correctIdx": 1, "explanation": "`15 ÷ 50 = 0.30 (30%)`. Multiply by `360°`: `0.30 × 360° = 108°`!"}, "videos": [{"id": "YjR5b7bhLP8", "title": "Create a Pie Chart / Circle Graph from Percentage Data", "channel": "Wendy Maths", "why": "Step-by-step walkthrough converting percents to exact central angles."}]}], "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Data, Probability & Financial Literacy Formulas", "content": "Essential Strands D & F anchors:", "keyPoints": ["Mean = Sum ÷ Count | Median = Middle of SORTED list | Mode = Most frequent", "Independent Probability: P(A and B) = P(A) × P(B)", "Simple Interest: I = P × r × t (r as decimal, t in years) | Total = P + I"]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Why You Must Convert 6% to 0.06 (Not 0.6) and 6 Months to 0.5 Years", "content": "Two tiny decimal slips are responsible for 90% of Simple Interest errors!", "analogy": "💵 Dimes vs. Pennies Analogy: 6% means 6 cents out of 100 cents = $0.06! Writing 0.6 means 60 cents (60% interest—10× too high!). And since rates are PER YEAR, 6 months is half a year (0.5)!", "keyPoints": ["Always double-check `r` (divide % by 100) and `t` (divide months by 12)."]}, {"level": 3, "name": "APPLY", "subtitle": "Compare Mean vs. Median When an Outlier Strikes", "content": "See how one extreme number changes Mean vs. Median:", "workedExample": {"prompt": "Gym push-up scores: 18, 22, 20, 24, 21, 5 (sorted: 5, 18, 20, 21, 22, 24).", "steps": ["Step 1 (Mean): (5 + 18 + 20 + 21 + 22 + 24) ÷ 6 = 110 ÷ 6 = 18.33 (dragged down by outlier 5!).", "Step 2 (Median — average the two middle numbers 20 and 21): (20 + 21) ÷ 2 = 20.5.", "Step 3 (Best Measure): Median (20.5) represents the student's true typical performance much better!"]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Theoretical vs. Experimental Probability", "content": "Why doesn't flipping a coin 10 times ALWAYS give 5 Heads?", "comparisonTable": {"headers": ["Type", "How It Is Found", "Example (Coin Flip)", "Law of Large Numbers"], "rows": [["Theoretical Probability", "Calculated using math formulas before experimenting", "P(Heads) = 1/2 = 50%", "Exact mathematical expectation"], ["Experimental Probability", "Observed from actual trials: (Successes ÷ Total Trials)", "Got 7 Heads in 10 flips = 70%", "As trials increase (1,000+ flips), Experimental gets closer to Theoretical!"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Catch 3 Strands D & F Careless Traps", "content": "D. Forbes Error Shield:", "keyPoints": ["❌ Finding Median WITHOUT sorting the numbers first!", "❌ Adding independent probabilities (1/2 + 1/6) instead of MULTIPLYING them (1/2 × 1/6 = 1/12)!", "❌ Stopping after calculating Interest (I) when the question asked for TOTAL Balance (P + I)!"]}, {"level": 6, "name": "CREATE", "subtitle": "Build a Personal Grade 7 Savings & Budget Plan", "content": "Calculate how much you save over 2 years by combining monthly allowance deposits with Simple Interest and Canadian currency math.", "keyPoints": ["Real-world Ontario 2020 Financial Literacy capstone!"]}], "questions": [{"id": "math-u6-q1", "bloomLevel": 5, "bloomTag": "APPLY & EVALUATE", "title": "Data, Probability & Ontario Financial Literacy Capstone Lab", "prompt": "Solve all 3 parts showing every step and double-checking decimals:\n• Part 1 (Data & Outliers): Zaid tracks his basketball free-throw scores (out of 20) over 5 gym classes:  14, 16, 15, 17, 3 (he hurt his wrist on day 5!). Calculate BOTH the Mean and the Median, and explain which average better describes his true skill.\n• Part 2 (Compound Independent Probability): A school prize wheel has 5 equal sections (1 Gold, 4 Blue), and you also roll a standard 6-sided die (1–6). What is the theoretical probability (as a simplified fraction AND percent) of spinning Gold AND rolling an EVEN number (2, 4, or 6)?\n• Part 3 (Financial Literacy — Simple Interest + Currency): (i) You deposit $600 into a Canadian savings account earning 4% simple interest per year for 2.5 years. Calculate the Interest earned (`I = Prt`) AND the final Total Balance (`P + I`). (ii) You buy a $40 USD video game online when $1.00 USD = $1.35 CAD. How much does it cost in Canadian Dollars (CAD)?", "step1_deconstruct": {"instruction": "Catch all 3 traps: SORT Part 1 before finding Median, MULTIPLY fractions in Part 2, and convert 4% → 0.04 AND add P + I in Part 3!", "guidingQuestions": ["What is the sorted list in Part 1?", "In Part 2, what is P(Gold) and what is P(Even on a 6-sided die)?", "In Part 3, what is 4% as a decimal (0.04, NOT 0.4!)?"], "modelPlan": "Part 1: Sorted = 3, 14, 15, 16, 17 → Mean = 65÷5 = 13; Median = 15 (Median is better because 3 is an outlier!). Part 2: P(Gold)=1/5, P(Even)=3/6=1/2 → (1/5)×(1/2) = 1/10 = 10%. Part 3: I = 600 × 0.04 × 2.5 = $60 → Total = $660; $40 × 1.35 = $54.00 CAD."}, "step2_anchor": {"instruction": "Strands D & F Formulas:", "referenceItems": ["Mean = Sum ÷ 5 | Median = Middle of SORTED list", "P(Gold AND Even) = P(Gold) × P(Even)", "I = P × r × t (4% = 0.04!) → Total = P + I | USD → CAD: Multiply by 1.35"]}, "step3_substeps": [{"label": "Step 3a: Part 1 — Sort the 5 scores (14, 16, 15, 17, 3), find Mean AND Median, and state which is better", "placeholder": "Sorted: 3, 14, 15, 16, 17\nMean = ... ÷ 5 = ...\nMedian = ...\nBetter measure: ...", "hint": "Sum = 3 + 14 + 15 + 16 + 17 = 65. Which number sits right in the middle?", "modelSubAnswer": "• Sorted Data: 3, 14, 15, 16, 17.\n• Mean = (3 + 14 + 15 + 16 + 17) ÷ 5 = 65 ÷ 5 = 13.\n• Median = 15 (exact 3rd number in the sorted list).\n• Better Measure: The Median (15) is much more accurate because the extreme low outlier (3 from the wrist injury) drags the Mean artificially down below his four healthy days!"}, {"label": "Step 3b: Part 2 — Calculate P(Gold AND Even) as a simplified fraction AND percent", "placeholder": "P(Gold) = 1/5\nP(Even: 2, 4, 6) = 3/6 = 1/2\nP(Gold AND Even) = (1/5) × (1/2) = ... = ...%", "hint": "Multiply straight across: 1/5 × 1/2 = 1/10! What percent is 1/10?", "modelSubAnswer": "• P(Gold) = 1/5\n• P(Even: 2, 4, or 6) = 3/6 = 1/2\n• P(Gold AND Even) = (1/5) × (1/2) = 1/10 = 0.10 = 10%."}, {"label": "Step 3c: Part 3 — Calculate Simple Interest & Total Balance ($600, 4%, 2.5 yrs) AND convert $40 USD to CAD ($1 USD = $1.35 CAD)", "placeholder": "I = 600 × 0.04 × 2.5 = $...\nTotal Balance = $600 + $... = $...\nGame in CAD = $40 × 1.35 = $... CAD", "hint": "600 × 0.04 = 24; 24 × 2.5 = $60 interest! Then add $600 + $60!", "modelSubAnswer": "• Simple Interest: r = 4% = 0.04. I = $600 × 0.04 × 2.5 = $24 × 2.5 = $60.00 interest.\n• Final Total Balance: P + I = $600.00 + $60.00 = $660.00.\n• Foreign Currency Conversion: $40 USD × 1.35 = $54.00 CAD."}], "step4_checks": ["Did I sort the 5 numbers BEFORE finding the Median (15) in Part 1?", "Did I MULTIPLY (1/5) × (1/2) = 1/10 (10%) instead of adding in Part 2?", "In Part 3, did I write 4% as 0.04 (NOT 0.4) AND calculate BOTH Interest ($60) and Total Balance ($660)?"], "step5_modelAnswer": {"basicAnswer": "Part 1: Mean 13, Median 15 (Median better). Part 2: 1/10 (10%). Part 3: $60 interest, $660 total; $54.00 CAD.", "expandedAnswer": "Complete Strands D & F Exemplar:\n• Part 1 (Data & Outliers): Sorted scores: 3, 14, 15, 16, 17. Mean = 65 ÷ 5 = 13; Median = 15. Because 3 is an extreme low outlier, the Median (15) best represents Zaid's true shooting skill.\n• Part 2 (Compound Probability): P(Gold) = 1/5 and P(Even) = 3/6 = 1/2. Since the spinner and die are independent, P(Gold AND Even) = (1/5) × (1/2) = 1/10 = 10%.\n• Part 3 (Financial Literacy): Using I = Prt with r = 0.04: I = $600 × 0.04 × 2.5 = $60.00 → Total Balance = $600 + $60 = $660.00. Currency conversion: $40 USD × 1.35 = $54.00 CAD.", "extensionPrompt": "Super Extension: If you earn 4% interest on $600 for 6 MONTHS instead of 2.5 years, what value of `t` do you plug into `I = Prt`, and how much interest do you earn?"}}, {"id": "math-u6-q2", "bloomLevel": 4, "bloomTag": "APPLY & ANALYZE", "title": "Circle Graph Central Angles & 3D Nets Check Lab", "prompt": "A Grade 7 class of **40 students** surveyed their favourite after-school activity:\n• **Sports:** 18 students | **Music/Arts:** 10 students | **Coding/Games:** 8 students | **Reading:** 4 students.\n\n(a) Calculate the exact **Percentage (%)** AND **Central Angle (`°`)** for ALL FOUR slices of a Circle Graph.\n(b) Run the **Double-Check Shield** proving your percentages sum to `100%` AND your angles sum to `360°`.\n(c) Explain WHY a Circle Graph is the right chart for this survey—and describe the exact **2D Net** (list every face!) of a **square-based pyramid** vs. a **triangular prism**.", "step1_deconstruct": {"instruction": "Divide each count by `40` for %, multiply by `360°` for degrees, verify totals = `100%` & `360°`, and list exact 3D faces!", "guidingQuestions": ["What is `18 ÷ 40` as a decimal (`0.45`) and times `360°`?", "Do all 4 angles add up to exactly `360°`?", "How many triangles and rectangles form a triangular prism net?"], "modelPlan": "(a) Sports 45% (162°), Music 25% (90°), Coding 20% (72°), Reading 10% (36°). (b) 45+25+20+10=100% & 162+90+72+36=360°. (c) Shows parts of 100% whole; Square pyramid = 1 sq + 4 tri; Triangular prism = 2 tri + 3 rect."}, "step2_anchor": {"instruction": "Formulas:", "referenceItems": ["`% = (Part ÷ 40) × 100%` | `Angle = (Part ÷ 40) × 360°`", "Sum Check: `% = 100%` and `Angles = 360°`!"]}, "step3_substeps": [{"label": "Step 3a: Compute `%` AND `Central Angle (°)` for Sports (`18`), Music (`10`), Coding (`8`), Reading (`4`)", "placeholder": "Sports: 18/40 = ...% → ...°\nMusic: ...\nCoding: ...\nReading: ...", "hint": "Multiply each count by `9°` (since `360° ÷ 40 = 9°` per student!) — `18×9=162°`, `10×9=90°`, `8×9=72°`, `4×9=36°`!", "modelSubAnswer": "• **Sports:** `18/40 = 45%` → `0.45 × 360° = 162°`\n• **Music/Arts:** `10/40 = 25%` → `0.25 × 360° = 90°`\n• **Coding/Games:** `8/40 = 20%` → `0.20 × 360° = 72°`\n• **Reading:** `4/40 = 10%` → `0.10 × 360° = 36°`"}, {"label": "Step 3b: Verify BOTH totals (`100%` and `360°`)", "placeholder": "Percent Sum = ... = 100%\nDegree Sum = ... = 360°", "hint": "Add all 4 percents and all 4 angles explicitly!", "modelSubAnswer": "• Percents: `45% + 25% + 20% + 10% = 100%` ✅\n• Degrees: `162° + 90° + 72° + 36° = 360°` ✅"}, {"label": "Step 3c: Justify using a Circle Graph AND list the exact 2D Net faces of both 3D solids", "placeholder": "Circle Graph works because...\nSquare-Based Pyramid Net: ...\nTriangular Prism Net: ...", "hint": "Each student picked ONE activity (mutually exclusive parts of 100% whole!); Square pyramid = 1 square + 4 triangles; Triangular prism = 2 triangles + 3 rectangles!", "modelSubAnswer": "• **Why Circle Graph:** Each student chose one category, so the slices represent exact non-overlapping parts of a `100%` whole.\n• **Square-Based Pyramid Net:** `1 square base + 4 congruent triangles` (`5 faces`).\n• **Triangular Prism Net:** `2 congruent triangular bases + 3 rectangles` (`5 faces`)."}], "step4_checks": ["Did I multiply each decimal percent by `360°` (`162°, 90°, 72°, 36°`)?", "Did both sums hit exactly `100%` and `360°`?", "Did I list the exact faces of BOTH 3D nets without mixing up pyramid vs. prism?"], "step5_modelAnswer": {"basicAnswer": "45% (162°), 25% (90°), 20% (72°), 10% (36°). Sums 100% & 360°. Pyramid 1 sq+4 tri; Prism 2 tri+3 rect.", "expandedAnswer": "Part (a): Sports `45% (162°)`, Music `25% (90°)`, Coding `20% (72°)`, Reading `10% (36°)`.\nPart (b): `45+25+20+10 = 100%` and `162+90+72+36 = 360°` ✅.\nPart (c): Circle graphs clearly display mutually exclusive shares of a `100%` whole. A square-based pyramid unfolds into `1 square + 4 triangles`, while a triangular prism unfolds into `2 triangles + 3 rectangles`.", "extensionPrompt": "Extension: What shortcut saved time when `Total = 40`? Every single student equals `360° ÷ 40 = 9°`!"}}]}], "friendlySub": "Complete Ontario 2020 Math: Number, Algebra/Coding, Geometry, Data & Finance", "accent": "#7c3aed"}, {"id": "english", "code": "ENG7 / Language 7", "name": "Language (English)", "teacher": "E. Catana (EC)", "status": "Progressing Well", "tier": "Tier 2: Push to Very Well", "tierClass": "tier-strong", "icon": "✍️", "reportComment": "Zaid demonstrates a strong understanding of various text forms, writing conventions, and clear ideas. He participates in class discussions. To continue improving, he should focus on expanding his ideas and thoroughly edit his work. (EC)", "nextSteps": ["Turn clear 1-sentence ideas into rich 6–8 sentence paragraphs using the P.E.E.L. Detail Expander", "Bridge your strong class discussion voice into writing ('If I can say 4 sentences about it aloud, I can write 4 detailed sentences!')", "Upgrade vague words ('good, fun, nice, bad, stuff') into precise Grade 7 academic and sensory vocabulary", "Run E. Catana's 2-Stage Editor (A.R.M.S. for Revision + C.O.P.S. for Proofreading) before submitting"], "units": [{"id": "eng-u1", "title": "Unit 1: The Detail Expander (P.E.E.L. Paragraphs), Text Forms & Multi-Step Editing", "curriculumStrand": "Ontario Grade 7 Language Curriculum: Comprehension (Strand C) & Composition / Writing (Strand D)", "svgDiagram": "english_peel_svg", "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "The 2 Core Frameworks: P.E.E.L. (Idea Expansion) & A.R.M.S./C.O.P.S. (Editing)", "content": "E. Catana noted that your ideas are already clear and your understanding of text forms is strong! To reach 'Progressing Very Well', use these two anchor frameworks on every writing task:", "keyPoints": ["🧱 P.E.E.L. Paragraph Expander:\n• P — Point (Topic Sentence): State your main argument or idea clearly.\n• E — Evidence / Example (x2): Give specific facts, quotes, sensory details, or real examples (ask: Who? When? Where? How?).\n• E — Explanation: Explain WHY your example proves your point ('This demonstrates that...', 'As a result...').\n• L — Link (Concluding Sentence): Connect back to your main point and leave the reader with a strong takeaway.", "🛠️ Stage 1 Revision — A.R.M.S. (Expanding Ideas):\n• Add sensory details, adjectives, and a second example.\n• Remove repetitive or off-topic filler.\n• Move sentences so transitions flow logically.\n• Substitute weak words ('fun', 'good', 'stuff') with power vocabulary ('energizing', 'beneficial', 'equipment').", "🔍 Stage 2 Editing — C.O.P.S. (Conventions Check):\n• Capitalization (proper nouns, start of sentences).\n• Overall appearance & complete sentences (fix run-ons and fragments).\n• Punctuation (commas after introductory phrases, apostrophes, periods).\n• Spelling (homophones like their/there/they're, affect/effect)."]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Why 'Telling' Is Short and 'Showing + Explaining' Expands Your Writing", "content": "In class discussions, you naturally give examples and react to classmates. In writing, students often stop after writing the Point ('Gym class is important because it keeps us active.'). That is only the P of P.E.E.L.!", "analogy": "🎺 Music & Trombone Analogy: Playing a single quarter note on the trombone shows you know the pitch, but performing a full musical phrase with dynamics, rhythm, and resonance makes the audience feel the music. Expanding your writing with Evidence and Explanation turns a single note into a full composition!", "keyPoints": ["The 'Because -> For Example -> This Matters Because' Chain: Every time you write a sentence, ask yourself 2 follow-up questions: (1) 'What is a specific example of this?' and (2) 'How or why does this impact people?'"]}, {"level": 3, "name": "APPLY", "subtitle": "Watch a 17-Word Draft Expand into a 110-Word Grade 7+ Paragraph", "content": "See how E. Catana's Detail Expander transforms a brief sentence step by step:", "workedExample": {"prompt": "Prompt: Why are school spaces like the gymnasium and cafeteria important for Grade 7 students?", "steps": ["❌ Unexpanded Draft (17 words): 'The gym and cafeteria are the best parts of school because they are fun and we see friends.'", "Step 1 (Upgrade Point): 'Shared spaces like the school gymnasium and cafeteria are essential for Grade 7 students because they build physical stamina, social collaboration, and mental focus.'", "Step 2 (Add Specific Evidence #1 — Gym): 'For instance, during physical education in the large gymnasium, students practice sport-specific skills and team strategies that release stress after sitting in academic classes.'", "Step 3 (Add Specific Evidence #2 — Cafeteria): 'Similarly, the spacious cafeteria provides a welcoming community hub where students from different homerooms share meals, exchange ideas, and build positive peer relationships.'", "Step 4 (Add Explanation & Concluding Link): 'When students have opportunities to move their bodies and connect socially, they return to afternoon lessons with sharper concentration and stronger self-regulation.'"]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Major Grade 7 Text Forms & Their Structural Features", "content": "Build on your strength in understanding text forms by analyzing how purpose changes structure and tone:", "comparisonTable": {"headers": ["Text Form", "Primary Purpose", "Key Structural Elements", "Tone & Language Features"], "rows": [["Persuasive / Opinion Essay", "Convince the reader to agree with a viewpoint or take action", "Hook, Thesis Statement, P.E.E.L. body paragraphs, Counter-argument, Call to action", "Formal, evidence-based, transition words (Furthermore, Consequently, Undeniably)"], ["Expository / Informational Report", "Explain how something works or analyze a topic objectively", "Headings, subheadings, topic sentences, diagrams/charts, glossary", "Objective, precise domain vocabulary (e.g., contour interval, particle theory)"], ["Narrative / Short Story", "Tell an engaging story that explores a theme or character conflict", "Exposition, inciting incident, rising action, climax, resolution", "Sensory imagery (sight, sound, motion), dialogue, 'Show, Don't Tell' verbs"], ["Media / Digital Text", "Communicate a targeted message to a specific audience using multimodal design", "Headline, visual layout, focal point, caption, subtext", "Concise, high-impact verbs, persuasive appeals (ethos, pathos, logos)"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Thorough Editing Audit: Fix a Unedited Paragraph Using A.R.M.S. & C.O.P.S.", "content": "Find the 5 conventions errors (C.O.P.S.) AND the 2 weak-vocabulary spots (A.R.M.S.) in this draft:", "keyPoints": ["❌ Raw Draft: « Working in groups is good for students because their able to share ideas, when we work together in mr forbes science class we solved a hard problem about mixtures. It was really nice. »", "🔧 C.O.P.S. Fixes: (1) 'their' -> 'they're' (they are), (2) comma splice after 'ideas,' -> change to a period and capital 'When', (3) 'mr forbes' -> 'Mr. Forbes's', (4) comma after introductory clause 'In Mr. Forbes's science class,', (5) tense shift 'when we work... we solved' -> keep consistent past or present tense.", "🚀 A.R.M.S. Vocabulary Expansion: Replace 'good' with 'beneficial' and replace 'It was really nice.' with 'Collaborating allowed each teammate to test hypotheses and explain the Particle Theory with greater accuracy.'"]}, {"level": 6, "name": "CREATE", "subtitle": "Write & Self-Edit a Multi-Paragraph Persuasive or Narrative Piece", "content": "Combine voice, P.E.E.L. expansion, and C.O.P.S. editing to produce polished Grade 7+ writing.", "keyPoints": ["Rule of 3 Details: Never leave a paragraph with fewer than 2 concrete examples and 3 precise adjectives/verbs."]}], "questions": [{"id": "eng-q1", "bloomLevel": 6, "bloomTag": "EVALUATE & CREATE", "title": "The E. Catana Detail Expander & Multi-Step Editor Workbench", "prompt": "Here is a short, unedited 2-sentence student draft responding to the prompt: 'Should Grade 7 students have daily Physical Education (Gym) class?'\n\nRaw Draft: « I think grade 7 students should have gym every day because its fun and good for you. In gym we play games with friends and it helps us not be bored in class. »\n\nIn deep multi-step work:\n1. Diagnose what is missing and identify the grammar/word-choice weaknesses in the raw draft.\n2. Expand the draft into a rich 5-to-6 sentence P.E.E.L. paragraph with specific details (fitness, teamwork, brain focus/self-regulation).\n3. Apply the A.R.M.S. & C.O.P.S. Editing Checklist to produce a polished final paragraph.", "step1_deconstruct": {"instruction": "STOP & PLAN: Diagnose the raw draft before rewriting.", "guidingQuestions": ["What C.O.P.S. errors are in 'grade 7' and 'its fun'?", "Which vague words ('fun', 'good for you', 'games', 'not be bored') need to be upgraded with A.R.M.S.?", "What specific evidence from your own experience in gym and academic classes can you add?"], "modelPlan": "Fix 'grade 7' -> 'Grade 7' and 'its' -> 'it's' (it is). Upgrade 'fun/good' to 'energizing, cardiovascular fitness, collaborative teamwork, and self-regulation'. Build a 5-sentence P.E.E.L. paragraph."}, "step2_anchor": {"instruction": "ANCHOR TOOL: Power Vocabulary Bank & Transition Connectors.", "referenceItems": ["Power Verbs & Nouns: cardiovascular stamina, sport-specific skills, peer collaboration, self-regulation, mental concentration, physical outlet", "Transition Starters: 'First and foremost,', 'For example,', 'Furthermore,', 'As a result,', 'Ultimately,'"]}, "step3_substeps": [{"label": "Step 3a: Write a strong Point (Topic Sentence) that upgrades 'fun and good for you' into 2 specific benefits", "placeholder": "Grade 7 students should have daily Physical Education because...", "hint": "Mention both physical fitness/skills AND mental focus/teamwork!", "modelSubAnswer": "Grade 7 students should participate in daily Physical Education because regular athletic activity strengthens physical fitness, builds teamwork, and sharpens mental focus for academic classes."}, {"label": "Step 3b: Write 2–3 sentences of Evidence & Explanation (Specific details from the gym + how movement helps focus in math/French/geography)", "placeholder": "For example, during gym class, students develop... Furthermore, burning energy in the gym helps students...", "hint": "Include concrete details: sport-specific drills, encouraging teammates, and returning to class calm and ready to focus.", "modelSubAnswer": "For example, during daily gym sessions, students build cardiovascular stamina and sport-specific skills while practicing respectful collaboration and encouraging their peers. Furthermore, having an active outlet to release excess energy during the school day directly supports self-regulation when students return to their desks. After an engaging workout, students can concentrate longer during independent work in subjects like mathematics, French, and geography."}, {"label": "Step 3c: Write a Concluding Link sentence and perform a full C.O.P.S. edit on your combined paragraph", "placeholder": "Ultimately, daily Physical Education is not just a break from learning—it is...", "hint": "Wrap up by linking physical health to overall student success.", "modelSubAnswer": "Ultimately, daily Physical Education is far more than just a break—it is an essential foundation that keeps middle school students healthy, cooperative, and ready to learn."}], "step4_checks": ["A.R.M.S. Check: Did I eliminate vague words ('fun', 'good', 'stuff') and include at least 4 precise Grade 7 vocabulary words?", "P.E.E.L. Check: Does my paragraph contain at least 5 complete sentences (Point + 2 Evidence/Explanation sentences + Concluding Link)?", "C.O.P.S. Check: Did I capitalize 'Grade 7' and 'Physical Education', use commas after transition phrases ('For example,', 'Furthermore,'), and check spelling?"], "step5_modelAnswer": {"basicAnswer": "Grade 7 students should have gym every day because it is healthy and helps us focus in class.", "expandedAnswer": "Complete Expanded & Edited Exemplar (E. Catana Level 4+ Standard — 112 words):\n« Grade 7 students should participate in daily Physical Education because regular athletic activity strengthens physical health, builds respectful teamwork, and sharpens mental focus for academic learning. For example, when students practice sport-specific skills and fitness circuits in the gymnasium, they develop physical stamina while actively encouraging and collaborating with their peers. Furthermore, having a structured daily outlet for physical movement directly improves classroom self-regulation. After releasing pent-up energy in the gym, students return to subjects like mathematics, French, and geography with calmer focus and greater stamina for independent work. Ultimately, daily Physical Education is an essential investment in both student well-being and academic achievement. »", "extensionPrompt": "Extension Challenge: Add 1 counter-argument sentence ('Although some people argue that daily gym takes time away from classroom subjects, research shows...') and refute it!"}}], "studyFirstTag": "Start Here: Turn Short Ideas into Rich Paragraphs (P.E.E.L. + Editing)", "lessons": [{"id": "eng-u1-l1", "title": "Lesson 1.1: Expanding Good Ideas with P.E.E.L. (From 1 Sentence to 6!)", "readTime": "3 min read", "bigIdea": "Your ideas are already clear—using the P.E.E.L. blueprint turns a short 1-sentence answer into a rich, persuasive Grade 7 paragraph.", "paragraphs": ["E. Catana wrote on your report card that you already have clear ideas and strong understanding of text forms. So why do teachers ask you to 'expand your written work to include greater detail'? Because in class discussions, you naturally explain your thoughts out loud—but on paper, it is tempting to stop after writing just the main point!", "Think of a great paragraph like building a burger with P.E.E.L.: Start with your P (Point)—a clear topic sentence stating your opinion and two specific reasons. Next, add two layers of E (Evidence/Examples)—concrete details that answer Who, Where, and How using starters like 'For example,' and 'Furthermore,'.", "Third, add E (Explanation)—tell the reader WHY your examples prove your point ('As a result...', 'This shows that...'). Finally, close with L (Link)—a strong final sentence tying back to the big picture ('Ultimately,...')."], "keyTakeaway": "Never stop after writing your Point! Always ask yourself: (1) What is a specific example? (2) Why does this matter?", "deepReadTitle": "🛠️ Lesson 1.2: E. Catana's 2-Stage Editor (A.R.M.S. & C.O.P.S.)", "deepReadText": "Editing isn't just checking spelling—it has two stages:\n1) A.R.M.S. (Make Ideas Stronger): Add details, Remove filler, Move sentences for flow, and Substitute weak words ('fun', 'good', 'stuff', 'nice') with power words ('energizing', 'beneficial', 'equipment', 'collaborative').\n2) C.O.P.S. (Polish Conventions): Check Capitalization (Grade 7, proper nouns), Overall sentence flow (fix run-on commas!), Punctuation (it's = it is vs. its = belonging to it), and Spelling (they're / their / there).", "quickCheck": {"question": "Which sentence best uses A.R.M.S. & C.O.P.S. to upgrade: « gym is fun because its good for you »?", "options": ["Gym is super fun because its really good for kids.", "Daily Physical Education is energizing because it builds cardiovascular stamina and teamwork.", "gym is good because we play stuff with friends."], "correctIdx": 1, "explanation": "It fixes capitalization ('Physical Education'), removes the 'its' apostrophe error, and upgrades vague words ('fun', 'good') into precise Grade 7 vocabulary ('energizing', 'cardiovascular stamina', 'teamwork')!"}, "videos": [{"id": "t8W4XDPYFwc", "title": "Using the PEEL Paragraph Method (Grade 7–8 English)", "channel": "Schooling Online", "why": "Shows exactly how to expand a 1-sentence idea into a rich Point-Evidence-Explain-Link paragraph."}]}]}, {"id": "eng-u2", "title": "Unit 2: Deep Reading Comprehension, Inference & Media Literacy Analysis", "curriculumStrand": "Ontario Grade 7 Language: Comprehension (Strand C) & Digital Media Texts (Strand A/C)", "svgDiagram": "english_peel_svg", "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Core Reading & Media Concepts: Inference, Theme, Subtext & Appeals", "content": "When reading short stories, articles, or digital media in E. Catana's class, anchor these key terms:", "keyPoints": ["🔎 Inference Equation: Text Clues (Direct Quotes/Actions) + Prior Knowledge (What you know about life) = Inference (Reading between the lines!).", "🌟 Theme vs. Plot: Plot is WHAT happens in the story ('A boy practices trombone and makes the band'). Theme is the universal MESSAGE about life ('Consistent self-discipline and perseverance turn initial struggle into mastery').", "📺 Media Literacy Triangle: Every media text (poster, commercial, website, social video) is analyzed through (1) Audience & Purpose, (2) Production Techniques (camera angle, lighting, colour, music), and (3) Implicit vs. Explicit Message."]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Why Reading Answers Need Direct Evidence + Deep Explanation", "content": "Just like writing essays, reading comprehension answers in Grade 7 require expanding your ideas beyond a 1-sentence opinion!", "analogy": "🕵️‍♂️ Detective Case File Analogy: A detective in court can't just say 'I think the suspect was nervous.' They must present the physical clue ('His hands were shaking and he avoided eye contact') and explain what it proves. In English, your quote/detail is the clue, and your explanation is the proof!", "keyPoints": ["The R.A.C.E. / P.E.E.L. Reading Response Formula: Restate & Answer the question -> Cite a specific detail/quote from the text -> Explain how that detail proves your inference."]}, {"level": 3, "name": "APPLY", "subtitle": "Decode Character Motivation & Implicit Meaning Step-by-Step", "content": "Watch how a brief reading answer is expanded into a thorough Grade 7 response:", "workedExample": {"prompt": "Passage Excerpt: « Malik stared at the steep contour lines on his geography worksheet. Around him, classmates were chatting about the after-school basketball game. Malik took a slow breath, opened his notebook to the anchor chart from Tuesday's lesson, and underlined the three parts of Question 4 before picking up his pencil. »\nQuestion: What can you infer about Malik's growth as a learner?", "steps": ["❌ Brief Answer (Too short!): 'Malik is trying hard to finish his geography work.'", "Step 1 (Inference Claim): 'We can infer that Malik has developed strong self-regulation and organization strategies when facing challenging academic tasks.'", "Step 2 (Text Evidence): 'Specifically, even though his peers are talking about basketball around him, Malik takes \"a slow breath,\" consults \"the anchor chart from Tuesday's lesson,\" and underlines all three parts of the question before writing.'", "Step 3 (Deep Explanation): 'These deliberate actions show that instead of getting distracted or rushing into a careless answer, he uses resource tools and breaks complex work into manageable steps.'"]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Analyze Persuasive Appeals & Camera Angles in Media Texts", "content": "Compare how media creators influence Grade 7 audiences:", "comparisonTable": {"headers": ["Media Technique", "How It Works", "Effect on the Audience"], "rows": [["Ethos (Credibility)", "Featuring a pro athlete, scientist, or trusted expert", "Builds trust and authority in the message"], ["Pathos (Emotion)", "Inspiring orchestral/brass music, slow-motion teamwork shots", "Creates excitement, empathy, or belonging"], ["Logos (Logic & Facts)", "Statistics, graphs, and performance data ('Improves stamina by 35%')", "Convinces the logical mind with measurable proof"], ["Low Camera Angle (Looking Up)", "Camera shoots from floor level looking up at the athlete/subject", "Makes the subject appear powerful, heroic, and confident"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Audit a Reading Response for Depth & Conventions (E. Catana Rubric)", "content": "Before submitting any reading comprehension response, check these 3 criteria:", "keyPoints": ["1. Did I embed at least one specific detail or short quotation from the text?", "2. Did I write at least 2 sentences explaining HOW my evidence supports my point (using phrases like 'This illustrates that...' or 'By doing this, the author reveals...')?", "3. Did I run C.O.P.S. to check quotation marks, capitals, and spelling?"]}, {"level": 6, "name": "CREATE", "subtitle": "Design & Justify a Multimodal Media Campaign for School Community Spirit", "content": "Synthesize media literacy appeals (ethos, pathos, logos), visual design elements, and persuasive writing.", "keyPoints": ["Links English Media Literacy with Visual Arts Elements of Design!"]}], "questions": [{"id": "eng-u2-q1", "bloomLevel": 5, "bloomTag": "ANALYZE & EVALUATE", "title": "Deep Reading Inference & R.A.C.E./P.E.E.L. Expansion Workbench", "prompt": "Read this short narrative passage carefully:\n\n« Twenty minutes before the winter concert at Longfields-Davidson Heights, the backstage hallway buzzed with nervous energy. Leo gripped his trombone slide so tightly his knuckles turned white; he had cracked the high F twice during morning rehearsal. Sitting beside him, Tariq noticed Leo's shallow breathing. Without making a big deal of it, Tariq tapped his own stomach, smiled, and mimed a slow, deep breath in for four counts, then hummed a steady low Bb. Leo's shoulders dropped an inch. He mirrored the breath, adjusted his posture on the edge of the folding chair, and played a warm, resonant F that echoed cleanly down the hall. »\n\nAnswer in a deep, expanded multi-step reading response (5–6 sentences, thoroughly edited):\nWhat does this passage reveal about Tariq's leadership style and how peer collaboration affects performance under pressure? Support your answer with at least TWO specific details from the text and explain their impact.", "step1_deconstruct": {"instruction": "STOP & PLAN: Identify the two parts of the question (Tariq's leadership style + impact on Leo's performance) and select 2 concrete text clues.", "guidingQuestions": ["How is Leo feeling at the start? ('knuckles turned white', 'shallow breathing', cracked high F).", "What specific actions does Tariq take instead of criticizing Leo? ('Without making a big deal', tapped stomach, mimed slow breath, hummed low Bb).", "How does Leo's physical state and musical performance change as a result?"], "modelPlan": "Point: Tariq demonstrates empathetic, supportive leadership that calms anxiety and unlocks peak performance. Evidence 1: Leo's white knuckles/shallow breathing vs. Tariq quietly modeling deep breathing and humming Bb. Evidence 2: Leo's shoulders dropping and playing a 'warm, resonant F'. Explanation & Link: Connects quiet encouragement to confidence under pressure."}, "step2_anchor": {"instruction": "ANCHOR TOOL: R.A.C.E. / P.E.E.L. Reading Response Connectors.", "referenceItems": ["Point Starter: 'This passage reveals that true leadership relies on empathy and calm modeling, which helps peers overcome anxiety under pressure.'", "Evidence Starters: 'For instance, when Tariq notices Leo's \"white\" knuckles and \"shallow breathing,\" he...' | 'Furthermore, the text states that...'", "Explanation Starters: 'This subtle gesture demonstrates that...' | 'Consequently, Tariq's supportive collaboration allows Leo to...'"]}, "step3_substeps": [{"label": "Step 3a: Write your Topic Sentence (Point) answering both parts of the prompt", "placeholder": "This passage reveals that Tariq is an empathetic, encouraging leader whose calm support...", "hint": "State clearly what kind of leader Tariq is and how collaboration helps performers under pressure.", "modelSubAnswer": "This passage reveals that Tariq is an empathetic, observant leader whose quiet encouragement helps a nervous teammate regain self-regulation and perform with confidence under pressure."}, {"label": "Step 3b: Integrate 2 specific text details/quotes (Evidence) and explain WHY they matter (Explanation)", "placeholder": "For example, when Leo grips his trombone until his \"knuckles turned white\" because of his earlier mistake, Tariq does not embarrass him; instead, he...", "hint": "Quote phrases like \"knuckles turned white\", \"shallow breathing\", and \"warm, resonant F\" and explain how Tariq's breathing cue worked.", "modelSubAnswer": "For example, when Leo grips his trombone until his \"knuckles turned white\" from fear of repeating his rehearsal mistake, Tariq avoids embarrassing him in front of the band. Instead, Tariq calmly models a slow four-count diaphragmatic breath and hums a steady \"low Bb\" to anchor his friend. Consequently, this respectful, non-judgmental support breaks Leo's panic cycle: his \"shoulders dropped an inch,\" he corrects his posture, and he produces a \"warm, resonant F.\""}, {"label": "Step 3c: Write a Concluding Link sentence on the theme of collaboration & perform a C.O.P.S. edit", "placeholder": "Ultimately, the author demonstrates that when teammates support one another with patience...", "hint": "Connect the scene to the universal theme of teamwork and encouragement.", "modelSubAnswer": "Ultimately, the passage illustrates that when teammates encourage one another with patience and practical strategies, collaboration transforms nervous tension into shared success."}], "step4_checks": ["Did I include at least 2 specific details or short quotes from the passage in quotation marks?", "Did I explain HOW Tariq's actions changed Leo's physical posture, breathing, and trombone tone?", "Did I edit my response with C.O.P.S. (capital letters on 'Tariq', 'Leo', 'Bb', 'F', and proper punctuation inside quotation marks)?"], "step5_modelAnswer": {"basicAnswer": "Tariq is a good friend who helps Leo breathe so he can play the high F on his trombone without being nervous.", "expandedAnswer": "Complete Expanded Reading Comprehension Exemplar (E. Catana Level 4+ Standard):\n« This passage reveals that Tariq is an empathetic, observant leader whose quiet encouragement helps a nervous peer regain self-regulation and perform with confidence under pressure. At the beginning of the scene, Leo is paralyzed by anxiety over cracking a note earlier, gripping his trombone until his \"knuckles turned white\" and taking \"shallow breathing.\" Rather than criticizing him or drawing unwanted attention, Tariq calmly models a slow four-count diaphragmatic breath and hums a steady \"low Bb.\" This supportive, non-judgmental gesture immediately lowers Leo's stress—his \"shoulders dropped an inch\"—allowing him to reset his posture and play a \"warm, resonant F.\" Ultimately, the author demonstrates that respectful peer collaboration and encouragement can transform performance anxiety into mastery. »", "extensionPrompt": "Self-Connection: Notice how Tariq displays the exact 'Collaboration: G (Good)' trait N. Bishop praised on your report card ('actively sharing ideas while supporting and encouraging peers')!"}}], "studyFirstTag": "Next: Reading Between the Lines (Inference + Evidence)", "lessons": [{"id": "eng-u2-l1", "title": "Lesson 2.1: Reading Between the Lines (Inference & Text Evidence)", "readTime": "3 min read", "bigIdea": "Authors don't always tell you how a character feels—they SHOW you through actions, body language, and dialogue.", "paragraphs": ["If a story says, 'Leo gripped his trombone slide so tightly his knuckles turned white,' the author never uses the word 'nervous'—yet you immediately know Leo is stressed! That is called making an INFERENCE: Text Clues + Your Background Knowledge = Deep Meaning.", "When answering a reading comprehension question in Grade 7, follow the exact same expansion rule as writing: Restate & Answer the question clearly, Cite 2 specific short quotes or details from the passage, and Explain how those clues prove your point.", "The same detective skill works in Media Literacy! Every poster, ad, or video tries to persuade you using Ethos (trusted expert), Pathos (emotion/music), or Logos (facts and stats)—plus camera angles and colours chosen on purpose."], "keyTakeaway": "An inference without a quote/text clue is just a guess. Always back up your reading idea with 2 specific details from the text!", "deepReadTitle": "🔎 Plot vs. Theme (Don't Mix Them Up!)", "deepReadText": "• Plot = WHAT happens in the story (specific character names and events).\n• Theme = The universal LIFE MESSAGE anyone can learn from the story (no character names! Example: 'Quiet, supportive teamwork can turn fear under pressure into confidence').", "quickCheck": {"question": "If a character's 'shoulders dropped an inch' after a friend helps them breathe before a concert, what can we infer?", "options": ["The character got even more nervous.", "The character physically relaxed and released tension.", "The character dropped their instrument."], "correctIdx": 1, "explanation": "Raised, tight shoulders show stress; shoulders dropping is a physical clue that tension melted away!"}, "videos": [{"id": "GXw-qn8dCWw", "title": "Making Inferences (Reading Between the Lines)", "channel": "Growing Primary", "why": "Visualizes how text clues + prior knowledge combine to make strong reading inferences."}]}]}, {"id": "eng-u3", "title": "Unit 3 (Ontario 2023 Strands B & C): Word Roots, Sentence Craft & Figurative Language", "studyFirstTag": "Decode hard words with roots, kill comma splices & master figurative language!", "curriculumStrand": "Ontario 2023 Language Strands B (Foundations) & C (Literary Comprehension)", "svgDiagram": "eng_essay_svg", "lessons": [{"id": "eng-u3-l1", "title": "Lesson 3.1: Greek & Latin Word Roots + Killing Comma Splices & Run-On Sentences", "readTime": "3 min read", "bigIdea": "Unlock giant Grade 7 vocabulary across Science, Geography & French with Greek/Latin roots, and polish editing by eliminating Comma Splices forever!", "paragraphs": ["Ontario's 2023 Language Curriculum highlights MORPHOLOGY (building blocks of words): Prefix (front) + Root (core meaning) + Suffix (ending). Know just 6 roots and you decode dozens of hard words automatically! Examples: `geo` (earth → geography, geology), `therm` (heat → thermal, thermometer), `bio` (life → biome, biology), `struct` (build → structure, construct), `hydro` (water → hydroelectricity, hydrate), `auto` (self → autopilot, autobiography)!", "Now let's level up E. Catana's editing goal ('thoroughly edit his work') by crushing the #1 Grade 7 punctuation bug: the COMMA SPLICE! A comma splice happens when you glue TWO complete sentences together using ONLY a weak comma: « I practiced my trombone for 20 minutes, my high F sounded crystal clear. » A comma is NOT strong enough to hold two complete sentences together!", "You have 3 rock-solid fixes for any Comma Splice or Run-On: (1) Split with a PERIOD (`...minutes. My high F...`), (2) Add a FANBOYS conjunction (`For, And, Nor, But, Or, Yet, So`) after the comma (`...minutes, so my high F...`), or (3) Use a SEMICOLON (`;`) when the two sentences are tightly connected (`...minutes; my high F...`)!"], "keyTakeaway": "Decode big words with Roots (`geo`, `therm`, `bio`, `hydro`, `struct`) | Fix Comma Splices 3 ways: Period (.), Comma + FANBOYS (`, so`), or Semicolon (`;`)!", "deepReadTitle": "🔧 Subordinating Conjunctions for Grade 7+ Complex Sentences", "deepReadText": "Level up short choppy sentences with `Although`, `Because`, `Since`, `While`, or `Even though`:\n• Choppy: 'I was tired. I finished my geography work.'\n• Complex Grade 7+: 'Although I felt tired after gym, I finished every part of my geography work.' (Notice the comma after the front clause!)", "videos": [{"id": "d-2H6tek_L4", "title": "Greek and Latin Roots, Prefixes, and Suffixes", "channel": "Easy English with Evi", "why": "Shows how breaking apart roots unlocks vocabulary in English, Science, and Geography."}, {"id": "Fh45mhVsZrU", "title": "Run-Ons and Comma Splices | Syntax", "channel": "Khan Academy", "why": "Crystal-clear editing fixes for run-on sentences and comma splices."}], "quickCheck": {"question": "Which sentence properly fixes the comma splice: « Zaid checked his BEDMAS steps, he caught a negative sign error »?", "options": ["Zaid checked his BEDMAS steps he caught a negative sign error.", "Zaid checked his BEDMAS steps, and he caught a negative sign error.", "Zaid checked, his BEDMAS steps, he caught a negative sign error."], "correctIdx": 1, "explanation": "Adding a FANBOYS conjunction (`and` or `so`) right after the comma (or using a period/semicolon) cleanly fixes a comma splice!"}}, {"id": "eng-u3-l2", "title": "Lesson 3.2: Figurative Language & Short Story Elements (Simile, Metaphor, Irony)", "readTime": "3 min read", "bigIdea": "Authors bring stories to life using Figurative Language—comparing things creatively so readers SEE, HEAR, and FEEL every moment!", "paragraphs": ["Literal language says the plain facts ('Zaid ran fast in the gym'). FIGURATIVE LANGUAGE paints a vivid mental movie! Master the big 5 Grade 7 literary devices: (1) SIMILE compares two unlike things using `like` or `as` ('His pass cut across the court like a laser beam'). (2) METAPHOR states one thing IS another directly—no `like/as` ('The cafeteria at noon was a roaring ocean of voices').", "(3) PERSONIFICATION gives human actions or feelings to non-human objects ('The Ottawa winter wind bit at our cheeks and howled down Berrigan Drive'). (4) HYPERBOLE uses intentional extreme exaggeration for comedy or drama ('My backpack weighed a million tonnes!'). (5) ONOMATOPOEIA & IMAGERY use sound words ('swish', 'clang', 'buzz') and the 5 senses to put the reader inside the scene.", "When analyzing short stories in E. Catana's class, also check Point of View (1st Person 'I/we' vs. 3rd Person Limited/Omniscient 'he/she/they'), Foreshadowing (early clues hinting at what will happen next), and Conflict (Character vs. Self, Character vs. Character, Character vs. Nature, or Character vs. Society)."], "keyTakeaway": "Simile = uses `like/as` | Metaphor = direct `is` comparison | Personification = human traits on objects | Hyperbole = dramatic exaggeration!", "deepReadTitle": "🎭 Quick Literary Check: What Is Situational Irony?", "deepReadText": "Situational Irony happens when the exact OPPOSITE of what everyone expects occurs—like a fire station catching on fire, or a student who boasted about never needing to double-check losing a math contest by forgetting one negative sign!", "videos": [{"id": "6JlxsRlaJiI", "title": "Figurative Language for Middle School (6 Types Explained)", "channel": "Teaching Intentionally", "why": "Clear Grade 7 examples contrasting simile, metaphor, personification, hyperbole, and imagery."}], "quickCheck": {"question": "Identify the figurative language device in: « The winter wind whispered secrets through the frozen pines along the Ottawa River. »", "options": ["Simile", "Personification", "Hyperbole"], "correctIdx": 1, "explanation": "Wind cannot literally 'whisper secrets'—giving a human action to nature is Personification!"}}], "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Roots, Comma Splice Fixes & 5 Figurative Devices", "content": "Strands B & C quick anchors:", "keyPoints": ["Roots: geo (earth), therm (heat), hydro (water), bio (life), struct (build)", "Comma Splice Fixes: Period (.) | Comma + FANBOYS | Semicolon (;)", "Figurative Language: Simile (like/as), Metaphor (direct is), Personification (human action), Hyperbole (exaggeration), Imagery (5 senses)"]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Why Comma Splices Confuse Readers During Editing", "content": "Think of a comma like a quick yellow yield sign—and a period/semicolon like a full red stop sign!", "analogy": "🚦 Traffic Intersection Analogy: Putting only a comma between two full sentences is like letting two speeding buses cross an intersection with no stop sign—they crash into each other! Add a period, semicolon, or `, and / , so`!", "keyPoints": ["Read your paragraph ALOUD during editing: whenever your voice naturally drops to a full stop, check that you used a period (not a comma!)."]}, {"level": 3, "name": "APPLY", "subtitle": "Decode Unknown Academic Words Using Roots + Fix a Run-On", "content": "Practice breaking down a huge science/geography word:", "workedExample": {"prompt": "Decode 'geothermal' and fix: « Geothermal energy comes from underground heat, it never runs out. »", "steps": ["Step 1 (Morphology): `geo` (Earth) + `therm` (heat) + `-al` (relating to) = 'heat from inside the Earth'!", "Step 2 (Fix Comma Splice with Semicolon or FANBOYS): « Geothermal energy comes from underground heat, and it never runs out. » (or use `;`)."]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Telling Sentences vs. Figurative Showing Sentences", "content": "See how figurative devices expand plain sentences:", "comparisonTable": {"headers": ["Plain Sentence", "Upgraded with Figurative Language", "Device Used"], "rows": [["The gym was noisy.", "The gymnasium was a thunderous beehive of squeaking sneakers and cheers.", "Metaphor + Imagery"], ["The buzzer rang loudly.", "The buzzer shrieked like an angry referee ending the quarter.", "Personification + Simile"], ["I waited a long time.", "I waited for an eternity while the clock hands refused to move.", "Hyperbole + Personification"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Edit a Draft Paragraph with 4 Hidden Conventions Errors", "content": "Apply E. Catana's thorough editing eye:", "keyPoints": ["Check every comma: is there a full sentence on BOTH sides? If YES → it's a comma splice! Fix it with `.`, `;`, or `, + FANBOYS`!"]}, {"level": 6, "name": "CREATE", "subtitle": "Craft a Sensory Paragraph Using Simile, Personification & Complex Sentences", "content": "Expand a 1-sentence sports or music memory into rich Grade 7 descriptive prose.", "keyPoints": ["Directly levels up E. Catana's written detail goal!"]}], "questions": [{"id": "eng-u3-q1", "bloomLevel": 5, "bloomTag": "EVALUATE & CREATE", "title": "E. Catana Editing & Style Lab: Roots, Comma Splice Surgery & Figurative Expansion", "prompt": "Complete all 3 Grade 7 Language challenges:\n(a) MORPHOLOGY (WORD ROOTS): Break down the Greek/Latin roots to define these 3 academic words in your own words: (1) `hydroelectric`, (2) `thermometer`, (3) `biodegradable`.\n(b) COMMA SPLICE & RUN-ON SURGERY: Fix this unedited student paragraph using THREE DIFFERENT fixes (1 period, 1 comma + FANBOYS, and 1 semicolon) so zero comma splices remain:\n« Our basketball team trailed by four points in the final minute, we refused to panic, our captain called a smart play we tied the game at the buzzer. »\n(c) FIGURATIVE UPGRADE: Rewrite the boring sentence « The Ottawa winter morning was very cold and windy » into 2 rich sentences using at least ONE Simile (like/as) AND ONE example of Personification!", "step1_deconstruct": {"instruction": "Verify all 3 parts: 3 root definitions in (a), 3 different sentence fixes in (b), and both Simile + Personification in (c).", "guidingQuestions": ["What do `hydro`, `therm`, `meter`, and `bio` mean?", "How many independent clauses are jammed into the run-on in (b)? (4 clauses!)", "What makes a Simile (`like/as`) different from Personification (human action)?"], "modelPlan": "(a) hydro=water, therm+meter=heat measure, bio=life. (b) Fix all 3 joins using `.`, `, but/so`, and `;`. (c) Add a vivid simile (like/as) + human action for the winter wind/snow."}, "step2_anchor": {"instruction": "Strand B & C Anchors:", "referenceItems": ["hydro (water) | therm (heat) | meter (measure) | bio (life)", "FANBOYS: For, And, Nor, But, Or, Yet, So", "Simile = uses 'like/as' | Personification = human verb on non-human object"]}, "step3_substeps": [{"label": "Step 3a: Part (a) — Define `hydroelectric`, `thermometer`, and `biodegradable` using their Greek/Latin roots", "placeholder": "1. hydroelectric = hydro (...) + electric → ...\n2. thermometer = therm (...) + meter (...) → ...\n3. biodegradable = bio (...) + degradable → ...", "hint": "hydro = water, therm = heat, meter = measure, bio = living organisms!", "modelSubAnswer": "1. `hydroelectric`: `hydro` (water) + `electric` → electricity generated by flowing water.\n2. `thermometer`: `therm` (heat) + `meter` (measure) → an instrument that measures heat/temperature.\n3. `biodegradable`: `bio` (life/living organisms) + `degradable` (able to break down) → material that natural living decomposers (bacteria/fungi) can safely break down."}, {"label": "Step 3b: Part (b) — Fix the 4-clause run-on/comma splice using 1 comma+FANBOYS, 1 period, AND 1 semicolon", "placeholder": "Our basketball team trailed by four points in the final minute, but ...", "hint": "Try: '..., yet we refused to panic. Our captain called a smart play; we tied the game at the buzzer!'", "modelSubAnswer": "« Our basketball team trailed by four points in the final minute, yet we refused to panic. Our captain called a smart play; as a result, we tied the game at the buzzer! » (Uses `, yet` [Comma+FANBOYS], a Period `.`, AND a Semicolon `;`!)."}, {"label": "Step 3c: Part (c) — Expand « The Ottawa winter morning was very cold and windy » using 1 Simile AND 1 Personification", "placeholder": "As I stepped outside into the Ottawa morning, the wind...", "hint": "Give the wind a human action (howled, bit, clawed) AND compare the snow/air using 'like' or 'as'!", "modelSubAnswer": "« As I stepped onto Berrigan Drive, the fierce Ottawa wind bit angrily at my cheeks and howled down the empty street. The freezing air stung like a thousand tiny glass needles, while frost painted silver ferns across every car window. » (Personification: 'wind bit angrily/howled', 'frost painted'; Simile: 'stung like a thousand tiny glass needles'!)."}], "step4_checks": ["Did I identify the root meanings (`hydro`, `therm`, `meter`, `bio`) in Part (a)?", "Did I use all 3 required fixes (Comma+FANBOYS, Period, Semicolon) in Part (b) with ZERO leftover comma splices?", "Does Part (c) clearly include BOTH a Simile (`like/as`) AND Personification?"], "step5_modelAnswer": {"basicAnswer": "(a) Water electricity, heat measurer, life breaks down. (b) Added periods and 'but'. (c) The wind bit me like ice.", "expandedAnswer": "Complete E. Catana Editing & Style Exemplar:\n(a) Morphology: `hydroelectric` (`hydro`=water) = electricity made by moving water; `thermometer` (`therm`=heat, `meter`=measure) = device measuring temperature; `biodegradable` (`bio`=life) = waste broken down naturally by living decomposers.\n(b) Corrected Sentence Flow: « Our basketball team trailed by four points in the final minute, yet we refused to panic. Our captain called a smart play; we tied the game right at the buzzer! »\n(c) Figurative Description: « As I walked toward Longfields-Davidson Heights, the January wind clawed hungrily at my coat and whistled through the frozen branches (Personification). Each breath felt as sharp as crushed ice in my lungs (Simile). »", "extensionPrompt": "Bonus Challenge: Turn your Simile in Part (c) into a direct Metaphor by removing 'like' or 'as'!"}}]}, {"id": "eng-u4", "title": "Unit 4 (Ontario 2023 Strands D & A): 5-Paragraph Essay, Show Don't Tell & CRAAP Literacy", "studyFirstTag": "Build a full persuasive essay, write vivid scenes & spot fake info online with C.R.A.A.P.!", "curriculumStrand": "Ontario 2023 Language Strands D (Composition) & A (Digital Media Literacy)", "svgDiagram": "eng_essay_svg", "lessons": [{"id": "eng-u4-l1", "title": "Lesson 4.1: Writing a 5-Paragraph Essay & Narrative 'Show, Don't Tell'", "readTime": "3 min read", "bigIdea": "A 5-Paragraph Essay is just 3 P.E.E.L. paragraphs wrapped inside a sharp Intro and Conclusion—and 'Show, Don't Tell' turns flat stories into movies!", "paragraphs": ["Once you know P.E.E.L. (from Unit 1), writing a full Grade 7 FIVE-PARAGRAPH ESSAY is easy! Paragraph 1 (Introduction) opens with a Hook (surprising fact, vivid scene, or bold question) and ends with your THESIS STATEMENT—one clear sentence stating your claim plus your 3 main reasons! Paragraphs 2, 3, and 4 are simply three P.E.E.L. body paragraphs (one per reason, plus a short counter-argument to prove you thought about the other side!). Paragraph 5 (Conclusion) restates your thesis in fresh words and leaves a memorable Call to Action.", "For NARRATIVE (Story) writing, E. Catana's golden secret for expanding detail is SHOW, DON'T TELL! Instead of telling the reader 'Zaid was excited to win the gym tournament' (boring summary!), SHOW the physical clues, dialogue, and senses: 'Zaid leaped off the hardwood court, pumping his fist as cheers bounced off the gym bleachers. \"We did it!\" he shouted, grinning from ear to ear.'", "Also remember DIALOGUE PUNCTUATION rules when adding speech to stories: put quotation marks around spoken words, place commas/periods INSIDE the closing quotation mark (`\"Pass it left!\" Marco yelled.`), and start a BRAND-NEW paragraph every time a different character starts speaking!"], "keyTakeaway": "5-Paragraph Essay: Hook + Thesis → 3 P.E.E.L. Bodies → Fresh Conclusion | Narrative Writing: Show actions, senses & dialogue instead of telling emotions!", "deepReadTitle": "🔍 Lesson 4.2 Mini-Guide: Evaluating Online Sources with the C.R.A.A.P. Test", "deepReadText": "Before quoting a website or TikTok video in a Grade 7 report (Ontario Strand A Digital Literacy), run C.R.A.A.P.:\n• C — Currency: When was it published/updated? (Is a 2004 tech article outdated?)\n• R — Relevance: Does it actually answer my Grade 7 research question?\n• A — Authority: WHO wrote it? (University scientist / Health Canada / `.gc.ca` vs. anonymous random blog?)\n• A — Accuracy: Are there facts, citations, and evidence—or spelling mistakes and wild rumours?\n• P — Purpose: Is it trying to INFORM objectively, or SELL a product / push biased clickbait?", "videos": [{"id": "cTmQ5xfBEig", "title": "How to Write a Five-Paragraph Essay for Middle School", "channel": "The Real McMomma", "why": "Clear visual layout of Hook, Thesis, 3 Body Paragraphs, and Conclusion."}, {"id": "NWJ_LSjZDgc", "title": "Descriptive Writing — Show, Don't Tell (Narrative Workshop)", "channel": "Writing Workshop Library", "why": "Shows exact transformations from short 'telling' drafts to detailed Grade 7 'showing' scenes."}, {"id": "UST2zJjGQ4I", "title": "Evaluating Online Sources with the C.R.A.A.P. Test", "channel": "Shake Library", "why": "Aligned with Ontario 2023 Strand A Digital Media Literacy fact-checking."}], "quickCheck": {"question": "You find a flashy website claiming 'Energy drinks triple your math test scores!' written by an anonymous author selling $5 energy cans with zero scientific citations. Which TWO C.R.A.A.P. criteria fail immediately?", "options": ["Authority (anonymous seller, not a medical/science expert) & Purpose/Accuracy (trying to sell a product with zero evidence)", "Only Currency", "None—it looks completely trustworthy!"], "correctIdx": 0, "explanation": "C.R.A.A.P. catches biased ads instantly: zero Authority (anonymous marketer), biased Purpose (selling cans), and zero Accuracy (no peer-reviewed studies)!"}}], "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "5-Paragraph Structure, Dialogue Rules & C.R.A.A.P.", "content": "Strands D & A anchors:", "keyPoints": ["5-Paragraph Map: Intro (Hook + 3-Part Thesis) → 3 P.E.E.L. Bodies → Conclusion", "Show, Don't Tell: Physical actions + 5 senses + punctuated dialogue", "C.R.A.A.P.: Currency, Relevance, Authority, Accuracy, Purpose"]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Why a 3-Part Thesis Statement Makes Writing a Full Essay Easy", "content": "Your Thesis Statement is the GPS roadmap for your whole essay!", "analogy": "🗺️ GPS Route Analogy: If your Thesis says, 'Middle schools should expand music programs because playing an instrument boosts math skills, builds teamwork, and reduces stress,' you instantly know the exact topic of Body Paragraph 1 (math), Body Paragraph 2 (teamwork), and Body Paragraph 3 (stress)!", "keyPoints": ["Never start writing Body 1 until your 3-part Thesis is locked in."]}, {"level": 3, "name": "APPLY", "subtitle": "Transform a Flat Telling Sentence into a Vivid Showing Scene", "content": "Apply sensory expansion + dialogue:", "workedExample": {"prompt": "Upgrade: « Leo was nervous before his trombone solo, then he felt proud when he finished. »", "steps": ["Step 1 (Show Nervousness): 'Backstage, Leo's palms felt slick against the cold brass slide, and his heartbeat drummed faster than the percussion section.'", "Step 2 (Show Action & Sound): 'Stepping into the spotlight, he filled his lungs from his diaphragm and released a warm, soaring concert F that echoed across the packed auditorium.'", "Step 3 (Show Pride + Dialogue): 'When applause erupted, Leo lowered his horn with a wide grin. \"Nailed it,\" he whispered.'"]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Reliable Research Sources vs. Unreliable Digital Sources", "content": "Apply C.R.A.A.P. side by side:", "comparisonTable": {"headers": ["Source Type", "Authority & Purpose", "Accuracy Check", "Verdict"], "rows": [["Statistics Canada / Health Canada (`.gc.ca`) or Canadian Encyclopedia", "Verified experts & historians; purpose is public education", "Cites peer-reviewed data & dates", "✅ High Reliability"], ["Sponsored Influencer Post / Anonymous Forum", "Unknown credentials; paid to sell or get viral clicks", "Exaggerated claims, zero citations", "❌ Unreliable — Do NOT Cite!"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Audit Dialogue Punctuation & Essay Organization", "content": "E. Catana thorough editing check:", "keyPoints": ["❌ « \"Watch out for the screen\"! shouted Malik \"pass it here\". »", "✅ Fixed: « \"Watch out for the screen!\" shouted Malik. \"Pass it here!\" » (Exclamation marks/commas sit INSIDE the quotation marks!)."]}, {"level": 6, "name": "CREATE", "subtitle": "Plan a Full 5-Paragraph Essay + Write a 'Show, Don't Tell' Scene", "content": "Combines persuasive architecture, narrative craft, and digital literacy.", "keyPoints": ["Complete Ontario 2023 Language Mastery!"]}], "questions": [{"id": "eng-u4-q1", "bloomLevel": 6, "bloomTag": "EVALUATE & CREATE", "title": "E. Catana Capstone: 5-Paragraph Thesis Builder, 'Show Don't Tell' & C.R.A.A.P. Audit", "prompt": "Complete all 3 Grade 7 Language tasks with expanded detail and thorough editing:\n(a) 5-PARAGRAPH ESSAY INTRO: Write a strong 3-to-4 sentence Introduction (Hook + Context + 3-Part Thesis Statement) for a persuasive essay arguing: 'Should every middle school offer free after-school sports and music clubs?'\n(b) SHOW, DON'T TELL NARRATIVE EXPANSION: Transform this plain 1-sentence draft into a vivid 4-sentence 'Showing' scene with at least 2 sensory details and 1 correctly punctuated line of dialogue:\n« Zaid was really excited when he made the winning basket in gym class. »\n(c) C.R.A.A.P. DIGITAL LITERACY AUDIT: While researching climate change for Geography, you compare Source 1 (an undated blog post by 'CoolGuy99' claiming winter snow proves climate change is fake while selling survival gear) vs. Source 2 (a 2025 Environment Canada `.gc.ca` report with 50-year temperature graphs). Evaluate BOTH using at least 3 letters of C.R.A.A.P.", "step1_deconstruct": {"instruction": "Check all 3 tasks: Hook + 3-Reason Thesis in (a), 4-sentence sensory + dialogue scene in (b), and 3 C.R.A.A.P. criteria in (c).", "guidingQuestions": ["What 3 distinct reasons can anchor my Thesis in (a)? (e.g., health/fitness, peer teamwork, academic focus/confidence)", "In (b), what did Zaid SEE, HEAR, and FEEL instead of writing the word 'excited'?", "Which 3 C.R.A.A.P. letters destroy Source 1 and validate Source 2?"], "modelPlan": "(a) Vivid hook + context + 3-part thesis (physical/mental health, inclusive teamwork, academic engagement). (b) 4-sentence scene showing swish of net, echoing cheers, fist pump, and quoted dialogue. (c) Audit Currency, Authority, Accuracy & Purpose comparing Source 1 vs. Source 2."}, "step2_anchor": {"instruction": "Composition & Digital Literacy Anchors:", "referenceItems": ["Intro Formula: Hook → Background Bridge → Clear 3-Part Thesis Statement", "Show Don't Tell: Zero 'was excited' — use action verbs, sights, sounds & quoted dialogue!", "C.R.A.A.P.: Currency, Relevance, Authority, Accuracy, Purpose"]}, "step3_substeps": [{"label": "Step 3a: Part (a) — Write your Hook + Context + 3-Part Thesis Statement for the 5-paragraph essay", "placeholder": "Imagine a school hallway at 3:15 PM buzzing with...\nEvery middle school should offer free after-school sports and music clubs because they (1)..., (2)..., and (3)...", "hint": "Make sure your final sentence cleanly lists the 3 main reasons that will become Body Paragraphs 1, 2, and 3!", "modelSubAnswer": "Imagine the final school bell ringing at 3:00 PM—instead of heading straight home to stare at glowing screens, hallways echo with bouncing basketballs and warm brass rehearsals. Extracurricular activities are vital for adolescents, yet high registration fees leave many families locked out. Every middle school should fund free after-school sports and music clubs because they strengthen physical and mental health, build inclusive peer teamwork, and boost students' focus and confidence inside the classroom."}, {"label": "Step 3b: Part (b) — Transform « Zaid was excited when he made the winning basket » into 4 vivid 'Showing' sentences with dialogue", "placeholder": "With two seconds left on the gym clock, Zaid bent his knees, snapped his wrist, and watched the orange ball...", "hint": "Use sights/sounds ('swished cleanly', 'sneakers squeaked', 'bleachers erupted') and put punctuation INSIDE quotation marks!", "modelSubAnswer": "With two seconds left on the gym clock, Zaid bent his knees, snapped his wrist in a crisp follow-through, and watched the basketball arc high under the fluorescent lights. Swish! The ball sliced cleanly through the white nylon net just before the buzzer blared. Teammates rushed across the polished hardwood, slapping high-fives while cheers bounced off the rafters. \"Best comeback of the year!\" Zaid grinned, catching his breath."}, {"label": "Step 3c: Part (c) — Evaluate Source 1 vs. Source 2 using 3 C.R.A.A.P. criteria", "placeholder": "1. Currency: ...\n2. Authority: ...\n3. Accuracy & Purpose: ...", "hint": "Contrast undated/anonymous/selling gear (Source 1) vs. 2025/Environment Canada scientists/50-year data (Source 2)!", "modelSubAnswer": "1. Currency: Source 2 is current and dated (2025), whereas Source 1 is undated, making it impossible to verify if its claims are up to date.\n2. Authority: Source 2 comes from verified climate scientists at Environment Canada (`.gc.ca`), while Source 1 is written by an anonymous username ('CoolGuy99') with zero scientific credentials.\n3. Accuracy & Purpose: Source 2 backs its objective educational purpose with 50-year temperature data graphs, whereas Source 1 confuses one day of weather with long-term climate and has a biased commercial purpose—selling survival gear! Therefore, only Source 2 passes the C.R.A.A.P. test."}], "step4_checks": ["Does Part (a) include a Hook AND a clear 3-reason Thesis Statement?", "Did Part (b) AVOID flat telling words ('was excited') and put punctuation INSIDE quotation marks?", "Did Part (c) evaluate BOTH Source 1 and Source 2 across at least 3 C.R.A.A.P. criteria?"], "step5_modelAnswer": {"basicAnswer": "(a) Schools should have free clubs because they are healthy, fun, and build teamwork. (b) Zaid shot the ball, made it, and yelled 'Yes!' (c) Source 2 is a real 2025 government website with graphs; Source 1 is anonymous and selling stuff.", "expandedAnswer": "Complete Grade 7+ Language Exemplar (E. Catana Level 4+ Standard):\n(a) Essay Introduction: Imagine the final bell ringing—instead of empty halls and hours of passive scrolling, the gym thrums with energy and the music room rings with brass melodies. Although extracurriculars help middle schoolers thrive, steep fees exclude many students. Every middle school must offer free after-school sports and music clubs because they improve physical and mental health, foster inclusive peer teamwork, and strengthen classroom focus.\n(b) Show, Don't Tell Scene: With two seconds left, Zaid squared his shoulders, released a high-arcing shot, and held his follow-through. Swish! The ball dropped cleanly through the net as the buzzer echoed off the cinderblock walls. Teammates sprinted over, high-fiving across the shining hardwood floor. \"We actually pulled it off!\" Zaid shouted, beaming as he wiped sweat from his brow.\n(c) C.R.A.A.P. Audit: Source 2 (2025 Environment Canada `.gc.ca`) passes Currency (2025), Authority (government scientists), Accuracy (50-year data), and Purpose (public education). Source 1 fails all four: it is undated, anonymous ('CoolGuy99'), scientifically inaccurate, and commercially biased toward selling survival gear.", "extensionPrompt": "Editing Check: Re-read your Part (b) scene aloud—can you upgrade one more verb (like 'walked' or 'said') into an even sharper action verb?"}}]}], "friendlySub": "Complete Ontario 2023 English: P.E.E.L., Roots, Editing, Essays & Digital Literacy", "accent": "#db2777"}, {"id": "science", "code": "SNC7 / Science & Tech 7", "name": "Science and Technology", "teacher": "D. Forbes (DF)", "status": "Progressing Well", "tier": "Tier 2: Push to Very Well", "tierClass": "tier-strong", "icon": "🔬", "reportComment": "Zaid demonstrates a solid understanding of the Particle Theory and Pure Substances & Mixtures, usually explaining concepts accurately. (DF)", "nextSteps": ["Move from 'usually explaining accurately' to 'always explaining with 100% scientific precision'", "Connect the 5 Postulates of the Particle Theory to Pure Substances, Mixtures, Concentration, and Heat Transfer", "Master upcoming Ontario Grade 7 strands: Heat in the Environment, Form & Function of Structures, and Interactions in Ecosystems"], "units": [{"id": "sci-u1", "title": "Unit 1: Particle Theory of Matter, Pure Substances & Mixtures (+ Heat & Structures Preview)", "curriculumStrand": "Ontario Grade 7 Science & Technology: Matter and Energy (Strand C) + Earth/Space (Strand E) & Structures (Strand D)", "svgDiagram": "science_particle_svg", "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "The 5 Postulates of the Particle Theory of Matter & Matter Classification", "content": "Whenever D. Forbes asks a 'Why?' question in Chemistry or Heat, the answer always comes back to the 5 Rules of the Particle Theory:", "keyPoints": ["⚛️ Rule
