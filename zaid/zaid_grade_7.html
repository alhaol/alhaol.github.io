<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zaid's Grade 7 Study Cards — Ontario Curriculum</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --surface: #ffffff;
      --surface-soft: #eef2f8;
      --text: #0f172a;
      --text-body: #2d3b4e;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-soft: #eff6ff;
      --success: #059669;
      --success-soft: #ecfdf5;
      --warning: #d97706;
      --warning-soft: #fffbeb;
      --danger: #dc2626;
      --danger-soft: #fef2f2;
      --purple: #7c3aed;
      --purple-soft: #f5f3ff;
      --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.05);
      --shadow-card: 0 12px 32px rgba(15, 23, 42, 0.08);
      --radius: 20px;
    }
    body.dark {
      --bg: #0b1120;
      --surface: #141e33;
      --surface-soft: #1e2b45;
      --text: #f8fafc;
      --text-body: #e2e8f0;
      --text-muted: #94a3b8;
      --border: #25344d;
      --border-strong: #374a6a;
      --primary: #60a5fa;
      --primary-hover: #3b82f6;
      --primary-soft: rgba(59, 130, 246, 0.22);
      --success: #34d399;
      --success-soft: rgba(16, 185, 129, 0.2);
      --warning: #fbbf24;
      --warning-soft: rgba(245, 158, 11, 0.2);
      --danger: #f87171;
      --danger-soft: rgba(239, 68, 68, 0.2);
      --purple: #c4b5fd;
      --purple-soft: rgba(167, 139, 250, 0.2);
      --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.3);
      --shadow-card: 0 14px 36px rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.68;
      min-height: 100vh;
    }
    button, input, textarea, select {
      font-family: inherit;
      color: inherit;
    }

    /* Smooth Card-Opening Animations (crisp transform without fading text out!) */
    @keyframes cardOpen {
      from { opacity: 0.72; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes sheetSlide {
      from { opacity: 0.8; transform: translateY(14px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .anim-card {
      animation: cardOpen 0.16s ease-out forwards;
    }

    /* Whisper-Quiet Top Bar (Adapts automatically in Focus Mode!) */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    body.dark .topbar {
      background: rgba(20, 30, 51, 0.92);
    }
    .brand-trigger {
      display: flex;
      align-items: center;
      gap: 10px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text);
      font-weight: 800;
      font-size: 1rem;
    }
    .brand-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, #2563eb, #06b6d4);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 0.92rem;
    }
    .focus-center-title {
      font-weight: 700;
      font-size: 0.92rem;
      color: var(--text-muted);
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Clean Buttons */
    .btn {
      background: var(--surface);
      color: var(--text);
      border: 1.5px solid var(--border-strong);
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.16s ease;
      text-decoration: none;
    }
    .btn:hover {
      border-color: var(--primary);
      background: var(--primary-soft);
      transform: translateY(-1px);
    }
    .btn-primary {
      background: #2563eb;
      border-color: #2563eb;
      color: #fff;
    }
    .btn-primary:hover { background: #1d4ed8; border-color: #1d4ed8; color: #fff; }
    .btn-success {
      background: #059669;
      border-color: #059669;
      color: #fff;
    }
    .btn-success:hover { background: #047857; border-color: #047857; color: #fff; }
    .btn-lg {
      padding: 13px 22px;
      font-size: 0.98rem;
      font-weight: 700;
      border-radius: 14px;
    }
    .btn-soft {
      background: var(--surface-soft);
      border-color: transparent;
      color: var(--text-body);
    }
    .btn-soft:hover {
      background: var(--surface);
      border-color: var(--border-strong);
    }

    /* Page Containers */
    .wrap-home {
      max-width: 1020px;
      margin: 0 auto;
      padding: 28px 20px 80px;
    }
    .wrap-focus {
      max-width: 740px;
      margin: 0 auto;
      padding: 24px 18px 90px;
    }

    /* ========================================
       HOME: CLEAN START CARD + INTERACTIVE SUBJECT CARDS
       ======================================== */
    .hero {
      background: linear-gradient(135deg, #2563eb 0%, #0891b2 100%);
      color: #fff;
      border-radius: 24px;
      padding: 28px 32px;
      margin-bottom: 30px;
      box-shadow: 0 14px 32px rgba(37, 99, 235, 0.22);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    .hero h1 { font-size: 1.7rem; font-weight: 800; margin-bottom: 6px; }
    .hero p { font-size: 0.98rem; opacity: 0.93; margin-bottom: 18px; max-width: 540px; }
    .hero-btn {
      background: #fff;
      color: #1d4ed8;
      border: none;
      padding: 13px 24px;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
      transition: transform 0.16s ease;
    }
    .hero-btn:hover { transform: translateY(-2px); }
    .hero-ring {
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 18px;
      padding: 16px 24px;
      text-align: center;
      min-width: 170px;
    }
    .hero-ring-num { font-size: 1.9rem; font-weight: 900; line-height: 1.1; }
    .hero-ring-sub { font-size: 0.78rem; opacity: 0.9; }

    .group-label {
      font-size: 1.1rem;
      font-weight: 800;
      margin: 24px 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .group-label span.sub { font-size: 0.84rem; font-weight: 500; color: var(--text-muted); }

    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    @media (max-width: 820px) { .grid-3 { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 600px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }

    .subject-card {
      background: var(--surface);
      color: var(--text);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 22px;
      cursor: pointer;
      text-align: left;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .subject-card:hover {
      transform: translateY(-4px);
      border-color: var(--primary);
      box-shadow: var(--shadow-card);
    }
    .subject-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .emoji-box {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: var(--surface-soft);
      display: grid;
      place-items: center;
      font-size: 1.55rem;
    }
    .pill-tag {
      font-size: 0.72rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 999px;
      text-transform: uppercase;
    }
    .pill-urgent { background: var(--danger-soft); color: var(--danger); }
    .pill-core { background: var(--success-soft); color: var(--success); }
    .pill-extra { background: var(--warning-soft); color: var(--warning); }

    .subject-card h3 { font-size: 1.14rem; font-weight: 800; }
    .subject-card p { font-size: 0.87rem; color: var(--text-muted); flex: 1; }
    .prog-track { height: 7px; background: var(--surface-soft); border-radius: 999px; overflow: hidden; margin-top: 6px; }
    .prog-fill { height: 100%; background: var(--success); border-radius: 999px; transition: width 0.3s ease; }

    /* ========================================
       COURSE SCREEN: EXPANDABLE UNIT CARDS
       ======================================== */
    .unit-accordion {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }
    .unit-acc-header {
      width: 100%;
      background: none;
      border: none;
      padding: 20px 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      text-align: left;
      color: var(--text);
    }
    .unit-acc-header:hover { background: var(--surface-soft); }
    .unit-acc-body {
      padding: 0 20px 20px;
      border-top: 1px solid var(--border);
      padding-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .card-tile {
      width: 100%;
      background: var(--surface-soft);
      color: var(--text);
      border: 1.5px solid transparent;
      border-radius: 15px;
      padding: 15px 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      text-align: left;
      transition: all 0.16s ease;
    }
    .card-tile:hover {
      background: var(--surface);
      border-color: var(--primary);
      transform: translateX(3px);
      box-shadow: var(--shadow-sm);
    }
    .tile-left { display: flex; align-items: center; gap: 14px; }
    .tile-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
      border: 1.5px solid var(--border-strong);
      display: grid;
      place-items: center;
      font-size: 1.05rem;
      font-weight: 800;
      flex-shrink: 0;
    }
    .tile-icon.done { background: #059669; border-color: #059669; color: #fff; }
    .tile-title { font-weight: 700; font-size: 0.96rem; color: var(--text); display: block; }
    .tile-sub { font-size: 0.8rem; color: var(--text-muted); display: block; }

    /* ========================================
       FOCUSED SINGLE-TASK CARD PLAYER
       (1 Task Only: READ | WATCH | CHECK | SOLVE)
       ======================================== */
    .mode-pills {
      display: flex;
      gap: 8px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      padding: 6px;
      border-radius: 16px;
      margin-bottom: 18px;
      box-shadow: var(--shadow-sm);
    }
    .mode-pill {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 11px 10px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.16s ease;
    }
    .mode-pill.active {
      background: #2563eb;
      color: #fff;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    }

    .focus-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 24px;
      padding: 32px 34px;
      box-shadow: var(--shadow-card);
    }
    @media (max-width: 600px) {
      .focus-card { padding: 22px 18px; }
    }
    .card-kicker {
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--primary);
      margin-bottom: 8px;
      display: block;
    }
    .card-heading {
      font-size: 1.48rem;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 18px;
    }
    .big-idea {
      background: var(--primary-soft);
      border-left: 4px solid var(--primary);
      padding: 14px 18px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 22px;
    }
    .prose p {
      font-size: 1.08rem;
      line-height: 1.85;
      color: var(--text-body);
      margin-bottom: 18px;
    }
    .takeaway {
      background: var(--success-soft);
      border: 1.5px solid var(--success);
      border-radius: 14px;
      padding: 14px 18px;
      margin: 20px 0 8px;
      font-size: 0.96rem;
    }

    /* Quick Bonus Cards Strip (Opens a clean Pop-Up Card!) */
    .bonus-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 18px;
    }

    /* Video Theater Card */
    .video-stage {
      margin-bottom: 18px;
    }
    .yt-poster {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      background-size: cover;
      background-position: center;
      border: 1.5px solid var(--border);
    }
    .yt-poster-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.36);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background 0.16s ease;
    }
    .yt-poster:hover .yt-poster-overlay { background: rgba(15, 23, 42, 0.18); }
    .yt-play-circle {
      background: #dc2626;
      color: #fff;
      font-weight: 800;
      font-size: 1.05rem;
      padding: 14px 26px;
      border-radius: 999px;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.38);
    }
    .yt-iframe-wrap {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      height: 0;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
    }
    .yt-iframe-wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* Quick Check Options */
    .qc-choice {
      width: 100%;
      text-align: left;
      background: var(--surface-soft);
      border: 2px solid transparent;
      color: var(--text);
      padding: 15px 18px;
      border-radius: 14px;
      margin-top: 10px;
      cursor: pointer;
      font-size: 0.98rem;
      font-weight: 500;
      transition: all 0.15s ease;
    }
    .qc-choice:hover { border-color: var(--primary); background: var(--surface); }
    .qc-choice.correct {
      background: var(--success-soft);
      border-color: var(--success);
      color: var(--success);
      font-weight: 700;
    }
    .qc-choice.wrong {
      background: var(--danger-soft);
      border-color: var(--danger);
      color: var(--danger);
    }
    .qc-result {
      margin-top: 14px;
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 0.95rem;
    }
    .qc-result.ok { background: var(--success-soft); color: var(--success); }
    .qc-result.err { background: var(--danger-soft); color: var(--danger); }

    /* Stepper Dots (Question Solver & Bloom's) */
    .step-dots {
      display: flex;
      gap: 6px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .step-dot {
      flex: 1;
      min-width: 82px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      color: var(--text-muted);
      padding: 9px 6px;
      border-radius: 12px;
      font-size: 0.82rem;
      font-weight: 700;
      text-align: center;
      cursor: pointer;
    }
    .step-dot.active { background: #2563eb; border-color: #2563eb; color: #fff; }
    .step-dot.done { background: var(--success-soft); border-color: var(--success); color: var(--success); }

    .work-area {
      width: 100%;
      min-height: 130px;
      background: var(--surface-soft);
      color: var(--text);
      border: 2px solid var(--border-strong);
      border-radius: 14px;
      padding: 15px 18px;
      font-family: inherit;
      font-size: 1rem;
      line-height: 1.65;
      resize: vertical;
      margin: 12px 0;
    }
    .work-area::placeholder { color: var(--text-muted); opacity: 1; }
    .work-area:focus { outline: none; border-color: var(--primary); background: var(--surface); }

    .check-tile {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      background: var(--surface-soft);
      color: var(--text);
      border: 1.5px solid var(--border);
      padding: 14px 16px;
      border-radius: 14px;
      margin-bottom: 10px;
      cursor: pointer;
      font-size: 0.96rem;
    }
    .check-tile input {
      width: 22px;
      height: 22px;
      margin-top: 2px;
      accent-color: var(--success);
      flex-shrink: 0;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 28px;
      padding-top: 18px;
      border-top: 1.5px solid var(--border);
      gap: 12px;
      flex-wrap: wrap;
    }

    /* Clean Pop-Up Card Modal (For Diagrams, Cheat Sheets, Hints, Study Tools!) */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.58);
      backdrop-filter: blur(4px);
      z-index: 300;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }
    .modal-backdrop.open { display: flex; }
    .modal-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 24px;
      max-width: 680px;
      width: 100%;
      max-height: 86vh;
      overflow-y: auto;
      padding: 26px 28px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.3);
      animation: sheetSlide 0.2s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .modal-head h3 { font-size: 1.15rem; font-weight: 800; }

    .info-box {
      background: var(--surface-soft);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 12px;
      font-size: 0.94rem;
      white-space: pre-line;
    }
    .big-idea {
      background: var(--primary-soft);
      color: var(--text);
      border-left: 4px solid var(--primary);
      padding: 14px 18px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 22px;
    }
    .takeaway {
      background: var(--success-soft);
      color: var(--text);
      border: 1.5px solid var(--success);
      border-radius: 14px;
      padding: 14px 18px;
      margin: 20px 0 8px;
      font-size: 0.96rem;
    }
    .comp-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; color: var(--text); }
    .comp-table th, .comp-table td { border: 1px solid var(--border-strong); padding: 10px; text-align: left; color: var(--text); }
    .comp-table th { background: var(--surface-soft); color: var(--text); }
    .audio-btn {
      width: 100%;
      text-align: left;
      background: var(--primary-soft);
      border: 1.5px solid var(--primary);
      color: var(--text);
      padding: 11px 14px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.94rem;
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .topic-svg { width: 100%; height: auto; border-radius: 12px; display: block; }
    .comp-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    .comp-table th, .comp-table td { border: 1px solid var(--border-strong); padding: 10px; text-align: left; }
    .comp-table th { background: var(--surface-soft); }
    .inline-code {
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      background: var(--surface-soft);
      border: 1px solid var(--border);
      padding: 1px 6px;
      border-radius: 6px;
      font-size: 0.92em;
      font-weight: 700;
      color: var(--primary);
    }

    .meter-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: -4px;
      margin-bottom: 12px;
      padding: 8px 12px;
      background: var(--surface-soft);
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    .meter-good { color: var(--success); font-weight: 700; }
    .meter-warn { color: var(--warning); font-weight: 700; }
    .badge-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }
    .skill-badge {
      background: var(--surface-soft);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 12px;

  <script>
    const COURSES = [{"id": "french", "code": "FSF1D / Core French 7", "name": "Core French", "teacher": "N. Bishop (NB)", "status": "Progressing With Difficulty", "tier": "Tier 1: Priority Focus", "tierClass": "tier-urgent", "icon": "🗣️", "reportComment": "Zaid is sometimes using common phrases, vocabulary and adjectives in everyday activities. He is rarely able to recognize new and familiar words in various texts and apply vocabulary correctly when speaking and writing. Zaid is encouraged to participate fully in class assignments and activities to help better his understanding. Referring to anchor charts, dictionaries and other resource tools will help. (NB)", "nextSteps": ["Use the French Anchor Chart & Visual Dictionary before guessing or skipping words", "Spot 'Mots-Amis' (cognates) and familiar root words in French reading passages", "Match adjectives to noun gender (masculine/feminine) and number (singular/plural)", "Practice speaking & writing complete everyday sentences about school, gym, and cafeteria"], "units": [{"id": "fr-u1", "title": "Unit 1: Word Recognition, 'Mots-Amis' & Everyday School Vocabulary", "curriculumStrand": "Ontario Grade 7 Core French: Reading Comprehension (C1) & Everyday Oral/Written Communication (A1, B1, D1)", "svgDiagram": "french_decode_svg", "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Recall Core School, Gym & Cafeteria Vocabulary (Click 🔊 to Hear)", "content": "Before reading or writing a French text, anchor yourself with the most frequent everyday words used in Grade 7 class:", "keyPoints": ["🏫 School Places: le gymnase (the gym), la cafétéria (the cafeteria), la salle de classe (the classroom), la bibliothèque (the library), le couloir (the hallway)", "📚 School Items & Subjects: les mathématiques (math), les sciences (science), la géographie (geography), la musique (music), l'éducation physique (PE/gym), le trombone (trombone)", "🗣️ Everyday Action Verbs: je suis (I am), j'ai (I have), j'aime (I like), je préfère (I prefer), je joue (I play), je mange (I eat), je travaille (I work), j'écoute (I listen)", "🔗 Connector Words: parce que (because), mais (but), avec (with), après (after), pendant (during), toujours (always), souvent (often)"], "frenchAudioSamples": ["Bonjour! Je m'appelle Zaid et je suis en septième année.", "Mon endroit préféré à l'école est le gymnase et la grande cafétéria.", "Je joue du trombone dans la classe de musique.", "Je travaille avec mes amis et je vérifie mon dictionnaire."]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Explain How the 3-Step Word Recognition Strategy Works", "content": "When you see a French paragraph with unfamiliar words, DO NOT freeze or skip it! Think of reading French like reading a defensive play in gym class: look for what you already recognize first.", "analogy": "🏀 Gym & Trombone Connection: In basketball or soccer, you don't need to watch every blade of grass—you read key cues (where your teammates and the ball are). In French, 40% of words look almost identical to English! These are called 'Mots-Amis' (Friendly Words / Cognates).", "keyPoints": ["Clue #1 — Mots-Amis (Cognates): Words that look like English: 'la cafétéria', 'le trombone', 'excellent', 'différent', 'important', 'la musique', 'le sport', 'actif'.", "Clue #2 — Word Families & Prefixes: If you know 'ami' (friend), then 'amical' means friendly. If you know 'sport', then 'sportif' means athletic.", "Clue #3 — Context & Anchor Chart Check: Look at the verb and the words around the mystery word, then check your Anchor Chart drawer."]}, {"level": 3, "name": "APPLY", "subtitle": "Decode a French Paragraph Step-by-Step Using Anchor Tools", "content": "Let's apply the 3-Step Decoding Method to a short text about a Grade 7 student at Longfields-Davidson Heights:", "workedExample": {"prompt": "Read & Decode: « Pendant la pause à l'école, Zaid retrouve ses amis dans la grande cafétéria. Après le dîner, il participe activement aux activités sportives dans le gymnase parce qu'il est très énergique et coopératif. »", "steps": ["Step 1 (Spot Mots-Amis): 'pause' (pause/break), 'grande cafétéria' (large cafeteria), 'participe activement' (participates actively), 'activités sportives' (sports activities), 'gymnase' (gym), 'énergique' (energetic), 'coopératif' (cooperative).", "Step 2 (Recognize High-Frequency Everyday Words): 'Pendant' (during), 'à l'école' (at school), 'ses amis' (his friends), 'Après le dîner' (after lunch), 'parce qu'il est' (because he is).", "Step 3 (Full Meaning Unlocked): 'During break at school, Zaid meets his friends in the large cafeteria. After lunch, he actively participates in sports activities in the gym because he is very energetic and cooperative.'"]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Masculine vs. Feminine & Singular vs. Plural Adjective Patterns", "content": "In English, adjectives never change ('a tall boy', 'a tall girl', 'tall friends'). In French, adjectives are chameleons—they change their endings to match the noun they describe!", "comparisonTable": {"headers": ["Pattern Rule", "Masculine Singular (le / un / il)", "Feminine Singular (la / une / elle)", "Plural (les / ils / elles)"], "rows": [["Standard Rule (+e, +s)", "grand (tall/big), intelligent", "grande (+e), intelligente (+e)", "grands (+s) / grandes (+es)"], ["Ends in -e already", "calme, énergique, rapide", "calme (no change!)", "calmes (+s), énergiques (+s)"], ["Ends in -f -> -ve", "sportif (athletic), actif, créatif", "sportive (-f becomes -ve)", "sportifs / sportives"], ["Ends in -eux -> -euse", "curieux (curious), respectueux", "curieuse (-eux becomes -euse)", "curieux / curieuses"], ["BAGS Adjectives (Go BEFORE noun)", "un grand gymnase, un bon ami", "une grande cafétéria, une bonne idée", "de grands gymnases, de bons amis"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Audit & Fix Common French Writing Mistakes (N. Bishop's Checklist)", "content": "Before handing in French classwork to N. Bishop, evaluate sentences using the 3-Point French Accuracy Audit:", "keyPoints": ["❌ Flawed Draft: « J'aime le grand cafétéria parce que je suis sportive et j'écoute le musique. »", "🔍 Error Audit 1 (Noun Gender): 'cafétéria' and 'musique' are feminine ('la cafétéria', 'la musique'), so 'le' must be 'la', and 'grand' must agree as 'grande'.", "🔍 Error Audit 2 (Speaker Gender): Since Zaid is a boy ('il'), 'sportive' (feminine) must be 'sportif' (masculine).", "✅ Corrected Version: « J'aime la grande cafétéria parce que je suis sportif et j'écoute la musique. »"]}, {"level": 6, "name": "CREATE", "subtitle": "Compose an Original 4-Sentence French Self-Portrait Using Anchor Charts", "content": "Synthesize everyday verbs, school nouns, connector words ('parce que', 'avec'), and agreed adjectives to write a complete French paragraph about your favourite activities, your friends, and your goals in Grade 7.", "keyPoints": ["Sentence 1 (Identity & Personality): « Je m'appelle Zaid et je suis un élève curieux, coopératif et sportif. »", "Sentence 2 (Favourite School Places): « À l'école, j'aime la grande cafétéria et le gymnase moderne. »", "Sentence 3 (Subjects & Music): « J'aime aussi les mathématiques difficiles et je joue bien du trombone. »", "Sentence 4 (Collaborative Goal): « En classe, je travaille respectueusement avec mes camarades et j'utilise mon dictionnaire. »"]}], "questions": [{"id": "fr-q1", "bloomLevel": 4, "bloomTag": "ANALYZE & APPLY", "title": "Deep Multi-Step French Reading & Decoding Challenge", "prompt": "Read the following French text carefully:\n« Le mardi matin, Zaid arrive dans la classe de sciences. Il est très curieux et il pose des questions intéressantes sur les mélanges et les particules. Pendant le travail en groupe, il partage ses idées avec ses camarades. Ensuite, dans la classe de français, il consulte l'affiche de référence et le dictionnaire pour écrire des phrases complètes. »\n\nAnswer in deep multi-step work: (1) Identify 6 'Mots-Amis' (cognates), (2) Decode the 3 unfamiliar phrases ('le travail en groupe', 'partage ses idées', 'l'affiche de référence'), and (3) Explain in English AND French what Zaid does to succeed in French class.", "step1_deconstruct": {"instruction": "STOP & PLAN: Before translating or guessing, break the prompt into its 3 required targets and scan the text for familiar roots.", "guidingQuestions": ["How many sentences are in the French passage? (4 sentences)", "Which words look almost identical to English words (Mots-Amis)?", "What are the 3 specific outputs required in my final answer?"], "modelPlan": "Target 1: Extract 6 cognates (sciences, curieux, questions, intéressantes, particules, groupe, idées, français, consulte, référence, dictionnaire, phrases, complètes). Target 2: Use context & anchor chart to decode the 3 target phrases. Target 3: Write a complete explanation in English and a complete sentence in French."}, "step2_anchor": {"instruction": "ANCHOR CHART LOOKUP: Match the key French verbs and nouns from the passage using your Anchor Tool.", "referenceItems": ["poser des questions = to ask questions (Warning: 'poser' here means to ask, not to pose for a photo!)", "les mélanges = mixtures (connects to Science: Pure Substances & Mixtures!)", "partager (il partage) = to share (he shares)", "une affiche de référence = an anchor chart / reference poster", "avec ses camarades = with his classmates / peers"]}, "step3_substeps": [{"label": "Step 3a: List at least 6 'Mots-Amis' (French word = English meaning) from the passage", "placeholder": "Example: 1. sciences = science, 2. curieux = curious...", "hint": "Look for words in the passage that share 70%+ of their letters with English!", "modelSubAnswer": "1. sciences = science | 2. curieux = curious | 3. questions intéressantes = interesting questions | 4. particules = particles | 5. groupe = group | 6. idées = ideas | 7. dictionnaire = dictionary | 8. phrases complètes = complete sentences."}, {"label": "Step 3b: Decode the 3 target phrases using context clues and the Anchor Chart", "placeholder": "1. le travail en groupe = ...\n2. partage ses idées = ...\n3. l'affiche de référence = ...", "hint": "Use 'travail' (work), 'partage' (shares), and 'affiche' (poster/chart).", "modelSubAnswer": "1. « le travail en groupe » = group work (working in a group).\n2. « partage ses idées » = shares his ideas.\n3. « l'affiche de référence » = the anchor chart / reference poster on the classroom wall."}, {"label": "Step 3c: Summarize the passage in English AND write 1 complete French sentence answering: 'Que fait Zaid pour réussir en français?' (What does Zaid do to succeed in French?)", "placeholder": "English Summary: ...\nFrench Sentence: Pour réussir en français, Zaid consulte...", "hint": "Start your French sentence with: « Pour réussir en français, Zaid consulte... et utilise... »", "modelSubAnswer": "English Summary: On Tuesday morning, Zaid arrives in science class. He is very curious and asks interesting questions about mixtures and particles. During group work, he shares his ideas with his classmates. Next, in French class, he checks the anchor chart and dictionary to write complete sentences.\n\nFrench Response: « Pour réussir en français, Zaid consulte l'affiche de référence et utilise le dictionnaire pour écrire des phrases complètes. »"}], "step4_checks": ["Did I list at least 6 Mots-Amis with their English meanings?", "Did I accurately translate all 3 target phrases ('group work', 'shares his ideas', 'anchor chart')?", "Did I check the verb ending on 'Zaid consulte' / 'Zaid utilise' (singular 3rd person ends in -e)?"], "step5_modelAnswer": {"basicAnswer": "Zaid is in science and French class. He shares ideas and uses a dictionary.", "expandedAnswer": "Part 1 (6+ Mots-Amis): sciences (science), curieux (curious), questions intéressantes (interesting questions), particules (particles), groupe (group), idées (ideas), dictionnaire (dictionary), phrases complètes (complete sentences).\n\nPart 2 (Phrase Decoding):\n• « le travail en groupe » = group work\n• « partage ses idées » = shares his ideas\n• « l'affiche de référence » = the anchor chart\n\nPart 3 (Full Comprehension & French Written Response):\nOn Tuesday morning, Zaid shows curiosity in science class by asking interesting questions about mixtures and particles, and he collaborates by sharing ideas during group work. In French class, he succeeds by checking the classroom anchor chart and dictionary.\n• French Sentence: « Pour réussir dans la classe de français, Zaid consulte l'affiche de référence et le dictionnaire pour écrire des phrases complètes et précises. »", "extensionPrompt": "Extension Challenge (Bloom Level 6): Rewrite the last sentence in the 1st person ('Je') and add two adjectives describing how you feel when you finish your French work!"}}, {"id": "fr-q2", "bloomLevel": 6, "bloomTag": "EVALUATE & CREATE", "title": "Adjective Agreement & Sentence Expansion Lab (BAGS & Descriptive Detail)", "prompt": "N. Bishop wants you to apply vocabulary and adjectives accurately in writing. Take these 3 short, broken French fragments and transform them into 3 rich, grammatically correct sentences with proper adjective agreement and 'parce que' explanations:\nFragment A: (Je / être / sportif + créatif) -> explain why using gym or art.\nFragment B: (La cafétéria / être / grand + animé) -> explain what you do there with friends.\nFragment C: (Mes amis / être / respectueux + coopératif) -> explain how you work together in class.", "step1_deconstruct": {"instruction": "STOP & PLAN: Identify the subject gender and number for each fragment (A, B, C) before choosing the verb 'être' conjugation and adjective endings.", "guidingQuestions": ["Fragment A: Subject is 'Je' (Zaid = masculine singular). What form of 'être' goes with 'Je'?", "Fragment B: Subject is 'La cafétéria' (feminine singular!). How do 'grand' and 'animé' change?", "Fragment C: Subject is 'Mes amis' (masculine plural!). What form of 'être' and what plural endings apply?"], "modelPlan": "A: Je suis (masc. sing. -> sportif, créatif). B: La cafétéria est (fem. sing. -> grande, animée). C: Mes amis sont (masc. plural -> respectueux, coopératifs). Each sentence will be expanded with 'parce que' or 'et'."}, "step2_anchor": {"instruction": "ANCHOR CHART LOOKUP: Verb 'ÊTRE' (To Be) + Adjective Agreement Rules.", "referenceItems": ["Verb ÊTRE: Je suis (I am) | Tu es (You are) | Il/Elle est (He/She/It is) | Nous sommes (We are) | Vous êtes (You all are) | Ils/Elles sont (They are)", "Fem. Singular Rule: Add -e (grand -> grande, animé -> animée)", "Masc. Plural Rule: Add -s (coopératif -> coopératifs; note 'respectueux' already ends in -x so it stays 'respectueux'!)"]}, "step3_substeps": [{"label": "Step 3a: Build & Expand Sentence A (Je + être + sportif/créatif + because clause)", "placeholder": "Je suis sportif et créatif parce que j'aime...", "hint": "Use 'Je suis sportif et créatif parce que j'adore l'éducation physique et les arts visuels.'", "modelSubAnswer": "« Je suis sportif et créatif parce que j'adore jouer au basketball dans le gymnase et créer des projets dans la classe d'arts visuels. »"}, {"label": "Step 3b: Build & Expand Sentence B (La cafétéria + être + grande/animée + activity with friends)", "placeholder": "La cafétéria de mon école est grande et animée...", "hint": "Remember feminine singular endings: grande (+e) and animée (+e)!", "modelSubAnswer": "« La cafétéria de mon école est très grande et animée, et j'aime parler et manger avec mes amis pendant le dîner. »"}, {"label": "Step 3c: Build & Expand Sentence C (Mes amis + être + respectueux/coopératifs + group work detail)", "placeholder": "Mes amis sont respectueux et coopératifs quand...", "hint": "Use 'Mes amis sont' (they are) + 'coopératifs' (with an -s!).", "modelSubAnswer": "« Mes amis sont respectueux et coopératifs quand nous travaillons ensemble et partageons nos idées en classe. »"}], "step4_checks": ["Did I conjugate 'être' correctly in all 3 sentences (suis, est, sont)?", "Did I add feminine '-e' to 'grande' and 'animée' to match 'La cafétéria'?", "Did I add plural '-s' to 'coopératifs' to match 'Mes amis'?", "Did I expand each sentence with a second clause ('parce que', 'et', 'quand')?"], "step5_modelAnswer": {"basicAnswer": "Je suis sportif. La cafétéria est grande. Mes amis sont coopératifs.", "expandedAnswer": "Complete Expanded French Paragraph (Level 4+ Standard):\n« A. Je suis un élève sportif et créatif parce que j'adore participer aux activités dans le gymnase et explorer les éléments du design en art.\nB. La cafétéria de notre école est très grande et animée, et j'aime discuter avec mes camarades pendant la pause.\nC. Mes amis sont toujours respectueux et coopératifs quand nous travaillons en groupe et partageons nos idées en classe. »", "extensionPrompt": "Extension Challenge: Click the 🔊 Read Aloud button or practice reading your 3 expanded sentences aloud twice, focusing on pronouncing the 'd' in 'grande' (which is silent in masculine 'grand'!)."}}], "studyFirstTag": "Start Here: 3-Step Word Decoding + School & Gym French", "lessons": [{"id": "fr-u1-l1", "title": "Lesson 1.1: How to Read French Without Freezing (The 3-Step Decoder)", "readTime": "3 min read", "bigIdea": "You already know hundreds of French words! Nearly 40% of French words are 'Mots-Amis' (cognates) that look and mean almost the same thing as English.", "paragraphs": ["When you open a French worksheet in N. Bishop's class and see a whole paragraph in French, your first instinct might be to stop at the first hard word. Instead, good French readers scan the WHOLE sentence like a detective looking for clues.", "First, highlight every Mot-Ami (friendly cognate). Words like 'la cafétéria', 'le gymnase', 'les mathématiques', 'curieux', 'coopératif', 'important', and 'différent' practically translate themselves! Just spotting those words unlocks half the meaning immediately.", "Second, circle the high-frequency glue words you see every day: 'je suis' (I am), 'j'ai' (I have), 'il est' (he is), 'avec' (with), 'parce que' (because), and 'après' (after). Third, for the 2 or 3 mystery words left over, open your Anchor Chart or French dictionary instead of guessing."], "keyTakeaway": "Never translate word-by-word from left to right. Scan for (1) Mots-Amis, (2) Everyday Glue Words, then (3) Anchor Chart Lookup.", "deepReadTitle": "📖 Practice Mini-Story to Read Aloud (Tap 🔊 inside)", "deepReadText": "« Bonjour! Je m'appelle Zaid. À mon école, Longfields-Davidson Heights, j'aime beaucoup la grande cafétéria et le gymnase moderne. Pendant la classe de sciences, je pose des questions intéressantes sur les particules. En français, je consulte mon dictionnaire pour comprendre les nouveaux mots! »", "quickCheck": {"question": "In the mini-story above, what does « je consulte mon dictionnaire pour comprendre les nouveaux mots » mean?", "options": ["I close my dictionary when I see hard words.", "I check my dictionary to understand the new words.", "I write a dictionary for my friends."], "correctIdx": 1, "explanation": "'consulte' (Mot-Ami = consult/check), 'dictionnaire' (dictionary), 'comprendre' (understand), 'nouveaux mots' (new words)!"}, "videos": [{"id": "CzpvKy6Ub7s", "title": "French Cognates & Faux Amis: Boost Your Vocabulary Fast!", "channel": "Monsieur Martin - French Teacher", "why": "See how Mots-Amis let you decode French paragraphs right away."}]}, {"id": "fr-u1-l2", "title": "Lesson 1.2: School Life Vocabulary & Chameleon Adjectives", "readTime": "3 min read", "bigIdea": "In French, every noun is either Masculine (le/un) or Feminine (la/une), and adjectives change their endings to match!", "paragraphs": ["In English, the word 'big' never changes: a big gym, a big cafeteria, big classrooms. In French, adjectives behave like chameleons—they match both the gender (masculine/feminine) and number (singular/plural) of the noun they describe.", "For most adjectives, add '-e' for feminine and '-s' for plural: 'un grand gymnase' (masculine) becomes 'une grande cafétéria' (feminine), and 'des amis intelligents' (plural). Watch out for two special patterns used all the time in Grade 7: words ending in '-f' change to '-ve' (sportif → sportive, actif → active), and words ending in '-eux' change to '-euse' (curieux → curieuse).", "Where do adjectives go? Most French adjectives go AFTER the noun ('un élève curieux', 'une classe intéressante'). Only short 'BAGS' adjectives (Beauty, Age, Goodness, Size—like bon, grand, petit, nouveau) go BEFORE the noun ('la grande cafétéria')."], "keyTakeaway": "Always check the noun's article ('le/un' vs 'la/une' vs 'les/des') before adding the ending to your adjective.", "deepReadTitle": "📝 Everyday School Word Bank (Read & Review)", "deepReadText": "• le gymnase (m) = gym  |  • la cafétéria (f) = cafeteria  |  • la salle de classe (f) = classroom\n• les amis / les camarades = friends / classmates  |  • l'affiche de référence (f) = anchor chart\n• sportif/sportive = athletic  |  • curieux/curieuse = curious  |  • coopératif/coopérative = cooperative", "quickCheck": {"question": "Since 'la cafétéria' is feminine singular, how do you write 'the big cafeteria' in French?", "options": ["le grand cafétéria", "la grande cafétéria", "la grands cafétéria"], "correctIdx": 1, "explanation": "'cafétéria' is feminine ('la'), so 'grand' adds '-e' to become 'grande', and because it is a Size (BAGS) adjective, it goes BEFORE the noun: 'la grande cafétéria'!"}, "videos": [{"id": "tuHdTQonl1c", "title": "French Adjective Agreement Basics (Masculine, Feminine & Plural)", "channel": "Sheilagh Riordan", "why": "Clear visual breakdown of adding -e, -s, and matching noun gender."}]}]}, {"id": "fr-u2", "title": "Unit 2: Verbs (Être, Avoir, Aller, Faire), Questions & Francophone Canada", "curriculumStrand": "Ontario Grade 7 Core French: Speaking (B1, B2), Writing (D1, D2) & Intercultural Understanding", "svgDiagram": "french_decode_svg", "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "The Big 4 Irregular Verbs (Être, Avoir, Aller, Faire) + Question Words", "content": "Master these 4 essential verbs and 6 question words to build any everyday sentence in N. Bishop's class:", "keyPoints": ["⚡ ÊTRE (To Be): je suis, tu es, il/elle est, nous sommes, vous êtes, ils/elles sont", "⚡ AVOIR (To Have): j'ai, tu as, il/elle a, nous avons, vous avez, ils/elles ont", "⚡ ALLER (To Go): je vais, tu vas, il/elle va, nous allons, vous allez, ils/elles vont (e.g., Je vais au gymnase!)", "⚡ FAIRE (To Do / Make / Play): je fais, tu fais, il/elle fait, nous faisons, vous faites, ils/elles font (e.g., Je fais du sport!)", "❓ Question Starters: Qui (Who), Quoi / Qu'est-ce que (What), Où (Where), Quand (When), Pourquoi (Why -> answered with 'parce que'!), Comment (How)."], "frenchAudioSamples": ["Où vas-tu après le cours de mathématiques? Je vais au gymnase!", "Qu'est-ce que tu fais pendant le week-end? Je fais du sport avec mes amis.", "Pourquoi aimes-tu la musique? Parce que j'adore jouer du trombone!"]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "How 'ALLER + Infinitive' Expresses the Future (Le Futur Proche)", "content": "You don't need complicated future verb endings to talk about your goals in French! Just combine ALLER (present tense) + any full verb (infinitive ending in -er, -ir, -re):", "analogy": "🏀 Gym Playbook Analogy: Just like saying 'I am going to pass the ball' in English, in French you say « Je vais passer le ballon » (Je vais = I am going + passer = to pass).", "keyPoints": ["Formula: Subject + ALLER (vais/vas/va/allons/allez/vont) + Infinitive Verb", "Example 1 (French Goal): « Je vais utiliser mon dictionnaire en classe. » (I am going to use my dictionary in class.)", "Example 2 (Gym Goal): « Nous allons pratiquer le basketball dans le gymnase. » (We are going to practice basketball in the gym.)"]}, {"level": 3, "name": "APPLY", "subtitle": "Use Prepositions 'au / à la / aux' & 'du / de la / des' Correctly", "content": "When connecting 'aller' (to go to) or 'faire / jouer' (to play/do) with school places, music, or sports, apply these contraction rules:", "workedExample": {"prompt": "Combine 'Je vais' (I go to), 'Je joue' (I play), and 'Je fais' (I do) with masculine/feminine nouns:", "steps": ["Rule 1 — ALLER + Place: à + le = AU (Je vais au gymnase) | à + la = À LA (Je vais à la cafétéria) | à + les = AUX.", "Rule 2 — JOUER + Sport/Game (à): jouer + à + le = AU (Je joue au basketball, je joue au soccer).", "Rule 3 — JOUER + Musical Instrument (de): jouer + de + le = DU (Je joue du trombone!)."]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Francophone Traditions Across Ontario, Quebec & Acadia", "content": "Analyze key cultural celebrations in Grade 7 Ontario Core French:", "comparisonTable": {"headers": ["Region", "Celebration / Tradition", "Key French Vocabulary", "Cultural Significance"], "rows": [["Franco-Ontarian (Ottawa / Eastern ON)", "Jour des Franco-Ontariens (Sept 25) & Festival Franco-Ontarien", "le drapeau vert et blanc, le trille, la communauté", "Celebrates Franco-Ontarian heritage right here in the Ottawa region!"], ["Québec", "Le Carnaval de Québec (Winter Carnival)", "Bonhomme Carnaval, la ceinture fléchée, le palais de glace, la tire sur la neige", "World's largest winter festival celebrating resilience and winter sports"], ["Acadie (Maritime Provinces)", "La Fête nationale de l'Acadie (Aug 15) & Tintamarre", "le Tintamarre (joyful noise parade), l'étoile jaune, le fricot", "Celebrates Acadian survival and identity since 1604/1755"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Audit Verb & Preposition Errors in Student Sentences", "content": "Check these 3 common preposition and verb traps before submitting French speaking/writing tasks:", "keyPoints": ["❌ Trap 1: « Je vais à le gymnase. » -> ✅ Fix: Mandatory contraction! 'à + le' ALWAYS becomes 'au': « Je vais au gymnase. »", "❌ Trap 2: « Je joue au trombone. » -> ✅ Fix: Sports use 'au', but musical instruments use 'du': « Je joue du trombone et je joue au basketball. »", "❌ Trap 3: « Je va étudier. » -> ✅ Fix: 'Je' takes 'vais' (Il/Elle takes 'va'): « Je vais étudier mes mots de vocabulaire. »"]}, {"level": 6, "name": "CREATE", "subtitle": "Write a 4-Exchange French Dialogue Using Questions, Futur Proche & Prepositions", "content": "Create a natural conversation between Zaid and a classmate planning lunch in the cafeteria and intramurals in the gym.", "keyPoints": ["Include at least 2 question words (Où, Qu'est-ce que, Pourquoi), 1 Futur Proche verb (Je vais + infinitive), and proper contractions (au, à la, du)."]}], "questions": [{"id": "fr-u2-q1", "bloomLevel": 5, "bloomTag": "APPLY & CREATE", "title": "French Conversation & Futur Proche Builder (School, Gym & Trombone)", "prompt": "Write a complete 3-part French response to a new Francophone student visiting Longfields-Davidson Heights I.S.:\n(a) Answer their question « Où vas-tu pendant le dîner et après l'école? » using 'Je vais au...' and 'Je vais à la...'.\n(b) Explain which sport AND which musical instrument you play using the correct contractions ('Je joue au...' vs. 'Je joue du...').\n(c) State 2 personal goals for this term using the Futur Proche ('Je vais + infinitive verb')—one for French class and one for gym!", "step1_deconstruct": {"instruction": "STOP & PLAN: Check the required verb and preposition for each of the 3 parts (a, b, c).", "guidingQuestions": ["Part (a): 'la cafétéria' is feminine ('à la') and 'le gymnase' is masculine ('au'). How do I form the sentence?", "Part (b): Which preposition goes with sports ('au') vs. instruments ('du')?", "Part (c): How do I form the Futur Proche ('Je vais' + infinitive verb)?"], "modelPlan": "(a) Use 'Pendant le dîner, je vais à la grande cafétéria, et après l'école, je vais au gymnase.' (b) Use 'Je joue au basketball/soccer et je joue du trombone.' (c) Use 'Je vais consulter le dictionnaire' and 'Je vais améliorer mon endurance.'"}, "step2_anchor": {"instruction": "ANCHOR CHART LOOKUP: Contractions & Futur Proche.", "referenceItems": ["à + le = au (au gymnase) | à + la = à la (à la cafétéria)", "jouer au + sport (jouer au basketball) | jouer du + instrument (jouer du trombone)", "Futur Proche = Je vais + infinitive (utiliser, participer, pratiquer, vérifier)"]}, "step3_substeps": [{"label": "Step 3a: Part (a) — Write where you go during lunch and after school in French", "placeholder": "Pendant le dîner, je vais à la... et après l'école, je vais au...", "hint": "Use 'à la grande cafétéria avec mes amis' and 'au gymnase'.", "modelSubAnswer": "« Pendant le dîner, je vais à la grande cafétéria avec mes amis, et après l'école, je vais au gymnase. »"}, {"label": "Step 3b: Part (b) — Write which sport AND which musical instrument you play", "placeholder": "À l'école, je joue au ... et dans la classe de musique, je joue du ...", "hint": "Remember: 'au basketball' (sport) and 'du trombone' (instrument)!", "modelSubAnswer": "« Dans le gymnase, je joue au basketball et au soccer avec mes camarades, et dans la classe de musique, je joue du trombone. »"}, {"label": "Step 3c: Part (c) — Write 2 goals using 'Je vais + infinitive' (French goal + Gym goal)", "placeholder": "En français, je vais ... et en éducation physique, je vais ...", "hint": "Use 'Je vais utiliser l'affiche de référence et le dictionnaire' and 'Je vais pratiquer mes habiletés sportives'.", "modelSubAnswer": "« Ce trimestre, dans la classe de français, je vais utiliser l'affiche de référence et le dictionnaire pour écrire des phrases complètes. En éducation physique, je vais pratiquer mes habiletés sportives et améliorer mon endurance! »"}], "step4_checks": ["Did I use 'à la cafétéria' (feminine) and 'au gymnase' (masculine contraction)?", "Did I distinguish 'je joue au [sport]' from 'je joue du trombone'?", "Did I use 'je vais + infinitive verb (-er/-ir/-re)' for both goals in Part (c)?"], "step5_modelAnswer": {"basicAnswer": "Je vais à la cafétéria et au gymnase. Je joue au basketball et du trombone. Je vais étudier le français.", "expandedAnswer": "Complete Grade 7+ French Response (N. Bishop Oral & Written Standard):\n« (a) Pendant le dîner, je vais à la grande cafétéria pour manger et discuter avec mes amis, et après les cours, je vais au gymnase.\n(b) J'adore faire du sport : je joue souvent au basketball et au soccer, et dans la classe de musique, je joue du trombone.\n(c) Pour réussir ce trimestre, je vais consulter l'affiche de référence et le dictionnaire dans la classe de français, et je vais pratiquer activement pour atteindre mon objectif personnel dans le gymnase! »", "extensionPrompt": "Speaking Extension: Click the 🔊 button in the French Anchor Chart drawer and read your 3 sentences aloud with clear liaison!"}}], "studyFirstTag": "Next: Big 4 Verbs (Être/Avoir/Aller/Faire) + Talking About Future Goals", "lessons": [{"id": "fr-u2-l1", "title": "Lesson 2.1: The Big 4 Action Verbs & Contractions (au / à la / du)", "readTime": "3 min read", "bigIdea": "Mastering ÊTRE, AVOIR, ALLER, and FAIRE lets you talk about where you go, what you play, and what you plan to do.", "paragraphs": ["Four irregular verbs do 80% of the heavy lifting in everyday Grade 7 French: ÊTRE (to be), AVOIR (to have), ALLER (to go), and FAIRE (to do/make). For example: 'Je suis actif' (I am active), 'J'ai un trombone' (I have a trombone), 'Je vais au gymnase' (I go to the gym), and 'Je fais du sport' (I play/do sports).", "Notice the word 'au' in 'Je vais au gymnase'. In French, you are NEVER allowed to say 'à le'! Whenever 'à' meets 'le', they fuse together into 'au'. With feminine nouns, 'à la' stays separate ('Je vais à la cafétéria').", "Here is a Grade 7 favourite rule for sports vs. music: When you play a SPORT or GAME, use 'jouer + à' → 'Je joue au basketball' (à + le = au). When you play a MUSICAL INSTRUMENT, use 'jouer + de' → 'Je joue du trombone' (de + le = du)!"], "keyTakeaway": "Remember the golden pair: 'Je joue AU basketball' (sport) vs. 'Je joue DU trombone' (instrument).", "deepReadTitle": "🚀 Talking About the Future (Le Futur Proche)", "deepReadText": "To describe your goals or weekend plans, simply put ALLER (je vais / nous allons) right before any full action verb:\n• « Je vais vérifier mon travail. » (I am going to check my work.)\n• « Je vais utiliser le dictionnaire. » (I am going to use the dictionary.)\n• « Nous allons jouer au soccer après l'école. » (We are going to play soccer after school.)", "quickCheck": {"question": "Which sentence correctly says 'I play trombone and I go to the gym'?", "options": ["Je joue au trombone et je vais à le gymnase.", "Je joue du trombone et je vais au gymnase.", "Je joue de le trombone et je vais à la gymnase."], "correctIdx": 1, "explanation": "Instruments use 'du' (de + le = du trombone), and 'à + le gymnase' contracts to 'au gymnase'!"}, "videos": [{"id": "84olv0BM4oY", "title": "Être & Avoir (French Essentials Lesson 10)", "channel": "Learn French With Alexa", "why": "Master the two most important verbs in Grade 7 French."}, {"id": "S80DXgd-i2s", "title": "Learn French: Know the Futur Proche with Aller Under 5 Minutes", "channel": "Learn French With Alexa", "why": "Talk about your school and gym goals in the future tense."}]}]}, {"id": "fr-u3", "title": "Unit 3: Regular Verbs (-ER, -IR, -RE) & The Negation Sandwich (ne...pas)", "studyFirstTag": "Build accurate present-tense sentences and say what you DO and DO NOT do", "curriculumStrand": "Ontario Grade 7 Core French: Writing Conventions (D2) & Oral Interaction (B1)", "svgDiagram": "french_tenses_svg", "lessons": [{"id": "fr-u3-l1", "title": "Lesson 3.1: Mastering Regular -ER, -IR & -RE Verbs in the Present Tense", "readTime": "3 min read", "bigIdea": "Once you learn one simple ending pattern for -ER verbs, you unlock over 80% of all verbs in the French language!", "paragraphs": ["In French, regular verbs come in three families based on their last two letters: -ER (the giant group: parler, jouer, aimer, écouter, étudier, travailler, partager), -IR (finir, choisir, réussir), and -RE (vendre, répondre, attendre).", "To conjugate ANY regular -ER verb, chop off the '-er' to find the stem (parler → parl-) and add the 6 magic endings: Je = -e, Tu = -es, Il/Elle = -e, Nous = -ons, Vous = -ez, Ils/Elles = -ent. Fun pronunciation secret: the '-e', '-es', and '-ent' endings are completely SILENT when you speak!", "For -IR verbs like 'finir' (to finish — a super useful verb for finishing classwork!), chop off '-ir' and add: -is, -is, -it, -issons, -issez, -issent ('Je finis mes devoirs' = I finish my homework; 'Nous réussissons' = We succeed!). For -RE verbs like 'répondre' (to answer), chop off '-re' and add: -s, -s, (nothing!), -ons, -ez, -ent ('Il répond à la question')."], "keyTakeaway": "-ER endings: -e, -es, -e, -ons, -ez, -ent | -IR endings: -is, -is, -it, -issons, -issez, -issent | -RE endings: -s, -s, –, -ons, -ez, -ent.", "deepReadTitle": "📝 Grade 7 School Action Verb Bank (Click 🔊 to Hear)", "deepReadText": "• Je participe activement en classe. (I participate actively in class.)\n• Nous partageons nos idées avec le groupe. (We share our ideas with the group.)\n• Je finis tout mon travail de géographie. (I finish all my geography work.)\n• Je réponds respectueusement quand le professeur m'appelle. (I answer respectfully when the teacher calls on me.)", "videos": [{"id": "j3gqgpxxtqI", "title": "Group 1 Regular French Verbs Ending in -ER (Present Tense)", "channel": "Learn French With Alexa", "why": "Crystal-clear walkthrough of the #1 French verb pattern used in Grade 7 writing."}], "quickCheck": {"question": "How do you correctly conjugate 'finir' (to finish) and 'partager' (to share) for 'Je' and 'Nous'?", "options": ["Je finir et nous partager.", "Je finis mon travail et nous partageons nos idées.", "Je finissons mon travail et nous partagent nos idées."], "correctIdx": 1, "explanation": "'finir' with 'Je' takes '-is' (Je finis), and 'partager' with 'Nous' takes '-eons' (Nous partageons — keeping the soft 'g' sound)!"}}, {"id": "fr-u3-l2", "title": "Lesson 3.2: The French Negation Sandwich (ne...pas, ne...jamais)", "readTime": "3 min read", "bigIdea": "To make ANY French sentence negative ('not', 'never', 'no longer'), wrap 'ne' and 'pas' like two slices of bread around the verb!", "paragraphs": ["In English, making a sentence negative uses helper words like 'do not' or 'does not'. French is actually much cleaner—it uses a two-part sandwich around the conjugated verb: NE goes right BEFORE the verb, and PAS goes right AFTER the verb! Example: « Je parle » (I speak) → « Je ne parle pas » (I do not speak).", "Watch out for the Vowel Magnet Rule: whenever the verb starts with a vowel (a, e, i, o, u) or silent 'h' (like 'aime', 'écoute', 'oublie', 'ai'), 'ne' shortens to n'! So « J'aime les devoirs » becomes « Je n'aime pas les devoirs », and « J'oublie mon dictionnaire » becomes « Je n'oublie jamais mon dictionnaire » (I never forget my dictionary!).", "You can swap 'pas' for other negative toppings to sound like a Grade 7 pro: 'ne ... jamais' (never), 'ne ... plus' (no longer / not anymore), and 'ne ... rien' (nothing). And if you have two verbs (like 'Je vais parler'), wrap the sandwich around the FIRST conjugated verb ONLY: « Je ne vais pas oublier! »"], "keyTakeaway": "Wrap NE (or N' before vowels) + [CONJUGATED VERB] + PAS / JAMAIS / PLUS like a sandwich!", "deepReadTitle": "🥪 Negation Sandwich Examples (Tap 🔊 to Practice)", "deepReadText": "• Je ne crie pas en classe; je lève la main! (I do not shout out in class; I raise my hand!)\n• Je n'oublie jamais mon affiche de référence. (I never forget my anchor chart.)\n• Il ne va pas manquer le match de basketball. (He is not going to miss the basketball game.)", "videos": [{"id": "sgr9wgYAejs", "title": "French Made Easy: Simple Negations in French (ne...pas, ne...jamais)", "channel": "Learn French With Alexa", "why": "Shows exactly where to place ne...pas and ne...jamais in everyday sentences."}], "quickCheck": {"question": "How do you turn « J'oublie mon dictionnaire » into 'I NEVER forget my dictionary'?", "options": ["Je ne jamais oublie mon dictionnaire.", "Je n'oublie jamais mon dictionnaire.", "Je oublie ne jamais mon dictionnaire."], "correctIdx": 1, "explanation": "Because 'oublie' starts with a vowel ('o'), 'ne' becomes 'n'' right before the verb, and 'jamais' sits right after the verb!"}}], "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Regular Verb Endings & Negation Sandwiches", "content": "Anchor the 3 regular verb patterns and the 3 negative wrappers:", "keyPoints": ["• -ER (parler, jouer, étudier): -e, -es, -e, -ons, -ez, -ent", "• -IR (finir, réussir): -is, -is, -it, -issons, -issez, -issent", "• -RE (répondre, vendre): -s, -s, –, -ons, -ez, -ent", "• Negation: ne/n' + [verb] + pas (not) / jamais (never) / plus (no longer)"]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Why French Negation Uses Two Parts Around the Conjugated Verb", "content": "Think of 'ne...pas' like two teammates trapping the ball-carrier in basketball.", "analogy": "🏀 Gym Double-Team Analogy: One defender ('ne') stands in front of the verb and the second defender ('pas' or 'jamais') stands right behind the verb. Nothing sneaks between 'ne' and the verb!", "keyPoints": ["In 'Je ne vais pas jouer', 'vais' is the conjugated verb, so the sandwich wraps around 'vais', NOT 'jouer'!"]}, {"level": 3, "name": "APPLY", "subtitle": "Convert Positive School Sentences into Negative Statements", "content": "Follow the 3-step conjugation + negation check:", "workedExample": {"prompt": "Translate: 'We do not forget our anchor charts, and I always finish my math.'", "steps": ["Step 1 (Conjugate 'oublier' for Nous): Nous oublions → starts with vowel 'o', so use n'...pas: « Nous n'oublions pas nos affiches de référence. »", "Step 2 (Conjugate 'finir' for Je): Je finis → « et je finis toujours mes mathématiques. »", "Step 3 (Verify endings): -ons matches Nous; -is matches Je!"]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare -ER, -IR, and -RE Stem Changes", "content": "Spot the exact differences across all 3 regular verb groups:", "comparisonTable": {"headers": ["Pronoun", "-ER (étudier)", "-IR (finir)", "-RE (répondre)"], "rows": [["Je", "j'étudie", "je finis", "je réponds"], ["Tu", "tu étudies", "tu finis", "tu réponds"], ["Il / Elle", "il étudie", "il finit", "il répond"], ["Nous", "nous étudions", "nous finissons", "nous répondons"], ["Ils / Elles", "ils étudient", "ils finissent", "ils répondent"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Spot 3 Classic French Verb & Negation Mistakes", "content": "Audit this draft before submitting to N. Bishop:", "keyPoints": ["❌ « Je ne aime pas les erreurs et nous finir le projet. »", "🔧 Fix 1: 'ne aime' must elide to 'n'aime' (vowel clash!).", "🔧 Fix 2: 'nous finir' was never conjugated — change to 'nous finissons'!", "✅ Fixed: « Je n'aime pas les erreurs et nous finissons le projet. »"]}, {"level": 6, "name": "CREATE", "subtitle": "Write a 3-Sentence French Classroom Success Pledge", "content": "Combine 1 -ER verb, 1 -IR verb, and 1 negative sandwich ('ne...jamais' or 'ne...pas') describing your habits in class.", "keyPoints": ["Example: « En classe, j'écoute attentivement, je finis toujours mon travail et je n'oublie jamais de vérifier mes réponses! »"]}], "questions": [{"id": "fr-u3-q1", "bloomLevel": 5, "bloomTag": "APPLY & EVALUATE", "title": "Regular Verbs & Negation Sandwich Builder (Classroom & Gym Habits)", "prompt": "Transform these 3 prompts into complete, accurate French sentences using the Anchor Chart:\n(a) Use 'finir' (-IR) and 'vérifier' (-ER) with 'Je' to say: 'I finish my geography work and I double-check my answers.'\n(b) Use 'partager' (-ER) and 'répondre' (-RE) with 'Nous' to say: 'We share our ideas in a group and we answer the questions.'\n(c) Use the Negation Sandwich ('ne...pas' or 'ne...jamais') with 'oublier' (starts with a vowel!) and 'parler' to say: 'I never forget my dictionary and I do not talk during instruction.'", "step1_deconstruct": {"instruction": "Identify the verb family (-ER, -IR, -RE) and check if any verb starts with a vowel!", "guidingQuestions": ["In (a), what ending does 'finir' take with 'Je'?", "In (b), what special spelling keeps the soft 'g' in 'nous partageons'?", "In (c), how does 'ne' change before 'oublie'?"], "modelPlan": "(a) Je finis (-is) + je vérifie (-e). (b) Nous partageons (-eons) + nous répondons (-ons). (c) Je n'oublie jamais (n' before vowel!) + je ne parle pas."}, "step2_anchor": {"instruction": "Check verb endings and negation order:", "referenceItems": ["Je finis (finir) | Je vérifie (vérifier)", "Nous partageons (partager) | Nous répondons (répondre)", "Vowel rule: ne + oublie → n'oublie jamais!"]}, "step3_substeps": [{"label": "Step 3a: Write Sentence (a) in French (Je + finir + vérifier)", "placeholder": "Je finis mon travail de géographie et je vérifie...", "hint": "Use 'mes réponses' for 'my answers'!", "modelSubAnswer": "« Je finis mon travail de géographie et je vérifie mes réponses. »"}, {"label": "Step 3b: Write Sentence (b) in French (Nous + partager + répondre)", "placeholder": "Nous partageons nos idées en groupe et nous...", "hint": "'répondre aux questions' = to answer the questions -> 'nous répondons aux questions'.", "modelSubAnswer": "« Nous partageons nos idées en groupe et nous répondons aux questions. »"}, {"label": "Step 3c: Write Sentence (c) using the Negation Sandwich (n'oublie jamais + ne parle pas)", "placeholder": "Je n'oublie jamais mon dictionnaire et je ne...", "hint": "Wrap 'ne' and 'pas' right around 'parle' ('pendant les explications' = during instruction).", "modelSubAnswer": "« Je n'oublie jamais mon dictionnaire et je ne parle pas pendant les explications. »"}], "step4_checks": ["Did I conjugate 'finir' as 'Je finis' (not 'Je finir')?", "Did I spell 'Nous partageons' with an 'e' and 'Nous répondons' with '-ons'?", "Did I change 'ne' to 'n'' before 'oublie' ('Je n'oublie jamais')?"], "step5_modelAnswer": {"basicAnswer": "Je finis le travail. Nous répondons. Je n'oublie pas.", "expandedAnswer": "Complete Grade 7+ French Sentences:\n(a) « Je finis tout mon travail de géographie et je vérifie attentivement mes réponses. »\n(b) « Nous partageons respectueusement nos idées en groupe et nous répondons aux questions. »\n(c) « Je n'oublie jamais mon dictionnaire et je ne parle pas pendant les explications du professeur. »", "extensionPrompt": "Speaking Bonus: Say Sentence (c) aloud twice—notice how 'n'oublie' glides smoothly together!"}}]}, {"id": "fr-u4", "title": "Unit 4: Passé Composé with AVOIR (Talking About Yesterday & Past Events)", "studyFirstTag": "Tell stories about what you DID in gym, music, or on the weekend", "curriculumStrand": "Ontario Grade 7 Core French: Past Tense Communication (B1, D1, D2)", "svgDiagram": "french_tenses_svg", "lessons": [{"id": "fr-u4-l1", "title": "Lesson 4.1: How to Build the Passé Composé (AVOIR + Past Participle)", "readTime": "3 min read", "bigIdea": "To talk about something that already happened ('I played', 'I finished', 'I ate'), French uses a 2-piece teamwork formula: AVOIR + Past Participle!", "paragraphs": ["Notice the name: Passé (Past) Composé (Composed of TWO pieces!). Piece #1 is the helping verb AVOIR conjugated in the present tense: j'ai, tu as, il/elle a, nous avons, vous avez, ils/elles ont. Piece #2 is the Past Participle of the action verb.", "Making regular Past Participles is super easy—just swap the ending of the verb: -ER verbs change to -é (jouer → joué, manger → mangé, étudier → étudié); -IR verbs change to -i (finir → fini, choisir → choisi, réussir → réussi); and -RE verbs change to -u (vendre → vendu, répondre → répondu)!", "Put Piece #1 and Piece #2 together and you are instantly telling stories in the past: « Hier, j'ai joué au basketball dans le gymnase » (Yesterday, I played basketball in the gym), « Nous avons fini le laboratoire de sciences » (We finished the science lab), and « J'ai réussi mon quiz de géographie! » (I passed my geography quiz!)."], "keyTakeaway": "Passé Composé = AVOIR (j'ai / il a / nous avons) + Past Participle (-er → -é | -ir → -i | -re → -u). Never forget the helper verb AVOIR!", "deepReadTitle": "⚡ Top 5 Irregular Past Participles + Negation in the Past", "deepReadText": "• faire (to do/make) → J'ai fait (I did/made)\n• voir (to see) → J'ai vu (I saw)\n• prendre (to take) → J'ai pris (I took)\n• lire (to read) → J'ai lu (I read)\n• écrire (to write) → J'ai écrit (I wrote)\n🥪 Negative Past Sandwich: Wrap 'ne...pas' around AVOIR ONLY! Example: « Je n'ai pas oublié mes devoirs! » (I did not forget my homework!)", "videos": [{"id": "Y67chASdUCE", "title": "Learn French: Know the Passé Composé with Avoir Under 5 Minutes", "channel": "Learn French With Alexa", "why": "Fast, crystal-clear visual formula for forming the past tense with AVOIR."}], "quickCheck": {"question": "How do you say 'Yesterday, I played trombone and I finished my homework' in Passé Composé?", "options": ["Hier, je joué du trombone et je fini mes devoirs.", "Hier, j'ai joué du trombone et j'ai fini mes devoirs.", "Hier, je suis jouer du trombone et j'ai finir mes devoirs."], "correctIdx": 1, "explanation": "Passé Composé ALWAYS needs BOTH pieces: AVOIR ('j'ai') + Past Participle ('joué' from -er, 'fini' from -ir)!"}}], "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "The 2-Piece Passé Composé Formula", "content": "Never drop Piece #1 (AVOIR) when writing in the past tense!", "keyPoints": ["Piece 1 (AVOIR): j'ai, tu as, il/elle a, nous avons, vous avez, ils/elles ont", "Piece 2 (Participle): -ER → -é | -IR → -i | -RE → -u", "Time Markers: hier (yesterday), la semaine dernière (last week), ce matin (this morning)"]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Why 'J'ai joué' Translates as Both 'I played' and 'I have played'", "content": "English has two ways to talk about completed past actions, while everyday French uses Passé Composé for both.", "analogy": "🎺 Trombone Two-Hand Rule: You need your left hand to hold the trombone steady (AVOIR) and your right hand to move the slide to the note (Past Participle). Both hands work together!", "keyPoints": ["Without AVOIR, 'je joué' is incomplete—always check for BOTH pieces!"]}, {"level": 3, "name": "APPLY", "subtitle": "Convert Present Tense Sentences into Yesterday's Past Tense", "content": "Follow the 2-step conversion:", "workedExample": {"prompt": "Change to Past Tense: « Aujourd'hui, nous étudions les cartes et je fais un dessin. »", "steps": ["Step 1: Replace 'Aujourd'hui' with 'Hier' (Yesterday).", "Step 2: 'nous étudions' → 'nous avons étudié' (AVOIR + -é).", "Step 3: 'je fais' → 'j'ai fait' (AVOIR + irregular participle 'fait'). Result: « Hier, nous avons étudié les cartes et j'ai fait un dessin. »"]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Present vs. Futur Proche vs. Passé Composé", "content": "Look how clean all three Grade 7 French tenses are side by side:", "comparisonTable": {"headers": ["Tense", "Formula", "Example with 'jouer'", "Time Word"], "rows": [["Passé Composé (Past)", "AVOIR + -é/-i/-u", "J'ai joué au soccer.", "Hier (Yesterday)"], ["Présent (Now)", "Stem + -e/-es/-e...", "Je joue au soccer.", "Maintenant (Now)"], ["Futur Proche (Future)", "ALLER + infinitive", "Je vais jouer au soccer.", "Demain (Tomorrow)"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Catch the #1 Passé Composé Error (Forgetting AVOIR or Putting 'pas' in the Wrong Spot)", "content": "Fix these two student errors:", "keyPoints": ["❌ « Hier, je mangé à la cafétéria et je n'ai oublié pas mon livre. »", "✅ Fixed: « Hier, j'ai mangé à la cafétéria et je n'ai pas oublié mon livre. » (Added 'ai', wrapped n'...pas around 'ai'!)."]}, {"level": 6, "name": "CREATE", "subtitle": "Write a 3-Sentence Past-Tense Diary Entry About Your School Day", "content": "Use at least 1 -ER participle, 1 -IR participle, and 1 irregular participle (fait, vu, pris, lu, écrit).", "keyPoints": ["Use 'Hier' or 'Ce matin' to anchor the timeline!"]}], "questions": [{"id": "fr-u4-q1", "bloomLevel": 5, "bloomTag": "APPLY & CREATE", "title": "Yesterday's School Journal in Passé Composé (Gym, Cafeteria & Class)", "prompt": "Write 3 complete French sentences in the Passé Composé telling N. Bishop what you did yesterday ('Hier'):\n(a) Say that you ate lunch with your friends in the cafeteria ('manger') and played basketball in the gym ('jouer').\n(b) Say that you finished your math problems ('finir') and wrote a detailed paragraph in English ('écrire' → irregular participle 'écrit'!).\n(c) Write ONE negative past sentence saying you did NOT forget your anchor chart ('oublier').", "step1_deconstruct": {"instruction": "Check both pieces of Passé Composé for every verb (AVOIR + Past Participle).", "guidingQuestions": ["What are the past participles of manger, jouer, finir, écrire, and oublier?", "Where do 'n'' and 'pas' go in a negative Passé Composé sentence?"], "modelPlan": "(a) J'ai mangé + j'ai joué. (b) J'ai fini + j'ai écrit. (c) Je n'ai pas oublié (wrap n'...pas around 'ai'!)."}, "step2_anchor": {"instruction": "Past Participle Anchor:", "referenceItems": ["manger → mangé | jouer → joué | oublier → oublié", "finir → fini | écrire → écrit (irregular!)", "Negative Past: Je n'ai pas + [past participle]"]}, "step3_substeps": [{"label": "Step 3a: Write Sentence (a) — Lunch in the cafeteria & basketball in the gym (Passé Composé)", "placeholder": "Hier, j'ai mangé avec mes amis dans la cafétéria et...", "hint": "Use 'j'ai mangé' and 'j'ai joué au basketball dans le gymnase'.", "modelSubAnswer": "« Hier, j'ai mangé avec mes amis dans la grande cafétéria et j'ai joué au basketball dans le gymnase. »"}, {"label": "Step 3b: Write Sentence (b) — Finishing math & writing an expanded paragraph ('finir' + 'écrire')", "placeholder": "Ensuite, j'ai fini mes problèmes de mathématiques et j'ai écrit...", "hint": "Use 'j'ai fini' and 'j'ai écrit un paragraphe détaillé en anglais'.", "modelSubAnswer": "« Ensuite, j'ai fini mes problèmes de mathématiques et j'ai écrit un paragraphe détaillé en anglais. »"}, {"label": "Step 3c: Write Sentence (c) — Negative past sentence ('I did NOT forget my anchor chart')", "placeholder": "En français, je n'ai pas...", "hint": "Wrap 'n'' and 'pas' right around 'ai', followed by 'oublié'!", "modelSubAnswer": "« Dans la classe de français, je n'ai pas oublié mon affiche de référence ni mon dictionnaire! »"}], "step4_checks": ["Does EVERY past verb have Piece #1 ('j'ai') AND Piece #2 (past participle)?", "Did I put the acute accent (-é) on mangé, joué, and oublié, and use 'écrit' for écrire?", "In Sentence (c), did I put 'pas' BEFORE 'oublié' (« je n'ai pas oublié »)?"], "step5_modelAnswer": {"basicAnswer": "Hier, j'ai mangé et joué. J'ai fini les maths. Je n'ai pas oublié.", "expandedAnswer": "Complete Grade 7+ Passé Composé Journal:\n« Hier, j'ai mangé avec mes camarades dans la grande cafétéria et j'ai joué au basketball dans le gymnase. Ensuite, j'ai fini mes problèmes de mathématiques et j'ai écrit un paragraphe détaillé en anglais. Enfin, dans la classe de français, je n'ai pas oublié de consulter mon affiche de référence et mon dictionnaire! »", "extensionPrompt": "Bonus Challenge: Add one sentence starting with « Demain, je vais... » (Futur Proche) to connect yesterday's success to tomorrow!"}}]}, {"id": "fr-u5", "title": "Unit 5: Daily Routines (Reflexive Verbs), Questions (Quel/Est-ce que) & Real-World Reading", "studyFirstTag": "Decode schedules, menus, and emails & ask clear French questions", "curriculumStrand": "Ontario Grade 7 Core French: Reading Authentic Texts (C1) & Asking Questions (B1)", "svgDiagram": "french_decode_svg", "lessons": [{"id": "fr-u5-l1", "title": "Lesson 5.1: Daily Routines (Reflexive Verbs) & Asking Questions (Est-ce que / Quel)", "readTime": "3 min read", "bigIdea": "Reflexive verbs ('se lever', 'se préparer') describe things you do to yourself every morning, and 'Est-ce que' turns ANY statement into a polite question!", "paragraphs": ["When you describe your morning before arriving at Longfields-Davidson Heights—waking up, getting dressed, getting ready—French uses Reflexive Verbs that carry a mini mirror-pronoun (me, te, se, nous, vous, se) right before the verb: « Je me réveille à sept heures » (I wake myself up at 7:00), « Je me lève » (I get up), and « Je me prépare pour l'école » (I get ready for school).", "Need to ask a question in class to clarify instructions (one of N. Bishop's and D. Forbes's goals!)? Just stick « Est-ce que » in front of any normal sentence! « Tu comprends la question » → « Est-ce que tu comprends la question? » (Do you understand the question?).", "To ask 'What?' or 'Which?' before a noun, use QUEL—and remember it behaves like a chameleon adjective! Use 'Quel' for masculine singular (« Quel sport préfères-tu? »), 'Quelle' for feminine singular (« Quelle heure est-il? » / « Quelle classe aimes-tu? »), and add '-s' for plural ('Quels / Quelles')."], "keyTakeaway": "Reflexive morning routine: Je me réveille → Je me lève → Je me prépare! | Quick Question Trick: Add 'Est-ce que...' to the front of any sentence!", "deepReadTitle": "📧 Authentic Reading Practice: School Cafeteria & Intramurals Poster", "deepReadText": "« AVIS AUX ÉLÈVES DE 7e ANNÉE : Tournoi de Basketball! Quand : Jeudi à 12h15 dans le grand gymnase. Menu spécial à la cafétéria : Sandwich au poulet, salade fraîche et fruit (5,50 $). Est-ce que tu veux participer avec ton équipe? Inscris ton nom avant mercredi! »", "videos": [{"id": "YhXYEEDFCsg", "title": "Everything You Need to Know About French Reflexive Verbs", "channel": "Learn French With Alexa", "why": "Clear guide to me/te/se daily routine verbs like se lever and se préparer."}, {"id": "XkN6Uy-UTj8", "title": "Asking WHAT / WHICH Questions in French with QUEL", "channel": "Learn French With Alexa", "why": "Master quel, quelle, quels, quelles for classroom discussions and quizzes."}], "quickCheck": {"question": "Which question correctly asks 'Which class do you prefer?' (Note: 'la classe' is feminine singular!)", "options": ["Quel classe préfères-tu?", "Quelle classe préfères-tu?", "Quels classe préfères-tu?"], "correctIdx": 1, "explanation": "Because 'la classe' is feminine singular, 'Quel' becomes 'Quelle': « Quelle classe préfères-tu? »"}}, {"id": "fr-u5-l2", "title": "Lesson 5.2: Possessive Adjectives (`mon/ma/mes`) & Imperative Commands (`Écoute!`)", "readTime": "3 min read", "bigIdea": "In French, **`mon/ma/mes`** ('my') and **`son/sa/ses`** ('his/her') match the gender of the **OBJECT OWNED**—NOT the owner! And **Imperative Commands** simply drop the subject pronoun (`Tu écoutes` → **`Écoute!`**)!", "paragraphs": ["Watch out for the #1 English-speaker trap in Grade 7 French! In English, we say *'his book'* vs. *'her book'* based on the owner. In French, **Possessive Adjectives** match the **NOUN THAT FOLLOWS**: `mon` (masc. sing.), `ma` (fem. sing.), `mes` (plural); `ton / ta / tes` (your); `son / sa / ses` (his OR her!); `notre / nos` (our); `votre / vos` (your-pl); `leur / leurs` (their). So *'her brother'* is **`son frère`** (masculine noun!) and *'his sister'* is **`sa sœur`** (feminine noun!)! Bonus Vowel Rule: before a feminine noun starting with a vowel (`amie`, `école`), use `mon/ton/son` for smooth sound (`**mon** école`, NOT `ma école`!).", "Now master **L'Impératif (Commands)** used on every worksheet and in gym class! Take the present tense of `Tu`, `Nous`, or `Vous` and **DROP the subject pronoun**:\n• `Tu finis` → **`Finis tes devoirs!`** (Finish your homework!)\n• `Nous allons` → **`Allons au gymnase!`** (Let's go to the gym!)\n• `Vous écoutez` → **`Écoutez le professeur!`** (Listen to the teacher!)", "One tiny spelling detail to remember for **`-ER` verbs** (plus `aller`)
