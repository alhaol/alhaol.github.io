 mine closes, companies must clean up toxic tailings, reshape pits, replace topsoil, and replant native trees so wildlife returns (just like Sudbury, Ontario's famous regreening project!)."], "keyTakeaway": "Match Flow Energy to local geography (Hydro = big rivers, Tidal = Bay of Fundy, Solar/Wind = sunny/windy plains) AND require Land Reclamation after mining!", "deepReadTitle": "🌱 Success Story: The Sudbury Regreening Reclamation Project (Ontario!)", "deepReadText": "Decades ago, nickel smelting left hills around Sudbury, Ontario barren and black (Apollo astronauts even trained there!). Starting in 1978, citizens, scientists, and mining companies spread crushed limestone to neutralize acidic soil and planted over 10 MILLION native trees—turning Sudbury back into a green forest!", "videos": [{"id": "5agrNMvugvI", "title": "Power From Water: Hydropower, Tidal Power & Wave Energy", "channel": "Miacademy Learning Channel", "why": "Explains how flow water energy works in different coastal and river geographies."}, {"id": "GqHBXzu0DYc", "title": "Renewable Energy Technology: Solar, Wind, Water & Earth Power", "channel": "Doodle Beez", "why": "Compares geographical pros and trade-offs of clean flow energy sources."}, {"id": "3XnnKizjzhc", "title": "Power From Water Part 2: Sustainability, Trade-Offs & Remediation", "channel": "Miacademy Learning Channel", "why": "Shows how engineers weigh ecosystem impacts and restore damaged environments."}], "quickCheck": {"question": "What is 'Land Reclamation' after a non-renewable mining operation finishes?", "options": ["Abandoning the open pit and moving immediately to a new forest.", "Cleaning up tailings, reshaping the ground, adding topsoil, and replanting native vegetation so the ecosystem recovers.", "Filling the mine with plastic waste from nearby cities."], "correctIdx": 1, "explanation": "Reclamation restores disturbed mining land back into healthy, usable ecosystems—like Ontario's famous Sudbury Regreening project!"}}], "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Watershed & Sustainability Core Terms", "content": "Key Nelson Chapters 4–8 quiz vocabulary:", "keyPoints": ["Watershed (Drainage Basin), Tributary, Divide, Meander, Delta", "Ecological Footprint: The area of Earth needed to supply our resources and absorb our waste", "Land Reclamation: Restoring mined/disturbed land back to healthy ecosystems"]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Why Geography Decides Which Clean Energy Works Best", "content": "You wouldn't build a tidal dam in landlocked Saskatchewan or giant wind farms in a sheltered canyon!", "analogy": "🏀 Team Lineup Analogy: In gym basketball, you put your fastest sprinter at point guard and your tallest player at center. Smart energy planners match each province's geography to its natural superpower—Hydro in Quebec/Manitoba/B.C., Tidal in the Bay of Fundy, Solar/Wind on the sunny/windy Prairies!", "keyPoints": ["Every energy source has both benefits and environmental trade-offs."]}, {"level": 3, "name": "APPLY", "subtitle": "Trace a Watershed & Recommend Energy for 3 Canadian Regions", "content": "Match geography to sustainable energy:", "workedExample": {"prompt": "Choose the best Flow Energy source for: (1) Bay of Fundy, NS; (2) Northern Quebec's huge shield rivers; (3) Southern Alberta's sunny flat plains.", "steps": ["1. Bay of Fundy, NS → Tidal Power (highest ocean tides in the world!).", "2. Northern Quebec → Hydroelectricity (vast rushing rivers dropping over rocky Shield elevation).", "3. Southern Alberta → Solar & Wind Power (most sunny days in Canada + wide-open flat windy prairies)."]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Flow Energy Options & Trade-Offs", "content": "Evaluate pros and cons like a Grade 7 geographer:", "comparisonTable": {"headers": ["Energy Type", "Best Geography", "Key Benefit", "Trade-Off / Challenge"], "rows": [["Hydroelectricity", "Large rivers with steep elevation drops", "Reliable 24/7 clean power, zero smog", "Reservoirs flood valleys & disrupt fish/communities"], ["Wind & Solar", "Wide open windy/sunny plains or coasts", "Zero emissions, fast to install", "Intermittent (needs batteries/grid storage)"], ["Tidal Power", "Narrow coastal bays with huge tide swings", "100% predictable lunar tide cycles", "Expensive saltwater turbines; affects marine life"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Weigh Both Sides of a Mine + Reclamation Plan", "content": "Grade 7 Geography asks you to look at Economic, Environmental, AND Social perspectives—never just one!", "keyPoints": ["Always check: (1) Jobs & clean-tech minerals needed? (2) Watershed & wildlife protection? (3) Indigenous consent & post-mining Land Reclamation?"]}, {"level": 6, "name": "CREATE", "subtitle": "Design a Zero-Pollution Watershed & Clean Energy Plan for Your Community", "content": "Combine wetland protection, recycling/circular economy, and locally matched flow energy.", "keyPoints": ["Synthesizes all 8 chapters of Nelson GEO 7!"]}], "questions": [{"id": "geo-u5-q1", "bloomLevel": 6, "bloomTag": "ANALYZE, EVALUATE & CREATE", "title": "Nelson Ch. 4–8 Capstone: Watershed Protection, Flow Energy & Mining Reclamation", "prompt": "Complete all 3 parts of this Nelson GEO 7 Sustainability Capstone:\n(a) WATERSHEDS (Ch. 4): Explain what a Watershed and a Divide are, and explain why protecting wetlands upstream in the Ottawa River watershed helps prevent flooding and pollution downstream in Ottawa and Montreal.\n(b) FLOW ENERGY MATCHING (Ch. 7): Recommend the BEST Flow Resource energy source for (1) Nova Scotia's Bay of Fundy and (2) Southern Alberta's prairies, stating ONE clear benefit AND ONE challenge/trade-off for each.\n(c) MINING RECLAMATION (Ch. 8): After a nickel mine in Northern Ontario's Canadian Shield finishes extracting ore, explain 3 concrete steps of Land Reclamation required to restore the land and protect nearby lakes, using Sudbury's regreening as inspiration.", "step1_deconstruct": {"instruction": "Verify all 3 parts (a, b, c) and make sure Part (b) includes BOTH a benefit AND a trade-off for each region!", "guidingQuestions": ["What does a wetland do during heavy spring snowmelt (acts like a sponge and natural filter)?", "Which Flow resource matches Bay of Fundy (Tidal) vs. Southern Alberta (Solar/Wind)?", "What 3 physical steps restore mined land during Reclamation?"], "modelPlan": "(a) Define watershed & divide; explain wetlands absorbing floodwater and filtering pollutants before they reach Ottawa/Montreal. (b) Bay of Fundy = Tidal (predictable vs. marine impact/cost); Alberta = Solar/Wind (sunny/windy vs. intermittent storage). (c) 1. Treat tailings/neutralize acid soil, 2. Reshape pits & add topsoil, 3. Replant native trees/monitor lakes."}, "step2_anchor": {"instruction": "Nelson Ch. 4–8 Anchor Terms:", "referenceItems": ["Watershed = land draining to one river | Divide = high ridge separating watersheds", "Bay of Fundy = Tidal Power | Southern Alberta = Solar & Wind Power", "Land Reclamation = Cleaning tailings + Neutralizing soil + Replanting native forests (e.g., Sudbury, ON)"]}, "step3_substeps": [{"label": "Step 3a: Part (a) — Define Watershed & Divide, and explain how upstream wetlands protect Ottawa & Montreal downstream", "placeholder": "A watershed is... A divide is... Protecting upstream wetlands helps Ottawa and Montreal because...", "hint": "Wetlands soak up spring snowmelt (reducing floods) and trap sediment/pollutants naturally!", "modelSubAnswer": "A watershed (drainage basin) is the entire area of land where all precipitation drains downhill into one main river, while a divide is the high ridge separating two watersheds. Because all upstream tributaries flow into the Ottawa and St. Lawrence Rivers, preserving upstream wetlands acts like a giant natural sponge—absorbing heavy spring snowmelt to prevent downstream flooding and filtering out sediment and runoff pollutants before the water reaches Ottawa and Montreal."}, {"label": "Step 3b: Part (b) — Match Flow Energy to (1) Bay of Fundy and (2) Southern Alberta (with 1 benefit + 1 trade-off each)", "placeholder": "1. Bay of Fundy → ... (Benefit: ... | Trade-off: ...)\n2. Southern Alberta → ... (Benefit: ... | Trade-off: ...)", "hint": "Bay of Fundy has the world's highest tides; Alberta has wide, sunny, windy plains!", "modelSubAnswer": "1. Bay of Fundy, NS → Tidal Power. Benefit: Tides are 100% predictable daily cycles generating zero-emission electricity. Trade-off: Underwater turbines are expensive to maintain in harsh saltwater and must be designed carefully to protect marine wildlife.\n2. Southern Alberta → Solar & Wind Power. Benefit: Wide-open flat prairies get abundant sunshine and strong steady winds with zero air pollution. Trade-off: Both are intermittent (when the sun sets or wind calms), requiring battery storage or backup grid connections."}, {"label": "Step 3c: Part (c) — Outline 3 concrete Land Reclamation steps to restore a closed Northern Ontario mine", "placeholder": "1. Clean & neutralize: ...\n2. Reshape & rebuild soil: ...\n3. Replant & monitor: ...", "hint": "Think of Sudbury's regreening: neutralize acidic soil with limestone, safely cap tailings, replace topsoil, and plant native trees!", "modelSubAnswer": "1. Clean & Stabilize Tailings: Safely treat and seal waste rock/tailings ponds so acidic runoff never leaks into Canadian Shield lakes or groundwater.\n2. Reshape & Neutralize Soil: Re-contour steep pit edges for safety, spread crushed limestone to neutralize acidic soil (as done in Sudbury), and restore nutrient-rich topsoil.\n3. Replant Native Species & Monitor: Plant millions of native Boreal trees, shrubs, and grasses, and conduct long-term water testing with local Indigenous communities to confirm wildlife and fish habitats return."}], "step4_checks": ["Did I define BOTH Watershed and Divide in Part (a)?", "Did I include BOTH a Benefit AND a Trade-off for both Bay of Fundy and Southern Alberta in Part (b)?", "Did I list 3 specific, actionable Reclamation steps in Part (c)?"], "step5_modelAnswer": {"basicAnswer": "(a) Watershed drains water to a river; wetlands stop floods. (b) Fundy uses tides, Alberta uses sun/wind. (c) Clean waste, add soil, plant trees.", "expandedAnswer": "Complete Nelson GEO 7 Ch. 4–8 Exemplar:\n(a) Watersheds & Wetlands: A watershed is the land area draining into a single river system, separated from neighbouring basins by high ridges called divides. Because tributaries carry everything downhill, protecting upstream wetlands in the Ottawa River watershed slows spring runoff (preventing downstream floods) and naturally filters pollutants before water reaches Ottawa and Montreal.\n(b) Flow Energy Matching: (1) Bay of Fundy, NS is ideal for Tidal Power (Benefit: 100% predictable zero-emission energy; Trade-off: high saltwater maintenance costs and marine habitat concerns). (2) Southern Alberta is ideal for Solar and Wind Power (Benefit: high sunshine and steady winds with zero smokestack emissions; Trade-off: weather intermittency requiring energy storage).\n(c) Mining Land Reclamation: Inspired by Sudbury's regreening success, closing a Canadian Shield mine requires (1) sealing and treating tailings to protect surrounding watersheds, (2) reshaping pits and spreading limestone + topsoil to neutralize soil acidity, and (3) replanting native Boreal vegetation alongside ongoing ecological and Indigenous-partnered water monitoring.", "extensionPrompt": "Action Challenge: Name 2 daily actions you can take at home or in the school cafeteria to shrink your own Ecological Footprint!"}}]}], "friendlySub": "Complete Nelson GEO 7: Topo maps, tectonics, climate, biomes & sustainability", "accent": "#059669"}, {"id": "math", "code": "MTH7 / Mathematics 7", "name": "Mathematics", "teacher": "D. Forbes (DF)", "status": "Progressing Well", "tier": "Tier 2: Push to Very Well", "tierClass": "tier-strong", "icon": "📐", "reportComment": "Zaid demonstrates strong mathematical thinking and solid problem-solving skills. Key questions, discussions and test marks indicate he has a good understanding of the units studied so far (place value, factors, multiples, square roots, integers and order of operations). To reach his full potential, he is encouraged to stay focused during instruction, double-check his work for careless errors, and practice self-regulation by raising his hand rather than blurting out during class. Attempt extension opportunities. (DF)", "nextSteps": ["Run the 'D. Forbes Careless Error Shield' on every calculation (check negative signs, exponents, and BEDMAS order)", "Write down each line of BEDMAS vertically instead of doing 3 steps in your head at once", "Pause, write your plan first, and verify before answering (Self-Regulation habit)", "Conquer Level 5 & Level 6 Extension Problems across Integers, Roots, Factors/Multiples, and Algebra"], "units": [{"id": "math-u1", "title": "Unit 1: Integers, Square Roots, Factors/Multiples & Order of Operations (BEDMAS)", "curriculumStrand": "Ontario Grade 7 Mathematics Strand B: Number Sense & Operations (B1, B2)", "svgDiagram": "math_bedmas_svg", "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Recall Core Number Rules: Factors, Multiples, Perfect Squares & Integers", "content": "You already have a strong foundation in these 6 sub-topics studied with D. Forbes—keep this rapid-fire reference sharp:", "keyPoints": ["🔢 Factors vs. Multiples: Factors divide evenly INTO a number (Factors of 12: 1, 2, 3, 4, 6, 12 — finite list!). Multiples are what you get when you multiply a number by 1, 2, 3... (Multiples of 12: 12, 24, 36, 48... — infinite list!).", "🏆 GCF vs. LCM: GCF (Greatest Common Factor) splits things into equal groups. LCM (Lowest Common Multiple) finds when two repeating cycles line up again.", "⬛ Perfect Squares & Square Roots: 1²=1, 2²=4, 3²=9, 4²=16, 5²=25, 6²=36, 7²=49, 8²=64, 9²=81, 10²=100, 11²=121, 12²=144, 13²=169, 14²=196, 15²=225. Note: √64 = 8 because 8 × 8 = 64.", "➕➖ Integer Sign Rules: Subtracting a negative is the same as adding a positive: a − (−b) = a + b! For multiplication/division: Same signs = POSITIVE (+); Different signs = NEGATIVE (−).", "🏔️ BEDMAS Priority: (1) Brackets [ ( ) ], (2) Exponents & Roots (x², √x), (3) Division & Multiplication (LEFT to RIGHT!), (4) Addition & Subtraction (LEFT to RIGHT!)."]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Why Careless Errors Happen in Fast Mental Math (And How to Beat Them)", "content": "Because you have fast mathematical intuition, your brain often jumps to Step 3 while your pencil is still on Step 1! That's where careless sign or order errors sneak in.", "analogy": "🏀 Gym Free-Throw Routine: Even NBA stars who can shoot from half-court follow the exact same pre-shot routine at the free-throw line (bounce, breathe, align elbow, follow through). Writing BEDMAS as a vertical 'funnel'—changing only ONE operation per line and copying the rest down—makes careless errors almost impossible!", "keyPoints": ["Watchout #1: (−5)² vs. −5². Inside brackets, (−5)² = (−5) × (−5) = +25. Without brackets, −5² means −(5 × 5) = −25!", "Watchout #2: Division & Multiplication are TIED in rank! In 24 ÷ 4 × 2, do NOT multiply 4 × 2 first! Go LEFT to RIGHT: (24 ÷ 4) × 2 = 6 × 2 = 12.", "Watchout #3: Integer subtraction: −8 − (−3) becomes −8 + 3 = −5 (not −11!)."]}, {"level": 3, "name": "APPLY", "subtitle": "Execute Vertical Funnel BEDMAS with Integers & Roots", "content": "Study how every line changes only one priority tier and copies everything else straight down:", "workedExample": {"prompt": "Evaluate: (−3)² − 4 × [ √81 + (−15) ÷ 3 ]", "steps": ["Line 1 (Inside Brackets — Square Root & Division first): √81 = 9 and (−15) ÷ 3 = −5. Expression becomes: (−3)² − 4 × [ 9 + (−5) ]", "Line 2 (Finish Brackets): 9 + (−5) = 4. Expression becomes: (−3)² − 4 × 4", "Line 3 (Exponents): (−3)² = (−3) × (−3) = +9. Expression becomes: 9 − 4 × 4", "Line 4 (Multiplication before Subtraction!): 4 × 4 = 16. Expression becomes: 9 − 16", "Line 5 (Final Integer Subtraction): 9 − 16 = −7. (Double-check: 9 is smaller than 16, so result must be negative!)."]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Distinguish GCF vs. LCM Word Problems & Prime Factorization Trees", "content": "How do you know immediately whether a word problem requires GCF or LCM?", "comparisonTable": {"headers": ["Feature", "Greatest Common Factor (GCF)", "Lowest Common Multiple (LCM)"], "rows": [["Core Action", "Cutting, dividing, or packaging items into equal groups with zero leftovers", "Repeating cycles, laps, or schedules happening at the same time again"], ["Size of Answer", "Smaller than or equal to the smallest given number", "Larger than or equal to the largest given number"], ["Prime Factor Rule (36 = 2²×3², 48 = 2⁴×3¹)", "Multiply SHARED primes with LOWEST exponents: 2² × 3¹ = 12", "Multiply ALL primes with HIGHEST exponents: 2⁴ × 3² = 144"], ["Gym Example", "Splitting 36 basketballs and 48 pinnies into the maximum number of identical team kits (12 kits)", "Zaid runs a gym lap every 36 seconds and a friend every 48 seconds; when do they cross the start line together? (144 seconds)"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Spot the 3 Careless Errors in a Student's Solution (D. Forbes Audit)", "content": "Can you find all 3 classic careless mistakes in this student's work for:  20 − 2 × [ √64 − (−3)² ] ÷ 2 ?", "keyPoints": ["Student Line 1: 20 − 2 × [ 32 − (+9) ] ÷ 2  --> ❌ Careless Error #1: Divided 64 by 2 (getting 32) instead of taking the square root √64 = 8!", "Student Line 2 (if they used 8): 20 − 2 × [ 8 − (−9) ] ÷ 2 --> ❌ Careless Error #2: Wrote (−3)² = −9 instead of +9!", "Student Line 3: Subtracted 20 − 2 = 18 before multiplying! --> ❌ Careless Error #3: Violated BEDMAS by subtracting before multiplying/dividing.", "✅ Correct Solution: 20 − 2 × [ 8 − 9 ] ÷ 2 = 20 − 2 × (−1) ÷ 2 = 20 − (−2) ÷ 2 = 20 − (−1) = +21."]}, {"level": 6, "name": "CREATE", "subtitle": "D. Forbes Extension Challenge: Target Number & Missing Bracket Design", "content": "Stretch your mathematical thinking with multi-constraint design problems:", "keyPoints": ["Extension 1 (Target Bracket Puzzle): Insert one pair of brackets into  −6 + 4 × 3² − √100 ÷ 2  so that the final answer equals −23.", "Extension 2 (GCF × LCM Theorem): Verify and explain why for ANY two positive integers A and B, (GCF of A and B) × (LCM of A and B) always equals A × B!"]}], "questions": [{"id": "math-q1", "bloomLevel": 5, "bloomTag": "APPLY & EVALUATE", "title": "Multi-Step BEDMAS with Integers, Exponents & Square Roots (+ Error Shield)", "prompt": "Evaluate the following expression step-by-step using vertical BEDMAS lines, and explain how you verified each potential careless-error trap:\n\nExpression:   (−4)² − 3 × [ √144 + (−20) ÷ (−4) − 11 ] + (−6)", "step1_deconstruct": {"instruction": "STOP & PLAN (D. Forbes Self-Regulation Rule): Do NOT calculate in your head yet! List the exact order in which you will attack the parts of this expression.", "guidingQuestions": ["What is inside the square brackets [ √144 + (−20) ÷ (−4) − 11 ]? Which two operations inside the brackets must happen BEFORE addition/subtraction?", "Outside the brackets, we have (−4)², multiplication by 3, subtraction, and adding (−6). Which goes first?"], "modelPlan": "1. Inside [ ]: Evaluate √144 and (−20) ÷ (−4) first, then add and subtract left-to-right to get one bracket value.\n2. Outside [ ]: Evaluate the exponent (−4)².\n3. Multiply 3 by the bracket value.\n4. Perform final subtraction and addition from left to right."}, "step2_anchor": {"instruction": "ANCHOR RULES: Check Sign & Root Traps before computing.", "referenceItems": ["√144 = 12 (since 12 × 12 = 144 — do NOT divide 144 by 2!)", "(−20) ÷ (−4) = +5 (Negative divided by Negative = POSITIVE!)", "(−4)² = (−4) × (−4) = +16 (Negative base inside brackets squared = POSITIVE!)"]}, "step3_substeps": [{"label": "Step 3a: Evaluate the inside of the square brackets [ √144 + (−20) ÷ (−4) − 11 ] step-by-step", "placeholder": "√144 = ...\n(−20) ÷ (−4) = ...\nSo inside [ ] we have: ... + ... − 11 = ...", "hint": "Replace √144 with 12 and (−20) ÷ (−4) with +5. Then compute 12 + 5 − 11.", "modelSubAnswer": "Inside brackets:\n• √144 = 12\n• (−20) ÷ (−4) = +5\n• [ 12 + 5 − 11 ] = [ 17 − 11 ] = 6."}, {"label": "Step 3b: Rewrite the whole expression with your bracket answer (6) and evaluate the exponent (−4)²", "placeholder": "(−4)² − 3 × [ 6 ] + (−6)\n= ... − 3 × 6 + (−6)", "hint": "Remember (−4)² = (−4) × (−4) = +16.", "modelSubAnswer": "Substitute [6] and evaluate (−4)² = +16:\nExpression becomes: 16 − 3 × 6 + (−6)"}, {"label": "Step 3c: Complete the multiplication first, then perform the final integer subtraction and addition left-to-right", "placeholder": "16 − (3 × 6) + (−6)\n= 16 − ... + (−6)\n= ...", "hint": "3 × 6 = 18. Then 16 − 18 = −2. Finally, −2 + (−6) = ?", "modelSubAnswer": "• Multiply first: 3 × 6 = 18\n• Expression: 16 − 18 + (−6)\n• Subtract left-to-right: 16 − 18 = −2\n• Add (−6): −2 + (−6) = −8.\nFinal Answer = −8."}], "step4_checks": ["Careless Error Check 1: Did I write √144 = 12 (and NOT 72)?", "Careless Error Check 2: Did I make (−20) ÷ (−4) = +5 (positive) and (−4)² = +16 (positive)?", "Careless Error Check 3: Did I multiply 3 × 6 = 18 BEFORE subtracting from 16?", "Careless Error Check 4: Did I check the final integer sign: 16 − 18 = −2, and −2 + (−6) = −8?"], "step5_modelAnswer": {"basicAnswer": "−8", "expandedAnswer": "Complete Vertical Funnel Solution (D. Forbes Full-Marks Standard):\n  (−4)² − 3 × [ √144 + (−20) ÷ (−4) − 11 ] + (−6)\n= (−4)² − 3 × [ 12 + (+5) − 11 ] + (−6)      (Evaluated root √144=12 and integer division −20÷−4=+5)\n= (−4)² − 3 × [ 6 ] + (−6)                    (Completed bracket operations: 12 + 5 − 11 = 6)\n= 16 − 3 × 6 + (−6)                           (Evaluated exponent: (−4)×(−4) = +16)\n= 16 − 18 + (−6)                              (Multiplied 3 × 6 = 18 before subtraction)\n= −2 + (−6)                                   (Subtracted left-to-right: 16 − 18 = −2)\n= −8                                          (Added two negatives: −2 + (−6) = −8)", "extensionPrompt": "D. Forbes Extension Challenge: What would the final answer be if the subtraction sign in front of the 3 was changed to a division sign, and the 3 was changed to (−2)?"}}, {"id": "math-q2", "bloomLevel": 6, "bloomTag": "ANALYZE & CREATE (EXTENSION)", "title": "D. Forbes Extension Opportunity: Gym Tournament GCF, LCM & Square Number Design", "prompt": "Zaid is helping organize an intramural tournament in the Longfields-Davidson Heights gym:\n• Part 1: There are 72 basketballs, 96 pinnies (jerseys), and 120 water bottles. What is the greatest number of identical team equipment bags that can be made using ALL items with zero leftovers, and how many of each item go into one bag?\n• Part 2: During warm-ups, Group A completes a court shuttle drill every 18 seconds, and Group B completes a full-court circuit every 24 seconds. If both groups blow the whistle together at t = 0 seconds, after how many seconds will they blow the whistle at the exact same instant for the 3rd time (not counting t = 0)?\n• Part 3 (Extension): Is the sum of your answers from Part 1 (number of bags) and Part 2 (seconds for the 3rd whistle) a perfect square? Prove it and find its square root or nearest integer roots!", "step1_deconstruct": {"instruction": "STOP & PLAN: Classify Part 1 and Part 2 as GCF or LCM before touching any numbers.", "guidingQuestions": ["Part 1 splits 72, 96, and 120 into equal bags with no leftovers: Is that GCF or LCM?", "Part 2 aligns repeating time cycles of 18 s and 24 s (and asks for the 3rd time!): Is that GCF or LCM?", "Part 3 asks us to test if (Part 1 bags + Part 2 time) is a perfect square."], "modelPlan": "Part 1: Find GCF(72, 96, 120) and divide each item count by the GCF. Part 2: Find LCM(18, 24) for the 1st simultaneous whistle, then multiply by 3 for the 3rd time. Part 3: Add both results and check if the sum equals n²."}, "step2_anchor": {"instruction": "ANCHOR TOOL: Prime Factorizations for 72, 96, 120 and 18, 24.", "referenceItems": ["72 = 8 × 9 = 2³ × 3² | 96 = 32 × 3 = 2⁵ × 3¹ | 120 = 8 × 15 = 2³ × 3¹ × 5¹", "18 = 2 × 9 = 2¹ × 3² | 24 = 8 × 3 = 2³ × 3¹"]}, "step3_substeps": [{"label": "Step 3a: Part 1 — Calculate GCF(72, 96, 120) and determine the exact contents of 1 equipment bag", "placeholder": "GCF(72, 96, 120) = ...\nPer bag: ... basketballs, ... pinnies, ... water bottles", "hint": "Shared prime factors of 72, 96, and 120 are 2³ (8) and 3¹ (3). What is 8 × 3? Then divide 72, 96, and 120 by that number!", "modelSubAnswer": "GCF(72, 96, 120) = 2³ × 3¹ = 8 × 3 = 24 identical bags.\nContents per bag:\n• Basketballs: 72 ÷ 24 = 3 basketballs\n• Pinnies: 96 ÷ 24 = 4 pinnies\n• Water bottles: 120 ÷ 24 = 5 water bottles."}, {"label": "Step 3b: Part 2 — Find LCM(18, 24) for the 1st whistle alignment, then calculate the time for the 3rd simultaneous whistle", "placeholder": "LCM(18, 24) = ... seconds (1st time)\n3rd time = 3 × ... = ... seconds", "hint": "Multiples of 24: 24, 48, 72... Does 18 divide evenly into 72? Don't forget to multiply by 3 for the 3rd time!", "modelSubAnswer": "LCM(18, 24) = 2³ × 3² = 8 × 9 = 72 seconds (1st simultaneous whistle after t = 0).\nFor the 3rd simultaneous whistle: 72 seconds × 3 = 216 seconds (or 3 minutes 36 seconds)."}, {"label": "Step 3c: Part 3 (Extension) — Add (Number of Bags + Seconds for 3rd Whistle) and test if it is a perfect square", "placeholder": "Sum = 24 + 216 = ...\nPerfect squares near this number: 15² = ..., 16² = ...", "hint": "24 + 216 = 240. Check 15² = 225 and 16² = 256! Wait—what if you added Number of Bags (24) + 1st Whistle LCM (72)? Check both!", "modelSubAnswer": "• Sum with 3rd whistle: 24 + 216 = 240. Since 15² = 225 and 16² = 256, 240 is NOT a perfect square (√240 ≈ 15.49, lying almost halfway between 15 and 16).\n• Bonus Observation: Even if we used the 1st whistle (24 + 72 = 96), 9² = 81 and 10² = 100, so √96 ≈ 9.80. However, if we took the 2nd whistle (72 × 2 = 144), 144 itself is a perfect square (√144 = 12)!"}], "step4_checks": ["Did I answer BOTH parts of Part 1 (the number of bags = 24 AND the items per bag: 3, 4, 5)?", "In Part 2, did I catch the word '3rd time' and multiply the LCM (72 s) by 3 to get 216 s?", "Did I verify my GCF by checking that 24 × 3 = 72, 24 × 4 = 96, and 24 × 5 = 120?"], "step5_modelAnswer": {"basicAnswer": "Part 1: 24 bags (3 balls, 4 pinnies, 5 bottles). Part 2: 216 seconds. Part 3: 240 is between 15² and 16².", "expandedAnswer": "Complete Extension Solution:\n• Part 1 (GCF Equipment Packaging): Using prime factorization, 72 = 2³×3², 96 = 2⁵×3¹, and 120 = 2³×3¹×5¹. The GCF is 2³×3¹ = 24 bags. Dividing each total by 24 gives 3 basketballs, 4 pinnies, and 5 water bottles per bag (Check: gcd(3,4,5) = 1, so no further common factor exists).\n• Part 2 (LCM Cycle Alignment): Multiples of 18 are 18, 36, 54, 72... and multiples of 24 are 24, 48, 72... Thus LCM(18, 24) = 72 seconds for the 1st simultaneous whistle. The 3rd simultaneous whistle occurs at 72 s × 3 = 216 seconds.\n• Part 3 (Square Root Extension Proof): 24 + 216 = 240. Because 15² = 225 and 16² = 256, 225 < 240 < 256, proving 240 is not a perfect square and 15 < √240 < 16 (specifically √240 ≈ 15.49).", "extensionPrompt": "Super Extension: How many more equipment bags would you need to add to 240 so the total becomes the next perfect square (16² = 256)?"}}], "studyFirstTag": "Start Here: BEDMAS + Integers + Square Roots (Zero Careless Errors)", "lessons": [{"id": "math-u1-l1", "title": "Lesson 1.1: Factors, Multiples, GCF, LCM & Square Roots", "readTime": "3 min read", "bigIdea": "Master the exact difference between Factors (splitting up) and Multiples (repeating cycles), plus fast square root recognition.", "paragraphs": ["Students with strong mental math sometimes mix up 'Factors' and 'Multiples' when reading fast. Remember the memory trick: Factors are FEW (they divide evenly INTO a number, so they are smaller than or equal to the number: factors of 12 are 1, 2, 3, 4, 6, 12). Multiples are MANY (multiply by 1, 2, 3...: multiples of 12 are 12, 24, 36, 48...).", "In word problems, use GCF (Greatest Common Factor) when you are splitting items evenly into the maximum number of identical groups or bags with zero leftovers. Use LCM (Lowest Common Multiple) when two repeating schedules, gym laps, or flashing lights start together and you want to know when they line up again!", "A Perfect Square is what you get when you multiply a whole number by itself (like 7 × 7 = 49, or 12 × 12 = 144). The Square Root symbol (√) reverses that: √144 asks 'What positive number times itself equals 144?' The answer is 12! Never fall for the classic careless mistake of dividing 144 by 2!"], "keyTakeaway": "GCF = split into identical bags | LCM = align repeating cycles | √x = what times itself equals x (NEVER divide by 2!).", "deepReadTitle": "🔢 Perfect Squares Cheat Sheet (1² to 15²)", "deepReadText": "1²=1 | 2²=4 | 3²=9 | 4²=16 | 5²=25 | 6²=36 | 7²=49 | 8²=64 | 9²=81 | 10²=100 | 11²=121 | 12²=144 | 13²=169 | 14²=196 | 15²=225.\nTo estimate a non-perfect square like √55: since 7²=49 and 8²=64, √55 is between 7 and 8 (closer to 7.4).", "quickCheck": {"question": "Zaid runs a gym lap every 18 seconds and a friend runs one every 24 seconds. Which tool finds when they cross the start line together again?", "options": ["GCF(18, 24) = 6 seconds", "LCM(18, 24) = 72 seconds", "Square Root of 18 + 24"], "correctIdx": 1, "explanation": "Repeating cycles lining up in the future always use LCM! Multiples of 24: 24, 48, 72 (and 18 × 4 = 72)."}, "videos": [{"id": "B4zejSI8zho", "title": "Math Antics — Exponents and Square Roots", "channel": "Math Antics", "why": "Visualizes exponents, perfect squares, and square roots so you never divide by 2 by mistake!"}]}, {"id": "math-u1-l2", "title": "Lesson 1.2: Integers, BEDMAS & The Careless Error Shield", "readTime": "3 min read", "bigIdea": "Slowing down to write ONE BEDMAS line at a time turns strong mathematical thinking into 100% test accuracy.", "paragraphs": ["D. Forbes noted that you already have strong math problem-solving skills—your key to reaching the very top is eliminating careless sign and order errors! Almost every careless mistake in Grade 7 happens in one of three spots.", "Trap #1 — Negative Exponents With Brackets: (−4)² means (−4) × (−4) = +16 (two negatives make a positive!). Without brackets, −4² means the opposite of 4², which is −16. Always check if the minus sign is INSIDE the brackets!", "Trap #2 — Integer Sign Rules: When multiplying or dividing two integers, SAME signs give a POSITIVE (+), and DIFFERENT signs give a NEGATIVE (−). So (−20) ÷ (−4) = +5! And when subtracting a negative, add the opposite: 5 − (−3) = 5 + 3 = 8.", "Trap #3 — Left-to-Right BEDMAS: Brackets first, then Exponents/Roots, then Division & Multiplication TOGETHER from left to right, then Addition & Subtraction TOGETHER from left to right. Write each line directly underneath the previous line like a funnel!"], "keyTakeaway": "Change ONE priority tier per line and copy the untouched numbers straight down. Never subtract before multiplying!", "deepReadTitle": "🛡️ Spot the Difference: 16 − 3 × 6", "deepReadText": "Wrong (rushing left-to-right): (16 − 3) × 6 = 13 × 6 = 78 ❌\nRight (BEDMAS — Multiply first!): 16 − (3 × 6) = 16 − 18 = −2 ✅", "quickCheck": {"question": "What is the exact value of (−3)² + (−12) ÷ (−4)?", "options": ["−6", "+12", "+6"], "correctIdx": 1, "explanation": "(−3)² = +9, and (−12) ÷ (−4) = +3 (negative ÷ negative = positive). Then 9 + 3 = +12!"}, "videos": [{"id": "dAgfnK528RA", "title": "Math Antics — Order Of Operations (BEDMAS)", "channel": "Math Antics", "why": "The gold-standard breakdown of why BEDMAS order prevents careless errors."}]}]}, {"id": "math-u2", "title": "Unit 2: Fractions/Decimals/Percents, Algebraic Equations & Circle/Cylinder Geometry", "curriculumStrand": "Ontario Grade 7 Mathematics Strands B (Fractions/Ratios), C (Algebra) & E (Spatial Sense / Measurement)", "svgDiagram": "math_bedmas_svg", "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Core Formulas: Fractions, Algebra Balance & Circle/Cylinder Geometry", "content": "Prepare to dominate upcoming Grade 7 Math units with D. Forbes using these exact formulas:", "keyPoints": ["🍰 Fractions, Decimals & Percents: To add/subtract fractions, find a Common Denominator (using LCM!). To multiply fractions: multiply numerators straight across and denominators straight across. Benchmark conversions: 1/4 = 0.25 = 25% | 3/4 = 0.75 = 75% | 1/5 = 0.20 = 20% | 1/8 = 0.125 = 12.5%.", "⚖️ Solving Linear Equations (Algebra): An equation is a balanced scale! Whatever inverse operation you do to the Left Side, you MUST do to the Right Side. Undo addition/subtraction FIRST, then undo multiplication/division.", "⭕ Circle Geometry: Diameter (d) = 2 × radius (r) | Circumference (C) = π × d = 2 × π × r | Area of a Circle (A) = π × r² (where π ≈ 3.14).", "🥫 Volume of a Cylinder / Right Prism: Volume = (Area of Base) × Height. For a cylinder: V = π × r² × h (Units are CUBIC: cm³ or m³!)."]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Why Area Uses r² (Square Units) and Volume Multiplies by Height (Cubic Units)", "content": "Never mix up Circumference (2πr) and Area (πr²)!", "analogy": "🏀 Gym Center Circle & Water Bottle Analogy: Walking around the painted perimeter line of the center jump-ball circle in the gym is 1D length = Circumference (C = πd, measured in m). Painting the entire flat floor inside that circle is 2D surface = Area (A = πr², measured in m²). Stacking circular slices up to fill your gym water bottle is 3D space = Volume of a Cylinder (V = πr²h, measured in cm³ or mL)!", "keyPoints": ["Careless Error Trap in Circles: If a question gives you the DIAMETER d = 10 cm, do NOT plug 10 into πr²! First divide by 2 to get radius r = 5 cm, THEN square it: r² = 5² = 25!"]}, {"level": 3, "name": "APPLY", "subtitle": "Solve a Two-Step Algebraic Equation & Check by Substitution", "content": "With D. Forbes, the best part about Algebra is that you can ALWAYS know 100% if your answer is right before handing in your test by plugging your answer back in (Left Side = Right Side check)!", "workedExample": {"prompt": "Solve for x and verify:   3x − 7 = 20", "steps": ["Step 1 (Undo −7 by adding 7 to BOTH sides): 3x − 7 + 7 = 20 + 7  ⇒  3x = 27", "Step 2 (Undo ×3 by dividing BOTH sides by 3): 3x ÷ 3 = 27 ÷ 3  ⇒  x = 9", "Step 3 (D. Forbes LS = RS Verification!): Left Side = 3(9) − 7 = 27 − 7 = 20. Right Side = 20. Since LS = RS, x = 9 is 100% verified!"]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Circumference, Circle Area & Cylinder Volume Traps", "content": "Analyze the exact differences so you never pick the wrong formula on a test:", "comparisonTable": {"headers": ["Measurement", "Formula", "Units", "Classic Careless Error to Avoid"], "rows": [["Circumference (Distance around circle)", "C = π × d  or  2 × π × r", "Linear (cm, m)", "Using r instead of d without multiplying by 2"], ["Area of Circle (Flat 2D space inside)", "A = π × r²", "Square (cm², m²)", "Using diameter d instead of radius r, OR doing r × 2 instead of r × r!"], ["Volume of Cylinder (3D capacity)", "V = π × r² × h", "Cubic (cm³, m³)", "Forgetting to square the radius r before multiplying by height h"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Spot the Careless Errors in a Circle & Cylinder Solution", "content": "Audit this student's work for finding the Volume of a cylinder with Diameter = 8 cm and Height = 10 cm:", "keyPoints": ["❌ Student Work: V = 3.14 × 8² × 10 = 3.14 × 16 × 10 = 502.4 cm", "🔍 Careless Error #1 (Diameter vs. Radius): Used d = 8 cm instead of dividing by 2 to get radius r = 4 cm!", "🔍 Careless Error #2 (Squaring Trap): Wrote 8² = 16 (multiplied by 2) instead of squaring!", "🔍 Careless Error #3 (Units): Wrote 'cm' instead of cubic units 'cm³'!", "✅ Correct Solution: r = 8 ÷ 2 = 4 cm. V = π × r² × h = 3.14 × 4² × 10 = 3.14 × 16 × 10 = 502.4 cm³. (Funny coincidence in numbers, but two fatal process errors that would fail on any other diameter!)"]}, {"level": 6, "name": "CREATE", "subtitle": "Extension: Multi-Step Algebra, Fractions & Geometry Synthesis", "content": "Combine fractions, algebra, and geometry to solve real-world design problems.", "keyPoints": ["Note: 1 cm³ of volume holds exactly 1 mL of liquid (so 1,000 cm³ = 1 Litre)!"]}], "questions": [{"id": "math-u2-q1", "bloomLevel": 6, "bloomTag": "APPLY, EVALUATE & EXTEND", "title": "Algebra & Cylinder Geometry Extension Lab (+ D. Forbes LS=RS Verification)", "prompt": "Solve this 3-part problem showing every intermediate step and verification check:\n• Part 1 (Algebraic Equation + LS=RS Check): Solve for n in the equation:  4n − 15 = 33, and prove your answer is correct using a formal Left Side = Right Side (LS = RS) check.\n• Part 2 (Cylinder Volume & Diameter Trap): Zaid's cylindrical gym water bottle has a DIAMETER of 10 cm and a height of 20 cm. Using π ≈ 3.14, calculate the total Volume of the bottle in cm³ (note: 1 cm³ = 1 mL).\n• Part 3 (Fractions & Percent Extension): Before gym class, the water bottle is 3/4 full. During gym class, Zaid drinks 40% of the water that was in the bottle. How many mL (cm³) of water are left in the bottle after gym?", "step1_deconstruct": {"instruction": "STOP & PLAN: Identify the traps in Part 1, Part 2, and Part 3 before calculating!", "guidingQuestions": ["Part 1: Which operation do I undo first in 4n − 15 = 33?", "Part 2: The problem gives DIAMETER = 10 cm! What MUST I do before using V = πr²h?", "Part 3: First find 3/4 of the total volume, then find how much remains after drinking 40% of that amount (meaning 60% of that water stays!)."], "modelPlan": "Part 1: Add 15 to both sides, divide by 4, and verify LS=RS. Part 2: Divide d=10 by 2 to get r=5 cm, then compute V = 3.14 × 5² × 20. Part 3: Multiply total volume by 3/4 (0.75), then multiply by 60% (0.60) to find remaining mL."}, "step2_anchor": {"instruction": "ANCHOR FORMULAS: Algebra Balance + Cylinder Volume + Fractions/Percents.", "referenceItems": ["Radius r = Diameter ÷ 2 (So r = 10 cm ÷ 2 = 5 cm!)", "Cylinder Volume V = π × r² × h = 3.14 × 5² × 20", "1 cm³ = 1 mL | 3/4 = 0.75 | Drinking 40% leaves 100% − 40% = 60% (0.60)"]}, "step3_substeps": [{"label": "Step 3a: Part 1 — Solve 4n − 15 = 33 step-by-step AND write the LS = RS verification check", "placeholder": "4n − 15 + 15 = 33 + 15\n4n = ...\nn = ...\nLS Check: 4(...) − 15 = ...", "hint": "33 + 15 = 48. Then 48 ÷ 4 = 12.", "modelSubAnswer": "4n − 15 = 33\n4n − 15 + 15 = 33 + 15   (Add 15 to both sides)\n4n = 48\n4n ÷ 4 = 48 ÷ 4          (Divide both sides by 4)\nn = 12\n\nVerification (LS = RS Check):\nLeft Side (LS) = 4(12) − 15 = 48 − 15 = 33.\nRight Side (RS) = 33.\nSince LS = RS, n = 12 is verified!"}, {"label": "Step 3b: Part 2 — Find the radius r from diameter = 10 cm, and calculate the Cylinder Volume V = π × r² × h (with h = 20 cm)", "placeholder": "r = 10 cm ÷ 2 = 5 cm\nV = 3.14 × (5)² × 20\nV = 3.14 × 25 × 20 = ... cm³", "hint": "25 × 20 = 500. Then multiply 3.14 × 500!", "modelSubAnswer": "• Radius: r = 10 cm ÷ 2 = 5 cm (Avoided the diameter trap!)\n• Area of circular base: A = π × r² = 3.14 × 5² = 3.14 × 25 = 78.5 cm²\n• Volume of cylinder: V = 78.5 cm² × 20 cm = 1,570 cm³ (which equals 1,570 mL)."}, {"label": "Step 3c: Part 3 (Extension) — Calculate 3/4 of 1,570 mL, then find how much water remains after drinking 40% of it", "placeholder": "Starting water (3/4 full) = 1570 × 0.75 = ... mL\nWater remaining (60% of starting water) = ... × 0.60 = ... mL", "hint": "1,570 × 0.75 = 1,177.5 mL. Then multiply 1,177.5 × 0.60 (or subtract 40%)!", "modelSubAnswer": "• Step 1 (3/4 full before gym): (3/4) × 1,570 mL = 0.75 × 1,570 = 1,177.5 mL.\n• Step 2 (Drinks 40%, so 60% remains): 1,177.5 mL × 0.60 = 706.5 mL (or 1,177.5 − 471 = 706.5 mL).\n• Shortcut Fraction Check: (3/4) × (3/5) = 9/20 = 45% of total bottle = 0.45 × 1,570 = 706.5 mL!"}], "step4_checks": ["Did I write out the formal LS = RS check in Part 1 to prove n = 12?", "Did I divide the diameter (10 cm) by 2 to get radius r = 5 cm BEFORE squaring in Part 2?", "Did I include cubic units (cm³ / mL) and double-check my decimal multiplication in Part 3?"], "step5_modelAnswer": {"basicAnswer": "Part 1: n = 12. Part 2: 1,570 cm³. Part 3: 706.5 mL.", "expandedAnswer": "Complete Grade 7+ Multi-Step Math Solution:\n• Part 1 (Algebra): 4n − 15 = 33 ⇒ 4n = 48 ⇒ n = 12. Check: LS = 4(12) − 15 = 48 − 15 = 33 = RS ✅.\n• Part 2 (Cylinder Volume): Given diameter d = 10 cm, radius r = 10 ÷ 2 = 5 cm. Using V = πr²h: V ≈ 3.14 × (5 cm)² × 20 cm = 3.14 × 25 × 20 = 1,570 cm³ (1,570 mL).\n• Part 3 (Fractions & Percents Extension): At 3/4 capacity, the bottle holds 0.75 × 1,570 mL = 1,177.5 mL. Drinking 40% leaves 60% of the water: 0.60 × 1,177.5 mL = 706.5 mL (or 706.5 cm³) remaining.", "extensionPrompt": "Surface Area Extension: How much stainless steel (in cm²) is needed to make the curved side + flat circular bottom of that open-top water bottle (SA = πr² + 2πrh)?"}}], "studyFirstTag": "Next: Solving Algebra Equations + Circle & Cylinder Formulas", "lessons": [{"id": "math-u2-l1", "title": "Lesson 2.1: Solving Two-Step Algebra Equations & Circle/Cylinder Formulas", "readTime": "3 min read", "bigIdea": "Treat every algebra equation like a balanced scale, and always turn Diameter into Radius BEFORE squaring in circle formulas!", "paragraphs": ["An algebraic equation like 4n − 15 = 33 is a perfectly balanced scale. Your mission is to get 'n' alone by undoing operations in REVERSE BEDMAS order: undo addition or subtraction first (add 15 to BOTH sides → 4n = 48), then undo multiplication or division (divide BOTH sides by 4 → n = 12).", "Best of all, you never have to guess if your algebra answer is right! Plug n = 12 back into the Left Side: 4(12) − 15 = 48 − 15 = 33, which matches the Right Side (33). That 5-second LS = RS check catches 100% of algebra mistakes.", "In Measurement & Geometry, remember the 3 circle formulas using π ≈ 3.14: Circumference (perimeter around) C = π × d; Circle Area (flat space inside) A = π × r²; and Cylinder Volume (3D liquid capacity) V = π × r² × h. Watch out for the #1 Geometry trap: if a question gives you the DIAMETER (all the way across), divide it by 2 to get the RADIUS before using πr²!"], "keyTakeaway": "Algebra: Undo +/− first, then ×/÷, then run LS = RS! Circles/Cylinders: Always convert Diameter → Radius (r = d ÷ 2) first!", "deepReadTitle": "🥫 Real-World Volume Tip (cm³ = mL)", "deepReadText": "Every 1 cubic centimetre (1 cm³) of volume holds exactly 1 millilitre (1 mL) of water! So if a water bottle has radius 5 cm and height 20 cm, its volume is 3.14 × 5² × 20 = 3.14 × 25 × 20 = 1,570 cm³ = 1,570 mL (1.57 Litres).", "quickCheck": {"question": "A circular gym hoop has a DIAMETER of 10 cm. What value of 'r' must you plug into Area = π × r²?", "options": ["r = 10 cm", "r = 5 cm", "r = 20 cm"], "correctIdx": 1, "explanation": "Radius is half the diameter: r = 10 ÷ 2 = 5 cm! Then r² = 25."}, "videos": [{"id": "O-cawByg2aA", "title": "Math Antics — Circles, Circumference And Area", "channel": "Math Antics", "why": "Clearly explains radius vs. diameter, π, circumference (πd), and area (πr²)."}]}]}, {"id": "math-u3", "title": "Unit 3 (Nelson Mod. 1 / Khan): Scientific Notation, Fractions, Unit Rates & Ontario HST/Percents", "studyFirstTag": "Master multiplying/dividing fractions, best-buy unit rates & 13% Ontario tax!", "curriculumStrand": "Ontario 2020 Math Strand B: Number Sense, Operations & Proportional Reasoning", "svgDiagram": "math_bedmas_svg", "lessons": [{"id": "math-u3-l1", "title": "Lesson 3.1: Scientific Notation & Multiplying/Dividing Fractions", "readTime": "3 min read", "bigIdea": "Scientific notation shrinks giant numbers with powers of 10, while 'Multiply Straight Across' and 'Keep-Change-Flip' conquer fraction operations cleanly!", "paragraphs": ["Scientists and mathematicians hate counting 12 zeros in numbers like 4,500,000,000! SCIENTIFIC NOTATION rewrites any big number as (a number between 1 and 10) × 10ⁿ. For example, 450,000 = 4.5 × 10⁵ (count how many places the decimal jumped left: 5 jumps → exponent 5!). Watch out for the careless trap: 45 × 10⁴ is NOT proper scientific notation because 45 is ≥ 10!", "For FRACTIONS, multiplying is actually EASIER than adding—you do NOT need a common denominator! Just multiply numerators straight across and denominators straight across, then reduce to lowest terms: (3/4) × (2/5) = 6/20 = 3/10. Pro speed tip: convert mixed numbers like 1½ into improper fractions (3/2) BEFORE multiplying!", "How do you DIVIDE by a fraction like (3/4) ÷ (1/8)? Think: 'How many 1/8 slices fit inside 3/4 of a pizza?' Six slices! The shortcut rule is KEEP-CHANGE-FLIP (multiply by the reciprocal): KEEP 3/4, CHANGE ÷ to ×, FLIP 1/8 to 8/1 → (3/4) × (8/1) = 24/4 = 6!"], "keyTakeaway": "Scientific Notation: 1 ≤ a < 10 × 10ⁿ | Multiply Fractions: Straight across | Divide Fractions: Keep-Change-Flip (NEVER flip the first fraction!).", "deepReadTitle": "🛡️ D. Forbes Fraction Careless Error Shield", "deepReadText": "• Trap #1: Flipping the FIRST fraction when dividing! Always KEEP the 1st fraction and FLIP the 2nd fraction.\n• Trap #2: Multiplying whole numbers separately in mixed numbers (e.g., 1½ × 2⅓ ≠ 2⅙!). Always convert to improper fractions first: (3/2) × (7/3) = 21/6 = 3½!", "videos": [{"id": "arH3KFlsGMY", "title": "Writing Numbers in Scientific Notation", "channel": "Math with Mr. J", "why": "Clear step-by-step rule for powers of 10 and decimal hops."}, {"id": "qmfXyR7Z6Lk", "title": "Math Antics — Multiplying Fractions", "channel": "Math Antics", "why": "Explains why multiplying fractions goes straight across and how to simplify."}, {"id": "4lkq3DgvmJo", "title": "Math Antics — Dividing Fractions (Keep-Change-Flip)", "channel": "Math Antics", "why": "Shows visually why dividing by a fraction equals multiplying by its reciprocal."}], "quickCheck": {"question": "What is the exact value of (3/5) ÷ (3/10) using Keep-Change-Flip?", "options": ["9/50", "2", "1/2"], "correctIdx": 1, "explanation": "Keep 3/5, Change ÷ to ×, Flip 3/10 to 10/3 → (3/5) × (10/3) = 30/15 = 2!"}}, {"id": "math-u3-l2", "title": "Lesson 3.2: Ratios, Unit Rates & Real-World Percents (Discounts + 13% Ontario HST)", "readTime": "3 min read", "bigIdea": "Unit Rates let you spot the 'Best Buy' at any Ottawa store, and decimal multipliers make discounts and 13% Ontario HST fast and error-free!", "paragraphs": ["A RATIO compares two quantities (e.g., 3 basketballs : 4 pinnies), while a RATE compares two DIFFERENT units (like $12 for 4 Gatorades, or 240 km in 3 hours). To find a UNIT RATE (the cost or speed for JUST ONE unit), divide the first number by the second: $12 ÷ 4 bottles = $3.00 per bottle! Comparing unit rates immediately reveals which pack is the better deal.", "In Ontario, almost every purchase adds 13% HST (Harmonized Sales Tax), and sales take a percent OFF (Discount). To find a percent of any number, convert the percent to a decimal by moving the decimal point 2 places left (20% = 0.20, 13% = 0.13, 5% = 0.05 — careful, NOT 0.5!) and multiply!", "Pro Grade 7 Shortcut: When a $80 pair of gym shoes is 25% OFF, you pay 100% − 25% = 75% → $80 × 0.75 = $60.00! Then to add 13% Ontario HST in ONE step, multiply by 1.13 → $60 × 1.13 = $67.80! Watch the #1 trap: NEVER subtract 25% and add 13% as a single '12% off'—tax is ALWAYS calculated on the discounted sale price!"], "keyTakeaway": "Unit Rate = Total ÷ Quantity | Sale Price = Price × (1 − discount) | Total with Ontario HST = Sale Price × 1.13 (ALWAYS apply discount BEFORE tax!).", "deepReadTitle": "👟 Why '25% Off + 13% Tax' ≠ '12% Off'!", "deepReadText": "On an $80 shoe:\n✅ Correct (Discount first, then 13% HST on sale price): $80 × 0.75 = $60 → $60 × 1.13 = $67.80.\n❌ Wrong shortcut (25% − 13% = 12% off): $80 × 0.88 = $70.40 — off by $2.60!", "videos": [{"id": "4xK2o5mFfJw", "title": "Ratios and Unit Rates", "channel": "Lincoln Learning Solutions", "why": "Shows how to divide to find unit rates and compare best buys."}, {"id": "5CAncQ4TZD4", "title": "How to Find a Percent of a Number", "channel": "Math with Mr. J", "why": "Clean breakdown of converting percents to decimals and multiplying accurately."}], "quickCheck": {"question": "Pack A has 6 sports drinks for $9.00. Pack B has 8 sports drinks for $11.60. Which pack has the lower unit price (Better Buy)?", "options": ["Pack A ($1.50 per drink)", "Pack B ($1.45 per drink)", "They cost the exact same per drink"], "correctIdx": 1, "explanation": "Pack A: $9.00 ÷ 6 = $1.50/drink. Pack B: $11.60 ÷ 8 = $1.45/drink → Pack B saves 5¢ per drink!"}}], "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Core Formulas: Scientific Notation, Fractions, Unit Rates & HST", "content": "Rapid-fire Strand B anchors:", "keyPoints": ["Scientific Notation: a × 10ⁿ where 1 ≤ a < 10", "Fraction Division: Keep-Change-Flip | Mixed Numbers → Convert to improper fractions first!", "Unit Rate = Cost ÷ Units | Ontario 13% HST Multiplier = × 1.13"]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Why Discount MUST Come Before 13% HST Tax", "content": "You only pay government tax on the money you actually spend—not on the discount you didn't pay!", "analogy": "🛒 Ottawa Mall Receipt Analogy: At the cash register, the cashier scans the 25% off coupon FIRST to get the subtotal ($60), and ONLY THEN does the computer add 13% Ontario HST onto that $60 subtotal!", "keyPoints": ["Order: (1) Discount off original price → (2) 13% HST on discounted subtotal."]}, {"level": 3, "name": "APPLY", "subtitle": "Calculate a Multi-Step Discount + 13% HST Receipt", "content": "Follow the 2-step money pipeline:", "workedExample": {"prompt": "A $120 trombone case is 20% off in Ottawa. Find the final price with 13% HST.", "steps": ["Step 1 (20% Off → pay 80%): $120 × 0.80 = $96.00 sale price (Check: 20% of 120 = $24; 120 − 24 = $96).", "Step 2 (Add 13% HST): $96.00 × 0.13 = $12.48 tax → $96.00 + $12.48 = $108.48 (or $96 × 1.13 = $108.48)."]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Fraction Operations Side-by-Side", "content": "Never mix up when you need a Common Denominator!", "comparisonTable": {"headers": ["Operation", "Need Common Denominator?", "Exact Rule"], "rows": [["Add / Subtract (+ / −)", "YES! (Use LCM)", "Find LCD, then add/subtract numerators ONLY"], ["Multiply (×)", "NO!", "Convert mixed → improper, multiply straight across, reduce"], ["Divide (÷)", "NO!", "Convert mixed → improper, Keep-Change-Flip, multiply & reduce"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Spot 3 Classic Number Sense Careless Errors (D. Forbes Shield)", "content": "Catch these before test day:", "keyPoints": ["❌ Writing 5% as 0.5 instead of 0.05! (0.5 is 50%, 10 times too big!)", "❌ Writing 32 × 10⁴ for scientific notation instead of 3.2 × 10⁵!", "❌ Adding denominators: 1/4 + 1/4 ≠ 2/8 (it's 2/4 = 1/2!)."]}, {"level": 6, "name": "CREATE", "subtitle": "Extension: Reverse-Engineer the Pre-Tax Price from a Receipt Total", "content": "If a final Ottawa receipt WITH 13% HST equals $113.00, why is the pre-tax price $100.00 (divide by 1.13) and NOT $113 × 0.87 ($98.31)?", "keyPoints": ["Because the 13% was calculated on $100, not on $113—undoing ×1.13 requires ÷1.13!"]}], "questions": [{"id": "math-u3-q1", "bloomLevel": 5, "bloomTag": "APPLY & EVALUATE", "title": "D. Forbes Number Sense Challenge: Gym Gear Discount + 13% HST & Fractions", "prompt": "Solve all 3 parts showing every line and rounding money to 2 decimal places:\n• Part 1 (Best Buy Unit Rate): Store A sells 12 athletic socks for $27.00. Store B sells 8 identical socks for $17.20. Calculate both unit rates ($ per sock) to prove which store is the better buy.\n• Part 2 (Discount + 13% Ontario HST): Zaid buys a $90.00 basketball at 30% off in Nepean. Calculate (i) the discounted sale price, and (ii) the final price including 13% Ontario HST.\n• Part 3 (Mixed Fraction Division & Scientific Notation): Evaluate  (2¼) ÷ (3/8)  AND write 6,400,000 in proper scientific notation.", "step1_deconstruct": {"instruction": "Check all 3 parts and note every unit ($ / sock, $, proper scientific notation 1 ≤ a < 10).", "guidingQuestions": ["In Part 1, what do I divide by what to get cost PER ONE sock?", "In Part 2, do I apply 30% off FIRST or 13% HST first?", "In Part 3, what is 2¼ as an improper fraction before Keep-Change-Flip?"], "modelPlan": "Part 1: $27.00÷12 vs. $17.20÷8. Part 2: $90 × 0.70 = sale price, then × 1.13 = final total. Part 3: 2¼ = 9/4 → (9/4) × (8/3) = 72/12 = 6; and 6,400,000 = 6.4 × 10⁶."}, "step2_anchor": {"instruction": "Strand B Formulas:", "referenceItems": ["Unit Price = Total Cost ÷ Number of Items", "30% off = pay 70% (× 0.70) → Add 13% HST = × 1.13", "2¼ = (2×4 + 1)/4 = 9/4 → Keep-Change-Flip: (9/4) × (8/3)"]}, "step3_substeps": [{"label": "Step 3a: Part 1 — Calculate Unit Rate for Store A and Store B ($ per sock) and name the Better Buy", "placeholder": "Store A: $27.00 ÷ 12 = $...\nStore B: $17.20 ÷ 8 = $...\nBetter Buy: ...", "hint": "27 ÷ 12 = 2.25; 17.20 ÷ 8 = 2.15!", "modelSubAnswer": "• Store A: $27.00 ÷ 12 socks = $2.25 per sock.\n• Store B: $17.20 ÷ 8 socks = $2.15 per sock.\n• Conclusion: Store B is the better buy by $0.10 per sock!"}, {"label": "Step 3b: Part 2 — Calculate the 30%-off sale price of the $90 basketball, then add 13% Ontario HST", "placeholder": "Sale Price = $90 × 0.70 = $...\nFinal with 13% HST = $... × 1.13 = $...", "hint": "30% of $90 is $27 → Sale Price = $63.00. Then $63.00 × 1.13 = ?", "modelSubAnswer": "• Discount: 30% of $90.00 = $27.00 → Sale Price = $90.00 − $27.00 = $63.00 (Check: $90 × 0.70 = $63.00).\n• 13% Ontario HST: $63.00 × 0.13 = $8.19 → Final Total = $63.00 + $8.19 = $71.19 (Check: $63 × 1.13 = $71.19)."}, {"label": "Step 3c: Part 3 — Solve (2¼) ÷ (3/8) using Improper Fractions + Keep-Change-Flip, AND write 6,400,000 in Scientific Notation", "placeholder": "2¼ = 9/4\n(9/4) ÷ (3/8) = (9/4) × ... = ...\n6,400,000 = ... × 10^...", "hint": "(9/4) × (8/3) = 72/12 = 6! And count the decimal jumps from 6,400,000. to 6.4!", "modelSubAnswer": "• Fraction Division: Convert 2¼ = 9/4. Keep-Change-Flip: (9/4) × (8/3) = 72/12 = 6 (exactly 6!).\n• Scientific Notation: Move decimal 6 places left from 6,400,000 → 6.4 × 10⁶ (6.4 is between 1 and 10!)."}], "step4_checks": ["Did I divide Cost ÷ Quantity (and NOT Quantity ÷ Cost) in Part 1?", "Did I apply 30% off BEFORE adding 13% HST in Part 2 ($71.19)?", "In Part 3, did I flip the SECOND fraction (3/8 → 8/3) and verify 6.4 is between 1 and 10?"], "step5_modelAnswer": {"basicAnswer": "Part 1: Store B ($2.15). Part 2: $71.19. Part 3: 6 and 6.4 × 10⁶.", "expandedAnswer": "Complete Grade 7+ Multi-Step Math Solution:\n• Part 1 (Unit Rates): Store A = $27.00 ÷ 12 = $2.25/sock; Store B = $17.20 ÷ 8 = $2.15/sock → Store B is the better buy (saves $0.10/sock).\n• Part 2 (Discount + Ontario HST): 30% off $90 = $90 × 0.70 = $63.00 subtotal. Adding 13% HST: $63.00 × 1.13 = $71.19 final cost.\n• Part 3 (Fractions & Scientific Notation): 2¼ ÷ 3/8 = (9/4) × (8/3) = 72/12 = 6. Scientific notation of 6,400,000 = 6.4 × 10⁶.", "extensionPrompt": "Extension Challenge: Suppose a store offers EITHER '$15 off' OR '20% off' on an $80 jacket—which coupon saves more money before tax?"}}]}, {"id": "math-u4", "title": "Unit 4 (Nelson Mod. 2 / Khan): Distributive Property, Linear Graphs, Inequalities & Coding", "studyFirstTag": "Expand brackets, graph linear patterns, solve inequalities & trace Grade 7 code loops!", "curriculumStrand": "Ontario 2020 Math Strand C: Algebra, Linear Relations, Inequalities & Coding", "svgDiagram": "math_linear_coding_svg", "lessons": [{"id": "math-u4-l1", "title": "Lesson 4.1: Distributive Property, Like Terms & Linear Pattern Rules", "readTime": "3 min read", "bigIdea": "The Distributive Property multiplies EVERY term inside brackets, and Linear Rules (y = mx + b) turn repeating number patterns into straight lines on a graph!", "paragraphs": ["To simplify an algebraic expression like 3(2x − 4) + 5x, first use the DISTRIBUTIVE PROPERTY: multiply the outside 3 by BOTH terms inside the brackets (NEVER forget the second term!): 3(2x) − 3(4) = 6x − 12. Next, COMBINE LIKE TERMS (only terms with the exact same variable can combine!): 6x + 5x − 12 = 11x − 12!", "A LINEAR PATTERN grows or shrinks by the EXACT same constant step every single time! For example, look at the gym fundraiser savings: Week 0 = $5, Week 1 = $8, Week 2 = $11, Week 3 = $14. Notice it goes UP by +3 every week (Constant Rate of Change = 3) and started at $5 (Initial Value = 5).", "That gives the instant Linear Rule: y = 3x + 5! Plot those pairs (0,5), (1,8), (2,11), (3,14) on the Coordinate Plane and they line up in a laser-straight line! Want to predict Week 20 without counting? Just plug in x = 20: y = 3(20) + 5 = $65!"], "keyTakeaway": "Distributive Property: a(b + c) = ab + ac (multiply BOTH terms inside!) | Linear Rule: y = (Constant Step)x + (Start at x=0).", "deepReadTitle": "🛡️ D. Forbes Distributive Sign Trap!", "deepReadText": "Watch negative numbers outside brackets:\n−2(x − 5) = (−2)(x) + (−2)(−5) = −2x + 10! (Negative × Negative = POSITIVE +10!)", "videos": [{"id": "Jkb1-ekHTg4", "title": "The Distributive Property Explained | Algebraic Expressions", "channel": "Math with Mr. J", "why": "Visualizes multiplying the outside number into every term inside brackets."}, {"id": "MXV65i9g1Xg", "title": "Math Antics — Basic Linear Functions & Graphing", "channel": "Math Antics", "why": "Connects tables of values, y = mx + b rules, and straight-line coordinate graphs."}], "quickCheck": {"question": "Expand and simplify:  4(2x − 3) + 5x", "options": ["13x − 3", "13x − 12", "8x − 12"], "correctIdx": 1, "explanation": "Distribute 4 to BOTH terms: 4(2x) − 4(3) = 8x − 12. Then combine like terms: 8x + 5x − 12 = 13x − 12!"}}, {"id": "math-u4-l2", "title": "Lesson 4.2: Inequalities & Ontario 2020 Coding (Loops & Sub-Programs)", "readTime": "3 min read", "bigIdea": "Inequalities describe a whole range of winning answers (like 'at least 80%'), and Coding loops let a computer calculate 100 math steps in a millisecond!", "paragraphs": ["While an equation (x = 5) has just ONE answer, an INEQUALITY describes all values greater than (>), less than (<), greater than or equal to (≥), or less than or equal to (≤) a target! Solve inequalities like 2x + 3 > 11 the exact same way as equations: subtract 3 (2x > 8), divide by 2 → x > 4! On a number line, use an OPEN circle (○) for > or < (not included), and a CLOSED solid dot (●) for ≥ or ≤ (included!).", "Ontario's 2020 Math Curriculum also includes CODING! A LOOP (`for x in range(1, 5):`) repeats a math calculation automatically without rewriting code. Remember the #1 Python/Coding catch: `range(1, 5)` starts at 1 and stops BEFORE 5—so it runs for x = 1, 2, 3, 4!", "A SUB-PROGRAM (Function, like `def gym_score(baskets, free_throws):`) packages a reusable math formula under one clean name so you can call it over and over with different inputs—just like an algebraic function machine!"], "keyTakeaway": "Open Circle (○) = < or > | Closed Dot (●) = ≤ or ≥ | Flip the inequality sign ONLY if you multiply/divide by a NEGATIVE! | `range(a, b)` stops BEFORE b!", "deepReadTitle": "💻 Trace This Ontario Grade 7 Coding Block!", "deepReadText": "total = 0\nfor i in range(1, 5):   # i = 1, 2, 3, 4\n    total = total + (2 * i)\nprint(total)\n→ Loop runs: 2(1)=2, 2(2)=4, 2(3)=6, 2(4)=8 → total = 2 + 4 + 6 + 8 = 20!", "videos": [{"id": "RyesLifeUBw", "title": "Algebra Basics: Inequalities In Algebra", "channel": "Math Antics", "why": "Clear explanation of <, >, ≤, ≥, open vs. closed number-line dots, and solving steps."}, {"id": "9C--qjbq1wY", "title": "Python Loops for Beginners (Tracing for-Loops)", "channel": "After School", "why": "Matches Ontario Grade 7 Math Strand C coding expectations for tracing and modifying loops."}], "quickCheck": {"question": "If you trace `total = 10` followed by `for n in range(1, 4): total = total + 5`, what final value prints? (Careful: how many times does `range(1, 4)` run?)", "options": ["25 (runs 3 times: n = 1, 2, 3)", "30 (runs 4 times: n = 1, 2, 3, 4)", "15 (runs 1 time)"], "correctIdx": 0, "explanation": "`range(1, 4)` runs for n = 1, 2, and 3 (3 loops!). Adding 5 three times to 10 gives 10 + 15 = 25!"}}], "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Algebra, Inequalities & Coding Core Anchors", "content": "Keep these 3 Strand C rules sharp:", "keyPoints": ["Distributive Property: a(b − c) = ab − ac", "Inequalities: ○ = < / > | ● = ≤ / ≥ | Flip arrow if ×/÷ by a NEGATIVE!", "Coding: Variables store values, Loops repeat steps, Functions (`def`) package reusable formulas"]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "How a Linear Rule `y = mx + b` and a Coding `for`-Loop Are the Same Idea", "content": "A coding loop is just an automated Table of Values!", "analogy": "🎮 Video Game XP Analogy: Starting a new level with 50 XP and earning 25 XP per win is BOTH a math rule (`XP = 25w + 50`) AND a line of game code (`xp = 25 * wins + 50`)!", "keyPoints": ["Rate of change (25) = multiplier; Starting value (50) = constant added."]}, {"level": 3, "name": "APPLY", "subtitle": "Solve an Equation with Brackets Using Distributive Property", "content": "Expand FIRST, then balance both sides:", "workedExample": {"prompt": "Solve and check:  3(x − 4) = 15", "steps": ["Step 1 (Distribute 3): 3x − 12 = 15.", "Step 2 (Add 12 to both sides): 3x = 27.", "Step 3 (Divide by 3): x = 9. LS Check: 3(9 − 4) = 3(5) = 15 = RS ✅!"]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Equations vs. Inequalities", "content": "Spot the exact similarities and differences:", "comparisonTable": {"headers": ["Feature", "Equation (2x + 1 = 9)", "Inequality (2x + 1 ≥ 9)"], "rows": [["Solution", "Exactly ONE number (x = 4)", "Infinite range of numbers (x ≥ 4: 4, 4.5, 5, 100...)"], ["Number Line Graph", "Single solid point at 4", "Solid dot ● at 4 with arrow shading right →"], ["Negative Multiply/Divide", "Sign stays '='", "MUST FLIP the inequality arrow (< ↔ >)!"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Debug a Broken Student Algebra & Coding Solution", "content": "Find both bugs:", "keyPoints": ["❌ Algebra Bug: Expanding 5(x − 2) as 5x − 2! → ✅ Fix: Multiply 5 by −2 too → 5x − 10!", "❌ Coding Bug: Writing `range(1, 10)` expecting 10 to be included! → ✅ Fix: Use `range(1, 11)` because Python stops 1 before the end!"]}, {"level": 6, "name": "CREATE", "subtitle": "Write a Linear Rule & Mini-Code Loop for a School Fundraiser", "content": "Combine algebra, inequalities ('how many items to earn at least $200?'), and coding logic.", "keyPoints": ["Full Ontario 2020 Strand C mastery!"]}], "questions": [{"id": "math-u4-q1", "bloomLevel": 6, "bloomTag": "APPLY, ANALYZE & CODE", "title": "Ontario 2020 Strand C Lab: Distributive Equations, Inequalities & Loop Tracing", "prompt": "Solve all 3 parts showing every intermediate step:\n• Part 1 (Distributive Equation + LS=RS Check): Solve  4(2x − 5) = 28  and verify using Left Side = Right Side.\n• Part 2 (Linear Rule & Inequality): A gym club charges a $20 registration fee plus $6 per session (`Cost = 6s + 20`). If Zaid has at most $68 to spend (`6s + 20 ≤ 68`), solve the inequality to find the maximum number of sessions `s` he can attend, and state whether the number line uses an open (○) or closed (●) dot at that answer.\n• Part 3 (Coding Trace): Trace this Python/pseudocode loop line by line and give the exact final value printed for `score`:\n  score = 10\n  for round in range(1, 5):\n      score = score + (3 * round)\n  print(score)", "step1_deconstruct": {"instruction": "Identify the 3 tasks: Distributive equation, Inequality with dot type, and Loop trace (`range(1, 5)` = 1, 2, 3, 4!).", "guidingQuestions": ["In Part 1, what is 4(2x − 5) when expanded?", "In Part 2, does '≤' use an open or closed dot?", "In Part 3, which values does `round` take in `range(1, 5)`?"], "modelPlan": "Part 1: Expand to 8x − 20 = 28 → 8x = 48 → x = 6 (check LS=RS). Part 2: 6s ≤ 48 → s ≤ 8 (closed solid dot ●). Part 3: Start at 10, add 3(1)=3, 3(2)=6, 3(3)=9, 3(4)=12 → final score = 40."}, "step2_anchor": {"instruction": "Strand C Rules:", "referenceItems": ["4(2x − 5) = 8x − 20 (multiply BOTH terms!)", "≤ and ≥ use a CLOSED solid dot ● (value is included!)", "range(1, 5) runs for 1, 2, 3, 4 (stops BEFORE 5!)"]}, "step3_substeps": [{"label": "Step 3a: Part 1 — Expand and solve 4(2x − 5) = 28 AND write the LS = RS verification check", "placeholder": "8x − 20 = 28\n8x = ...\nx = ...\nLS Check: 4(2(...) − 5) = ...", "hint": "28 + 20 = 48; 48 ÷ 8 = 6!", "modelSubAnswer": "4(2x − 5) = 28\n8x − 20 = 28     (Distribute 4 to both terms)\n8x = 48          (Add 20 to both sides)\nx = 6            (Divide by 8)\nLS Check: 4(2(6) − 5) = 4(12 − 5) = 4(7) = 28 = RS ✅!"}, {"label": "Step 3b: Part 2 — Solve the inequality 6s + 20 ≤ 68 and state Open ○ vs. Closed ● dot", "placeholder": "6s + 20 − 20 ≤ 68 − 20\n6s ≤ ...\ns ≤ ...\nDot type: ...", "hint": "68 − 20 = 48; 48 ÷ 6 = 8. Since '≤' includes 8, is the dot open or closed?", "modelSubAnswer": "6s + 20 ≤ 68\n6s ≤ 48          (Subtract 20 from both sides)\ns ≤ 8            (Divide by 6)\nZaid can attend at most 8 sessions. Because '≤' INCLUDES 8, the number line uses a CLOSED solid dot (●) at 8 shaded left (from 0 to 8)."}, {"label": "Step 3c: Part 3 — Trace each loop iteration of `for round in range(1, 5)` and find the final `score`", "placeholder": "Start: score = 10\nround = 1 → score = 10 + 3 = 13\nround = 2 → ...\nround = 3 → ...\nround = 4 → ...", "hint": "Remember `range(1, 5)` stops BEFORE 5 (so round = 1, 2, 3, 4)!", "modelSubAnswer": "• Start: score = 10\n• round = 1: score = 10 + (3 × 1) = 13\n• round = 2: score = 13 + (3 × 2) = 19\n• round = 3: score = 19 + (3 × 3) = 28\n• round = 4: score = 28 + (3 × 4) = 40\nFinal Printed Output: 40!"}], "step4_checks": ["Did I multiply 4 by BOTH 2x AND −5 in Part 1 and complete the LS = RS check?", "Did I verify that '≤' uses a CLOSED solid dot ● in Part 2?", "In Part 3, did I stop the loop at round = 4 (NOT round = 5) and double-check 10 + 3 + 6 + 9 + 12 = 40?"], "step5_modelAnswer": {"basicAnswer": "Part 1: x = 6. Part 2: s ≤ 8 (closed dot). Part 3: 40.", "expandedAnswer": "Complete Ontario Strand C Exemplar:\n• Part 1: 4(2x − 5) = 28 ⇒ 8x − 20 = 28 ⇒ 8x = 48 ⇒ x = 6. Check: LS = 4(12 − 5) = 4(7) = 28 = RS ✅.\n• Part 2: 6s + 20 ≤ 68 ⇒ 6s ≤ 48 ⇒ s ≤ 8 sessions maximum. Graphed with a CLOSED solid dot (●) at 8 because 8 is included.\n• Part 3: `range(1, 5)` iterates round = 1, 2, 3, 4: 10 → 13 → 19 → 28 → 40. Final printed score = 40.", "extensionPrompt": "Coding Extension: How would you change ONE number in `range(1, 5)` so the loop also includes round 5, and what would the new total be?"}}]}, {"id": "math-u5", "title": "Unit 5 (Nelson Mod. 3 / Khan): Trapezoids, Cylinder Surface Area, Parallel Angles & Transformations", "studyFirstTag": "Master F/Z/C parallel angles, trapezoid/composite areas, cylinder surface area & grid moves!", "curriculumStrand": "Ontario 2020 Math Strand E: Spatial Sense, Geometry & Measurement", "svgDiagram": "math_angles_svg", "lessons": [{"id": "math-u5-l1", "title": "Lesson 5.1: Area of Trapezoids, Composite Shapes & Surface Area of Cylinders", "readTime": "3 min read", "bigIdea": "Every complex 2D shape splits into rectangles and triangles, and unrolling a 3D cylinder reveals 2 identical circles + 1 giant rectangle!", "paragraphs": ["To find the AREA of a PARALLELOGRAM, multiply Base × Height (`A = b × h` — use the straight-up perpendicular height, NEVER the slanted side!). For a TRAPEZOID (which has two parallel bases `a` and `b`), average the two bases and multiply by height: `A = (a + b) × h ÷ 2`! For weird L-shaped Composite Shapes, simply slice them into rectangles/triangles, find each piece's area, and ADD them up.", "In Unit 2 you learned Cylinder Volume (`V = πr²h`). Now, what if you want to paint or wrap the OUTSIDE of a soup can or gym water bottle? That's SURFACE AREA (measured in square units: cm²)! Unroll a cylinder's net and you see 3 flat shapes: a circular top (`πr²`), a circular bottom (`πr²`), and a curved side that unrolls into a rectangle whose width equals the circle's Circumference (`2πr`) and height is `h`!", "Putting those 3 pieces together gives the complete Cylinder Surface Area formula: `SA = 2πr² + 2πrh`! Watch out for real-world word problems: if a cup or open-top bottle has NO lid, use just ONE circle (`πr² + 2πrh`)!"], "keyTakeaway": "Trapezoid Area = (a + b) × h ÷ 2 | Cylinder Surface Area = 2πr² (top & bottom) + 2πrh (curved label). Always convert Diameter → Radius first!", "deepReadTitle": "🥫 Visual Check: Why the Curved Label Width = 2πr", "deepReadText": "Peel the paper label straight off a soup can and lay it flat on your desk—it's a rectangle! The length of that rectangle had to wrap all the way around the circular lid, so its length = Circumference = 2πr (or πd), and its area = 2πrh!", "videos": [{"id": "-_SIZw5H4dA", "title": "Area of a Trapezoid (Step-by-Step)", "channel": "Math with Mr. J", "why": "Crystal-clear examples of (a + b) × h ÷ 2 without falling for slanted-side traps."}, {"id": "mtbvyU2m1CE", "title": "How to Find Surface Area of a Cylinder", "channel": "Zach's Math Zone", "why": "Unrolls a cylinder into 2 circles + 1 rectangle so the formula 2πr² + 2πrh makes total sense."}], "quickCheck": {"question": "A trapezoid has parallel top base a = 6 cm, bottom base b = 10 cm, perpendicular height h = 5 cm, and slanted side = 6 cm. What is its Area?", "options": ["48 cm²", "40 cm²", "80 cm²"], "correctIdx": 1, "explanation": "A = (a + b) × h ÷ 2 = (6 + 10) × 5 ÷ 2 = 16 × 5 ÷ 2 = 80 ÷ 2 = 40 cm²! (Always ignore the slanted side and don't forget ÷ 2!)"}}, {"id": "math-u5-l2", "title": "Lesson 5.2: Parallel Line Angles (F, Z, C Patterns) & Coordinate Transformations", "readTime": "3 min read", "bigIdea": "When a line slices across two parallel lines, three letters (F, Z, C) unlock EVERY missing angle instantly—and 4 moves slide, flip, spin, or resize shapes on a grid!", "paragraphs": ["When a diagonal line (a TRANSVERSAL) cuts across two parallel lines, check the Visual Diagram for the 3 magic letter patterns: (1) F-Pattern (Corresponding angles) are EQUAL! (2) Z-Pattern (Alternate interior angles) are EQUAL! (3) C-Pattern (Co-interior angles inside the 'C') are SUPPLEMENTARY—meaning they ADD TO 180°! Also remember: angles on a straight line add to 180°, and opposite X-angles across an intersection are EQUAL.", "On the 4-quadrant Coordinate Plane, Grade 7 covers 4 TRANSFORMATIONS: (1) TRANSLATION (Slide): shifts every point by adding/subtracting `(x + a, y + b)`—size and orientation stay identical! (2) REFLECTION (Mirror Flip): flips across the x-axis `(x, −y)` or y-axis `(−x, y)`.", "(3) ROTATION (Turn): spins around a turn centre by 90°, 180°, or 270° clockwise (CW) or counter-clockwise (CCW). (4) DILATION (Resize): multiplies coordinates by a Scale Factor `k`—making the shape larger (`k > 1`) or smaller (`0 < k < 1`) while keeping all angles identical!"], "keyTakeaway": "Parallel Lines: F & Z = EQUAL | C = ADD TO 180° | Transformations: Translation (Slide), Reflection (Flip), Rotation (Turn), Dilation (Resize).", "deepReadTitle": "🧭 Quick Coordinate Reflection Trick", "deepReadText": "• Reflect point (3, 5) across the X-axis → x stays same, y flips sign → (3, −5)!\n• Reflect point (3, 5) across the Y-axis → y stays same, x flips sign → (−3, 5)!\n• Translate point (3, 5) Left 4, Up 2 → (3 − 4, 5 + 2) = (−1, 7)!", "videos": [{"id": "S78RrT_xT1M", "title": "Parallel Lines and Transversals — Geometry Made Easy!", "channel": "TabletClass Math", "why": "Shows corresponding, alternate, and co-interior angles solving puzzles step-by-step."}, {"id": "XiAoUDfrar0", "title": "Introduction to Transformations (Translations, Reflections, Rotations)", "channel": "Khan Academy", "why": "Clear visual breakdown of rigid motions on the coordinate plane."}], "quickCheck": {"question": "Two parallel lines are cut by a transversal forming a C-Pattern (co-interior angles). If one inside angle is 115°, what is the other inside angle?", "options": ["115°", "65°", "75°"], "correctIdx": 1, "explanation": "C-Pattern co-interior angles are Supplementary (add to 180°): 180° − 115° = 65°!"}}, {"id": "math-u5-l3", "title": "Lesson 5.3: 3D Orthographic Views (Top, Front, Side) & Polyhedron Nets", "readTime": "3 min read", "bigIdea": "Any 3D structure can be communicated accurately on flat paper using **3 Orthographic Views (Top, Front, Side)** or unfolded flat into a **2D Net**!", "paragraphs": ["Ontario 2020 Grade 7 Spatial Sense (`E1.2`) teaches you to sketch **Orthographic Views** of stacked cubes and 3D buildings: look straight down for the **Top View**, straight ahead for the **Front View**, and straight from the right for the **Right-Side View**! Notice how thick dark lines show step-downs in depth where one stack of blocks sits taller than the blocks in front of it.", "A **Net** is a 2D flat pattern that folds cleanly into a 3D solid with zero overlapping faces. A cube has **11 different valid nets** (six identical squares); a triangular prism unfolds into **2 matching triangles + 3 rectangles**; a cylinder unfolds into **2 circles + 1 rectangle** whose length equals the circle's circumference (`2πr`)!", "Pro Spatial Tip: When checking whether a folded net matches a 3D prism, count the **exact number of faces** first (a square-based pyramid MUST have `1 square + 4 triangles = 5 faces`) and verify opposite faces don't fold onto the same spot!"], "keyTakeaway": "Orthographic Views show exact **Top, Front & Side** profiles (thick lines mark depth changes!). Always verify a 3D **Net** by counting its exact faces!", "deepReadTitle": "📦 Quick 3D Face & Net Counter", "deepReadText": "• Cube / Rectangular Prism: 6 rectangles (opposite faces identical)\n• Triangular Prism: 2 triangles + 3 rectangles (5 faces)\n• Square Pyramid: 1 square + 4 triangles (5 faces) | Cylinder: 2 circles + 1 rectangle", "quickCheck": {"question": "If a 3D net has **2 identical triangles** and **3 rectangles**, which 3D solid does it fold into?", "options": ["A triangular pyramid (tetrahedron)", "A triangular prism", "A square-based pyramid"], "correctIdx": 1, "explanation": "A **triangular prism** has 2 parallel triangular bases connected by 3 rectangular side faces (`2 + 3 = 5 faces`)!"}, "videos": [{"id": "knybOo9pdwg", "title": "Top, Front and Side Views of 3D Objects (Grade 7 Math)", "channel": "Khan Academy", "why": "Direct visual mastery of orthographic 3D views for Ontario Grade 7 E1.2."}]}], "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Geometry Formulas & Parallel Line Angle Letters", "content": "Essential Strand E memory anchors:", "keyPoints": ["Trapezoid Area = (a + b) × h ÷ 2 | Cylinder SA = 2πr² + 2πrh", "Parallel Lines: F (Corresponding) = Equal | Z (Alternate) = Equal | C (Co-Interior) = 180°", "Transformations: Slide (Translation), Flip (Reflection), Turn (Rotation), Resize (Dilation)"]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Why Slanted Side Length Is NEVER the Height of a Parallelogram or Trapezoid", "content": "Height is always measured straight up at a 90° right angle to the base!", "analogy": "📏 Gym Height Measurement Analogy: When the nurse measures your height against the wall, you stand straight up at 90°—you don't lean sideways at an angle! Shapes measure height the exact same way!", "keyPoints": ["Always look for the dashed 90° right-angle symbol for height `h`."]}, {"level": 3, "name": "APPLY", "subtitle": "Calculate Total Surface Area of a Closed Cylinder", "content": "Break SA into 2 Circles + 1 Curved Label:", "workedExample": {"prompt": "Find the Surface Area of a closed cylinder with radius r = 4 cm and height h = 10 cm (π ≈ 3.14).", "steps": ["Step 1 (2 Circular Ends): 2 × π × r² = 2 × 3.14 × 4² = 2 × 3.14 × 16 = 100.48 cm².", "Step 2 (Curved Side Label): 2 × π × r × h = 2 × 3.14 × 4 × 10 = 251.20 cm².", "Step 3 (Total SA): 100.48 + 251.20 = 351.68 cm²!"]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Congruent vs. Similar Transformations", "content": "Which transformations keep the exact same size vs. change size?", "comparisonTable": {"headers": ["Transformation", "Action", "Same Size & Shape (Congruent)?", "Coordinate Example on (2, 3)"], "rows": [["Translation", "Slide (Right 3, Down 1)", "YES (Congruent)", "(2+3, 3−1) = (5, 2)"], ["Reflection", "Mirror across x-axis", "YES (Congruent)", "(2, −3)"], ["Rotation", "Turn 180° around (0,0)", "YES (Congruent)", "(−2, −3)"], ["Dilation", "Scale Factor k = 2", "NO (Similar — 2× bigger!)", "(2×2, 3×2) = (4, 6)"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Catch 3 Geometry Careless Errors", "content": "Run the D. Forbes Shield:", "keyPoints": ["❌ Forgetting `÷ 2` in Trapezoid Area!", "❌ Using cm³ instead of cm² for Surface Area (Area is ALWAYS squared: cm²!).", "❌ Setting C-pattern angles equal instead of subtracting from 180°!"]}, {"level": 6, "name": "CREATE", "subtitle": "Extension: Minimize Packaging Material for a Cylinder", "content": "Compare Surface Area of two cans holding the same volume to design eco-friendly packaging!", "keyPoints": ["Links Grade 7 Math Measurement with Geography Sustainability!"]}], "questions": [{"id": "math-u5-q1", "bloomLevel": 5, "bloomTag": "APPLY & EVALUATE", "title": "Spatial Sense Mastery: Trapezoid Area, Cylinder Surface Area & Parallel Angles", "prompt": "Solve all 3 Geometry challenges showing formulas and exact units (cm² or °):\n• Part 1 (Trapezoid Area): A trapezoid-shaped gym banner has parallel bases a = 8 m and b = 14 m, perpendicular height h = 6 m, and slanted sides of 7 m. Calculate its Area in m².\n• Part 2 (Closed Cylinder Surface Area): A closed cylindrical soup can has a DIAMETER of 6 cm and a height of 10 cm. Using π ≈ 3.14, calculate its total Surface Area (`SA = 2πr² + 2πrh`) in cm².\n• Part 3 (Parallel Angles & Coordinate Move): (i) Two parallel lines are cut by a transversal; angle A = 128°. Find its Z-pattern alternate angle B AND its C-pattern co-interior angle C. (ii) Translate point P(−2, 5) Right 6 units and Down 3 units, then reflect that new point across the x-axis!", "step1_deconstruct": {"instruction": "Spot all traps first: ignore the slanted 7 m side in Part 1, convert DIAMETER 6 cm → RADIUS 3 cm in Part 2, and do both steps in Part 3!", "guidingQuestions": ["In Part 1, which number is the distractor (slanted side)?", "In Part 2, what is the radius r when diameter = 6 cm?", "In Part 3, how do Z-pattern and C-pattern rules differ?"], "modelPlan": "Part 1: (8+14)×6÷2 = 66 m². Part 2: r = 3 cm → 2(3.14)(9) + 2(3.14)(3)(10) = 56.52 + 188.40 = 244.92 cm². Part 3: B = 128°, C = 180°−128° = 52°; P(−2,5) → (4, 2) → reflected across x-axis = (4, −2)."}, "step2_anchor": {"instruction": "Geometry Formulas:", "referenceItems": ["Trapezoid: A = (a + b) × h ÷ 2 (ignore slanted sides!)", "Cylinder SA: r = d ÷ 2 → SA = 2πr² + 2πrh (units: cm²!)", "Z-Pattern = Equal | C-Pattern = Add to 180° | Reflect across x-axis: (x, y) → (x, −y)"]}, "step3_substeps": [{"label": "Step 3a: Part 1 — Calculate the Area of the Trapezoid banner (a = 8 m, b = 14 m, h = 6 m)", "placeholder": "A = (8 + 14) × 6 ÷ 2 = ... m²", "hint": "8 + 14 = 22. Multiply 22 × 6 = 132, then divide by 2!", "modelSubAnswer": "A = (a + b) × h ÷ 2 = (8 + 14) × 6 ÷ 2 = 22 × 6 ÷ 2 = 132 ÷ 2 = 66 m². (Ignored the slanted 7 m distractor!)."}, {"label": "Step 3b: Part 2 — Convert diameter 6 cm to radius r, then compute Closed Cylinder SA = 2πr
