 1: All matter is made up of tiny, microscopic particles.", "⚛️ Rule 2: All particles of ONE pure substance are identical (same size, shape, and properties); different pure substances are made of different particles.", "⚛️ Rule 3: There are empty spaces between particles (small spaces in solids/liquids, huge spaces in gases).", "⚛️ Rule 4: Particles are ALWAYS moving (vibrating in solids, sliding in liquids, flying rapidly in gases). Adding heat (thermal energy) makes particles move FASTER and spread farther apart!", "⚛️ Rule 5: There are attractive forces between particles (strongest in solids, weaker in liquids, weakest in gases)."]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Pure Substances vs. Homogeneous Solutions vs. Heterogeneous Mechanical Mixtures", "content": "How can a clear liquid like salt water be a mixture when it looks just like pure water?", "analogy": "🥗 Cafeteria Lunch Analogy: A bottle of distilled water has only H₂O particles (Pure Substance). A bowl of vegetable soup or trail mix in the cafeteria lets you see the separate pieces with your eyes (Heterogeneous Mechanical Mixture). Apple juice or salt dissolved in water has 2+ types of particles, but they attract and hide in the spaces between each other so it looks like one uniform phase (Homogeneous Mixture / Solution)!", "keyPoints": ["Solute vs. Solvent: In a solution, the SOLUTE is the substance in smaller amount that gets dissolved (e.g., salt, sugar), and the SOLVENT is the substance in larger amount that does the dissolving (e.g., water — the 'Universal Solvent')."]}, {"level": 3, "name": "APPLY", "subtitle": "Explain Why Volume Shrinks When Mixing Alcohol and Water (Using Particle Theory)", "content": "Apply Postulates 2, 3, and 5 to explain a classic Grade 7 Science lab phenomenon:", "workedExample": {"prompt": "Lab Observation: You pour 50 mL of pure water and 50 mL of pure rubbing alcohol into a graduated cylinder. Instead of 100 mL, the total volume measures only 96 mL! Why?", "steps": ["Step 1 (Identify Particles — Rule 2): Water particles and alcohol particles are two different pure substances with different particle sizes.", "Step 2 (Identify Spaces — Rule 3): There are empty spaces between the particles of water and between the particles of alcohol.", "Step 3 (Explain Interlocking — Rule 5): Like pouring small marbles into a bucket of basketballs in the gym equipment room, the smaller water particles slip into the empty spaces between the larger alcohol particles, reducing the total volume to 96 mL!"]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Mixture Separation Methods & Heat Transfer Mechanisms", "content": "Analyze how physical properties determine which separation technique works, and how Particle Theory explains Heat:", "comparisonTable": {"headers": ["Concept / Method", "How It Works Scientifically", "What Type of Mixture / System?", "Real-World Example"], "rows": [["Filtration", "Porous barrier traps larger solid particles while small liquid particles pass through", "Mechanical mixture (insoluble solid + liquid)", "Coffee filter, water treatment sand beds"], ["Evaporation", "Heating speeds up solvent particles until they escape as gas, leaving solute behind", "Solution (recovering dissolved solid solute)", "Harvesting sea salt from ocean water"], ["Distillation", "Boils liquid solvent into gas and condenses it back into pure liquid in a cool tube", "Solution (recovering pure liquid solvent or two liquids)", "Desalinating ocean water into pure drinking water"], ["Magnetism / Sifting", "Uses magnetic attraction or particle size differences", "Solid-solid mechanical mixture", "Recycling plants separating steel cans from aluminum"], ["Conduction, Convection, Radiation (Heat Preview)", "Conduction = particle collisions in solids; Convection = warm fluid rising/cool sinking; Radiation = electromagnetic waves", "Thermal Energy Transfer in Earth Systems", "Metal spoon warming (conduction), boiling soup (convection), sunlight (radiation)"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Audit Scientific Explanations for Precision (D. Forbes Rubric Check)", "content": "D. Forbes noted you 'usually explain concepts accurately.' Here is the difference between a 'Usually Accurate (Level 3)' explanation and a '100% Precise (Level 4+)' explanation:", "keyPoints": ["Question: Why does sugar dissolve faster in hot tea than in iced tea?", "⚠️ Informal Answer (Level 3): 'Because the hot tea melts the sugar faster and has more energy.' (Inaccurate word: 'melts'—melting is a phase change from heat alone; dissolving is mixing solute into solvent!).", "✅ Precise Scientific Answer (Level 4+): 'According to the Particle Theory, heating the tea adds thermal energy, causing the water (solvent) particles to move faster and collide more frequently and forcefully with the sugar (solute) crystals. Furthermore, faster-moving water particles spread slightly farther apart, creating larger spaces for sugar particles to disperse uniformly.'"]}, {"level": 6, "name": "CREATE", "subtitle": "Design a 4-Stage Industrial Separation Protocol for an Environmental Spill", "content": "Synthesize magnetism, flotation/skimming, filtration, and distillation to clean up a complex polluted mixture.", "keyPoints": ["Complex Mixture: Water + dissolved road salt + sand + iron filings + floating vegetable oil -> Must be separated in the exact optimal sequence so one step doesn't ruin the next!"]}], "questions": [{"id": "sci-q1", "bloomLevel": 5, "bloomTag": "ANALYZE & EVALUATE", "title": "Particle Theory Precision Lab: Solutions, Saturation & Temperature", "prompt": "A student puts 40 g of salt (solute) into 100 mL of cold water (solvent) at 10°C and stirs. Most of the salt dissolves, leaving a clear liquid on top, but 4 g of undissolved salt crystals sit at the bottom of the beaker. Next, the student heats the beaker to 80°C, and the remaining 4 g of salt disappears completely!\n\nAnswer in deep multi-step scientific work:\n(a) Classify the contents of the beaker at 10°C (is the top liquid a pure substance or solution? Is it saturated or unsaturated? What is the whole beaker containing liquid + bottom crystals?).\n(b) Using at least 3 specific postulates of the Particle Theory, explain WHY heating the water to 80°C allowed the remaining 4 g of salt to dissolve.\n(c) Explain how you could recover BOTH the pure dry salt AND the pure drinking water in separate containers.", "step1_deconstruct": {"instruction": "STOP & PLAN: Identify the exact scientific vocabulary required for parts (a), (b), and (c) so you don't use informal words like 'melted'!", "guidingQuestions": ["Part (a): What do we call a solution that cannot dissolve any more solute at a given temperature? (Saturated!)", "Part (b): Which 3 Particle Theory rules explain dissolving when temperature increases? (Particle motion/speed, spaces between particles, attractive forces/collisions).", "Part (c): If we want to keep BOTH the water and the salt, why isn't simple evaporation enough? Which method captures the water vapour too?"], "modelPlan": "(a) Top liquid = saturated homogeneous solution; whole beaker with undissolved crystals at bottom = heterogeneous mechanical mixture. (b) Use thermal energy -> faster particle motion -> stronger collisions & larger spaces between solvent particles. (c) Use Distillation (not just open evaporation) to condense and keep the pure water while leaving pure salt behind."}, "step2_anchor": {"instruction": "ANCHOR VOCABULARY CHECK: Never confuse 'Dissolving' with 'Melting'!", "referenceItems": ["Saturated Solution: A solution in which no more solute can dissolve at a specific temperature (spaces between solvent particles are full).", "Solubility & Temperature: Increasing temperature increases kinetic energy of particles, increasing solubility of most solids in liquids.", "Distillation = Evaporation + Condensation (recovers BOTH solute and solvent!)."]}, "step3_substeps": [{"label": "Step 3a: Part (a) — Classify the liquid at 10°C (saturated vs. unsaturated solution) and the overall beaker with the 4 g of solid salt at the bottom", "placeholder": "At 10°C, the clear liquid is a ... solution because... However, the entire beaker including the 4 g of undissolved crystals at the bottom is a...", "hint": "Since 36 g dissolved and 4 g could not dissolve at 10°C, the solution is holding its maximum capacity!", "modelSubAnswer": "At 10°C, the clear liquid portion is a saturated homogeneous mixture (solution) because the water (solvent) has dissolved the maximum amount of salt (solute, 36 g) possible at 10°C. Because 4 g of visible solid salt remains settled at the bottom as a second phase, the overall beaker contents form a heterogeneous mechanical mixture."}, {"label": "Step 3b: Part (b) — Explain WHY heating to 80°C dissolved the extra 4 g of salt using 3 postulates of the Particle Theory", "placeholder": "1. (Particle Motion): When thermal energy is added, the water particles...\n2. (Spaces Between Particles): Because they move faster, the spaces between water particles...\n3. (Collisions & Attraction): The fast-moving water particles collide with...", "hint": "Mention: (1) Particles are always moving & move faster when heated, (2) Spaces between particles expand, (3) Attractive forces between water and salt pull the remaining salt particles into the spaces.", "modelSubAnswer": "1. Particle Motion (Postulate 4): Adding heat (thermal energy) to reach 80°C causes the water and salt particles to move much faster (higher kinetic energy).\n2. Spaces Between Particles (Postulate 3): As the water (solvent) particles move faster and bump into each other, they spread slightly farther apart, creating more empty space between them.\n3. Attractive Forces & Collisions (Postulate 5): The faster-moving water particles collide more frequently with the 4 g of solid salt crystals, overcoming the attraction holding the salt crystals together and pulling the salt particles into the expanded spaces until the entire 40 g is uniformly dissolved."}, {"label": "Step 3c: Part (c) — Describe the exact separation process to recover BOTH pure dry salt AND pure liquid water", "placeholder": "To recover both the salt and the water, I would use distillation instead of simple evaporation because...", "hint": "Explain what boils at 100°C, what happens in the cooling condenser tube, and what stays behind in the boiling flask.", "modelSubAnswer": "To recover BOTH substances, we must use Distillation (not simple open evaporation, which loses the water vapour into the air). When the salt solution is heated to 100°C in a distillation flask, the water particles gain enough energy to boil and turn into steam (gas), while the heavy salt particles have a much higher boiling point and stay behind as pure dry salt crystals. The steam travels through a cold condenser tube, where it cools, loses thermal energy, and condenses back into pure liquid drinking water (distillate) in a separate receiving beaker."}], "step4_checks": ["Did I use the words 'solute' (salt), 'solvent' (water), 'saturated', and 'homogeneous solution'?", "Did I avoid the careless mistake of saying the salt 'melted'?", "Did I explicitly reference Particle Motion, Spaces Between Particles, and Attractive Forces in Part (b)?", "Did I explain Distillation (evaporation + condensation) in Part (c) so BOTH water and salt are saved?"], "step5_modelAnswer": {"basicAnswer": "(a) Saturated solution with extra salt at the bottom. (b) Heat makes particles move faster and make more room for the salt. (c) Use distillation to boil and condense the water and keep the salt.", "expandedAnswer": "Complete Grade 7+ Scientific Explanation (D. Forbes Precision Standard):\n(a) Classification at 10°C: The liquid is a saturated solution (homogeneous mixture) because all available spaces between the water (solvent) particles at 10°C are filled with 36 g of dissolved salt (solute) particles. Because 4 g of undissolved salt crystals remain visible at the bottom, the total beaker system is a two-phase heterogeneous mixture.\n(b) Particle Theory Explanation at 80°C: According to the Particle Theory, (1) adding thermal energy causes water particles to move much faster; (2) faster motion pushes the water particles slightly farther apart, enlarging the empty spaces between them; and (3) more frequent, energetic collisions allow water particles to attract and pull the remaining 4 g of salt particles away from the crystal and into those newly expanded spaces.\n(c) Recovering Both Components via Distillation: Heating the solution in a closed distillation apparatus boils the water solvent into water vapour at 100°C while leaving pure solid salt behind in the boiling flask. Passing the water vapour through a cooled condenser tube removes thermal energy, condensing the gas back into pure liquid water in a second container.", "extensionPrompt": "Extension Connection (Structures & Heat Strand): Why do engineers leave narrow expansion gaps ('expansion joints') between steel sections of bridges in Ottawa? Explain using the Particle Theory between −25°C winter and +35°C summer!"}}], "studyFirstTag": "Start Here: 5 Rules of Particle Theory + Solutions vs. Mixtures", "lessons": [{"id": "sci-u1-l1", "title": "Lesson 1.1: The 5 Rules of the Particle Theory of Matter", "readTime": "3 min read", "bigIdea": "Everything you can touch, drink, or breathe is made of microscopic moving particles—and those 5 rules explain every chemistry lab!", "paragraphs": ["D. Forbes noted that you already have a solid grasp of Particle Theory and Pure Substances & Mixtures! Let's sharpen your vocabulary from 'usually accurate' to 100% scientific precision.", "Memorize the 5 Postulates: (1) All matter is made of tiny particles. (2) All particles of ONE pure substance are identical; different substances have different particles. (3) There are empty spaces between particles. (4) Particles are ALWAYS moving—and adding heat (thermal energy) makes them move FASTER and spread FARTHER APART! (5) Attractive forces hold particles together (strongest in solids, weakest in gases).", "Watch out for the #1 vocabulary trap in Grade 7 Science: When sugar or salt disappears in hot water, do NOT say it 'melted'! Melting happens when heat alone turns a solid into its own liquid (like ice turning into liquid water). When a SOLUTE (salt) spreads evenly into the empty spaces between a SOLVENT (water), the exact scientific word is DISSOLVING!"], "keyTakeaway": "Heating adds thermal energy → particles move faster → spaces between solvent particles expand → more solute can dissolve!", "deepReadTitle": "🧪 Pure Substances vs. Solutions vs. Mechanical Mixtures + Distillation", "deepReadText": "• Pure Substance: Only ONE kind of particle (distilled water, pure gold, table salt).\n• Homogeneous Mixture (Solution): 2+ types of particles mixed so evenly it looks like one clear phase (salt water, air, apple juice). When full at a given temperature, it is SATURATED.\n• Heterogeneous Mechanical Mixture: You can see 2+ distinct parts (trail mix, sand + water, undissolved salt sitting on the bottom).\n• Separation Tip: Open evaporation saves only the dissolved solid (salt), whereas DISTILLATION (boiling + condensing steam back to liquid) recovers BOTH pure dry salt AND pure liquid water!", "quickCheck": {"question": "Why does salt dissolve faster and in larger amounts in 80°C water than in 10°C water?", "options": ["Because the hot water melts the salt into liquid salt.", "Because hot water particles move faster, collide harder with salt crystals, and spread slightly farther apart.", "Because cold water has no spaces between particles."], "correctIdx": 1, "explanation": "100% scientific precision! Thermal energy increases particle speed, collision force, and spaces between solvent particles—without using the inaccurate word 'melts'!"}, "videos": [{"id": "pTzUnPWSFeg", "title": "Particle Theory, Pure Substances, and Mixtures (Grade 7 Science)", "channel": "The Digital Classroom Experience", "why": "Directly aligned with the Ontario Grade 7 Science Particle Theory & Mixtures unit!"}]}]}, {"id": "sci-u2", "title": "Unit 2: Heat in the Environment, Form/Function of Structures & Ecosystems", "curriculumStrand": "Ontario Grade 7 Science Strands E (Heat), D (Structures & Mechanisms) & B (Interactions in Ecosystems)", "svgDiagram": "science_particle_svg", "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Core Anchors: Heat Transfer (3 Types), Structural Forces (4 Types) & Ecosystems", "content": "Master the big 3 remaining strands of Ontario Grade 7 Science with D. Forbes:", "keyPoints": ["🔥 Strand E — Heat in the Environment (3 Transfer Methods):\n• Conduction: Transfer of thermal energy through direct particle-to-particle collisions in SOLIDS (e.g., a metal spoon in hot soup).\n• Convection: Transfer of thermal energy in FLUIDS (liquids and gases) where warmer, less-dense fluid rises and cooler, denser fluid sinks in a convection current.\n• Radiation: Transfer of energy through electromagnetic (infrared) waves that can travel through empty space/vacuum (e.g., heat from the Sun or a campfire).", "🌉 Strand D — Structures & Mechanisms (3 Structure Types & 4 Internal Forces):\n• Structure Types: Solid (concrete dam), Frame (skeleton/bicycle frame/gym roof trusses), Shell (egg, bike helmet, dome).\n• 4 Internal Forces: Tension (pulling apart/stretching), Compression (pushing/squeezing together), Torsion (twisting), Shear (sliding/tearing in opposite directions).", "🌿 Strand B — Interactions in the Environment (Ecosystems):\n• Biotic (living: plants, animals, bacteria) vs. Abiotic (non-living: sunlight, water, soil, temperature).\n• Energy Pyramid: Producers (plants via photosynthesis) -> Primary Consumers (herbivores) -> Secondary/Tertiary Consumers (carnivores/omnivores) -> Decomposers (fungi/bacteria)."]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "How the Particle Theory Explains Convection Currents & Structural Expansion", "content": "Notice how the Particle Theory from Unit 1 explains BOTH Heat in the Environment AND Structural Engineering!", "analogy": "🏀 Gym Air Conditioning & Bridge Expansion Analogy: Why does the top row of the gym bleachers feel warmer than the gym floor? When air particles are heated, they move faster and spread farther apart (becoming less dense), so they float UP to the ceiling while cool, tightly packed air sinks to the floor (Convection)! And why do Ottawa bridges have metal tooth-like gaps? In +35°C summer heat, steel particles vibrate faster and expand; without expansion joints, compression forces would buckle the bridge!", "keyPoints": ["Thermal Energy vs. Temperature: Temperature is the AVERAGE kinetic energy (speed) of particles; Thermal Energy is the TOTAL kinetic energy of ALL particles in an object (a giant iceberg at 0°C has more total thermal energy than a tiny teacup of boiling water at 100°C because the iceberg has trillions more particles!)."]}, {"level": 3, "name": "APPLY", "subtitle": "Analyze Internal Forces Acting on a Bridge or Athlete", "content": "Apply structural engineering concepts to identify all 4 internal forces in action:", "workedExample": {"prompt": "When a heavy snowplow drives across the Vimy Memorial Bridge in Ottawa (an arch/suspension truss bridge), what internal forces act on its parts?", "steps": ["1. Compression: The concrete piers and arch ribs are squeezed downward by the weight (load) of the snowplow.", "2. Tension: The steel suspension cables holding up the road deck are pulled tight and stretched.", "3. Shear: Where steel bolts connect horizontal beams to vertical columns, opposing forces try to slice the bolts sideways.", "4. Torsion: High crosswinds blowing unevenly against the bridge deck try to twist the structure."]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Solid, Frame & Shell Structures + Triangle Truss Stability", "content": "Why do engineers build stadium roofs and bridges out of triangles instead of squares?", "comparisonTable": {"headers": ["Structure Type", "How It Resists Loads", "Advantages", "Disadvantages & Failure Risk"], "rows": [["Solid Structure (Dam, Brick, Mountain)", "Uses massive weight and solid material in compression", "Extremely strong under compression, won't easily tip", "Very heavy, expensive, uses huge amounts of material, no interior space"], ["Frame Structure (Truss Bridge, Skeleton, Gym Roof)", "Network of beams/struts joined at nodes shares tension & compression", "Lightweight, economical, open interior space; TRIANGLES cannot deform without bending a side!", "Joints/connections can fail under shear if not braced with triangles"], ["Shell Structure (Bike Helmet, Igloo, Fuselage)", "Curved outer surface distributes load evenly in all directions", "Strong yet hollow/lightweight; great for protection and containers", "A tiny crack or dent weakens the entire shell"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Audit an Energy Pyramid & Heat Loss Design", "content": "Check these two critical Grade 7 Science principles:", "keyPoints": ["10% Ecological Energy Rule: When energy moves up a food chain (Grass -> Rabbit -> Fox), roughly 90% of the energy at each level is used for life processes or lost as heat, and only 10% is passed to the next level! ( E.g., 10,000 J of grass -> 1,000 J in rabbits -> 100 J in foxes).", "Thermos (Vacuum Flask) Audit: A high-tech thermos stops ALL 3 heat transfer types: (1) A vacuum between double walls has no particles, stopping Conduction and Convection; (2) A shiny silver mirror coating reflects infrared waves, stopping Radiation!"]}, {"level": 6, "name": "CREATE", "subtitle": "Design an Energy-Efficient, Snow-Load-Resistant Canadian Eco-Gymnasium", "content": "Synthesize Heat (insulation against Conduction/Convection/Radiation), Structures (triangular roof trusses & low centre of gravity), and Ecosystems (solar flow resources & native plants).", "keyPoints": ["Connects all 4 Ontario Grade 7 Science strands into one engineering design!"]}], "questions": [{"id": "sci-u2-q1", "bloomLevel": 6, "bloomTag": "ANALYZE, EVALUATE & CREATE", "title": "Ottawa Winter Engineering Lab: Heat Transfer, Particle Theory & Structural Forces", "prompt": "Engineers are designing a new gymnasium roof and heating system for a school in Ottawa where winter temperatures drop to −30°C and heavy wet snow piles on the roof:\n(a) HEAT & PARTICLE THEORY: Explain how thermal energy would escape from the warm gym (+20°C) to the freezing outside (−30°C) through Conduction, Convection, and Radiation, and explain how double-paned argon-gas windows with reflective coating stop all 3.\n(b) STRUCTURES & FORCES: When 20,000 kg of wet snow (Dynamic/Live Load) sits on the flat gym roof supported by steel beams, which internal force acts on the TOP edge of a bending horizontal beam, which internal force acts on the BOTTOM edge of that beam, and why should engineers add diagonal struts to form TRIANGLES (trusses)?\n(c) ECOSYSTEM ENERGY MATH: Outside the school, a courtyard ecosystem has 50,000 kilojoules (kJ) of solar energy captured by native plants (Producers). Using the 10% Ecological Energy Rule, calculate how much energy reaches (1) Primary Consumers (insects/rabbits), (2) Secondary Consumers (robins/toads), and (3) Tertiary Consumers (hawks), and explain why top predators are always fewer in number than plants.", "step1_deconstruct": {"instruction": "STOP & PLAN: Break down the 3 distinct science strands tested in (a) Heat, (b) Structures, and (c) Ecosystems.", "guidingQuestions": ["Part (a): What are the 3 methods of heat transfer (Conduction, Convection, Radiation) and how does a double-pane reflective window block each one?", "Part (b): When a horizontal beam bends downward in the middle under heavy snow, is the top surface squeezed (compression) or stretched (tension)? What about the bottom surface?", "Part (c): Multiply 50,000 kJ by 10% (÷ 10) at each step up the food chain!"], "modelPlan": "(a) Define Conduction, Convection, and Radiation and link each to trapped argon gas (poor conductor), narrow sealed pane (stops convection loops), and reflective film (reflects infrared radiation). (b) Top of bending beam = Compression, Bottom = Tension; triangular trusses distribute forces along rigid sides. (c) 50,000 kJ -> 5,000 kJ -> 500 kJ -> 50 kJ."}, "step2_anchor": {"instruction": "ANCHOR RULES: Heat Transfer + Bending Beam Forces + 10% Energy Rule.", "referenceItems": ["Bending Beam Rule: Load pushing down from above squeezes the TOP surface (Compression) and stretches the BOTTOM surface (Tension).", "Triangle Rigidity Rule: A square frame collapses into a parallelogram under sideways shear force, whereas a triangle cannot change shape without lengthening or shortening a side.", "10% Energy Rule: Divide energy by 10 at each trophic level up the pyramid."]}, "step3_substeps": [{"label": "Step 3a: Part (a) HEAT — Explain Conduction, Convection, and Radiation heat loss AND how the high-tech window blocks all 3", "placeholder": "1. Conduction: ...\n2. Convection: ...\n3. Radiation: ...", "hint": "Gases (like argon) have particles far apart, making them great insulators against conduction!", "modelSubAnswer": "1. Conduction: Fast-moving warm air particles inside the gym collide with the inner glass pane, transferring kinetic energy through the solid glass. Trapping argon gas between two glass panes slows conduction dramatically because gas particles are far apart and collide rarely.\n2. Convection: Warm air rises to the ceiling and circulates against cold surfaces. Sealing the narrow gap between the two panes prevents large convection currents from circulating.\n3. Radiation: Warm objects emit infrared electromagnetic waves. A low-emissivity (Low-E) reflective silver coating on the glass reflects infrared heat waves back inside the gym."}, {"label": "Step 3b: Part (b) STRUCTURES — Identify the forces on the TOP and BOTTOM of the snow-loaded roof beam, and explain why triangular trusses prevent collapse", "placeholder": "When the 20,000 kg snow load pushes down:\n• Top edge of beam experiences: ...\n• Bottom edge of beam experiences: ...\n• Triangular trusses help because: ...", "hint": "Top edge squeezes together (Compression); bottom edge stretches apart (Tension)!", "modelSubAnswer": "• Dead vs. Live Load: The roof's own weight is the Dead (Static) Load, while the 20,000 kg of snow is the Live (Dynamic) Load.\n• Internal Beam Forces: As the horizontal beam sags slightly downward under the snow, its TOP edge is squeezed together (Compression) and its BOTTOM edge is stretched apart (Tension).\n• Why Triangles Work: Adding diagonal struts creates a triangular truss. Unlike rectangles (which twist at the corners into parallelograms), a triangle is geometrically rigid—forces are distributed evenly as pure compression and tension along the straight struts."}, {"label": "Step 3c: Part (c) ECOSYSTEMS — Calculate the energy at all 3 consumer levels starting from 50,000 kJ in plants, and explain why hawks are rare", "placeholder": "Producers (Plants): 50,000 kJ\n1. Primary Consumers: ...\n2. Secondary Consumers: ...\n3. Tertiary Consumers (Hawks): ...\nExplanation: ...", "hint": "Divide by 10 three times: 50,000 -> 5,000 -> 500 -> 50 kJ!", "modelSubAnswer": "• Producers (Plants): 50,000 kJ\n1. Primary Consumers (Herbivores): 50,000 kJ × 10% = 5,000 kJ\n2. Secondary Consumers (Small Carnivores): 5,000 kJ × 10% = 500 kJ\n3. Tertiary Consumers (Hawks): 500 kJ × 10% = 50 kJ\n• Scientific Explanation: Because 90% of energy is lost as thermal energy (heat) and metabolic work at each trophic step, only 1/1,000th (50 kJ) of the original plant energy reaches the tertiary level, meaning an ecosystem can support millions of plants but only a few top predators."}], "step4_checks": ["Did I explain all 3 heat transfer mechanisms (Conduction, Convection, Radiation) using particle motion in Part (a)?", "Did I correctly state Compression on the TOP and Tension on the BOTTOM of the sagging roof beam in Part (b)?", "Did I double-check my zeros in Part (c): 50,000 kJ -> 5,000 kJ -> 500 kJ -> 50 kJ?"], "step5_modelAnswer": {"basicAnswer": "(a) Argon stops conduction/convection, mirror stops radiation. (b) Top is compression, bottom is tension; triangles are strong. (c) 5,000 kJ, 500 kJ, 50 kJ.", "expandedAnswer": "Complete Multi-Strand Science Solution (D. Forbes Level 4+ Standard):\n(a) Heat & Particle Theory: Conduction occurs via particle-to-particle collisions through solids (blocked by the wide-spaced particles of argon gas between panes). Convection occurs via rising warm / sinking cool fluid currents (blocked by the narrow, sealed space between panes). Radiation occurs via infrared waves (blocked by the reflective Low-E coating).\n(b) Structural Engineering: The 20,000 kg snow load is a Live Load that bends the horizontal beam downward, putting its upper surface under Compression (squeezed) and its lower surface under Tension (stretched). Diagonal struts form triangular trusses, which are geometrically rigid because a triangle's angles cannot deform without changing the length of its sides.\n(c) Ecosystem Energy Pyramid: Starting with 50,000 kJ in Producers, the 10% rule yields 5,000 kJ for Primary Consumers, 500 kJ for Secondary Consumers, and just 50 kJ for Tertiary Consumers (hawks). Because 90% of energy is dissipated as heat at every step, top predators require vast territories and remain scarce.", "extensionPrompt": "Bonus Connection: How does a hawk soaring high above the school yard use CONVECTION currents ('thermals') in the air to glide upward without flapping its wings?"}}], "studyFirstTag": "Next: Heat Transfer, Bridge Forces & Ecosystem 10% Rule", "lessons": [{"id": "sci-u2-l1", "title": "Lesson 2.1: Heat Transfer, Bridge Forces & The 10% Ecosystem Rule", "readTime": "3 min read", "bigIdea": "The same Particle Theory explains how heat escapes a building in an Ottawa winter, while triangles keep roofs strong and energy flows through ecosystems.", "paragraphs": ["Thermal energy always flows from warmer objects to cooler objects in 3 ways: CONDUCTION (direct particle collisions through solids, like a hot metal spoon), CONVECTION (circular currents in liquids/gases where warm, less-dense fluid rises and cool fluid sinks), and RADIATION (infrared electromagnetic waves that travel through empty space, like sunlight).", "In Structures & Mechanisms, every bridge or gym roof resists 4 internal forces: Compression (squeezing together), Tension (pulling apart), Shear (sliding/tearing sideways), and Torsion (twisting). When heavy snow pushes down on a horizontal roof beam, the beam bends downward—squeezing the TOP edge (Compression) and stretching the BOTTOM edge (Tension)! Engineers add diagonal braces to form TRIANGLES because a triangle cannot collapse into a slanted shape.", "In Ecosystems, plants (Producers) capture solar energy. As energy moves up the food chain (Producers → Primary Consumers → Secondary Consumers → Tertiary Consumers), about 90% is used for life or lost as heat at every step—leaving only 10% for the next level! That is why a forest has millions of plants, thousands of rabbits, and only a handful of hawks."], "keyTakeaway": "Heat: Conduction (solids), Convection (fluids), Radiation (waves) | Bending Beam: Top = Compression, Bottom = Tension | Food Chain: ÷ 10 each level!", "deepReadTitle": "🪟 How a Thermos or Double-Pane Window Stops All 3 Heat Transfers", "deepReadText": "A double-paned argon window stops Conduction (gas particles are far apart), stops Convection (sealed narrow gap stops air loops), and stops Radiation (shiny reflective Low-E coating bounces infrared waves back inside).", "quickCheck": {"question": "If plants capture 50,000 kJ of energy, how much energy reaches Secondary Consumers (2 levels up) using the 10% rule?", "options": ["5,000 kJ", "500 kJ", "50 kJ"], "correctIdx": 1, "explanation": "Producers (50,000 kJ) → Primary Consumers (÷10 = 5,000 kJ) → Secondary Consumers (÷10 = 500 kJ)!"}, "videos": [{"id": "2z1Z8iZ0Mxg", "title": "Heat Transfer: Conduction, Convection, and Radiation", "channel": "Sheryl McLaughlin", "why": "Clear explanation of all 3 thermal energy transfer pathways."}]}]}, {"id": "sci-u3", "title": "Unit 3 (Nelson Unit A): Concentration, Solubility Math & Municipal Water Purification", "studyFirstTag": "Calculate solution concentration (g/100 mL) and see how Ottawa cleans river water!", "curriculumStrand": "Ontario 2022 Science Strand C: Matter and Energy — Pure Substances & Mixtures", "svgDiagram": "science_particle_svg", "lessons": [{"id": "sci-u3-l1", "title": "Lesson 3.1: Dilute vs. Concentrated Solutions & Calculating Concentration (g / 100 mL)", "readTime": "3 min read", "bigIdea": "Concentration measures HOW MUCH solute is packed into a specific volume of solvent—letting scientists compare mixtures using exact math (`g / 100 mL`)!", "paragraphs": ["Imagine mixing powdered sports drink for gym class. Putting 1 small scoop into a full jug makes a pale, watery DILUTE solution (few solute particles per 100 mL of water). Putting 8 giant scoops into the same jug makes a dark, super-sweet CONCENTRATED solution (many solute particles packed per 100 mL!).", "To compare two solutions accurately in D. Forbes's lab—even when the beakers have different sizes!—scientists calculate CONCENTRATION in grams per 100 mL (`g / 100 mL`)! Example: Solution A has 15 g of sugar in 50 mL of water. Solution B has 24 g of sugar in 100 mL of water. Don't guess B just because 24 > 15! Scale Solution A up to 100 mL (× 2): `15 g / 50 mL = 30 g / 100 mL`! Solution A is MORE concentrated!", "SOLUBILITY is the maximum concentration (in `g / 100 mL`) that can dissolve at a specific temperature—for example, at 20°C, table salt has a solubility of `36 g / 100 mL`. Anything less is UNSATURATED; right at `36 g / 100 mL` is SATURATED!"], "keyTakeaway": "Always convert solutions to the SAME volume (`g / 100 mL`) before comparing concentration! Solubility = maximum `g / 100 mL` at a given temperature.", "deepReadTitle": "🧪 Concentration Formula (Math + Science Crossover!)", "deepReadText": "Concentration = (Mass of Solute in g ÷ Volume of Solvent in mL) × 100\nExample: 12 g of salt in 40 mL of water → (12 ÷ 40) × 100 = 0.3 × 100 = 30 g / 100 mL!", "videos": [{"id": "Vaj3GSUPGVE", "title": "Mixtures and Solutions Explained | Concentrated & Dilute", "channel": "The Animated Teacher", "why": "Shows particle-level differences between dilute and concentrated solutions."}, {"id": "OFylM2BOL80", "title": "Grade 7 Solutions & Solubility — Why Some Things Mix", "channel": "School Subjects Online", "why": "Directly aligned with Ontario Grade 7 unsaturated, saturated, and solubility concepts."}], "quickCheck": {"question": "Cup A has 10 g of drink mix in 50 mL of water. Cup B has 18 g of drink mix in 100 mL of water. Which cup is MORE concentrated?", "options": ["Cup A (20 g / 100 mL)", "Cup B (18 g / 100 mL)", "Both have the exact same concentration"], "correctIdx": 0, "explanation": "Scale Cup A to 100 mL: 10 g / 50 mL = 20 g / 100 mL, which is stronger than Cup B's 18 g / 100 mL!"}}, {"id": "sci-u3-l2", "title": "Lesson 3.2: How Ottawa Purifies Drinking Water (Industrial Mixture Separation)", "readTime": "3 min read", "bigIdea": "Every glass of tap water in Ottawa starts as murky Ottawa River water—cleaned through a 5-stage industrial mixture separation pipeline!", "paragraphs": ["Raw water pumped out of the Ottawa River (at the Britannia and Lemieux Island purification plants!) is a complex heterogeneous mixture containing twigs, silt, mud particles, dissolved minerals, and microscopic bacteria. How does it become crystal-clear drinking water?", "Step 1 (Intake Screening): Giant metal grates trap large floating branches, leaves, and fish. Step 2 (Coagulation & Flocculation): Engineers add safe alum chemicals that act like sticky magnets, causing invisible clay and dirt particles to clump together into heavy visible blobs called FLOC! Step 3 (Sedimentation / Settling): Water moves slowly through settling tanks so heavy floc sinks to the bottom by gravity.", "Step 4 (Multi-Layer Filtration): Water filters downward through layers of sand, gravel, and activated charcoal to trap tiny remaining particles and odours. Step 5 (Disinfection): Safe, tiny doses of chlorine (or UV light/ozone) kill harmful microscopic bacteria so water stays safe all the way through city pipes to your kitchen faucet!"], "keyTakeaway": "5-Step Municipal Water Purification: (1) Screening → (2) Coagulation/Flocculation → (3) Sedimentation → (4) Sand/Charcoal Filtration → (5) Disinfection!", "deepReadTitle": "🛢️ Industrial Separation Bonus: Cleaning Up an Ocean Oil Spill", "deepReadText": "• Booms (floating barriers) contain the floating oil (less dense than water).\n• Skimmers vacuum oil off the surface.\n• Sorbents (giant sponge pads) soak up remaining slicks, and bioremediation bacteria break down trace oil naturally!", "videos": [{"id": "c_l6fX_wVxg", "title": "Purification of Water — How Water Treatment Plants Work", "channel": "Make It Easy Education", "why": "Visualizes screening, sedimentation, filtration, and disinfection step-by-step."}], "quickCheck": {"question": "In a municipal water treatment plant, what is the purpose of adding alum during Coagulation & Flocculation?", "options": ["To boil the entire river into steam.", "To make tiny suspended dirt particles clump together into heavy 'floc' so they sink during sedimentation.", "To add flavour and minerals to the water."], "correctIdx": 1, "explanation": "Tiny clay particles are too small to sink on their own—coagulants clump them into heavy floc that settles out cleanly!"}}], "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Concentration Math & 5 Water Treatment Stages", "content": "Essential Strand C Unit A mastery terms:", "keyPoints": ["Dilute (low solute/solvent ratio) vs. Concentrated (high solute/solvent ratio)", "Concentration Formula: (mass of solute ÷ volume of solvent) × 100 = g / 100 mL", "Water Plant Pipeline: Screening → Flocculation → Sedimentation → Filtration → Disinfection"]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Why Filtration Alone Cannot Make River Water Safe to Drink", "content": "Sand and gravel filters trap visible dirt particles, NOT dissolved chemicals or microscopic bacteria!", "analogy": "🥅 Hockey Net Analogy: A hockey net stops basketballs and pucks (like a sand filter stops mud and sand), but tiny mosquitoes fly straight through the mesh! That's why Disinfection (UV/chlorine) is essential to kill microscopic bacteria!", "keyPoints": ["Filtration removes insoluble solids; Disinfection eliminates microorganisms."]}, {"level": 3, "name": "APPLY", "subtitle": "Compare Three Sports Drinks by Calculating Exact Concentration", "content": "Convert all three to `g / 100 mL`:", "workedExample": {"prompt": "Drink 1: 12 g in 50 mL | Drink 2: 45 g in 200 mL | Drink 3: 60 g in 250 mL.", "steps": ["Drink 1: (12 ÷ 50) × 100 = 24 g / 100 mL.", "Drink 2: (45 ÷ 200) × 100 = 22.5 g / 100 mL.", "Drink 3: (60 ÷ 250) × 100 = 24 g / 100 mL → Drinks 1 & 3 tie as the MOST concentrated!"]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Separation Methods by Physical Property", "content": "Match the industrial separation step to the physical property it exploits:", "comparisonTable": {"headers": ["Water / Spill Step", "Physical Property Used", "What It Removes"], "rows": [["Screening & Sand Filtration", "Particle Size", "Branches, leaves, sand, silt"], ["Sedimentation & Skimming", "Density (Sinking vs. Floating)", "Heavy mud floc (sinks) / floating oil (floats)"], ["Distillation", "Boiling Point", "Dissolved salts (e.g., ocean desalination)"], ["Magnetism (Recycling)", "Magnetic Attraction", "Iron/steel cans from aluminum/plastic"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Catch Concentration & Separation Mistakes", "content": "Precision audit for D. Forbes:", "keyPoints": ["❌ Saying 'Solution B is more concentrated because it has 24 g of salt while A only has 15 g' WITHOUT checking the water volumes!", "✅ Always divide solute mass by solvent volume first (`g / 100 mL`)!"]}, {"level": 6, "name": "CREATE", "subtitle": "Design a 4-Step Separation Plan for Polluted Stormwater", "content": "Combine skimming, screening/filtration, coagulation, and distillation/disinfection in optimal order.", "keyPoints": ["Order matters—removing floating oil and large grit BEFORE sand filtration prevents clogging!"]}], "questions": [{"id": "sci-u3-q1", "bloomLevel": 5, "bloomTag": "APPLY & EVALUATE", "title": "D. Forbes Chemistry Lab: Concentration Math (g/100 mL) & Ottawa Water Purification", "prompt": "Answer all 3 parts using precise scientific vocabulary and units:\n(a) CONCENTRATION MATH: In lab, Beaker X contains 18 g of salt dissolved in 60 mL of water. Beaker Y contains 50 g of salt dissolved in 200 mL of water. Calculate the concentration of BOTH beakers in `g / 100 mL`, and state which solution is MORE concentrated.\n(b) SOLUBILITY & SATURATION: If the solubility of salt at 20°C is `36 g / 100 mL`, are Beaker X and Beaker Y unsaturated or saturated? How many MORE grams of salt could still dissolve in 100 mL of Beaker Y before it becomes saturated?\n(c) MUNICIPAL WATER PURIFICATION: Explain the exact role of (1) Coagulation/Flocculation, (2) Sand/Charcoal Filtration, and (3) Disinfection in turning muddy Ottawa River water into safe drinking water, and explain why skipping Disinfection is dangerous even when the water looks 100% clear.", "step1_deconstruct": {"instruction": "Check all 3 parts: convert BOTH beakers to `g / 100 mL`, compare against `36 g / 100 mL`, and explain all 3 purification steps.", "guidingQuestions": ["In (a), what is (18 ÷ 60) × 100 vs. (50 ÷ 200) × 100?", "In (b), compare both answers against 36 g / 100 mL!", "In (c), what can slip right through a sand filter even when water looks clear?"], "modelPlan": "(a) X = 30 g/100 mL, Y = 25 g/100 mL → X is MORE concentrated! (b) Both < 36, so both unsaturated; 36 − 25 = 11 g more per 100 mL in Y. (c) Floc clumps mud to sink; Filtration traps fine particles/odour; Disinfection kills invisible bacteria/microorganisms."}, "step2_anchor": {"instruction": "Unit A Formulas & Stages:", "referenceItems": ["Concentration = (Solute g ÷ Solvent mL) × 100 = g / 100 mL", "Unsaturated (< solubility limit) vs. Saturated (= solubility limit)", "Flocculation (clumps dirt) → Filtration (traps solids) → Disinfection (kills invisible pathogens)"]}, "step3_substeps": [{"label": "Step 3a: Part (a) — Calculate Concentration (`g / 100 mL`) for Beaker X (18 g / 60 mL) and Beaker Y (50 g / 200 mL)", "placeholder": "Beaker X = (18 ÷ 60) × 100 = ... g/100 mL\nBeaker Y = (50 ÷ 200) × 100 = ... g/100 mL\nMore concentrated: ...", "hint": "18 ÷ 60 = 0.30 → × 100 = 30 g/100 mL. 50 ÷ 200 = 0.25 → × 100 = 25 g/100 mL!", "modelSubAnswer": "• Beaker X: (18 g ÷ 60 mL) × 100 = 0.30 × 100 = 30 g / 100 mL.\n• Beaker Y: (50 g ÷ 200 mL) × 100 = 0.25 × 100 = 25 g / 100 mL.\n• Conclusion: Beaker X is MORE concentrated (30 > 25 g/100 mL), even though Beaker Y held a larger total mass of salt!"}, {"label": "Step 3b: Part (b) — Classify both beakers against solubility 36 g/100 mL, and find how many more grams fit in 100 mL of Beaker Y", "placeholder": "Both beakers are ... because...\nExtra salt that can dissolve in 100 mL of Y = 36 − ... = ... g", "hint": "30 < 36 and 25 < 36! Subtract 25 from 36!", "modelSubAnswer": "Since both Beaker X (30 g/100 mL) and Beaker Y (25 g/100 mL) are below the maximum solubility of 36 g/100 mL at 20°C, BOTH solutions are UNSATURATED. In 100 mL of Beaker Y, `36 g − 25 g = 11 g` more salt can still dissolve before reaching saturation (or 22 g in the full 200 mL beaker!)."}, {"label": "Step 3c: Part (c) — Explain Coagulation/Flocculation, Filtration, and Disinfection in Ottawa's water treatment", "placeholder": "1. Coagulation/Flocculation: ...\n2. Filtration: ...\n3. Disinfection (and why clear water still needs it): ...", "hint": "Explain that microscopic bacteria/viruses are smaller than filter pores and invisible to the eye!", "modelSubAnswer": "1. Coagulation/Flocculation: Adding safe alum causes tiny suspended clay/dirt particles to clump into heavy blobs ('floc') so they sink during sedimentation.\n2. Sand & Charcoal Filtration: Water passes through porous sand, gravel, and activated carbon layers that trap remaining tiny insoluble solids and absorb odours.\n3. Disinfection: Safe doses of chlorine or UV light destroy microscopic bacteria and pathogens. Skipping disinfection is dangerous because harmful microorganisms are microscopic—they pass right through sand filters even when water looks 100% clear!"}], "step4_checks": ["Did I convert BOTH beakers to `g / 100 mL` (30 vs. 25) instead of just comparing 18 g vs. 50 g?", "Did I state UNSATURATED and calculate `36 − 25 = 11 g` per 100 mL in Part (b)?", "Did I explain all 3 water treatment stages AND why clear filtered water still needs disinfection?"], "step5_modelAnswer": {"basicAnswer": "(a) X is 30 g/100 mL, Y is 25 g/100 mL (X stronger). (b) Unsaturated, 11 g more. (c) Floc clumps mud, filter catches dirt, chlorine kills invisible germs.", "expandedAnswer": "Complete Grade 7+ Chemistry Solution:\n(a) Concentration Comparison: Beaker X = (18 ÷ 60) × 100 = 30 g/100 mL; Beaker Y = (50 ÷ 200) × 100 = 25 g/100 mL. Therefore, Beaker X is more concentrated.\n(b) Solubility Analysis: Both 30 and 25 g/100 mL are below the 36 g/100 mL saturation limit at 20°C, so both solutions are unsaturated. Another 11 g of salt can dissolve per 100 mL of Beaker Y (22 g across its full 200 mL volume).\n(c) Municipal Water Purification: Coagulation/Flocculation binds suspended silt into heavy floc that settles out; Multi-Layer Sand/Charcoal Filtration traps remaining fine solids and odours; Disinfection (chlorine/UV) eliminates invisible, microscopic bacteria and pathogens that are too small to be caught by physical filters.", "extensionPrompt": "Environmental Connection: Why does heavy winter road salt spread on Ottawa highways eventually raise salt concentration in local creeks during spring snowmelt?"}}]}, {"id": "sci-u4", "title": "Unit 4 (Nelson Unit B): Photosynthesis & Respiration, Symbiosis & Invasive Species", "studyFirstTag": "Connect plants & oxygen cycles, decode symbiosis (+/+, +/0, +/-) & stop Ontario invasive species!", "curriculumStrand": "Ontario 2022 Science Strand B: Life Systems — Interactions in the Environment", "svgDiagram": "sci_eco_struct_svg", "lessons": [{"id": "sci-u4-l1", "title": "Lesson 4.1: Photosynthesis, Cellular Respiration & The Carbon Cycle", "readTime": "3 min read", "bigIdea": "Photosynthesis and Cellular Respiration are exact mirror-opposite chemical processes that keep oxygen, carbon dioxide, and food energy cycling across Earth!", "paragraphs": ["Every food chain starts with Producers (green plants and algae) running PHOTOSYNTHESIS inside microscopic solar panels called chloroplasts: `Sunlight + Carbon Dioxide (CO₂) + Water → Glucose (Sugar) + Oxygen (O₂)`. Plants trap light energy inside glucose sugar and release the fresh oxygen we breathe!", "Next, how do animals—AND plants themselves at night!—unlock that stored food energy to run in the gym or grow new leaves? Through CELLULAR RESPIRATION inside cell powerhouses called mitochondria: `Glucose (Sugar) + Oxygen (O₂) → Usable Energy + Carbon Dioxide (CO₂) + Water`! Notice it is the EXACT reverse of photosynthesis!", "Watch out for the #1 Grade 7 Biology misconception: students often think animals do respiration while plants ONLY do photosynthesis. False! PLANTS DO BOTH—they make sugar by photosynthesis in sunlight, and break sugar down by cellular respiration 24/7 to stay alive! Meanwhile, Decomposers (fungi, bacteria) break down dead organisms, returning carbon and nutrients back into soil and air."], "keyTakeaway": "Photosynthesis (Sunlight + CO₂ + H₂O → Sugar + O₂) and Cellular Respiration (Sugar + O₂ → Energy + CO₂ + H₂O) are mirror opposites—and PLANTS DO BOTH!", "deepReadTitle": "♻️ How Humans Disrupt the Carbon Cycle", "deepReadText": "Burning fossil fuels (coal, oil, gas) releases millions of years of trapped CO₂ into the atmosphere, while cutting down forests removes the trees that absorb CO₂ via photosynthesis—trapping extra heat on Earth!", "videos": [{"id": "rWO00D1ln3k", "title": "Photosynthesis vs. Cellular Respiration (Middle School Science)", "channel": "EduMagnet", "why": "Clearly contrasts both equations and busts the myth that plants don't do cellular respiration."}, {"id": "_1U6uMmUJZU", "title": "Photosynthesis in Ecosystems | Middle School Biology", "channel": "Khan Academy", "why": "Connects solar energy, producers, and ecosystem matter cycling."}], "quickCheck": {"question": "Which statement accurately compares Photosynthesis and Cellular Respiration?", "options": ["Only animals perform Cellular Respiration; plants only perform Photosynthesis.", "Photosynthesis uses Sunlight + CO₂ + Water to make Sugar + Oxygen; Cellular Respiration reverses it to release usable energy, and BOTH plants and animals perform Cellular Respiration!", "Both processes absorb Oxygen and release Sunlight."], "correctIdx": 1, "explanation": "Exact scientific precision! Plants use photosynthesis to make glucose and cellular respiration to use that glucose for energy!"}}, {"id": "sci-u4-l2", "title": "Lesson 4.2: Symbiosis (+/+, +/0, +/-), Succession & Ontario Invasive Species", "readTime": "3 min read", "bigIdea": "Every species in an ecosystem has a job (niche) and interacts through Symbiosis—until an Invasive Species with zero natural predators throws the whole web out of balance!", "paragraphs": ["When two different species live in close, long-term interaction, ecologists classify their SYMBIOSIS into 3 exact types: (1) MUTUALISM (+ / +): BOTH win! (e.g., bees get sweet nectar while pollinating wildflowers). (2) COMMENSALISM (+ / 0): ONE benefits while the other is neither helped nor harmed (e.g., a bird nesting safely in an oak tree). (3) PARASITISM (+ / −): ONE parasite benefits while harming its living host (e.g., a tick feeding on a deer in Ontario woods).", "Ecosystems also recover after disturbances through ECOLOGICAL SUCCESSION: Primary Succession starts on bare lifeless rock (after a glacier or volcano—lichens arrive first as pioneer species to make soil!), while Secondary Succession happens much faster after a forest fire or storm because rich soil is ALREADY there!", "What happens when humans accidentally transport a non-native species to Ontario where it has NO natural predators? It becomes an INVASIVE SPECIES! Right here in Ottawa and the Great Lakes, two famous invaders wreak havoc: the Emerald Ash Borer beetle (killed millions of Ottawa ash trees!) and Zebra Mussels (clog water intake pipes and starve native fish of plankton!)."], "keyTakeaway": "Mutualism (+/+) | Commensalism (+/0) | Parasitism (+/−) | Invasive Species succeed because they reproduce fast and have ZERO natural predators in their new habitat!", "deepReadTitle": "🪲 Real Ottawa Case Study: Emerald Ash Borer & Zebra Mussels", "deepReadText": "• Emerald Ash Borer: Arrived in wooden shipping crates; larvae tunnel under ash bark, cutting off water transport.\n• Prevention Rule: NEVER transport firewood between parks or cottages, and ALWAYS clean/drain/dry boats between Ontario lakes!", "videos": [{"id": "rNjPI84sApQ", "title": "Ecological Relationships (Mutualism, Commensalism, Parasitism)", "channel": "Amoeba Sisters", "why": "Memorable animated breakdown of all 3 symbiosis types plus predation and competition."}, {"id": "pilyYSaIP5o", "title": "All About Invasive Species (Ontario Science Lesson)", "channel": "The Digital Classroom Experience", "why": "Directly aligned with Ontario Grade 7 Strand B invasive species impacts and biodiversity."}], "quickCheck": {"question": "A tick attaches to a white-tailed deer in Ottawa's Greenbelt and drinks its blood, weakening the deer. Which symbiotic relationship is this?", "options": ["Mutualism (+ / +)", "Commensalism (+ / 0)", "Parasitism (+ / −)"], "correctIdx": 2, "explanation": "The tick benefits (+) while the living deer host is harmed (−) → Parasitism!"}}], "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Photosynthesis/Respiration Equations & Symbiosis Symbols", "content": "Core Strand B definitions:", "keyPoints": ["Photosynthesis: Sunlight + CO₂ + H₂O → Glucose + O₂ | Respiration: Glucose + O₂ → Energy + CO₂ + H₂O", "Symbiosis: Mutualism (+/+), Commensalism (+/0), Parasitism (+/−)", "Succession: Primary (bare rock, slow) vs. Secondary (existing soil after fire, fast)"]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Why Secondary Succession Is Way Faster Than Primary Succession", "content": "Think of rebuilding a house when the foundation is still intact vs. starting from solid bedrock!", "analogy": "🏗️ Construction Analogy: Primary succession (after a volcano/glacier) has to wait centuries for lichens to slowly weather bare rock into soil. Secondary succession (after a forest fire) already has nutrient-rich ash soil and buried seeds ready to sprout the very next spring!", "keyPoints": ["Existing soil = huge head start for Secondary Succession."]}, {"level": 3, "name": "APPLY", "subtitle": "Classify 3 Ecosystem Interactions & Predict Invasive Impact", "content": "Apply Strand B rules to Ontario wildlife:", "workedExample": {"prompt": "Classify: (1) Clownfish & sea anemone; (2) Barnacles riding a whale; (3) Emerald Ash Borer in Ottawa.", "steps": ["1. Clownfish + Anemone → Mutualism (+/+): clownfish gets protection, anemone gets cleaned/fed.", "2. Barnacles on Whale → Commensalism (+/0): barnacles get a free ride to food; whale is unaffected.", "3. Emerald Ash Borer → Invasive species lacking native predators, destroying urban ash tree canopy."]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Primary vs. Secondary Ecological Succession", "content": "Side-by-side Strand B study chart:", "comparisonTable": {"headers": ["Feature", "Primary Succession", "Secondary Succession"], "rows": [["Starting Surface", "Bare rock with ZERO soil (glacier retreat, lava flow)", "Existing soil intact (after wildfire, flood, abandoned farm)"], ["Pioneer Species", "Lichens and mosses that break rock into soil", "Fast-growing grasses and weeds"], ["Time to Climax Forest", "Hundreds to thousands of years", "Decades to ~150 years"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Bust the #1 Ecosystem Misconception", "content": "Check your precision:", "keyPoints": ["❌ 'Introducing a new foreign predator to eat Zebra Mussels will always fix the lake safely.'", "✅ Reality: Introducing another non-native species often creates a SECOND invasive disaster! Prevention (clean/drain/dry boats, local firewood) is far safer."]}, {"level": 6, "name": "CREATE", "subtitle": "Design an Ottawa Greenbelt Biodiversity Protection Plan", "content": "Synthesize native planting, carbon cycling, and invasive species prevention.", "keyPoints": ["Protects local Ontario ecosystems!"]}], "questions": [{"id": "sci-u4-q1", "bloomLevel": 5, "bloomTag": "ANALYZE & EVALUATE", "title": "Nelson Unit B Lab: Photosynthesis/Respiration Cycle, Symbiosis & Great Lakes Invaders", "prompt": "Answer all 3 parts with Grade 7+ scientific precision:\n(a) PHOTOSYNTHESIS & RESPIRATION: Write the word equations for BOTH Photosynthesis and Cellular Respiration, explain how they depend on each other to cycle oxygen and carbon dioxide, and correct a classmate who claims 'plants do not perform cellular respiration.'\n(b) SYMBIOSIS: Identify each interaction as Mutualism (+/+), Commensalism (+/0), or Parasitism (+/−) and explain why: (1) Honeybee pollinating an apple blossom; (2) Moss growing harmlessly on a maple tree's bark; (3) Lamprey fish latching onto and draining blood from a Great Lakes trout.\n(c) INVASIVE SPECIES: Explain TWO reasons why invasive Zebra Mussels spread explosively across the Great Lakes and St. Lawrence River, describe ONE ecological impact on native food webs, and give ONE practical action boaters can take to stop their spread.", "step1_deconstruct": {"instruction": "Check all 3 parts: both equations + plant respiration correction in (a), all 3 symbiosis examples in (b), and 2 reasons + 1 impact + 1 prevention step in (c).", "guidingQuestions": ["What are the exact inputs and outputs of Photosynthesis vs. Respiration?", "Which symbiosis sign (+/+, +/0, +/-) fits each of the 3 examples?", "Why do invasive species outcompete native species (fast reproduction + zero natural predators)?"], "modelPlan": "(a) Mirror word equations + plants run respiration 24/7 to unlock energy from glucose. (b) 1=Mutualism (+/+), 2=Commensalism (+/0), 3=Parasitism (+/−). (c) No native predators + rapid reproduction; filter out plankton starving native fish; Clean-Drain-Dry boats."}, "step2_anchor": {"instruction": "Unit B Scientific Vocabulary:", "referenceItems": ["Photosynthesis: Sunlight + CO₂ + Water → Glucose + Oxygen", "Cellular Respiration: Glucose + Oxygen → Energy + CO₂ + Water", "Invasive Traits: Non-native + Rapid reproduction + Zero natural predators"]}, "step3_substeps": [{"label": "Step 3a: Part (a) — Write BOTH equations, explain the O₂/CO₂ cycle, and correct the 'plants don't do respiration' myth", "placeholder": "Photosynthesis: ...\nCellular Respiration: ...\nCorrection: Plants DO perform cellular respiration because...", "hint": "Show that the outputs of one are the exact inputs of the other!", "modelSubAnswer": "• Photosynthesis: Sunlight + Carbon Dioxide + Water → Glucose (Sugar) + Oxygen.\n• Cellular Respiration: Glucose + Oxygen → Usable Energy + Carbon Dioxide + Water.\n• Cycle & Correction: The outputs of photosynthesis (glucose & O₂) fuel cellular respiration, whose outputs (CO₂ & H₂O) feed photosynthesis again. My classmate is mistaken because plants are living organisms that MUST perform cellular respiration 24/7 inside their cells to convert the glucose they made into usable energy for growth!"}, {"label": "Step 3b: Part (b) — Classify all 3 relationships (+/+, +/0, +/−) and state why", "placeholder": "1. Bee & Apple Blossom: ...\n2. Moss on Maple Bark: ...\n3. Lamprey & Trout: ...", "hint": "Check who benefits (+), who is unaffected (0), and who is harmed (−)!", "modelSubAnswer": "1. Honeybee & Apple Blossom → Mutualism (+ / +): The bee gets food (nectar/pollen) while the apple tree gets pollinated to reproduce.\n2. Moss on Maple Bark → Commensalism (+ / 0): The moss gets an elevated sunny spot to grow, while the large maple tree is neither helped nor harmed.\n3. Lamprey & Lake Trout → Parasitism (+ / −): The sea lamprey gets blood/nutrients (+) while injuring or killing the host trout (−)."}, {"label": "Step 3c: Part (c) — Give 2 reasons Zebra Mussels spread so fast, 1 food-web impact, and 1 boater prevention action", "placeholder": "2 Reasons: ...\nFood Web Impact: ...\nPrevention Action: ...", "hint": "Zebra mussels filter massive amounts of microscopic plankton out of the water, starving baby native fish!", "modelSubAnswer": "• 2 Reasons for Explosive Spread: (1) They have virtually NO natural predators in the Great Lakes, and (2) they reproduce rapidly (one female lays up to 1 million eggs/year) and hitchhike on boats.\n• Ecological Impact: By aggressively filtering microscopic plankton out of the water, they collapse the base of the aquatic food web, starving native fish species (and clogging municipal water intake pipes!).\n• Prevention: Boaters must always Clean, Drain, and Dry boats, trailers, and gear before moving between lakes."}], "step4_checks": ["Did I write BOTH complete word equations AND explain why plants do Cellular Respiration?", "Did I justify all 3 symbiosis types (+/+, +/0, +/−) accurately?", "Did I include 2 spread reasons, 1 food-web impact, and 1 prevention step for Zebra Mussels?"], "step5_modelAnswer": {"basicAnswer": "(a) Plants make sugar+O2 and also use respiration for energy. (b) Mutualism, commensalism, parasitism. (c) No predators, fast breeding; eat plankton; wash boats.", "expandedAnswer": "Complete Nelson Unit B Exemplar:\n(a) Photosynthesis & Cellular Respiration: Photosynthesis (`Sunlight + CO₂ + Water → Glucose + Oxygen`) stores solar energy in glucose, while Cellular Respiration (`Glucose + Oxygen → Usable Energy + CO₂ + Water`) reverses it, cycling O₂ and CO₂ continuously. Plants perform BOTH processes—photosynthesis makes glucose in light, and cellular respiration breaks down that glucose 24/7 to power plant growth.\n(b) Symbiosis Classification: (1) Bee & apple blossom = Mutualism (+/+, food + pollination); (2) Moss on maple bark = Commensalism (+/0, habitat with zero tree harm); (3) Sea lamprey on trout = Parasitism (+/−, parasite feeds while harming host).\n(c) Invasive Zebra Mussels: They spread rapidly due to (1) absence of native predators and (2) massive reproductive rates. Ecologically, they filter out microscopic plankton at the base of the food web, starving native fish populations. Boaters prevent spread by strictly following Clean, Drain, and Dry protocols between waterways.", "extensionPrompt": "Succession Bonus: If a lightning fire burns a Boreal forest in Northern Ontario, would recovery be Primary or Secondary Succession—and why?"}}]}, {"id": "sci-u5", "title": "Unit 5 (Nelson Unit C): Centre of Gravity, Stability, Ergonomics & Structural Failure", "studyFirstTag": "Learn why towers tip or stay standing, how ergonomics helps humans & how engineers prevent failure!", "curriculumStrand": "Ontario 2022 Science Strand D: Structures and Mechanisms — Form, Function & Design", "svgDiagram": "sci_eco_struct_svg", "lessons": [{"id": "sci-u5-l1", "title": "Lesson 5.1: Centre of Gravity, Structural Stability & Ergonomics", "readTime": "3 min read", "bigIdea": "A structure stays upright ONLY as long as its Centre of Gravity falls straight down inside its Base of Support—whether it's the CN Tower or Zaid defending in basketball!", "paragraphs": ["Every object has an invisible balance point where gravity pulls evenly on its mass—its CENTRE OF GRAVITY (CG)! Look at the Visual Diagram: to make ANY structure ultra-stable, engineers follow two golden rules: (1) Keep the Centre of Gravity LOW (heavy weight near the bottom, like a pyramid or Formula 1 race car), and (2) Build a WIDE Base of Support!", "Why does the Leaning Tower of Pisa stay standing without falling over, while a tall thin stack of Jenga blocks crashes? The Toppling Rule! Drop an imaginary vertical line straight down from the Centre of Gravity: as long as that line lands INSIDE the Base of Support, the structure stands. The instant it swings OUTSIDE the base, gravity pulls it over!", "Engineers also design structures for real human bodies using ERGONOMICS—matching form to human comfort, posture, and safety (like supportive trombone chairs, contoured bike helmets, and padded backpacks with wide shoulder straps). And to guarantee structures never snap during blizzards or earthquakes, engineers multiply expected loads by a MARGIN OF SAFETY (e.g., building an elevator cable strong enough to hold 8× its maximum rider weight!)."], "keyTakeaway": "Maximum Stability = LOW Centre of Gravity + WIDE Base of Support (CG line stays inside Base!) | Ergonomics = Designing safely for human bodies!", "deepReadTitle": "⚠️ 4 Ways Structures Fail (Structural Failure Audit)", "deepReadText": "• Bad Design (forgetting triangles or wind loads).\n• Faulty Construction / Poor Materials (weak welds, rusted bolts).\n• Extraordinary Loads (once-in-a-century Ottawa ice storm or earthquake).\n• Metal Fatigue (repeated bending back and forth—like bending a paperclip until it snaps!).", "videos": [{"id": "hYL7Dmfz5JU", "title": "The Centre of Gravity of a Structure (Ontario Grade 7 Science)", "channel": "The Digital Classroom Experience", "why": "Directly aligned with Ontario Grade 7 Strand D stability, CG, and base of support."}], "quickCheck": {"question": "Why does a low, wide pyramid or race car resist tipping far better than a tall, top-heavy double-decker bus?", "options": ["Because it has a high centre of gravity and a narrow base.", "Because its low centre of gravity and wide base of support make it much harder for the CG line to tip outside its base.", "Because gravity pulls less on wide objects."], "correctIdx": 1, "explanation": "Lowering the Centre of Gravity and widening the Base of Support maximizes stability under the Toppling Rule!"}}], "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Stability, Loads, Ergonomics & Safety Factor", "content": "Strand D core definitions:", "keyPoints": ["Centre of Gravity (CG): Balance point where mass is concentrated", "Toppling Rule: Stands if CG vertical line lands INSIDE Base of Support", "Static (Dead) Load = structure's own weight | Dynamic (Live) Load = wind, snow, cars, people", "Ergonomics = human-friendly safe design | Margin of Safety = extra built-in strength"]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Connecting Science Stability Directly to Gym Sports & Backpack Health", "content": "You use Centre of Gravity physics every day without realizing it!", "analogy": "🏀 Gym Basketball & Backpack Analogy: Bending your knees and widening your feet on defence lowers your CG and widens your base so nobody can push you off balance! Similarly, wearing an ergonomic backpack tightly with BOTH padded straps keeps the pack's CG close to your spine instead of pulling your back sideways!", "keyPoints": ["Science Strand D + PE Biomechanics share the exact same physics!"]}, {"level": 3, "name": "APPLY", "subtitle": "Diagnose Why a Bookshelf Tipped & Fix It Three Ways", "content": "Apply CG and Base of Support engineering:", "workedExample": {"prompt": "A tall, narrow bookshelf full of heavy encyclopedias on the TOP shelf tips forward easily. Fix it!", "steps": ["Fix 1 (Lower CG): Move the heaviest encyclopedias down to the BOTTOM shelf.", "Fix 2 (Widen Base): Add wider stabilizing feet or angle braces at the bottom.", "Fix 3 (Anchor Against External Force): Bolt a metal L-bracket from the top into a wall stud."]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Structural Failure Modes & Prevention", "content": "How engineers prevent disasters:", "comparisonTable": {"headers": ["Failure Type", "What Happens", "Engineering Prevention"], "rows": [["Buckling", "Thin vertical column bends sideways under heavy compression", "Use I-beams, hollow cylinders, or corrugated/triangular bracing"], ["Shear Failure", "Bolts or joints slice sideways under opposite forces", "Add gusset plates and reinforced cross-bracing"], ["Metal Fatigue", "Repeated vibration/bending creates microscopic cracks", "Regular bridge inspections & high Margin of Safety"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Audit a Student's Bridge Design", "content": "Spot the design flaw before testing:", "keyPoints": ["❌ Using rectangles instead of triangles and placing heavy weight at the very top of tall thin towers!", "✅ Fix: Brace every rectangle with diagonal trusses (triangles!) and anchor heavy mass low with wide piers!"]}, {"level": 6, "name": "CREATE", "subtitle": "Design an Ergonomic, Ultra-Stable Trombone & Sheet Music Stand", "content": "Combine wide tripod base, low weighted centre of gravity, and ergonomic height/angle adjustments.", "keyPoints": ["Directly connects Music class with Grade 7 Engineering!"]}], "questions": [{"id": "sci-u5-q1", "bloomLevel": 6, "bloomTag": "ANALYZE & CREATE", "title": "Nelson Unit C Engineering Lab: Centre of Gravity, Loads & Ergonomic Design", "prompt": "Apply Grade 7 Structures & Mechanisms concepts to solve all 3 parts:\n(a) STABILITY & TOPPLING RULE: A school music stand keeps tipping over whenever Zaid places a heavy binder of trombone music on the top tray. Using the exact terms Centre of Gravity (CG) and Base of Support, explain WHY it tips and propose 2 structural redesigns that would make it rock-solid.\n(b) LOADS & FORCES: Distinguish between Static (Dead) Load and Dynamic (Live) Load on an Ottawa pedestrian bridge in January, giving 1 clear example of each, and explain why engineers build bridges with a high Margin of Safety.\n(c) ERGONOMICS: Explain what Ergonomics means and identify 2 specific ergonomic features of a well-designed Grade 7 student backpack or bike helmet.", "step1_deconstruct": {"instruction": "Verify all 3 parts: CG/Base of Support in (a), Dead vs. Live Load + Margin of Safety in (b), and Ergonomics + 2 features in (c).", "guidingQuestions": ["What happens to the music stand's Centre of Gravity when a heavy binder sits high up?", "Which loads on a bridge NEVER move (Dead/Static) vs. change constantly (Live/Dynamic)?", "How do wide straps or impact foam protect the human body?"], "modelPlan": "(a) High binder raises CG so slight nudge pushes CG line outside narrow base; Fix: weighted heavy base (lowers CG) + wider tripod legs (widens base). (b) Dead = steel/concrete bridge itself; Live = snow, wind, pedestrians; Safety margin prevents collapse during extreme ice storms. (c) Ergonomics adapts form to human bodies; wide padded dual straps + chest clip / helmet foam liner."}, "step2_anchor": {"instruction": "Strand D Engineering Terms:", "referenceItems": ["Toppling Rule: Tips if vertical line from CG falls OUTSIDE Base of Support", "Static (Dead) Load = structure's own weight | Dynamic (Live) Load = wind, snow, people", "Ergonomics = designing for human safety, comfort, and posture"]}, "step3_substeps": [{"label": "Step 3a: Part (a) — Explain why the top-heavy music stand tips (using CG & Base of Support) + 2 engineering fixes", "placeholder": "Why it tips: Placing the heavy binder high up raises the...\nFix 1 (Lower CG): ...\nFix 2 (Widen Base): ...", "hint": "Mention the CG vertical line tipping outside the narrow base, then lower CG (weighted base) and widen the tripod legs!", "modelSubAnswer": "• Why It Tips: Putting a heavy music binder on the high tray raises the stand's Centre of Gravity (CG). Even a tiny bump shifts the vertical line from the high CG outside the stand's narrow Base of Support, causing gravity to topple it.\n• Fix 1 (Lower CG): Build a heavy cast-iron or weighted disk at the very bottom to pull the CG low to the floor.\n• Fix 2 (Widen Base): Spread the three tripod legs wider apart to enlarge the Base of Support."}, {"label": "Step 3b: Part (b) — Contrast Static (Dead) Load vs. Dynamic (Live) Load on a winter Ottawa bridge + explain Margin of Safety", "placeholder": "Static (Dead) Load: ...\nDynamic (Live) Load: ...\nMargin of Safety: ...", "hint": "Dead = bridge's own steel & concrete; Live = heavy snow, wind gusts, walking people!", "modelSubAnswer": "• Static (Dead) Load: The permanent weight of the structure itself (the steel trusses, concrete deck, and railings).\n• Dynamic (Live) Load: Changing external forces acting on the bridge (heavy winter snowdrifts, freezing rain/ice, strong wind gusts, and pedestrians).\n• Margin of Safety: Engineers design structures to withstand several times the normal expected load so an extreme Ottawa ice storm or metal fatigue never causes catastrophic failure."}, {"label": "Step 3c: Part (c) — Define Ergonomics and describe 2 ergonomic features of a backpack or bike helmet", "placeholder": "Ergonomics means...\nFeature 1: ...\nFeature 2: ...", "hint": "Wide padded straps distribute pressure evenly across shoulders; helmet EPS foam + curved shell absorb impact force!", "modelSubAnswer": "Ergonomics is the science of designing tools and structures to fit the human body safely, comfortably, and efficiently.\n• Ergonomic Backpack Feature 1: Two wide, padded shoulder straps distribute the weight evenly across both shoulders instead of straining one side of the spine.\n• Ergonomic Backpack Feature 2: A chest/waist strap holds heavy books snug against the user's lower back, keeping the backpack's Centre of Gravity aligned with the student's body."}], "step4_checks": ["Did I use BOTH 'Centre of Gravity' and 'Base of Support' in Part (a)?", "Did I give accurate examples of Static (Dead) vs. Dynamic (Live) Loads AND explain Margin of Safety in Part (b)?", "Did I define Ergonomics and connect 2 specific features to human safety/comfort in Part (c)?"], "step5_modelAnswer": {"basicAnswer": "(a) Heavy binder makes CG too high; add heavy bottom and wider legs. (b) Dead = bridge weight, Live = snow/wind/people; safety margin adds extra strength. (c) Fitting human body; two padded straps and waist strap.", "expandedAnswer": "Complete Nelson Unit C Exemplar:\n(a) Stability & Redesign: Placing a heavy binder on the high tray elevates the stand's Centre of Gravity (CG) so a slight nudge shifts the CG's vertical line outside its narrow Base of Support, making it tip. Redesigning with (1) a heavy weighted base lowers the CG close to the floor, and (2) wider-splayed tripod legs expands the Base of Support.\n(b) Loads & Margin of Safety: Static (Dead) Load is the permanent mass of the bridge's own steel beams and concrete deck, while Dynamic (Live) Load includes changing forces such as pedestrians, wind gusts, and winter snow accumulation. A high Margin of Safety builds in extra strength so extreme weather or material fatigue never triggers structural collapse.\n(c) Ergonomics: Ergonomics matches structural design to human anatomy and safety—such as wide padded dual backpack straps (spreading load evenly across shoulders) and a supportive waist/chest belt (keeping the pack's CG close to the spine).", "extensionPrompt": "Structural Bonus: Why is a bike helmet built as a curved SHELL structure with foam inside instead of a flat solid metal block?"}}]}, {"id": "sci-u6", "title": "Unit 6 (Nelson Unit D & Strand A): Thermal Expansion, Heating Curve & Fair-Test Variables", "studyFirstTag": "See why thermometers work, why boiling water stays at 100°C, and nail IV/DV/CV lab variables!", "curriculumStrand": "Ontario 2022 Science Strands E (Heat in the Environment) & A (STEM Investigation Skills)", "svgDiagram": "sci_heating_curve_svg", "lessons": [{"id": "sci-u6-l1", "title": "Lesson 6.1: Thermal Expansion/Contraction & The Heating Curve of Water", "readTime": "3 min read", "bigIdea": "Heating makes particles vibrate faster and push apart (Thermal Expansion), and during Melting (0°C) or Boiling (100°C), temperature PAUSES completely flat while heat breaks particle bonds!", "paragraphs": ["According to the Particle Theory, heating a solid, liquid, or gas makes its particles move faster and spread slightly farther apart—causing the whole object to grow slightly larger (THERMAL EXPANSION)! Cooling reverses this (THERMAL CONTRACTION). Liquids expand more than solids (that's how liquid rises up a glass thermometer!), and gases expand dramatically (why a basketball left outside in Ottawa's −20°C snow feels flat until you bring it back into the warm gym!).", "Now look at the Heating Curve of Water Visual Diagram—one of the coolest surprises in Grade 7 Science! As you heat −10°C ice, its temperature rises steadily up to 0°C. Then something wild happens: even though the stove is STILL blasting heat into the beaker, the thermometer FREEZES flat at 0°C until EVERY SINGLE ice crystal melts into liquid water!", "Why did the temperature pause at 0°C (Melting) and again at 100°C (Boiling)? Because during a Change of State, 100% of the added thermal energy is spent BREAKING THE ATTRACTIVE FORCES between water particles (Latent Heat) rather than speeding them up! Once all particles break free into liquid (or steam), temperature starts climbing again."], "keyTakeaway": "Thermal Expansion = Heating pushes particles apart (Gases expand most > Liquids > Solids) | Heating Curve Plateaus: Temp stays FLAT at 0°C & 100°C while heat breaks particle attractions!", "deepReadTitle": "🌍 Greenhouse Effect & Passive Solar Design (Strand E)", "deepReadText": "• Natural Greenhouse Effect: Atmospheric gases (CO₂, water vapour, methane) trap infrared radiation to keep Earth warm enough for life (+15°C average instead of −18°C!).\n• Enhanced Greenhouse Effect: Excess human CO₂ traps too much heat, warming global climates.\n• Passive Solar Homes: Large south-facing windows let low winter sunlight warm stone floors (thermal mass) naturally!", "videos": [{"id": "qg-xEj-0xX0", "title": "Thermal Expansion and Thermal Contraction", "channel": "Point Source Science", "why": "Shows particle-level expansion in solids, liquids, and gases (bridges, thermometers, balloons)."}, {"id": "xYU7RSoOZ0U", "title": "Changes of State | Matter & Latent Heat", "channel": "FuseSchool", "why": "Clearly explains melting, boiling, condensation, and flat heating-curve plateaus."}], "quickCheck": {"question": "While a pot of pure water is vigorously boiling on a hot stove at 100°C, why does the water temperature stay FLAT at 100°C instead of climbing to 120°C?", "options": ["Because the stove automatically turns itself off at 100°C.", "Because all added thermal energy is being used to break the attractive forces between liquid water particles to turn them into steam (gas).", "Because water particles stop moving when they boil."], "correctIdx": 1, "explanation": "Spot on! During a state change plateau, thermal energy breaks intermolecular attractions instead of raising average kinetic energy (temperature)!"}}, {"id": "sci-u6-l2", "title": "Lesson 6.2: STEM Fair-Test Design — Independent, Dependent & Controlled Variables", "readTime": "3 min read", "bigIdea": "Every A+ Grade 7 Science lab tests ONE change at a time (IV), measures ONE outcome (DV), and locks everything else 100% identical (CVs)!", "paragraphs": ["In Ontario's 2022 Science Curriculum (Strand A: STEM Investigation Skills), designing a FAIR TEST is tested across every single unit! Suppose Zaid wants to test whether hotter water dissolves salt faster, or whether a wider base makes a spaghetti tower hold more weight. You MUST classify three variables clearly.", "1) INDEPENDENT VARIABLE (IV — 'I' Change It!): The ONE single factor you intentionally change between test groups (e.g., Water Temperature: 10°C vs. 40°C vs. 80°C). If you changed BOTH temperature AND stirred one cup faster, your test would be UNFAIR because you wouldn't know which change caused the result!", "2) DEPENDENT VARIABLE (DV — Data You Measure!): The result you measure with a stopwatch, ruler, scale, or thermometer (e.g., Time in seconds for 10 g of salt to completely dissolve). 3) CONTROLLED VARIABLES (CVs — Kept Constant!): Every other factor kept identical across every trial (same 100 mL water volume, same 10 g fine salt, same beaker shape, same gentle stirring speed!)."], "keyTakeaway": "IV = The ONE thing I change | DV = The Data I measure | CVs = Everything kept identical for a Fair Test!", "deepReadTitle": "💻 Strand A Coding Connection: Smart Thermostat Logic", "deepReadText": "Ontario's 2022 Science Curriculum connects heat transfer to simple automation logic:\n`if room_temp < 20:` → `turn_on_heater()`\n`elif room_temp > 23:` → `turn_on_fan()`\n`else:` → `standby_save_energy()`", "videos": [{"id": "zFe8eK1aiIU", "title": "Independent, Dependent, and Control Variables", "channel": "MooMooMath and Science", "why": "Fast, memorable examples of IV, DV, and CVs in middle school science labs."}, {"id": "3nAETHZTObk", "title": "Nature of Science & Controlled Experiments", "channel": "Amoeba Sisters", "why": "Explains hypotheses, fair tests, trials, and scientific evidence cleanly."}], "quickCheck": {"question": "A student tests how the Colour of a Cup (Black vs. White vs. Silver) affects how fast hot cocoa cools down over 15 minutes. What is the INDEPENDENT Variable (IV) and what is the DEPENDENT Variable (DV)?", "options": ["IV = Temperature drop (°C) | DV = Cu
