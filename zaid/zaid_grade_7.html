p colour", "IV = Cup colour (Black/White/Silver) | DV = Temperature of the cocoa after 15 minutes (°C)", "IV = Amount of cocoa | DV = Room temperature"], "correctIdx": 1, "explanation": "IV ('I change it') = Cup Colour! DV ('Data measured') = Final Temperature (°C) after 15 minutes! Amount of cocoa and starting temperature must be Controlled Variables (CVs)!"}}], "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Thermal Expansion, Heating Curve & IV/DV/CV", "content": "Essential Strand E & Strand A anchors:", "keyPoints": ["Thermal Expansion (heated → particles move faster & spread apart) vs. Contraction (cooled → slow down & move closer)", "Heating Curve Plateaus: 0°C (Melting/Freezing) & 100°C (Boiling/Condensing)", "IV (I change) | DV (Data measured) | CVs (Kept constant for a fair test)"]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Why a Basketball Left Outside in January Snow Loses Its Bounce", "content": "Particle Theory explains thermal contraction in gases!", "analogy": "🏀 Winter Basketball Analogy: When a basketball sits in −20°C Ottawa snow, the air (gas) particles inside lose thermal energy, move slower, and hit the inside rubber walls with less force—causing the gas to CONTRACT so the ball feels squishy! Bring it inside the warm gym and the particles speed up and expand again!", "keyPoints": ["No air leaked out—the air particles simply contracted from losing thermal energy!"]}, {"level": 3, "name": "APPLY", "subtitle": "Design a Fair-Test Lab for Heat Insulation", "content": "Lock in IV, DV, and 3 CVs cleanly:", "workedExample": {"prompt": "Lab Goal: Test whether foam, aluminum foil, or wool keeps hot water warmest for 20 minutes.", "steps": ["IV (Changed): Type of insulation material wrapped around the cup (foam vs. foil vs. wool).", "DV (Measured): Final water temperature (°C) after 20 minutes.", "3 CVs (Controlled): Exact same 200 mL water volume, same 80°C starting temperature, same cup size & thickness of wrap!"]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Thermal Expansion Across Solids, Liquids & Gases", "content": "Notice how attractive forces control how much matter expands:", "comparisonTable": {"headers": ["State of Matter", "Strength of Attractive Forces", "Amount of Expansion When Heated", "Real-World Example"], "rows": [["Solid", "Very Strong", "Small (but powerful force!)", "Steel bridge expansion joints, stuck metal jar lid warmed under hot water"], ["Liquid", "Medium", "Moderate & visible", "Red alcohol rising up a glass thermometer"], ["Gas", "Very Weak", "Huge expansion!", "Hot air balloon rising, winter basketball deflating/re-inflating"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Spot the Fatal Flaw in an Unfair Science Experiment", "content": "Audit this student's experiment:", "keyPoints": ["❌ Student puts 100 mL of 90°C water in a foam cup and 200 mL of 70°C water in a metal cup, then measures which is warmer after 10 minutes!", "✅ Audit: UNFAIR TEST! They changed 3 variables at once (cup material, water volume, AND starting temperature). Lock volume & starting temp identical!"]}, {"level": 6, "name": "CREATE", "subtitle": "Design an Experiment & Thermostat Code Logic for an Eco-Classroom", "content": "Combine Fair-Test IV/DV/CV design with Particle Theory heat control.", "keyPoints": ["Complete Ontario 2022 Science Strand A + Strand E mastery!"]}], "questions": [{"id": "sci-u6-q1", "bloomLevel": 6, "bloomTag": "ANALYZE, EVALUATE & DESIGN", "title": "Nelson Unit D & Strand A Lab: Thermal Expansion, Heating Curve & Fair-Test Design", "prompt": "Answer all 3 parts using precise Particle Theory and STEM vocabulary:\n(a) THERMAL EXPANSION/CONTRACTION: Explain using the Particle Theory (1) why a basketball left outside in −20°C Ottawa snow feels soft even with zero holes, AND (2) why running hot tap water over a tight metal pickle-jar lid makes it easy to twist open!\n(b) HEATING CURVE PLATEAUS: On the Heating Curve of Water, explain why the temperature rises steadily from 0°C to 100°C, but stays completely FLAT at 100°C while the water boils into steam even though heat is still being added.\n(c) FAIR-TEST LAB DESIGN (Strand A): Zaid wants to run a fair-test science experiment to find out which winter coat filling (Down Feathers vs. Synthetic Fleece vs. Cotton) slows down heat loss the best using heated water bottles. Identify (1) the Independent Variable (IV), (2) the Dependent Variable (DV), and (3) THREE Controlled Variables (CVs) required to make the test scientifically fair.", "step1_deconstruct": {"instruction": "Check all 3 parts: 2 Particle Theory explanations in (a), 100°C plateau physics in (b), and IV + DV + 3 CVs in (c).", "guidingQuestions": ["In (a), how do particle speed and spaces change when cooled (−20°C) vs. heated (hot tap water)?", "In (b), where does the added heat go during the flat 100°C boiling plateau?", "In (c), what ONE thing changes (material), what is measured (temp °C), and what 3 things stay 100% identical?"], "modelPlan": "(a) Cold snow -> air particles slow down & contract; Hot tap water -> metal lid particles move faster & expand slightly more than glass! (b) Slope = faster kinetic energy; 100°C plateau = thermal energy breaks intermolecular attractions to change liquid → gas. (c) IV = coat material; DV = temp drop (°C) after set time; CVs = same water volume, starting temp, wrap thickness/room temp."}, "step2_anchor": {"instruction": "Strand E & A Key Precision Terms:", "referenceItems": ["Thermal Contraction (cool → slower particles, smaller spaces) vs. Thermal Expansion (heat → faster particles, wider spaces)", "Boiling Plateau (100°C): Energy breaks attractive forces (Latent Heat) instead of raising temperature", "IV (Changed) | DV (Measured) | CVs (Kept Constant)"]}, "step3_substeps": [{"label": "Step 3a: Part (a) — Explain BOTH the −20°C basketball AND the hot-water metal jar lid using Particle Theory", "placeholder": "1. Winter Basketball (Contraction): ...\n2. Hot-Water Metal Lid (Expansion): ...", "hint": "Mention particle speed, spaces between particles, and that metal expands faster than glass!", "modelSubAnswer": "1. Winter Basketball (Thermal Contraction): In −20°C snow, air particles inside the ball lose thermal energy, move slower, collide with the inner walls less forcefully, and pack closer together (contract), lowering air pressure so the ball feels soft without any leak.\n2. Tight Metal Jar Lid (Thermal Expansion): Running hot water adds thermal energy to the metal lid, causing its particles to vibrate faster and spread slightly farther apart (thermal expansion). Because metal expands more than glass, the lid loosens slightly and twists open easily!"}, {"label": "Step 3b: Part (b) — Explain why the Heating Curve slopes upward from 0°C to 100°C, then stays FLAT at 100°C during boiling", "placeholder": "From 0°C to 100°C, added heat increases...\nAt the 100°C flat plateau, added heat is used to...", "hint": "Temperature measures average particle speed (kinetic energy), while state-change heat breaks attractive forces!", "modelSubAnswer": "Between 0°C and 100°C, added thermal energy increases the average speed (kinetic energy) of liquid water particles, so the thermometer rises steadily. Once water reaches 100°C, 100% of the added thermal energy is used to BREAK THE ATTRACTIVE FORCES holding liquid particles together so they can escape as water vapour (gas). Because average particle speed does not rise during the state change, the temperature stays completely flat at 100°C until all liquid boils!"}, {"label": "Step 3c: Part (c) — Design the Winter Coat Insulation Fair Test: state IV, DV, and 3 Controlled Variables", "placeholder": "1. Independent Variable (IV): ...\n2. Dependent Variable (DV): ...\n3. Three Controlled Variables (CVs): ...", "hint": "Lock in water volume, starting temperature, wrap thickness, bottle type, and testing time!", "modelSubAnswer": "1. Independent Variable (IV): Type of winter coat insulation material (Down Feathers vs. Synthetic Fleece vs. Cotton).\n2. Dependent Variable (DV): Temperature drop (or final water temperature in °C) measured after 30 minutes.\n3. Three Controlled Variables (CVs): (1) Exact same volume of water (e.g., 500 mL) and identical bottles, (2) Exact same starting water temperature (e.g., 70°C), and (3) Exact same thickness of insulation wrap tested in the same −10°C cold environment for the exact same 30 minutes!"}], "step4_checks": ["Did I explicitly connect particle speed AND spaces between particles in Part (a)?", "Did I explain breaking attractive forces (intermolecular bonds) at the 100°C plateau in Part (b)?", "Did I clearly separate IV (material), DV (temperature °C), and list 3 specific CVs in Part (c)?"], "step5_modelAnswer": {"basicAnswer": "(a) Cold air shrinks in the ball; hot water expands the metal lid. (b) Heat breaks bonds to make steam instead of raising temp. (c) IV = fabric, DV = water temp, CVs = water amount, start temp, wrap thickness.", "expandedAnswer": "Complete Nelson Unit D & Strand A Exemplar:\n(a) Particle Theory Expansion/Contraction: (1) At −20°C, gas particles inside the basketball lose thermal energy, slow down, and contract closer together, reducing pressure without any leak. (2) Under hot tap water, metal lid particles gain thermal energy, vibrate faster, and expand farther apart—expanding more than the glass jar so the lid loosens.\n(b) Heating Curve Physics: From 0°C to 100°C, thermal energy raises particles' average kinetic energy (temperature climbs). At the 100°C boiling plateau, added heat goes entirely into breaking attractive forces between liquid particles to transition them into gas, keeping temperature flat at 100°C.\n(c) Controlled Fair-Test Design: IV = Insulation material (Down vs. Fleece vs. Cotton); DV = Final water temperature (°C) after 30 minutes; CVs = Identical bottles/water volume (500 mL), identical starting temperature (70°C), and equal insulation thickness & outside temperature.", "extensionPrompt": "STEM Coding Extension: Write a 3-line `if / else` rule a smart winter jacket sensor could use to turn on a tiny battery heater whenever jacket temp drops below 18°C!"}}]}], "friendlySub": "Complete Ontario 2022 Science: Mixtures, Ecosystems, Structures, Heat & STEM", "accent": "#0284c7"}, {"id": "history", "code": "CHC / History 7 (Term 2 Prep)", "name": "History (Term 2 Prep)", "teacher": "O. Macri (OM)", "status": "Term 2 Delivery (Head Start)", "tier": "Tier 3: Term 2 Head Start", "tierClass": "tier-prep", "icon": "🏛️", "reportComment": "HISTORY will be delivered and assessed in Term 2. (OM) — Proactively preparing Term 2 Ontario Grade 7 History with O. Macri so Zaid starts ahead on classwork and quizzes!", "nextSteps": ["Build a strong timeline of New France & British North America (1713–1800) before Term 2 begins", "Analyze historical perspectives (First Nations, Métis, Inuit, Canadiens/Habitants, Acadians, British, Loyalists)", "Apply the same classwork completion and quiz review habits used in O. Macri's Geography class"], "units": [{"id": "hist-u1", "title": "Unit 1: New France, British North America (1713–1800) & Conflict/Challenges (1800–1850)", "curriculumStrand": "Ontario Grade 7 History Strand A (1713–1800) & Strand B (1800–1850)", "svgDiagram": "history_timeline_svg", "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Core Term 2 Timeline & Key Historical Figures/Terms (1713–1850)", "content": "Get ahead for Term 2 with O. Macri by mastering the anchor dates and groups of early Canada:", "keyPoints": ["📜 1713 — Treaty of Utrecht: Ended war in Europe; France ceded Acadia (Nova Scotia) to Britain, turning French-speaking Acadians into British subjects.", "🌾 Seigniorial System (New France): Long, narrow strip farms along the St. Lawrence River owned by a Seigneur and farmed by Habitants so every family had river access for water and transport.", "⛵ 1755 — Expulsion of the Acadians (Le Grand Dérangement): British authorities forcibly deported ~11,000 Acadians when they refused to sign an unconditional oath of allegiance to fight against French/Indigenous allies.", "⚔️ 1756–1763 — Seven Years' War & Battle of the Plains of Abraham (1759): British forces (Wolfe) defeated French forces (Montcalm) at Quebec City; Treaty of Paris (1763) transferred New France to Britain.", "👑 1763 — Royal Proclamation vs. 1774 — Quebec Act: 1763 recognized Indigenous hunting territories West of the Appalachians and tried to assimilate French Canadiens; 1774 restored French civil law, the seigniorial system, and Catholic rights to keep Canadiens loyal during the American Revolution.", "🛡️ 1812–1814 — War of 1812 & 1837–1838 Rebellions: Shawnee leader Tecumseh, General Isaac Brock, Laura Secord, and Canadien/British militia defended Upper/Lower Canada; later in 1837, reformers (Mackenzie & Papineau) rebelled for Responsible Government."]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Understand 'Historical Perspective' & Cause-and-Consequence", "content": "In Grade 7 History, events look completely different depending on WHICH group's shoes you stand in!", "analogy": "🎭 Drama & Sports Referee Analogy: When a referee makes a call in a championship gym game, Team A, Team B, and the crowd all experience the exact same event differently based on their goals. In 1763 or 1774, First Nations, French Canadiens, and British merchants each had completely different goals for land, trade, and culture.", "keyPoints": ["Why did Britain flip its policy from the Royal Proclamation (1763) to the Quebec Act (1774) in just 11 years? Because the Thirteen Colonies to the south were about to rebel (1775), and Britain desperately needed the French-speaking Canadiens in Quebec not to join the American Revolution!"]}, {"level": 3, "name": "APPLY", "subtitle": "Trace Cause -> Event -> Consequence Chains", "content": "Apply the 3-link Historical Chain to explain how the Treaty of Utrecht (1713) led to the Acadian Expulsion (1755):", "workedExample": {"prompt": "Connect 1713 to 1755 using Cause and Consequence:", "steps": ["Underlying Cause (1713): The Treaty of Utrecht gave French Acadia to Britain, leaving French Catholic Acadians living under British Protestant rule.", "Rising Tension (1730–1754): Acadians wanted to stay neutral ('the Neutral French'), refusing to take up arms against either the French or the Mi'kmaq (their allies and trading partners).", "Trigger & Consequence (1755): As the Seven Years' War loomed, British Governor Charles Lawrence demanded an unconditional oath to bear arms; when Acadian deputies refused, British troops burned their farms and deported ~11,000 Acadians across the Atlantic and to Louisiana (where 'Acadian' became 'Cajun')."]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare the Royal Proclamation (1763) vs. The Quebec Act (1774)", "content": "This comparison is one of the most important quiz and assignment topics in Ontario Grade 7 History:", "comparisonTable": {"headers": ["Feature", "Royal Proclamation of 1763", "Quebec Act of 1774"], "rows": [["Goal toward Canadiens", "Assimilation (make Quebec British in language, laws, and Protestant religion)", "Accommodation / Biculturalism (protect French culture to keep Quebec loyal)"], ["Language & Religion", "Catholics barred from holding government office (Test Act)", "Guaranteed free practice of Catholicism; restored church tithes; new oath allowed Catholics in council"], ["Legal & Land System", "Replaced French laws with British law; ended new seigneuries", "Restored French Civil Law (for property/family) + British Criminal Law; protected Seigniorial System"], ["Territory & Indigenous Lands", "Created vast 'Indian Territory' west of Appalachians; Crown treaty required for land purchases", "Expanded Quebec's borders into the Ohio Valley, angering the 13 American Colonies"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Evaluate Who Truly Won the War of 1812 from Multiple Perspectives", "content": "Both the United States and British North America claimed victory in 1814, but what about First Nations allies led by Tecumseh?", "keyPoints": ["🇬🇧🇨🇦 British North America Perspective: Successful defence—American invasions were repelled, borders stayed intact (Treaty of Ghent), and a shared sense of Canadian identity began to grow.", "🇺🇸 American Perspective: Felt they defended their sovereignty at sea against the Royal Navy.", "🪶 First Nations Perspective (Tragic Loss): Despite Tecumseh's crucial alliance with General Brock that saved Upper Canada in 1812, Tecumseh was killed at the Battle of the Thames (1813), and the Treaty of Ghent failed to create the independent Indigenous confederacy homeland Britain had promised."]}, {"level": 6, "name": "CREATE", "subtitle": "Write a Multi-Perspective Historical Dispatch from 1774", "content": "Synthesize historical evidence to write two contrasting primary-source diary reactions to the Quebec Act of 1774: one from a Canadien Habitant along the St. Lawrence River, and one from a merchant in the Thirteen Colonies.", "keyPoints": ["Historical Empathy Check: Use accurate period terms (seigneurie, dîme/tithe, Ohio Valley, French civil law, Governor Carleton)."]}], "questions": [{"id": "hist-q1", "bloomLevel": 4, "bloomTag": "ANALYZE & EVALUATE", "title": "Term 2 Head Start: Royal Proclamation (1763) vs. Quebec Act (1774)", "prompt": "Why did the British government change its strategy in Quebec from Assimilation in the Royal Proclamation of 1763 to Accommodation in the Quebec Act of 1774? In your multi-step response:\n(a) Explain what Britain tried to do in 1763 and why it failed.\n(b) Identify 3 specific rights or systems restored to French Canadiens in the Quebec Act of 1774.\n(c) Explain how the Thirteen American Colonies reacted to the Quebec Act and why.", "step1_deconstruct": {"instruction": "STOP & PLAN: Break down the 3 required parts (a, b, c) and identify key historical terms.", "guidingQuestions": ["What do 'Assimilation' (1763) and 'Accommodation' (1774) mean?", "Why didn't English settlers flood into Quebec after 1763 as Britain expected?", "Why was Britain worried about the Thirteen Colonies in 1774?"], "modelPlan": "(a) Define assimilation in 1763 and explain that French Canadiens still outnumbered British settlers 70,000 to <1,000. (b) List the 3 restored pillars in 1774: Catholic rights, French Civil Law, and the Seigniorial system. (c) Explain why the 13 Colonies called it one of the 'Intolerable Acts' (Ohio Valley land + fear of Catholic/appointed government)."}, "step2_anchor": {"instruction": "ANCHOR TIMELINE FACTS: 1763 vs. 1774.", "referenceItems": ["Population Reality (1763–1774): Over 99% of non-Indigenous residents in Quebec were French Catholic Canadiens; Governors James Murray and Guy Carleton realized assimilation was impossible.", "Three Pillars of 1774: (1) Freedom of Catholic worship & holding office, (2) French Civil Law alongside British Criminal Law, (3) Seigniorial land system preserved, plus boundaries expanded into the Ohio Valley."]}, "step3_substeps": [{"label": "Step 3a: Part (a) — Explain Britain's 1763 Assimilation goal and why Governor Carleton realized it needed to change by 1774", "placeholder": "In the Royal Proclamation of 1763, Britain tried to assimilate the Canadiens by... However, this failed because...", "hint": "Mention the huge population difference (over 70,000 Canadiens vs. only a few hundred British merchants) and rising unrest in the 13 Colonies!", "modelSubAnswer": "In the Royal Proclamation of 1763, Britain attempted to assimilate the French Canadiens by imposing British laws, discouraging the seigniorial system, and barring Catholics from government office. However, this policy failed because hardly any British colonists moved north to Quebec (leaving over 70,000 Canadiens outnumbering British settlers by more than 100 to 1). By 1774, with rebellion brewing in the Thirteen American Colonies, Governor Guy Carleton warned Britain that it had to win the loyalty of the Canadiens so they wouldn't join the Americans."}, {"label": "Step 3b: Part (b) — List and explain 3 specific things the Quebec Act of 1774 restored or protected for the Canadiens", "placeholder": "1. Religion: ...\n2. Law: ...\n3. Land System: ...", "hint": "Cover Catholic religion/office, French Civil Law, and the Seigniorial system.", "modelSubAnswer": "The Quebec Act of 1774 accommodated the Canadiens in three major ways:\n1. Religion & Politics: It guaranteed freedom of worship for Roman Catholics, allowed the Church to collect tithes, and created a new oath so Catholics could serve on the governing council.\n2. Dual Legal System: It restored French Civil Law for property and family matters while keeping British Criminal Law.\n3. Land System: It officially protected the French Seigniorial System of long riverfront strip farms."}, {"label": "Step 3c: Part (c) — Explain why the Thirteen American Colonies were furious about the Quebec Act of 1774", "placeholder": "Colonists in the Thirteen Colonies were angry about the Quebec Act because it expanded Quebec's border into...", "hint": "Where did American land speculators want to expand? (The Ohio Valley!)", "modelSubAnswer": "Colonists in the Thirteen American Colonies were outraged and labeled the Quebec Act one of the 'Intolerable Acts' because it expanded Quebec's territory south into the fertile Ohio River Valley—land that American colonists had fought for and wanted to settle. They also resented Britain granting official rights to the Catholic Church and governing Quebec without an elected assembly, which helped spark the American Revolution in 1775."}], "step4_checks": ["Did I clearly contrast 'Assimilation' (1763) with 'Accommodation' (1774)?", "Did I include all 3 restored rights in Part (b) (Catholicism, French Civil Law, Seigniorial System)?", "Did I explain the Ohio Valley connection in Part (c)?"], "step5_modelAnswer": {"basicAnswer": "(a) Britain wanted Canadiens to stay loyal during the American Revolution. (b) Kept Catholic religion, French civil law, and seigneuries. (c) Americans wanted the Ohio Valley land.", "expandedAnswer": "Complete Grade 7+ History Response (O. Macri Term 2 Exemplar):\n(a) From Assimilation to Accommodation: In 1763, the Royal Proclamation aimed to assimilate French Canadiens into British culture. However, few English settlers moved to Quebec, leaving over 70,000 Canadiens as the vast majority. As tensions escalated toward war in the Thirteen Colonies, Governor Guy Carleton convinced Britain to switch to accommodation in 1774 to secure Canadien loyalty.\n(b) Three Restored Rights in the Quebec Act (1774): First, it protected the Roman Catholic faith and allowed Catholics to hold government office via a modified oath. Second, it restored French Civil Law alongside British Criminal Law. Third, it legalized and preserved the Seigniorial land system.\n(c) Reaction of the Thirteen Colonies: American colonists viewed the Quebec Act as one of the 'Intolerable Acts' because it handed the resource-rich Ohio Valley to Quebec, blocking American westward expansion, and protected French Catholic institutions.", "extensionPrompt": "Extension Question: When American armies invaded Quebec in 1775 expecting Canadiens to join them, how did the Habitants and Catholic clergy actually respond?"}}], "studyFirstTag": "Term 2 Head Start: 1713–1850 Timeline & 1763 vs. 1774", "lessons": [{"id": "hist-u1-l1", "title": "Lesson 1.1: New France, 1763 Royal Proclamation vs. 1774 Quebec Act", "readTime": "3 min read", "bigIdea": "Get a Term 2 head start with O. Macri! Understand how Britain flipped from trying to erase French culture (1763) to protecting it (1774).", "paragraphs": ["In the 1700s, Britain and France were fierce rivals fighting for control of North America. After the Treaty of Utrecht (1713) handed Acadia to Britain, tensions exploded into the Seven Years' War (1756–1763), leading to the tragic Expulsion of the Acadians (1755) and Britain's victory at the Battle of the Plains of Abraham (1759).", "When Britain took control of New France in 1763, King George III issued the Royal Proclamation of 1763. Its goal toward the French-speaking Canadiens was ASSIMILATION—replacing French laws with British laws and banning Catholics from government office—while also recognizing First Nations hunting lands west of the Appalachian Mountains.", "Just 11 years later, Britain did a complete U-turn! Why? Over 70,000 French Canadiens still massively outnumbered British settlers, and the Thirteen American Colonies to the south were about to rebel! To keep Quebec loyal, Britain passed the Quebec Act of 1774 (ACCOMMODATION): restoring Catholic rights, French Civil Law, and the Seigniorial farm system, and expanding Quebec into the Ohio Valley—which infuriated the American colonists."], "keyTakeaway": "1763 Royal Proclamation = Assimilation (failed!) → 1774 Quebec Act = Accommodation (kept Quebec loyal during the American Revolution!).", "deepReadTitle": "⚔️ Quick Look Ahead: War of 1812 & 1837 Rebellions", "deepReadText": "In 1812–1814, General Isaac Brock, Shawnee leader Tecumseh, Laura Secord, and Canadian militia defended British North America against U.S. invasions. Later in 1837–1838, reformers (William Lyon Mackenzie in Upper Canada and Louis-Joseph Papineau in Lower Canada) challenged elite councils, paving the way for Responsible Government (democracy).", "quickCheck": {"question": "Why did Britain pass the Quebec Act of 1774 restoring French Civil Law, Catholic rights, and the Seigniorial System?", "options": ["Because France won the Seven Years' War.", "To win and keep the loyalty of the 70,000+ French Canadiens as rebellion grew in the Thirteen American Colonies.", "Because American colonists asked Britain to expand Quebec."], "correctIdx": 1, "explanation": "Governor Guy Carleton warned Britain that assimilation had failed and accommodating the Canadiens was essential to prevent Quebec from joining the American Revolution!"}, "videos": [{"id": "HHmrN_R4diE", "title": "The Royal Proclamation of 1763 — A Law That Shaped Canada", "channel": "Super Simple Sheets", "why": "Term 2 head start on 1763 Assimilation & First Nations treaty foundations."}, {"id": "BDrbu_68GF8", "title": "The Quebec Act of 1774 Explained: A Landmark in Canadian History", "channel": "Super Simple Sheets", "why": "Explains why Britain switched to Accommodation in 1774 and how it shaped Canada."}]}]}, {"id": "hist-u2", "title": "Unit 2 (Nelson Ch. 1–5): Life in New France, Plains of Abraham (1759) & The Loyalists (1791)", "studyFirstTag": "How Habitants & Indigenous nations lived, how Quebec fell in 1759 & how Loyalists created Upper Canada!", "curriculumStrand": "Ontario Grade 7 History Strand A: New France and British North America (1713–1800)", "svgDiagram": "history_timeline_svg", "lessons": [{"id": "hist-u2-l1", "title": "Lesson 2.1: Daily Life in New France (Seigneurs, Habitants & Fur Trade Alliances)", "readTime": "3 min read", "bigIdea": "New France survived on two pillars: narrow riverfront strip farms along the St. Lawrence (Seigniorial System) and vast Indigenous fur-trade alliances!", "paragraphs": ["Picture flying over the St. Lawrence River in 1720: instead of square farms, you see hundreds of long, narrow ribbon-shaped farms lined up side by side touching the water! That was the SEIGNIORIAL SYSTEM. The French King granted huge estates to noble landlords (Seigneurs), who rented narrow strips to farming families (Habitants) so EVERY family had direct canoe access to the river highway, rich riverbank soil, and a forest woodlot in the back!", "While Habitants farmed wheat and built tight-knit river communities (helped by the *Filles du Roi*—young women sponsored by King Louis XIV to grow New France's population!), the colony's biggest money-maker was the FUR TRADE. European fashion went crazy for waterproof beaver-pelt hats! French *Coureurs de Bois* ('runners of the woods') and licensed *Voyageurs* paddled thousands of kilometres inland to trade metal tools and cloth for furs.", "Crucially, New France could NEVER have survived without FIRST NATIONS ALLIANCES! Nations like the Wendat (Huron), Algonquin, and Anishinaabe were expert guides, diplomats, canoe builders, and trappers—while French alliances with them also drew New France into rivalries with the powerful Haudenosaunee (Iroquois) Confederacy allied with the British and Dutch."], "keyTakeaway": "Seigniorial System = long narrow strip farms giving every Habitant St. Lawrence River access | Fur Trade depended 100% on Indigenous knowledge, canoe routes & diplomacy!", "deepReadTitle": "⚔️ Lesson 2.2 Mini-Read: 1759 Battle of the Plains of Abraham & 1783 Loyalists", "deepReadText": "• Sept 13, 1759 (Plains of Abraham): British General James Wolfe surprised French General Montcalm by scaling the steep cliff outside Quebec City overnight. In just 15–30 minutes of battle, both generals were mortally wounded, Quebec City fell, and the 1763 Treaty of Paris transferred New France to Britain!\n• 1775–1791 (The Loyalists): During the American Revolution, ~50,000 people loyal to Britain—including British settlers, 3,500 Black Loyalists promised freedom, and Haudenosaunee allies led by Joseph Brant (Thayendanegea)—fled north into Nova Scotia and Quebec. Because English Loyalists wanted British laws while French Canadiens wanted Quebec Act laws, Britain passed the Constitutional Act of 1791, splitting Quebec into UPPER CANADA (Ontario — English!) and LOWER CANADA (Quebec — French)!", "videos": [{"id": "fa40H91hSqQ", "title": "The Rise and Fall of New France: Canada's First Colony", "channel": "Super Simple Sheets", "why": "Covers Seigneurs, Habitants, the Fur Trade, and Indigenous alliances clearly for Grade 7."}, {"id": "_DLKM-Y4aqw", "title": "The Clash That Changed Canada: Battle of the Plains of Abraham", "channel": "Super Simple Sheets", "why": "Dramatic, curriculum-aligned walkthrough of Wolfe, Montcalm, and 1759."}], "quickCheck": {"question": "Why did the Constitutional Act of 1791 split the colony of Quebec into Upper Canada (Ontario) and Lower Canada (Quebec)?", "options": ["Because France recaptured Montreal.", "Because tens of thousands of English-speaking Loyalists arrived after the American Revolution wanting British laws, while French Canadiens wanted to keep French civil law and culture.", "Because the St. Lawrence River dried up."], "correctIdx": 1, "explanation": "Loyalist migration transformed British North America's population—creating Upper Canada (English law/land, today's Ontario!) and Lower Canada (French civil law/Seigniorial system, today's Quebec)!"}}], "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "New France Roles, 1759 & 1791 Anchors", "content": "Key Nelson History 7 Strand A terms:", "keyPoints": ["Seigneur (landlord), Habitant (strip-farm settler), Filles du Roi, Voyageurs / Coureurs de Bois", "Sept 13, 1759: Battle of the Plains of Abraham (Wolfe vs. Montcalm) → 1763 Treaty of Paris", "1783 Loyalists (United Empire, Black Loyalists, Six Nations / Joseph Brant) → 1791 Constitutional Act (Upper & Lower Canada)"]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Why Upper Canada Was 'Upper' Even Though Ontario Is Further South!", "content": "Look at a map of Canada—why was southern Ontario called 'UPPER' Canada while northern Quebec was 'LOWER' Canada?!", "analogy": "🛶 River Current Analogy: Remember Geography's Rule of Vs—rivers flow downhill! The St. Lawrence River flows from Lake Ontario northeast to the Atlantic Ocean. Ontario sits UPSTREAM (higher elevation = Upper Canada!), and Quebec sits DOWNSTREAM (lower elevation = Lower Canada)!", "keyPoints": ["Geography and History connect directly on the St. Lawrence River!"]}, {"level": 3, "name": "APPLY", "subtitle": "Analyze the Mutual Responsibilities of Seigneurs and Habitants", "content": "Both sides had strict duties under New France law:", "workedExample": {"prompt": "What did a Seigneur owe his Habitants, and what did Habitants owe in return?", "steps": ["Seigneur's Duties: Divide land fairly, build a flour mill (gristmill) and manor house, attract settlers, and resolve minor disputes.", "Habitant's Duties: Clear and farm the strip of land, pay small annual rent (`cens et rentes`), grind grain at the seigneur's mill, and give a few days of free road-building labour (`corvée`) each year."]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Perspectives of Different Loyalist Groups Arriving in 1783", "content": "Not all Loyalists received equal treatment after arriving in British North America:", "comparisonTable": {"headers": ["Loyalist Group", "Why They Came North", "Reality & Challenges Faced"], "rows": [["White United Empire Loyalists", "Remained loyal to Britain during American Revolution", "Received large free farmland grants in Ontario (Upper Canada) and Maritimes"], ["Black Loyalists (~3,500)", "Britain promised freedom & land to enslaved people who joined British side", "Gained legal freedom, but faced discrimination, tiny rocky plots (Birchtown, NS); ~1,200 later sailed to Sierra Leone (1792)"], ["Haudenosaunee / Six Nations (Joseph Brant)", "Fought as British allies; lost ancestral New York homelands", "Granted Haldimand Tract along Ontario's Grand River (Six Nations of the Grand River today), though much land was later encroached on"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Evaluate Why the 15-Minute Battle of 1759 Was a Turning Point in World History", "content": "How did one brief battle outside Quebec City reshape Canada forever?", "keyPoints": ["Ended 150 years of French imperial rule in mainland North America, set up the 1763 Proclamation & 1774 Quebec Act, and sparked the bilingual/bicultural country Canada is today."]}, {"level": 6, "name": "CREATE", "subtitle": "Compare a Habitant Strip Farm vs. a British Township Grid", "content": "Explain how land-division geometry shaped community life in Lower Canada vs. Upper Canada.", "keyPoints": ["Long river strips built tight social villages; British square concession grids isolated farmhouses but made roads straight!"]}], "questions": [{"id": "hist-u2-q1", "bloomLevel": 4, "bloomTag": "ANALYZE & EVALUATE", "title": "Nelson History Ch. 1–5 Lab: Seigniorial System, 1759 & Loyalist Perspectives (1791)", "prompt": "Prepare for O. Macri's Term 2 History units by answering all 3 parts thoroughly:\n(a) SEIGNIORIAL SYSTEM: Explain why New France divided farms into long, narrow strips along the St. Lawrence River (giving 2 geographic advantages) and describe ONE duty of the Seigneur and ONE duty of the Habitant.\n(b) 1759 TURNING POINT: Summarize what happened at the Battle of the Plains of Abraham (1759) and how the 1763 Treaty of Paris changed the map of North America.\n(c) LOYALISTS & 1791: Contrast the experience of White Loyalists with EITHER Black Loyalists OR Six Nations (Haudenosaunee) Loyalists after 1783, and explain why Loyalist migration directly caused Britain to pass the Constitutional Act of 1791.", "step1_deconstruct": {"instruction": "Verify all 3 parts: 2 strip-farm advantages + duties in (a), 1759 + 1763 in (b), and contrasting Loyalist perspectives + 1791 Upper/Lower Canada split in (c).", "guidingQuestions": ["Why was St. Lawrence River frontage essential in the 1700s (roads didn't exist yet!)?", "Who commanded the British (Wolfe) and French (Montcalm) in 1759?", "Why did Loyalists push for the 1791 split into Upper & Lower Canada?"], "modelPlan": "(a) River transport + water/fertile soil + woodlot; Seigneur built flour mill, Habitant cleared land/paid rent. (b) Wolfe scaled cliffs, defeated Montcalm in <30 min → 1763 Treaty of Paris ended French empire in mainland N. America. (c) Contrast equal promises vs. unequal land grants for Black/Six Nations Loyalists; 1791 created Upper Canada (English/Ontario) & Lower Canada (French/Quebec)."}, "step2_anchor": {"instruction": "Strand A Timeline Anchors:", "referenceItems": ["Seigniorial System: River highway + fertile soil + forest woodlot", "1759 Plains of Abraham (Wolfe vs. Montcalm) → 1763 Treaty of Paris", "1783 Loyalists → 1791 Constitutional Act = Upper Canada (Ontario) + Lower Canada (Quebec)"]}, "step3_substeps": [{"label": "Step 3a: Part (a) — Explain 2 advantages of Seigniorial strip farms + 1 Seigneur duty & 1 Habitant duty", "placeholder": "2 Advantages of Strip Farms: ...\nSeigneur Duty: ...\nHabitant Duty: ...", "hint": "Remember: the St. Lawrence River was the ONLY highway in summer (canoes) and winter (sleighs on ice)!", "modelSubAnswer": "• 2 Strip-Farm Advantages: (1) Every family got direct frontage on the St. Lawrence River for canoe/sleigh transportation, fishing, and fresh water; (2) Narrow side-by-side lots kept neighbours close together for community help and defence, with fertile soil near the river and timber woods in the back.\n• Duties: The Seigneur had to build a flour mill (gristmill) and attract settlers; the Habitant had to clear/farm the land, pay small annual rent, and give a few days of community road labour (`corvée`)."}, {"label": "Step 3b: Part (b) — Explain the Battle of the Plains of Abraham (1759) and the Treaty of Paris (1763)", "placeholder": "On Sept 13, 1759, British General James Wolfe... As a result, the Treaty of Paris (1763)...", "hint": "Mention Wolfe's surprise night cliff climb, Montcalm's rapid defeat, and France ceding New France to Britain!", "modelSubAnswer": "On September 13, 1759, British General James Wolfe led soldiers up a steep cliff outside Quebec City overnight, surprising French General Montcalm. In a fierce battle lasting under 30 minutes, both generals were fatally wounded and Britain captured Quebec City. After Montreal surrendered in 1760, the Treaty of Paris (1763) formally transferred nearly all of New France to Great Britain, ending France's mainland North American empire."}, {"label": "Step 3c: Part (c) — Contrast Loyalist experiences (1783) AND explain why Britain passed the Constitutional Act of 1791", "placeholder": "Loyalist Contrast: While White Loyalists received..., Black Loyalists / Six Nations...\nWhy 1791 Happened: ...", "hint": "Loyalists wanted English common law, freehold land, and an elected assembly; Canadiens wanted French civil law!", "modelSubAnswer": "• Contrasting Loyalist Experiences: While White United Empire Loyalists received generous free farmland grants and supplies, Black Loyalists—who had been promised freedom and equal land—received tiny, rocky plots (or none at all) and faced severe discrimination, leading ~1,200 to leave Nova Scotia for Sierra Leone in 1792 (similarly, Six Nations allies under Joseph Brant received the Haldimand Tract along the Grand River but later lost much of it to encroachment).\n• Constitutional Act of 1791: Because ~10,000 English-speaking Loyalists settled west of Montreal demanding British law, freehold land, and an elected assembly—while French Canadiens wanted to keep Quebec Act protections—Britain split the colony into Upper Canada (Ontario, English laws) and Lower Canada (Quebec, French civil law)."}], "step4_checks": ["Did I include 2 geographic advantages AND both Seigneur and Habitant duties in Part (a)?", "Did I connect 1759 (Plains of Abraham) directly to 1763 (Treaty of Paris) in Part (b)?", "Did I contrast two distinct Loyalist groups AND explain Upper/Lower Canada (1791) in Part (c)?"], "step5_modelAnswer": {"basicAnswer": "(a) Strip farms gave river access; seigneur built a mill, habitant farmed. (b) Britain beat France in 1759 and took New France in 1763. (c) Black Loyalists got unfair land; 1791 split Upper and Lower Canada.", "expandedAnswer": "Complete Nelson History Strand A Exemplar:\n(a) Seigniorial System: Long narrow strips gave every Habitant St. Lawrence River access for transport and water while placing neighbours close together for mutual support and providing both fertile riverbank soil and back woodlots. Seigneurs built flour mills and settled land; Habitants cleared farms, paid small rents, and contributed community labour.\n(b) 1759 & 1763: After Wolfe's surprise cliff landing defeated Montcalm on the Plains of Abraham (1759), Quebec City fell, culminating in the Treaty of Paris (1763) which ceded New France to Britain.\n(c) Loyalists & 1791: While White Loyalists received generous land grants, Black Loyalists faced systemic discrimination and rocky/withheld plots despite Britain's promises (and Six Nations allies under Joseph Brant lost ancestral New York lands before resettling along the Grand River). To accommodate English Loyalists' demands for British laws without revoking French Canadiens' rights, the Constitutional Act of 1791 split Quebec into Upper Canada (Ontario) and Lower Canada (Quebec).", "extensionPrompt": "Ottawa Local History Link: Did you know the Ottawa Valley (Bytown / Rideau Canal!) was settled in the early 1800s right along the border between Upper Canada and Lower Canada?"}}]}, {"id": "hist-u3", "title": "Unit 3 (Nelson Ch. 6–10): War of 1812, Underground Railroad & 1837 Rebellions → Democracy", "studyFirstTag": "Discover Brock, Tecumseh & Secord, Harriet Tubman in Ontario & how 1837 won Canadian democracy!", "curriculumStrand": "Ontario Grade 7 History Strand B: Canada, 1800–1850 — Conflict and Challenges", "svgDiagram": "history_timeline_svg", "lessons": [{"id": "hist-u3-l1", "title": "Lesson 3.1: The War of 1812 (Brock, Tecumseh & Laura Secord) & The Underground Railroad", "readTime": "3 min read", "bigIdea": "Between 1812 and 1850, British North America defended its borders through an Indigenous-British alliance and became the northern beacon of freedom for the Underground Railroad!", "paragraphs": ["In June 1812, the United States declared war on Britain (angry over British naval blockades and kidnapping American sailors) and invaded Upper and Lower Canada expecting an easy conquest! Instead, a remarkable alliance fought back: British General Isaac Brock partnered closely with brilliant Shawnee chief TECUMSEH (who united First Nations to defend their homelands), capturing Fort Detroit without firing a shot! Later, LAURA SECORD trekked 32 km through dense forest and swamps to warn British and Mohawk warriors of a surprise U.S. attack at Beaver Dams (1813), while Voltigeurs defended Lower Canada!", "When the Treaty of Ghent ended the war in 1814, borders returned to exactly where they started—leaving Canada with a proud new sense of shared identity, EXCEPT for First Nations allies! After Tecumseh was killed at the Battle of the Thames (1813), Britain broke its promise to create an independent Indigenous homeland, making First Nations the tragic losers of 1812.", "Meanwhile, after Britain abolished slavery across its Empire (1833–1834), Upper Canada (Ontario!) became the final destination of the UNDERGROUND RAILROAD—a secret network of safe houses ('stations') and brave guides ('conductors' like Harriet Tubman, who lived in St. Catharines, Ontario!). Tens of thousands of Black freedom seekers escaped American slavery and built thriving Ontario communities like Buxton, Dawn, and Chatham!"], "keyTakeaway": "War of 1812 Heroes: Brock, Tecumseh, Laura Secord & Mohawk/Canadien militia | Underground Railroad: Ontario became the safe northern terminus for ~30,000+ freedom seekers!", "deepReadTitle": "🗳️ Lesson 3.2 Mini-Read: The Rebellions of 1837–1838 & Responsible Government (1848)", "deepReadText": "• Why People Rebelled (1837): Even though Upper and Lower Canada had elected Assemblies, tiny rich unelected clubs—the FAMILY COMPACT (Upper Canada) and CHÂTEAU CLIQUE (Lower Canada)—controlled the Governor and could veto every law! Reformers William Lyon Mackenzie (Upper Canada) and Louis-Joseph Papineau (Lower Canada) led armed rebellions in 1837.\n• How Rebellion Won Democracy: Although British troops crushed the battles quickly, Britain sent Lord Durham to investigate. His Durham Report (1839) led to the Act of Union (1840) AND finally **RESPONSIBLE GOVERNMENT (1848)** (led by Robert Baldwin & Louis-Hippolyte LaFontaine)—meaning the government MUST answer to the elected representatives of the people, the exact democratic foundation Canada uses today!", "videos": [{"id": "efNVeGxLdCg", "title": "The War of 1812 | Canadian Social Studies Lesson", "channel": "Super Simple Sheets", "why": "Covers Brock, Tecumseh, Laura Secord, causes, and impacts for Grade 7."}, {"id": "4DfzMcemtXs", "title": "Canada and the Underground Railroad | Canadian History", "channel": "Super Simple Sheets", "why": "Highlights Harriet Tubman, secret codes, and thriving Black communities in Ontario."}, {"id": "RdGy5dHgkCU", "title": "Upper & Lower Canada Rebellions of 1837: Planting Seeds of Democracy", "channel": "Super Simple Sheets", "why": "Explains Family Compact, Château Clique, Mackenzie, Papineau, and Responsible Government."}], "quickCheck": {"question": "What major democratic change did the Rebellions of 1837–1838 eventually help Canada achieve in 1848?", "options": ["Handing all power back to an absolute King.", "Responsible Government — where cabinet leaders must answer to the elected representatives of the people instead of unelected elites.", "Joining the United States."], "correctIdx": 1, "explanation": "Even though the 1837 battles failed militarily, they forced Britain to grant Responsible Government (1848)—the birth of modern Canadian democracy!"}}], "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "1812–1848 Key People, Groups & Turning Points", "content": "Nelson History 7 Strand B flashcards:", "keyPoints": ["War of 1812 (1812–1814): General Brock, Chief Tecumseh, Laura Secord, Treaty of Ghent", "Underground Railroad (1830s–1860s): Harriet Tubman, St. Catharines, Buxton & Dawn settlements", "1837 Rebellions: Family Compact vs. William Lyon Mackenzie (Upper) | Château Clique vs. Louis-Joseph Papineau (Lower) → 1848 Responsible Government (Baldwin & LaFontaine)"]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "What 'Responsible Government' Actually Means in Plain English", "content": "Think of a school student council vs. an unelected boss!", "analogy": "🏫 Student Council Analogy: Before 1848, students could vote for a Student Council (Elected Assembly), BUT a tiny club of friends picked by the Principal (Family Compact) could say 'NO' to every single vote! Responsible Government (1848) meant the leaders running the government MUST come from the elected majority—if voters lose trust, they vote them out!", "keyPoints": ["Responsible Government = Government is 'responsible' (accountable) to voters!"]}, {"level": 3, "name": "APPLY", "subtitle": "Connect Causes → Events → Consequences of the 1837 Rebellions", "content": "Trace the historical chain:", "workedExample": {"prompt": "How did anger over the Family Compact & Château Clique lead to modern Canadian democracy?", "steps": ["Cause: Unelected oligarchies hoarded land, taxes, and veto power over elected assemblies.", "Event (1837): Mackenzie & Papineau led armed uprisings after peaceful petitions were rejected.", "Consequence (1839–1848): Lord Durham's Report recommended Responsible Government → Baldwin & LaFontaine (English + French partnership!) achieved Responsible Government in 1848!"]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Upper Canada vs. Lower Canada in the 1837 Rebellions", "content": "Essential Grade 7 Term 2 comparison chart:", "comparisonTable": {"headers": ["Feature", "Upper Canada (Ontario)", "Lower Canada (Quebec)"], "rows": [["Ruling Unelected Elite", "Family Compact (wealthy British Anglicans)", "Château Clique (wealthy English merchants)"], ["Main Reform Leader", "William Lyon Mackenzie (journalist)", "Louis-Joseph Papineau (Patriotes / 92 Resolutions)"], ["Top Grievances", "Clergy Reserves blocking good farmland, unfair taxes, no voice in government", "Fear of losing French language/culture, economic crisis, vetoed assembly bills"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Judge Multiple Perspectives on Who Won the War of 1812", "content": "Always include First Nations alongside British/Canadian and American viewpoints!", "keyPoints": ["British North America: Kept borders & built identity ✅ | USA: Claimed maritime independence ✅ | First Nations (Tecumseh's Confederacy): Suffered devastating loss of leader & promised homeland ❌."]}, {"level": 6, "name": "CREATE", "subtitle": "Connect 1848 Baldwin-LaFontaine Cooperation to Canada Today", "content": "Show how an English Ontarian (Baldwin) and a French Quebecker (LaFontaine) working together peacefully won Responsible Government without another war.", "keyPoints": ["Links History directly to Zaid's strength in respectful Collaboration!"]}], "questions": [{"id": "hist-u3-q1", "bloomLevel": 5, "bloomTag": "ANALYZE & EVALUATE", "title": "Nelson History Ch. 6–10 Lab: War of 1812, Underground Railroad & Road to Democracy (1837–1848)", "prompt": "Answer all 3 Term 2 History questions in expanded multi-step work:\n(a) WAR OF 1812 PERSPECTIVES: Explain the crucial contribution of Shawnee Chief Tecumseh (and First Nations allies) AND Laura Secord during the War of 1812, and explain why historians say First Nations suffered the greatest tragedy when the Treaty of Ghent (1814) ended the war.\n(b) UNDERGROUND RAILROAD: Explain why Upper Canada (Ontario) became the primary destination of the Underground Railroad after 1834, and describe the role of 'conductors' like Harriet Tubman and settlements like Buxton.\n(c) REBELLIONS OF 1837 TO DEMOCRACY (1848): Identify the unelected ruling elites in Upper Canada and Lower Canada, explain why reformers (Mackenzie & Papineau) rebelled in 1837, and explain what 'Responsible Government' (1848) changed for ordinary Canadians.", "step1_deconstruct": {"instruction": "Check all 3 parts: Tecumseh + Secord + 1814 First Nations impact in (a), Underground Railroad + Tubman/Buxton in (b), and Family Compact/Château Clique + 1848 Responsible Government in (c).", "guidingQuestions": ["What did Britain promise Tecumseh that was broken in 1814?", "Why was Ontario legally free territory after 1833–1834?", "Who held real veto power before 1848 vs. after Responsible Government?"], "modelPlan": "(a) Tecumseh+Brock took Detroit; Secord warned of Beaver Dams; Treaty of Ghent ignored Indigenous homeland after Tecumseh's death. (b) Britain abolished slavery across Empire (1834) → Ontario safe haven; Tubman guided freedom seekers to St. Catharines/Buxton. (c) Family Compact (Upper) & Château Clique (Lower) vetoed elected assemblies → 1837 rebellions → Durham Report → 1848 Responsible Government accountable to voters."}, "step2_anchor": {"instruction": "Strand B Key Terms:", "referenceItems": ["1812–1814: Brock, Tecumseh, Laura Secord, Treaty of Ghent", "Underground Railroad: British Abolition (1834), Harriet Tubman, Buxton/St. Catharines", "1837–1848: Family Compact, Château Clique, Mackenzie, Papineau, Durham Report, Responsible Government"]}, "step3_substeps": [{"label": "Step 3a: Part (a) — Explain Tecumseh & Laura Secord's roles in 1812 AND why First Nations lost most in 1814", "placeholder": "Tecumseh & Secord: ...\nImpact on First Nations in 1814: ...", "hint": "Mention Fort Detroit (Brock + Tecumseh), Beaver Dams (Secord's 32 km trek), and Britain breaking its homeland promise in the Treaty of Ghent!", "modelSubAnswer": "• Key Contributions: Chief Tecumseh united a powerful First Nations confederacy alongside General Brock to capture Fort Detroit and defend Upper Canada from U.S. invasion. Laura Secord bravely walked 32 km through swamps and enemy lines to warn British and Mohawk forces before the ambush at Beaver Dams (1813).\n• Tragedy for First Nations (1814): After Tecumseh was killed at the Battle of the Thames (1813), the Treaty of Ghent (1814) restored pre-war borders between Britain and the U.S. while completely breaking Britain's promise to establish an independent Indigenous homeland—leaving First Nations facing rapid settler expansion."}, {"label": "Step 3b: Part (b) — Explain why Ontario was the Underground Railroad's destination + Tubman & Buxton's significance", "placeholder": "Ontario became the destination after 1834 because... Conductors like Harriet Tubman and communities like Buxton...", "hint": "Connect the 1833/1834 British Abolition of Slavery Act to Ontario's thriving Black freedom-seeker communities!", "modelSubAnswer": "After the British Empire officially abolished slavery in 1833–1834 (building on Upper Canada's earlier 1793 anti-slavery law), Ontario became legally free soil across the border from the U.S. Brave 'conductors' like Harriet Tubman risked their lives guiding freedom seekers along secret safe houses ('stations') to St. Catharines and thriving self-sufficient Black Canadian communities like Buxton and Dawn, which built renowned integrated schools and farms."}, {"label": "Step 3c: Part (c) — Name the two 1837 elites, explain why Mackenzie & Papineau rebelled, and define Responsible Government (1848)", "placeholder": "Elites: Family Compact (Upper Canada) & Château Clique (Lower Canada)...\nWhy they rebelled: ...\nResponsible Government (1848): ...", "hint": "Before 1848, unelected councils vetoed elected assemblies; after 1848 (Baldwin & LaFontaine), cabinet leaders had to answer to elected representatives!", "modelSubAnswer": "• Ruling Elites & Causes: In Upper Canada, the Family Compact, and in Lower Canada, the Château Clique were tiny unelected clubs of wealthy elites who controlled land, taxes, and vetoed laws passed by elected assemblies. When peaceful petitions failed, William Lyon Mackenzie and Louis-Joseph Papineau led the 1837 rebellions.\n• Responsible Government (1848): Following Lord Durham's Report, reformers Robert Baldwin and Louis-Hippolyte LaFontaine peacefully achieved Responsible Government in 1848—meaning executive leaders MUST come from and answer to the elected representatives of the voters, establishing modern Canadian democracy!"}], "step4_checks": ["Did I cover Tecumseh, Laura Secord, AND the 1814 Treaty of Ghent impact on First Nations in Part (a)?", "Did I explain the 1834 abolition reason + Harriet Tubman/Buxton in Part (b)?", "Did I name Family Compact & Château Clique AND clearly define Responsible Government (1848) in Part (c)?"], "step5_modelAnswer": {"basicAnswer": "(a) Tecumseh and Secord helped defend Canada, but First Nations didn't get their promised homeland. (b) Britain ended slavery in 1834; Tubman led people to Ontario towns like Buxton. (c) Family Compact and Château Clique blocked voters; 1848 Responsible Government gave elected leaders real power.", "expandedAnswer": "Complete Nelson History Strand B Exemplar:\n(a) War of 1812: Chief Tecumseh allied with General Brock to capture Fort Detroit and defend Upper Canada, while Laura Secord walked 32 km to warn British and Mohawk troops before Beaver Dams. Tragically, after Tecumseh's death (1813), the Treaty of Ghent (1814) left British-U.S. borders unchanged while breaking Britain's pledge to secure an independent First Nations homeland.\n(b) Underground Railroad: Following British abolition of slavery (1833–1834), Ontario became a beacon of legal freedom. Conductors like Harriet Tubman led thousands along secret routes to build thriving Black Canadian settlements such as Buxton, Dawn, and St. Catharines.\n(c) 1837 Rebellions & Responsible Government: Frustrated by unelected elites—the Family Compact (Upper Canada) and Château Clique (Lower Canada)—vetoing elected assemblies, Mackenzie and Papineau led the 1837 uprisings. Though defeated in battle, the rebellions triggered the Durham Report and culminated in Responsible Government (1848) under Baldwin and LaFontaine, making government accountable to voters.", "extensionPrompt": "Big Picture Connection: How did Baldwin (English) and LaFontaine (French) working together in 1848 prove that peaceful collaboration achieves lasting change?"}}]}], "friendlySub": "Complete Nelson History 7 (1713–1850): New France, Loyalists, 1812 & 1837 Democracy", "accent": "#d97706"}, {"id": "pe", "code": "PPL7 / Health & PE 7", "name": "Health & Physical Education", "teacher": "DK & O. Macri", "status": "Progressing Well", "tier": "Tier 3: Personal Goal & Strength", "tierClass": "tier-goal", "icon": "🏀", "reportComment": "PE: Zaid demonstrates considerable effectiveness in fitness activities and sport-specific skills. He usually shows safety awareness and is an active contributor in PE. (DK) | He shared that his favourite parts of school are the larger cafeteria and gym. Going forward, we will work on managing his own behaviour in class while supporting his personal goal to improve in gym. (O. Macri)", "nextSteps": ["Track and achieve your personal goal to improve in gym using the F.I.T.T. & S.M.A.R.T. Fitness Planner", "Transfer the self-discipline, focus, and teamwork you show in gym directly into classroom self-regulation", "Apply biomechanics (centre of gravity, force, follow-through) to level up sport-specific skills"], "units": [{"id": "pe-u1", "title": "Unit 1: Biomechanics, F.I.T.T. Fitness Conditioning & Self-Regulation Transfer", "curriculumStrand": "Ontario Grade 7 Health & Physical Education: Active Living (Strand B), Movement Competence (Strand C) & SEL Skills (Strand A)", "svgDiagram": "pe_biomechanics_svg", "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Core Principles: F.I.T.T. Training Formula & Phases of a Movement Skill", "content": "You already show 'considerable effectiveness in fitness activities and sport-specific skills' (DK)! Here is the sport-science framework to push your personal gym goal to the next level:", "keyPoints": ["🏋️‍♂️ The F.I.T.T. Conditioning Formula:\n• F — Frequency: How often you train (e.g., 4–5 days per week).\n• I — Intensity: How hard you work (e.g., Target Heart Rate Zone: 65%–85% of Max HR).\n• T — Time: How long each session lasts (e.g., 30–60 minutes of active movement).\n• T — Type: The specific kind of exercise (Cardiorespiratory endurance, Muscular strength/endurance, Flexibility, or Sport-specific agility).", "🎯 The 3 Phases of Every Sport Skill:\n• Phase 1: Preparation (wide base of support, knees bent, low centre of gravity, eyes on target).\n• Phase 2: Execution (transferring momentum from legs -> core -> arms/feet at the point of release or strike).\n• Phase 3: Follow-Through (continuing motion toward the target to maximize accuracy and absorb force safely)."]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "How Gym Self-Discipline Transfers to Classroom Self-Regulation", "content": "O. Macri and D. Forbes noted two superpowers you already have in gym and group settings: high energy and strong teamwork. Why do top athletes practice 'Impulse Control'?", "analogy": "⚽ Offside Trap & Pump-Fake Analogy: In basketball or soccer, if a defender lunges at the first pump-fake without waiting a split-second to read the play, they get fouled out. In class, blurting out an answer or rushing a math step is just like jumping at a pump-fake! Pausing 3 seconds to raise your hand or double-check your work is the exact same athletic discipline.", "keyPoints": ["The 3-Second Athlete Reset: (1) Breathe in through the nose (just like trombone breathing!), (2) Lock eyes on the play/teacher, (3) Execute with control (raise hand / write the step)."]}, {"level": 3, "name": "APPLY", "subtitle": "Apply Biomechanics & Science (Centre of Gravity) to Gym Performance", "content": "Notice how Grade 7 Science (Structures & Forces) and Grade 7 PE connect directly:", "workedExample": {"prompt": "How do you make yourself nearly impossible to knock off balance when playing defence in basketball or shielding the ball in soccer?", "steps": ["Step 1 (Lower Centre of Gravity): Bend your knees and hips to bring your centre of mass closer to the gym floor.", "Step 2 (Widen Base of Support): Place your feet shoulder-width (or wider) apart in a staggered athletic stance.", "Step 3 (Keep Line of Gravity Inside Base): Keep your torso balanced between your feet so external pushing forces cannot tip your line of gravity outside your shoes."]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Analyze Offensive vs. Defensive Tactical Principles Across Territory Games", "content": "Compare tactical decisions across basketball, soccer, ultimate frisbee, and floorball:", "comparisonTable": {"headers": ["Game Situation", "Space & Positioning", "Team Communication", "Self-Regulation & Safety (DK)"], "rows": [["On Offence (With Possession)", "Spread the court/field ('Create Space'), cut into open lanes, give-and-go triangles", "Call for passes clearly, encourage teammates after missed shots", "Control speed near walls/bleachers, avoid charging"], ["In Transition", "Sprint back immediately or push fast break before defence sets", "Point and call out unmarked opponents", "Keep head up to avoid collisions in high-traffic zones"], ["On Defence (Without Possession)", "Compress space around the goal/key, stay between opponent and basket ('Goal-side')", "Call switches and screens early", "Defend with feet and balance rather than reaching/fouling"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Evaluate a Personal Gym & Classroom Goal Plan Using S.M.A.R.T. Criteria", "content": "Why does 'I want to get better at gym' fail, while a S.M.A.R.T. plan succeeds?", "keyPoints": ["❌ Vague Goal: 'I want to improve in gym and behave better in class.'", "✅ S.M.A.R.T. Goal (Specific, Measurable, Achievable, Relevant, Time-bound): 'Over the next 4 weeks, I will improve my cardiovascular stamina by completing the 12-minute gym run without walking breaks, improve my free-throw/passing accuracy to 7/10 using a full follow-through, and practice self-regulation in academic classes by raising my hand and waiting to be called on 100% of the time.'"]}, {"level": 6, "name": "CREATE", "subtitle": "Design Your 4-Week Longfields-Davidson Heights Gym & Focus Gameplan", "content": "Build a personalized training and self-regulation tracker combining F.I.T.T. conditioning, biomechanics, and classroom focus.", "keyPoints": ["Combines O. Macri's goal ('managing his own behaviour in class while supporting his personal goal to improve in gym') and DK's feedback ('considerable effectiveness in fitness activities and sport-specific skills')."]}], "questions": [{"id": "pe-q1", "bloomLevel": 6, "bloomTag": "APPLY & CREATE", "title": "Personal Gym Improvement & Classroom Self-Regulation Gameplan", "prompt": "On your report card, O. Macri wrote: 'He shared that his favourite parts of school are the larger cafeteria and gym. Going forward, we will work on managing his own behaviour in class while supporting his personal goal to improve in gym.' And DK noted you already show 'considerable effectiveness in fitness activities and sport-specific skills.'\n\nDesign a complete 3-part Personal Action Plan:\n(a) Use the F.I.T.T. formula (Frequency, Intensity, Time, Type) to design a weekly fitness routine to boost your stamina and speed in the gym.\n(b) Use the 3 Phases of Movement (Preparation, Execution, Follow-Through) to explain how you will level up one specific sport skill (e.g., basketball shot/pass, soccer strike, volleyball serve, or badminton smash).\n(c) Explain your 'Athlete Reset' strategy for transferring your gym focus and teamwork into managing classroom behaviour (raising your hand instead of blurting out, and staying on task during independent work).", "step1_deconstruct": {"instruction": "STOP & PLAN: Identify the 3 components of your personal gameplan.", "guidingQuestions": ["What do the 4 letters of F.I.T.T. stand for in Part (a)?", "Which specific sport skill will I break down into Preparation, Execution, and Follow-Through in Part (b)?", "How will I connect athletic discipline to classroom self-regulation in Part (c)?"], "modelPlan": "(a) Build a 4-element F.I.T.T. plan for stamina/agility. (b) Analyze the 3 biomechanical phases of a basketball jump shot or soccer pass. (c) Create a 3-step 'Athlete Reset' rule for raising my hand and staying focused during independent work."}, "step2_anchor": {"instruction": "ANCHOR FRAMEWORKS: F.I.T.T. + 3 Phases of Movement + Athlete Reset.", "referenceItems": ["F.I.T.T.: Frequency (days/wk), Intensity (heart rate/effort), Time (minutes), Type (cardio/agility/strength)", "3 Movement Phases: Preparation (stance/balance) -> Execution (force transfer) -> Follow-Through (accuracy/control)"]}, "step3_substeps": [{"label": "Step 3a: Part (a) — Write your F.I.T.T. Weekly Conditioning Plan for Gym Stamina & Agility", "placeholder": "Frequency: ...\nIntensity: ...\nTime: ...\nType: ...", "hint": "Be specific with numbers (e.g., 4 days/week, 30–45 minutes, shuttle runs + bodyweight strength).", "modelSubAnswer": "• Frequency: 4 to 5 days per week (PE classes + lunchtime intramurals/after-school practice).\n• Intensity: Moderate-to-vigorous (70%–85% max heart rate during shuttle drills and scrimmages).\n• Time: 40 minutes per session (5 min dynamic warm-up, 30 min active drills/game play, 5 min cooldown stretch).\n• Type: Interval sprints and shuttle runs (cardio/agility) + planks, push-ups, and squats (core/leg power)."}, {"label": "Step 3b: Part (b) — Break down 1 specific sport skill into Preparation, Execution, and Follow-Through", "placeholder": "Chosen Skill: ...\n1. Preparation: ...\n2. Execution: ...\n3. Follow-Through: ...", "hint": "Mention Centre of Gravity and Base of Support in the Preparation phase!", "modelSubAnswer": "Chosen Skill: Basketball Jump Shot / Accurate Chest Pass\n1. Preparation: Widen base of support to shoulder-width, bend knees to lower centre of gravity, square shoulders and eyes to the target.\n2. Execution: Push explosively through the legs, transfer momentum smoothly through the core and shooting/passing arm, and release the ball off the fingertips with backspin.\n3. Follow-Through: Extend the elbow fully and snap the wrist downward ('goose-neck' follow-through) pointing directly at the rim or teammate's chest to guarantee accuracy."}, {"label": "Step 3c: Part (c) — Write your Classroom 'Athlete Reset' Protocol (Connecting Gym Discipline to O. Macri, D. Forbes & N. Bishop's classes)", "placeholder": "Just like an athlete doesn't jump at a pump-fake or leave a play half-finished, in class I will:\n1. When I know an answer: ...\n2. During independent work time: ...", "hint": "Address (1) raising your hand instead of blurting out, and (2) completing 15-minute independent work blocks without needing teacher prompts.", "modelSubAnswer": "Classroom Athlete Reset Protocol:\n1. Impulse Control (No Blurting): Just like waiting for the whistle in gym before starting a drill, when I know the answer in D. Forbes's or O. Macri's class, I will take one calm breath, write my keyword on my page, and raise my hand quietly.\n2. Independent Work Stamina: Just like pacing myself in a 12-minute fitness run, during individual work in N. Bishop's or E. Catana's class, I will break my assignment into 3 small quarters and finish every section before looking up or talking to peers."}], "step4_checks": ["Did I include all 4 parts of F.I.T.T. (Frequency, Intensity, Time, Type)?", "Did I include all 3 biomechanical phases (Preparation, Execution, Follow-Through)?", "Did I connect my personal gym goal directly to classroom self-regulation and stamina?"], "step5_modelAnswer": {"basicAnswer": "I will run more in gym, practice shooting, and raise my hand in class.", "expandedAnswer": "Complete Personal Gym & Self-Regulation Action Plan:\n(a) F.I.T.T. Conditioning Plan: Frequency: 4–5 times weekly; Intensity: 75%–85% max heart rate; Time: 40 minutes per session; Type: High-intensity shuttle runs, defensive footwork slides, and core/lower-body strength exercises.\n(b) Biomechanical Skill Breakdown (Basketball Shooting/Passing): Preparation: Establish a balanced, shoulder-width base of support with bent knees (low centre of gravity). Execution: Transfer upward force from legs through core and extend the arm smoothly. Follow-Through: Hold the wrist snap toward the target to ensure consistent trajectory.\n(c) Classroom Athlete Transfer: I will treat classroom focus like championship game discipline—using a 3-second pause to jot my thought down and raise my hand instead of blurting out, and using 'quarter-by-quarter' stamina to finish all independent classwork with zero teacher prompts.", "extensionPrompt": "Live Goal Check: Open the Gym & Stamina Tracker at the top of this portal and log your first completed focus sprint today!"}}], "studyFirstTag": "Personal Gym Goal: F.I.T.T. Training + 3-Phase Sport Skills", "lessons": [{"id": "pe-u1-l1", "title": "Lesson 1.1: The F.I.T.T. Formula, 3-Phase Sport Skills & Athlete Focus", "readTime": "3 min read", "bigIdea": "You already shine in gym—now use sport science (F.I.T.T. + Biomechanics) to level up your skills and carry that same athlete self-control into every class!", "paragraphs": ["Great athletes don't just practice randomly—they train using the F.I.T.T. formula: Frequency (how many days a week), Intensity (how hard your heart works), Time (how many minutes), and Type (cardio stamina, agility drills, or strength).", "Every sport skill—shooting a basketball, passing a soccer ball, serving a volleyball—succeeds when you nail 3 Biomechanical Phases: (1) Preparation (wide base of support, bent knees for a low Centre of Gravity, eyes locked on target), (2) Execution (power rising from legs → core → arm/foot), and (3) Follow-Through (extending straight toward your target for accuracy).", "Best of all, pro athletes master Impulse Control! On defence, jumping at the first pump-fake gets you fouled out. Waiting one calm beat to read the play is the EXACT same skill as pausing 3 seconds in class to raise your hand instead of blurting out!"], "keyTakeaway": "F.I.T.T. builds fitness stamina; Preparation → Execution → Follow-Through builds precision; the 3-Second Athlete Reset builds classroom self-regulation.", "deepReadTitle": "🎯 Turning 'Get Better in Gym' into a S.M.A.R.T. Goal", "deepReadText": "Specific, Measurable, Achievable, Relevant, Time-bound: Instead of 'improve in gym', set a measurable target like 'Complete 4 active fitness sessions per week and hit 7/10 free throws/passes using a full follow-through within 4 weeks.'", "quickCheck": {"question": "In the Preparation phase of defence or shooting, why should you bend your knees and widen your stance?", "options": ["To raise your centre of gravity higher off the floor.", "To lower your centre of gravity and widen your base of support for maximum stability.", "To make it harder to move sideways."], "correctIdx": 1, "explanation": "Just like Grade 7 Science (Structures), a wider base + lower centre of gravity makes you stable and explosive!"}, "videos": [{"id": "0BTIzXOZJmI", "title": "Brain Bites — The F.I.T.T. Principle for Personal Fitness", "channel": "Lynn Hefele", "why": "Quick, memorable visual breakdown of Frequency, Intensity, Time, and Type for your Gym goal!"}]}]}, {"id": "pe-u2", "title": "Unit 2 (Health Strand D): Canadian Nutrition Labels, Digital Balance & Stress Self-Regulation", "studyFirstTag": "Decode Health Canada nutrition labels (cafeteria!), manage screen balance & reset stress!", "curriculumStrand": "Ontario Grade 7 Health & Physical Education Strand D: Healthy Living", "svgDiagram": "pe_biomechanics_svg", "lessons": [{"id": "pe-u2-l1", "title": "Lesson 2.1: Reading Health Canada Nutrition Labels, Digital Wellness & Coping Skills", "readTime": "3 min read", "bigIdea": "Fueling your body for gym and brain focus starts with Health Canada's 5% / 15% Nutrition Label Rule—paired with smart screen habits and calm stress resets!", "paragraphs": ["Whether you're picking lunch in the Longfields-Davidson Heights cafeteria or grabbing an after-school snack before basketball, Health Canada's NUTRITION FACTS TABLE gives you a super-fast 2-step scanner! Step 1: Check the SERVING SIZE at the very top (a big bag of chips might list numbers for just 1/4 of the bag!). Step 2: Use the 5% / 15% % Daily Value (% DV) Rule: `5% DV or less is A LITTLE`, and `15% DV or more is A LOT`!", "Apply the 5%/15% rule smartly: aim for MORE (15%+) of Fibre, Calcium, Iron, and Potassium (fuel for bones, muscles, and long-lasting stamina!), and LESS (5% or less) of Saturated Fat, Sodium (salt), and Added Sugars (which cause quick energy crashes in afternoon math or French class!). And remember Canada's Food Guide Plate: 1/2 vegetables & fruits, 1/4 whole grains, 1/4 protein foods, with water as your drink of choice.", "Healthy Living also protects your brain and mental well-being: (1) Digital Wellness—putting screens away 45–60 minutes before bed protects deep sleep, making morning wake-ups and classroom focus effortless! (2) Stress & Impulse Coping—when you feel frustrated, rushed, or tempted to blurt out in class, use Box Breathing (`In 4s → Hold 4s → Out 4s → Hold 4s`) to reset your nervous system in 16 seconds!"], "keyTakeaway": "Health Canada 5% / 15% Rule: ≤ 5% DV = A Little (good for Sugar/Sodium!) | ≥ 15% DV = A Lot (good for Fibre/Calcium/Iron!) | Sleep + Water + Box Breathing power gym AND class focus!", "deepReadTitle": "🛡️ Handling Peer Pressure Safely (Refusal Strategies)", "deepReadText": "When facing risky peer pressure (vaping, unsafe dares, skipping classwork): (1) Say a firm, calm 'No thanks, I'm good' (no awkward excuses needed!), (2) Change the subject or suggest a fun alternative ('Let's go shoot hoops instead'), or (3) Walk away with a supportive friend.", "videos": [{"id": "JqEuVhaCR5A", "title": "How to Read a Health Canada Nutrition Label in 5 Simple Steps", "channel": "Dietitian Success Center Inc.", "why": "Official Canadian Nutrition Facts table breakdown including Serving Size and the 5% / 15% % DV rule."}], "quickCheck": {"question": "Under Health Canada's 5% / 15% Daily Value Rule, which snack label is the healthiest fuel before afternoon gym and class?", "options": ["Snack A: 28% DV Sugars, 22% DV Sodium, 2% DV Fibre", "Snack B: 4% DV Sugars, 3% DV Sodium, 18% DV Fibre & 16% DV Iron", "Snack C: 30% DV Saturated Fat, 0% DV Fibre"], "correctIdx": 1, "explanation": "Snack B has A LITTLE (≤ 5%) sugar and sodium, and A LOT (≥ 15%) fibre and iron for steady athletic & brain energy!"}}], "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Health Canada 5%/15% Rule & Box Breathing", "content": "Healthy Living Strand D anchors:", "keyPoints": ["Serving Size first! Then: ≤ 5% DV = A Little | ≥ 15% DV = A Lot", "Canada's Food Guide Plate: 1/2 Veggies/Fruit + 1/4 Whole Grains + 1/4 Protein + Water", "Box Breathing Reset: Inhale 4s → Hold 4s → Exhale 4s → Hold 4s"]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Why Checking Serving Size Prevents Hidden Sugar & Sodium Traps", "content": "A 600 mL bottled drink might list '12% Sugar' for 250 mL—meaning drinking the whole bottle is actually nearly 30% DV!", "analogy": "📐 Math Unit Rate Connection: Reading a Nutrition Label uses the EXACT same proportional reasoning as Grade 7 Math Unit Rates! Multiply the label values by how many servings you actually eat.", "keyPoints": ["Always compare Serving Size to the whole package!"]}, {"level": 3, "name": "APPLY", "subtitle": "Compare Two Cafeteria Lunches Using Canada's Food Guide", "content": "Build balanced steady energy:", "workedExample": {"prompt": "Lunch 1: Sugary soda + white-bread pastry. Lunch 2: Chicken & veggie wrap on whole wheat + apple + water.", "steps": ["Lunch 1 spikes blood sugar fast, then crashes 45 minutes later causing sleepiness or fidgeting in afternoon class.", "Lunch 2 matches Canada's Food Guide (protein + whole grains + produce + water) for steady afternoon stamina!"]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare Helpful vs. Unhelpful Stress & Impulse Coping Habits", "content": "Choose strategies that build self-regulation:", "comparisonTable": {"headers": ["Trigger Situation", "Unhelpful Reaction", "Healthy Self-Regulation Habit"], "rows": [["Stuck on a hard French or Geo task", "Give up or distract peers", "Take 1 Box Breath, open Anchor Chart, ask 1 clear question"], ["Late-night phone/gaming before school", "Stay up past midnight → tired & late", "Park screens 45 min before bed → energized & on time (0 lates!)"], ["Know the answer immediately in class", "Blurt out over the teacher", "Jot keyword down & raise hand calmly"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Spot Marketing Tricks on Front-of-Package Labels", "content": "Don't trust flashy front-of-box slogans!", "keyPoints": ["Front says 'Made with Real Fruit!' → Flip to the Nutrition Facts Table & Ingredient List: if Sugar is Ingredient #1 and Sugars = 24% DV, it's candy in disguise!"]}, {"level": 6, "name": "CREATE", "subtitle": "Build Your Personal Fuel, Sleep & Self-Regulation Routine", "content": "Synthesize nutrition, gym stamina, and digital balance into one daily habit plan.", "keyPoints": ["Directly supports O. Macri's and DK's Grade 7 goals!"]}], "questions": [{"id": "pe-u2-q1", "bloomLevel": 5, "bloomTag": "APPLY & EVALUATE", "title": "Health Canada Nutrition Detective & Brain/Gym Self-Regulation Plan", "prompt": "Answer all 3 Healthy Living tasks:\n(a) NUTRITION LABEL AUDIT: Granola Bar A says 'Energy Boost!' on the front, with Serving Size = 1 bar: `22% DV Sugars`, `14% DV Saturated Fat`, `3% DV Fibre`. Trail Mix B (Serving Size = 1/3 cup) has `4% DV Sugars`, `2% DV Sodium`, `16% DV Fibre`, and `15% DV Iron`. Using Health Canada's 5% / 15% rule, prove which snack fuels afternoon gym and classroom focus better (and note what happens if you eat 2/3 cup of Trail Mix B!).\n(b) DIGITAL WELLNESS & ON-TIME HABITS: Explain how putting screens away 45 minutes before bed improves BOTH athletic performance in gym AND arriving on time with stronger focus in morning classes.\n(c) STRESS & IMPULSE RESET: Describe a realistic classroom or gym moment when stress or excitement hits, and show how you would use Box Breathing (4-4-4-4) to stay calm and self-regulated.", "step1_deconstruct": {"instruction": "Check all 3 parts: 5%/15% rule + doubling 1/3 cup to 2/3 cup in (a), sleep/screen link in (b), and Box Breathing scenario in (c).", "guidingQuestions": ["Which snack meets ≤5% sugar/sodium and ≥15% fibre/iron?", "If 1/3 cup = 1 serving, what happens to all numbers when you eat 2/3 cup? (Double them!)", "How does Box Breathing calm your heart rate in 16 seconds?"], "modelPlan": "(a) Trail Mix B wins (≤5% sugar/sodium, ≥15% fibre/iron); eating 2/3 cup doubles every % DV! (b) Blue light delays sleep hormone melatonin -> screen-free wind-down gives deep sleep -> sharper reaction time, stamina & punctuality. (c) Concrete class/gym trigger + 4-4-4-4 Box Breath."}, "step2_anchor": {"instruction": "Health Canada Anchors:", "referenceItems": ["≤ 5% DV = A Little (target for Sugar, Sodium, Sat. Fat) | ≥ 15% DV = A Lot (target for Fibre, Iron, Calcium)", "2/3 cup = 2 × (1/3 cup) → multiply all % DV values by 2!", "Box Breathing: In 4s → Hold 4s → Out 4s → Hold 4s"]}, "step3_substeps": [{"label": "Step 3a: Part (a) — Compare Granola Bar A vs. Trail Mix B using the 5%/15% rule AND explain the 2/3 cup serving check", "placeholder": "Better snack: Trail Mix B because...\nIf I eat 2/3 cup (2 servings), the % DV values...", "hint": "Granola Bar A has 22% DV sugar (A LOT!) and 3% fibre (A LITTLE!), whereas Trail Mix B has 4% sugar and 16% fibre!", "modelSubAnswer": "Trail Mix B is far better fuel! Under Health Canada's 5%/15% rule, Granola Bar A is a sugar crash in disguise—22% DV Sugar is A LOT (≥15%) and 3% DV Fibre is A LITTLE (≤5%). Trail Mix B has A LITTLE Sugar (4%) and Sodium (2%), plus A LOT of Fibre (16%) and Iron (15%) for steady gym and brain energy. Watch Serving Size: since 2/3 cup is DOUBLE the 1/3 cup serving, eating 2/3 cup doubles every value (8% sugar, 32% fibre, 30% iron)."}, {"label": "Step 3b:
