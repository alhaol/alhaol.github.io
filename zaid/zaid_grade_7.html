Part (b) — Explain how a 45-minute screen-free bedtime boosts gym performance AND classroom punctuality/focus", "placeholder": "Bright phone/tablet screens right before bed delay sleep... Turning screens off 45 minutes early helps...", "hint": "Connect quality sleep to waking up on time (0 lates!), muscle recovery in gym, and patience/self-regulation in class!", "modelSubAnswer": "Bright blue light and exciting videos/games right before bed trick the brain into staying awake and reduce deep sleep. Parking screens 45 minutes before bed allows full restorative sleep—giving muscles energy recovery and faster reflexes in gym, making it easy to wake up on time (turning 2 lates into 0!), and boosting patience and independent focus during morning French, Math, and Geography."}, {"label": "Step 3c: Part (c) — Describe a specific class or gym trigger and apply Box Breathing (4-4-4-4)", "placeholder": "Situation: ...\nBox Breathing Reset: I will inhale for 4 seconds...", "hint": "Example: feeling frustrated on a tricky BEDMAS problem or wanting to blurt out during a class discussion!", "modelSubAnswer": "Situation: During a tough math test or fast class discussion with D. Forbes, I feel my pulse speed up and want to rush or blurt out my answer immediately.\nBox Breathing Reset: I silently inhale through my nose for 4 seconds, hold for 4 seconds, exhale smoothly for 4 seconds, and hold for 4 seconds. That 16-second reset lowers my heart rate so I can raise my hand calmly or double-check my signs cleanly!"}], "step4_checks": ["Did I explicitly apply Health Canada's 5% (a little) and 15% (a lot) rule AND address the 2/3 cup double-serving?", "Did I connect screen-free sleep to BOTH gym performance AND morning focus/punctuality?", "Did I include all four 4-second phases of Box Breathing in Part (c)?"], "step5_modelAnswer": {"basicAnswer": "(a) Trail Mix B is healthier (low sugar, high fibre); 2/3 cup doubles the numbers. (b) Better sleep helps gym energy and waking up on time. (c) Box breathing 4-4-4-4 calms me down.", "expandedAnswer": "Complete Grade 7 Healthy Living Exemplar:\n(a) Nutrition Audit: Trail Mix B is the smarter fuel under Health Canada's 5%/15% rule—it keeps Sugar (4%) and Sodium (2%) at 'a little' (≤5%) while providing 'a lot' (≥15%) of Fibre (16%) and Iron (15%), unlike Bar A's 22% sugar spike. Eating 2/3 cup equals 2 servings, doubling every nutrient value.\n(b) Digital Wellness: Stopping screens 45 minutes before sleep improves deep rest, accelerating athletic recovery and speed in gym while making morning routines smooth (0 lates) and strengthening classroom focus.\n(c) Self-Regulation Reset: When excitement or frustration spikes during class, one 4-4-4-4 Box Breathing cycle calms the nervous system so I can pause, raise my hand, or carefully audit my work.", "extensionPrompt": "Real-World Challenge: Check the Nutrition Facts table on one snack in your kitchen tonight using the 5% / 15% rule!"}}]}], "friendlySub": "Complete Health & PE: F.I.T.T., Biomechanics, Health Canada Labels & Self-Regulation", "accent": "#ea580c"}, {"id": "arts", "code": "ARTS7 / Music, Drama & Visual Arts", "name": "The Arts (Music, Drama, Art)", "teacher": "JS (Music/Drama) & E. Catana (Visual Arts)", "status": "Progressing Well", "tier": "Tier 3: Creative Mastery", "tierClass": "tier-strong", "icon": "🎺", "reportComment": "MUSIC: Zaid follows routines and assembles the trombone correctly. He often uses proper posture and breathing. He can usually form the appropriate embouchure and produce the correct pitch. (JS) | DRAMA: Zaid participates appropriately in community building games/activities and is able to identify how audience behaviour impacts a performance. (JS) | ART: Zaid applies elements of design to create works of art. Zaid is encouraged to continue to develop and explore creative ideas. (EC)", "nextSteps": ["Music (Trombone — JS): Move from 'often/usually' to 'always' locking in posture, deep diaphragmatic breathing, firm corner embouchure, and exact slide positions (1st to 7th)", "Drama (JS): Analyze how active vs. disruptive audience behaviour changes actors' focus, projection, and stage energy", "Visual Arts (E. Catana): Combine all 7 Elements of Design with Principles of Design (contrast, emphasis, balance) to expand creative compositions"], "units": [{"id": "arts-u1", "title": "Unit 1: Trombone Pitch & Acoustics (Music), Audience Impact (Drama) & Elements of Design (Art)", "curriculumStrand": "Ontario Grade 7 The Arts: Music (C1, C2), Drama (B1, B3) & Visual Arts (D1, D2)", "svgDiagram": "trombone_arts_svg", "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Core Anchors across Music (Trombone), Drama, and Visual Arts", "content": "You are progressing well across all three Arts strands! Keep these essential anchors ready:", "keyPoints": ["🎺 Music (Trombone — JS):\n• Embouchure: Firm corners of the mouth (like saying 'Mmm'), flat chin, relaxed vibrating centre of the lips (50/50 upper-to-lower lip ratio in the mouthpiece).\n• Breathing & Posture: Sit tall on the front edge of the chair, feet flat, left hand supporting the trombone weight, right hand moving the slide lightly with two fingers and thumb; breathe deeply from the diaphragm (belly expands, shoulders stay relaxed).\n• The 7 Slide Positions & Concert Bb Major Scale: Bb (1st pos.) -> C (6th pos.) -> D (4th pos.) -> Eb (3rd pos.) -> F (1st pos.) -> G (4th pos.) -> A (2nd pos.) -> High Bb (1st pos.).", "🎭 Drama (JS):\n• The Actor-Audience Feedback Loop: Live theatre requires two active roles—performers (focus, character commitment, vocal projection, blocking) and the audience (active listening, eye contact, respectful silence during tension, supportive applause).", "🎨 Visual Arts (E. Catana):\n• The 7 Elements of Design: Line, Shape (2D), Form (3D), Space (positive/negative, foreground/background, perspective), Colour (warm/cool, complementary), Texture (tactile/visual), and Value (lightness/darkness shading)."]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "How Trombone Physics, Embouchure & Slide Length Control Pitch", "content": "Why can the trombone play BOTH a low Bb and a higher F in 1st position without moving the slide at all?", "analogy": "🔬 Science & Music Connection: A trombone is an acoustic brass tube! Extending the slide from 1st to 7th position makes the column of vibrating air LONGER, which lowers the pitch. Tightening the corners of your embouchure and using faster air speed makes your lips buzz at a higher frequency (Harmonic Series / Partials), jumping up to higher notes in the exact same slide position!", "keyPoints": ["Flat vs. Sharp on Trombone: If a note sounds slightly flat (too low), pull the slide slightly IN (closer to 1st) and support with faster warm air. If it sounds sharp (too high), push the slide slightly OUT."]}, {"level": 3, "name": "APPLY", "subtitle": "Troubleshoot Trombone Tone & Apply the 7 Elements of Design", "content": "Apply JS's and E. Catana's feedback to upgrade performance and artwork:", "workedExample": {"prompt": "Problem: When playing Concert F or G on the trombone, the sound comes out airy or cracks to the wrong partial. How do you fix it in 3 steps?", "steps": ["Step 1 (Posture & Diaphragm Check): Sit tall on the front half of your chair and take a deep 'yawn' breath from the diaphragm so the air stream is steady and pressurized.", "Step 2 (Embouchure Check): Firm the corners of your mouth ('Mmm'), keep your chin flat and pointed down, and do NOT puff your cheeks or press the mouthpiece too hard against your lips.", "Step 3 (Slide & Ear Check): Buzz the target pitch first or hear it in your head, align your slide precisely (1st position for F, 4th position—bell rim even with slide brace/end—for G), and start the note with a clean 'Tah' or 'Dah' tongue articulation."]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Analyze How Audience Behaviour Impacts Drama Performances & Classroom Learning", "content": "JS praised your ability to 'identify how audience behaviour impacts a performance.' Notice how this exact insight applies to both Drama AND every classroom at Longfields-Davidson Heights!", "comparisonTable": {"headers": ["Audience / Class Behaviour", "Impact on Performers / Speaker", "Impact on Group Atmosphere", "Connection to Self-Regulation Goal"], "rows": [["Active Eye Contact & Quiet Focus", "Builds performer confidence, sharpens timing, allows subtle vocal emotion", "Creates trust so peers take creative risks", "Staying focused during instruction helps the whole class learn faster"], ["Blurting Out / Side Conversations", "Breaks actor concentration ('breaks character'), drowns out quiet dialogue", "Creates anxiety and derails the scene's rhythm", "Raising your hand instead of blurting protects everyone's focus!"], ["Supportive Feedback & Applause", "Validates effort and encourages deeper creative exploration", "Strengthens community building (Zaid's Collaboration = G!)", "Using your strong encouragement skills to lift up peers"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Critique a Visual Art Composition Using Elements & Principles of Design", "content": "E. Catana encouraged you to 'continue to develop and explore creative ideas.' Use this Art Critique Checklist to expand a simple sketch into a complete artwork:", "keyPoints": ["Check 1 (Space & Depth): Did I leave empty white paper around one small drawing in the middle, OR did I develop a Foreground, Middle Ground, and Background?", "Check 2 (Value & Texture): Did I shade with a full range of Value (highlight, mid-tone, core shadow, cast shadow) and add visual Texture so 2D shapes look like 3D Forms?", "Check 3 (Colour & Contrast): Did I use Complementary Colours (e.g., Blue/Orange, Red/Green, Purple/Yellow) or Warm-vs-Cool contrast to make the focal point pop?"]}, {"level": 6, "name": "CREATE", "subtitle": "Synthesize Music, Drama & Visual Arts in a Creative Design Plan", "content": "Combine trombone acoustics, dramatic staging, and visual design elements into an original artistic concept.", "keyPoints": ["Demonstrates mastery across JS's and E. Catana's Grade 7 Arts expectations."]}], "questions": [{"id": "arts-q1", "bloomLevel": 5, "bloomTag": "APPLY & EVALUATE", "title": "Triple-Arts Mastery Lab: Trombone Pitch (JS), Audience Impact (JS) & Design Expansion (EC)", "prompt": "Answer all 3 Arts challenges in deep multi-step work based on your report card strengths and next steps:\n(a) MUSIC (JS): Explain how posture, diaphragmatic breathing, embouchure, and slide position work together on the trombone to play a clear, in-tune Concert F (1st position) followed by a Concert D (4th position).\n(b) DRAMA (JS): Explain two specific ways that audience behaviour impacts a live drama performance, and connect this to why raising your hand (instead of blurting out) matters during classroom discussions.\n(c) VISUAL ARTS (E. Catana): Imagine you have drawn a basic pencil outline of a basketball player or trombonist in the centre of a blank page. Explain how you would apply at least 4 Elements of Design (Space, Value, Colour, Line/Texture) to expand that simple sketch into a rich, creative composition.", "step1_deconstruct": {"instruction": "STOP & PLAN: Make sure you address all 3 Arts strands—(a) Trombone/Music, (b) Drama/Audience, and (c) Visual Arts/Elements of Design.", "guidingQuestions": ["Part (a): What 4 physical factors control trombone tone and pitch from F (1st) to D (4th)?", "Part (b): How does an audience affect actors' focus and confidence, and how does that mirror classroom self-regulation?", "Part (c): Which 4 of the 7 Elements of Design will I apply to transform a plain central outline into a full composition?"], "modelPlan": "(a) Detail posture, diaphragm breath, firm-corner embouchure, and slide shift from 1st to 4th position. (b) Analyze the actor-audience loop and connect it to classroom hand-raising. (c) Apply Space (foreground/background), Value (3D shading), Colour (warm/cool contrast), and Line/Texture."}, "step2_anchor": {"instruction": "ANCHOR TERMS: Trombone Technique + Drama Loop + 7 Elements of Design.", "referenceItems": ["Trombone: Diaphragmatic breathing, Embouchure (firm corners, flat chin, buzzing centre), Articulation ('Tah'), Slide Positions (1st = closed, 4th = just past the bell).", "7 Elements of Design: Line, Shape, Form, Space, Colour, Texture, Value."]}, "step3_substeps": [{"label": "Step 3a: Part (a) MUSIC — Explain the step-by-step technique to play a clear Concert F (1st pos.) to Concert D (4th pos.) on trombone", "placeholder": "1. Posture & Breathing: ...\n2. Embouchure: ...\n3. Slide Position & Air Adjustment from F (1st) to D (4th): ...", "hint": "Mention sitting tall, deep belly breathing, firm mouth corners ('Mmm'), and moving the slide smoothly from 1st to 4th position (just past the bell).", "modelSubAnswer": "1. Posture & Breathing: Sit tall on the front edge of the chair with shoulders relaxed and take a deep diaphragmatic breath so the air column is steady and supported.\n2. Embouchure: Form a balanced embouchure with a flat chin, firm corners ('Mmm'), and unpuffed cheeks so the centre of the lips vibrates cleanly inside the mouthpiece.\n3. Slide & Pitch Control: Start Concert F in 1st position (slide fully in) with a crisp 'Tah' tongue articulation and fast air. To play Concert D, smoothly move the slide out with two fingers and thumb to 4th position (slide brace aligned just past the rim of the bell) while relaxing the lip tension slightly for the lower partial."}, {"label": "Step 3b: Part (b) DRAMA — Explain 2 ways audience behaviour impacts performers AND connect it to classroom self-regulation", "placeholder": "In Drama, when the audience shows active listening vs. side talking, it affects the actors by... This connects to classroom discussions because...", "hint": "Think about actor concentration, vocal projection, and risk-taking vs. breaking focus when someone blurts out.", "modelSubAnswer": "In Drama, audience behaviour directly shapes the quality of a performance in two ways: (1) Focus & Timing—when the audience is quiet and attentive, actors can stay in character, hear their scene partners' cues, and deliver emotional moments without losing concentration; (2) Confidence & Risk-Taking—respectful eye contact and applause encourage performers to project their voices and commit fully to their roles. This connects directly to classroom self-regulation: when a student raises their hand instead of blurting out, it respects the teacher's and classmates' 'stage,' allowing everyone to think deeply without interruption."}, {"label": "Step 3c: Part (c) VISUAL ARTS — Expand a simple central outline sketch using 4 Elements of Design (Space, Value, Colour, Line/Texture)", "placeholder": "1. Space: ...\n2. Value & Form: ...\n3. Colour: ...\n4. Line & Texture: ...", "hint": "Turn the flat 2D Shape into a 3D Form with shading (Value), fill the background (Space), use warm/cool Contrast (Colour), and add motion lines/surface detail (Line & Texture)!", "modelSubAnswer": "To expand a basic outline into a rich creative artwork:\n1. Space (Foreground/Background): Add overlapping elements—place the rim of the basketball net or music stand in the foreground, the main figure in the middle ground, and a perspective gym court or concert stage in the background so negative space is activated.\n2. Value & Form: Apply gradual pencil or paint shading (highlights, mid-tones, core shadows, and cast shadows) to transform flat 2D shapes into 3D forms.\n3. Colour (Contrast): Use vibrant warm colours (reds, oranges, golds) on the main subject against cool background colours (deep blues and purples) to create strong focal emphasis.\n4. Line & Texture: Add expressive dynamic contour lines to show movement/sound waves and cross-hatching/stippling to capture the bumpy texture of a basketball or the metallic reflection of a brass trombone."}], "step4_checks": ["Music Check: Did I include posture, diaphragmatic breathing, embouchure, and slide positions (1st and 4th)?", "Drama Check: Did I explain 2 audience impacts AND connect them to raising my hand in class?", "Visual Arts Check: Did I explicitly name and apply at least 4 Elements of Design (Space, Value, Colour, Line/Texture)?"], "step5_modelAnswer": {"basicAnswer": "(a) Sit up straight, breathe deep, use good embouchure, move slide from 1st to 4th. (b) Good audiences help actors focus. (c) Add background, shading, colour, and texture.", "expandedAnswer": "Complete Grade 7+ Arts Portfolio Response (JS & E. Catana Standard):\n(a) Music (Trombone): Producing an accurate Concert F to Concert D requires sitting tall on the edge of the chair for full diaphragmatic breathing, forming a firm-cornered embouchure ('Mmm') without puffing cheeks, articulating cleanly with 'Tah' in 1st position for F, and smoothly extending the slide to 4th position (just past the bell) for D with steady air support.\n(b) Drama (Audience Impact): Audience behaviour controls both actor concentration and creative risk-taking. Disruptive noise breaks character and ruins comedic/dramatic timing, whereas attentive listening empowers performers to project and inhabit their roles. Similarly, practicing self-regulation by raising your hand in class protects the learning space for all peers.\n(c) Visual Arts (Expanding Creative Ideas): To expand a basic sketch, I would apply (1) Space by creating foreground, middle ground, and background depth; (2) Value to shade flat 2D shapes into 3D forms with highlights and cast shadows; (3) Colour by contrasting warm focal subjects against cool backgrounds; and (4) Line & Texture to convey physical movement and realistic surface detail.", "extensionPrompt": "Creative Bonus: Sketch or describe a poster combining your favourite things at school (Gym + Trombone + Science/Math) using at least 5 Elements of Design!"}}], "studyFirstTag": "Music, Drama & Art: Trombone Slide Map, Stage Focus & Design Elements", "lessons": [{"id": "arts-u1-l1", "title": "Lesson 1.1: Trombone Tone & Slide Physics, Drama Audience Loop & 7 Elements of Design", "readTime": "3 min read", "bigIdea": "Lock in steady breathing and firm embouchure on trombone (JS), respect the stage-audience loop in Drama, and expand art ideas with the 7 Elements of Design (EC).", "paragraphs": ["MUSIC (Trombone — JS): Your trombone is an acoustic air column! Pushing the slide out from 1st to 7th position lengthens the air tube and lowers the pitch. Meanwhile, sitting tall on the edge of your chair, taking a deep belly (diaphragmatic) breath, and forming a firm-cornered embouchure ('Mmm', flat chin, relaxed vibrating lip centre) lets you hit higher notes like Concert F (1st pos.) cleanly without cracking!", "DRAMA (JS): Live theatre runs on an Actor-Audience Feedback Loop. Attentive eye contact and quiet focus give performers the confidence to stay in character and nail their timing—whereas talking or blurting out breaks concentration. Notice how that same respect makes every classroom discussion stronger!", "VISUAL ARTS (E. Catana): To expand a basic pencil sketch into a standout Grade 7 artwork, layer the 7 Elements of Design: Line, Shape (2D), Form (3D), Space (foreground/middle ground/background), Colour (warm vs. cool contrast), Texture (surface feel), and Value (light-to-dark shading that makes flat shapes pop into 3D!)."], "keyTakeaway": "Trombone = Posture + Diaphragm Air + Firm Corners ('Mmm') + Exact Slide Position | Art Expansion = Fill Space + Shade Value + Contrast Colour!", "deepReadTitle": "🎺 Concert Bb Scale Slide Map (Quick Memorizer)", "deepReadText": "Bb (1st) → C (6th) → D (4th, just past the bell!) → Eb (3rd) → F (1st) → G (4th) → A (2nd) → High Bb (1st).", "quickCheck": {"question": "Which Element of Design uses light-to-dark shading (highlights and shadows) to make a flat 2D shape look like a 3D form?", "options": ["Line", "Value", "Outline"], "correctIdx": 1, "explanation": "Value (lightness and darkness shading) transforms flat 2D Shapes into realistic 3D Forms!"}, "videos": [{"id": "56RW-2f7W_c", "title": "Trombone Technique 101: Embouchure & Tone (Music)", "channel": "Practicing Musician", "why": "Directly supports JS's report card goal on trombone embouchure and clear pitch!"}, {"id": "dE8pUuSmnpc", "title": "The 7 Elements of Art Explained (Visual Arts)", "channel": "Miss Teresa Art", "why": "Supports E. Catana's Art goal: Line, Shape, Form, Space, Colour, Texture & Value."}]}]}, {"id": "arts-u2", "title": "Unit 2 (Music, Drama & Visual Arts): Bass Clef Trombone Reading, Stage Blocking & 1-Point Perspective", "studyFirstTag": "Read Bass Clef notes fast for trombone (JS), learn Drama blocking & draw 3D 1-Point Perspective (EC)!", "curriculumStrand": "Ontario Grade 7 The Arts: Music Literacy (C2), Drama Staging (B1) & Visual Arts Perspective (D1)", "svgDiagram": "trombone_arts_svg", "lessons": [{"id": "arts-u2-l1", "title": "Lesson 2.1: Reading Bass Clef Notes (Trombone), Drama Stage Directions & 1-Point Perspective Art", "readTime": "3 min read", "bigIdea": "Unlock fast sheet-music reading on trombone with two Bass Clef memory tricks, master Drama stage blocking, and make flat drawings jump into 3D with One-Point Perspective!", "paragraphs": ["MUSIC — READING BASS CLEF (JS): Trombone sheet music uses the BASS CLEF (the big curved symbol with two dots hugging the 4th line—that 4th line is always the note **F**!). Memorize the 5 LINES from bottom to top with **G-B-D-F-A** (*Good Burritos Don't Fall Apart*!) and the 4 SPACES from bottom to top with **A-C-E-G** (*All Cows Eat Grass*!). Also watch DYNAMICS (`p` = piano/soft, `mf` = medium-loud, `f` = forte/loud, `<` = crescendo/get louder) and Rhythm (Whole = 4 beats, Half = 2, Quarter = 1, Eighth = ½)!", "DRAMA — STAGE DIRECTIONS & IMPROV (JS): On a theatre stage, directions are ALWAYS from the **ACTOR'S** perspective facing the audience! **Downstage** means walking TOWARD the audience (historically stages tilted downhill toward seats!), **Upstage** means walking AWAY toward the back wall, and **Stage Left / Stage Right** are the actor's own left and right. In Improv games, follow the golden rule **'YES, AND...'**—accept your scene partner's idea and build on it!", "VISUAL ARTS — ONE-POINT PERSPECTIVE (E. Catana): Want to draw a realistic 3D hallway, basketball court, or city street? Draw a horizontal **Horizon Line** (eye level) and place ONE single dot on it called the **Vanishing Point (VP)**. Every line going back into the distance (hallway ceiling edges, floor tiles, gym sidelines) aims straight at that Vanishing Point with a ruler, while vertical lines stay strictly straight up and down—creating instant 3D Space & Depth!"], "keyTakeaway": "Bass Clef: Lines = G-B-D-F-A | Spaces = A-C-E-G | Drama: Downstage = Toward Audience, 'Yes, And...' | 1-Point Perspective: Horizon Line + 1 Vanishing Point!", "deepReadTitle": "🎨 The 7 Principles of Design (Leveling Up E. Catana's Art Goal!)", "deepReadText": "Combine the 7 Elements with the Principles of Design: Contrast (light vs. dark), Emphasis (making your focal point pop), Balance (symmetrical vs. asymmetrical), Movement (guiding the viewer's eye), Pattern, Rhythm, and Unity!", "videos": [{"id": "RY41TH_Xz-U", "title": "How To Read Bass Clef For Trombone", "channel": "Ted's List", "why": "Connects Bass Clef note reading directly to trombone slide positions."}, {"id": "WLJ7Z469pS8", "title": "Middle School Art: Basic One-Point Perspective Drawing", "channel": "generaleuphoria", "why": "Step-by-step ruler guide to Horizon Line, Vanishing Point, and 3D depth."}], "quickCheck": {"question": "On the Bass Clef staff for trombone, which note sits on the 4th line (between the two dots) and which note sits in the 2nd space (using All Cows Eat Grass)?", "options": ["4th Line = F | 2nd Space = C", "4th Line = A | 2nd Space = G", "4th Line = G | 2nd Space = E"], "correctIdx": 0, "explanation": "Lines bottom-to-top: G-B-D-F-A (4th line = F, played in 1st position!). Spaces bottom-to-top: A-C-E-G (2nd space = C, played in 6th position!)."}}], "bloomLadder": [{"level": 1, "name": "REMEMBER", "subtitle": "Bass Clef, Stage Directions & Perspective Terms", "content": "Unit 2 Triple-Arts anchors:", "keyPoints": ["Bass Clef: Lines G-B-D-F-A | Spaces A-C-E-G | Dynamics: p (soft), mf (med-loud), f (loud)", "Drama: Downstage (toward audience), Upstage (back), Improv Rule: 'Yes, And...'", "Visual Arts: Horizon Line (eye level) + Vanishing Point (all depth lines converge!)"]}, {"level": 2, "name": "UNDERSTAND", "subtitle": "Why 'Yes, And...' in Drama Mirrors Zaid's Strong Group Collaboration", "content": "Blocking a partner's idea kills a scene—accepting and adding detail makes it soar!", "analogy": "🏀 Give-and-Go Analogy: In basketball, if a teammate passes to you and you drop the ball and say 'No,' the play dies. Saying 'Yes, And...' in Drama is catching the pass and driving to the hoop—building directly on your 'Collaboration: G' report card strength!", "keyPoints": ["Accept the idea ('Yes') + Add a new specific detail ('And...')."]}, {"level": 3, "name": "APPLY", "subtitle": "Match Bass Clef Notes Straight to Trombone Slide Positions", "content": "Sight-read faster in JS's band class:", "workedExample": {"prompt": "Read and map slide positions for: 2nd Line (B-flat), 3rd Line (D), 4th Line (F), 2nd Space (C).", "steps": ["• 2nd Line (Bb): 1st position (closed).", "• 2nd Space (C): 6th position (long reach!).", "• 3rd Line (D): 4th position (just past the bell!).", "• 4th Line (F): 1st position (faster air & firm corners!)."]}}, {"level": 4, "name": "ANALYZE", "subtitle": "Compare 1-Point Perspective Lines by Direction", "content": "Never get confused which ruler lines point to the Vanishing Point!", "comparisonTable": {"headers": ["Line Type in 1-Point Perspective", "Direction", "Example in a School Hallway Drawing"], "rows": [["Vertical Lines", "Strictly 90° straight UP/DOWN (parallel to page sides)", "Locker edges, doorway frames, gym pillars"], ["Horizontal Lines", "Strictly flat LEFT/RIGHT (parallel to Horizon Line)", "Top & bottom of facing wall, far doorway lintel"], ["Orthogonal (Depth) Lines", "Diagonal lines aiming straight at the Vanishing Point!", "Ceiling corners, hallway floor edges, locker tops receding back"]]}}, {"level": 5, "name": "EVALUATE", "subtitle": "Spot Common Music, Drama & Perspective Mistakes", "content": "Quick critique audit:", "keyPoints": ["Music: Mixing up Treble Clef (EGBDF) with Bass Clef (GBDFA)!", "Drama: Turning your full back to the audience ('closing off') so your voice gets muffled!", "Art: Drawing depth lines crooked instead of aiming every receding line straight at the Vanishing Point with a ruler!"]}, {"level": 6, "name": "CREATE", "subtitle": "Design a 1-Point Perspective Drawing of the School Gym or Concert Stage", "content": "Apply Horizon Line, Vanishing Point, Emphasis, and Contrast to create realistic 3D art.", "keyPoints": ["Complete Grade 7 Arts Portfolio Mastery!"]}], "questions": [{"id": "arts-u2-q1", "bloomLevel": 5, "bloomTag": "APPLY & CREATE", "title": "Triple-Arts Level-Up: Bass Clef Sight-Reading, Improv Blocking & 1-Point Perspective", "prompt": "Complete all 3 Arts mastery challenges:\n(a) MUSIC (Bass Clef & Dynamics — JS): Name the Bass Clef note AND trombone slide position for (1) 2nd line (Bb in key signature), (2) 3rd line, (3) 4th line, and (4) 2nd space. Then explain how you change your air speed to play a crescendo from `p` (piano) to `f` (forte) without losing pitch!\n(b) DRAMA (Blocking & Improv — JS): Explain the difference between walking Downstage vs. Upstage, and write a 2-line 'Yes, And...' response if your improv partner says: « Oh no, the gym floor just turned into giant trampolines! »\n(c) VISUAL ARTS (1-Point Perspective — EC): Explain step-by-step how to draw the Longfields-Davidson Heights school hallway or gymnasium in One-Point Perspective using a Horizon Line, Vanishing Point, vertical lines, and orthogonal (depth) lines, plus 1 Principle of Design (like Emphasis or Contrast) to make it stand out.", "step1_deconstruct": {"instruction": "Check all 3 strands: 4 Bass Clef notes + crescendo air control in (a), Downstage/Upstage + 'Yes, And...' in (b), and 1-Point Perspective steps + 1 Principle of Design in (c).", "guidingQuestions": ["Lines = G-B-D-F-A; Spaces = A-C-E-G!", "Does Downstage move TOWARD or AWAY from the audience?", "Which lines aim at the Vanishing Point vs. stay strictly vertical?"], "modelPlan": "(a) 2nd line=Bb(1st), 3rd line=D(4th), 4th line=F(1st), 2nd space=C(6th); crescendo uses wider warm airflow without pinching lips. (b) Downstage=toward audience, Upstage=back; accept trampoline idea + add funny conflict/detail. (c) Horizon Line -> 1 VP -> vertical locker/door lines -> diagonal depth lines to VP -> add Contrast/Emphasis."}, "step2_anchor": {"instruction": "Unit 2 Arts Cheat Sheet:", "referenceItems": ["Bass Clef Lines: G-B-D-F-A | Spaces: A-C-E-G | Slide Positions: Bb(1), C(6), D(4), F(1)", "Downstage = toward audience | Upstage = away from audience | Improv = 'Yes, And...'", "1-Point Perspective: Horizon Line + 1 Vanishing Point + Verticals + Orthogonals to VP"]}, "step3_substeps": [{"label": "Step 3a: Part (a) MUSIC — Identify all 4 Bass Clef notes + slide positions AND explain how to play a clean `p → f` crescendo", "placeholder": "1. 2nd line = Bb (1st pos.) | 2. 3rd line = ... | 3. 4th line = ... | 4. 2nd space = ...\nCrescendo air control: ...", "hint": "G-B-D-F-A for lines, A-C-E-G for spaces! Use wider, fuller warm diaphragmatic air for `f` without pushing the mouthpiece harder!", "modelSubAnswer": "• Notes & Slides: (1) 2nd line = Bb (1st position), (2) 3rd line = D (4th position), (3) 4th line = F (1st position), (4) 2nd space = C (6th position).\n• Crescendo (`p → f`): Start with steady gentle air at piano (`p`), then gradually open the oral cavity and send a fuller, faster stream of warm diaphragmatic air to reach forte (`f`) while keeping firm embouchure corners so the pitch stays in tune and never goes sharp or brassy."}, {"label": "Step 3b: Part (b) DRAMA — Define Downstage vs. Upstage AND write a creative 'Yes, And...' improv line", "placeholder": "Downstage means... Upstage means...\nMy 'Yes, And...' line: \"Yes! And...\"", "hint": "Accept the trampoline gym floor AND add a fun new obstacle or goal!", "modelSubAnswer": "• Blocking: Downstage means moving TOWARD the audience (front of stage), while Upstage means moving AWAY toward the back wall.\n• 'Yes, And...' Improv Line: \"Yes! And Coach just blew the whistle for the championship free-throw—if I jump too high, I'm going to bonk my head on the scoreboard!\""}, {"label": "Step 3c: Part (c) VISUAL ARTS — Describe step-by-step how to draw a hallway/gym in 1-Point Perspective + 1 Principle of Design", "placeholder": "1. Draw the Horizon Line and Vanishing Point...\n2. Draw orthogonal depth lines...\n3. Principle of Design: ...", "hint": "Mention Horizon Line, Vanishing Point, vertical lines for lockers/doors, diagonal lines converging to the VP, and Emphasis or Contrast!", "modelSubAnswer": "1. Horizon & Vanishing Point: Use a ruler to draw a light horizontal Horizon Line at eye level and mark ONE Vanishing Point (VP) in the centre.\n2. Depth (Orthogonal) Lines: Draw straight diagonal lines from the 4 corners of the paper and locker tops/bottoms aimed directly into the VP to create 3D hallway depth.\n3. Verticals & Horizontals: Keep all locker doors, walls, and pillars strictly 90° vertical, shrinking them closer together as they get nearer the VP.\n4. Principle of Design (Emphasis & Contrast): Use bright warm colours and bold light-vs-dark shading on an open sunlit gym doorway right at the Vanishing Point to draw the viewer's eye straight into the scene!"}], "step4_checks": ["Did I map all 4 Bass Clef notes AND their trombone slide positions (Bb=1, D=4, F=1, C=6) in Part (a)?", "Did I define Downstage/Upstage correctly (from the actor's view) AND build on the partner's prompt in Part (b)?", "Did I include Horizon Line, Vanishing Point, orthogonal depth lines, verticals, AND a Principle of Design in Part (c)?"], "step5_modelAnswer": {"basicAnswer": "(a) Bb(1), D(4), F(1), C(6); use more warm air for louder sound. (b) Downstage = front, Upstage = back; Yes, and we can dunk from half court! (c) Use horizon line, vanishing point, ruler lines, and contrast.", "expandedAnswer": "Complete Grade 7+ Triple-Arts Exemplar:\n(a) Music: 2nd line = Bb (1st pos.), 3rd line = D (4th pos.), 4th line = F (1st pos.), 2nd space = C (6th pos.). To crescendo from `p` to `f`, steadily increase warm diaphragmatic airflow while keeping embouchure corners firm and jaw relaxed so tone stays resonant and in tune.\n(b) Drama: Downstage moves toward the audience while Upstage moves toward the back wall. 'Yes, And...' example: \"Yes! And now our whole basketball team is bouncing ten feet high—quick, toss me an alley-oop before the ceiling steals the ball!\"\n(c) Visual Arts: Establish a horizontal eye-level Horizon Line and 1 central Vanishing Point (VP); aim all receding floor, ceiling, and locker edges straight at the VP (orthogonals) while keeping pillars and doorways strictly vertical and spacing them tighter as they recede. Apply Contrast and Emphasis with glowing light at the focal doorway.", "extensionPrompt": "Practice Tip: Try sight-reading 4 bars of Bass Clef notes before your next music class with JS—name each note aloud before sliding to it!"}}]}], "friendlySub": "Complete Grade 7 Arts: Trombone Bass Clef, Drama Improv/Blocking & 1-Point Perspective", "accent": "#9333ea"}];

old\" text-anchor=\"middle\">x  |  y = 3x + 5</text>\n      <text x=\"303\" y=\"106\" fill=\"#e2e8f0\" font-size=\"12\" text-anchor=\"middle\">0  |  5 (Start)</text>\n      <text x=\"303\" y=\"126\" fill=\"#e2e8f0\" font-size=\"12\" text-anchor=\"middle\">1  |  8  (+3)</text>\n      <text x=\"303\" y=\"146\" fill=\"#e2e8f0\" font-size=\"12\" text-anchor=\"middle\">2  |  11 (+3)</text>\n      <text x=\"303\" y=\"166\" fill=\"#e2e8f0\" font-size=\"12\" text-anchor=\"middle\">3  |  14 (+3)</text>\n\n      <!-- Right: Coding Loop + Simple Interest -->\n      <rect x=\"410\" y=\"18\" width=\"372\" height=\"189\" rx=\"12\" fill=\"#1e293b\" stroke=\"#10b981\" stroke-width=\"2\"/>\n      <text x=\"596\" y=\"43\" fill=\"#34d399\" font-size=\"14\" font-weight=\"bold\" text-anchor=\"middle\">Ontario 2020 Coding &amp; Financial Literacy</text>\n      <rect x=\"428\" y=\"56\" width=\"336\" height=\"66\" rx=\"8\" fill=\"#0f172a\"/>\n      <text x=\"440\" y=\"75\" fill=\"#93c5fd\" font-size=\"12\" font-family=\"monospace\">for x in range(0, 4):  # Runs x = 0,1,2,3</text>\n      <text x=\"440\" y=\"95\" fill=\"#6ee7b7\" font-size=\"12\" font-family=\"monospace\">    y = 3 * x + 5      # Outputs: 5, 8, 11, 14</text>\n      <text x=\"440\" y=\"114\" fill=\"#fde047\" font-size=\"11.5\" font-family=\"monospace\">    print(x, y)</text>\n      <rect x=\"428\" y=\"132\" width=\"336\" height=\"62\" rx=\"8\" fill=\"#0f172a\"/>\n      <text x=\"596\" y=\"154\" fill=\"#fbbf24\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\">💰 Simple Interest: I = P × r × t</text>\n      <text x=\"596\" y=\"176\" fill=\"#e2e8f0\" font-size=\"11.5\" text-anchor=\"middle\">P = Principal ($) • r = Rate as DECIMAL (5% = 0.05) • t = Years</text>\n    </svg>\n    ", "sci_heating_curve_svg": "\n    <svg viewBox=\"0 0 800 245\" class=\"topic-svg\" role=\"img\" aria-label=\"Heating Curve of Water Showing 0C Melting and 100C Boiling Plateaus\">\n      <rect x=\"0\" y=\"0\" width=\"800\" height=\"245\" rx=\     function recordDailyActivity() {
      const today = new Date().toISOString().slice(0, 10);
      if (saved.streak.lastDate === today) return;
      const yest = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
      saved.streak.days = (saved.streak.lastDate === yest) ? (saved.streak.days + 1) : 1;
      saved.streak.lastDate = today;

    // Focus Timer
    let timerSec = 15 * 60;
    let timerId = null;

    function formatTime() {
      const m = String(Math.floor(timerSec / 60)).padStart(2, '0');
      const s = String(timerSec % 60).padStart(2, '0');
      return `${m}:${s}`;
    }
    function toggleTimer() {
      if (timerId) {
        clearInterval(timerId); timerId = null;
      } else {
        timerId = setInterval(() => {
          if (timerSec > 0) {
            timerSec--;
            const el = document.getElementById('modalTimerDigits');
            if (el) el.textContent = formatTime();
          } else {
            clearInterval(timerId); timerId = null;
            saved.drillStats.sprintsDone = (saved.drillStats.sprintsDone || 0) + 1;
            saveState();
          }
        }, 1000);
      }
      openToolsModal();
    }
    function resetTimer() {
      if (timerId) clearInterval(timerId);
      timerId = null;
      timerSec = 15 * 60;
      openToolsModal();
    }

    function saveState() { recordDailyActivity(); localStorage.setItem('zaid_grade7_v5', JSON.stringify(saved)); }
    function fmtText(str) {
      return String(str || '')
        .replace(/`([^`]+)`/g, '<code class="inline-code">$1</code>')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/(^|[\s(\[?'"])\*([^\s*][^*]*?[^\s*]|[^\s*])\*(?=[\s.,;:!?\)?'"]|$)/g, '$1<em>$2</em>');
    }
    function escapeHtml(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    
    let isSpeakingLesson = false;
    function stopSpeech() {
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      isSpeakingLesson = false;
      const btn = document.getElementById('listenLessonBtn');
      if (btn) btn.textContent = '🔊 Listen';
    }
    function speakLessonAloud(courseId, uIdx, lIdx) {
      if (!('speechSynthesis' in window)) return;
      if (isSpeakingLesson) {
        stopSpeech();
        return;
      }
      const c = COURSES.find(x => x.id === courseId) || COURSES[app.courseIdx];
      const l = c.units[uIdx].lessons[lIdx];
      const fullText = `${l.title}. Big idea: ${l.bigIdea}. ${l.paragraphs.join(' ')} Remember this: ${l.keyTakeaway}`.replace(/[`*]/g, '');
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(fullText);
      u.lang = 'en-CA';
      u.rate = 0.96;
      isSpeakingLesson = true;
      const btn = document.getElementById('listenLessonBtn');
      if (btn) btn.textContent = '⏹ Stop Audio';
      u.onend = () => { stopSpeech(); };
      u.onerror = () => { stopSpeech(); };
      window.speechSynthesis.speak(u);
    }

    // Feature #2: Live Detail & Weak-Word Upgrade Meter (E. Catana & O. Macri)
    const WEAK_WORDS = {
      'fun': 'energizing / engaging',
      'good': 'beneficial / effective',
      'nice': 'supportive / impressive',
      'bad': 'harmful / challenging',
      'stuff': 'equipment / materials',
      'things': 'elements / factors',
      'very': '(use a stronger verb/adjective!)',
      'really': '(use a sharper detail!)'
    };

    function analyzeStudentText(text, courseId) {
      const cleaned = (text || '').trim();
      const words = cleaned ? cleaned.split(/\s+/).filter(Boolean) : [];
      const count = words.length;
      const target = (courseId === 'math') ? 10 : (courseId === 'french' ? 12 : 25);
      const foundWeak = [];
      if (['english', 'geo', 'history', 'science', 'pe', 'arts'].includes(courseId)) {
        const lower = ' ' + cleaned.toLowerCase().replace(/[^a-z\s]/g, ' ') + ' ';
        Object.keys(WEAK_WORDS).forEach(w => {
          if (lower.includes(' ' + w + ' ')) foundWeak.push(`"${w}" → ${WEAK_WORDS[w]}`);
        });
      }
      return { count, target, met: count >= target, foundWeak };
    }

    function updateLiveMeter(courseId, val) {
      const el = document.getElementById('liveDetailMeter');
      if (!el) return;
      const info = analyzeStudentText(val, courseId);
      const statusHtml = info.met
        ? `<span class="meter-good">✅ Great detail! (${info.count} words)</span>`
        : `<span>✍️ Detail Meter: <strong>${info.count}</strong> / ${info.target}+ words target</span>`;
      const weakHtml = info.foundWeak.length
        ? `<span class="meter-warn">✨ Upgrade tip: ${escapeHtml(info.foundWeak.slice(0, 2).join(' | '))}</span>`
        : `<span style="color:var(--text-muted);">Tip: Show all steps &amp; specifics!</span>`;
      el.innerHTML = statusHtml + weakHtml;
    }

    // Feature #3: Infinite Randomized Math Careless-Error & French Drill Engine
    let drill = { mode: 'math', q: null, userAns: '', feedback: null };

    function genMathDrill() {
      const types = ['bedmas_neg', 'sqrt_trap', 'circle_diam', 'simple_int', 'integer_sub'];
      const t = types[Math.floor(Math.random() * types.length)];
      if (t === 'bedmas_neg') {
        const a = -(Math.floor(Math.random() * 5) + 2); // -2..-6
        const b = Math.floor(Math.random() * 4) + 2;    // 2..5
        const c = Math.floor(Math.random() * 5) + 2;    // 2..6
        const ans = (a * a) - (b * c);
        const signTrap = -(a * a) - (b * c);
        return {
          topic: 'BEDMAS + Negative Exponent',
          prompt: `Evaluate:  (${a})² − ${b} × ${c}`,
          answer: String(ans),
          trapAnswer: String(signTrap),
          trapMsg: `Careless Sign Trap! (${a})² with brackets equals (${a})×(${a}) = +${a*a}, NOT −${a*a}!`,
          steps: `Step 1: (${a})² = +${a*a}. Step 2: ${b} × ${c} = ${b*c}. Step 3: ${a*a} − ${b*c} = ${ans}.`
        };
      } else if (t === 'sqrt_trap') {
        const roots = [4, 6, 7, 8, 9, 10, 11, 12];
        const r = roots[Math.floor(Math.random() * roots.length)];
        const sq = r * r;
        const add = Math.floor(Math.random() * 9) + 2;
        return {
          topic: 'Square Roots (No ÷2 Trap!)',
          prompt: `Evaluate:  √${sq} + ${add}`,
          answer: String(r + add),
          trapAnswer: String((sq / 2) + add),
          trapMsg: `Careless Root Trap! You divided ${sq} by 2 instead of asking what times itself equals ${sq} (${r} × ${r} = ${sq})!`,
          steps: `Step 1: √${sq} = ${r}. Step 2: ${r} + ${add} = ${r + add}.`
        };
      } else if (t === 'circle_diam') {
        const r = Math.floor(Math.random() * 5) + 2; // 2..6
        const d = r * 2;
        const area = +(3.14 * r * r).toFixed(2);
        const diamTrap = +(3.14 * d * d).toFixed(2);
        return {
          topic: 'Circle Area (Diameter → Radius Trap!)',
          prompt: `A circle has DIAMETER = ${d} cm. Find its Area using π = 3.14 (numbers only):`,
          answer: String(area),
          trapAnswer: String(diamTrap),
          trapMsg: `Diameter Trap! You plugged diameter d = ${d} into πr² instead of dividing by 2 first to get radius r = ${r}!`,
          steps: `Step 1: r = ${d} ÷ 2 = ${r} cm. Step 2: A = 3.14 × ${r}² = 3.14 × ${r*r} = ${area} cm².`
        };
      } else if (t === 'simple_int') {
        const P = (Math.floor(Math.random() * 5) + 2) * 100; // 200..600
        const rPct = [4, 5, 6, 8][Math.floor(Math.random() * 4)];
        const yrs = [2, 3, 4][Math.floor(Math.random() * 3)];
        const I = +(P * (rPct / 100) * yrs).toFixed(2);
        return {
          topic: 'Simple Interest (I = P × r × t)',
          prompt: `Find the Simple Interest ($) earned on P = $${P} at ${rPct}% per year for ${yrs} years:`,
          answer: String(I),
          trapAnswer: String(I * 10),
          trapMsg: `Decimal Rate Trap! ${rPct}% = 0.0${rPct}, NOT 0.${rPct}!`,
          steps: `I = ${P} × 0.0${rPct} × ${yrs} = $${I}.`
        };
      } else {
        const a = -(Math.floor(Math.random() * 9) + 2);
        const b = -(Math.floor(Math.random() * 8) + 2);
        const ans = a - b;
        return {
          topic: 'Subtracting a Negative Integer',
          prompt: `Evaluate:  (${a}) − (${b})`,
          answer: String(ans),
          trapAnswer: String(a + b),
          trapMsg: `Integer Sign Trap! Subtracting a negative (${b}) is the same as ADDING +${Math.abs(b)}: ${a} + ${Math.abs(b)} = ${ans}!`,
          steps: `Add the opposite: (${a}) − (${b}) = ${a} + ${Math.abs(b)} = ${ans}.`
        };
      }
    }

    function startDrill(mode) {
      drill.mode = mode;
      drill.feedback = null;
      drill.userAns = '';
      drill.q = (mode === 'math')
        ? genMathDrill()
        : FRENCH_DRILL_BANK[Math.floor(Math.random() * FRENCH_DRILL_BANK.length)];
      openToolsModal('drills');
    }

    function checkMathDrill() {
      const inp = document.getElementById('mathDrillInput');
      if (!inp || !inp.value.trim()) return;
      const val = inp.value.trim().replace(/[$,\s]/g, '');
      const numVal = parseFloat(val);
      const target = parseFloat(drill.q.answer);
      drill.userAns = val;
      if (!isNaN(numVal) && Math.abs(numVal - target) < 0.02) {
        saved.drillStats.mathCorrect = (saved.drillStats.mathCorrect || 0) + 1;
        saveState();
        drill.feedback = { ok: true, msg: `🎉 Spot on! ${drill.q.steps}` };
      } else if (drill.q.trapAnswer && !isNaN(numVal) && Math.abs(numVal - parseFloat(drill.q.trapAnswer)) < 0.02) {
        drill.feedback = { ok: false, msg: `🛡️ ${drill.q.trapMsg} (${drill.q.steps})` };
      } else {
        drill.feedback = { ok: false, msg: `💡 Not quite (Answer: ${drill.q.answer}). ${drill.q.steps}` };
      }
      openToolsModal('drills');
    }

    function checkFrenchDrill(idx) {
      if (drill.feedback) return;
      const ok = idx === drill.q.ans;
      if (ok) {
        saved.drillStats.frenchCorrect = (saved.drillStats.frenchCorrect || 0) + 1;
        saveState();
      }
      speakFrench(drill.q.speak);
      drill.feedback = { ok, chosen: idx, msg: (ok ? '🎉 Très bien! ' : '💡 Careful: ') + drill.q.why };
      openToolsModal('drills');
    }

      const blob = new Blob([payload], { type: 'application/json' });

    function handleBackupFile(ev) {
      const file = ev.target.files && ev.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          if (parsed && parsed.data) {
            saved = Object.assign({ lessonsRead:{}, qcAnswers:{}, inputs:{}, checks:{}, qaDone:{}, weakSpots:{}, feedbackNotes:[], streak:{days:0,lastDate:''}, drillStats:{mathCorrect:0,frenchCorrect:0,sprintsDone:0} }, parsed.data);
            saveState();
            if (parsed.theme === 'dark') document.body.classList.add('dark');
            else document.body.classList.remove('dark');
            alert('✅ Progress backup restored successfully!');
            closeModal();
            render();
          } else {
            alert('Invalid backup file format.');
          }
        } catch (err) {
          alert('Could not read backup file: ' + err.message);
        }
      };
      reader.readAsText(file);
    }

    // Feature #6: 10-Question Unit Mini-Test Simulator + Retest Missed Loop
    let miniTest = { active: false, subjectId: 'all', items: [], idx: 0, answers: [], missed: [], finished: false };

    function startMiniTest(subId, onlyMissedItems = null) {
      const pool = onlyMissedItems || getReviewDeck(subId).sort(() => Math.random() - 0.5).slice(0, 10);
      miniTest = { active: true, subjectId: subId, items: pool, idx: 0, answers: [], missed: [], finished: false };
      quizState.mode = 'test';
      openToolsModal('quiz');
    }

    function submitMiniTestChoice(choiceIdx) {
      const item = miniTest.items[miniTest.idx];
      if (!item || miniTest.answers[miniTest.idx] !== undefined) return;
      miniTest.answers[miniTest.idx] = choiceIdx;
      if (choiceIdx !== item.qc.correctIdx) {
        miniTest.missed.push(item);
        const key = `${item.courseName}: ${item.title} (Mini-Test)`;
        saved.weakSpots[key] = (saved.weakSpots[key] || 0) + 1;
        saveState();
      }
      openToolsModal('quiz');
    }

    function advanceMiniTest() {
      if (miniTest.idx + 1 < miniTest.items.length) {
        miniTest.idx++;
      } else {
        miniTest.finished = true;
      }
      openToolsModal('quiz');
    }

    // Phase 6: Interactive Quiz & Flashcard Simulator (Targets O. Macri quiz review & D. Forbes mastery!)
    let quizState = { subjectId: 'all', mode: 'flash', idx: 0, flipped: false, score: 0, answered: null };

    function getReviewDeck(subjectId) {
      const deck = [];
      COURSES.forEach(c => {
        if (subjectId !== 'all' && c.id !== subjectId) return;
        c.units.forEach(u => {
          (u.lessons || []).forEach(l => {
            if (l.quickCheck) {
              deck.push({
                courseName: c.name,
                icon: c.icon,
                title: l.title,
                front: l.bigIdea,
                back: l.keyTakeaway,
                qc: l.quickCheck,
                lessonId: l.id
              });
            }
          });
        });
      });
      return deck;
    }

${escapeHtml(n.text)}</div>

    function loadYouTube(slotId, vidId, title) {
      const el = document.getElementById(slotId);
      if (!el) return;
      el.innerHTML = `
        <div class="yt-iframe-wrap">
          <iframe
            src="https://www.youtube-nocookie.com/embed/${vidId}?autoplay=1&rel=0"
            title="${escapeHtml(title)}"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen
          ></iframe>
        </div>
      `;
    }

    function courseProgress(course) {
      let total = 0, done = 0;
      course.units.forEach(u => {
        (u.lessons || []).forEach(l => { total++; if (saved.lessonsRead[l.id]) done++; });
        (u.questions || []).forEach(q => {
          total++;
          if (saved.qaDone[q.id] || q.step4_checks.every((_, i) => !!saved.checks[`${q.id}_chk_${i}`])) done++;
        });
      });
      return { total, done, pct: total ? Math.round((done / total) * 100) : 0 };
    }

    function getNextTask() {
      for (let cIdx = 0; cIdx < COURSES.length; cIdx++) {
        const c = COURSES[cIdx];
        for (let uIdx = 0; uIdx < c.units.length; uIdx++) {
          const u = c.units[uIdx];
          for (let lIdx = 0; lIdx < (u.lessons || []).length; lIdx++) {
            if (!saved.lessonsRead[u.lessons[lIdx].id]) {
              return { type: 'lesson', cIdx, uIdx, lIdx, course: c, item: u.lessons[lIdx] };
            }
          }
          for (let qIdx = 0; qIdx < (u.questions || []).length; qIdx++) {
            const q = u.questions[qIdx];
            if (!saved.qaDone[q.id] && !q.step4_checks.every((_, i) => !!saved.checks[`${q.id}_chk_${i}`])) {
              return { type: 'question', cIdx, uIdx, qIdx, course: c, item: q };
            }
          }
        }
      }
      return { type: 'lesson', cIdx: 0, uIdx: 0, lIdx: 0, course: COURSES[0], item: COURSES[0].units[0].lessons[0] };
    }

    /* ============================================================
       SCREEN 1: CLEAN HOME HUB
       ============================================================ */
    function renderHome() {
      const next = getNextTask();
      let done = 0, total = 0;
      COURSES.forEach(c => { const p = courseProgress(c); done += p.done; total += p.total; });

      const makeCard = (c, idx) => {
        const p = courseProgress(c);
        const cls = c.tierClass === 'tier-urgent' ? 'pill-urgent' : (c.tierClass === 'tier-strong' ? 'pill-core' : 'pill-extra');
        const lbl = c.tierClass === 'tier-urgent' ? 'Study First' : (c.tierClass === 'tier-strong' ? 'Core' : 'Term 2 / Goal');
        return `
          <button class="subject-card anim-card" onclick="openCourse(${idx})">
            <div class="subject-top">
              <div class="emoji-box">${c.icon}</div>
              <span class="pill-tag ${cls}">${lbl}</span>
            </div>
            <div>
              <h3>${c.name}</h3>
              <p>${c.friendlySub}</p>
            </div>
            <div>
              <div style="display:flex; justify-content:space-between; font-size:0.78rem; color:var(--text-muted); font-weight:600;">
                <span>${c.units.length} ${c.units.length === 1 ? 'Unit' : 'Units'}</span>
                <span>${p.done}/${p.total} done</span>
              </div>
              <div class="prog-track"><div class="prog-fill" style="width:${p.pct}%;"></div></div>
            </div>
          </button>
        `;
      };

      const priority = COURSES.map((c, i) => ({ c, i })).filter(x => x.c.tierClass === 'tier-urgent');
      const core = COURSES.map((c, i) => ({ c, i })).filter(x => ['math', 'english', 'science'].includes(x.c.id));
      const extra = COURSES.map((c, i) => ({ c, i })).filter(x => ['history', 'pe', 'arts'].includes(x.c.id));

      const startFn = next.type === 'lesson'
        ? `openLesson(${next.cIdx}, ${next.uIdx}, ${next.lIdx}, 'read')`
        : `openQuestion(${next.cIdx}, ${next.uIdx}, ${next.qIdx}, 1)`;

      return `
        <div class="wrap-home">
          <section class="hero anim-card">
            <div>
              ${(saved.streak && saved.streak.days > 0) ? `<span class="streak-chip">🔥 ${saved.streak.days}-Day Study Streak</span>` : ''}
              <h1>Hi Zaid! Ready for your next card?</h1>
              <p>Next up in <strong>${next.course.icon} ${next.course.name}</strong>: ${next.item.title}</p>
              <button class="hero-btn" onclick="${startFn}">
                ${next.type === 'lesson' ? '📖 Open Lesson Card →' : '✏️ Open Practice Card →'}
              </button>
            </div>
            <div class="hero-ring">
              <div class="hero-ring-num">${done} / ${total}</div>
              <div class="hero-ring-sub">Cards Completed</div>
            </div>
          </section>

          <div class="group-label">
            <span>🔥 Study First</span>
            <span class="sub">Tap a subject card to open its lessons</span>
          </div>
          <div class="grid-2">${priority.map(x => makeCard(x.c, x.i)).join('')}</div>

          <div class="group-label">
            <span>📘 Core Subjects</span>
          </div>
          <div class="grid-3">${core.map(x => makeCard(x.c, x.i)).join('')}</div>

          <div style="margin-top:26px;">
            <button class="btn" onclick="app.showMoreSubjects=!app.showMoreSubjects; render();">
              ${app.showMoreSubjects ? '▾ Hide History, Gym & The Arts' : '▸ More Subjects (History, Gym Goal & The Arts)'}
            </button>
          </div>
          ${app.showMoreSubjects ? `<div class="grid-3" style="margin-top:14px;">${extra.map(x => makeCard(x.c, x.i)).join('')}</div>` : ''}
        </div>
      `;

    /* ============================================================
       SCREEN 3A: FOCUSED LESSON DECK (1 CARD AT A TIME: READ | WATCH | CHECK)
       ============================================================ */
    function answerQC(lessonId, idx, correctIdx) {
      saved.qcAnswers[lessonId] = idx;
      if (idx === correctIdx) {
        saved.lessonsRead[lessonId] = true;
      } else {
        const c = COURSES[app.courseIdx];
        const l = c.units[app.unitIdx].lessons[app.lessonIdx];
        const key = `${c.name}: ${l.title}`;
        saved.weakSpots[key] = (saved.weakSpots[key] || 0) + 1;
      }
      saveState();
      render();
    }

    function finishLesson(lessonId) {
      saved.lessonsRead[lessonId] = true;
      saveState();
      const u = COURSES[app.courseIdx].units[app.unitIdx];
      if (app.lessonIdx + 1 < u.lessons.length) {
        openLesson(app.courseIdx, app.unitIdx, app.lessonIdx + 1, 'read');
      } else {
        openQuestion(app.courseIdx, app.unitIdx, 0, 1);
      }
    }

    function renderLesson() {
      const c = COURSES[app.courseIdx];
      const u = c.units[app.unitIdx];
      const l = u.lessons[app.lessonIdx];
      const hasVideos = l.videos && l.videos.length > 0;
      const qc = l.quickCheck;
      const chosen = saved.qcAnswers[l.id];
      const answered = chosen !== undefined && chosen !== null;
      const isCorrect = answered && chosen === qc.correctIdx;
      const hasNextLesson = app.lessonIdx + 1 < u.lessons.length;

      let cardHtml = '';

      if (app.lessonTab === 'read') {
        // FOCUS CARD 1: PURE READING — Zero clutter!
        cardHtml = `
          <article class="focus-card anim-card">
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:8px;">
              <span class="card-kicker" style="margin:0;">📖 Focus Mode: Read • ${l.readTime}</span>
              <button class="btn btn-soft" id="listenLessonBtn" style="padding:5px 12px; font-size:0.82rem;" onclick="speakLessonAloud('${c.id}', ${app.unitIdx}, ${app.lessonIdx})">🔊 Listen</button>
            </div>
            <h1 class="card-heading">${l.title}</h1>
            <div class="big-idea">💡 ${fmtText(l.bigIdea)}</div>
            <div class="prose">${l.paragraphs.map(p => `<p>${fmtText(p)}</p>`).join('')}</div>
            <div class="takeaway">⭐ <strong>Key Takeaway:</strong> ${fmtText(l.keyTakeaway)}</div>

            <!-- Optional Bonus Cards (Pop up cleanly only if Zaid taps them!) -->
            <div class="bonus-strip">
              ${l.deepReadText ? `<button class="btn btn-soft" onclick="openExtraNotesCard(COURSES[${app.courseIdx}], COURSES[${app.courseIdx}].units[${app.unitIdx}].lessons[${app.lessonIdx}])">📝 Open Cheat Sheet</button>` : ''}
              ${DIAGRAMS[u.svgDiagram] ? `<button class="btn btn-soft" onclick="openDiagramCard(COURSES[${app.courseIdx}].units[${app.unitIdx}])">📊 Open Visual Diagram</button>` : ''}
            </div>

            <div class="card-footer">
              <span style="font-size:0.84rem; color:var(--text-muted);">Finished reading?</span>
              ${hasVideos
                ? `<button class="btn btn-primary btn-lg" onclick="app.lessonTab='watch'; render(); window.scrollTo(0,0);">🎬 Next: Watch Video →</button>`
                : `<button class="btn btn-primary btn-lg" onclick="app.lessonTab='check'; render(); window.scrollTo(0,0);">⚡ Next: Quick Check →</button>`}
            </div>
          </article>
        `;
      } else if (app.lessonTab === 'watch' && hasVideos) {
        // FOCUS CARD 2: PURE VIDEO THEATER — Distraction-free watching!
        const vIdx = Math.min(app.activeVideoIdx, l.videos.length - 1);
        const v = l.videos[vIdx];
        const slotId = `yt_focus_${l.id}_${vIdx}`;
        cardHtml = `
          <article class="focus-card anim-card">
            <span class="card-kicker">🎬 Focus Mode: Watch Video</span>
            <h1 class="card-heading" style="font-size:1.3rem;">${v.title}</h1>
            <p style="font-size:0.9rem; color:var(--text-muted); margin-bottom:16px;">${v.channel} • ${v.why}</p>

            ${l.videos.length > 1 ? `
              <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;">
                ${l.videos.map((vid, idx) => `
                  <button class="btn ${idx === vIdx ? 'btn-primary' : 'btn-soft'}" style="padding:6px 12px; font-size:0.82rem;" onclick="app.activeVideoIdx=${idx}; render();">Video ${idx + 1}</button>
                `).join('')}
              </div>
            ` : ''}

            <div class="video-stage" id="${slotId}">
              <div class="yt-poster" style="background-image:url('https://i.ytimg.com/vi/${v.id}/hqdefault.jpg');" onclick="loadYouTube('${slotId}', '${v.id}', '${v.title.replace(/'/g, "\'")}')">
                <div class="yt-poster-overlay">
                  <span class="yt-play-circle">▶ Play Video Lesson</span>
                </div>
              </div>
            </div>

            <div style="text-align:right;">
              <a class="btn btn-soft" style="font-size:0.8rem; padding:6px 12px;" href="https://www.youtube.com/watch?v=${v.id}" target="_blank" rel="noopener noreferrer">↗ Open directly on YouTube</a>
            </div>

            <div class="card-footer">
              <button class="btn" onclick="app.lessonTab='read'; render(); window.scrollTo(0,0);">← Back to Reading</button>
              <button class="btn btn-primary btn-lg" onclick="app.lessonTab='check'; render(); window.scrollTo(0,0);">⚡ Next: Quick Check →</button>
            </div>
          </article>
        `;
      } else {
        // FOCUS CARD 3: PURE 1-QUESTION QUICK CHECK!
        cardHtml = `
          <article class="focus-card anim-card">
            <span class="card-kicker" style="color:var(--purple);">⚡ Quick Check</span>
            <h1 class="card-heading" style="font-size:1.32rem;">${fmtText(qc.question)}</h1>
            <div>
              ${qc.options.map((opt, idx) => {
                let cls = 'qc-choice';
                if (answered) {
                  if (idx === qc.correctIdx) cls += ' correct';
                  else if (idx === chosen) cls += ' wrong';
                }
                return `<button class="${cls}" onclick="answerQC('${l.id}', ${idx}, ${qc.correctIdx})"><strong>${String.fromCharCode(65 + idx)}.</strong> ${fmtText(opt)}</button>`;
              }).join('')}
            </div>
            ${answered ? `
              <div class="qc-result ${isCorrect ? 'ok' : 'err'}">
                ${isCorrect ? '🎉 <strong>Awesome job!</strong> ' : '💡 <strong>Good try!</strong> '} ${fmtText(qc.explanation)}
              </div>
            ` : ''}
            <div class="card-footer">
              <button class="btn" onclick="app.lessonTab='${hasVideos ? 'watch' : 'read'}'; render(); window.scrollTo(0,0);">← Back</button>
              <button class="btn btn-success btn-lg" onclick="finishLesson('${l.id}')">
                ${hasNextLesson ? `Next Lesson (${app.lessonIdx + 2}/${u.lessons.length}) →` : `✏️ Ready! Solve Multi-Step Question →`}
              </button>
            </div>
          </article>
        `;
      }

      return `
        <div class="wrap-focus">
          <!-- Clean 3-Card Focus Switcher: Read | Watch | Check -->
          <div class="mode-pills">
            <button class="mode-pill ${app.lessonTab === 'read' ? 'active' : ''}" onclick="app.lessonTab='read'; render();">📖 1. Read</button>
            ${hasVideos ? `<button class="mode-pill ${app.lessonTab === 'watch' ? 'active' : ''}" onclick="app.lessonTab='watch'; render();">🎬 2. Watch (${l.videos.length})</button>` : ''}
            <button class="mode-pill ${app.lessonTab === 'check' ? 'active' : ''}" onclick="app.lessonTab='check'; render();">⚡ ${hasVideos ? '3' : '2'}. Check</button>
          </div>
          ${cardHtml}
        </div>
      `;
    }

    /* ============================================================
       SCREEN 3B: BLOOM'S 6-STEP FOCUS CARDS
       ============================================================ */
    function renderBloom() {
      const c = COURSES[app.courseIdx];
      const u = c.units[app.unitIdx];
      const b = u.bloomLadder.find(x => x.level === app.bloomLvl) || u.bloomLadder[0];
      const pts = b.keyPoints || [];
      const topPts = pts.slice(0, 2);
      const morePts = pts.slice(2);

      return `
        <div class="wrap-focus">
          <div class="step-dots">
            ${u.bloomLadder.map(st => `
              <button class="step-dot ${st.level === app.bloomLvl ? 'active' : ''}" onclick="openBloom(${app.courseIdx}, ${app.unitIdx}, ${st.level})">
                ${st.level}. ${st.name}
              </button>
            `).join('')}
          </div>

          <article class="focus-card anim-card">
            <span class="card-kicker">🧠 Bloom's Card ${b.level} of 6 • ${b.name}</span>
            <h1 class="card-heading">${b.subtitle}</h1>
            <div class="prose"><p>${fmtText(b.content)}</p></div>

            ${topPts.map(pt => `<div class="info-box">${fmtText(pt)}</div>`).join('')}

            <div class="bonus-strip">
              ${morePts.length ? `<button class="btn btn-soft" onclick="openModal('➕ More Key Points', '${morePts.map(p => '<div class=\'info-box\'>' + escapeHtml(p) + '</div>').join('').replace(/'/g, "\'")}')">➕ ${morePts.length} More Points</button>` : ''}
              ${b.analogy ? `<button class="btn btn-soft" onclick="openModal('💡 Real-Life Connection', '<div class=\'info-box\'>${escapeHtml(b.analogy).replace(/'/g, "\'")}</div>')">💡 Real-Life Example</button>` : ''}
              ${b.workedExample ? `<button class="btn btn-primary" onclick="openModal('🛠️ Worked Example', '<div class=\'info-box\'><strong>${escapeHtml(b.workedExample.prompt).replace(/'/g, "\'")}</strong></div>${b.workedExample.steps.map(s => '<div class=\'info-box\'>' + escapeHtml(s) + '</div>').join('').replace(/'/g, "\'")}')">🛠️ Open Worked Example</button>` : ''}
              ${b.comparisonTable ? `<button class="btn btn-primary" onclick="openBloomTableModal()">📊 Open Comparison Chart</button>` : ''}
              ${b.frenchAudioSamples && b.frenchAudioSamples.length ? `<button class="btn btn-soft" onclick="openFrenchAudioModal()">🔊 Practice French Audio</button>` : ''}
            </div>

            <div class="card-footer">
              ${app.bloomLvl > 1
                ? `<button class="btn" onclick="openBloom(${app.courseIdx}, ${app.unitIdx}, ${app.bloomLvl - 1})">← Card ${app.bloomLvl - 1}</button>`
                : `<button class="btn" onclick="openCourse(${app.courseIdx})">← Course Map</button>`}
              ${app.bloomLvl < 6
                ? `<button class="btn btn-primary btn-lg" onclick="openBloom(${app.courseIdx}, ${app.unitIdx}, ${app.bloomLvl + 1})">Next Card (${app.bloomLvl + 1}/6) →</button>`
                : `<button class="btn btn-success btn-lg" onclick="openQuestion(${app.courseIdx}, ${app.unitIdx}, 0, 1)">✏️ Solve Practice Question →</button>`}
            </div>
          </article>
        </div>
      `;
    }

    function openBloomTableModal() {
      const u = COURSES[app.courseIdx].units[app.unitIdx];
      const b = u.bloomLadder.find(x => x.level === app.bloomLvl);
      if (!b || !b.comparisonTable) return;
      const t = b.comparisonTable;
      const html = `<div style="overflow-x:auto;"><table class="comp-table"><thead><tr>${t.headers.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${t.rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
      openModal('📊 Comparison Chart', html);
    }

    function openFrenchAudioModal() {
      const u = COURSES[app.courseIdx].units[app.unitIdx];
      const b = u.bloomLadder.find(x => x.level === app.bloomLvl);
      if (!b || !b.frenchAudioSamples) return;
      const html = b.frenchAudioSamples.map(s => `<button class="audio-btn" onclick="speakFrench('${s.replace(/'/g, "\'")}')">🔊 ${s}</button>`).join('');
      openModal('🔊 Tap Any French Sentence to Hear It', html);
    }

    /* ============================================================
       SCREEN 3C: FOCUSED 1-STEP-AT-A-TIME QUESTION SOLVER CARD
       ============================================================ */
    function handleWorkInput(key, val) {
      saved.inputs[key] = val;
      saveState();
    }
    function handleVerifyCheck(qId, key, checked) {
      saved.checks[key] = checked;
      const q = COURSES[app.courseIdx].units[app.unitIdx].questions[app.questionIdx];
      if (q.step4_checks.every((_, i) => !!saved.checks[`${q.id}_chk_${i}`])) saved.qaDone[qId] = true;
      saveState();
      render();
    }

    function renderQuestion() {
      const c = COURSES[app.courseIdx];
      const u = c.units[app.unitIdx];
      const q = u.questions[app.questionIdx];
      const allChecks = q.step4_checks.every((_, i) => !!saved.checks[`${q.id}_chk_${i}`]);
      const unlocked = app.teacherMode || allChecks;

      const steps = [
        { n: 1, t: '1. Plan' },
        { n: 2, t: '2. Rules' },
        { n: 3, t: '3. Solve' },
        { n: 4, t: '4. Check' },
        { n: 5, t: '5. Answer' }
      ];

      let inner = '';
      if (app.qaStep === 1) {
        inner = `
          <span class="card-kicker">Step 1 of 5 • Read &amp; Plan</span>
          <h1 class="card-heading" style="font-size:1.3rem;">${q.title}</h1>
          <div class="info-box" style="border-left:4px solid var(--purple);">${fmtText(q.prompt)}</div>
          <div class="bonus-strip">
            <button class="btn btn-soft" onclick="openModal('❓ Guiding Questions', '${q.step1_deconstruct.guidingQuestions.map((g, i) => '<div class=\'info-box\'><strong>Think ' + (i+1) + ':</strong> ' + escapeHtml(g) + '</div>').join('').replace(/'/g, "\'")}')">❓ Need Help Planning?</button>
            <button class="btn btn-soft" onclick="openModal('👁️ Model Plan', '<div class=\'info-box\'>${escapeHtml(q.step1_deconstruct.modelPlan).replace(/'/g, "\'")}</div>')">👁️ See Model Plan</button>
          </div>
        `;
      } else if (app.qaStep === 2) {
        inner = `
          <span class="card-kicker">Step 2 of 5 • Rules You Need</span>
          <h1 class="card-heading" style="font-size:1.3rem;">Review the Rules Before Solving</h1>
          ${q.step2_anchor.referenceItems.map(r => `<div class="info-box">📌 ${fmtText(r)}</div>`).join('')}
          <div class="bonus-strip">
            <button class="btn btn-soft" onclick="openQuestionPromptCard(COURSES[${app.courseIdx}].units[${app.unitIdx}].questions[${app.questionIdx}])">🎯 Re-read Question</button>
            <button class="btn btn-soft" onclick="openToolsModal('charts')">📚 Full Anchor Charts</button>
          </div>
        `;
      } else if (app.qaStep === 3) {
        const sIdx = Math.min(app.subStepIdx, q.step3_substeps.length - 1);
        const sub = q.step3_substeps[sIdx];
        const key = `${q.id}_sub_${sIdx}`;
        const val = saved.inputs[key] || '';
        inner = `
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:10px;">
            <span class="card-kicker" style="margin:0;">Step 3 of 5 • Part ${sIdx + 1} of ${q.step3_substeps.length}</span>
            <button class="btn btn-soft" style="padding:5px 11px; font-size:0.8rem;" onclick="openQuestionPromptCard(COURSES[${app.courseIdx}].units[${app.unitIdx}].questions[${app.questionIdx}])">🎯 Re-read Question</button>
          </div>
          <div style="display:flex; gap:6px; margin-bottom:14px;">
            ${q.step3_substeps.map((_, i) => {
              const typed = (saved.inputs[`${q.id}_sub_${i}`] || '').trim().length > 2;
              return `<button class="btn ${i === sIdx ? 'btn-primary' : 'btn-soft'}" style="padding:5px 12px; font-size:0.8rem;" onclick="app.subStepIdx=${i}; render();">Part 3${String.fromCharCode(97 + i)} ${typed ? '✓' : ''}</button>`;
            }).join('')}
          </div>
          <label style="font-weight:700; font-size:1.04rem; display:block;">${fmtText(sub.label)}</label>
          <textarea class="work-area" placeholder="${escapeHtml(sub.placeholder)}" oninput="handleWorkInput('${key}', this.value); updateLiveMeter('${c.id}', this.value);">${escapeHtml(val)}</textarea>
          <div class="meter-bar" id="liveDetailMeter"></div>
          <div class="bonus-strip">
            <button class="btn btn-soft" onclick="openHintWithLog('Part 3${String.fromCharCode(97 + sIdx)}', COURSES[${app.courseIdx}].units[${app.unitIdx}].questions[${app.questionIdx}].step3_substeps[${sIdx}].hint)">💡 Open Hint Card</button>
            <button class="btn btn-soft" onclick="openModal('✅ Model Work for Part 3${String.fromCharCode(97 + sIdx)}', '<div class=\'info-box\'>${escapeHtml(sub.modelSubAnswer).replace(/\n/g, '<br/>').replace(/'/g, "\'")}</div>')">✅ Check Part 3${String.fromCharCode(97 + sIdx)}</button>
          </div>
        `;
      } else if (app.qaStep === 4) {
        inner = `
          <span class="card-kicker">Step 4 of 5 • Double-Check Shield</span>
          <h1 class="card-heading" style="font-size:1.3rem;">Check Off Each Box to Unlock the Answer</h1>
          ${q.step4_checks.map((chk, idx) => {
            const k = `${q.id}_chk_${idx}`;
            return `
              <label class="check-tile">
                <input type="checkbox" ${saved.checks[k] ? 'checked' : ''} onchange="handleVerifyCheck('${q.id}', '${k}', this.checked)" />
                <span>${fmtText(chk)}</span>
              </label>
            `;
          }).join('')}
          ${allChecks ? `<div class="takeaway">✅ All checked! Tap <strong>See Model Answer</strong> below.</div>` : ''}
        `;
      } else {
        inner = `
          <span class="card-kicker">Step 5 of 5 • Compare &amp; Celebrate</span>
          <h1 class="card-heading" style="font-size:1.3rem;">Grade 7+ Multi-Step Exemplar</h1>
          ${unlocked ? `
            <div class="takeaway" style="white-space:pre-line;">${fmtText(q.step5_modelAnswer.expandedAnswer)}</div>
            <div class="bonus-strip">
              <button class="btn btn-soft" onclick="openModal('⚠️ Too-Short Answer vs. Full Answer', '<div class=\'info-box\'>${escapeHtml(q.step5_modelAnswer.basicAnswer).replace(/'/g, "\'")}</div>')">⚠️ Compare with Brief Answer</button>
              <button class="btn btn-soft" onclick="openModal('🚀 Bonus Extension Challenge', '<div class=\'info-box\'>${escapeHtml(q.step5_modelAnswer.extensionPrompt).replace(/'/g, "\'")}</div>')">🚀 Bonus Extension</button>
            </div>
          ` : `
            <div class="info-box" style="text-align:center; padding:24px;">
              <strong>🔒 Complete Step 4 Double-Check First!</strong>
Check all boxes in Step 4 (or turn on Parent Mode inside 🧰 Help).
            </div>
          `}
        `;
      }

      const nextButton = () => {
        if (app.qaStep === 3 && app.subStepIdx + 1 < q.step3_substeps.length) {
          return `<button class="btn btn-primary btn-lg" onclick="app.subStepIdx=${app.subStepIdx + 1}; render();">Continue to Part 3${String.fromCharCode(98 + app.subStepIdx)} →</button>`;
        }
        if (app.qaStep === 4) {
          return `<button class="btn btn-success btn-lg" onclick="app.qaStep=5; render();">See Model Answer →</button>`;
        }
        if (app.qaStep < 5) {
          return `<button class="btn btn-primary btn-lg" onclick="app.qaStep=${app.qaStep + 1}; render();">Next Step (${app.qaStep + 1}/5) →</button>`;
        }
        if (app.questionIdx + 1 < u.questions.length) {
          return `<button class="btn btn-success btn-lg" onclick="openQuestion(${app.courseIdx}, ${app.unitIdx}, ${app.questionIdx + 1}, 1)">Next Question →</button>`;
        }
        return `<button class="btn btn-success btn-lg" onclick="openCourse(${app.courseIdx})">🎉 Done! Back to ${c.name}</button>`;
      };

      const prevButton = () => {
        if (app.qaStep === 3 && app.subStepIdx > 0) {
          return `<button class="btn" onclick="app.subStepIdx=${app.subStepIdx - 1}; render();">← Part 3${String.fromCharCode(96 + app.subStepIdx)}</button>`;
        }
        if (app.qaStep > 1) {
          return `<button class="btn" onclick="app.qaStep=${app.qaStep - 1}; render();">← Back</button>`;
        }
        return `<button class="btn" onclick="openLesson(${app.courseIdx}, ${app.unitIdx}, 0, 'read')">← Read Lesson</button>`;
      };

      return `
        <div class="wrap-focus">
          <div class="step-dots">
            ${steps.map(s => `
              <button class="step-dot ${s.n === app.qaStep ? 'active' : ''} ${s.n < app.qaStep ? 'done' : ''}" onclick="app.qaStep=${s.n}; render();">${s.t}</button>
            `).join('')}
          </div>
          <section class="focus-card anim-card">
            ${inner}
            <div class="card-footer">
              ${prevButton()}
              ${nextButton()}
            </div>
          </section>
        </div>
      `;
    }

    function render() {
      if (isSpeakingLesson) stopSpeech();
      renderTopBar();
      const root = document.getElementById('stageRoot');
      if (app.screen === 'home') root.innerHTML = renderHome();
      else if (app.screen === 'course') root.innerHTML = renderCourse();
      else if (app.screen === 'lesson') root.innerHTML = renderLesson();
      else if (app.screen === 'bloom') root.innerHTML = renderBloom();
      else if (app.screen === 'question') {
        root.innerHTML = renderQuestion();
        if (app.qaStep === 3) {
          const c = COURSES[app.courseIdx];
          const q = c.units[app.unitIdx].questions[app.questionIdx];
          const sIdx = Math.min(app.subStepIdx, q.step3_substeps.length - 1);
          updateLiveMeter(c.id, saved.inputs[`${q.id}_sub_${sIdx}`] || '');
        }
      }
    }

    // Restore saved theme & hash support
    (function initHash() {
      const h = window.location.hash.replace('#', '');
      if (localStorage.getItem('zaid_grade7_theme') === 'dark' || h.includes('dark')) {
        document.body.classList.add('dark');
      }
      const route = h.replace('&dark', '').replace('dark', '');
      if (route.startsWith('course=')) return openCourse(parseInt(route.split('=')[1], 10) || 0);
      if (route.startsWith('lesson=')) {
        const p = route.split('=')[1].split('-');
        return openLesson(+p[0]||0, +p[1]||0, +p[2]||0, p[3] || 'read');
      }
      if (route.startsWith('question=')) {
        const p = route.split('=')[1].split('-').map(x => +x || 0);
        return openQuestion(p[0], p[1], p[2], p[3] || 1);
      }
      render();
    })();
  </script>
</body>
</html>
