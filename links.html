<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apps | alhaol.github.io</title>
    <link rel="icon" href="data:,">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --text-main: #ffffff;
            --text-muted: #b3b3b3;
            --primary-color: #00ff41;
            --secondary-color: #00cc33;
            --card-bg: #111111;
            --border-color: #333333;
            --header-bg-start: #000000;
            --header-bg-end: #0a0a0a;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .theme-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            transition: all 0.3s ease;
        }

        .theme-card:hover {
            border-color: var(--primary-color);
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 255, 65, 0.08);
        }

        header {
            background: linear-gradient(135deg, var(--header-bg-start), var(--header-bg-end));
            color: white;
            border-bottom: 1px solid var(--border-color);
        }

        .nav-link {
            color: white;
            text-decoration: none;
            transition: color 0.2s;
        }

        .nav-link:hover {
            color: var(--primary-color);
        }

        .category-badge {
            display: inline-block;
            padding: 0.3rem 0.6rem;
            border-radius: 0.25rem;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-family: 'JetBrains Mono', monospace;
        }

        .cat-tools     { background-color: rgba(59, 130, 246, 0.1);  color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }
        .cat-learning  { background-color: rgba(16, 185, 129, 0.1);  color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
        .cat-spiritual { background-color: rgba(168, 85, 247, 0.1);  color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.3); }
        .cat-fitness   { background-color: rgba(249, 115, 22, 0.1);  color: #fb923c; border: 1px solid rgba(249, 115, 22, 0.3); }
        .cat-fun       { background-color: rgba(236, 72, 153, 0.1);  color: #f472b6; border: 1px solid rgba(236, 72, 153, 0.3); }
        .cat-finance   { background-color: rgba(0, 255, 65, 0.1);    color: #00ff41; border: 1px solid rgba(0, 255, 65, 0.3); }

        .app-card {
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 1.5rem;
            border-radius: 0.75rem;
        }

        .app-icon {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(0, 255, 65, 0.08);
            color: var(--primary-color);
            border-radius: 0.5rem;
            border: 1px solid rgba(0, 255, 65, 0.2);
            flex-shrink: 0;
        }

        .app-link {
            color: var(--primary-color);
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: gap 0.2s;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
        }

        .app-link:hover {
            gap: 0.75rem;
        }

        .filter-btn {
            padding: 0.4rem 0.85rem;
            border-radius: 0.5rem;
            font-size: 0.8rem;
            font-weight: 500;
            border: 1px solid var(--border-color);
            background-color: transparent;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'JetBrains Mono', monospace;
        }

        .filter-btn:hover {
            color: var(--text-main);
            border-color: var(--primary-color);
        }

        .filter-btn.active {
            background-color: var(--primary-color);
            color: #000;
            border-color: var(--primary-color);
        }

        #search-input {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }

        #search-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(0, 255, 65, 0.15);
        }

        .mono { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body>
    <header class="py-6">
        <div class="max-w-7xl mx-auto px-6 flex justify-between items-center">
            <a href="./" class="nav-link text-sm">← Back to Portfolio</a>
            <a href="articles/" class="nav-link text-sm">Articles →</a>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-12 md:py-16">
        <div class="mb-10">
            <p class="mono text-xs uppercase tracking-[0.2em]" style="color: var(--primary-color);">// apps</p>
            <h1 class="text-4xl md:text-5xl font-bold mt-2 mb-4">Application Hub</h1>
            <p class="text-lg max-w-3xl" style="color: var(--text-muted);">
                A curated collection of interactive tools, learning playlists, spiritual companions, and experimental
                builds — each a self-contained app within this portfolio.
            </p>
        </div>

        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
            <div class="relative flex-1 max-w-md">
                <input id="search-input" type="text" placeholder="Filter apps..." class="w-full pl-4 pr-4 py-2.5 rounded-lg text-sm" />
            </div>
            <div id="filters" class="flex flex-wrap gap-2">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="tools">Tools</button>
                <button class="filter-btn" data-filter="learning">Learning</button>
                <button class="filter-btn" data-filter="spiritual">Spiritual</button>
                <button class="filter-btn" data-filter="fitness">Fitness</button>
                <button class="filter-btn" data-filter="finance">Finance</button>
                <button class="filter-btn" data-filter="fun">Fun</button>
            </div>
        </div>

        <div id="apps-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>

        <div id="empty-state" class="hidden text-center py-16 border border-dashed rounded-xl mt-6" style="border-color: var(--border-color);">
            <p style="color: var(--text-muted);">No apps match your filter.</p>
        </div>
    </main>

    <footer class="border-t mt-16 py-8" style="border-color: var(--border-color);">
        <div class="max-w-7xl mx-auto px-6 text-center text-sm" style="color: var(--text-muted);">
            <p class="mono">// alhaol.github.io · application hub</p>
        </div>
    </footer>

    <script>
        const APPS = [
            {
                slug: "careermap",
                name: "Career Map",
                tagline: "Ibrahim AbuAlhaol's Journey",
                description: "An interactive timeline of academic milestones, industry roles, patents, and research contributions across two decades.",
                category: "tools",
                icon: "map"
            },
            {
                slug: "tax",
                name: "Canada Tax Maximizer",
                tagline: "Ontario edition",
                description: "Estimate Ontario federal/provincial taxes, RRSP/TFSA strategy, deductions, and refund optimization with a clean interactive portal.",
                category: "finance",
                icon: "calculator"
            },
            {
                slug: "todo",
                name: "TaskMaster Pro",
                tagline: "Focus-driven task UI",
                description: "A minimalist task manager built around focus mode, priorities, and friction-free entry.",
                category: "tools",
                icon: "check"
            },
            {
                slug: "systems",
                name: "System Visualizer",
                tagline: "AFPISH & P3N3SLW frameworks",
                description: "Architect and visualize personal systems using the AFPISH and P3N3SLW frameworks — for designing your own life as a system.",
                category: "tools",
                icon: "network"
            },
            {
                slug: "21",
                name: "21 Repetitions",
                tagline: "Session-based repetition counter",
                description: "Count repetitions in sessions of 21 — useful for spiritual recitation, exercise sets, or any habit that benefits from rhythmic practice.",
                category: "spiritual",
                icon: "loop"
            },
            {
                slug: "hifz",
                name: "Quran Hifz Repeater",
                tagline: "Memorization companion",
                description: "Repeat verses with configurable counts to support Quranic memorization (hifz). Ayah-level looping with focus controls.",
                category: "spiritual",
                icon: "book"
            },
            {
                slug: "rukus",
                name: "Quran Ruku Ultimate",
                tagline: "Recitation by ruku",
                description: "Navigate and recite the Quran section by section (ruku) with continuous playback and bookmarks.",
                category: "spiritual",
                icon: "book"
            },
            {
                slug: "tasfeer-alsadi",
                name: "Tafseer as-Saadi",
                tagline: "Quranic exegesis playlist",
                description: "Curated audio playlist of as-Saadi's tafseer — the classical Quranic commentary by Sheikh Abdur-Rahman as-Sa'di.",
                category: "spiritual",
                icon: "play"
            },
            {
                slug: "books",
                name: "Neural Archive",
                tagline: "AI research collection",
                description: "A searchable archive of seminal AI/ML papers, books, and research notes — organized for quick reference.",
                category: "learning",
                icon: "book"
            },
            {
                slug: "ibm-ai",
                name: "IBM AI Engineering",
                tagline: "Course playlist",
                description: "Structured playlist following the IBM AI Engineering professional certificate curriculum.",
                category: "learning",
                icon: "play"
            },
            {
                slug: "ibm-cs",
                name: "IBM Cybersecurity",
                tagline: "Course playlist",
                description: "Curated cybersecurity learning track aligned with the IBM Cybersecurity Analyst certificate.",
                category: "learning",
                icon: "shield"
            },
            {
                slug: "invest-python",
                name: "Invest with Python",
                tagline: "Quant & investing tutorials",
                description: "Playlist on quantitative investing, financial analysis, and portfolio modeling using Python.",
                category: "finance",
                icon: "play"
            },
            {
                slug: "build-system",
                name: "Build Your System",
                tagline: "Personal-systems playlist",
                description: "Videos on habit design, productivity systems, and intentional living — fuel for the System Visualizer.",
                category: "learning",
                icon: "play"
            },
            {
                slug: "collection",
                name: "Curated Collection",
                tagline: "Mixed video playlist",
                description: "An eclectic playlist of high-signal videos across science, engineering, philosophy, and craft.",
                category: "learning",
                icon: "play"
            },
            {
                slug: "tier-lists",
                name: "Tier Lists",
                tagline: "Ranking playlist",
                description: "A playlist of tier-list videos and ranking content — for the love of categorization.",
                category: "fun",
                icon: "play"
            },
            {
                slug: "fullbody",
                name: "Full-Body Workouts",
                tagline: "Training playlist",
                description: "Curated workout videos for full-body training routines, mobility, and strength conditioning.",
                category: "fitness",
                icon: "play"
            },
            {
                slug: "warmup",
                name: "Warmup Routines",
                tagline: "Pre-training playlist",
                description: "Quick warmup and mobility routines — designed to be played before lifting or running.",
                category: "fitness",
                icon: "play"
            },
            {
                slug: "dash",
                name: "Audio Dash",
                tagline: "Audio library",
                description: "A personal audio library — lectures, podcasts, and recordings organized for distraction-free playback.",
                category: "learning",
                icon: "play"
            },
            {
                slug: "wizard-duel",
                name: "Wizard Duel",
                tagline: "Browser game",
                description: "A self-contained browser game — cast spells, dodge attacks, and duel as a wizard. No data files, just play.",
                category: "fun",
                icon: "spark"
            }
        ];

        const ICONS = {
            map: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"></polygon><line x1="9" y1="3" x2="9" y2="18"></line><line x1="15" y1="6" x2="15" y2="21"></line></svg>',
            calculator: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><rect x="4" y="2" width="16" height="20" rx="2"></rect><line x1="8" y1="6" x2="16" y2="6"></line><line x1="8" y1="14" x2="8.01" y2="14"></line><line x1="12" y1="14" x2="12.01" y2="14"></line><line x1="16" y1="14" x2="16.01" y2="14"></line><line x1="8" y1="18" x2="8.01" y2="18"></line><line x1="12" y1="18" x2="12.01" y2="18"></line><line x1="16" y1="18" x2="16.01" y2="18"></line></svg>',
            check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><polyline points="9 11 12 14 22 4"></polyline><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>',
            network: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><circle cx="12" cy="5" r="2"></circle><circle cx="5" cy="19" r="2"></circle><circle cx="19" cy="19" r="2"></circle><line x1="12" y1="7" x2="5" y2="17"></line><line x1="12" y1="7" x2="19" y2="17"></line></svg>',
            loop: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg>',
            book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>',
            play: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>',
            shield: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>',
            spark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>'
        };

        const grid = document.getElementById('apps-grid');
        const emptyState = document.getElementById('empty-state');
        const searchInput = document.getElementById('search-input');
        const filterButtons = document.querySelectorAll('.filter-btn');

        let activeFilter = 'all';
        let activeSearch = '';

        function render() {
            const items = APPS.filter(app => {
                const matchesFilter = activeFilter === 'all' || app.category === activeFilter;
                const q = activeSearch.toLowerCase();
                const matchesSearch = !q
                    || app.name.toLowerCase().includes(q)
                    || app.tagline.toLowerCase().includes(q)
                    || app.description.toLowerCase().includes(q);
                return matchesFilter && matchesSearch;
            });

            grid.innerHTML = '';
            if (items.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }
            emptyState.classList.add('hidden');

            items.forEach(app => {
                const card = document.createElement('a');
                card.href = `apps/${app.slug}/`;
                card.className = 'theme-card app-card';
                card.innerHTML = `
                    <div class="flex items-start justify-between gap-3 mb-4">
                        <div class="app-icon">${ICONS[app.icon] || ICONS.play}</div>
                        <span class="category-badge cat-${app.category}">${app.category}</span>
                    </div>
                    <h3 class="text-xl font-bold mb-1">${app.name}</h3>
                    <p class="mono text-xs mb-3" style="color: var(--text-muted);">${app.tagline}</p>
                    <p class="text-sm mb-5 flex-grow" style="color: var(--text-muted); line-height: 1.6;">${app.description}</p>
                    <span class="app-link">Open app →</span>
                `;
                grid.appendChild(card);
            });
        }

        filterButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                filterButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                activeFilter = btn.dataset.filter;
                render();
            });
        });

        searchInput.addEventListener('input', e => {
            activeSearch = e.target.value;
            render();
        });

        render();
    </script>
</body>
</html>
