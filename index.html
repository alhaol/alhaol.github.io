        // Helper to get stat icon
        function getStatIcon(statName) {
            const lower = statName.toLowerCase();
            if (lower.includes('citation')) return getIcon('quote', 32);
            if (lower.includes('patent')) return getIcon('medal', 32);
            if (lower.includes('conference')) return getIcon('presentation', 32);
            if (lower.includes('journal')) return getIcon('fileText', 32);
            return getIcon('award', 32);
        }

        // Helper to get publication icon
        function getPubIcon(category) {
            if (!category) return getIcon('bookOpen', 20);
            const c = category.toLowerCase();
            if (c.includes('patent')) return getIcon('medal', 20);
            if (c.includes('conference')) return getIcon('presentation', 20);
            if (c.includes('journal')) return getIcon('fileText', 20);
            return getIcon('bookOpen', 20);
        }

        // --- ANIMATION ENGINE ---
        function initAnimation(type, color) {
            const canvas = document.getElementById('header-canvas'); // Target new canvas in header
            if (!canvas) return;
            
            const ctx = canvas.getContext('2d');
            let animationFrameId;

            // Resize canvas to match header container
            const header = document.querySelector('.header-container');
            const resize = () => {
                canvas.width = header.offsetWidth;
                canvas.height = header.offsetHeight;
            };
            window.addEventListener('resize', resize);
            resize();

            // Clear previous animation loop
            if (window.currentAnim) cancelAnimationFrame(window.currentAnim);

            if (type === 'falling-binary') {
                const fontSize = 18; // Increased from 14
                const columns = canvas.width / fontSize;
                const drops = Array(Math.floor(columns)).fill(1);
                
                // Add FPS limiting for falling binary
                let lastTime = 0;
                const fps = 20;
                const interval = 1000 / fps;

                function drawMatrix(timestamp) {
                    window.currentAnim = requestAnimationFrame(drawMatrix);
                    
                    // Cap frame rate
                    const deltaTime = timestamp - lastTime;
                    if (deltaTime < interval) return;
                    lastTime = timestamp - (deltaTime % interval);

                    ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = color; // e.g. Neon Green
                    ctx.font = fontSize + "px JetBrains Mono";

                    for (let i = 0; i < drops.length; i++) {
                        const text = Math.floor(Math.random() * 2);
                        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                        drops[i]++;
                    }
                }
                requestAnimationFrame(drawMatrix);
            } else if (type === 'particle-network') {
                const nodeSize = 5.5; // Increased size
                const particles = [];
                for(let i=0; i<60; i++) { // Fewer particles for header
                    particles.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        vx: (Math.random() - 0.5) * 0.15, // Slowed down from 0.3
                        vy: (Math.random() - 0.5) * 0.15 // Slowed down from 0.3
                    });
                }

                function drawNetwork() {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.strokeStyle = color;
                    ctx.fillStyle = color;
                    
                    particles.forEach((p, index) => {
                        p.x += p.vx;
                        p.y += p.vy;
                        // Bounce off edges
                        if(p.x < 0 || p.x > canvas.width) p.vx *= -1;
                        if(p.y < 0 || p.y > canvas.height) p.vy *= -1;

                        ctx.beginPath();
                        ctx.arc(p.x, p.y, nodeSize, 0, Math.PI*2);
                        ctx.fill();

                        for(let j=index+1; j<particles.length; j++) {
                            const p2 = particles[j];
                            const dist = Math.hypot(p.x - p2.x, p.y - p2.y);
                            if(dist < 250) { // Increased distance to make it look "fully connected"
                                ctx.globalAlpha = 1 - (dist/250);
                                ctx.beginPath();
                                ctx.moveTo(p.x, p.y);
                                ctx.lineTo(p2.x, p2.y);
                                ctx.stroke();
                                ctx.globalAlpha = 1;
                            }
                        }
                    });
                    window.currentAnim = requestAnimationFrame(drawNetwork);
                }
                drawNetwork();
            } else if (type === 'floating-orbs') {
                const particles = [];
                for(let i=0; i<30; i++) {
                    particles.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        radius: Math.random() * 20 + 5,
                        vy: (Math.random() * 0.5) + 0.2
                    });
                }

                function drawOrbs() {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = color;
                    
                    particles.forEach((p) => {
                        p.y -= p.vy;
                        if(p.y + p.radius < 0) p.y = canvas.height + p.radius;

                        ctx.globalAlpha = 0.4;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2);
                        ctx.fill();
                        ctx.globalAlpha = 1;
                    });
                    window.currentAnim = requestAnimationFrame(drawOrbs);
                }
                drawOrbs();
            } else if (type === 'sine-wave') {
                let time = 0;
                function drawSine() {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.strokeStyle = color;
                    ctx.lineWidth = 2;
                    
                    ctx.beginPath();
                    for (let x = 0; x < canvas.width; x++) {
                        const y = canvas.height / 2 + Math.sin(x * 0.01 + time) * 50;
                        ctx.lineTo(x, y);
                    }
                    ctx.stroke();

                    // Second wave
                    ctx.beginPath();
                    ctx.strokeStyle = color + '80'; // 50% opacity
                    for (let x = 0; x < canvas.width; x++) {
                        const y = canvas.height / 2 + Math.sin(x * 0.02 + time * 1.5) * 30;
                        ctx.lineTo(x, y);
                    }
                    ctx.stroke();

                    time += 0.05;
                    window.currentAnim = requestAnimationFrame(drawSine);
                }
                drawSine();
            } else {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }

                appData = JSON.parse(JSON.stringify(DEFAULT_DATA));
                
                const profileRes = await fetch('./conf/profile.json');
                if (profileRes.ok) {
                    const profileData = await profileRes.json();
                    
                    // Try fetch style.json
                    try {
                        const styleRes = await fetch('./conf/style.json');
                        if (styleRes.ok) {
                            profileData.config = await styleRes.json();
                        } else {
                            profileData.config = DEFAULT_DATA.config;
                        }
                    } catch (e) {
                        profileData.config = DEFAULT_DATA.config;
                    }
                    
                    // Merge timestamp from embedded data if missing in file (likely generated by build script)
                    if (!profileData.lastUpdated && DEFAULT_DATA.lastUpdated) {
                        profileData.lastUpdated = DEFAULT_DATA.lastUpdated;
                    }
                    
                    appData = profileData;
                    render(appData, "Loaded from profile.json");
                } else {
                    throw new Error('Profile not found');
                }
            } catch (err) {
                // If local fetch fails (e.g. strict CORS), fallback to embedded data
                // We ensure embedded data has the full theme structure too.
                console.log("Using embedded data");
                appData = JSON.parse(JSON.stringify(DEFAULT_DATA));
                render(appData, "Embedded Data");
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
