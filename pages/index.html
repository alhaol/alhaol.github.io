<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pages | alhaol.github.io</title>
    <meta name="description" content="Standalone pages, currently under construction.">
    <link rel="icon" type="image/png" href="../assets/ibrahim-image-circle.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a1628;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --primary-color: #60a5fa;
            --card-bg: #1a2942;
            --border-color: #2a3f5f;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
        }
        .nav-link { color: var(--text-main); text-decoration: none; }
        .nav-link:hover { color: var(--primary-color); }
        .theme-card { background-color: var(--card-bg); border: 1px solid var(--border-color); }
    </style>
</head>
<body>
    <header class="py-6 shadow-md">
        <div class="max-w-4xl mx-auto px-6 flex justify-between items-center">
            <a href="../" class="nav-link text-sm">← Back to Portfolio</a>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-6 py-24 text-center">
        <div class="theme-card rounded-xl p-12">
            <h1 class="text-3xl font-bold mb-4">Pages</h1>
            <p class="text-lg" style="color: var(--text-muted);">This section is under construction. Check back soon.</p>
        </div>
    </main>
</body>
</html>
