<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruku Hifz</title>
  <link rel="icon" type="image/png" href="../../assets/ibrahim-image-circle.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { background-color: #020617; }
    body {
      background: radial-gradient(circle at 50% 0%, #1e293b 0%, #020617 70%);
      color: #f1f5f9;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      padding: 20px;
    }
    .glass-panel {
      background: rgba(30, 41, 59, 0.6);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      border-radius: 14px;
    }
    .accent-text { color: #10b981; }
    .btn-accent {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #020617;
      padding: 11px 20px;
      border-radius: 10px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-accent:hover { transform: translateY(-1px); box-shadow: 0 10px 24px rgba(0,0,0,0.4); }
    .input-field {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid #475569;
      color: #f1f5f9;
      padding: 11px 14px;
      border-radius: 10px;
      font-size: 14px;
      width: 100%;
      transition: border-color 0.2s;
    }
    .input-field:focus { outline: none; border-color: #10b981; }

    /* ---- Quran text ---- */
    .arabic {
      font-family: 'Amiri', 'Scheherazade New', 'Traditional Arabic', serif;
      direction: rtl;
      text-align: right;
      font-feature-settings: "liga" 1;
    }
    .ruku-card {
      background: rgba(2, 6, 23, 0.45);
      border: 1px solid rgba(16, 185, 129, 0.18);
      border-radius: 14px;
      padding: 26px 24px;
    }
    .ruku-text { font-size: 30px; line-height: 2.35; color: #f8fafc; }
    @media (max-width: 640px) { .ruku-text { font-size: 25px; line-height: 2.2; } }

    .ayah { display: inline; border-radius: 6px; transition: background 0.15s; }
    .ayah.testing { cursor: pointer; }
    .ayah.testing:hover { background: rgba(16, 185, 129, 0.09); }
    .ayah-num {
      font-size: 0.62em; color: #10b981; margin: 0 0.18em;
      border: 1px solid rgba(16, 185, 129, 0.45);
      border-radius: 999px; padding: 0.05em 0.42em;
      vertical-align: middle; white-space: nowrap;
    }
    /* Recall modes hide the words but keep the line shape, so the reader still
       sees how much text they are trying to recall. */
    .veiled, .veil-inner { filter: blur(7px); opacity: 0.55; user-select: none; }
    .cue { color: #6ee7b7; }

    /* ---- Connective context: the verse on either side of the ruku ---- */
    .ctx { padding: 12px 18px; margin: 0; }
    .ctx-before { border-bottom: 1px dashed rgba(255,255,255,0.10); margin-bottom: 14px; padding-bottom: 16px; }
    .ctx-after  { border-top:    1px dashed rgba(255,255,255,0.10); margin-top: 14px;    padding-top: 16px; }
    .ctx-tag {
      font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.09em;
      color: #64748b; font-weight: 600; margin-bottom: 6px;
    }
    .ctx-after .ctx-tag { text-align: right; }
    .ctx-arrow { color: #10b981; }
    .ctx-text { font-size: 19px; line-height: 2; color: #94a3b8; }

    /* ---- Controls ---- */
    .lbl { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.09em; color: #94a3b8; font-weight: 600; }
    .chip {
      background: rgba(30,41,59,0.85); border: 1px solid #334155; color: #cbd5e1;
      font-size: 12px; font-weight: 600; padding: 7px 12px; border-radius: 9px;
      cursor: pointer; transition: all 0.15s; white-space: nowrap;
    }
    .chip:hover { border-color: #10b981; color: #fff; }
    .chip.on { background: rgba(16,185,129,0.15); border-color: #10b981; color: #6ee7b7; }
    .chip-danger:hover { border-color: #f87171; color: #fca5a5; }

    .navbtn {
      background: rgba(30,41,59,0.85); border: 1px solid #334155; color: #e2e8f0;
      width: 46px; height: 46px; border-radius: 12px; font-size: 20px; line-height: 1;
      cursor: pointer; flex: none; transition: all 0.15s;
    }
    .navbtn:hover:not(:disabled) { border-color: #10b981; color: #6ee7b7; transform: translateY(-1px); }
    .navbtn:disabled { opacity: 0.3; cursor: not-allowed; }

    .seg { display: inline-flex; background: rgba(2,6,23,0.6); border: 1px solid #334155; border-radius: 10px; overflow: hidden; }
    .seg-btn {
      background: none; border: none; color: #94a3b8; font-size: 12px; font-weight: 600;
      padding: 7px 13px; cursor: pointer; transition: all 0.15s; white-space: nowrap;
    }
    .seg-btn + .seg-btn { border-left: 1px solid #334155; }
    .seg-btn:hover { color: #f1f5f9; }
    .seg-btn.on { background: rgba(100,116,139,0.25); color: #f1f5f9; }
    .seg-btn.seg-learning.on  { background: rgba(251,191,36,0.18); color: #fcd34d; }
    .seg-btn.seg-memorized.on { background: rgba(16,185,129,0.18); color: #6ee7b7; }

    /* ---- Progress ---- */
    .track { height: 7px; background: rgba(2,6,23,0.7); border-radius: 999px; overflow: hidden; border: 1px solid rgba(255,255,255,0.06); }
    .track-fill { height: 100%; background: linear-gradient(90deg, #059669, #10b981); border-radius: 999px; transition: width 0.35s ease; }

    .surah-row {
      display: grid; grid-template-columns: 34px minmax(0,1fr) minmax(0,1fr) 74px 66px;
      align-items: center; gap: 10px; width: 100%; text-align: left;
      background: none; border: none; color: #cbd5e1; cursor: pointer;
      padding: 9px 14px; font-size: 13px; transition: background 0.12s;
    }
    .surah-row:hover { background: rgba(16,185,129,0.08); color: #fff; }
    .surah-id { color: #64748b; font-size: 11px; font-variant-numeric: tabular-nums; }
    .surah-name, .surah-ar { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .surah-ar { text-align: right; color: #94a3b8; font-size: 15px; }
    .surah-count { font-size: 11px; color: #64748b; font-variant-numeric: tabular-nums; text-align: right; }
    .learning-dot { color: #fbbf24; }
    .mini { display: block; height: 5px; background: rgba(2,6,23,0.8); border-radius: 999px; overflow: hidden; }
    .mini-fill { display: block; height: 100%; background: #10b981; border-radius: 999px; }
    @media (max-width: 640px) {
      .surah-row { grid-template-columns: 30px minmax(0,1fr) 60px 50px; }
      .surah-ar { display: none; }
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  </style>
</head>
<body>

<!-- LOGIN OVERLAY (do not modify — shared site-wide access gate, see CLAUDE.md) -->
<div id="loginView" style="position:fixed;inset:0;z-index:9999;background:#030712;display:flex;align-items:center;justify-content:center;padding:1rem">
  <div style="width:100%;max-width:360px;background:rgba(15,23,42,0.95);border:1px solid rgba(255,255,255,0.08);border-radius:1.25rem;padding:2rem;box-shadow:0 25px 50px -12px rgba(0,0,0,0.8)">
    <div style="text-align:center;margin-bottom:1.5rem">
      <div style="width:3.5rem;height:3.5rem;background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.3);border-radius:9999px;display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;font-size:1.5rem">🔒</div>
      <h2 style="color:white;font-size:1.25rem;font-weight:700;margin:0 0 0.25rem">Secure Access</h2>
      <p style="color:#64748b;font-size:0.7rem;text-transform:uppercase;letter-spacing:0.1em;margin:0">Private App</p>
    </div>
    <div style="display:flex;flex-direction:column;gap:1rem">
      <div>
        <label style="display:block;color:#94a3b8;font-size:0.7rem;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:0.4rem">Username</label>
        <input type="text" id="loginUsername" placeholder="Enter username" autocomplete="username"
          style="width:100%;background:#1e293b;border:1px solid #334155;color:white;border-radius:0.75rem;padding:0.75rem 1rem;font-size:0.875rem;outline:none;box-sizing:border-box;transition:border-color 0.2s"
          onfocus="this.style.borderColor='#10b981'" onblur="this.style.borderColor='#334155'">
      </div>
      <div>
        <label style="display:block;color:#94a3b8;font-size:0.7rem;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:0.4rem">Password</label>
        <input type="password" id="loginPassword" placeholder="Enter password" autocomplete="current-password"
          style="width:100%;background:#1e293b;border:1px solid #334155;color:white;border-radius:0.75rem;padding:0.75rem 1rem;font-size:0.875rem;outline:none;box-sizing:border-box;transition:border-color 0.2s"
          onfocus="this.style.borderColor='#10b981'" onblur="this.style.borderColor='#334155'"
          onkeydown="if(event.key==='Enter')_login()">
      </div>
      <button onclick="_login()"
        style="width:100%;background:#059669;color:white;font-weight:700;padding:0.75rem 1rem;border-radius:0.75rem;border:none;cursor:pointer;font-size:0.875rem;transition:background 0.2s;margin-top:0.25rem"
        onmouseover="this.style.background='#10b981'" onmouseout="this.style.background='#059669'">
        Unlock
      </button>
      <p id="loginError" style="display:none;text-align:center;color:#f87171;font-size:0.75rem;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.2);border-radius:0.5rem;padding:0.5rem;margin:0">
        Incorrect credentials. Try again.
      </p>
    </div>
  </div>
</div>

<div class="max-w-4xl mx-auto relative z-10">
  <header class="flex items-center justify-between mb-8">
    <div>
      <h1 class="text-3xl font-bold text-white">Ruku Hifz</h1>
      <p class="text-slate-400 text-sm mt-1">One ruku a page, with the verse before and after it</p>
    </div>
    <div class="text-right">
      <a href="../../links/" class="text-slate-400 hover:text-white text-sm">← Apps Hub</a>
      <p class="text-slate-600 text-[11px] mt-1 hidden sm:block">← → ruku · 1/2/3 status · H hide · R reset</p>
    </div>
  </header>

  <main id="rukuHifz" class="glass-panel p-6">
        <!-- ================= Toolbar ================= -->
    <div class="flex flex-wrap items-center gap-3 pb-4 border-b border-white/10">
      <div class="flex items-center gap-2">
        <label for="surahSel" class="lbl">Surah</label>
        <select id="surahSel" class="input-field" style="width:auto;min-width:210px;padding:8px 10px"></select>
      </div>
      <div class="flex items-center gap-2">
        <label for="jumpInput" class="lbl">Ruku</label>
        <input id="jumpInput" type="text" inputmode="numeric" placeholder="120 or 2:5" title="Global ruku number (1-551), or surah:ruku like 2:5"
               class="input-field" style="width:110px;padding:8px 10px">
      </div>
      <div class="ml-auto flex items-center gap-2">
        <button id="nextNewBtn" class="chip" title="Jump to the next ruku you have not marked memorized">Next unmemorized</button>
        <button id="panelBtn" class="chip" title="Show progress by surah">Progress</button>
      </div>
    </div>

    <!-- ================= Global progress ================= -->
    <div class="mt-4">
      <div class="flex items-end justify-between mb-1.5">
        <span id="progLabel" class="text-xs text-slate-400">&nbsp;</span>
        <span id="progPct" class="text-xs font-semibold accent-text">0%</span>
      </div>
      <div class="track"><div id="progBar" class="track-fill" style="width:0%"></div></div>
    </div>

    <!-- ================= Surah progress panel ================= -->
    <div id="panel" class="hidden mt-4 rounded-xl border border-white/10 bg-slate-950/50 overflow-hidden">
      <div class="flex items-center gap-2 px-4 py-3 border-b border-white/10">
        <input id="panelFilter" class="input-field" style="padding:7px 10px;font-size:13px" placeholder="Filter surahs…">
        <button id="exportBtn" class="chip" title="Copy your progress as JSON">Export</button>
        <button id="importBtn" class="chip" title="Paste previously exported JSON">Import</button>
        <button id="resetBtn" class="chip chip-danger" title="Erase all memorization progress">Reset</button>
      </div>
      <div id="surahList" class="max-h-80 overflow-y-auto divide-y divide-white/5"></div>
    </div>

    <!-- ================= Ruku navigation ================= -->
    <div class="flex items-center gap-3 mt-6">
      <button id="prevBtn" class="navbtn" title="Previous ruku  (←)">&#8592;</button>
      <div class="flex-1 text-center min-w-0">
        <div id="crumbAr" class="arabic text-2xl leading-tight text-white truncate">&nbsp;</div>
        <div id="crumb" class="text-xs text-slate-400 mt-1">&nbsp;</div>
      </div>
      <button id="nextBtn" class="navbtn" title="Next ruku  (→)">&#8594;</button>
    </div>

    <!-- ================= Reader ================= -->
    <div id="reader" class="mt-5">

      <!-- verse that ENDS the previous ruku -->
      <div id="beforeWrap" class="ctx ctx-before">
        <div class="ctx-tag"><span class="ctx-arrow">&#8598;</span> <span id="beforeTag"></span></div>
        <p id="beforeText" class="arabic ctx-text"></p>
      </div>

      <!-- the ruku itself -->
      <div class="ruku-card">
        <div id="bismillah" class="arabic hidden text-center text-xl text-slate-300 mb-4 pb-4 border-b border-white/5"></div>
        <p id="rukuText" class="arabic ruku-text"></p>
        <div id="rukuStatus" class="text-center text-slate-500 text-sm py-8 hidden"></div>
      </div>

      <!-- verse that OPENS the next ruku -->
      <div id="afterWrap" class="ctx ctx-after">
        <div class="ctx-tag"><span id="afterTag"></span> <span class="ctx-arrow">&#8600;</span></div>
        <p id="afterText" class="arabic ctx-text"></p>
      </div>
    </div>

    <!-- ================= Controls ================= -->
    <div class="mt-6 pt-5 border-t border-white/10 flex flex-wrap items-center gap-x-6 gap-y-4">
      <div class="flex items-center gap-2">
        <span class="lbl">Recall</span>
        <div class="seg" id="modeSeg">
          <button data-mode="full"  class="seg-btn" title="Show the full text  (H cycles)">Show</button>
          <button data-mode="first" class="seg-btn" title="Only the first word of each ayah  (H cycles)">First word</button>
          <button data-mode="blind" class="seg-btn" title="Hide every ayah  (H cycles)">Hide</button>
        </div>
        <span class="text-xs text-slate-500 hidden sm:inline">tap an ayah to reveal</span>
      </div>

      <div class="flex items-center gap-2 ml-auto">
        <span class="lbl">Status</span>
        <div class="seg" id="statusSeg">
          <button data-st="0" class="seg-btn" title="Not started  (1)">New</button>
          <button data-st="1" class="seg-btn seg-learning" title="In progress  (2)">Learning</button>
          <button data-st="2" class="seg-btn seg-memorized" title="Memorized  (3)">Memorized</button>
        </div>
      </div>
      <div id="reviewed" class="text-xs text-slate-500 w-full sm:w-auto">&nbsp;</div>
    </div>
  </main>
</div>

  {id:110,en:"An-Nasr",ar:"النصر",stops:[3]},
  {id:111,en:"Al-Masad",ar:"المسد",stops:[5]},
  {id:112,en:"Al-Ikhlas",ar:"الإخلاص",stops:[4]},
  {id:113,en:"Al-Falaq",ar:"الفلق",stops:[5]},
  {id:114,en:"An-Nas",ar:"الناس",stops:[6]}
];

const AR_DIGITS = '٠١٢٣٤٥٦٧٨٩';
const toAr = n => String(n).replace(/\d/g, d => AR_DIGITS[+d]);
const BISMILLAH = 'بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ';

/* --- Flatten the table into one continuous list of rukus ----------------- */
const RUKUS = [];
const LAST_AYAH = {};
DB.forEach(su => {
  LAST_AYAH[su.id] = su.stops[su.stops.length - 1];
  let start = 1;
  su.stops.forEach((end, i) => {
    RUKUS.push({ g: RUKUS.length + 1, s: su.id, en: su.en, ar: su.ar,
                 n: i + 1, of: su.stops.length, start: start, end: end });
    start = end + 1;
  });
});
const TOTAL = RUKUS.length;

/* The whole point of the app: every ruku knows the verse that closes the one
   before it and the verse that opens the one after it, across surah borders. */
RUKUS.forEach(r => {
  r.before = r.start > 1 ? [r.s, r.start - 1]
           : r.s > 1     ? [r.s - 1, LAST_AYAH[r.s - 1]] : null;
  r.after  = r.end < LAST_AYAH[r.s] ? [r.s, r.end + 1]
           : r.s < 114              ? [r.s + 1, 1] : null;
});

const firstRukuOf = sid => RUKUS.find(r => r.s === sid).g;
const nameOf = sid => DB[sid - 1].en;

/* --- Persisted state ------------------------------------------------------ */
const KEY = 'rh1:state';
const state = { p: {}, last: 1, mode: 'full' };
try { Object.assign(state, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
if (!state.p || typeof state.p !== 'object') state.p = {};

const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };
const statusOf = g => (state.p[g] && state.p[g].s) || 0;

let cur = Math.min(Math.max(parseInt(state.last, 10) || 1, 1), TOTAL);
let revealed = new Set();   // ayah numbers manually revealed in the current ruku
let token = 0;              // guards against out-of-order fetch results

const $ = id => document.getElementById(id);

/* --- Verse text: fetched once per surah, then cached in localStorage ------ */
const mem = {};
async function surahVerses(n) {
  if (mem[n]) return mem[n];
  try {
    const cached = localStorage.getItem('rh1:s:' + n);
    if (cached) return (mem[n] = JSON.parse(cached));
  } catch (e) {}
  const res = await fetch('https://api.quran.com/api/v4/quran/verses/uthmani?chapter_number=' + n);
  const json = await res.json();
  const arr = [];                       // indexed by ayah number; slot 0 unused
  (json.verses || []).forEach(v => {
    const k = parseInt(String(v.verse_key).split(':')[1], 10);
    if (k && v.text_uthmani) arr[k] = v.text_uthmani.trim();
  });
  if (!arr.length) throw new Error('empty surah ' + n);
  mem[n] = arr;
  try { localStorage.setItem('rh1:s:' + n, JSON.stringify(arr)); } catch (e) {}  // quota: memory copy still stands
  return arr;
}

/* ------------------------------------------------------------------ render */
async function render() {
  const r = RUKUS[cur - 1];
  const mine = ++token;
  revealed = new Set();

  state.last = cur;
  save();

  $('crumbAr').textContent = r.ar;
  $('crumb').textContent =
    r.s + '. ' + r.en + '  ·  ruku ' + r.n + ' of ' + r.of +
    '  ·  ' + r.s + ':' + r.start + (r.end > r.start ? '–' + r.end : '') +
    '  ·  #' + r.g + ' of ' + TOTAL;
  $('surahSel').value = String(r.s);
  $('jumpInput').value = '';
  $('prevBtn').disabled = cur === 1;
  $('nextBtn').disabled = cur === TOTAL;

  $('bismillah').classList.toggle('hidden', !(r.start === 1 && r.s !== 1 && r.s !== 9));
  $('bismillah').textContent = BISMILLAH;

  paintStatus();
  paintProgress();

  $('rukuText').innerHTML = '';
  /* keep the bands in the layout while loading so the page does not jump */
  ['before', 'after'].forEach(w => {
    $(w + 'Wrap').classList.remove('hidden');
    $(w + 'Wrap').style.visibility = 'hidden';
  });
  const note = $('rukuStatus');
  note.classList.remove('hidden');
  note.textContent = 'Loading verses…';

  const wanted = new Set([r.s]);
  if (r.before) wanted.add(r.before[0]);
  if (r.after) wanted.add(r.after[0]);

  let texts;
  try {
    const ids = [...wanted];
    const loaded = await Promise.all(ids.map(surahVerses));
    texts = {};
    ids.forEach((id, i) => { texts[id] = loaded[i]; });
  } catch (e) {
    if (mine !== token) return;
    note.innerHTML = 'Could not load the verse text. Check your connection — ' +
                     'rukus you have opened before still work offline. ' +
                     '<button id="retryBtn" class="chip mt-3">Retry</button>';
    const retry = $('retryBtn');
    if (retry) retry.onclick = render;
    return;
  }
  if (mine !== token) return;

  note.classList.add('hidden');

  /* the ruku itself, mushaf-style: verses run together, each closed by its
     number, so the reader sees the flow rather than a list */
  let html = '';
  for (let a = r.start; a <= r.end; a++) {
    const t = (texts[r.s] || [])[a] || '';
    html += '<span class="ayah" data-a="' + a + '">' +
              '<span class="ayah-body">' + esc(t) + '</span>' +
              '<span class="ayah-num">' + toAr(a) + '</span>' +
            '</span> ';
  }
  $('rukuText').innerHTML = html;
  $('rukuText').querySelectorAll('.ayah').forEach(el => {
    el.addEventListener('click', () => {
      const a = +el.dataset.a;
      revealed.has(a) ? revealed.delete(a) : revealed.add(a);
      applyMode();
    });
  });

  fillCtx('before', r.before, texts, 'ends ruku #' + (r.g - 1));
  fillCtx('after',  r.after,  texts, 'opens ruku #' + (r.g + 1));

  applyMode();
  prefetchNeighbours();
}

function fillCtx(which, ref, texts, label) {
  const wrap = $(which + 'Wrap');
  const [sid, ayah] = ref || [];
  const text = ref && (texts[sid] || [])[ayah];
  if (!text) {
    /* the very first and very last ruku have no neighbour — collapse the band
       entirely rather than leaving an empty gap */
    wrap.classList.toggle('hidden', !ref);
    wrap.style.visibility = 'hidden';
    return;
  }
  wrap.style.visibility = 'visible';
  $(which + 'Tag').textContent = label + '  ·  ' + nameOf(sid) + ' ' + sid + ':' + ayah;
  $(which + 'Text').innerHTML = esc(text) + ' <span class="ayah-num">' + toAr(ayah) + '</span>';
}

/* Warm the surahs the arrow keys are about to need, so paging feels instant. */
function prefetchNeighbours() {
  [cur - 1, cur + 1].forEach(g => {
    const r = RUKUS[g - 1];
    if (!r) return;
    [r.s, r.before && r.before[0], r.after && r.after[0]].forEach(sid => {
      if (sid && !mem[sid]) surahVerses(sid).catch(() => {});
    });
  });
}

const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

/* ------------------------------------------------------------ recall modes */
function applyMode() {
  const mode = state.mode;
  $('modeSeg').querySelectorAll('.seg-btn')
    .forEach(b => b.classList.toggle('on', b.dataset.mode === mode));

  $('rukuText').querySelectorAll('.ayah').forEach(el => {
    const body = el.querySelector('.ayah-body');
    const shown = mode === 'full' || revealed.has(+el.dataset.a);
    el.classList.toggle('testing', mode !== 'full');
    body.classList.toggle('veiled', !shown);
    if (!shown && mode === 'first') {
      /* leave the opening word legible as the cue that starts recall */
      if (!body.dataset.orig) body.dataset.orig = body.innerHTML;
      const words = body.dataset.orig.split(' ');
      body.innerHTML = '<span class="cue">' + words[0] + '</span> ' +
                       '<span class="veil-inner">' + words.slice(1).join(' ') + '</span>';
      body.classList.remove('veiled');
    } else if (body.dataset.orig) {
      body.innerHTML = body.dataset.orig;
      delete body.dataset.orig;
    }
  });
}

/* ---------------------------------------------------------------- tracking */
function paintStatus() {
  const s = statusOf(cur);
  $('statusSeg').querySelectorAll('.seg-btn')
    .forEach(b => b.classList.toggle('on', +b.dataset.st === s));
  const entry = state.p[cur];
  $('reviewed').textContent = entry && entry.t
    ? 'Last marked ' + new Date(entry.t).toLocaleDateString(undefined,
        { year: 'numeric', month: 'short', day: 'numeric' })
    : 'Not marked yet';
}

function setStatus(s) {
  if (s === 0) delete state.p[cur]; else state.p[cur] = { s: s, t: Date.now() };
  save();
  paintStatus();
  paintProgress();
  if (panelOpen) buildSurahList();
}

function paintProgress() {
  let learning = 0, memorized = 0;
  for (const k in state.p) {
    const s = state.p[k].s;
    if (s === 1) learning++; else if (s === 2) memorized++;
  }
  const pct = Math.round(memorized / TOTAL * 100);
  $('progBar').style.width = pct + '%';
  $('progPct').textContent = pct + '%';
  $('progLabel').textContent =
    memorized + ' of ' + TOTAL + ' rukus memorized · ' + learning + ' in progress';
}

/* -------------------------------------------------------- navigation & UI */
function goTo(g) {
  const next = Math.min(Math.max(g, 1), TOTAL);
  if (next === cur) return;
  cur = next;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function nextUnmemorized() {
  for (let i = 1; i <= TOTAL; i++) {
    const g = ((cur - 1 + i) % TOTAL) + 1;
    if (statusOf(g) !== 2) { goTo(g); return; }
  }
  $('progLabel').textContent = 'Every ruku is marked memorized — ' + TOTAL + ' of ' + TOTAL + '.';
}

let panelOpen = false;

function buildSurahList() {
  const q = $('panelFilter').value.trim().toLowerCase();
  const rows = DB.filter(su =>
      !q || su.en.toLowerCase().includes(q) || su.ar.includes(q) || String(su.id) === q)
    .map(su => {
      const first = firstRukuOf(su.id);
      let done = 0, learning = 0;
      for (let i = 0; i < su.stops.length; i++) {
        const s = statusOf(first + i);
        if (s === 2) done++; else if (s === 1) learning++;
      }
      const pct = Math.round(done / su.stops.length * 100);
      return '<button class="surah-row" data-g="' + first + '">' +
               '<span class="surah-id">' + su.id + '</span>' +
               '<span class="surah-name">' + esc(su.en) + '</span>' +
               '<span class="arabic surah-ar">' + esc(su.ar) + '</span>' +
               '<span class="surah-count">' + done + '/' + su.stops.length +
                 (learning ? ' <span class="learning-dot" title="' + learning + ' in progress">●</span>' : '') +
               '</span>' +
               '<span class="mini"><span class="mini-fill" style="width:' + pct + '%"></span></span>' +
             '</button>';
    }).join('');
  $('surahList').innerHTML = rows || '<div class="p-4 text-sm text-slate-500">No surah matches that.</div>';
  $('surahList').querySelectorAll('.surah-row').forEach(b => {
    b.addEventListener('click', () => goTo(+b.dataset.g));
  });
}

function init() {
  $('surahSel').innerHTML = DB.map(su =>
    '<option value="' + su.id + '">' + su.id + '. ' + esc(su.en) + ' — ' + esc(su.ar) +
    ' (' + su.stops.length + ')</option>').join('');

  $('surahSel').addEventListener('change', e => goTo(firstRukuOf(+e.target.value)));

  $('jumpInput').addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const raw = e.target.value.trim();
    const m = raw.match(/^(\d+)\s*[:.\/-]\s*(\d+)$/);   // surah:ruku
    if (m) {
      const sid = +m[1], nth = +m[2];
      if (sid >= 1 && sid <= 114 && nth >= 1 && nth <= DB[sid - 1].stops.length) {
        goTo(firstRukuOf(sid) + nth - 1);
      }
    } else if (/^\d+$/.test(raw)) {
      goTo(+raw);                                        // global ruku number
    }
    e.target.value = '';
    e.target.blur();
  });

  $('prevBtn').addEventListener('click', () => goTo(cur - 1));
  $('nextBtn').addEventListener('click', () => goTo(cur + 1));
  $('nextNewBtn').addEventListener('click', nextUnmemorized);

  $('panelBtn').addEventListener('click', () => {
    panelOpen = !panelOpen;
    $('panel').classList.toggle('hidden', !panelOpen);
    $('panelBtn').classList.toggle('on', panelOpen);
    if (panelOpen) buildSurahList();
  });
  $('panelFilter').addEventListener('input', buildSurahList);

  $('modeSeg').querySelectorAll('.seg-btn').forEach(b => {
    b.addEventListener('click', () => {
      state.mode = b.dataset.mode;
      save();
      revealed = new Set();
      applyMode();
    });
  });
  $('statusSeg').querySelectorAll('.seg-btn').forEach(b => {
    b.addEventListener('click', () => setStatus(+b.dataset.st));
  });

  $('exportBtn').addEventListener('click', () => {
    const blob = JSON.stringify({ app: 'ruku-hifz', v: 1, p: state.p });
    navigator.clipboard.writeText(blob)
      .then(() => flash('exportBtn', 'Copied'))
      .catch(() => window.prompt('Copy your progress:', blob));
  });
  $('importBtn').addEventListener('click', () => {
    const raw = window.prompt('Paste previously exported progress JSON:');
    if (!raw) return;
    try {
      const data = JSON.parse(raw);
      if (!data || typeof data.p !== 'object') throw new Error('bad shape');
      state.p = data.p;
      save(); paintStatus(); paintProgress(); buildSurahList();
      flash('importBtn', 'Imported');
    } catch (e) { flash('importBtn', 'Invalid'); }
  });
  $('resetBtn').addEventListener('click', () => {
    if (!window.confirm('Erase memorization progress for all ' + TOTAL + ' rukus? This cannot be undone.')) return;
    state.p = {};
    save(); paintStatus(); paintProgress(); buildSurahList();
  });

  document.addEventListener('keydown', e => {
    if (e.target.matches('input, select, textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'ArrowLeft')  { goTo(cur - 1); e.preventDefault(); }
    if (e.key === 'ArrowRight') { goTo(cur + 1); e.preventDefault(); }
    if (e.key === '1') setStatus(0);
    if (e.key === '2') setStatus(1);
    if (e.key === '3') setStatus(2);
    if (e.key.toLowerCase() === 'h') {
      const order = ['full', 'first', 'blind'];
      state.mode = order[(order.indexOf(state.mode) + 1) % 3];
      save(); revealed = new Set(); applyMode();
    }
    if (e.key.toLowerCase() === 'r') { revealed = new Set(); state.mode = 'full'; save(); applyMode(); }
  });

  render();
}

function flash(id, msg) {
  const b = $(id), old = b.textContent;
  b.textContent = msg;
  setTimeout(() => { b.textContent = old; }, 1200);
}

init();
</script>

<script>
// Shared login gate — do not modify.
function _login() {
  var u = document.getElementById('loginUsername').value;
  var p = document.getElementById('loginPassword').value;
  if (u.toLowerCase() === 'ibrahim' && p === 'ibrahimwin') {
    document.getElementById('loginView').style.display = 'none';
  } else {
    var err = document.getElementById('loginError');
    err.style.display = 'block';
    var inputs = [document.getElementById('loginUsername'), document.getElementById('loginPassword')];
    inputs.forEach(function(el) {
      el.style.borderColor = '#ef4444';
      setTimeout(function() { el.style.borderColor = '#334155'; }, 1000);
    });
  }
}
document.getElementById('loginUsername').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') _login();
});
</script>
