<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habit Tracker</title>
  <link rel="icon" type="image/png" href="../../assets/ibrahim-image-circle.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { background-color: #020617; }
    body {
      background: #020617;
      color: #f1f5f9;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      padding: 0;
      overflow: hidden;
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

    /* ---- Board: three pillars filling the viewport, side by side ---- */
    #habitTrackerApp {
      position: fixed;
      inset: 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: 1fr;
      gap: 7px;
      padding: 7px;
      background: #020617;
    }

    /* ---- Pillar: three habits stacked, framed in the pillar's accent ---- */
    .pillar {
      position: relative;
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: repeat(3, 1fr);
      /* Grid items default to min-width/min-height auto, so a long habit name would
         push its track wider than 1fr and shove the last pillar off screen. */
      min-width: 0;
      min-height: 0;
      /* 1px gap + this background = single hairlines BETWEEN boxes only.
         Nothing is drawn at the perimeter, so the accent frame never doubles. */
      gap: 1px;
      background: rgba(148, 163, 184, 0.13);
      border: 6px solid var(--pillar-line);
      border-radius: 14px;
      box-shadow: 0 0 26px var(--pillar-halo);
    }
    /* The frame is not clipped (a popped box has to leave the pillar), so the
       corner boxes round themselves to sit inside it. */
    .pillar > .box:first-of-type { border-radius: 8px 8px 0 0; }
    .pillar > .box:last-of-type  { border-radius: 0 0 8px 8px; }

    .pillar-tag {
      position: absolute;
      top: 0;
      left: 0;
      display: flex;
      align-items: baseline;
      gap: 0.4rem;
      padding: 0.3rem 0.7rem 0.35rem;
      border-radius: 7px 0 0.7rem 0;
      background: rgba(2, 6, 23, 0.78);
      backdrop-filter: blur(8px);
      border-right: 1px solid rgba(148, 163, 184, 0.14);
      border-bottom: 1px solid rgba(148, 163, 184, 0.14);
      font-size: clamp(0.55rem, 1.1vh, 0.7rem);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--accent);
      pointer-events: none;
      white-space: nowrap;
      /* Above a popped box (z-index 10) so the pillar score stays readable while hovering. */
      z-index: 20;
    }
    .pillar-tag .pillar-score {
      font-size: 0.9em;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: #64748b;
      font-variant-numeric: tabular-nums;
    }

    /* ---- Box: one habit. Fills bottom-up with the last seven days ---- */
    .box {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
      padding: 1.6rem 0.6rem 0.6rem;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      cursor: pointer;
      user-select: none;
      font-family: inherit;
      text-align: center;
      border: 0;
      -webkit-tap-highlight-color: transparent;
      background-color: #070c16;
      /* Six hairlines at each seventh — the fill level lands on one, so the week
         reads at a glance without anyone counting bars. */
      background-image: repeating-linear-gradient(
        to top,
        transparent 0,
        transparent calc(100% / 7 - 1px),
        rgba(148, 163, 184, 0.14) calc(100% / 7 - 1px),
        rgba(148, 163, 184, 0.14) calc(100% / 7)
      );
      color: #64748b;
      transition: transform 200ms cubic-bezier(.2, .8, .2, 1),
                  box-shadow 260ms ease, color 220ms ease, background-color 200ms ease;
    }
    .box:hover { color: #cbd5e1; background-color: #0c1626; }
    .box:focus-visible { outline: 2px solid var(--accent); outline-offset: -5px; }

    .box .fill {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 0;
      background: linear-gradient(to top, var(--fill-strong), var(--fill-soft));
      border-top: 1px solid var(--fill-line);
      transition: height 340ms cubic-bezier(.2, .8, .2, 1), border-color 240ms ease;
      pointer-events: none;
    }

    .box .badge,
    .box .name,
    .box .gist,
    .box .icon,
    .box .week,
    .box .count { position: relative; z-index: 1; }

    /* Stroke-only and sized in vh, so it takes the box text colour and stays sharp
       at 1.6x on hover. */
    .box .icon {
      display: block;
      flex: 0 0 auto;
      width: clamp(22px, 5.2vh, 40px);
      height: clamp(22px, 5.2vh, 40px);
      color: #8296ae;
      transition: color 220ms ease;
    }
    .box .icon svg { display: block; width: 100%; height: 100%; }

    .box .badge {
      position: absolute;
      top: 0.45rem;
      left: 0.6rem;
      font-size: clamp(0.5rem, 1.1vh, 0.65rem);
      font-weight: 800;
      letter-spacing: 0.14em;
      color: rgba(148, 163, 184, 0.55);
    }
    /* The pillar tag sits in the top-left corner of the pillar, which is the first
       box's badge corner. That box gives the corner up and takes the other one. */
    .pillar > .box:first-of-type .badge { left: auto; right: 0.6rem; }
    .box .name {
      font-size: clamp(0.62rem, 1.8vh, 1.05rem);
      font-weight: 700;
      line-height: 1.15;
      color: #e2e8f0;
      letter-spacing: -0.01em;
    }
    .box .gist {
      font-size: clamp(0.58rem, 1.35vh, 0.8rem);
      line-height: 1.4;
      color: #94a3b8;
      max-width: 92%;
    }

    /* ---- The week: seven bars, today on the right ---- */
    .box .week {
      display: flex;
      flex-direction: column;
      gap: 2px;
      width: min(78%, 190px);
      margin-top: 0.15rem;
    }
    .box .strip { display: flex; gap: 3px; }
    .box .strip span {
      flex: 1 1 0;
      height: clamp(4px, 0.85vh, 7px);
      border-radius: 2px;
      background: rgba(148, 163, 184, 0.18);
      transition: background 200ms ease;
    }
    .box .strip span.on { background: var(--fill-line); }
    .box .strip span.today { box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.45); }
    .box .dlab { display: flex; gap: 3px; }
    .box .dlab span {
      flex: 1 1 0;
      text-align: center;
      font-size: clamp(0.44rem, 0.95vh, 0.58rem);
      font-weight: 700;
      color: #475569;
    }

    .box .count {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      margin-top: 0.1rem;
      font-size: clamp(0.5rem, 1.15vh, 0.7rem);
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #475569;
      font-variant-numeric: tabular-nums;
    }
    .box .count .flame { display: inline-flex; align-items: center; gap: 0.2rem; }
    .box .count .flame svg { width: 0.85em; height: 0.85em; }

    /* Done today: the state a tap actually changes, so it gets the ring. */
    .box.done { box-shadow: inset 0 0 0 2px var(--fill-line); }
    .box.done .name { color: #f8fafc; }
    .box.done .gist { color: #cbd5e1; }
    .box.done .icon { color: #cbd5e1; }
    .box.done .badge { color: var(--accent); }
    .box.done .count { color: #cbd5e1; }

    /* Every one of the last seven days done. */
    .box.full {
      box-shadow: inset 0 0 0 1px var(--fill-line), inset 0 0 60px rgba(255, 255, 255, 0.10);
    }
    .box.full .name, .box.full .gist { color: #fff; text-shadow: 0 1px 10px rgba(0, 0, 0, 0.45); }
    .box.full .icon { color: #fff; }
    .box.full .count { color: var(--accent); }
    .box.full .badge { color: rgba(255, 255, 255, 0.7); }

    /* ---- Hover pop: the box grows in place so it can be read before it is tapped ----
       transform-origin is pinned per position rather than left at centre. A box is a
       third of the viewport each way, so at 1.6x it lands on screen only when anchored
       to the edge it already sits on. Centre-origin would push the outer columns off.
       Mouse only: touch has no hover, and :hover sticks after a tap there. */
    .pillar:nth-of-type(1) .box:nth-of-type(1) { transform-origin: left top; }
    .pillar:nth-of-type(1) .box:nth-of-type(2) { transform-origin: left center; }
    .pillar:nth-of-type(1) .box:nth-of-type(3) { transform-origin: left bottom; }
    .pillar:nth-of-type(2) .box:nth-of-type(1) { transform-origin: center top; }
    .pillar:nth-of-type(2) .box:nth-of-type(2) { transform-origin: center center; }
    .pillar:nth-of-type(2) .box:nth-of-type(3) { transform-origin: center bottom; }
    .pillar:nth-of-type(3) .box:nth-of-type(1) { transform-origin: right top; }
    .pillar:nth-of-type(3) .box:nth-of-type(2) { transform-origin: right center; }
    .pillar:nth-of-type(3) .box:nth-of-type(3) { transform-origin: right bottom; }

    @media (hover: hover) and (pointer: fine) {
      .box:hover,
      .box:focus-visible {
        transform: scale(1.6);
        z-index: 10;
        border-radius: 8px;
        box-shadow: 0 0 0 1px var(--accent), 0 8px 22px rgba(0, 0, 0, 0.72);
      }
      /* The box is opaque, so an enlarged one hides the neighbours it covers.
         What you see under the pointer is always what a click will hit. */
      .box.done:hover,
      .box.done:focus-visible {
        box-shadow: 0 0 0 2px var(--fill-line), 0 8px 22px rgba(0, 0, 0, 0.72);
      }
    }

    /* ---- Floating status pill: sits over the board, never takes a box ---- */
    /* Corner-anchored: dead centre sat on a box and stole its taps. */
    #hud {
      position: fixed;
      bottom: 0.85rem;
      right: 0.85rem;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.4rem 0.4rem 0.4rem 0.9rem;
      border-radius: 9999px;
      background: rgba(2, 6, 23, 0.86);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 10px 34px rgba(0, 0, 0, 0.65);
      font-size: 0.74rem;
      white-space: nowrap;
    }
    #hud .count { font-weight: 700; color: #10b981; font-variant-numeric: tabular-nums; }
    #hud .perfect { color: #64748b; font-variant-numeric: tabular-nums; }
    #hud a, #hud button {
      color: #94a3b8;
      background: rgba(148, 163, 184, 0.10);
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: 9999px;
      padding: 0.25rem 0.65rem;
      font-size: 0.66rem;
      font-weight: 600;
      font-family: inherit;
      text-decoration: none;
      cursor: pointer;
      transition: color 0.2s, background 0.2s;
    }
    #hud a:hover, #hud button:hover { color: #fff; background: rgba(148, 163, 184, 0.22); }

    /* Below the split the pillars stack as bands, so the boxes run across instead
       of down — and the pop origins transpose with them. */
    @media (max-width: 900px) {
      #habitTrackerApp {
        grid-template-columns: 1fr;
        grid-template-rows: repeat(3, 1fr);
        gap: 5px;
        padding: 5px;
      }
      .pillar { grid-template-columns: repeat(3, 1fr); grid-template-rows: 1fr; border-width: 4px; }
      .pillar > .box:first-of-type { border-radius: 8px 0 0 8px; }
      .pillar > .box:last-of-type  { border-radius: 0 8px 8px 0; }

      .pillar:nth-of-type(1) .box:nth-of-type(1) { transform-origin: left top; }
      .pillar:nth-of-type(1) .box:nth-of-type(2) { transform-origin: center top; }
      .pillar:nth-of-type(1) .box:nth-of-type(3) { transform-origin: right top; }
      .pillar:nth-of-type(2) .box:nth-of-type(1) { transform-origin: left center; }
      .pillar:nth-of-type(2) .box:nth-of-type(2) { transform-origin: center center; }
      .pillar:nth-of-type(2) .box:nth-of-type(3) { transform-origin: right center; }
      .pillar:nth-of-type(3) .box:nth-of-type(1) { transform-origin: left bottom; }
      .pillar:nth-of-type(3) .box:nth-of-type(2) { transform-origin: center bottom; }
      .pillar:nth-of-type(3) .box:nth-of-type(3) { transform-origin: right bottom; }

      #hud { bottom: 0.6rem; right: 0.6rem; }
    }
    @media (max-width: 520px) {
      .box { padding: 1.3rem 0.25rem 0.4rem; gap: 0.2rem; }
      /* The icon and the week survive where the sentence does not: on a small screen
         they identify the habit and its state faster than the gist does. */
      .box .gist { display: none; }
      .box .dlab { display: none; }
      .box .icon { width: clamp(18px, 4vh, 28px); height: clamp(18px, 4vh, 28px); }
      .box .name { font-size: clamp(0.55rem, 1.5vh, 0.8rem); }
      .box .week { width: 86%; }
    }
  </style>
</head>
<body>

<!-- LOGIN OVERLAY (do not modify — shared site-wide access gate, see CLAUDE.md) -->
<div id="loginView" style="position:fixed;inset:0;z-index:9999;background:#030712;display:flex;align-items:center;justify-content:center;padding:1rem">
  <div style="width:100%;max-width:360px;background:rgba(15,23,42,0.95);border:1px solid rgba(255,255,255,0.08);border-radius:1.25rem;padding:2rem;box-shadow:0 25px 50px -12px rgba(0,0,0,0.8)">
    <div style="text-align:center;margin-bottom:1.5rem">
      <div style="width:3.5rem;height:3.5rem;background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.3);border-radius:9999px;display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;font-size:1.5rem">🔒</div>
      <h2 style="color:white;font-size:1.25rem;font-weight:700;margin:0 0 0.25rem">Secure Access</h2>
      <p style="color:#64748b;font-size:0.7rem;text-transform:uppercase;letter-spacing:0.1em;margin:0">Private App</p>
    </div>
    <div style="display:flex;flex-direction:column;gap:1rem">
      <div>
        <label style="display:block;color:#94a3b8;font-size:0.7rem;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:0.4rem">Username</label>
        <input type="text" id="loginUsername" placeholder="Enter username" autocomplete="username"
          style="width:100%;background:#1e293b;border:1px solid #334155;color:white;border-radius:0.75rem;padding:0.75rem 1rem;font-size:0.875rem;outline:none;box-sizing:border-box;transition:border-color 0.2s"
          onfocus="this.style.borderColor='#10b981'" onblur="this.style.borderColor='#334155'">
      </div>
      <div>
        <label style="display:block;color:#94a3b8;font-size:0.7rem;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:0.4rem">Password</label>
        <input type="password" id="loginPassword" placeholder="Enter password" autocomplete="current-password"
          style="width:100%;background:#1e293b;border:1px solid #334155;color:white;border-radius:0.75rem;padding:0.75rem 1rem;font-size:0.875rem;outline:none;box-sizing:border-box;transition:border-color 0.2s"
          onfocus="this.style.borderColor='#10b981'" onblur="this.style.borderColor='#334155'"
          onkeydown="if(event.key==='Enter')_login()">
      </div>
      <button onclick="_login()"
        style="width:100%;background:#059669;color:white;font-weight:700;padding:0.75rem 1rem;border-radius:0.75rem;border:none;cursor:pointer;font-size:0.875rem;transition:background 0.2s;margin-top:0.25rem"
        onmouseover="this.style.background='#10b981'" onmouseout="this.style.background='#059669'">
        Unlock
      </button>
      <p id="loginError" style="display:none;text-align:center;color:#f87171;font-size:0.75rem;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.2);border-radius:0.5rem;padding:0.5rem;margin:0">
        Incorrect credentials. Try again.
      </p>
    </div>
  </div>
</div>

<main id="habitTrackerApp" aria-label="Habit Tracker board"></main>

<div id="hud">
  <span><strong style="color:#fff">Habit Tracker</strong></span>
  <span><span class="count" id="hudCount">0</span><span style="color:#64748b">/9 today</span></span>
  <span class="perfect"><span id="hudPerfect">0</span> perfect</span>
  <button id="hudClear" type="button" title="Unmark every habit for today">Clear</button>
  <a href="../../links/">&larr; Hub</a>
</div>

<script>
// === App logic ===
(function () {
  var STORE = 'habit-tracker.v1';
  var KEEP_DAYS = 180;          // how far back history is retained
  var WINDOW = 7;               // days shown per habit, and the height of a full box

  // Same stroke system as the Life Track figures: one 48x48 grid, stroke only, so an
  // icon takes the pillar colour and stays sharp when a box scales up on hover.
  var S = '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" ' +
          'stroke-linecap="round" stroke-linejoin="round">';
  function dot(x, y, r) {
    return '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="currentColor" stroke="none"/>';
  }
  // Ground lines and surroundings are drawn thinner and dimmer than the subject, so the
  // figure and its context never carry equal weight.
  function env(d) {
    return '<path d="' + d + '" stroke-width="1.5" stroke-opacity="0.5"/>';
  }

  var PILLARS = [
    { id: 'attention', label: 'Attention', accent: '96, 165, 250' },
    { id: 'energy',    label: 'Energy',    accent: '251, 191, 36' },
    { id: 'happiness', label: 'Happiness', accent: '167, 139, 250' }
  ];

  // The nine micro-habits, matching apps/habit-cards so both pages describe the same set.
  var HABITS = [
    { id: 'click', pillar: 'attention', name: 'Correct After the Click', key: 'CATCH',
      gist: 'Slip happens, attach a good action right after',
      // A slip, then a U-turn: you cannot stop the reflex, you redirect what follows it.
      icon: S + dot(11, 40, 3) + '<path d="M11 36V22a10 10 0 0 1 20 0v12"/>' +
            '<path d="M24 28l7 7 7-7"/></svg>' },

    { id: 'input', pillar: 'attention', name: 'Control Your Input', key: 'BATCH',
      gist: 'Batch inputs into windows, touch each once',
      icon: S + '<path d="M7 10h34L28 25v13l-8-4V25z"/></svg>' },

    { id: 'write', pillar: 'attention', name: 'Write to Think', key: 'INK',
      gist: 'Hand-write three questions before any hard call',
      icon: S + '<path d="M32 7l9 9-21 21-11 2 2-11z"/><path d="M28 11l9 9"/>' +
            env('M8 43h32') + '</svg>' },

    { id: 'quantize', pillar: 'energy', name: 'Quantize the Action', key: 'SHRINK',
      gist: 'Shrink it to the smallest possible start',
      icon: S + '<rect x="19" y="19" width="10" height="10" rx="2"/>' +
            '<path d="M7 7l8 8"/><path d="M7 14V7h7"/>' +
            '<path d="M41 7l-8 8"/><path d="M41 14V7h-7"/>' +
            '<path d="M7 41l8-8"/><path d="M7 34v7h7"/>' +
            '<path d="M41 41l-8-8"/><path d="M41 34v7h-7"/></svg>' },

    { id: 'caffeine', pillar: 'energy', name: 'Cut Caffeine Before Bed', key: 'CUTOFF',
      gist: 'Last coffee at least six hours before sleep',
      icon: S + '<path d="M9 15h22v13a11 11 0 0 1-22 0z"/>' +
            '<path d="M31 18h4a5 5 0 0 1 0 10h-4"/>' + env('M7 42h28') +
            '<path d="M8 8l32 32"/></svg>' },

    { id: 'waves', pillar: 'energy', name: 'Ride the Waves', key: 'WAVE',
      gist: 'Focus about 90 minutes, then a real break',
      icon: S + '<path d="M6 24c4-10 8-10 12 0s8 10 12 0 8-10 12 0"/></svg>' },

    { id: 'lookup', pillar: 'happiness', name: 'Look Up', key: 'SKY',
      gist: 'Look up at the night sky, let it be bigger than you',
      icon: S + '<path d="M22 8l3.2 9.8L35 21l-9.8 3.2L22 34l-3.2-9.8L9 21l9.8-3.2z"/>' +
            '<path d="M37 27l1.6 4.4L43 33l-4.4 1.6L37 39l-1.6-4.4L31 33l4.4-1.6z"/></svg>' },

    { id: 'mirror', pillar: 'happiness', name: 'Look in the Mirror', key: 'MIRROR',
      gist: 'Name one thing you are grateful for, out loud',
      icon: S + '<ellipse cx="24" cy="19" rx="12" ry="14"/>' +
            '<path d="M17 13a9 11 0 0 0-2 8"/><path d="M24 33v7"/>' + env('M15 42h18') + '</svg>' },

    { id: 'forgive', pillar: 'happiness', name: 'Forgive Yourself', key: 'FORGIVE',
      gist: 'Streak broke? Note it and begin again, no spiral',
      // Begin again, kindly: the loop comes back round to a heart rather than a scold.
      icon: S + '<path d="M38 24a14 14 0 1 1-4.1-9.9"/><path d="M28 9l6 6-6 6"/>' +
            '<path d="M24 32c-5.2-3.5-8.2-6-8.2-9.1a4.2 4.2 0 0 1 8.2-1.4 4.2 4.2 0 0 1 8.2 1.4' +
            'c0 3.1-3 5.6-8.2 9.1z"/></svg>' }
  ];

  var FLAME = '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4" ' +
              'stroke-linejoin="round"><path d="M24 43c-7 0-12-5-12-11 0-8 8-12 8-22 0 0 8 5 8 13' +
              '1.5-2 2-5 2-5s6 5 6 14c0 6-5 11-12 11z"/></svg>';

  // Dates are handled as local YYYY-MM-DD strings and stepped with setDate, never as UTC
  // millisecond maths, so a day boundary lands where the user actually is.
  function iso(d) {
    return d.getFullYear() + '-' +
           ('0' + (d.getMonth() + 1)).slice(-2) + '-' +
           ('0' + d.getDate()).slice(-2);
  }
  function today() { return iso(new Date()); }
  function parse(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function shift(s, n) { var d = parse(s); d.setDate(d.getDate() + n); return iso(d); }
  function letterOf(s) { return ['S', 'M', 'T', 'W', 'T', 'F', 'S'][parse(s).getDay()]; }

  // Unlike the Life Track board this keeps history, so it is stored as a map of habit
  // id to the days it was done rather than being thrown away at midnight.
  function load() {
    try {
      var raw = localStorage.getItem(STORE);
      var parsed = raw ? JSON.parse(raw) : null;
      return (parsed && typeof parsed === 'object') ? parsed : {};
    } catch (e) { return {}; }
  }
  function save() {
    try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) { /* private mode */ }
  }

  var state = load();
  var mounted = today();

  function daysOf(id) {
    if (!Array.isArray(state[id])) state[id] = [];
    return state[id];
  }
  function isDone(id, d) { return daysOf(id).indexOf(d) !== -1; }

  function windowDays() {
    var out = [], d = today(), i;
    for (i = WINDOW - 1; i >= 0; i--) out.push(shift(d, -i));
    return out;
  }

  // Counts back from today, or from yesterday while today is still open. An unfinished
  // day should not read as a broken streak until the day is actually over.
  function streakOf(id) {
    var d = today();
    if (!isDone(id, d)) d = shift(d, -1);
    var n = 0;
    while (isDone(id, d)) { n++; d = shift(d, -1); }
    return n;
  }

  function perfectDays() {
    var tally = {}, n = 0, d;
    HABITS.forEach(function (h) {
      daysOf(h.id).forEach(function (day) { tally[day] = (tally[day] || 0) + 1; });
    });
    for (d in tally) if (tally[d] === HABITS.length) n++;
    return n;
  }

  // A tap marks today done; a tap on a habit already done today unmarks it.
  function toggle(habit) {
    var d = today();
    var a = daysOf(habit.id);
    var i = a.indexOf(d);
    if (i === -1) a.push(d); else a.splice(i, 1);
    var cutoff = shift(d, -KEEP_DAYS);
    state[habit.id] = a.filter(function (x) { return x >= cutoff; }).sort();
    save();
    repaintAll();
  }

  var board = document.getElementById('habitTrackerApp');
  var hudCount = document.getElementById('hudCount');
  var hudPerfect = document.getElementById('hudPerfect');

  // The box carries three separate facts and each has exactly one carrier: the fill is
  // how much of the last week is done, the ring is whether today is done, and the flame
  // is the run. Conflating them is what made the old card layout hard to read at a glance.
  function paint(habit) {
    var days = windowDays();
    var t = today();
    var done = days.filter(function (d) { return isDone(habit.id, d); }).length;
    var onToday = isDone(habit.id, t);
    var el = habit.el;

    el.querySelector('.fill').style.height = (done / WINDOW * 100) + '%';
    el.querySelector('.strip').innerHTML = days.map(function (d) {
      return '<span class="' + (isDone(habit.id, d) ? 'on' : '') +
             (d === t ? ' today' : '') + '" title="' + d + '"></span>';
    }).join('');
    el.querySelector('.dlab').innerHTML = days.map(function (d) {
      return '<span>' + letterOf(d) + '</span>';
    }).join('');
    el.querySelector('.wk').textContent = done + '/' + WINDOW + ' wk';
    el.querySelector('.stk').textContent = streakOf(habit.id);

    el.classList.toggle('done', onToday);
    el.classList.toggle('full', done === WINDOW);
    el.setAttribute('aria-pressed', onToday ? 'true' : 'false');
  }

  function paintPillar(pillar) {
    var t = today();
    var done = pillar.habits.filter(function (h) { return isDone(h.id, t); }).length;
    pillar.scoreEl.textContent = done + '/' + pillar.habits.length;
  }

  function paintTotal() {
    var t = today();
    hudCount.textContent = HABITS.filter(function (h) { return isDone(h.id, t); }).length;
    hudPerfect.textContent = perfectDays();
  }

  PILLARS.forEach(function (pillar) {
    pillar.habits = HABITS.filter(function (h) { return h.pillar === pillar.id; });

    var col = document.createElement('section');
    col.className = 'pillar';
    col.style.setProperty('--accent', 'rgb(' + pillar.accent + ')');
    col.style.setProperty('--fill-strong', 'rgba(' + pillar.accent + ', 0.82)');
    col.style.setProperty('--fill-soft', 'rgba(' + pillar.accent + ', 0.30)');
    col.style.setProperty('--fill-line', 'rgba(' + pillar.accent + ', 0.85)');
    col.style.setProperty('--pillar-line', 'rgba(' + pillar.accent + ', 0.55)');
    col.style.setProperty('--pillar-halo', 'rgba(' + pillar.accent + ', 0.16)');
    col.setAttribute('aria-label', pillar.label);

    var tag = document.createElement('div');
    tag.className = 'pillar-tag';
    tag.innerHTML = pillar.label +
                    ' <span class="pillar-score">0/' + pillar.habits.length + '</span>';
    col.appendChild(tag);
    pillar.scoreEl = tag.querySelector('.pillar-score');

    pillar.habits.forEach(function (habit) {
      var el = document.createElement('button');
      el.type = 'button';
      el.className = 'box';
      el.setAttribute('aria-pressed', 'false');
      el.setAttribute('aria-label', pillar.label + ' — ' + habit.name + '. ' + habit.gist);
      el.innerHTML =
        '<span class="fill"></span>' +
        '<span class="badge">' + habit.key + '</span>' +
        '<span class="icon" aria-hidden="true">' + habit.icon + '</span>' +
        '<span class="name">' + habit.name + '</span>' +
        '<span class="gist">' + habit.gist + '</span>' +
        '<span class="week">' +
          '<span class="strip"></span>' +
          '<span class="dlab"></span>' +
        '</span>' +
        '<span class="count"><span class="wk">0/7 wk</span>' +
        '<span class="flame">' + FLAME + '<span class="stk">0</span></span></span>';
      el.addEventListener('click', function () { toggle(habit); });
      habit.el = el;
      col.appendChild(el);
    });

    board.appendChild(col);
  });

  function repaintAll() {
    HABITS.forEach(paint);
    PILLARS.forEach(paintPillar);
    paintTotal();
  }

  document.getElementById('hudClear').addEventListener('click', function () {
    var d = today();
    HABITS.forEach(function (h) {
      var a = daysOf(h.id);
      var i = a.indexOf(d);
      if (i !== -1) a.splice(i, 1);
    });
    save();
    repaintAll();
  });

  // A tab left open overnight should roll onto the new day rather than keep filling
  // yesterday, and another tab may have written since this one last painted.
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) return;
    state = load();
    mounted = today();
    repaintAll();
  });
  window.addEventListener('focus', function () {
    if (today() !== mounted) { mounted = today(); repaintAll(); }
  });

  repaintAll();
})();
</script>

<script>
// Shared login gate — do not modify.
function _login() {
  var u = document.getElementById('loginUsername').value;
  var p = document.getElementById('loginPassword').value;
  if (u.toLowerCase() === 'ibrahim' && p === 'ibrahimwin') {
    document.getElementById('loginView').style.display = 'none';
  } else {
    var err = document.getElementById('loginError');
    err.style.display = 'block';
    var inputs = [document.getElementById('loginUsername'), document.getElementById('loginPassword')];
    inputs.forEach(function(el) {
      el.style.borderColor = '#ef4444';
      setTimeout(function() { el.style.borderColor = '#334155'; }, 1000);
    });
  }
}
document.getElementById('loginUsername').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') _login();
});
</script>
</body>
