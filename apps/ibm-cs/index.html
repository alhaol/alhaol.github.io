        // Global function to load the iframe only when user clicks
        window.loadVideo = function(container, id, title) {
            container.innerHTML = `
                <iframe 
                    class="absolute top-0 left-0 w-full h-full"
                    src="https://www.youtube.com/embed/${id}?autoplay=1" 
                    title="${title}" 
                    frameborder="0" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
                </iframe>
            `;
            // Remove the onclick handler to prevent reloading
            container.removeAttribute('onclick');
            container.classList.remove('cursor-pointer');
        };

        const container = document.getElementById('video-grid');

        videos.forEach(video => {
            const card = document.createElement('div');
            card.className = "bg-white rounded-xl shadow-md overflow-hidden hover:shadow-lg transition-shadow duration-300 flex flex-col";
            
            // Render thumbnail and play button first (Facade Pattern)
            card.innerHTML = `
                <div class="relative w-full cursor-pointer group" style="padding-top: 56.25%;" onclick="loadVideo(this, '${video.id}', '${video.title}')">
                    <img 
                        src="https://i.ytimg.com/vi/${video.id}/hqdefault.jpg" 
                        class="absolute top-0 left-0 w-full h-full object-cover group-hover:opacity-90 transition-opacity"
                        alt="${video.title}"
                    >
                    <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-red-600 text-white rounded-full w-16 h-16 flex items-center justify-center shadow-lg group-hover:bg-red-700 transition-colors z-10">
                        <i class="fas fa-play text-2xl ml-1"></i>
                    </div>
                    <div class="absolute inset-0 bg-black bg-opacity-0 group-hover:bg-opacity-10 transition-all duration-300"></div>
                </div>
                <div class="p-5 flex flex-col flex-grow">
                    <div class="flex items-start justify-between mb-2">
                        <span class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded">#${video.no}</span>
                        <div class="flex items-center text-gray-500 text-sm">
                            <i class="far fa-clock mr-1"></i>
                            <span>${video.userTime} min</span>
                        </div>
                    </div>
                    <h3 class="text-lg font-bold text-gray-900 leading-tight mb-2 line-clamp-2" title="${video.title}">
                        <a href="${video.url}" target="_blank" class="hover:text-blue-600 transition-colors">
                            ${video.title}
                        </a>
                    </h3>
                    <div class="mt-auto pt-4 border-t border-gray-100 text-sm text-gray-600 flex justify-between items-center">
                        <span class="font-medium flex items-center">
                            <i class="fab fa-youtube text-red-600 mr-2"></i> ${video.channel}
                        </span>
                        <div class="flex space-x-3 text-xs text-gray-400">
                           <span>${video.views} views</span>
                        </div>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });
