<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Life Track</title>
  <link rel="icon" type="image/png" href="../../assets/ibrahim-image-circle.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { background-color: #020617; }
    body {
      background: #020617;
      color: #f1f5f9;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      padding: 0;
      overflow: hidden;
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

    /* ---- Board: four quadrants filling the viewport, 2 x 2 ---- */
    #lifeTrackApp {
      position: fixed;
      inset: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 7px;
      padding: 7px;
      background: #020617;
    }

    /* ---- Quadrant: seven boxes, four over three, framed in the group's accent ---- */
    .quad {
      position: relative;
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      grid-template-rows: 1fr 1fr;
      /* 1px gap + this background = single hairlines BETWEEN boxes only.
         Nothing is drawn at the perimeter, so the accent frame never doubles. */
      gap: 1px;
      background: rgba(148, 163, 184, 0.13);
      border: 6px solid var(--quad-line);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 0 26px var(--quad-halo);
    }
    .quad-tag {
      position: absolute;
      top: 0;
      left: 0;
      display: flex;
      align-items: baseline;
      gap: 0.4rem;
      padding: 0.3rem 0.7rem 0.35rem;
      border-radius: 7px 0 0.7rem 0;
      background: rgba(2, 6, 23, 0.78);
      backdrop-filter: blur(8px);
      border-right: 1px solid rgba(148, 163, 184, 0.14);
      border-bottom: 1px solid rgba(148, 163, 184, 0.14);
      font-size: clamp(0.55rem, 1.1vh, 0.7rem);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--accent);
      pointer-events: none;
      white-space: nowrap;
      /* Above a popped box (z-index 10) so the group score stays readable while hovering. */
      z-index: 20;
    }
    .quad-tag .quad-score {
      font-size: 0.9em;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: #64748b;
      font-variant-numeric: tabular-nums;
    }

    /* ---- Box: one of seven, fills bottom-up over seven taps ---- */
    .box {
      grid-column: span 3;               /* row 1: four boxes x 3 cols */
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.2rem;
      padding: 1.6rem 0.5rem 0.5rem;
      overflow: hidden;
      cursor: pointer;
      user-select: none;
      font-family: inherit;
      text-align: center;
      -webkit-tap-highlight-color: transparent;
      background-color: #070c16;
      /* Six hairlines at each seventh — the fill level lands on one, so the
         count reads at a glance without anyone squinting at the number. */
      background-image: repeating-linear-gradient(
        to top,
        transparent 0,
        transparent calc(100% / 7 - 1px),
        rgba(148, 163, 184, 0.14) calc(100% / 7 - 1px),
        rgba(148, 163, 184, 0.14) calc(100% / 7)
      );
      color: #64748b;
      transition: transform 200ms cubic-bezier(.2, .8, .2, 1),
                  box-shadow 260ms ease, color 220ms ease, background-color 200ms ease;
    }
    .box:nth-child(n+6) { grid-column: span 4; }   /* row 2: three boxes x 4 cols (child 1 is the tag) */
    .box:hover { color: #cbd5e1; background-color: #0c1626; }
    .box:focus-visible { outline: 2px solid var(--accent); outline-offset: -5px; }

    /* A one-tap box has nothing to divide into sevenths, so drop the level lines. */
    .box.single { background-image: none; }

    .box .fill {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 0;
      background: linear-gradient(to top, var(--fill-strong), var(--fill-soft));
      border-top: 1px solid var(--fill-line);
      transition: height 340ms cubic-bezier(.2, .8, .2, 1), border-color 240ms ease;
      pointer-events: none;
    }

    .box .badge,
    .box .name,
    .box .sub,
    .box .icon,
    .box .count { position: relative; z-index: 1; }

    /* Body has no Arabic line, so the exercise figure sits in that slot. Stroke-only
       and sized in vh, so it takes the box text colour and stays sharp at 2x on hover. */
    .box .icon {
      display: block;
      flex: 0 0 auto;
      width: clamp(24px, 6vh, 46px);
      height: clamp(24px, 6vh, 46px);
      color: #8296ae;
      transition: color 220ms ease;
    }
    .box .icon svg { display: block; width: 100%; height: 100%; }
    /* Life boxes keep their Arabic line, so the symbol sits smaller there than the
       Body figures do, which have the slot to themselves. */
    .box .icon.icon-sm { width: clamp(18px, 4.2vh, 32px); height: clamp(18px, 4.2vh, 32px); }

    .box .badge {
      position: absolute;
      top: 0.45rem;
      left: 0.55rem;
      font-size: clamp(0.5rem, 1.1vh, 0.65rem);
      font-weight: 700;
      letter-spacing: 0.12em;
      color: rgba(148, 163, 184, 0.55);
    }
    .box .name {
      font-size: clamp(0.62rem, 1.8vh, 1.05rem);
      font-weight: 700;
      line-height: 1.15;
      color: #e2e8f0;
      letter-spacing: -0.01em;
    }
    .box .sub {
      font-family: 'Amiri', 'Segoe UI', serif;
      font-size: clamp(0.7rem, 2.1vh, 1.25rem);
      line-height: 1.45;
      color: #94a3b8;
      max-width: 96%;
    }
    .box .count {
      margin-top: 0.15rem;
      font-size: clamp(0.5rem, 1.15vh, 0.7rem);
      font-weight: 700;
      letter-spacing: 0.1em;
      color: #475569;
      font-variant-numeric: tabular-nums;
    }

    .box.started .name { color: #f8fafc; }
    .box.started .sub { color: #cbd5e1; }
    .box.started .icon { color: #cbd5e1; }
    .box.started .count { color: #cbd5e1; }

    .box.full {
      box-shadow: inset 0 0 0 1px var(--fill-line), inset 0 0 60px rgba(255, 255, 255, 0.10);
    }
    .box.full .name, .box.full .sub { color: #fff; text-shadow: 0 1px 10px rgba(0, 0, 0, 0.45); }
    .box.full .icon { color: #fff; }
    .box.full .count { color: var(--accent); }
    .box.full .badge { color: rgba(255, 255, 255, 0.7); }

    /* ---- Hover pop: the box doubles in place so it can be read before it is tapped ----
       transform-origin is pinned per position rather than left at centre. A box is half
       a quadrant tall and a quarter (row 1) or a third (row 2) of it wide, so at 2x it
       lands exactly inside its own quadrant when anchored to the edge it already sits on.
       Centre-origin would push the corner boxes off the viewport instead.
       Mouse only: touch has no hover, and :hover sticks after a tap there. */
    .box:nth-child(-n+5) { transform-origin: top center; }
    .box:nth-child(n+6)  { transform-origin: bottom center; }
    .box:nth-child(2)    { transform-origin: top left; }
    .box:nth-child(5)    { transform-origin: top right; }
    .box:nth-child(6)    { transform-origin: bottom left; }
    .box:nth-child(8)    { transform-origin: bottom right; }

    @media (hover: hover) and (pointer: fine) {
      .box:hover,
      .box:focus-visible {
        transform: scale(2);
        z-index: 10;
        border-radius: 5px;
        box-shadow: 0 0 0 1px var(--accent), 0 8px 22px rgba(0, 0, 0, 0.72);
      }
      /* The box is opaque, so an enlarged one hides the neighbours it covers.
         What you see under the pointer is always what a click will hit. */
    }

    /* ---- Floating status pill: sits over the board, never takes a box ---- */
    /* Corner-anchored: dead centre sat on the point where all four groups meet
       and stole taps from four boxes at once. */
    #hud {
      position: fixed;
      bottom: 0.85rem;
      right: 0.85rem;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.4rem 0.4rem 0.4rem 0.9rem;
      border-radius: 9999px;
      background: rgba(2, 6, 23, 0.86);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 10px 34px rgba(0, 0, 0, 0.65);
      font-size: 0.74rem;
      white-space: nowrap;
    }
    #hud .count { font-weight: 700; color: #10b981; font-variant-numeric: tabular-nums; }
    #hud a, #hud button {
      color: #94a3b8;
      background: rgba(148, 163, 184, 0.10);
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: 9999px;
      padding: 0.25rem 0.65rem;
      font-size: 0.66rem;
      font-weight: 600;
      font-family: inherit;
      text-decoration: none;
      cursor: pointer;
      transition: color 0.2s, background 0.2s;
    }
    #hud a:hover, #hud button:hover { color: #fff; background: rgba(148, 163, 184, 0.22); }

    @media (max-width: 900px) {
      #lifeTrackApp { grid-template-columns: 1fr; grid-template-rows: repeat(4, 1fr); gap: 5px; padding: 5px; }
      .quad { border-width: 4px; }
      #hud { bottom: 0.6rem; right: 0.6rem; }
    }
    @media (max-width: 520px) {
      .box { padding: 1.25rem 0.25rem 0.35rem; }
      .box .sub { display: none; }
      /* The figure survives where the Arabic line does not: on a small screen it
         identifies the exercise faster than the name does. */
      .box .icon { width: clamp(20px, 4.6vh, 30px); height: clamp(20px, 4.6vh, 30px); }
      .box .icon.icon-sm { width: clamp(16px, 3.6vh, 24px); height: clamp(16px, 3.6vh, 24px); }
      .box .name { font-size: clamp(0.55rem, 1.5vh, 0.8rem); }
    }
  </style>
</head>
<body>

<!-- LOGIN OVERLAY (do not modify — shared site-wide access gate, see CLAUDE.md) -->
<div id="loginView" style="position:fixed;inset:0;z-index:9999;background:#030712;display:flex;align-items:center;justify-content:center;padding:1rem">
  <div style="width:100%;max-width:360px;background:rgba(15,23,42,0.95);border:1px solid rgba(255,255,255,0.08);border-radius:1.25rem;padding:2rem;box-shadow:0 25px 50px -12px rgba(0,0,0,0.8)">
    <div style="text-align:center;margin-bottom:1.5rem">
      <div style="width:3.5rem;height:3.5rem;background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.3);border-radius:9999px;display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;font-size:1.5rem">🔒</div>
      <h2 style="color:white;font-size:1.25rem;font-weight:700;margin:0 0 0.25rem">Secure Access</h2>
      <p style="color:#64748b;font-size:0.7rem;text-transform:uppercase;letter-spacing:0.1em;margin:0">Private App</p>
    </div>
    <div style="display:flex;flex-direction:column;gap:1rem">
      <div>
        <label style="display:block;color:#94a3b8;font-size:0.7rem;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:0.4rem">Username</label>
        <input type="text" id="loginUsername" placeholder="Enter username" autocomplete="username"
          style="width:100%;background:#1e293b;border:1px solid #334155;color:white;border-radius:0.75rem;padding:0.75rem 1rem;font-size:0.875rem;outline:none;box-sizing:border-box;transition:border-color 0.2s"
          onfocus="this.style.borderColor='#10b981'" onblur="this.style.borderColor='#334155'">
      </div>
      <div>
        <label style="display:block;color:#94a3b8;font-size:0.7rem;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:0.4rem">Password</label>
        <input type="password" id="loginPassword" placeholder="Enter password" autocomplete="current-password"
          style="width:100%;background:#1e293b;border:1px solid #334155;color:white;border-radius:0.75rem;padding:0.75rem 1rem;font-size:0.875rem;outline:none;box-sizing:border-box;transition:border-color 0.2s"
          onfocus="this.style.borderColor='#10b981'" onblur="this.style.borderColor='#334155'"
          onkeydown="if(event.key==='Enter')_login()">
      </div>
      <button onclick="_login()"
        style="width:100%;background:#059669;color:white;font-weight:700;padding:0.75rem 1rem;border-radius:0.75rem;border:none;cursor:pointer;font-size:0.875rem;transition:background 0.2s;margin-top:0.25rem"
        onmouseover="this.style.background='#10b981'" onmouseout="this.style.background='#059669'">
        Unlock
      </button>
      <p id="loginError" style="display:none;text-align:center;color:#f87171;font-size:0.75rem;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.2);border-radius:0.5rem;padding:0.5rem;margin:0">
        Incorrect credentials. Try again.
      </p>
    </div>
  </div>
</div>

<main id="lifeTrackApp" aria-label="Life Track board"></main>

<div id="hud">
  <span><strong style="color:#fff">Life Track</strong></span>
  <span><span class="count" id="hudCount">0</span><span style="color:#64748b">/28</span></span>
  <button id="hudReset" type="button" title="Empty every box">Reset</button>
  <a href="../../links/">&larr; Hub</a>
</div>

<script>
// === App logic ===
(function () {
  var STORE_KEY = 'life-track.v3';
  var DEFAULT_TARGET = 7;       // taps to fill one box, where a group does not say otherwise
  var PER_GROUP = 7;            // boxes per group, in every group

  // Exercise figures, one per Body box. Drawn on a 48x48 grid as stroke-only line art
  // so they inherit the box text colour and stay sharp when a box doubles on hover.
  // Each is read from its context rather than the stick figure alone: a bar overhead
  // means you hang from it, a line underfoot means you press against the floor, a wall
  // at the side means you lean on it, and two short bars mean you hold yourself between
  // them. That is what keeps the three floor positions apart at this size.
  var SVG_OPEN = '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" ' +
                 'stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">';
  // Floor, bar and wall are drawn thinner and dimmer than the body. Without that the
  // figure and its surroundings carry equal weight and a push-up reads as a triangle.
  function env(d) {
    return '<path d="' + d + '" stroke-width="1.5" stroke-opacity="0.5"/>';
  }
  function head(x, y, r) {
    return '<circle cx="' + x + '" cy="' + y + '" r="' + (r || 3.2) +
           '" fill="currentColor" stroke="none"/>';
  }

  var ICONS = {
    // ---- Life. Objects and symbols rather than figures, because these are ideas
    // rather than movements. Quran and Dhikr get none: the Arabic already names them,
    // and there is no honest picture of a surah or of a phrase of remembrance.
    allah: SVG_OPEN + env('M8 41h32') +
      '<path d="M13 41V25C13 16 18 10 24 8C30 10 35 16 35 25v16"/></svg>',

    // Two adults set wide with the child low between them. They must not touch:
    // heads are filled and shoulders are stroked in the same colour, so any overlap
    // merges into one blob rather than reading as three people.
    family: SVG_OPEN +
      head(11, 16, 3.8) + '<path d="M4.5 33a6.5 6.5 0 0 1 13 0"/>' +
      head(37, 16, 3.8) + '<path d="M30.5 33a6.5 6.5 0 0 1 13 0"/>' +
      head(24, 29, 3.2) + '<path d="M18.5 43a5.5 5.5 0 0 1 11 0"/></svg>',

    profession: SVG_OPEN +
      '<rect x="6" y="17" width="36" height="21" rx="3"/>' +
      '<path d="M18 17v-3a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v3"/>' +
      env('M6 26h36') + '</svg>',

    independence: SVG_OPEN +
      '<circle cx="14" cy="24" r="7"/><path d="M21 24h20"/>' +
      '<path d="M34 24v5"/><path d="M39 24v5"/></svg>',

    social: SVG_OPEN +
      '<path d="M15 15h18"/><path d="M14 19l8 13"/><path d="M34 19l-8 13"/>' +
      head(12, 15, 3.6) + head(36, 15, 3.6) + head(24, 35, 3.6) + '</svg>',

    health: SVG_OPEN +
      '<path d="M41.68 9.22a11 11 0 0 0-15.56 0L24 11.34l-2.12-2.12a11 11 0 0 0-15.56 ' +
      '15.56l2.12 2.12L24 42.46l15.56-15.56 2.12-2.12a11 11 0 0 0 0-15.56z"/>' +
      '<path d="M12 24h5l2.5-5L24 29l2.5-5h9"/></svg>',

    finance: SVG_OPEN +
      '<ellipse cx="24" cy="13" rx="13" ry="5"/>' +
      '<path d="M11 13v18c0 2.8 5.8 5 13 5s13-2.2 13-5V13"/>' +
      env('M11 22c0 2.8 5.8 5 13 5s13-2.2 13-5') + '</svg>',

    // ---- Body
    // Hanging from a bar, arms pulling the chin up to it.
    pullup: SVG_OPEN + env('M6 8h36') +
      '<path d="M17 9l5 12"/><path d="M31 9l-5 12"/>' + head(24, 15) +
      '<path d="M24 18v13"/><path d="M24 31l-4 9"/><path d="M24 31l4 9"/></svg>',

    // Face down, body straight, arm locked out to the floor. The neck stub matters:
    // without it the head floats free and the whole figure collapses into a triangle.
    pushup: SVG_OPEN + env('M4 41h40') + head(12, 23) +
      '<path d="M15 24.5L18 26"/><path d="M18 26l11 4.5L40 35"/>' +
      '<path d="M18 26l-1 14"/><path d="M40 35l3 4"/></svg>',

    // Same body line as the push-up, but the arm folds onto the floor at the elbow.
    plank: SVG_OPEN + env('M4 41h40') + head(12, 23) +
      '<path d="M15 24.5L18 26"/><path d="M18 26l11 4.5L40 35"/>' +
      '<path d="M18 26v11l-9 3"/><path d="M40 35l3 4"/></svg>',

    // Free standing, so no wall: the torso leans forward over a horizontal thigh
    // and the arms swing out front to counterbalance.
    squat: SVG_OPEN + env('M5 41h38') + head(18, 10) +
      '<path d="M19 13l4 12"/><path d="M21 18l12-2"/>' +
      '<path d="M23 25h10"/><path d="M33 26l-1 14"/><path d="M32 40h5"/></svg>',

    // The wall is the whole point, so it is what the eye should catch first: back
    // flat against it, torso vertical rather than leaning.
    wallsit: SVG_OPEN + env('M7 5v36') + env('M7 41h36') + head(13, 12) +
      '<path d="M13 15v12"/><path d="M13 19l9 2"/>' +
      '<path d="M13 27h14"/><path d="M27 27v13"/><path d="M27 40h5"/></svg>',

    // Held between two bars with nothing underfoot. The missing floor is the tell.
    dips: SVG_OPEN + env('M4 26h13') + env('M31 26h13') + head(24, 12) +
      '<path d="M19 18h10"/><path d="M19 18l-4 7"/><path d="M29 18l4 7"/>' +
      '<path d="M24 15v12"/><path d="M24 27l-3 12"/><path d="M24 27l3 12"/></svg>',

    // Face up beneath a bar, heels on the floor. Mirrored so it never reads as a
    // push-up: here the body runs down to the left and the arm reaches up.
    invrow: SVG_OPEN + env('M5 9h38') + env('M5 41h38') + head(36, 24) +
      '<path d="M33 25.5L31 26.8"/><path d="M31 27l-11 6L9 39"/>' +
      '<path d="M31 27l-4-17"/><path d="M9 39l-3 2"/></svg>'
  };

  // How many taps a box takes is a property of the group, not of the board. Life and
  // Quran are done or not done, so one tap settles them. Body and Dhikr are counted in
  // rounds, so they keep seven. Older saves are clamped, never migrated.
  var GROUPS = [
    {
      id: 'life',
      title: 'Life',
      target: 1,
      accent: '16, 185, 129',                                  // emerald
      boxes: [
        { key: 'allah',        badge: 'A', name: 'Allah',        sub: 'الصلاة' },
        { key: 'family',       badge: 'FA', name: 'Family',      sub: 'الأهل' },
        { key: 'profession',   badge: 'P', name: 'Profession',   sub: 'العمل' },
        { key: 'independence', badge: 'I', name: 'Independence', sub: 'الاستقلال' },
        { key: 'social',       badge: 'S', name: 'Social',       sub: 'الصلة' },
        { key: 'health',       badge: 'H', name: 'Health',       sub: 'الصحة' },
        { key: 'finance',      badge: 'FI', name: 'Finance',     sub: 'المال' }
      ]
    },
    {
      id: 'quran',
      title: 'Quran',
      target: 1,
      accent: '251, 191, 36',                                   // gold
      boxes: [
        { key: 'yaseen',  badge: '36', name: 'Yaseen',     sub: 'يس' },
        { key: 'dukhan',  badge: '44', name: 'Ad-Dukhan',  sub: 'الدخان' },
        { key: 'qaf',     badge: '50', name: 'Qaf',        sub: 'ق' },
        { key: 'qamar',   badge: '54', name: 'Al-Qamar',   sub: 'القمر' },
        { key: 'rahman',  badge: '55', name: 'Ar-Rahman',  sub: 'الرحمن' },
        { key: 'waqiah',  badge: '56', name: 'Al-Waqi‘ah', sub: 'الواقعة' },
        { key: 'mulk',    badge: '67', name: 'Al-Mulk',    sub: 'تبارك' }
      ]
    },
    {
      id: 'body',
      title: 'Body',
      target: 7,
      accent: '96, 165, 250',                                   // sky
      boxes: [
        { key: 'pullup',   badge: 'P1', name: 'Pull-up',      sub: '' },
        { key: 'pushup',   badge: 'P2', name: 'Push-up',      sub: '' },
        { key: 'plank',    badge: 'P3', name: 'Plank',        sub: '' },
        { key: 'squat',    badge: 'S1', name: 'Squat',        sub: '' },
        { key: 'wallsit',  badge: 'S2', name: 'Wall Sit',     sub: '' },
        { key: 'dips',     badge: 'D',  name: 'Dips',         sub: '' },
        { key: 'invrow',   badge: 'I',  name: 'Inverted Row', sub: '' }
      ]
    },
    {
      id: 'dhikr',
      title: 'Dhikr',
      target: 7,
      accent: '167, 139, 250',                                  // violet
      boxes: [
        { key: 'tasbih',    badge: '1', name: 'Tasbih',        sub: 'سبحان الله' },
        { key: 'hamd',      badge: '2', name: 'Hamd',          sub: 'الحمد لله' },
        { key: 'tahlil',    badge: '3', name: 'Tahlil',        sub: 'لا إله إلا الله' },
        { key: 'maghfira',  badge: '4', name: 'Maghfira',      sub: 'اللهم اغفر لي وارحمني وعافني وارزقني' },
        { key: 'faqr',      badge: '5', name: 'Faqr &amp; Kufr',   sub: 'اللهم إني أعوذ بك من الفقر والكفر' },
        { key: 'nar',       badge: '6', name: 'An-Nar',        sub: 'اللهم إني أعوذ بك من النار' },
        { key: 'hasbuna',   badge: '7', name: 'Hasbunallah',   sub: 'حسبنا الله ونعم الوكيل' }
      ]
    }
  ];

  function today() {
    var d = new Date();
    return d.getFullYear() + '-' +
           ('0' + (d.getMonth() + 1)).slice(-2) + '-' +
           ('0' + d.getDate()).slice(-2);
  }

  // Stored with the day it belongs to: the board survives closing the browser
  // but empties itself at midnight, which is the boundary a day board cares about.
  function load() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return {};
      var parsed = JSON.parse(raw);
      if (!parsed || parsed.date !== today()) return {};
      return parsed.counts || {};
    } catch (e) {
      return {};
    }
  }

  function save() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({ date: today(), counts: state }));
    } catch (e) { /* private mode — board still works, it just won't persist */ }
  }

  var state = load();
  var board = document.getElementById('lifeTrackApp');
  var hudCount = document.getElementById('hudCount');

  function targetOf(box) {
    return box.target || DEFAULT_TARGET;
  }

  function countOf(box) {
    var n = state[box.key];
    return (typeof n === 'number' && n > 0) ? Math.min(n, targetOf(box)) : 0;
  }

  function isFull(box) {
    return countOf(box) === targetOf(box);
  }

  function paint(box) {
    var t = targetOf(box);
    var n = countOf(box);
    box.el.querySelector('.fill').style.height = (n / t * 100) + '%';
    box.el.querySelector('.count').textContent = n + '/' + t;
    box.el.classList.toggle('started', n > 0);
    box.el.classList.toggle('full', n === t);
    box.el.setAttribute('aria-valuenow', n);
  }

  function paintGroup(group) {
    var done = group.boxes.filter(isFull).length;
    group.scoreEl.textContent = done + '/' + PER_GROUP;
  }

  function paintTotal() {
    var done = 0;
    GROUPS.forEach(function (g) {
      g.boxes.forEach(function (b) { if (isFull(b)) done++; });
    });
    hudCount.textContent = done;
  }

  // A tap adds one. A tap on a full box empties it. Shift-tap steps back one.
  // Where the target is 1 that makes the box a straight on/off toggle.
  function bump(box, group, back) {
    var t = targetOf(box);
    var n = countOf(box);
    if (back) n = Math.max(0, n - 1);
    else n = (n >= t) ? 0 : n + 1;

    if (n === 0) delete state[box.key];
    else state[box.key] = n;

    save();
    paint(box);
    paintGroup(group);
    paintTotal();
  }

  GROUPS.forEach(function (group) {
    group.target = group.target || DEFAULT_TARGET;

    var quad = document.createElement('section');
    quad.className = 'quad';
    quad.style.setProperty('--accent', 'rgb(' + group.accent + ')');
    quad.style.setProperty('--fill-strong', 'rgba(' + group.accent + ', 0.82)');
    quad.style.setProperty('--fill-soft', 'rgba(' + group.accent + ', 0.30)');
    quad.style.setProperty('--fill-line', 'rgba(' + group.accent + ', 0.85)');
    quad.style.setProperty('--fill-glow', 'rgba(' + group.accent + ', 0.35)');
    quad.style.setProperty('--quad-line', 'rgba(' + group.accent + ', 0.55)');
    quad.style.setProperty('--quad-halo', 'rgba(' + group.accent + ', 0.16)');
    quad.setAttribute('aria-label', group.title);

    var tag = document.createElement('div');
    tag.className = 'quad-tag';
    // The tag says what one box costs, so the two one-tap groups read differently
    // from the two seven-round ones without anyone having to click to find out.
    tag.innerHTML = group.title + ' &middot; ' +
                    (group.target === 1 ? 'once' : group.target + ' rounds') +
                    ' <span class="quad-score">0/' + PER_GROUP + '</span>';
    quad.appendChild(tag);
    group.scoreEl = tag.querySelector('.quad-score');

    group.boxes.forEach(function (box) {
      box.target = group.target;

      var el = document.createElement('button');
      el.type = 'button';
      el.className = 'box' + (group.target === 1 ? ' single' : '');
      el.setAttribute('role', 'progressbar');
      el.setAttribute('aria-valuemin', '0');
      el.setAttribute('aria-valuemax', String(group.target));
      el.setAttribute('aria-label', group.title + ' — ' + box.name);
      el.innerHTML =
        '<span class="fill"></span>' +
        '<span class="badge">' + box.badge + '</span>' +
        '<span class="name">' + box.name + '</span>' +
        (ICONS[box.key]
          ? '<span class="icon' + (box.sub ? ' icon-sm' : '') + '" aria-hidden="true">' +
            ICONS[box.key] + '</span>'
          : '') +
        (box.sub ? '<span class="sub">' + box.sub + '</span>' : '') +
        '<span class="count">0/' + group.target + '</span>';
      el.addEventListener('click', function (e) { bump(box, group, e.shiftKey); });
      box.el = el;
      quad.appendChild(el);
      paint(box);
    });

    paintGroup(group);
    board.appendChild(quad);
  });

  function repaintAll() {
    GROUPS.forEach(function (g) {
      g.boxes.forEach(paint);
      paintGroup(g);
    });
    paintTotal();
  }

  document.getElementById('hudReset').addEventListener('click', function () {
    state = {};
    save();
    repaintAll();
  });

  // A tab left open overnight should come back to a fresh board, not yesterday's.
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) return;
    var fresh = load();
    if (JSON.stringify(fresh) !== JSON.stringify(state)) {
      state = fresh;
      repaintAll();
    }
  });

  paintTotal();
})();
</script>

<script>
// Shared login gate — do not modify.
function _login() {
  var u = document.getElementById('loginUsername').value;
  var p = document.getElementById('loginPassword').value;
  if (u.toLowerCase() === 'ibrahim' && p === 'ibrahimwin') {
    document.getElementById('loginView').style.display = 'none';
  } else {
    var err = document.getElementById('loginError');
    err.style.display = 'block';
    var inputs = [document.getElementById('loginUsername'), document.getElementById('loginPassword')];
    inputs.forEach(function(el) {
      el.style.borderColor = '#ef4444';
      setTimeout(function() { el.style.borderColor = '#334155'; }, 1000);
    });
  }
}
document.getElementById('loginUsername').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') _login();
});
</script>
</body>
